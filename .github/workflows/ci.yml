name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: mypy src/capability_commons/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      # [ingest] extras don't install cleanly on Python 3.14 yet: polars has
      # no compiled runtime for 3.14 at all (confirmed via polars-runtime-32's
      # own PyPI classifiers, which list only 3.10-3.13), and marker-pdf's
      # own dependency tree (Pillow) fails to build a wheel here too. Real
      # ingest work uses a separate Python 3.13 environment (.venv-ingest/
      # locally) -- see STATUS.md's Tests section. Ignoring the 4 files that
      # import ingest-only deps at module load time, not deselecting
      # individual tests, since the whole environment can't support them.
      # test_health / test_retrieval_allows_anonymous_access instantiate the
      # FastAPI app via TestClient, which runs its startup lifespan
      # (migration/DB connectivity check) -- they need a real Postgres, so
      # they run in the `integration` job below instead (which provisions
      # one), not here. Deselected rather than silently passing by accident.
      - run: >
          pytest tests/ --ignore=tests/test_integration.py --ignore=tests/test_integration_audit.py --ignore=tests/test_integration_storage.py --ignore=tests/test_integration_embedding.py --ignore=tests/test_integration_publication.py --ignore=tests/test_integration_search.py --ignore=tests/test_integration_retrieval.py --ignore=tests/test_integration_seed.py
          --ignore=tests/test_ingest_draft_schema.py
          --ignore=tests/test_ingest_llm_client.py
          --ignore=tests/test_ingest_passes.py
          --ignore=tests/test_ingest_publish_gate.py
          --deselect tests/test_health.py::test_health
          --deselect tests/test_smoke_api.py::test_retrieval_allows_anonymous_access
          -v

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capability_commons
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/capability_commons
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: >
          pytest tests/test_integration.py tests/test_integration_audit.py tests/test_integration_storage.py tests/test_integration_embedding.py tests/test_integration_publication.py tests/test_integration_search.py tests/test_integration_retrieval.py tests/test_integration_seed.py
          -v
      # test_health / test_retrieval_allows_anonymous_access instantiate the
      # FastAPI app via TestClient, which runs its startup lifespan -- they
      # need a real Postgres, hence running here rather than in the DB-less
      # `test` job. Each runs as its OWN pytest invocation (not combined with
      # each other, or with the tests above): the app's async DB engine is a
      # process-wide singleton whose connection pool binds to whichever event
      # loop was active on its first TestClient-triggered startup. A second
      # TestClient(app) instantiation in the SAME pytest process reuses that
      # pool under a different loop and crashes with "Future ... attached to
      # a different loop" -- confirmed deterministic (not load-related) by
      # reproducing it locally in <1s with zero contention, order-independent
      # (whichever of these two runs second fails), and unrelated to
      # test_integration*.py (still fails with only these two combined).
      # Separate processes each get a fresh engine/loop, so this sidesteps it;
      # the actual fix belongs in the app's engine lifecycle, not here.
      - run: pytest tests/test_health.py::test_health -v
      - run: pytest tests/test_smoke_api.py::test_retrieval_allows_anonymous_access -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t capability-commons .

  eval:
    runs-on: ubuntu-latest
    # Informational only, not a merge gate -- eval/README.md itself says the
    # harness is "suitable for CI gating once we trust the gold set," and we
    # don't yet: eval/gold/queries.yaml has entries referencing slugs that
    # don't exist anywhere in the corpus (see TODO.md). `continue-on-error`
    # below means a low/failing score never blocks a PR; the report is
    # uploaded as a build artifact to track the trend over time instead.
    #
    # Every step is gated on OPENAI_API_KEY being configured as a repo
    # secret. Without it the job is a fast no-op (green, nothing runs):
    # seeding + embedding the corpus costs real OpenAI API spend on every
    # single push/PR, and that's a cost decision for whoever owns this
    # repo's billing, not something to turn on unilaterally. Add the secret
    # in the repo's Actions settings to opt in.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capability_commons
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/capability_commons
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ env.OPENAI_API_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - if: ${{ env.OPENAI_API_KEY != '' }}
        run: pip install -e ".[dev]"
      - if: ${{ env.OPENAI_API_KEY != '' }}
        run: alembic upgrade head
      - if: ${{ env.OPENAI_API_KEY != '' }}
        name: Seed corpus
        run: |
          python -m capability_commons.cli.seed --data-dir expanded_seed
          python -m capability_commons.cli.seed --data-dir capability_commons_module_seed_pack_v1
      - if: ${{ env.OPENAI_API_KEY != '' }}
        name: Start API + worker, drain embeddings
        run: |
          uvicorn capability_commons.main:app --host 127.0.0.1 --port 8100 &
          python -m capability_commons.cli.worker &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8100/health && break; sleep 1; done
          sleep 20  # let the worker drain the outbox (embeddings) before querying
      - if: ${{ env.OPENAI_API_KEY != '' }}
        name: Run eval (informational)
        continue-on-error: true
        run: |
          mkdir -p eval/reports
          python -m capability_commons.cli.eval run --gold eval/gold/queries.yaml --api http://127.0.0.1:8100 --out eval/reports/ci-run.md
      - if: ${{ env.OPENAI_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/ci-run.md
          if-no-files-found: ignore
