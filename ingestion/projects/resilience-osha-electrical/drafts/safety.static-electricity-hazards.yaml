summary_short: Explains the dangers of static electricity, including shocks and explosions.
summary_medium: Static electricity can cause shocks and potentially lead to explosions
  when discharged near flammable substances. Grounding and preventive measures are
  essential.
plain_language: Static electricity can build up on objects and cause shocks. In some
  cases, it can lead to explosions if it discharges near flammable substances. Grounding
  can help prevent these dangers.
markdown_body: '## What this is

  Static electricity is an electrical charge that can build up on the surface of an
  object. It can cause shocks and, in certain conditions, lead to explosions.


  ## Why it matters

  While a static shock is often harmless, static electricity can discharge in environments
  with flammable substances, potentially causing explosions. Understanding and controlling
  static electricity is crucial for safety.


  ## What you need

  To manage static electricity, grounding equipment and awareness of the materials
  and conditions that contribute to static buildup are necessary.


  ## How to do it

  Identify areas where static electricity is likely to build up, such as where plastic
  pipes or rubberized belts are used. Implement grounding measures to prevent static
  discharge.


  ## Common failure modes

  Failure to properly ground equipment can lead to static discharge, which may cause
  explosions if flammable substances are present.


  ## Safety/boundary notes

  Ensure all equipment is properly grounded to prevent static discharge.


  ## Local adaptation notes

  Consider variations in humidity levels and the types of materials handled, as these
  can affect static electricity buildup.'
