bundle_overrides:
  hook: Understanding electrical safety can save lives and prevent costly accidents
    in the workplace.
  primer: Electrical hazards are a significant risk in many workplaces, and proper
    training is essential to ensure employee safety. This training guide focuses on
    key practices such as deenergizing equipment, using lockout/tagout procedures,
    wearing appropriate insulating gear, and maintaining safe distances from energized
    parts. Deenergizing equipment involves turning off and ensuring no electrical
    energy is present before maintenance. Lockout/tagout procedures are crucial to
    keep equipment deenergized, preventing accidental re-energization. Insulating
    protective gear, such as gloves and helmets, helps protect against electrical
    shocks. Maintaining a safe distance from live parts reduces the risk of accidental
    contact. By following these practices, employees can significantly reduce the
    risk of electrical accidents.
  guide: "1. **Deenergize Equipment**: Before performing any maintenance, ensure that\
    \ all equipment is turned off and deenergized. This means disconnecting the power\
    \ source and verifying that no electrical energy is present. \n\n2. **Lockout/Tagout\
    \ Procedures**: Use lockout and tagout devices to ensure that equipment remains\
    \ deenergized during maintenance. This involves placing a lock on the power source\
    \ and attaching a tag indicating that the equipment should not be operated. \n\
    \n3. **Use Insulating Protective Equipment**: Wear appropriate insulating gear,\
    \ such as rubber gloves, helmets, and protective clothing, to protect against\
    \ electrical shocks. This equipment acts as a barrier between you and the electrical\
    \ current. \n\n4. **Maintain Safe Distances**: Keep a safe distance from any energized\
    \ parts to avoid accidental contact. This is especially important when working\
    \ in confined spaces or near high-voltage equipment. \n\nBy following these steps,\
    \ employees can work safely around electrical equipment and minimize the risk\
    \ of accidents."
