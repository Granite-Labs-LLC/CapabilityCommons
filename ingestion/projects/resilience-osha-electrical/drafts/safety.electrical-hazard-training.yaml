plain_language: This guide helps train employees to safely handle electrical equipment
  by teaching them to deenergize equipment, use lockout/tagout procedures, wear insulating
  protective gear, and keep a safe distance from live parts.
markdown_body: '## What this is

  This is a training guide for employees to ensure they understand and can implement
  electrical safety procedures effectively.


  ## Why it matters

  Proper training in electrical safety is crucial to prevent accidents and injuries
  in the workplace. Understanding and applying these procedures can save lives and
  prevent damage to equipment.


  ## What you need

  - Insulating protective equipment

  - Lockout/tagout devices


  ## How to do it

  1. **Deenergize Equipment**: Ensure all equipment is turned off and deenergized
  before maintenance.

  2. **Lockout/Tagout Procedures**: Use lockout and tagout devices to ensure equipment
  remains deenergized during maintenance.

  3. **Use Insulating Protective Equipment**: Wear appropriate insulating gear to
  protect against electrical shocks.

  4. **Maintain Safe Distances**: Keep a safe distance from any energized parts to
  avoid accidental contact.


  ## Common failure modes

  - Failing to deenergize equipment before maintenance.

  - Improper use of lockout/tagout procedures.

  - Inadequate use of protective equipment.

  - Insufficient distance maintained from energized parts.


  ## Safety/boundary notes

  Ensure all equipment is deenergized and proper lockout/tagout procedures are followed
  to maintain safety.


  ## Local adaptation notes

  Adapt training to specific job roles and consider local electrical safety regulations.'
