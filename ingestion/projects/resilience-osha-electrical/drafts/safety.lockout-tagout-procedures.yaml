summary_medium: Guidelines for implementing lockout/tagout procedures to prevent accidental
  or unexpected startup of electrical equipment, ensuring it is deenergized before
  repair or inspection.
plain_language: Learn how to use lockout/tagout procedures to safely deenergize electrical
  equipment before repairs or inspections, preventing accidental startups.
markdown_body: '## What this is

  Lockout/tagout procedures are safety measures used to ensure that electrical equipment
  is completely deenergized before any repair or inspection work is performed. This
  prevents accidental or unexpected equipment startup, which can lead to serious injuries.


  ## Why it matters

  Accidental startup of electrical equipment can cause electrocution or shock. Proper
  lockout/tagout procedures are essential to protect workers from these hazards and
  are required by OSHA standards for both general industry and construction.


  ## What you need

  - Padlocks

  - Tags

  - Individual lock and key for each authorized worker


  ## How to do it

  1. Turn off the current at the switch box.

  2. Padlock the switch in the OFF position.

  3. Tag the switch or controls to indicate the equipment is locked out.

  4. Ensure each maintenance worker uses an individual lock and key.

  5. Only qualified electricians should perform these procedures.


  ## Common failure modes

  - Accidental startup due to improper lockout/tagout.

  - Electrocution or shock from unexpected equipment activation.


  ## Safety/boundary notes

  - Only qualified electricians should maintain equipment.

  - No two locks should match; each key should fit only one lock.


  ## Local adaptation notes

  - Specific lockout/tagout procedures may vary across different industries.'
