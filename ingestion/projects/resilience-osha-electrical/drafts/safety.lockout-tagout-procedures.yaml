bundle_overrides:
  hook: Lockout/tagout procedures are crucial for preventing accidental electrical
    equipment startups, ensuring worker safety and compliance with OSHA standards.
  primer: Lockout/tagout procedures are essential safety measures designed to prevent
    the accidental or unexpected startup of electrical equipment during maintenance
    or inspection. These procedures ensure that equipment is completely deenergized,
    thereby protecting workers from potential hazards such as electrocution or shock.
    The Occupational Safety and Health Administration (OSHA) mandates these procedures
    for both general industry and construction, highlighting their importance in maintaining
    workplace safety. The process involves turning off the electrical current at the
    switch box, padlocking the switch in the OFF position, and tagging the switch
    to indicate that the equipment is locked out. Each maintenance worker must use
    an individual lock and key, ensuring that no two locks match and each key fits
    only one lock. Only qualified electricians should perform these procedures to
    ensure they are executed correctly and safely. By following these steps, workplaces
    can significantly reduce the risk of electrical accidents, safeguarding both employees
    and equipment.
  guide: '1. **Turn Off the Current**: Before starting any maintenance or inspection
    work, ensure that the electrical current is turned off at the switch box. This
    is the first and most crucial step in the lockout/tagout process.


    2. **Padlock the Switch**: Once the current is turned off, padlock the switch
    in the OFF position. This prevents anyone from accidentally turning the power
    back on while work is being performed.


    3. **Tag the Switch**: Attach a tag to the switch or controls to clearly indicate
    that the equipment is locked out. This tag serves as a warning to others that
    the equipment should not be operated.


    4. **Use Individual Locks**: Each maintenance worker involved in the repair or
    inspection should use their own individual lock and key. This ensures that no
    two locks are the same and that each key fits only one lock, adding an extra layer
    of safety.


    5. **Qualified Personnel Only**: Ensure that only qualified electricians who have
    been trained in safe lockout procedures perform these tasks. This minimizes the
    risk of errors and enhances overall safety.


    6. **Verify Deenergization**: Before beginning work, double-check that the equipment
    is completely deenergized and that all safety measures are in place. This verification
    step is crucial to prevent accidents.'
  reference:
  - Turn off the current at the switch box.
  - Padlock the switch in the OFF position.
  - Tag the switch to indicate lockout.
  - Use individual locks and keys for each worker.
  - Only qualified electricians should perform lockout/tagout.
  - No two locks should match; each key should fit only one lock.
  worksheet:
  - Identify a piece of equipment in your workplace that requires lockout/tagout procedures.
  - List the steps you would take to ensure the equipment is safely deenergized.
  - Explain why it is important for each worker to use an individual lock and key.
  - Discuss the potential consequences of not following lockout/tagout procedures.
  - Role-play a scenario where you perform a lockout/tagout procedure, ensuring all
    steps are followed correctly.
