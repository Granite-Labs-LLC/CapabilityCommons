markdown_body: '## What this is

  This safety notice provides guidelines for protecting yourself when working near
  overhead power lines. It includes maintaining safe distances, grounding equipment,
  and other protective measures.


  ## Why it matters

  Working near overhead power lines poses significant risks, including accidental
  contact and equipment becoming energized. Following these guidelines helps prevent
  accidents and ensures safety.


  ## What you need

  - Awareness of power line locations

  - Knowledge of voltage levels

  - Equipment capable of maintaining safe distances


  ## How to do it

  1. Maintain a safe distance of at least 10 feet (3.05 meters) from overhead power
  lines if you are unqualified to work with electricity.

  2. For lines over 50,000 volts, increase the clearance by 4 inches (10 centimeters)
  for every additional 10,000 volts.

  3. Ground any equipment, such as cranes, that could become energized.

  4. Ensure power lines are deenergized and grounded by the owner/operator before
  working on them.

  5. Use guarding or insulating materials to prevent accidental contact.


  ## Common failure modes

  - Accidental contact with power lines

  - Equipment becoming energized


  ## Safety/boundary notes

  - Maintain a minimum distance of 10 feet for unqualified employees.

  - Adjust clearance based on voltage levels.


  ## Local adaptation notes

  - Consider local voltage levels and equipment reach when determining safe distances.'
