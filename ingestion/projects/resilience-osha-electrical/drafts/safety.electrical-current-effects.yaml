markdown_body: '## What this is

  This reference sheet explains how different levels of electric current affect the
  human body and the factors that influence the severity of electrical shocks. It
  provides a detailed look at the reactions and risks associated with exposure to
  various current levels.


  ## Why it matters

  Understanding the effects of electric current and shocks is crucial for safety in
  environments where electrical exposure is possible. Knowing the potential dangers
  can help prevent accidents and injuries.


  ## What you need

  No specific tools or materials are needed to understand this information, but awareness
  and caution are essential when working with electricity.


  ## How to do it

  Familiarize yourself with the effects of different current levels and factors:

  - **Amount of current**: Higher currents can cause more severe injuries.

  - **Path through the body**: The path affects which organs are impacted.

  - **Duration**: Longer exposure increases the risk of severe injury.

  - **Frequency**: Different frequencies can have varying effects on the body.


  ## Common failure modes

  - Involuntary muscle contractions

  - Respiratory arrest

  - Cardiac arrest


  ## Safety/boundary notes

  Avoid exposure to high currents and understand let-go thresholds to prevent severe
  injuries.


  ## Local adaptation notes

  Adapt safety measures to local electrical standards and practices.'
plain_language: Learn how different levels of electric current and factors like current
  path, duration, and frequency can affect the human body, from mild tingling to severe
  injury or death.
