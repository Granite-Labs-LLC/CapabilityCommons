structured_data:
  definition: The effects of electric current and shocks on the human body vary depending
    on the current level, path, duration, and frequency, ranging from mild tingling
    to severe injury or death.
  key_questions:
  - What are the effects of different levels of electric current on the human body?
  - How can exposure to electric current be safely managed?
  - What factors influence the severity of an electrical shock?
  - How does the path of current through the body affect the outcome?
  misconceptions:
  - All electric shocks are equally dangerous.
  - Only high voltage is dangerous, not current.
  - Only high voltage causes severe injuries.
  safety_boundary: 'Electricity can cause shock, electrocution, burns, fires, and
    explosions. This is safety awareness information, not training to work on electrical
    equipment: only qualified electricians trained in safe lockout procedures should
    maintain electrical equipment. If a person is "frozen" to a live electrical contact,
    shut off the current immediately. If you or someone else receives a shock, seek
    emergency medical help immediately. Before anyone works on electrical equipment
    it must be deenergized, with lockout and tag procedures used to keep it deenergized;
    ground-fault circuit interrupters (GFCIs) are used in wet locations.'
