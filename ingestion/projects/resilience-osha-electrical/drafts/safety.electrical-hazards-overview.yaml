markdown_body: '## What this is

  This concept note provides an overview of electrical hazards and the importance
  of understanding OSHA standards for electrical safety.


  ## Why it matters

  Electricity is essential in both personal and professional settings. However, it
  poses significant hazards if not handled properly. Understanding these hazards and
  adhering to OSHA standards can prevent accidents and ensure a safe working environment.


  ## What you need

  A basic understanding of electrical systems and awareness of OSHA standards related
  to electrical safety.


  ## How to do it

  Familiarize yourself with the types of electrical hazards, such as shocks, burns,
  and the effects of electricity on the body. Learn about the protective measures
  like insulation, grounding, and circuit protection devices. Follow OSHA guidelines
  to minimize risks.


  ## Common failure modes

  - Ignoring the potential hazards of electricity due to familiarity.

  - Failing to use proper protective equipment.

  - Not following established safety protocols.


  ## Safety/boundary notes

  Always treat electricity with respect and caution. Use appropriate personal protective
  equipment and follow OSHA standards to ensure safety.


  ## Local adaptation notes

  Consider local regulations and standards that may complement or differ from OSHA
  guidelines.'
