markdown_body: '## What this is

  This concept note explains how water, when containing impurities, can become a conductor
  of electricity. This increases the risk of electrical hazards in wet environments.


  ## Why it matters

  Understanding how water affects the flow of electricity is crucial for safety, especially
  in environments where electrical work is performed. Moisture can turn normally insulating
  materials into conductors, posing a significant risk.


  ## What you need

  Awareness of the conductivity of water and the potential risks associated with working
  in wet conditions.


  ## How to do it

  Exercise caution when working with electricity in damp or wet environments. Ensure
  that all electrical equipment is properly insulated and avoid contact with water.


  ## Common failure modes

  Increased conductivity due to moisture can lead to electrical shocks or equipment
  failure.


  ## Safety/boundary notes

  Avoid working with electricity in damp conditions to minimize the risk of electrical
  hazards.


  ## Local adaptation notes

  Consider local climate conditions and the prevalence of moisture when planning electrical
  work.'
