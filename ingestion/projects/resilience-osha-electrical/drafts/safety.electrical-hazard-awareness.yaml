plain_language: Learn why electrical hazards are a serious concern in the workplace
  and how awareness can prevent accidents.
markdown_body: '## What this is

  Electrical hazard awareness involves understanding the risks associated with electricity
  in the workplace, including electric shock, electrocution, burns, fires, and explosions.


  ## Why it matters

  Electricity is a significant workplace hazard. In 1999, 278 workers died from electrocutions,
  representing nearly 5% of all workplace fatalities. Many of these incidents could
  have been prevented with proper awareness and safety measures.


  ## What you need

  Awareness of the potential dangers and the importance of following safety protocols
  to prevent accidents.


  ## How to do it

  Educate yourself and others about the risks of electrical hazards. Implement safety
  measures and ensure compliance with safety standards to minimize risks.


  ## Common failure modes

  - Electric shock

  - Electrocution

  - Burns

  - Fires

  - Explosions


  ## Safety/boundary notes

  Always follow established safety protocols and guidelines to prevent accidents and
  injuries related to electrical hazards.


  ## Local adaptation notes

  Adapt safety measures and training programs to fit local regulations and workplace
  environments.'
structured_data:
  definition: Electrical hazard awareness is the understanding of risks associated
    with electricity in the workplace and the importance of safety measures to prevent
    accidents.
  key_questions:
  - What are the common electrical hazards in the workplace?
  - How can awareness prevent electrical accidents?
  - What safety measures should be implemented?
  misconceptions:
  - Electrical hazards are rare and not a significant concern.
  - Only electricians need to be aware of electrical hazards.
  safety_boundary: 'Electricity can cause shock, electrocution, burns, fires, and
    explosions. This is safety awareness information, not training to work on electrical
    equipment: only qualified electricians trained in safe lockout procedures should
    maintain electrical equipment. Before anyone works on electrical equipment it
    must be deenergized, with lockout and tag procedures used to keep it deenergized;
    ground-fault circuit interrupters (GFCIs) are used in wet locations.'
