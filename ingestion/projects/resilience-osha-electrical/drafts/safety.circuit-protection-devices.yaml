summary_medium: Circuit protection devices, such as fuses, circuit breakers, GFCIs,
  and arc-fault interrupters, automatically limit or stop current flow in the event
  of faults like ground faults, overloads, or short circuits.
plain_language: Circuit protection devices are safety tools that automatically stop
  electricity flow when there's a problem, like too much current or a fault. They
  help prevent fires and electric shocks.
markdown_body: '## What this is

  Circuit protection devices are safety mechanisms that automatically limit or stop
  the flow of electrical current in the event of a fault, such as a ground fault,
  overload, or short circuit.


  ## Why it matters

  These devices are crucial for preventing electrical fires and protecting people
  from electric shocks. They ensure that electrical systems operate safely by interrupting
  the flow of electricity when a fault is detected.


  ## What you need

  Common circuit protection devices include fuses, circuit breakers, ground-fault
  circuit interrupters (GFCIs), and arc-fault interrupters.


  ## How to do it

  Fuses and circuit breakers open the circuit automatically when too much current
  flows through them. GFCIs are used in high-risk areas to prevent electrocution by
  shutting off power quickly if a fault is detected. Arc-fault interrupters protect
  against arc-faults by deenergizing the circuit when an arc is detected.


  ## Common failure modes

  Failure modes include overheating and ground faults, which can occur if the devices
  are not functioning correctly or are improperly installed.


  ## Safety/boundary notes

  Ensure that circuit protection devices are installed and maintained by qualified
  professionals to ensure their effectiveness and safety.


  ## Local adaptation notes

  Consider local electrical codes and standards when selecting and installing circuit
  protection devices.'
