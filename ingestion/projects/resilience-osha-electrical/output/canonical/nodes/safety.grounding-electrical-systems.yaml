summary_short: Grounding creates a low-resistance path to the earth to prevent voltage
  buildup and reduce electrical accident risks.
summary_medium: Grounding is a safety measure that creates a low-resistance path to
  the earth, preventing voltage buildup and reducing the risk of electrical accidents.
  It serves as a secondary protective measure against electric shock.
plain_language: Grounding is a way to make electrical systems safer by connecting
  them to the earth. This helps prevent dangerous voltage buildup and reduces the
  risk of electric shocks.
markdown_body: '## What this is

  Grounding is the process of creating a low-resistance path that connects electrical
  systems or tools to the earth. This path helps prevent the buildup of voltages that
  could lead to electrical accidents.


  ## Why it matters

  Grounding is crucial for safety as it reduces the risk of electric shock. While
  it does not eliminate the possibility of shock or injury, it significantly lowers
  the risk, especially when combined with other safety measures.


  ## What you need

  Understanding of electrical systems and the role of grounding in safety.


  ## How to do it

  Grounding involves connecting one wire, often called the "neutral" or "grounded"
  conductor, to the earth. This is typically done at the generator or transformer
  and at the building''s service entrance.


  ## Common failure modes

  - Electric shock

  - Equipment damage


  ## Safety/boundary notes

  Grounding is a secondary protective measure and should be used alongside other safety
  practices.


  ## Local adaptation notes

  Local regulations, such as 29 CFR, Part 1910.304, Subpart S, may require specific
  grounding practices in non-construction applications.'
