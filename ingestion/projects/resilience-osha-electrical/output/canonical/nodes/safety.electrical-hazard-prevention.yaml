bundle_overrides:
  hook: Preventing electrical hazards is crucial to ensuring safety and avoiding serious
    injuries or fatalities in the workplace.
  primer: Electrical hazards pose significant risks in various work environments,
    potentially leading to severe injuries or even fatalities. Understanding and implementing
    safe work practices can greatly reduce these risks. Key practices include deenergizing
    equipment before inspection or repair, maintaining electric tools properly, exercising
    caution near energized lines, and using appropriate protective equipment. By following
    these guidelines, workers can create a safer environment and minimize the chances
    of electrical accidents. Additionally, adhering to specific regulatory requirements,
    such as those outlined in Subpart S of 29 CFR Part 1910 for general industry and
    Subpart K of 29 CFR Part 1926 for construction, is essential for compliance and
    safety. These practices not only protect individuals but also contribute to a
    culture of safety within the workplace.
  guide: '1. **Deenergize Equipment**: Before starting any inspection or repair work,
    ensure that all electrical equipment is deenergized. This involves disconnecting
    the power source and verifying that the equipment is not live. Use lockout/tagout
    procedures to prevent accidental re-energization.


    2. **Maintain Electric Tools**: Regularly inspect and maintain all electric tools
    to ensure they are in good working condition. Check for any signs of wear or damage,
    such as frayed cords or broken casings, and repair or replace tools as necessary.


    3. **Exercise Caution Near Energized Lines**: When working near energized lines,
    maintain a safe distance and be aware of your surroundings. Use insulated tools
    and wear appropriate protective gear to minimize the risk of accidental contact.


    4. **Use Protective Equipment**: Always wear the appropriate personal protective
    equipment (PPE) when working with or near electrical systems. This may include
    gloves, goggles, helmets, and insulating clothing, depending on the specific hazards
    present.


    5. **Follow Regulatory Requirements**: Familiarize yourself with and adhere to
    the electrical safety-related work practice requirements detailed in Subpart S
    of 29 CFR Part 1910 for general industry and Subpart K of 29 CFR Part 1926 for
    construction applications. These regulations provide comprehensive guidelines
    to ensure safety in various work environments.'
