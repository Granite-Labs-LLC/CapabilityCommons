markdown_body: '## What this is

  This skill guide provides information on safe work practices to prevent electrical
  accidents. It includes methods such as deenergizing equipment, maintaining tools,
  exercising caution near energized lines, and using protective equipment.


  ## Why it matters

  Electrical accidents can cause serious injuries or fatalities. By following these
  safe work practices, you can significantly reduce the risk of electrical hazards
  in the workplace.


  ## What you need

  To implement these practices, you will need appropriate protective equipment and
  maintenance tools.


  ## How to do it

  1. Deenergize electric equipment before inspection or repair.

  2. Keep electric tools properly maintained.

  3. Exercise caution when working near energized lines.

  4. Use appropriate protective equipment.


  ## Common failure modes

  - Failure to deenergize equipment before work.

  - Improper maintenance of tools.


  ## Safety/boundary notes

  Follow the electrical safety-related work practice requirements detailed in Subpart
  S of 29 CFR Part 1910 for general industry and Subpart K of 29 CFR Part 1926 for
  construction applications.


  ## Local adaptation notes

  Adjust practices as necessary to comply with local regulations and standards.'
