summary_short: Guidelines on identifying insulation types on electrical conductors.
summary_medium: Learn how to identify different types of insulation on electrical
  conductors, including color coding and regulatory requirements.
plain_language: This guide helps you identify various types of insulation on electrical
  wires, using color codes and understanding regulatory standards.
markdown_body: "## What this is\nThis reference sheet provides guidelines on identifying\
  \ different types of insulation on electrical conductors. It includes information\
  \ on color coding and regulatory requirements.\n\n## Why it matters\nProper identification\
  \ of insulation types is crucial for ensuring electrical safety and compliance with\
  \ regulations. It helps prevent electrical hazards and ensures that the insulation\
  \ is suitable for the voltage and conditions.\n\n## What you need\nNo specific tools\
  \ or materials are required, but familiarity with color codes and regulatory standards\
  \ is beneficial.\n\n## How to do it\n- Check the color coding of the insulation:\
  \ \n  - Equipment grounding conductors: solid green or green with yellow stripes.\n\
  \  - Grounded conductors: white or gray.\n  - Ungrounded conductors (hot wires):\
  \ black or red, but can be any color except green, white, or gray.\n- Inspect insulation\
  \ for defects, especially on flexible cords like extension cords.\n- Ensure insulation\
  \ is suitable for the voltage and conditions as per regulatory standards.\n\n##\
  \ Common failure modes\n- Exposed wires due to damaged insulation.\n- Using insulation\
  \ not suitable for the voltage or conditions.\n\n## Safety/boundary notes\nAlways\
  \ ensure that insulation is intact and suitable for the application to prevent electrical\
  \ hazards.\n\n## Local adaptation notes\nRegulatory requirements may vary by region,\
  \ so always check local regulations."
structured_data:
  definition: Insulation on electrical conductors is often color coded to indicate
    its purpose and regulatory compliance.
  key_questions:
  - What do different insulation colors signify?
  - What are the regulatory requirements for insulation?
  misconceptions:
  - All insulation colors can be used interchangeably.
  - Insulation is not important for electrical safety.
