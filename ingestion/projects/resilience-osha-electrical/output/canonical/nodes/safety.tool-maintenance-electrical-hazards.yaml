markdown_body: '## What this is

  This guide provides instructions on maintaining tools to prevent electrical hazards.
  Proper maintenance ensures tools do not become dangerous over time.


  ## Why it matters

  Using defective tools or those not designed for electrical work can lead to accidents.
  Regular maintenance and checks help protect workers from electric hazards.


  ## What you need

  - Tools designed for electrical work


  ## How to do it

  1. Regularly maintain tools to prevent deterioration.

  2. Check each tool before use for any defects.

  3. Remove defective tools from service immediately and tag them for repair or replacement.

  4. Ensure tools are designed to handle the voltages and stresses they will be exposed
  to.


  ## Common failure modes

  - Using tools that are defective or not designed for voltage exposure.


  ## Safety/boundary notes

  Always ensure tools are appropriate for the electrical work being performed.


  ## Local adaptation notes

  Adapt tool maintenance schedules based on local environmental conditions and usage
  frequency.'
