bundle_overrides:
  hook: Proper tool maintenance is crucial to prevent electrical hazards and ensure
    safety in the workplace.
  primer: Electrical hazards pose significant risks in many work environments, and
    one of the key ways to mitigate these risks is through proper tool maintenance.
    Tools that are not well-maintained can become dangerous over time, potentially
    leading to accidents or injuries. Regular maintenance and checks help ensure that
    tools remain in good condition and are safe to use. This involves inspecting tools
    for defects before each use, ensuring they are designed for the specific electrical
    tasks at hand, and removing any defective tools from service immediately. By adhering
    to these practices, workers can protect themselves and others from the dangers
    associated with electrical hazards.
  guide: '1. **Regular Maintenance**: Establish a routine maintenance schedule for
    all tools used in electrical work. This includes cleaning, inspecting, and servicing
    tools to prevent deterioration.


    2. **Pre-Use Inspection**: Before using any tool, conduct a thorough inspection
    to check for any visible defects such as cracks, frayed cords, or loose parts.
    This step is crucial to ensure the tool is safe for use.


    3. **Defective Tools Protocol**: If a tool is found to be defective during inspection,
    immediately remove it from service. Tag the tool clearly to indicate it is not
    to be used until it has been repaired or replaced.


    4. **Tool Suitability**: Ensure that all tools are specifically designed for the
    electrical work they will be used for. This means they should be capable of handling
    the voltages and stresses they will encounter.


    5. **Documentation**: Keep records of maintenance activities, inspections, and
    any repairs or replacements. This documentation can be useful for tracking tool
    condition over time and ensuring compliance with safety standards.


    6. **Training**: Provide training for all workers on how to properly inspect and
    maintain tools, as well as how to recognize and report defects.'
  reference:
  - Regularly maintain tools to prevent deterioration.
  - Check each tool before use for any defects.
  - Remove defective tools from service immediately and tag them for repair or replacement.
