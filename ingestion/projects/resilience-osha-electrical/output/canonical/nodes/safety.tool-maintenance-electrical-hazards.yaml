  worksheet:
  - Inspect a set of tools and identify any defects.
  - Create a maintenance schedule for a set of electrical tools.
  - Simulate tagging a defective tool and explain the process to a peer.
  - List the features that make a tool suitable for electrical work.
  teach_forward_kit:
