summary_short: Guidelines for responding to a person 'frozen' to a live electrical
  contact.
summary_medium: Learn how to safely respond if someone is 'frozen' to a live electrical
  contact, focusing on immediate action and personal safety.
plain_language: If someone is stuck to a live electrical source, turn off the power
  right away. If you can't, use something non-metal like a wooden stick to push them
  away safely.
markdown_body: '## What this is

  This safety notice provides guidelines for responding to situations where a person
  is ''frozen'' to a live electrical contact.


  ## Why it matters

  Immediate and correct action is crucial in preventing severe injury or death from
  electrocution. Knowing how to respond can save lives while ensuring your own safety.


  ## What you need

  - Boards, poles, or sticks made of wood or other nonconducting materials.


  ## How to do it

  1. Shut off the electrical current immediately if possible.

  2. If you cannot turn off the power, use a nonconducting object like a wooden stick
  to push or pull the person away from the electrical source.

  3. Ensure your own safety by avoiding direct contact with the live electrical source.


  ## Common failure modes

  - Failing to act quickly can result in severe injury or death.

  - Direct contact with the live electrical source can cause electrocution or shock.


  ## Safety/boundary notes

  Always prioritize your own safety. Avoid direct contact with the electrical source
  and use nonconducting materials to separate the person from the contact.


  ## Local adaptation notes

  Adapt the tools used based on availability, ensuring they are nonconducting materials.'
structured_data:
  implementation:
    smallest_viable_version: Turn off the electrical current immediately if someone
      is frozen to it.
    tools:
    - Boards
    - Poles
    - Sticks made of wood
    materials: []
    expected_time: null
    expected_cost: null
    success_checks:
    - The person is safely separated from the electrical source without causing harm
      to the rescuer.
    stop_conditions:
    - The person is no longer in contact with the electrical source.
    common_mistakes:
    - Touching the person directly while they are in contact with the electrical source.
    variants: []
    when_to_escalate:
    - If you cannot safely separate the person from the electrical source, call emergency
      services immediately.
  safety_boundary: 'Electricity can cause shock, electrocution, burns, fires, and
    explosions. This is safety awareness information, not training to work on electrical
    equipment: only qualified electricians trained in safe lockout procedures should
    maintain electrical equipment. If a person is "frozen" to a live electrical contact,
    shut off the current immediately. If you or someone else receives a shock, seek
    emergency medical help immediately.'
