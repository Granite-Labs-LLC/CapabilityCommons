summary_medium: This section explains the causes of electrical shocks, highlighting
  how a person's body can become part of an electric circuit, leading to a shock.
plain_language: Electrical shocks happen when electricity flows through a person's
  body, completing a circuit. This can occur in various ways, such as touching both
  wires of a circuit or a metal part that has become energized.
markdown_body: '## What this is

  Electrical shocks occur when a person''s body becomes part of an electric circuit,
  allowing electricity to flow through it.


  ## Why it matters

  Understanding the causes of electrical shocks is crucial for preventing accidents
  and ensuring safety when working with or around electrical systems.


  ## What you need

  Awareness of how circuits work and the conditions that can lead to a shock.


  ## How to do it

  Avoid contact with live wires and ensure that all electrical equipment is properly
  insulated and grounded.


  ## Common failure modes

  - Completing a circuit by touching both wires.

  - Contact with one wire and the ground.

  - Touching a metal part that has become energized.


  ## Safety/boundary notes

  Always use insulated tools and wear protective gear when working with electricity.


  ## Local adaptation notes

  Consider local electrical codes and standards when implementing safety measures.'
structured_data:
  definition: An electrical shock occurs when a person's body becomes part of an electric
    circuit, allowing electricity to flow through it.
  key_questions:
  - What conditions lead to an electrical shock?
  - How can the body become part of an electric circuit?
  misconceptions:
  - Only high voltage can cause shocks.
  - Insulation always prevents shocks.
  safety_boundary: 'Electricity can cause shock, electrocution, burns, fires, and
    explosions. This is safety awareness information, not training to work on electrical
    equipment: only qualified electricians trained in safe lockout procedures should
    maintain electrical equipment. Before anyone works on electrical equipment it
    must be deenergized, with lockout and tag procedures used to keep it deenergized;
    ground-fault circuit interrupters (GFCIs) are used in wet locations. If a person
    is "frozen" to a live electrical contact, shut off the current immediately. If
    you or someone else receives a shock, seek emergency medical help immediately.'
