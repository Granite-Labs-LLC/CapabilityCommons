plain_language: This guide helps you understand when an electrical shock is serious
  and why you should seek emergency medical help immediately.
markdown_body: '## What this is

  This is guidance on recognizing the seriousness of an electrical shock and understanding
  the need for immediate medical attention.


  ## Why it matters

  A severe electrical shock can cause internal injuries that are not visible, such
  as internal hemorrhages and damage to tissues, nerves, and muscles. It can also
  lead to renal damage. Recognizing these potential injuries is crucial for ensuring
  timely medical intervention.


  ## What you need

  Awareness of the symptoms and potential internal injuries caused by electrical shocks.


  ## How to do it

  If you or someone else receives an electrical shock, do not underestimate its severity.
  Seek emergency medical help immediately, even if there are no visible injuries.


  ## Common failure modes

  - Underestimating the severity of the shock.

  - Delaying medical response.


  ## Safety/boundary notes

  Immediate medical evaluation is necessary to assess and treat potential internal
  injuries.


  ## Local adaptation notes

  Adapt this guidance to local emergency medical services and response protocols.'
