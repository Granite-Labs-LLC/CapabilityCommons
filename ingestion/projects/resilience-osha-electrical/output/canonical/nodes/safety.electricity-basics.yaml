markdown_body: '## What this is

  This concept note introduces the basic principles of electricity, including its
  properties and potential hazards.


  ## Why it matters

  Understanding electricity is crucial for safety, as improper handling can lead to
  serious injuries or damage. Knowing the basics helps in identifying and mitigating
  risks associated with electrical systems.


  ## What you need

  No specific tools or materials are required to understand the basics of electricity,
  but awareness of electrical safety standards is beneficial.


  ## How to do it

  Learn about the properties of electricity, such as voltage, current, and resistance.
  Recognize the potential hazards like electrical shock and short circuits. Always
  maintain proper insulation and keep a safe distance from live wires.


  ## Common failure modes

  - Electrical shock

  - Short circuit


  ## Safety/boundary notes

  Ensure proper insulation and maintain a safe distance from live wires to prevent
  accidents.


  ## Local adaptation notes

  Consider local electrical codes and regional safety standards when applying this
  knowledge.'
