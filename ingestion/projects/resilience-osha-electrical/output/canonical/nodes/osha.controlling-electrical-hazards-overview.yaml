markdown_body: '## What this is

  This document provides a general overview of controlling electrical hazards based
  on OSHA standards. It serves as an informational guide and does not modify compliance
  responsibilities.


  ## Why it matters

  Understanding electrical hazards and how to control them is crucial for workplace
  safety. Following OSHA standards helps prevent accidents and ensures a safe working
  environment.


  ## What you need

  Familiarity with OSHA standards and access to current administrative interpretations
  and decisions.


  ## How to do it

  Refer to OSHA standards and the Occupational Safety and Health Act for detailed
  compliance requirements. Stay updated with current interpretations and decisions
  by the Occupational Safety and Health Review Commission and the courts.


  ## Common failure modes

  Misinterpreting the guidelines or failing to stay updated with current compliance
  requirements.


  ## Safety/boundary notes

  This document does not alter compliance responsibilities. Always refer to the latest
  OSHA standards and legal interpretations.


  ## Local adaptation notes

  Adaptations may be necessary based on local regulations and specific workplace conditions.'
