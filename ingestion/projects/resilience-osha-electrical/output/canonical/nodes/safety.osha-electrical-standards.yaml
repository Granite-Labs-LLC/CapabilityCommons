markdown_body: '## What this is

  This document provides an overview of the Occupational Safety and Health Administration
  (OSHA) standards that address electrical safety across different industries.


  ## Why it matters

  Electrical hazards pose significant risks in workplaces. OSHA standards help ensure
  safety by setting requirements that must be followed to protect workers from electrical
  hazards.


  ## What you need

  Familiarity with OSHA regulations and the specific industry standards applicable
  to your workplace.


  ## How to do it

  Understand and apply the relevant OSHA standards for your industry. For general
  industry, refer to 29 CFR Part 1910. For construction, refer to 29 CFR Part 1926.
  For marine terminals and longshoring, refer to 29 CFR Parts 1917 and 1918, respectively.
  Shipyards should refer to 29 CFR Part 1915.


  ## Common failure modes

  Failure to comply with OSHA standards can lead to workplace accidents and legal
  penalties.


  ## Safety/boundary notes

  Ensure that all electrical safety practices meet or exceed OSHA standards. In states
  with their own OSHA programs, verify that local standards are at least as effective
  as federal standards.


  ## Local adaptation notes

  State-specific OSHA programs may have variations in standards. Always check local
  regulations to ensure compliance.'
