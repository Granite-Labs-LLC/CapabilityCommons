summary_short: Explains the 'freezing' effect during electrical shocks.
summary_medium: The 'freezing' effect during electrical shocks occurs when muscle
  contractions prevent a person from pulling away, increasing exposure time and risk
  of injury.
plain_language: When someone gets an electrical shock, their muscles might contract,
  making them unable to move away from the electricity. This can lead to longer exposure
  and higher risk of injury.
markdown_body: '## What this is

  The ''freezing'' effect during electrical shocks refers to the involuntary muscle
  contractions that occur when a person is shocked. These contractions can make it
  difficult or impossible for the person to pull away from the electrical source.


  ## Why it matters

  This effect is dangerous because it increases the duration of exposure to electricity,
  which can lead to more severe injuries. Even low voltage shocks can be hazardous
  if the exposure time is extended.


  ## What you need

  Understanding of electrical safety and awareness of the risks associated with electrical
  shocks.


  ## How to do it

  Avoid contact with live electrical circuits and ensure proper safety measures are
  in place when working with electricity.


  ## Common failure modes

  - Increased exposure time due to inability to pull away.

  - Involuntary muscle reactions leading to additional injuries.


  ## Safety/boundary notes

  Always use appropriate protective equipment and follow safety protocols when working
  with or near electricity.


  ## Local adaptation notes

  Consider local electrical safety regulations and guidelines when implementing safety
  measures.'
structured_data:
  definition: The 'freezing' effect during electrical shocks is caused by muscle contractions
    that prevent a person from pulling away from the electrical source, increasing
    exposure time and risk of injury.
  key_questions:
  - What causes the 'freezing' effect during electrical shocks?
  - How does increased exposure time affect injury risk?
  misconceptions:
  - Low voltage shocks are not dangerous.
  safety_boundary: 'Electricity can cause shock, electrocution, burns, fires, and
    explosions. This is safety awareness information, not training to work on electrical
    equipment: only qualified electricians trained in safe lockout procedures should
    maintain electrical equipment. If a person is "frozen" to a live electrical contact,
    shut off the current immediately. If you or someone else receives a shock, seek
    emergency medical help immediately.'
