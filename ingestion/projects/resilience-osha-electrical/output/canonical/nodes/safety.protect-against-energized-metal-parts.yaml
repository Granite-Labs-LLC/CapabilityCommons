markdown_body: '## What this is

  This guide explains how to protect yourself from electrical hazards caused by metal
  parts that become energized. It focuses on using grounding conductors and double
  insulation to prevent electric shocks.


  ## Why it matters

  Energized metal parts can cause electric shock, burns, or even electrocution. Proper
  protection methods are essential to ensure safety when using electrical tools and
  machines.


  ## What you need

  - Equipment grounding conductor

  - Tools with three-prong plugs

  - Double insulated tools


  ## How to do it

  1. Use tools and machines with a grounding conductor. This is a low-resistance wire
  that directs unwanted current to the ground, reducing the risk of electric shock.

  2. Ensure that the equipment has a three-prong plug, which incorporates the grounding
  conductor.

  3. Alternatively, use tools and appliances with a double insulation system, which
  should be marked to indicate its use.


  ## Common failure modes

  - Electric shock

  - Burns

  - Electrocution


  ## Safety/boundary notes

  Always ensure that the grounding conductor is properly installed and maintained.
  Regularly check tools and appliances for signs of wear or damage.


  ## Local adaptation notes

  In regions with different electrical standards, ensure that tools and appliances
  meet local safety regulations.'
