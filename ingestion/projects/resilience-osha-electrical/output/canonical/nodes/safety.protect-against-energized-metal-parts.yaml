  - Regularly check tools for wear or damage.
  worksheet:
  - Identify three tools in your home that use a grounding conductor.
  - Check if your appliances have a three-prong plug and note any that do not.
  - Find a tool with double insulation and describe its safety markings.
  - Inspect a tool for signs of wear or damage and document your findings.
  - Research local electrical safety standards and list two key requirements.
