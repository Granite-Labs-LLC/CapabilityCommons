bundle_overrides:
  hook: Avoid dangerous electrical shocks by learning how to protect yourself from
    energized metal parts.
  primer: Electrical hazards can pose serious risks, including shocks, burns, and
    even electrocution. These hazards often arise when metal parts of tools or machines
    become 'energized' due to a break in insulation. When this happens, the metal
    parts can conduct electricity, posing a danger to anyone who touches them. To
    prevent these risks, it's crucial to use protective measures such as grounding
    conductors and double insulation. Grounding conductors provide a low-resistance
    path for electricity to flow safely to the ground, reducing the risk of electric
    shock. Tools with three-prong plugs typically incorporate this safety feature.
    Alternatively, double insulation offers another layer of protection by using two
    separate layers of insulating material to prevent electrical contact. Tools and
    appliances with this feature are usually marked to indicate their safety compliance.
    By understanding and implementing these protective measures, you can significantly
    reduce the risk of electrical hazards in your home or workplace.
  guide: '1. **Use Grounding Conductors**: Ensure that your tools and machines are
    equipped with a grounding conductor. This is a low-resistance wire that directs
    unwanted electrical current safely to the ground. Check that the grounding conductor
    is properly installed and maintained.


    2. **Check for Three-Prong Plugs**: Use tools and appliances with a three-prong
    plug, which incorporates the grounding conductor. This design helps ensure that
    any stray electrical current is safely grounded, reducing the risk of shock.


    3. **Opt for Double Insulation**: Alternatively, use tools and appliances that
    feature a double insulation system. These tools have two layers of insulation
    to prevent electrical contact. Look for a distinctive mark indicating that the
    tool or appliance uses an approved double insulation system.


    4. **Regular Inspections**: Regularly inspect your tools and appliances for signs
    of wear or damage. If you notice any issues, stop using the tool immediately and
    have it repaired or replaced.


    5. **Follow Local Regulations**: Ensure that all tools and appliances meet local
    electrical safety standards, especially if you are in a region with different
    electrical codes.'
  reference:
  - Energized metal parts can cause electric shock, burns, or electrocution.
  - Use tools with a grounding conductor to direct current safely to the ground.
  - Ensure equipment has a three-prong plug for grounding.
