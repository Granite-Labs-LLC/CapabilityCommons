markdown_body: '## What this is

  This reference sheet provides guidelines and measures for protecting against electrical
  hazards. It covers the identification of hazards and the implementation of protection
  measures.


  ## Why it matters

  Electrical hazards can cause serious injuries or fatalities. Understanding how to
  protect against these hazards is crucial for maintaining safety in environments
  where electrical systems are present.


  ## What you need

  To effectively protect against electrical hazards, you need insulated tools and
  protective equipment. Ensuring proper insulation and maintaining safe distances
  are key safety boundaries.


  ## How to do it

  1. Identify potential electrical hazards in your environment.

  2. Use insulated tools and wear protective equipment when working near electrical
  systems.

  3. Ensure all equipment is properly insulated and maintain safe distances from live
  electrical parts.


  ## Common failure modes

  - Inadequate protection due to improper use of tools or equipment.

  - Failure to identify all potential hazards in the environment.


  ## Safety/boundary notes

  Always ensure proper insulation and maintain safe distances from electrical systems
  to prevent accidents.


  ## Local adaptation notes

  Consider the availability of protective equipment and adhere to local electrical
  standards when implementing safety measures.'
structured_data:
  definition: Guidelines and measures for protecting against electrical hazards.
  key_questions:
  - What are the common electrical hazards?
  - How can these hazards be identified?
  - What protective measures should be implemented?
  misconceptions:
  - All electrical hazards are visible.
  - Protective equipment is optional.
  safety_boundary: 'Electricity can cause shock, electrocution, burns, fires, and
    explosions. This is safety awareness information, not training to work on electrical
    equipment: only qualified electricians trained in safe lockout procedures should
    maintain electrical equipment. Before anyone works on electrical equipment it
    must be deenergized, with lockout and tag procedures used to keep it deenergized;
    ground-fault circuit interrupters (GFCIs) are used in wet locations. People not
    qualified to work with electricity, and mechanical equipment, must stay at least
    10 feet (3.05 meters) away from overhead power lines.'
