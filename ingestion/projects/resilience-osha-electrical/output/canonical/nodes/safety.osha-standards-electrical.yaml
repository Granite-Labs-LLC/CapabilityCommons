markdown_body: '## What this is

  This reference sheet provides an overview of the Occupational Safety and Health
  Administration (OSHA) standards that address electrical safety.


  ## Why it matters

  Electrical hazards pose significant risks in the workplace, including shocks, burns,
  and even fatalities. OSHA standards are designed to minimize these risks and protect
  workers.


  ## What you need

  Understanding of basic electrical safety principles and familiarity with OSHA regulations.


  ## How to do it

  OSHA standards cover a range of protections, including insulation, grounding, and
  circuit protection devices. Employers must ensure that these standards are implemented
  to protect workers from electrical hazards.


  ## Common failure modes

  Failure to comply with OSHA standards can lead to increased risk of electrical accidents
  and potential legal consequences.


  ## Safety/boundary notes

  Always follow OSHA guidelines and ensure that all electrical equipment is properly
  maintained and inspected.


  ## Local adaptation notes

  Adaptations may be necessary based on specific workplace environments and local
  regulations.'
