summary_short: Guarding involves enclosing electric equipment to prevent accidental
  contact with live parts.
summary_medium: Guarding involves enclosing electric equipment to prevent accidental
  contact with live parts, requiring restricted access to authorized personnel only.
plain_language: Guarding is a safety measure that involves enclosing or locating electrical
  equipment in a way that prevents accidental contact with live parts. This is crucial
  for equipment operating at 50 volts or more, and access should be restricted to
  authorized personnel.
markdown_body: '## What this is

  Guarding is a safety practice used to prevent accidental contact with live electrical
  parts by enclosing or locating electrical equipment in secure areas.


  ## Why it matters

  Guarding is essential for preventing electrical accidents, especially with equipment
  operating at 50 volts or more. It ensures that only authorized personnel can access
  these areas, reducing the risk of injury.


  ## What you need

  To implement guarding, you need sturdy permanent screens and conspicuous signs that
  display warnings such as ''Danger,'' ''Warning,'' or ''Caution.''


  ## How to do it

  Place electrical equipment in secure locations like rooms, vaults, or elevated platforms.
  Use permanent screens as guards and post signs at entrances to alert and restrict
  unauthorized access.


  ## Common failure modes

  Failure can occur if unauthorized access is allowed or if signage is inadequate.


  ## Safety/boundary notes

  Guarding is necessary for equipment operating at 50 volts or more.


  ## Local adaptation notes

  Signage requirements may vary by location, so ensure compliance with local regulations.'
