summary_short: Overview of burns caused by electrical shocks.
summary_medium: Learn about different types of burns from electrical shocks, including
  electrical, arc, and thermal contact burns, and the importance of immediate treatment.
plain_language: Electrical shocks can cause serious burns that need quick medical
  attention. These include electrical burns, arc burns, and thermal contact burns.
markdown_body: '## What this is

  Electrical burns are injuries caused by electric shocks. They can be electrical
  burns, arc burns, or thermal contact burns.


  ## Why it matters

  Electrical burns are serious and require immediate medical attention. They can cause
  severe tissue damage and other complications if not treated promptly.


  ## What you need

  Awareness of the types of burns and the importance of quick medical response.


  ## How to do it

  If someone suffers an electrical burn, seek immediate medical help. For arc burns,
  prompt treatment is crucial. Avoid contact with overheated electrical equipment
  to prevent thermal contact burns.


  ## Common failure modes

  Delaying treatment of burns can lead to severe complications. Ignition of flammable
  materials can occur if safety precautions are not followed.


  ## Safety/boundary notes

  Always maintain a safe distance from electrical hazards and ensure proper safety
  measures are in place to prevent burns.


  ## Local adaptation notes

  Consider local emergency services and protocols for treating electrical burns.'
structured_data:
  definition: Electrical burns are injuries caused by electric shocks, including electrical,
    arc, and thermal contact burns.
  key_questions:
  - What are the different types of electrical burns?
  - Why is immediate medical attention important for electrical burns?
  misconceptions:
  - Electrical burns are not serious and do not require immediate treatment.
  safety_boundary: 'Electricity can cause shock, electrocution, burns, fires, and
    explosions. This is safety awareness information, not training to work on electrical
    equipment: only qualified electricians trained in safe lockout procedures should
    maintain electrical equipment. Electrical burns are among the most serious burns
    and require immediate medical attention; arc or flash burns should also be treated
    promptly. If a person is "frozen" to a live electrical contact, shut off the current
    immediately. If you or someone else receives a shock, seek emergency medical help
    immediately.'
