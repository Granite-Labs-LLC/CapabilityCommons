summary_short: An overview of volcanoes and their associated hazards.
summary_medium: Volcanoes are vents through which molten rock escapes to the earth's
  surface, causing eruptions that can be quiet or explosive. Hazards include lava
  flows, ash, and other natural events.
plain_language: Volcanoes are openings in the Earth's surface where molten rock, gases,
  and ash can escape. Eruptions can vary in intensity and cause various hazards like
  lava flows and ash clouds.
markdown_body: '# What this is

  A volcano is a vent in the Earth''s surface that allows molten rock, gases, and
  ash to escape. Eruptions occur when pressure from gases within the molten rock becomes
  too great.


  # Why it matters

  Volcanic eruptions can pose significant hazards, including lava flows, ash clouds,
  and other natural events like earthquakes and landslides. Understanding these hazards
  is crucial for safety and preparedness.


  # What you need

  Awareness of active volcanoes in your area and understanding of potential hazards
  like lava flows and ash.


  # How to do it

  Monitor volcanic activity reports and have an evacuation plan if you live near an
  active volcano. Protect machinery and structures from ash damage.


  # Common failure modes

  Lava flows can destroy structures, while ash can damage machinery and cause roof
  collapses when mixed with water.


  # Safety/boundary notes

  Avoid areas near active volcanoes during eruptions and protect respiratory health
  from ash inhalation.


  # Local adaptation notes

  Active volcanoes in the U.S. are primarily located in Hawaii, Alaska, and the Pacific
  Northwest.'
structured_data:
  definition: A volcano is a geological formation where molten rock, gases, and ash
    escape from beneath the Earth's crust.
  key_questions:
  - What causes a volcanic eruption?
  - What are the main hazards associated with volcanoes?
  - Where are active volcanoes located in the U.S.?
  misconceptions:
  - All volcanic eruptions are explosive.
  - Volcanic ash is harmless.
