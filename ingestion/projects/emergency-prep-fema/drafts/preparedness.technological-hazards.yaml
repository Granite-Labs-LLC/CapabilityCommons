summary_short: Learn how to prepare for technological hazards like hazardous materials
  incidents and chemical emergencies.
summary_medium: This module provides guidance on preparing for technological hazards,
  including hazardous materials incidents, household chemical emergencies, and nuclear
  power plant incidents. It covers essential steps to ensure safety and minimize risks.
plain_language: This guide helps you prepare for emergencies related to technology,
  such as chemical spills or nuclear plant issues. It explains what to do to stay
  safe and reduce danger.
markdown_body: '# What this is

  This module focuses on preparedness for technological hazards, which include hazardous
  materials incidents, household chemical emergencies, and nuclear power plant incidents.
  It provides essential information and steps to help individuals and families prepare
  for these types of emergencies.


  # Why it matters

  Technological hazards can pose significant risks to health and safety. Being prepared
  can help mitigate these risks, ensuring that individuals and families know how to
  respond effectively to minimize harm.


  # What you need

  To prepare for technological hazards, you need to be informed about potential risks
  in your area, have a plan in place for emergencies, and assemble a disaster supplies
  kit that includes items specific to technological emergencies.


  # How to do it

  1. Get informed about the types of technological hazards that could affect your
  area. 2. Develop an emergency plan that includes evacuation routes and communication
  strategies. 3. Assemble a disaster supplies kit with items like protective clothing,
  masks, and a battery-powered radio. 4. Practice your emergency plan regularly to
  ensure everyone knows what to do.


  # Common failure modes

  Common mistakes include not having a plan, failing to update emergency kits, and
  not practicing the emergency plan regularly. Additionally, underestimating the severity
  of technological hazards can lead to inadequate preparation.


  # Safety/boundary notes

  Always prioritize safety by following official guidance during an emergency. Avoid
  exposure to hazardous materials and evacuate if instructed by authorities.


  # Local adaptation notes

  Adapt your emergency plan and supplies kit based on the specific technological hazards
  prevalent in your area. Consider local resources and infrastructure when planning.'
