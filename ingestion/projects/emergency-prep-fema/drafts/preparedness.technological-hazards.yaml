bundle_overrides:
  hook: Being prepared for technological hazards can significantly reduce risks to
    your health and safety during emergencies.
  primer: Technological hazards refer to emergencies that arise from human-made sources,
    such as hazardous materials incidents, household chemical emergencies, and nuclear
    power plant incidents. These hazards can pose significant risks to health and
    safety, making preparedness crucial. Understanding the potential risks in your
    area is the first step in being prepared. This involves knowing the types of technological
    hazards that could occur and how they might impact you and your community. Once
    informed, developing a comprehensive emergency plan is essential. This plan should
    include evacuation routes, communication strategies, and a clear understanding
    of what to do in different scenarios. Additionally, assembling a disaster supplies
    kit tailored to technological emergencies is vital. This kit should contain items
    like protective clothing, masks, and a battery-powered radio. Regularly practicing
    your emergency plan ensures that everyone knows what to do, reducing panic and
    confusion during an actual event. Common mistakes in preparedness include not
    having a plan, failing to update emergency kits, and not practicing the plan regularly.
    By being proactive and prepared, you can minimize the impact of technological
    hazards on your life.
  guide: '1. **Get Informed**: Research the types of technological hazards that could
    affect your area. This includes understanding local industrial activities, nearby
    nuclear power plants, and common household chemical risks.


    2. **Develop an Emergency Plan**: Create a plan that includes evacuation routes,
    communication strategies, and roles for each family member. Ensure everyone knows
    the plan and understands their responsibilities.


    3. **Assemble a Disaster Supplies Kit**: Gather essential items specific to technological
    emergencies. Include protective clothing, masks, a battery-powered radio, and
    any other items recommended for your specific risks.


    4. **Practice Your Plan**: Conduct regular drills to ensure everyone is familiar
    with the emergency procedures. This helps to identify any gaps in the plan and
    allows for adjustments as needed.


    5. **Stay Updated**: Keep your emergency plan and supplies kit up-to-date. Regularly
    review and update contact information, and replace expired items in your kit.


    6. **Follow Official Guidance**: During an emergency, always prioritize safety
    by following instructions from local authorities. Evacuate if instructed and avoid
    exposure to hazardous materials.'
  reference:
  - 'Types of technological hazards: hazardous materials incidents, household chemical
    emergencies, nuclear power plant incidents.'
  - 'Key components of an emergency plan: evacuation routes, communication strategies,
    family roles.'
  - 'Essential items for a disaster supplies kit: protective clothing, masks, battery-powered
    radio.'
  - 'Common preparedness mistakes: not having a plan, outdated emergency kits, lack
    of practice.'
  - 'Safety priority: follow official guidance, evacuate if instructed.'
  worksheet:
  - List three technological hazards that could affect your area.
  - Create a basic emergency plan outline, including evacuation routes and communication
    strategies.
  - Identify five items to include in your disaster supplies kit for technological
    emergencies.
  - Conduct a family drill using your emergency plan and note any areas for improvement.
  - Research local resources and contacts for technological hazard emergencies.
  teach_forward_kit:
    three_minute_version: Technological hazards, such as chemical spills and nuclear
      incidents, pose significant risks. Being prepared involves understanding local
      risks, creating an emergency plan, assembling a supplies kit, and practicing
      regularly. Follow official guidance during emergencies to ensure safety.
    ten_minute_outline:
    - Introduction to technological hazards and their risks.
    - Steps to get informed about local hazards.
    - Developing a comprehensive emergency plan.
    - Assembling a disaster supplies kit specific to technological emergencies.
    - Importance of practicing the emergency plan regularly.
    - Safety tips and following official guidance during emergencies.
    discussion_prompts:
    - What are some technological hazards you think are most relevant to your community?
    - How can you ensure your emergency plan is effective and up-to-date?
    - What challenges might you face in assembling a disaster supplies kit, and how
      can you overcome them?
    - Why is it important to practice your emergency plan regularly?
    - How can local authorities and communities work together to improve preparedness
      for technological hazards?
