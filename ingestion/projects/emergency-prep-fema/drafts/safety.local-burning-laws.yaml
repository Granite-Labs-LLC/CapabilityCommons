summary_short: Guidelines for safely burning debris in wooded areas.
summary_medium: Learn how to safely burn debris in wooded areas by notifying authorities,
  obtaining permits, and using approved incinerators.
plain_language: Before you burn debris in a wooded area, make sure to notify local
  authorities, get a burning permit, and use an approved incinerator with safety measures.
markdown_body: "### What this is\nThis reference sheet provides guidelines for safely\
  \ burning debris in wooded areas, ensuring compliance with local laws and minimizing\
  \ fire risks.\n\n### Why it matters\nFollowing local burning laws helps prevent\
  \ uncontrolled fires, protects the environment, and ensures community safety.\n\n\
  ### What you need\nAn approved incinerator, a burning permit, a fire extinguisher\
  \ or garden hose, and a cleared area around the incinerator.\n\n### How to do it\n\
  1. Notify local authorities about your intent to burn debris. \n2. Obtain a burning\
  \ permit if required. \n3. Use an approved incinerator with a lid or covering with\
  \ holes no larger than 3/4 inch. \n4. Ensure a 10-foot clearing around the incinerator.\
  \ \n5. Keep a fire extinguisher or garden hose nearby.\n\n### Common failure modes\n\
  Uncontrolled fire due to inadequate clearing or lack of fire suppression tools.\n\
  \n### Safety/boundary notes\nMaintain a 10-foot clearing around the incinerator\
  \ to prevent fire spread.\n\n### Local adaptation notes\nCheck local burning laws\
  \ and regulations as they may vary by region."
