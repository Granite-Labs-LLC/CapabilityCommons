summary_short: Guidance on the Homeland Security Advisory System for citizens.
summary_medium: This reference sheet provides guidance for citizens to understand
  and respond to the Homeland Security Advisory System, including monitoring threat
  levels and following public safety instructions.
plain_language: Learn how to understand and respond to different threat levels in
  the Homeland Security Advisory System to ensure your safety.
markdown_body: '### What this is

  The Homeland Security Advisory System is a tool used to communicate the risk of
  terrorist attacks to the public. It uses a color-coded system to indicate different
  threat levels.


  ### Why it matters

  Understanding the threat levels can help you take appropriate actions to ensure
  your safety and the safety of those around you. It is crucial for staying informed
  and prepared during potential emergencies.


  ### What you need

  Awareness of the current threat level and the ability to follow public safety instructions.
  Access to reliable sources of information such as government announcements or trusted
  news outlets.


  ### How to do it

  Monitor the current threat level through official channels. Follow any specific
  instructions provided by local authorities or emergency services. Stay informed
  about changes in threat levels and adjust your actions accordingly.


  ### Common failure modes

  Misinterpreting the threat levels or not complying with the guidance provided can
  lead to increased risk during emergencies.


  ### Safety/boundary notes

  Always prioritize instructions from local emergency services and authorities. Do
  not rely solely on unofficial sources for threat level information.


  ### Local adaptation notes

  Be aware of regional variations in threat levels and local emergency protocols that
  may affect how you should respond.'
