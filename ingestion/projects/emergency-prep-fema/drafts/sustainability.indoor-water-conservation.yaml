plain_language: Learn how to save water inside your home by fixing leaks, using efficient
  appliances, and reusing water.
markdown_body: '### What this is

  This reference sheet provides practical tips for conserving water indoors, helping
  you reduce water usage and improve efficiency in your home.


  ### Why it matters

  Water conservation is crucial for sustainability, reducing utility bills, and preserving
  natural resources. Efficient water use also helps prevent plumbing issues and extends
  the lifespan of appliances.


  ### What you need

  To implement these tips, you may need tools and materials such as aerators, flow
  restrictors, an instant hot water heater, insulation, and possibly a water-softening
  system.


  ### How to do it

  1. Reuse water whenever possible, such as using leftover water for plants.

  2. Repair any dripping faucets by replacing washers, as even a small leak can waste
  thousands of gallons annually.

  3. Check all plumbing for leaks and have them repaired by a professional if necessary.

  4. Install aerators with flow restrictors on all household faucets to reduce water
  flow.

  5. Consider installing an instant hot water heater at your sink to save energy.

  6. Insulate water pipes to minimize heat loss and prevent freezing.

  7. Use a water-softening system only if necessary to protect pipes from mineral
  damage, and turn it off when not needed, such as during vacations.

  8. Choose appliances that are designed to be energy and water efficient.


  ### Common failure modes

  Ignoring leaks and using inefficient appliances can lead to increased water usage
  and higher bills.


  ### Safety/boundary notes


  ### Local adaptation notes

  Consider the availability of plumbers in your area and the hardness of your local
  water supply when implementing these tips.'
