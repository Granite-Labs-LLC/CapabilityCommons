plain_language: Learn how to prepare for thunderstorms by removing dangerous trees
  and understanding the 30/30 lightning safety rule.
markdown_body: '### What this is

  This guide provides essential steps to prepare for thunderstorms, focusing on tree
  maintenance and lightning safety.


  ### Why it matters

  Thunderstorms can cause significant damage and pose safety risks. Proper preparation
  can minimize these risks and protect both people and property.


  ### What you need

  Awareness of tree conditions on your property and knowledge of the 30/30 lightning
  safety rule.


  ### How to do it

  1. Inspect your property for dead or rotting trees and branches. Remove them to
  prevent injury or damage during a storm.

  2. Follow the 30/30 lightning safety rule: If you see lightning and cannot count
  to 30 before hearing thunder, go indoors. Stay indoors for at least 30 minutes after
  the last thunderclap.


  ### Common failure modes

  Ignoring dead trees can lead to injury from falling branches. Not following the
  30/30 rule can increase the risk of lightning strikes.


  ### Safety/boundary notes

  Always stay indoors during a thunderstorm to ensure safety from lightning.


  ### Local adaptation notes

  Consider local tree types and regional storm frequency when planning tree maintenance.'
