markdown_body: '### What this is

  This glossary provides definitions for terms commonly used in the context of extreme
  heat hazards.


  ### Why it matters

  Understanding these terms is crucial for identifying and responding to extreme heat
  conditions effectively, which can help prevent heat-related illnesses and fatalities.


  ### What you need

  Familiarity with basic weather terminology and an interest in emergency management.


  ### How to do it

  Review the glossary to understand the definitions and implications of each term
  related to extreme heat hazards.


  ### Common failure modes

  Misunderstanding or misinterpreting the terms can lead to inadequate preparation
  or response to heat hazards.


  ### Safety/boundary notes

  Ensure that the terms are understood in the context of local weather patterns and
  emergency management protocols.


  ### Local adaptation notes

  Adapt the glossary to include locally relevant terms and definitions that may not
  be covered in the general glossary.'
