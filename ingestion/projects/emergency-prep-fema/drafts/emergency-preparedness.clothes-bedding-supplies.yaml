summary_short: Checklist of essential clothes and bedding for emergencies.
summary_medium: A checklist of essential clothes and bedding supplies to prepare for
  emergencies, ensuring comfort and protection in various conditions.
plain_language: This guide provides a list of clothing and bedding items you should
  have ready in case of an emergency. It includes clothes for different weather conditions
  and bedding for comfort.
markdown_body: '### What this is

  This is a checklist of essential clothing and bedding items to have on hand for
  emergency preparedness. It ensures you are equipped to handle various weather conditions
  and maintain comfort during an emergency.


  ### Why it matters

  Having the right clothes and bedding is crucial in emergencies to protect against
  the elements and ensure comfort. This can prevent health issues related to exposure
  and improve overall resilience.


  ### What you need

  You will need a complete change of clothes, sturdy shoes or boots, rain gear, a
  hat and gloves, extra socks and underwear, thermal underwear, sunglasses, blankets,
  sleeping bags, and pillows.


  ### How to do it

  Gather all the listed items and store them in an accessible location. Consider the
  climate and personal preferences when selecting specific items. Regularly check
  and update your supplies to ensure they remain in good condition.


  ### Common failure modes

  Failing to include adequate clothing for all weather conditions or neglecting to
  have enough bedding can lead to discomfort and health risks during an emergency.


  ### Safety/boundary notes


  ### Local adaptation notes

  Consider local climate conditions and cultural clothing preferences when selecting
  items for your emergency kit.'
