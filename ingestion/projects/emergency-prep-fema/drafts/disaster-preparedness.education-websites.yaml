plain_language: This guide lists websites where you can find information about preparing
  for disasters. It includes both government and non-government resources.
markdown_body: '# What this is

  This reference sheet lists various websites that provide educational resources on
  disaster preparedness. These websites include both government and non-government
  sources.


  # Why it matters

  Accessing reliable information is crucial for effective disaster preparedness. These
  websites offer up-to-date resources and guidance to help individuals and communities
  prepare for emergencies.


  # What you need

  To use this resource, you need internet access to visit the listed websites.


  # How to do it

  Visit each website using the provided URLs to explore their resources. Conduct searches
  on these sites to find the most current and relevant information on disaster preparedness.


  # Common failure modes

  Some links may become outdated over time, and information might be incomplete. Always
  verify the currency of the information you find.


  # Safety/boundary notes

  Ensure that the websites you visit are official and secure to avoid misinformation.


  # Local adaptation notes

  Check for local websites or resources that may offer more region-specific disaster
  preparedness information.'
