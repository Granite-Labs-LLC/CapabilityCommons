markdown_body: '### What this is

  This concept note provides an overview of the importance of being prepared for emergencies
  and disasters. It emphasizes the need for individuals to be self-sufficient for
  at least three days following a disaster.


  ### Why it matters

  Disasters can disrupt lives and communities, causing significant damage to people
  and property. While local government and disaster-relief organizations will assist,
  they may not be able to reach everyone immediately. Being prepared ensures that
  you can manage on your own until help arrives.


  ### What you need

  To be prepared, you should have a plan for shelter, first aid, food, water, and
  sanitation for at least three days.


  ### How to do it

  Identify the types of disasters that could occur in your area, such as hurricanes,
  earthquakes, or extreme weather. Prepare a kit with essential supplies and create
  a plan for how you will respond to these events.


  ### Common failure modes

  Failing to prepare adequately can lead to an inability to be self-sufficient, which
  can exacerbate the impact of a disaster.


  ### Safety/boundary notes

  Ensure that your preparedness plan includes considerations for safety and security
  during a disaster.


  ### Local adaptation notes

  Adapt your preparedness plan to the specific types of disasters that are most likely
  to occur in your local area.'
structured_data:
  definition: Emergency preparedness involves planning and preparing for potential
    disasters to ensure safety and self-sufficiency.
  key_questions:
  - What types of disasters are most likely to occur in my area?
  - How can I ensure I have enough supplies for at least three days?
  misconceptions:
  - Believing that government aid will always arrive immediately after a disaster.
