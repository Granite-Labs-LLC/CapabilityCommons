markdown_body: '### What this is

  This guide provides tips on how to conserve water when washing your car, either
  at home or using commercial services.


  ### Why it matters

  Water conservation is crucial for environmental sustainability. By reducing water
  usage during car washing, you contribute to saving this vital resource.


  ### What you need

  A hose with a shut-off nozzle or access to a commercial car wash that recycles water.


  ### How to do it

  When washing your car at home, use a shut-off nozzle to control water flow and park
  on grass to water it simultaneously. Alternatively, choose a commercial car wash
  that recycles water.


  ### Common failure modes

  Using excessive water by not controlling the flow or choosing car washes that do
  not recycle water.


  ### Safety/boundary notes


  ### Local adaptation notes

  Consider the availability of water-recycling car washes in your area.'
