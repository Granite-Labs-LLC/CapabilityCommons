plain_language: Learn how to help someone who has been struck by lightning. This includes
  performing CPR and checking for injuries.
markdown_body: "### What this is\nThis guide explains how to provide first aid to\
  \ someone who has been struck by lightning. It covers essential steps like checking\
  \ for breathing and heartbeat, performing CPR, and assessing for injuries.\n\n###\
  \ Why it matters\nLightning strikes can cause severe injuries or be fatal. Quick\
  \ and appropriate first aid can save lives and reduce the severity of injuries.\n\
  \n### What you need\nNo special tools are required, but knowledge of CPR and basic\
  \ first aid is essential.\n\n### How to do it\n1. Call 9-1-1 immediately for medical\
  \ assistance. \n2. Check if the victim is breathing. If not, begin mouth-to-mouth\
  \ resuscitation. \n3. Check for a heartbeat. If absent, perform CPR. \n4. If the\
  \ victim has a pulse and is breathing, look for other injuries such as burns, nervous\
  \ system damage, broken bones, or loss of hearing and eyesight.\n\n### Common failure\
  \ modes\nDelayed medical response and improper CPR technique can worsen the victim's\
  \ condition.\n\n### Safety/boundary notes\nEnsure your own safety first by moving\
  \ to a safe location away from the storm.\n\n### Local adaptation notes\nConsider\
  \ the availability of emergency services in your area when planning your response."
