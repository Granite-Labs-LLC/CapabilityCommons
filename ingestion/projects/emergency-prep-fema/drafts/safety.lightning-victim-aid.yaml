bundle_overrides:
  hook: Knowing how to provide first aid to a lightning strike victim can save lives
    and reduce injury severity.
  primer: Lightning strikes are rare but can cause severe injuries or even be fatal.
    When someone is struck by lightning, they may suffer from cardiac arrest, burns,
    nervous system damage, or other injuries. Quick and appropriate first aid is crucial
    in these situations. This guide will help you understand the essential steps to
    take when providing aid to a lightning strike victim. You don't need any special
    tools, but knowledge of CPR and basic first aid is essential. The primary steps
    include calling emergency services, checking for breathing and heartbeat, performing
    CPR if necessary, and assessing the victim for additional injuries. Ensuring your
    own safety is also important, so always move to a safe location away from the
    storm before assisting.
  guide: '1. **Call 9-1-1 immediately**: The first step in aiding a lightning strike
    victim is to call for professional medical assistance. This ensures that help
    is on the way while you begin first aid.


    2. **Check if the victim is breathing**: Approach the victim carefully and check
    for breathing. If the victim is not breathing, you need to start mouth-to-mouth
    resuscitation immediately.


    3. **Check for a heartbeat**: If the victim is not breathing, also check for a
    heartbeat. If there is no heartbeat, begin CPR. CPR involves chest compressions
    and rescue breaths to help circulate blood and oxygen in the body.


    4. **Assess for other injuries**: If the victim has a pulse and is breathing,
    look for other possible injuries. Lightning can cause burns where it enters and
    exits the body. Be alert for signs of nervous system damage, broken bones, and
    loss of hearing or eyesight.


    5. **Ensure your safety**: Before assisting, make sure you are in a safe location
    away from the storm. Your safety is crucial to effectively help the victim.'
  reference:
  - Call 9-1-1 immediately for medical assistance.
  - Check if the victim is breathing. If not, begin mouth-to-mouth resuscitation.
  - Check for a heartbeat. If absent, perform CPR.
  - If the victim has a pulse and is breathing, look for other injuries such as burns,
    nervous system damage, broken bones, or loss of hearing and eyesight.
  worksheet:
  - List the steps you would take if you encountered a lightning strike victim.
  - Practice CPR techniques on a dummy or with a partner under supervision.
  - Discuss with a group how to ensure personal safety during a thunderstorm.
  - Identify signs of nervous system damage and how to assess them in a victim.
  teach_forward_kit:
    three_minute_version: In the event of a lightning strike, call 9-1-1 immediately,
      check if the victim is breathing and has a heartbeat, perform CPR if necessary,
      and assess for other injuries while ensuring your own safety.
    ten_minute_outline:
    - Introduction to lightning strike injuries
    - Importance of calling emergency services
    - Checking for breathing and performing mouth-to-mouth resuscitation
    - Checking for a heartbeat and performing CPR
    - Assessing for additional injuries
    - Ensuring personal safety during a storm
    discussion_prompts:
    - Why is it important to call 9-1-1 immediately when someone is struck by lightning?
    - What are the key signs that indicate a person needs CPR?
    - How can you ensure your safety while assisting a lightning strike victim?
    - What types of injuries should you look for after ensuring the victim is breathing
      and has a pulse?
