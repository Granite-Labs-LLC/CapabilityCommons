summary_short: Glossary of tornado-related terms.
summary_medium: A glossary of terms to help identify tornado hazards.
plain_language: Learn the key terms used to describe tornado conditions and warnings.
markdown_body: '### What this is

  This glossary provides definitions for key terms used in the context of tornado
  hazards.


  ### Why it matters

  Understanding these terms can help you recognize and respond appropriately to tornado
  warnings and conditions.


  ### What you need

  Familiarity with these terms is essential for interpreting weather alerts and taking
  appropriate safety measures.


  ### How to do it

  Review each term and its definition to ensure you understand the conditions they
  describe.


  ### Common failure modes

  Misunderstanding these terms can lead to inadequate preparation or response to tornado
  threats.


  ### Safety/boundary notes

  Ensure that all household members are familiar with these terms to enhance collective
  safety during tornado events.


  ### Local adaptation notes

  Local weather services may use additional terms or provide specific guidance relevant
  to your area.'
structured_data:
  definition: A glossary of terms related to identifying tornado hazards.
  key_questions:
  - What is a tornado warning?
  - What is a tornado watch?
  - What is a funnel cloud?
  - What constitutes a severe thunderstorm?
  misconceptions:
  - A tornado watch means a tornado has been sighted.
  - A funnel cloud is the same as a tornado.
