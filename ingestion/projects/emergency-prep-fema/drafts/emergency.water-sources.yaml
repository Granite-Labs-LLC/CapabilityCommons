summary_short: A reference sheet listing safe and unsafe water sources during emergencies.
summary_medium: This reference sheet provides a list of water sources that are safe
  and unsafe to use during emergencies, helping individuals identify viable options
  for water when usual supplies are disrupted.
plain_language: In emergencies, it's crucial to know which water sources are safe
  to use. This guide lists safe options like melted ice cubes and water from pipes,
  and warns against unsafe sources like radiators and toilet water.
markdown_body: '### What this is

  This reference sheet helps identify safe and unsafe water sources during emergencies
  when regular water supplies are unavailable.


  ### Why it matters

  Access to clean water is essential for survival, especially in emergencies. Knowing
  which sources are safe can prevent illness and ensure you have water for drinking,
  cooking, and hygiene.


  ### What you need

  - Knowledge of your home''s water systems

  - Access to emergency supplies for water treatment


  ### How to do it

  #### Safe Water Sources:

  - **Melted ice cubes**: Use ice from your freezer as it melts.

  - **Water drained from the water heater**: Ensure the heater is undamaged before
  use.

  - **Liquids from canned goods**: Use juices from canned fruits and vegetables.

  - **Water drained from pipes**: Access water remaining in your home''s plumbing.


  #### Unsafe Water Sources:

  - **Radiators**: Water may contain harmful chemicals.

  - **Hot water boilers**: Not safe for drinking.

  - **Water beds**: Chemicals in the vinyl or added fungicides make this water unsafe.

  - **Toilet bowl or flush tank**: Contains contaminants.

  - **Swimming pools and spas**: Chemicals are too concentrated for drinking but may
  be used for hygiene.


  ### Common failure modes

  - Using water from unsafe sources without treatment.

  - Failing to treat water of uncertain quality.


  ### Safety/boundary notes

  Always treat water of uncertain quality before use. Methods include boiling, chlorination,
  and distillation.


  ### Local adaptation notes

  Adapt this guide based on available resources and local water systems.'
