summary_short: Flood insurance helps mitigate risks in flood-prone areas.
summary_medium: Flood insurance is crucial for those living in flood-prone areas to
  reduce the risk of flood loss and aid in recovery.
plain_language: If you live in an area that is prone to flooding, it's a good idea
  to buy flood insurance. This type of insurance can help cover the costs of damage
  to your home and belongings if a flood happens.
markdown_body: '### What this is

  Flood insurance is a type of insurance policy that covers damage to buildings and
  their contents caused by flooding.


  ### Why it matters

  Flooding can cause significant damage to homes and personal property. Having flood
  insurance can provide financial protection and peace of mind, ensuring quicker recovery
  after a flood event.


  ### What you need

  Consider purchasing a flood insurance policy if you live in a flood-prone area.
  Evaluate the value of your building and contents to determine the appropriate coverage.


  ### How to do it

  Contact an insurance provider or call 1(888)FLOOD29 to learn more about available
  flood insurance options. Assess your property and personal belongings to decide
  on the coverage you need.


  ### Common failure modes

  Not purchasing insurance in time, underestimating the value of property, or not
  understanding policy exclusions can lead to inadequate coverage.


  ### Safety/boundary notes

  Ensure that important documents related to your insurance policy are stored safely
  and copies are included in your disaster supplies kit.


  ### Local adaptation notes

  Check local regulations and flood risk maps to understand specific risks and insurance
  requirements in your area.'
structured_data:
  definition: Flood insurance is a policy that provides coverage for damage caused
    by flooding.
  key_questions:
  - Do I live in a flood-prone area?
  - What is the value of my property and contents?
  - What does my flood insurance policy cover?
  misconceptions:
  - Standard home insurance covers flood damage.
  - Flood insurance is only necessary for homes directly next to water bodies.
