markdown_body: '### What this is

  This guide provides steps to follow if you are exposed to a biological agent, focusing
  on immediate decontamination and seeking medical help.


  ### Why it matters

  Exposure to biological agents can lead to serious health issues. Quick and effective
  response can reduce the risk of infection and spread.


  ### What you need

  Access to soap and water, clean clothes, and a way to contact medical authorities.


  ### How to do it

  1. Remove and bag your clothes and personal items. Follow official instructions
  for disposal of contaminated items.

  2. Wash yourself thoroughly with soap and water.

  3. Put on clean clothes.

  4. Seek medical assistance immediately. You may be advised to stay away from others
  or even quarantined.


  ### Common failure modes

  Improper decontamination or failure to seek medical help can increase health risks.


  ### Safety/boundary notes

  Ensure that you follow official instructions and maintain hygiene to prevent further
  contamination.


  ### Local adaptation notes

  Local health authorities may have specific instructions based on the type of biological
  agent and available resources.'
