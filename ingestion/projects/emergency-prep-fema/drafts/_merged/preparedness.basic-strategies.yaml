summary_short: Learn basic preparedness strategies for all disasters.
summary_medium: This module covers basic preparedness strategies applicable to all
  disasters, including planning, information gathering, and practice.
plain_language: Understand and implement basic strategies to prepare for any disaster,
  focusing on planning, gathering information, and practicing your plan.
markdown_body: "### What this is\nThis module introduces basic preparedness strategies\
  \ that can be applied to any type of disaster. It emphasizes the importance of having\
  \ a comprehensive plan that can be adapted to various hazards.\n\n### Why it matters\n\
  Being prepared for disasters can significantly reduce the impact on you and your\
  \ family. A well-thought-out plan ensures that you know what to do and where to\
  \ go in an emergency, which can save lives.\n\n### What you need\nTo get started,\
  \ you need to gather information about potential hazards, develop an emergency plan,\
  \ and assemble a disaster supplies kit.\n\n### How to do it\n1. Get informed about\
  \ hazards that may affect you. \n2. Develop an emergency plan that includes evacuation\
  \ routes and communication strategies. \n3. Assemble a disaster supplies kit with\
  \ essentials like food, water, and medical supplies. \n4. Identify community warning\
  \ systems and shelters. \n5. Practice your plan regularly to ensure everyone knows\
  \ what to do.\n\n### Common failure modes\nCommon issues include having an incomplete\
  \ emergency plan, not practicing the plan, and failing to update the plan with current\
  \ information.\n\n### Safety/boundary notes\nEnsure your plan includes safe evacuation\
  \ routes and that all family members are aware of them.\n\n### Local adaptation\
  \ notes\nAdapt your plan to include community-specific evacuation routes and local\
  \ warning systems."
structured_data:
  definition: Basic preparedness strategies involve planning and preparing for any
    type of disaster by gathering information, creating a plan, and practicing it.
  key_questions:
  - What hazards are most likely to affect my area?
  - What should be included in an emergency plan?
  - How can I ensure my family is prepared for a disaster?
  misconceptions:
  - Preparedness is only necessary for certain types of disasters.
  - Once a plan is made, it doesn't need to be updated.
