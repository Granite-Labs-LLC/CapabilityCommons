summary_short: Develop a community-based emergency plan with worksheets and guidance.
summary_medium: This module provides worksheets and guidance for creating a community-based
  emergency plan, focusing on hazard identification, evacuation routes, communication
  strategies, and disaster supplies checklists.
plain_language: Learn how to prepare for emergencies by identifying local hazards,
  planning evacuation routes, setting up communication plans, and assembling a disaster
  supplies kit.
markdown_body: "### What this is\nThis module helps you create a comprehensive emergency\
  \ plan using worksheets and checklists. It focuses on identifying community hazards,\
  \ planning evacuation routes, establishing communication strategies, and preparing\
  \ a disaster supplies kit.\n\n### Why it matters\nHaving a well-prepared emergency\
  \ plan can significantly reduce the risks and impacts of disasters on you and your\
  \ family. It ensures you know what to do, where to go, and how to communicate during\
  \ emergencies.\n\n### What you need\nYou will need access to community hazard information,\
  \ worksheets for planning, and checklists for assembling a disaster supplies kit.\n\
  \n### How to do it\n1. Obtain information about local hazards and community emergency\
  \ plans. \n2. Develop a family communication plan. \n3. Plan evacuation routes.\
  \ \n4. Assemble a disaster supplies kit using provided checklists.\n\n### Common\
  \ failure modes\nIncomplete hazard identification and lack of a communication plan\
  \ can lead to ineffective emergency preparedness.\n\n### Safety/boundary notes\n\
  Ensure that your plan includes considerations for special needs, such as disabilities,\
  \ and the care of animals.\n\n### Local adaptation notes\nAdapt your plan to include\
  \ community-specific hazards and local evacuation routes."
