markdown_body: '### What this is

  This reference sheet provides guidelines for safely returning to your home after
  an emergency situation.


  ### Why it matters

  Returning home after an emergency can be dangerous if proper precautions are not
  taken. Staying informed and avoiding hazardous areas can prevent further harm.


  ### What you need

  Access to a radio or television to receive updates and instructions.


  ### How to do it

  1. Continuously listen to the radio or watch television for updates on the situation.

  2. Avoid entering damaged areas or those marked as ''radiation hazard'' or ''HAZMAT''.

  3. Follow any specific instructions provided by authorities for returning home.


  ### Common failure modes

  Entering hazardous areas without proper information or ignoring official instructions
  can lead to serious risks.


  ### Safety/boundary notes

  Always stay away from areas marked as radiation hazards or HAZMAT zones, as these
  pose significant health risks.


  ### Local adaptation notes

  Ensure you have access to local news channels to receive timely updates and instructions.'
