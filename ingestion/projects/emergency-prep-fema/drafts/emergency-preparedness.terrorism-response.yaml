summary_short: Learn to prepare for and respond to terrorist threats.
summary_medium: This module guides you in preparing for and responding to terrorist
  threats, including recognizing terms, taking protective measures, and identifying
  resources.
plain_language: This guide helps you understand how to prepare for and respond to
  terrorist threats by recognizing key terms, taking protective measures, and knowing
  what actions to take during an event.
markdown_body: "### What this is\nThis module provides guidance on how to prepare\
  \ for and respond to terrorist threats. It includes recognizing important terms,\
  \ taking protective measures, and identifying resources for more information.\n\n\
  ### Why it matters\nTerrorist threats pose significant risks to national security,\
  \ including loss of life, property destruction, and economic impact. Being prepared\
  \ can help mitigate these risks.\n\n### What you need\nUnderstanding of local political\
  \ and technological contexts, a family disaster plan, and access to reliable information\
  \ sources.\n\n### How to do it\n1. Recognize important terms related to terrorism.\
  \ \n2. Include specific actions in your family disaster plan to address terrorist\
  \ threats. \n3. Take protective measures such as staying informed and having emergency\
  \ supplies ready. \n4. Know what actions to take if a terrorist event occurs, such\
  \ as following official instructions and seeking shelter.\n\n### Common failure\
  \ modes\nInadequate preparation and failure to recognize threats can lead to increased\
  \ vulnerability during a terrorist event.\n\n### Safety/boundary notes\nEnsure that\
  \ your actions do not cause panic or spread misinformation. Follow official guidance\
  \ and instructions.\n\n### Local adaptation notes\nConsider local political unrest\
  \ and technological infrastructure when preparing for terrorist threats."
