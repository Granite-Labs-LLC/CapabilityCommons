bundle_overrides:
  hook: Understanding how to prepare for and respond to terrorist threats can significantly
    reduce risks to your safety and well-being.
  primer: Terrorist threats are a serious concern that can impact national security,
    leading to loss of life, property damage, and economic disruption. Being prepared
    for such events is crucial to mitigate these risks. This involves recognizing
    key terms related to terrorism, incorporating specific actions into your family
    disaster plan, and taking protective measures such as staying informed and having
    emergency supplies ready. Knowing what actions to take during a terrorist event,
    such as following official instructions and seeking shelter, is also vital. Inadequate
    preparation and failure to recognize threats can increase vulnerability during
    such events. Therefore, understanding the local political and technological context
    and having access to reliable information sources are essential components of
    effective preparation.
  guide: '1. **Recognize Important Terms**: Familiarize yourself with key terms related
    to terrorism, such as ''shelter-in-place'', ''evacuation'', and ''emergency alert''.
    Understanding these terms will help you follow instructions during an event.


    2. **Develop a Family Disaster Plan**: Include specific actions in your plan to
    address terrorist threats. This should involve identifying safe areas in your
    home, establishing communication plans, and knowing evacuation routes.


    3. **Stay Informed**: Keep up-to-date with reliable news sources and official
    alerts. Sign up for local emergency notifications and understand the different
    types of alerts you might receive.


    4. **Prepare Emergency Supplies**: Assemble an emergency kit with essentials such
    as water, non-perishable food, a flashlight, batteries, a first-aid kit, and any
    necessary medications.


    5. **Know What to Do During an Event**: If a terrorist event occurs, follow official
    instructions immediately. This may involve seeking shelter, evacuating, or avoiding
    certain areas. Ensure all family members know these procedures.


    6. **Review and Update Regularly**: Regularly review and update your disaster
    plan and emergency supplies. Practice drills with your family to ensure everyone
    knows what to do.'
  reference:
  - Recognize important terms related to terrorism.
  - Include specific actions in your family disaster plan.
  - Stay informed with reliable sources.
  - Prepare emergency supplies.
  - Follow official instructions during an event.
  - Review and update your plan regularly.
  worksheet:
  - List five key terms related to terrorism and their meanings.
  - Create a checklist of items for your emergency supply kit.
  - Draft a communication plan for your family in case of a terrorist event.
  - Identify and mark evacuation routes from your home.
  - Role-play a scenario where you follow official instructions during a terrorist
    event.
  teach_forward_kit:
    three_minute_version: Terrorist threats are serious risks that require preparation.
      Recognize key terms, include specific actions in your family disaster plan,
      stay informed, and prepare emergency supplies. Know what to do during an event
      and review your plan regularly.
    ten_minute_outline:
    - Introduction to terrorist threats and their impact.
    - Importance of recognizing key terms.
    - Steps to develop a family disaster plan.
    - How to stay informed and prepare emergency supplies.
    - Actions to take during a terrorist event.
    - Reviewing and updating your plan.
    discussion_prompts:
    - Why is it important to recognize key terms related to terrorism?
    - What challenges might you face when preparing for a terrorist threat?
    - How can staying informed help mitigate the risks of a terrorist event?
    - What are some common mistakes people make in their disaster planning?
    - How can you ensure your family is prepared for a terrorist threat?
