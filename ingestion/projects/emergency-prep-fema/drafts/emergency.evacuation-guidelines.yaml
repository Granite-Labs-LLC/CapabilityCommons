summary_short: Guidelines for safe evacuation during emergencies.
summary_medium: Evacuation guidelines include maintaining a full tank of gas, making
  transportation arrangements, listening to local instructions, and securing your
  home. Additional steps if time permits include gathering supplies and notifying
  others of your plans.
plain_language: Learn how to safely evacuate during an emergency by keeping your car
  ready, planning your route, and securing your home.
markdown_body: '# What this is

  This is a set of guidelines to help you evacuate safely during an emergency. It
  includes steps to prepare your vehicle, secure your home, and follow local instructions.


  # Why it matters

  Evacuating safely can protect you and your family from harm during emergencies like
  severe weather or other disasters. Proper preparation can prevent delays and ensure
  you have the necessary supplies.


  # What you need

  A full tank of gas, a battery-powered radio, a disaster supplies kit, sturdy shoes,
  and protective clothing.


  # How to do it

  1. Keep your car''s gas tank full if evacuation seems likely.

  2. Arrange transportation if you don''t have a car.

  3. Listen to a battery-powered radio for local instructions.

  4. Gather your family and evacuate if instructed.

  5. Follow recommended routes and avoid shortcuts.

  6. Secure your home by locking doors and windows and unplugging small appliances.

  7. Notify others of your evacuation plans.


  # Common failure modes

  Running out of gas, taking blocked shortcuts, not securing your home properly.


  # Safety/boundary notes

  Avoid flooded areas and stay away from downed power lines.


  # Local adaptation notes

  Adjust your evacuation plan based on local geography and available resources.'
