summary_short: Understand local hazards and emergency plans.
summary_medium: Learn about potential hazards in your community, assess the risks,
  and understand local emergency plans for warnings and evacuations.
plain_language: Find out what kinds of emergencies might happen in your area and how
  to prepare for them by checking with local emergency services.
markdown_body: '### What this is

  This concept involves understanding the specific hazards that could affect your
  community, assessing the risks they pose, and familiarizing yourself with local
  emergency plans.


  ### Why it matters

  Being informed about potential hazards and emergency plans helps you prepare effectively,
  reducing risk and ensuring safety during emergencies.


  ### What you need

  Access to information from local emergency management offices or the American Red
  Cross.


  ### How to do it

  Contact your local emergency management office or the American Red Cross to gather
  information about community hazards and emergency plans. Record this information
  for future reference.


  ### Common failure modes

  Failing to gather complete information or misunderstanding the risks and plans can
  lead to inadequate preparation.


  ### Safety/boundary notes

  Ensure the information is up-to-date and specific to your community.


  ### Local adaptation notes

  Consider local hazards and protocols, as these can vary significantly between communities.'
structured_data:
  definition: Understanding local hazards and emergency plans.
  key_questions:
  - What hazards are most likely to affect my community?
  - What are the risks associated with these hazards?
  - What are the local plans for warnings and evacuations?
  misconceptions:
  - Assuming all communities face the same hazards.
  - Believing that emergency plans are unnecessary.
