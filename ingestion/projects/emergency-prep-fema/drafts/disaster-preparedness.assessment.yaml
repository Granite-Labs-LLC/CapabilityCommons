plain_language: This assessment helps you understand and evaluate the disaster risks
  in your new location and how to prepare for them.
markdown_body: '# What this is

  This is an assessment scenario designed to help you evaluate your preparedness for
  local disaster risks after moving to a new location.


  # Why it matters

  Understanding the specific disaster risks in your area is crucial for effective
  preparedness. This ensures you have the right supplies and plans in place to protect
  yourself and your family.


  # What you need

  You need to assess local environmental risks, maintain appropriate disaster supplies,
  and consider insurance needs based on your new location.


  # How to do it

  1. Evaluate the local risks by researching environmental hazards specific to your
  area. 2. Maintain a disaster supplies kit tailored to these risks. 3. Consider insurance
  options that cover potential local disasters, such as flood insurance.


  # Common failure modes

  A common mistake is underestimating local risks due to unfamiliarity with the new
  environment or relying solely on neighbors'' perceptions.


  # Safety/boundary notes

  Ensure that your disaster plan includes all family members and considers any specific
  needs, such as medical requirements.


  # Local adaptation notes

  Adapt your disaster preparedness plan based on changes in the local environment
  and community risk perceptions.'
