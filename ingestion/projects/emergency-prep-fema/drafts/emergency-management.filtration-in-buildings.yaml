summary_short: Guidance on filtration systems in buildings to protect against biological
  agents.
summary_medium: This reference sheet provides guidance on determining the type and
  level of filtration in buildings to protect against biological agents, with technical
  details available from NIOSH.
plain_language: Learn how to assess and implement filtration systems in buildings
  to protect against biological threats.
markdown_body: "# Filtration in Buildings for Biological Protection\n\n## What this\
  \ is\nThis reference sheet provides guidance on filtration systems in buildings\
  \ to protect against biological agents. It includes information on determining the\
  \ type and level of filtration needed and references technical guidance from NIOSH.\n\
  \n## Why it matters\nFiltration systems are crucial for protecting building occupants\
  \ from airborne biological threats. Understanding and implementing the right filtration\
  \ can significantly reduce the risk of exposure during a biological attack.\n\n\
  ## What you need\nAccess to the NIOSH publication for detailed technical guidance\
  \ on filtration systems.\n\n## How to do it\n1. Determine the type and level of\
  \ filtration in your building. \n2. Assess the level of protection it provides against\
  \ biological agents. \n3. Refer to the NIOSH publication for technical guidance.\
  \ \n4. Stay informed through media and official channels during a biological attack.\n\
  \n## Common failure modes\nFailing to assess the current filtration system's effectiveness\
  \ or not updating systems according to the latest guidelines can leave occupants\
  \ vulnerable.\n\n## Safety/boundary notes\nIn the event of exposure to a biological\
  \ agent, follow official instructions for decontamination and seek medical assistance.\n\
  \n## Local adaptation notes\nConsider local regulations and building codes when\
  \ implementing or upgrading filtration systems."
structured_data:
  definition: Filtration systems in buildings are designed to remove airborne biological
    agents to protect occupants.
  key_questions:
  - What type of filtration system is currently in place?
  - Does the filtration system meet the recommended standards for biological protection?
  misconceptions:
  - All filtration systems provide the same level of protection.
  - Once installed, filtration systems do not require maintenance or updates.
