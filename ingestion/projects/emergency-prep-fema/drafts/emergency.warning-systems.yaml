summary_short: Overview of national and local emergency warning systems.
summary_medium: This reference sheet provides an overview of the Emergency Alert System
  (EAS) and NOAA Weather Radio (NWR), key components of national and local emergency
  warning systems.
plain_language: Learn about the systems used to warn the public during emergencies,
  including the Emergency Alert System and NOAA Weather Radio.
markdown_body: '### What this is

  Emergency warning systems are designed to alert the public about imminent threats
  or emergencies. The Emergency Alert System (EAS) is a national public warning system
  that requires broadcasters, satellite digital audio service and direct broadcast
  satellite providers to provide the President with a communications capability to
  address the American people within 10 minutes during a national emergency. NOAA
  Weather Radio (NWR) is a nationwide network of radio stations broadcasting continuous
  weather information directly from the nearest National Weather Service office.


  ### Why it matters

  These systems are crucial for public safety, providing timely alerts that can save
  lives and reduce harm during emergencies. Understanding and accessing these systems
  ensures you receive critical information when it matters most.


  ### What you need

  To effectively use these systems, you need to ensure your local radio and TV stations
  participate in the EAS and determine if NOAA Weather Radio is available in your
  area. If available, consider purchasing a NOAA weather radio receiver.


  ### How to do it

  1. Check with local radio and TV stations to confirm their participation in the
  EAS. 2. Determine the availability of NOAA Weather Radio in your area by contacting
  local authorities or visiting the National Weather Service website. 3. Purchase
  a NOAA weather radio receiver if NWR is available. 4. Stay informed about local
  community warning methods by consulting local authorities.


  ### Common failure modes

  A common failure mode is the lack of awareness of local warning systems, which can
  lead to missed alerts and increased risk during emergencies.


  ### Safety/boundary notes

  Ensure that your NOAA weather radio receiver is properly configured and maintained
  to receive alerts effectively.


  ### Local adaptation notes

  The availability of NOAA Weather Radio and participation of local stations in the
  EAS may vary. Check with local authorities for specific information relevant to
  your area.'
