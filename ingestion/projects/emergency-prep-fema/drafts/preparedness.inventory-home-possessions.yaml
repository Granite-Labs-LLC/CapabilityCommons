bundle_overrides:
  hook: Creating an inventory of your home possessions is essential for ensuring you
    have proof of ownership and condition, making insurance claims easier in case
    of damage or loss.
  primer: An inventory of your home possessions is a detailed record of all the items
    you own, including their value and condition. This record is crucial for insurance
    purposes, as it provides proof of ownership and helps you file claims efficiently
    if your belongings are damaged or lost. To create an inventory, you will need
    a camera or smartphone to take photos or videos of your items. Optionally, you
    can use the Household and Personal Property Inventory Book to organize your records.
    Start by photographing or filming the interior and exterior of your home, focusing
    on personal belongings. Log details about each item, such as purchase date and
    value, in your inventory book. Regularly updating your inventory and storing it
    securely, such as in a safety deposit box, is important to ensure your records
    remain complete and accessible. Consider local risks, like floods, when deciding
    which items to prioritize in your inventory.
  guide: '1. Gather your tools: a camera or smartphone and, optionally, the Household
    and Personal Property Inventory Book.

    2. Begin by taking photos or videos of the exterior of your home. Capture all
    angles to ensure comprehensive coverage.

    3. Move inside and photograph or film each room. Focus on capturing high-value
    items and unique belongings.

    4. For each item, note down details such as the purchase date, value, and any
    identifying features. Use the inventory book to organize this information.

    5. Consider local risks, like floods, and prioritize documenting items that may
    be more vulnerable.

    6. Regularly update your inventory to reflect new purchases or changes in item
    condition.

    7. Store your inventory securely, such as in a safety deposit box or a secure
    digital location, to prevent loss or unauthorized access.

    8. Review your inventory periodically to ensure it remains accurate and complete.'
  reference:
  - Camera or smartphone
  - Household and Personal Property Inventory Book
  - Photos/videos of home interior and exterior
  - 'Details of each item: purchase date, value, identifying features'
  - Secure storage for inventory records
  worksheet:
  - List five high-value items in your home and take photos of them.
  - Record the purchase date and estimated value of each item.
  - Create a digital folder to store your inventory photos and details.
  - Identify a secure location to store your inventory records.
  - Update your inventory with any new items purchased in the last six months.
  teach_forward_kit:
    three_minute_version: Creating a home inventory involves photographing your belongings,
      noting their details, and storing this information securely. This helps with
      insurance claims if items are damaged or lost.
    ten_minute_outline:
    - Introduction to the importance of a home inventory
    - 'Tools needed: camera, inventory book'
    - 'Steps to create an inventory: photographing, recording details'
    - Importance of regular updates and secure storage
    - Consideration of local risks in inventory prioritization
    discussion_prompts:
    - Why is it important to have a home inventory?
    - What challenges might you face when creating an inventory?
    - How can you ensure your inventory remains up-to-date?
    - What are some secure ways to store your inventory records?
