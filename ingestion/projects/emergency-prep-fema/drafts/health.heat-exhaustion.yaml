summary_short: Heat exhaustion is caused by fluid loss in hot, humid conditions, potentially
  leading to heat stroke.
summary_medium: Heat exhaustion occurs when people lose fluids through heavy sweating
  in hot, humid environments, leading to mild shock and potentially progressing to
  heat stroke if untreated.
plain_language: Heat exhaustion happens when you lose too much fluid from sweating
  in hot weather, which can make you feel weak and dizzy. If it gets worse, it can
  turn into a more serious condition called heat stroke.
markdown_body: '### What this is

  Heat exhaustion is a condition that occurs when the body loses too much fluid through
  sweating, especially during heavy exercise or work in hot, humid environments. This
  fluid loss can lead to a decrease in blood flow to vital organs, resulting in mild
  shock.


  ### Why it matters

  Understanding heat exhaustion is important because if it is not treated, it can
  progress to heat stroke, a more severe condition that can be life-threatening. Recognizing
  the signs early can prevent serious health issues.


  ### What you need

  Awareness of the symptoms of heat exhaustion and the conditions that can lead to
  it is crucial. Staying hydrated and taking breaks in cool environments can help
  prevent it.


  ### How to do it

  To prevent heat exhaustion, ensure you drink plenty of fluids, take regular breaks
  in shaded or cool areas, and wear lightweight, loose-fitting clothing. If symptoms
  occur, move to a cooler place, rest, and hydrate.


  ### Common failure modes

  Ignoring early symptoms of heat exhaustion can lead to progression to heat stroke.
  Not drinking enough fluids or failing to take breaks in hot conditions are common
  mistakes.


  ### Safety/boundary notes

  Always prioritize hydration and rest in hot environments. Be aware of your body''s
  signals and act promptly if you feel unwell.


  ### Local adaptation notes

  In areas with high humidity, the risk of heat exhaustion increases. Adapt work and
  exercise routines to include more frequent breaks and hydration.'
