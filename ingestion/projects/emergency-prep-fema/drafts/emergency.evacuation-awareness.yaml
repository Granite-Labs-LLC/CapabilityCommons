summary_short: Evacuations are frequent due to various emergencies.
summary_medium: Evacuations occur frequently due to emergencies like industrial accidents,
  fires, floods, and hurricanes. Understanding these can aid preparedness.
plain_language: Evacuations happen more often than people think, often due to accidents
  or natural disasters. Knowing how often and why they occur can help you be better
  prepared.
markdown_body: '### What this is

  This concept note explains the frequency and causes of evacuations, emphasizing
  their commonality and the importance of preparedness.


  ### Why it matters

  Understanding how often evacuations occur and the reasons behind them can help individuals
  and communities prepare effectively, reducing panic and ensuring safety during emergencies.


  ### What you need

  Awareness of local evacuation routes and access to evacuation maps if available.


  ### How to do it

  Contact local authorities to learn about designated evacuation routes. Record specific
  directions for your evacuation route and ensure you have access to a map with marked
  routes.


  ### Common failure modes

  Failing to know evacuation routes or not having a plan can lead to confusion and
  delays during an emergency.


  ### Safety/boundary notes

  Ensure that evacuation plans consider the safety of all family members, including
  pets and individuals with special needs.


  ### Local adaptation notes

  Check with local authorities for the availability of evacuation maps and any specific
  regional evacuation procedures.'
structured_data:
  definition: Evacuations are organized departures from an area due to emergencies.
  key_questions:
  - How often do evacuations occur in my area?
