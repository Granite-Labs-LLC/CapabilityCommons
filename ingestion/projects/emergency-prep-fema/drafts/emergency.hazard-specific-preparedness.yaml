bundle_overrides:
  hook: Understanding how to prepare for specific hazards like tornadoes and hurricanes
    can significantly reduce risks to your safety and property.
  primer: Hazard-specific preparedness is about knowing the right actions to take
    before, during, and after different types of emergencies, such as tornadoes and
    hurricanes. Each hazard presents unique challenges and requires tailored responses
    to ensure safety and minimize damage. For instance, during a tornado, seeking
    a safe shelter is crucial, while for hurricanes, securing your property can prevent
    significant loss. By learning these specific actions, you can protect yourself
    and your loved ones more effectively. Integrating this knowledge into a family
    disaster plan ensures everyone knows what to do when a hazard strikes. It's important
    to identify the hazards most likely to occur in your area, gather relevant information,
    and communicate this with all family members. This proactive approach not only
    enhances your preparedness but also boosts your confidence in handling emergencies.
  guide: "1. **Identify Local Hazards**: Start by researching the types of hazards\
    \ that are most likely to occur in your area. This could include natural disasters\
    \ like tornadoes, hurricanes, floods, or earthquakes. \n\n2. **Gather Information**:\
    \ Once you've identified potential hazards, gather detailed information on what\
    \ actions to take before, during, and after each event. Reliable sources include\
    \ government websites, local emergency management offices, and community workshops.\
    \ \n\n3. **Create a Family Disaster Plan**: Incorporate the hazard-specific actions\
    \ into a comprehensive family disaster plan. This plan should outline roles and\
    \ responsibilities for each family member, emergency contacts, and evacuation\
    \ routes. \n\n4. **Communicate and Practice**: Share the plan with all family\
    \ members and ensure everyone understands their role. Conduct regular drills to\
    \ practice the plan, making adjustments as necessary to address any issues that\
    \ arise. \n\n5. **Update Regularly**: Keep your plan up-to-date by reviewing it\
    \ annually or whenever there are changes in your family or local environment.\
    \ Ensure that all information, such as emergency contacts and evacuation routes,\
    \ is current."
  reference:
  - Identify local hazards.
  - Gather hazard-specific information.
  - Create and share a family disaster plan.
  - Conduct regular drills.
  - Update the plan regularly.
  worksheet:
  - List three hazards that are likely to occur in your area.
  - Describe specific actions to take before, during, and after one of these hazards.
  - Draft a basic family disaster plan including roles and responsibilities.
  - Conduct a mock drill with your family and note any improvements needed.
  - Review and update your family disaster plan with any new information.
  teach_forward_kit:
    three_minute_version: Hazard-specific preparedness involves knowing what to do
      before, during, and after emergencies like tornadoes and hurricanes. By identifying
      local hazards and integrating this knowledge into a family disaster plan, you
      can significantly reduce risks to safety and property.
    ten_minute_outline:
    - Introduction to hazard-specific preparedness.
    - Importance of understanding local hazards.
    - Steps to create a family disaster plan.
    - Role of communication and practice in preparedness.
    - Regular updates and reviews of the plan.
    discussion_prompts:
    - What are the most common hazards in our area?
    - How can we ensure all family members understand the disaster plan?
    - What challenges might we face in executing our plan during an actual emergency?
    - How often should we update our family disaster plan and why?
