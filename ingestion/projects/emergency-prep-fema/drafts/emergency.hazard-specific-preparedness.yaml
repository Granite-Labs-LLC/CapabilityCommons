summary_short: Learn actions to take before, during, and after specific hazards.
summary_medium: Guidance on actions to take before, during, and after specific hazards,
  such as seeking shelter during a tornado and reducing property loss from a hurricane.
  Encourages integrating hazard-specific information into family disaster plans.
plain_language: This guide helps you prepare for different types of emergencies by
  explaining what to do before, during, and after specific hazards like tornadoes
  and hurricanes. It also suggests including this information in your family disaster
  plan.
markdown_body: '### What this is

  This module provides guidance on preparing for specific hazards by detailing actions
  to take before, during, and after events such as tornadoes and hurricanes.


  ### Why it matters

  Understanding hazard-specific actions can significantly reduce risks to personal
  safety and property. Integrating this knowledge into a family disaster plan enhances
  preparedness and response effectiveness.


  ### What you need

  Identify local hazards that are likely to occur. Gather information on these hazards
  and ensure all family members are informed.


  ### How to do it

  1. Identify hazards relevant to your area. 2. Study specific actions for each hazard.
  3. Share this information with your family. 4. Incorporate these actions into your
  family disaster plan.


  ### Common failure modes

  Failing to identify local hazards, not updating the family disaster plan, and not
  communicating the plan with all family members.


  ### Safety/boundary notes

  Ensure that all actions taken are safe and appropriate for the specific hazard and
  local conditions.


  ### Local adaptation notes

  Customize your family disaster plan based on local hazards and resources available
  in your area.'
