markdown_body: '# What this is

  This project blueprint guides you in creating a family disaster plan to ensure safety
  and preparedness during emergencies.


  # Why it matters

  Having a family disaster plan helps ensure that all family members know what to
  do and where to go during an emergency, reducing panic and confusion.


  # What you need

  Gather information about local hazards, warning systems, evacuation routes, and
  community emergency plans. Assemble your family to discuss and plan.


  # How to do it

  1. Gather family members and review local emergency information.

  2. Discuss potential scenarios and what to do if family members are not home.

  3. Plan escape routes and establish a family communication strategy.

  4. Learn how to shut off utilities safely.

  5. Consider special needs and care for animals.

  6. Ensure insurance and vital records are accessible.


  # Common failure modes

  Lack of communication and an incomplete plan can lead to confusion and danger during
  an emergency.


  # Safety/boundary notes

  Ensure all family members understand the plan and practice it regularly.


  # Local adaptation notes

  Adapt the plan to include community-specific evacuation routes and local warning
  systems.'
