  worksheet:
  - List the local hazards and warning systems relevant to your area.
  - Draw a floor plan of your home and mark two escape routes from each room.
  - Create a family communication plan, including meeting places and contact methods.
  - Identify the locations of utility shut-off valves and practice turning them off.
  - Discuss and document any special needs or considerations for family members and
    pets.
  - Compile a list of vital records and ensure they are stored securely and accessibly.
  teach_forward_kit:
    three_minute_version: Creating a family disaster plan involves gathering local
      emergency information, planning escape routes, establishing communication strategies,
      and ensuring the safety of all family members, including pets. Regular practice
      and updates to the plan are essential.
    ten_minute_outline:
    - Introduction to the importance of a family disaster plan
    - Gathering local emergency information
    - Planning escape routes and practicing them
    - Establishing a family communication strategy
    - Learning utility shut-off procedures
    - Considering special needs and pet care
    - Ensuring accessibility of vital records
    - Reviewing and practicing the plan regularly
    discussion_prompts:
    - Why is it important to have a family disaster plan?
    - What challenges might arise when creating and implementing a disaster plan?
    - How can families ensure that their disaster plan remains effective over time?
    - What are some specific considerations for families with pets or special needs
      members?
