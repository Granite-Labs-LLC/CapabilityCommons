bundle_overrides:
  hook: Creating a family disaster plan ensures everyone knows what to do during an
    emergency, reducing panic and confusion.
  primer: Emergencies can happen at any time, and being prepared can make all the
    difference in ensuring your family's safety. A family disaster plan is a comprehensive
    strategy that outlines how your family will respond to various emergency situations.
    This plan should include information about local hazards, warning systems, evacuation
    routes, and community emergency plans. It is essential to gather all family members
    to discuss potential scenarios and decide on a course of action if family members
    are not home during an emergency. Planning escape routes and establishing a communication
    strategy are crucial components of the plan. Additionally, learning how to safely
    shut off utilities, considering special needs, and ensuring the care of pets are
    important aspects to address. Finally, make sure that insurance and vital records
    are easily accessible. By taking the time to create and practice a family disaster
    plan, you can help ensure that everyone knows what to do and where to go, minimizing
    confusion and stress during an emergency.
  guide: '1. **Gather Information**: Start by collecting information about local hazards,
    warning systems, evacuation routes, and community emergency plans. This will form
    the foundation of your family disaster plan.


    2. **Family Meeting**: Assemble your family to discuss the gathered information.
    Talk about potential emergency scenarios and what each family member should do
    if they are not at home when an emergency occurs.


    3. **Plan Escape Routes**: Draw a floor plan of your home, marking two escape
    routes from each room. Ensure that all family members are familiar with these
    routes and practice them regularly.


    4. **Communication Strategy**: Establish a communication plan. Decide on a meeting
    place outside your home and another outside your neighborhood in case you cannot
    return home. Ensure everyone knows how to contact each other during an emergency.


    5. **Utility Management**: Learn how to safely shut off utilities such as gas,
    water, and electricity. Make sure all family members know where the shut-off valves
    are located and how to operate them.


    6. **Special Needs and Pets**: Consider any special needs of family members and
    plan accordingly. Ensure that pets are included in your emergency plan, with provisions
    for their care and transportation.


    7. **Vital Records**: Ensure that important documents such as insurance policies,
    identification, and medical records are easily accessible. Consider keeping copies
    in a secure, waterproof container.


    8. **Review and Practice**: Regularly review and update your plan. Practice it
    with your family to ensure everyone knows what to do and feels confident in their
    roles.'
