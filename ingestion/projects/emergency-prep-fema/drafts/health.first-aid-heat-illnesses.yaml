markdown_body: '### What this is

  This reference sheet outlines the symptoms and first aid treatments for various
  heat-induced illnesses, including sunburn, heat cramps, heat exhaustion, and heat
  stroke.


  ### Why it matters

  Extreme heat can lead to serious health issues. Knowing how to identify and treat
  these conditions promptly can prevent complications and save lives.


  ### What you need

  - Cool water

  - Cool, wet cloths

  - Fans

  - Air conditioners


  ### How to do it

  - **Sunburn**: Take a shower to remove oils and apply sterile dressings to blisters.

  - **Heat Cramps**: Move to a cooler location, stretch muscles, and drink cool water.

  - **Heat Exhaustion**: Lie down in a cool place, apply wet cloths, and drink water
  slowly.

  - **Heat Stroke**: Call emergency services, move to a cooler environment, and use
  cool baths or fans.


  ### Common failure modes

  Delaying treatment or applying incorrect first aid can worsen the condition.


  ### Safety/boundary notes

  Use extreme caution, especially with heat stroke, and seek immediate medical attention.


  ### Local adaptation notes

  Consider the availability of medical services and local climate conditions when
  applying these guidelines.'
