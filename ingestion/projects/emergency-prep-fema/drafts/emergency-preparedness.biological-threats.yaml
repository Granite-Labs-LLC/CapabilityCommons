summary_short: Overview of biological threats and their characteristics.
summary_medium: Learn about biological threats, including types of agents, their characteristics,
  and methods of dispersion.
plain_language: Biological threats involve harmful organisms or toxins that can affect
  humans, animals, and plants. Understanding these threats helps in preparing for
  potential biological attacks.
markdown_body: '### What this is

  Biological threats involve the use of organisms or toxins to harm or incapacitate
  humans, animals, or crops. These threats can come from bacteria, viruses, or toxins.


  ### Why it matters

  Understanding biological threats is crucial for preparedness and response to potential
  attacks that could impact public health and safety.


  ### What you need

  Awareness of the types of biological agents and their dispersion methods is essential
  for effective preparedness.


  ### How to do it

  Biological agents can be dispersed through aerosols, animals, contaminated food
  and water, and person-to-person contact. It''s important to follow official guidance
  on decontamination and prevention.


  ### Common failure modes

  Challenges include the difficulty in growing and maintaining agents and their breakdown
  in sunlight.


  ### Safety/boundary notes

  Ensure to follow official instructions for decontamination, such as cooking food
  and boiling water to deactivate toxins.


  ### Local adaptation notes

  Local conditions may affect the persistence and spread of biological agents, requiring
  tailored response strategies.'
structured_data:
  definition: Biological threats are the use of organisms or toxins to harm or incapacitate
    living beings.
  key_questions:
  - What are the main types of biological agents?
  - How can biological agents be dispersed?
  - What are effective methods for decontamination?
  misconceptions:
  - All biological agents are long-lived.
  - Boiling water for a short time is always sufficient to kill microbes.
