    - Assessing Home Safety
    - Seeking Disaster Assistance
    - Coping with Emotional Impact
    - Community Engagement and Support
    discussion_prompts:
    - Why is it important to follow health and safety guidelines after a disaster?
    - What are some challenges you might face when assessing your home for safety?
    - How can community support aid in disaster recovery?
    - What coping strategies have you found effective in stressful situations?
