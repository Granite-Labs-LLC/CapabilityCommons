summary_short: Guidelines for recovering from a disaster.
summary_medium: This module provides essential guidelines for health and safety, returning
  home, seeking disaster assistance, coping with disaster, and helping others after
  a disaster.
plain_language: Learn how to safely recover from a disaster, including returning home,
  getting help, and supporting your community.
markdown_body: "### What this is\nThis module offers a comprehensive guide to recovering\
  \ from a disaster. It covers important aspects such as ensuring health and safety,\
  \ returning to your home, seeking assistance, coping with the aftermath, and helping\
  \ others.\n\n### Why it matters\nRecovering from a disaster can be overwhelming.\
  \ Having clear guidelines helps ensure safety, access to necessary resources, and\
  \ community support, which are crucial for effective recovery.\n\n### What you need\n\
  Awareness of local resources, understanding of safety protocols, and a plan for\
  \ accessing disaster assistance.\n\n### How to do it\n1. Follow health and safety\
  \ guidelines to protect yourself and others. \n2. Assess your home for safety before\
  \ returning. \n3. Seek disaster assistance from local and federal agencies. \n4.\
  \ Use coping strategies to manage stress and emotional impact. \n5. Engage in community\
  \ recovery efforts by helping others.\n\n### Common failure modes\nInadequate recovery\
  \ planning can lead to prolonged distress and safety risks.\n\n### Safety/boundary\
  \ notes\nEnsure that all actions taken during recovery prioritize personal and community\
  \ safety.\n\n### Local adaptation notes\nAdapt guidelines to fit local resources\
  \ and community needs."
