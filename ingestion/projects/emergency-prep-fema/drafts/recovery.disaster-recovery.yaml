bundle_overrides:
  hook: Recovering from a disaster can be overwhelming, but having a clear plan ensures
    safety and access to necessary resources.
  primer: Disaster recovery is a crucial process that involves returning to normalcy
    after experiencing a catastrophic event. It encompasses various aspects such as
    ensuring health and safety, assessing the safety of your home, seeking assistance,
    coping with emotional stress, and helping others in your community. The importance
    of disaster recovery cannot be overstated, as it helps individuals and communities
    regain stability and rebuild their lives. Key elements of disaster recovery include
    following health and safety guidelines to protect yourself and others, assessing
    your home for safety before returning, and seeking disaster assistance from local
    and federal agencies. Additionally, coping strategies are vital for managing stress
    and emotional impact, while engaging in community recovery efforts can foster
    a sense of unity and support. Being aware of local resources, understanding safety
    protocols, and having a plan for accessing disaster assistance are essential for
    effective recovery.
  guide: "1. **Follow Health and Safety Guidelines**: Immediately after a disaster,\
    \ prioritize your safety and the safety of others. Follow any official instructions\
    \ and avoid hazardous areas. \n\n2. **Assess Your Home for Safety**: Before returning\
    \ home, ensure it is safe. Check for structural damage, gas leaks, and other hazards.\
    \ If in doubt, consult professionals. \n\n3. **Seek Disaster Assistance**: Contact\
    \ local and federal agencies for assistance. This may include temporary housing,\
    \ financial aid, and other resources. Keep records of any damage and expenses\
    \ for claims. \n\n4. **Use Coping Strategies**: Disasters can be emotionally taxing.\
    \ Engage in activities that help manage stress, such as talking to loved ones,\
    \ seeking professional help, or participating in community support groups. \n\n\
    5. **Engage in Community Recovery Efforts**: Helping others can be therapeutic\
    \ and beneficial for the community. Volunteer in local recovery efforts, support\
    \ neighbors, and share resources. \n\nRemember, recovery is a gradual process,\
    \ and it’s important to take it step by step, ensuring safety and well-being at\
    \ each stage."
  reference:
  - Health and safety guidelines
  - Assess home safety
  - Seek disaster assistance
  - Coping strategies
  - Community recovery efforts
  worksheet:
