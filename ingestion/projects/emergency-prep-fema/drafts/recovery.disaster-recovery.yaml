  - Plan a simple way to help your community recover from a disaster.
  teach_forward_kit:
    three_minute_version: Disaster recovery involves ensuring safety, assessing home
      conditions, seeking assistance, managing stress, and helping the community.
      Follow guidelines to protect yourself and others, and engage in recovery efforts
      to rebuild and support your community.
    ten_minute_outline:
