summary_short: Learn to prepare for technological hazards like hazardous materials
  incidents and nuclear power plant failures.
summary_medium: This module covers preparedness for technological hazards, including
  hazardous materials incidents and nuclear power plant failures. It includes recognizing
  terms, taking protective measures, and knowing actions to take during events.
plain_language: Understand how to prepare for and respond to technological hazards,
  such as chemical spills and nuclear plant issues, by learning key terms, protective
  actions, and resources.
markdown_body: '# What this is

  This module is about preparing for technological hazards, which include incidents
  involving hazardous materials and failures at nuclear power plants.


  # Why it matters

  Technological hazards can occur with little or no warning and may have long-term
  health impacts. Understanding these hazards helps in reducing risks and protecting
  health and safety.


  # What you need

  Familiarity with household chemicals and basic safety procedures for handling and
  disposing of them.


  # How to do it

  1. Recognize important terms related to technological hazards.

  2. Learn protective measures to take before, during, and after an incident.

  3. Identify resources for more information and assistance.


  # Common failure modes

  Human error and hidden toxic waste are common issues that can lead to technological
  hazards.


  # Safety/boundary notes

  Ensure safe storage and disposal of household chemicals to minimize risk.


  # Local adaptation notes

  Consider local industrial activities and potential hazards specific to your area.'
