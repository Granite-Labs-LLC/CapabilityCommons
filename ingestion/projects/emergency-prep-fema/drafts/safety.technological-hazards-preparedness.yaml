bundle_overrides:
  hook: Technological hazards can strike without warning, but understanding them can
    significantly reduce risks and protect your health and safety.
  primer: Technological hazards refer to incidents that arise from human-made sources,
    such as hazardous materials spills and nuclear power plant failures. These events
    can occur suddenly and without warning, potentially leading to long-term health
    impacts. Being prepared for such hazards is crucial for minimizing risks and ensuring
    safety. Preparation involves understanding the nature of these hazards, recognizing
    key terms, and knowing the protective measures to take before, during, and after
    an incident. Common issues leading to technological hazards include human error
    and the presence of hidden toxic waste. Familiarity with household chemicals and
    basic safety procedures for handling and disposing of them is essential. By learning
    how to safely store and dispose of these chemicals, you can reduce the potential
    for injury to people and the environment. This knowledge not only helps in safeguarding
    your health but also contributes to community safety.
  guide: "1. **Recognize Key Terms**: Familiarize yourself with terms related to technological\
    \ hazards, such as 'hazardous materials' and 'nuclear incidents'. Understanding\
    \ these terms will help you identify potential risks. \n\n2. **Learn Protective\
    \ Measures**: Before an incident, ensure you know how to safely store and dispose\
    \ of household chemicals. During an incident, follow official guidance and evacuate\
    \ if necessary. After an incident, avoid affected areas until they are declared\
    \ safe. \n\n3. **Identify Resources**: Know where to find reliable information\
    \ and assistance. This could include local emergency services, government websites,\
    \ and community resources. \n\n4. **Understand Common Failure Modes**: Be aware\
    \ that human error and hidden toxic waste are common causes of technological hazards.\
    \ This awareness can help you take proactive steps to prevent incidents. \n\n\
    5. **Safety Procedures**: Regularly check the storage of household chemicals to\
    \ ensure they are secure and not expired. Follow guidelines for the disposal of\
    \ hazardous materials to prevent environmental contamination. \n\n6. **Local Adaptation**:\
    \ Consider the specific industrial activities in your area that might pose technological\
    \ hazards. Tailor your preparedness plans to address these local risks."
  reference:
  - 'Technological hazards: incidents from human-made sources.'
  - 'Hazardous materials: chemicals that pose risks to health and safety.'
  - 'Nuclear incidents: failures or accidents at nuclear power plants.'
  - 'Human error: a common cause of technological hazards.'
  - 'Hidden toxic waste: improperly disposed of hazardous materials.'
  - 'Protective measures: actions to reduce risk before, during, and after incidents.'
  worksheet:
  - List three examples of technological hazards in your area.
  - Identify and define five key terms related to technological hazards.
  - Outline a plan for safely storing and disposing of household chemicals.
  - Research and list local resources for information and assistance during a technological
    hazard.
  - Describe a scenario involving a technological hazard and the steps you would take
    to respond.
  teach_forward_kit:
    three_minute_version: Technological hazards, such as chemical spills and nuclear
      incidents, can occur without warning and have long-term health impacts. Understanding
      these hazards and knowing how to respond can significantly reduce risks. Key
      steps include recognizing important terms, learning protective measures, and
      identifying resources for assistance.
    ten_minute_outline:
    - Introduction to technological hazards
    - Importance of preparedness
    - Key terms and definitions
    - Protective measures before, during, and after incidents
    - Common causes of technological hazards
    - Local adaptation and resources
    discussion_prompts:
    - What are some technological hazards you might encounter in your community?
    - How can human error contribute to technological hazards?
    - Why is it important to safely store and dispose of household chemicals?
    - What resources are available to help you prepare for technological hazards?
