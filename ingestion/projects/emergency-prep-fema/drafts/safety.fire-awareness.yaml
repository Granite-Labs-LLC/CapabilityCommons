summary_short: Understanding fire characteristics is crucial for safety.
summary_medium: Fires spread rapidly, and heat and smoke can be more dangerous than
  flames. Awareness of these dangers is essential for personal safety.
plain_language: Fires can spread very quickly, and the heat and smoke they produce
  can be more dangerous than the flames. Knowing how fires behave can help keep you
  safe.
markdown_body: '# What this is

  Fire awareness involves understanding the basic characteristics of fires, including
  how quickly they spread and the dangers posed by heat and smoke.


  # Why it matters

  Each year, thousands of people die or are injured in fires, many of which could
  be prevented with better awareness. Fires can become life-threatening in just two
  minutes, and a home can be engulfed in flames in five minutes. Heat and smoke are
  often more dangerous than the flames themselves, with asphyxiation being the leading
  cause of fire deaths.


  # What you need

  Awareness of fire characteristics and the ability to recognize the dangers of heat
  and smoke.


  # How to do it

  Learn about how fires spread and the risks associated with heat and smoke. Understand
  that there is no time to gather valuables or make phone calls during a fire. Be
  prepared to evacuate immediately.


  # Common failure modes

  Delaying evacuation and underestimating the danger of smoke can lead to serious
  injury or death.


  # Safety/boundary notes

  Always prioritize personal safety over belongings. Be aware that smoke can cause
  disorientation and drowsiness, leading to a deeper sleep instead of waking you up.


  # Local adaptation notes

  Consider local fire risks and regulations when preparing for fire safety.'
structured_data:
  definition: Fire awareness is the understanding of how fires spread and the dangers
    they pose, particularly from heat and smoke.
  key_questions:
  - How quickly can a fire spread?
  - What are the dangers of heat and smoke in a fire?
  - Why is asphyxiation a leading cause of fire deaths?
  misconceptions:
  - Fires are only dangerous because of the flames.
  - You have time to gather belongings during a fire.
