summary_short: Save money in an emergency account and keep cash accessible for crises.
summary_medium: Establish an emergency savings account and maintain accessible cash
  or traveler's checks to ensure financial preparedness during crises.
plain_language: It's important to have some money saved up specifically for emergencies.
  This means having a savings account you can use in a crisis and keeping some cash
  or traveler's checks at home in a safe place.
markdown_body: '### What this is

  Emergency savings is a financial preparedness strategy that involves setting aside
  money specifically for use during a crisis. This includes having a dedicated savings
  account and keeping some cash or traveler''s checks readily accessible.


  ### Why it matters

  Having emergency savings ensures that you have the financial resources to handle
  unexpected situations, such as evacuations or sudden expenses, without relying solely
  on credit or loans.


  ### What you need

  To implement this strategy, you need to set up a savings account designated for
  emergencies and secure a small amount of cash or traveler''s checks at home.


  ### How to do it

  1. Open a savings account specifically for emergencies.

  2. Regularly deposit a portion of your income into this account.

  3. Keep a small amount of cash or traveler''s checks in a safe, easily accessible
  place at home.


  ### Common failure modes

  Failing to regularly contribute to the emergency fund or using the funds for non-emergencies
  can undermine financial preparedness.


  ### Safety/boundary notes

  Ensure that cash kept at home is stored securely to prevent theft or loss.


  ### Local adaptation notes

  Consider local banking options and the availability of traveler''s checks in your
  area.'
