summary_short: Support networks help parents manage emotions and support children
  during disasters.
summary_medium: Support networks are crucial for parents to manage their emotions
  and effectively support their children during disasters. Building a network of family,
  friends, and community resources can help parents cope better and be more available
  for their children.
plain_language: Support networks are important for parents during disasters. They
  help parents manage their feelings so they can better support their children.
markdown_body: '### What this is

  Support networks are systems of family, friends, community organizations, and other
  resources that parents can rely on during disasters.


  ### Why it matters

  Having a support network helps parents manage their emotions and reactions during
  a disaster, making them more available and effective in supporting their children.


  ### What you need

  Parents need to identify and build a network of supportive individuals and organizations
  that can provide emotional and practical support during emergencies.


  ### How to do it

  Parents can build support networks by connecting with family, friends, community
  groups, and faith-based organizations. It''s important to establish these connections
  before a disaster strikes.


  ### Common failure modes

  A lack of support can leave parents overwhelmed and unable to effectively support
  their children.


  ### Safety/boundary notes

  Ensure that the support network includes trusted individuals and organizations.


  ### Local adaptation notes

  Adapt the support network to include local resources and culturally relevant organizations.'
