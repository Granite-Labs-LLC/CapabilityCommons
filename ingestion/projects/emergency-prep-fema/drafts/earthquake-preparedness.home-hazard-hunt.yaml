bundle_overrides:
  hook: Prepare your home and family for an earthquake by identifying hazards and
    practicing life-saving drills.
  primer: Earthquakes can strike without warning, causing significant damage and posing
    serious risks to personal safety. By conducting a home hazard hunt and practicing
    an earthquake drill, homeowners can significantly reduce the risk of injury during
    such events. This process involves identifying potential dangers in the home,
    such as unsecured furniture or heavy objects on high shelves, and taking steps
    to secure or remove these hazards. Practicing an earthquake drill, such as 'Drop,
    Cover, and Hold On,' ensures that all family members know how to respond quickly
    and effectively when an earthquake occurs. This preparation can save lives and
    minimize damage, making it an essential practice for anyone living in earthquake-prone
    areas.
  guide: '1. **Prepare a Checklist**: Create or download a checklist to guide you
    through identifying potential hazards in your home. This checklist should include
    items like unsecured furniture, heavy objects on high shelves, and any other items
    that could pose a risk during an earthquake.


    2. **Conduct a Home Hazard Hunt**: Go through each room in your home with the
    checklist. Look for potential hazards such as bookshelves that are not anchored
    to the wall, heavy picture frames, or mirrors that could fall. Make note of any
    items that need to be secured or removed.


    3. **Secure Identified Hazards**: Use appropriate materials to secure or remove
    the hazards you identified. This might involve anchoring furniture to walls, moving
    heavy items to lower shelves, or securing loose objects.


    4. **Conduct an Earthquake Drill**: Gather your family and practice the ''Drop,
    Cover, and Hold On'' drill. This involves dropping to your hands and knees, covering
    your head and neck (or your entire body if possible) under a sturdy piece of furniture,
    and holding on until the shaking stops.


    5. **Review and Repeat**: After the drill, discuss what went well and what could
    be improved. Make sure everyone understands the safest spots in each room and
    knows the drill by heart. Repeat the drill regularly to ensure everyone remains
    prepared.'
