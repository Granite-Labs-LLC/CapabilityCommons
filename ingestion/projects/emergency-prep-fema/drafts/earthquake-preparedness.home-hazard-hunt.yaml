markdown_body: '# What this is

  This project blueprint guides homeowners through a home hazard hunt and an earthquake
  drill. It helps identify potential dangers in the home and prepares residents for
  an earthquake.


  # Why it matters

  Identifying hazards and practicing drills can significantly reduce the risk of injury
  during an earthquake. Being prepared can save lives and minimize damage.


  # What you need

  A checklist to identify potential hazards in your home.


  # How to do it

  1. Use the checklist to inspect each room for potential hazards, such as unsecured
  furniture or heavy objects on high shelves. 2. Secure or remove identified hazards.
  3. Conduct an earthquake drill with your family, practicing ''Drop, Cover, and Hold
  On.''


  # Common failure modes

  Missing hazards during the inspection or not taking the drill seriously.


  # Safety/boundary notes

  Ensure all family members understand the drill and know the safest spots in each
  room.


  # Local adaptation notes

  Adapt the checklist to include specific hazards relevant to your local environment
  or building type.'
