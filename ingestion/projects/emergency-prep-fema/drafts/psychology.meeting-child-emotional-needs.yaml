bundle_overrides:
  hook: Supporting a child's emotional needs after a disaster is crucial for their
    recovery and well-being.
  primer: After a disaster, children can experience a range of emotions, from fear
    and confusion to anxiety and sadness. These emotional reactions are often influenced
    by the adults around them, as children look to caregivers for cues on how to respond
    to the situation. It's important for adults to provide a supportive environment
    where children feel safe to express their thoughts and feelings. Open communication
    helps children process the event and reduces misunderstandings about the risks
    involved. Adults should listen carefully, answer questions simply, and use age-appropriate
    language. Creative methods like drawing or storytelling can be helpful for children
    who struggle to articulate their feelings verbally. Ignoring a child's emotional
    needs or providing too much information can increase anxiety, so it's crucial
    to find a balance that suits the child's age and understanding.
  guide: '1. **Create a Safe Environment**: Ensure the child feels physically and
    emotionally safe. Maintain a calm demeanor and reassure them that they are secure.


    2. **Encourage Expression**: Invite the child to share their thoughts and feelings
    about the disaster. Use open-ended questions to facilitate conversation, such
    as ''How are you feeling about what happened?''


    3. **Listen Actively**: Pay close attention to what the child says. Validate their
    feelings by acknowledging their emotions, saying things like ''It''s okay to feel
    scared.''


    4. **Clarify Misunderstandings**: Address any misconceptions the child may have
    about the event. Provide clear, simple explanations to correct misunderstandings
    about risk and safety.


    5. **Use Age-Appropriate Language**: Tailor your communication to the child''s
    age and comprehension level. Younger children may need simpler explanations, while
    older children might require more detailed discussions.


    6. **Incorporate Creative Expression**: If verbal communication is challenging,
    encourage the child to express themselves through drawing, storytelling, or play.
    This can help them process their emotions in a non-threatening way.


    7. **Monitor Emotional Cues**: Be attentive to the child''s emotional state. If
    they show signs of distress or anxiety, offer comfort and reassurance.


    8. **Provide Consistent Support**: Regularly check in with the child to see how
    they are feeling and offer ongoing support as they process the event.'
  reference:
  - Encourage open communication.
  - Listen actively to children's concerns.
  - Clarify misunderstandings about the event.
  - Use age-appropriate language.
  - Incorporate creative expression methods.
  - Provide reassurance about safety.
  - Monitor for signs of distress or anxiety.
