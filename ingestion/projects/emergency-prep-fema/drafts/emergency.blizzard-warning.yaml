summary_short: Conditions for a blizzard warning.
summary_medium: A reference sheet describing conditions for a blizzard warning, including
  high winds and reduced visibility due to snow.
plain_language: A blizzard warning means that there will be strong winds and heavy
  snow, making it hard to see and dangerous to be outside.
markdown_body: '### What this is

  A blizzard warning is an alert issued by weather services to inform the public about
  severe winter weather conditions.


  ### Why it matters

  Understanding a blizzard warning is crucial for safety, as it indicates potentially
  life-threatening weather conditions that can disrupt travel and daily activities.


  ### What you need

  Awareness of local weather updates and preparedness for severe winter conditions.


  ### How to do it

  Monitor weather reports and be prepared to stay indoors. Ensure you have emergency
  supplies like food, water, and warm clothing.


  ### Common failure modes

  Ignoring warnings, underestimating the severity of the weather, and failing to prepare
  adequately.


  ### Safety/boundary notes

  Avoid travel during a blizzard warning unless absolutely necessary. Stay indoors
  and keep warm.


  ### Local adaptation notes

  Adapt preparedness measures based on local infrastructure and resources available.'
structured_data:
  definition: A blizzard warning indicates sustained winds or frequent gusts of 35
    miles per hour or greater, with considerable amounts of falling or blowing snow
    reducing visibility to less than a quarter mile for three hours or longer.
  key_questions:
  - What are the conditions that trigger a blizzard warning?
  - How should one prepare for a blizzard warning?
  misconceptions:
  - A blizzard warning only means heavy snowfall.
  - Blizzard conditions are not dangerous if you are used to snow.
