markdown_body: "# What this is\nThis guide provides essential steps for managing water\
  \ during emergencies, ensuring safe consumption and access to water sources.\n\n\
  # Why it matters\nIn emergencies, water may become scarce or contaminated. Proper\
  \ management ensures that you have enough safe water to meet your needs.\n\n# What\
  \ you need\nKnowledge of your water needs, ability to treat water, and access to\
  \ home water sources like pipes and hot-water tanks.\n\n# How to do it\n1. Allow\
  \ people to drink according to their needs, typically more than one-half gallon\
  \ per day. \n2. Never ration water unless instructed by authorities. \n3. Drink\
  \ uncontaminated water first, and treat suspicious water if necessary. \n4. Avoid\
  \ carbonated and caffeinated drinks as they dehydrate the body. \n5. Turn off main\
  \ water valves to protect home water sources from contamination.\n\n# Common failure\
  \ modes\nDehydration due to insufficient water intake or consumption of contaminated\
  \ water.\n\n# Safety/boundary notes\nDo not drink less than one quart of water daily.\
  \ Ensure water is treated if it appears suspicious.\n\n# Local adaptation notes\n\
  Consider local availability of water treatment methods and reports of water contamination."
