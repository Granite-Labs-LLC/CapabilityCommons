bundle_overrides:
  hook: In emergencies, water is life. Learn how to ensure you and your loved ones
    have safe and sufficient water when it matters most.
  primer: Water is a critical resource, especially during emergencies when access
    can be limited or compromised. Understanding how to manage water effectively can
    mean the difference between safety and risk. During emergencies, it's essential
    to prioritize drinking water needs, typically more than one-half gallon per day
    per person. Authorities may advise against rationing water unless absolutely necessary,
    as dehydration can quickly become a serious issue. Drinking uncontaminated water
    should be your first choice, but if only suspicious water is available, it must
    be treated before consumption. Avoid carbonated and caffeinated drinks as they
    can dehydrate you further. Additionally, if there's a risk of contamination from
    broken water or sewage lines, turning off your main water valves can protect your
    home water sources. Remember, never drink less than one quart of water daily to
    maintain health and hydration.
  guide: '1. **Assess Water Needs**: Ensure everyone in your household drinks according
    to their needs, typically more than one-half gallon per day. Do not ration water
    unless instructed by authorities.


    2. **Prioritize Safe Water**: Always choose uncontaminated water first. If you
    have to use suspicious water, such as cloudy water from faucets or natural sources
    like streams, treat it before drinking. Boiling, filtering, or using purification
    tablets are common methods.


    3. **Avoid Dehydrating Beverages**: Do not substitute water with carbonated or
    caffeinated drinks, as they can increase dehydration. Stick to plain water to
    meet your hydration needs.


    4. **Protect Home Water Sources**: In case of reports of broken water or sewage
    lines, turn off your main water valves to prevent contamination of your home water
    supply.


    5. **Maintain Minimum Intake**: Ensure that no one drinks less than one quart
    of water daily. This is the minimum required to maintain basic bodily functions
    and health.


    6. **Stay Informed**: Keep updated with local advisories and instructions from
    authorities regarding water safety and availability. This information can guide
    your actions and help you make informed decisions.'
  reference:
  - Drink more than one-half gallon of water per day.
  - Do not ration water unless instructed by authorities.
  - Drink uncontaminated water first; treat suspicious water.
  - Avoid carbonated and caffeinated drinks.
  - Turn off main water valves to prevent contamination.
  - Do not drink less than one quart of water daily.
  worksheet:
  - List your daily water needs and compare them to the recommended intake.
  - Identify potential sources of uncontaminated water in your home.
  - Research and list methods to treat suspicious water.
  - Create a plan to turn off your main water valves in case of contamination.
  - Track your daily water intake for a week to ensure it meets the minimum requirements.
  teach_forward_kit:
    three_minute_version: In emergencies, prioritize drinking more than one-half gallon
      of water per day, avoid rationing unless advised, and treat any suspicious water.
      Avoid dehydrating drinks and protect your home water supply by turning off main
      valves if contamination is a risk.
