bundle_overrides:
  hook: Understanding how to avoid hazardous materials can protect you from serious
    health risks and ensure your safety in potentially dangerous situations.
  primer: Hazardous materials are substances that can pose a threat to health, safety,
    or the environment. These materials can be found in various forms, such as liquids,
    gases, or solids, and may be present in industrial settings, transportation routes,
    or even household products. It is crucial to recognize the potential dangers associated
    with these materials and to know how to avoid them effectively. The key to staying
    safe is maintaining a safe distance from any spills or emissions and following
    local emergency instructions. By staying upstream, uphill, and upwind from the
    hazard, you can minimize your exposure to harmful substances. Additionally, it
    is important to avoid touching any spilled liquids, airborne mists, or condensed
    solid deposits, as direct contact can lead to contamination or injury. Being aware
    of your surroundings and having access to local emergency contact information
    can further enhance your safety in the presence of hazardous materials.
  guide: '1. **Do Not Touch or Walk Into Spills**: Avoid any contact with spilled
    liquids, airborne mists, or condensed solid chemical deposits. These substances
    can be harmful upon contact, so it''s important to steer clear of them.


    2. **Maintain a Safe Distance**: Always stay upstream, uphill, and upwind from
    the hazard. This positioning helps to keep you out of the path of potentially
    dangerous substances. Aim to be at least one-half mile away from the danger area,
    which is typically equivalent to 8-10 city blocks.


    3. **Follow Local Emergency Instructions**: In the event of a hazardous materials
    incident, local authorities will provide instructions on how to stay safe. These
    may include evacuation orders or shelter-in-place directives. It is crucial to
    follow these instructions promptly to ensure your safety.


    4. **Avoid Smoking Near Hazardous Materials**: Smoking can ignite flammable substances,
    increasing the risk of fire or explosion. Always avoid smoking in areas where
    hazardous materials are present.


    5. **Stay Informed**: Keep a radio or other communication device handy to receive
    updates from local emergency services. This will help you stay informed about
    the situation and any changes in safety recommendations.'
