markdown_body: '### What this is

  This skill guide provides instructions on how to avoid hazardous materials effectively,
  ensuring personal safety by maintaining a safe distance and avoiding contact with
  spills.


  ### Why it matters

  Hazardous materials can pose significant health risks if not handled properly. Avoiding
  contact and maintaining a safe distance can prevent exposure to harmful substances.


  ### What you need

  Awareness of your surroundings and knowledge of safe distances. No specific tools
  are required, but having access to local emergency contact information can be beneficial.


  ### How to do it

  1. Do not walk into or touch any spilled liquids, airborne mists, or condensed solid
  chemical deposits.

  2. Stay upstream, uphill, and upwind from the hazard. Aim to be at least one-half
  mile away from the danger area, which is typically 8-10 city blocks.

  3. Follow any local emergency instructions promptly.


  ### Common failure modes

  Walking into contaminated areas or failing to maintain a safe distance from hazardous
  materials.


  ### Safety/boundary notes

  Do not touch spills and always maintain a safe distance. Avoid smoking near hazardous
  materials.


  ### Local adaptation notes

  Check with local emergency services for specific hazardous material handling and
  disposal programs.'
