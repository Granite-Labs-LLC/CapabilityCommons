markdown_body: '### What this is

  The Facilitator Guide is a comprehensive resource designed to help individuals teach
  disaster preparedness effectively. It includes lesson plans, guidelines for engaging
  different audiences, and additional resources to enhance training sessions.


  ### Why it matters

  Teaching disaster preparedness is crucial for ensuring that communities are ready
  to respond effectively in the event of a disaster. This guide provides the necessary
  tools and information to deliver impactful training.


  ### What you need

  To use this guide, you will need the Facilitator Guide itself, a CD-ROM with teaching
  aids, electronic visuals, and handouts for distribution.


  ### How to do it

  Use the lesson plans and guidelines provided in the guide to structure your training
  sessions. Engage your audience with the electronic visuals and distribute handouts
  to reinforce key information.


  ### Common failure modes

  Ineffective audience engagement and lack of resource availability can hinder the
  success of training sessions.


  ### Safety/boundary notes


  ### Local adaptation notes

  Tailor lesson plans to meet local needs and adapt visuals to ensure they are relevant
  to the local context.'
