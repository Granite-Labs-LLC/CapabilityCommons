bundle_overrides:
  hook: In times of disaster, when professional help may be delayed, CERT volunteers
    step up to provide immediate support and organization, ensuring community resilience.
  primer: The Community Emergency Response Team (CERT) program is a volunteer initiative
    designed to prepare community members to assist in disaster situations. This program
    is crucial because, in the aftermath of a disaster, professional responders might
    be delayed due to the scale of the event, communication breakdowns, or impassable
    roads. CERT volunteers are trained to fill this gap by organizing themselves and
    others, providing immediate assistance to victims, and collecting disaster intelligence
    to support professional responders when they arrive. To become a CERT volunteer,
    participants must complete 20 hours of training covering essential topics such
    as disaster preparedness, fire safety, medical operations, search and rescue,
    team organization, and disaster psychology. The program requires local government
    sponsorship to be initiated and is conducted in a classroom setting where volunteers
    learn about local hazards and how to prepare for them. By equipping community
    members with these skills, the CERT program enhances local response capabilities
    and ensures that communities are better prepared to handle emergencies.
  guide: "To become a CERT volunteer, follow these steps: \n\n1. **Check Local Availability**:\
    \ Contact your local emergency management office to see if a CERT program is available\
    \ in your area. If not, inquire about the possibility of starting one with local\
    \ government sponsorship.\n\n2. **Enroll in Training**: Sign up for the CERT training\
    \ program, which consists of 20 hours of instruction. This training will cover\
    \ disaster preparedness, fire safety, medical operations, light search and rescue,\
    \ team organization, and disaster psychology.\n\n3. **Attend Classroom Sessions**:\
    \ Participate in classroom sessions where you will learn about the specific hazards\
    \ in your community and how to prepare for them. This will include understanding\
    \ local risks and developing strategies to mitigate them.\n\n4. **Engage in Practical\
    \ Exercises**: Take part in hands-on exercises that simulate disaster scenarios.\
    \ These exercises will help you practice the skills you've learned in a controlled\
    \ environment.\n\n5. **Complete the Training**: Successfully complete all training\
    \ modules and exercises. This will prepare you to effectively organize and assist\
    \ during actual disaster situations.\n\n6. **Stay Involved**: After completing\
    \ the training, stay engaged with your local CERT group. Participate in regular\
    \ meetings, drills, and community outreach activities to keep your skills sharp\
    \ and stay informed about new developments in emergency response.\n\nBy following\
    \ these steps, you will be prepared to assist your community in times of need,\
    \ providing vital support until professional responders arrive."
  reference:
  - CERT program requires 20 hours of training.
  - Training covers disaster preparedness, fire safety, medical operations, search
    and rescue, team organization, and disaster psychology.
  - Local government sponsorship is needed to start a CERT program.
  - Volunteers are trained in a classroom setting.
  - CERT volunteers provide immediate assistance and organize efforts during disasters.
  worksheet:
  - Identify three local hazards that CERT training would help address.
  - List the steps you would take to organize a CERT team in your community.
  - Describe a scenario where CERT volunteers could assist before professional responders
    arrive.
  - Outline a basic emergency plan for your household using CERT principles.
  - Reflect on how CERT training could improve community resilience in your area.
  teach_forward_kit:
    three_minute_version: CERT is a volunteer program that trains community members
      to assist during disasters. Volunteers complete 20 hours of training on topics
      like disaster preparedness and medical operations. This training enables them
      to provide immediate support and organize efforts until professional help arrives,
      filling crucial gaps when responders are delayed.
    ten_minute_outline:
    - Introduction to CERT and its purpose
    - Importance of community preparedness
    - Overview of the 20-hour training program
    - Role of local government in sponsoring CERT
    - Practical applications of CERT training
    - Encouraging community involvement and ongoing engagement
    discussion_prompts:
    - Why is it important for communities to have trained CERT volunteers?
    - What challenges might CERT volunteers face during a disaster?
    - How can local governments support the establishment of CERT programs?
    - In what ways can CERT training be adapted to address specific community needs?
    - Discuss the potential impact of CERT volunteers on community resilience.
