summary_short: CERT trains volunteers to assist in disasters.
summary_medium: The CERT program trains volunteers to organize and assist in disaster
  situations, providing immediate aid and gathering intelligence until professional
  responders arrive.
plain_language: CERT is a program that prepares volunteers to help their community
  during disasters by organizing efforts, providing aid, and gathering information
  until professional help arrives.
markdown_body: '# What this is

  The Community Emergency Response Team (CERT) program is a volunteer training initiative
  that equips community members with the skills to assist in disaster situations.
  It focuses on organizing volunteers, providing immediate assistance, and collecting
  disaster intelligence.


  # Why it matters

  In the aftermath of a disaster, professional responders may be delayed due to the
  scale of the event, communication breakdowns, or impassable roads. CERT volunteers
  fill this gap by offering immediate support and organizing efforts until help arrives.


  # What you need

  Participants need to complete 20 hours of training covering disaster preparedness,
  fire safety, medical operations, search and rescue, team organization, and disaster
  psychology. Local government sponsorship is required to initiate the program.


  # How to do it

  Volunteers are trained in a classroom setting to understand local hazards and prepare
  for them. They learn to organize themselves and others, provide basic aid, and gather
  information to assist professional responders.


  # Common failure modes

  Challenges include lack of communication and impassable roads, which can hinder
  volunteer efforts.


  # Safety/boundary notes

  Volunteers should operate within their training limits and follow safety protocols
  to avoid putting themselves or others at risk.


  # Local adaptation notes

  The program should be adapted to address community-specific hazards and be sponsored
  by local government or representatives.'
