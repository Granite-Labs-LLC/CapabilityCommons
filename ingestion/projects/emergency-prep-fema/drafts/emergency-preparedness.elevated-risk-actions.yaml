plain_language: When the risk level is elevated, make sure your disaster supplies
  are ready and your family emergency plan is up to date.
markdown_body: '### What this is

  This reference sheet provides actions to take when the risk level is elevated, indicated
  by the color yellow. It focuses on preparedness steps to ensure safety and readiness.


  ### Why it matters

  Elevated risk levels indicate a higher likelihood of emergencies. Being prepared
  can help reduce the impact of such events on you and your family.


  ### What you need

  You will need your disaster supplies and a copy of your family emergency plan.


  ### How to do it

  1. Ensure your disaster supplies are fully stocked and ready for use.

  2. Review and update the telephone numbers in your family emergency plan.

  3. Develop and practice alternate routes to and from work or school.

  4. Stay alert for any suspicious activity and report it to the authorities.


  ### Common failure modes

  Failing to update contact information or neglecting to practice alternate routes
  can lead to confusion during an emergency.


  ### Safety/boundary notes

  Always prioritize personal safety when reporting suspicious activities. Use discretion
  and contact authorities when necessary.


  ### Local adaptation notes

  Consider local emergency services and routes when updating your family emergency
  plan.'
