markdown_body: '### What this is


  This guide provides steps to take during a biological attack or if exposed to a
  biological agent, focusing on ensuring personal safety and health.


  ### Why it matters


  Biological attacks and exposure to biological agents can spread diseases rapidly,
  and knowing how to respond can prevent illness and save lives.


  ### What you need


  Access to media (TV, radio, Internet), soap and water, clean clothes, and a means
  to contact authorities.


  ### How to do it


  1. Monitor media for official information about the attack, symptoms, and medical
  advice.


  2. Practice good hygiene by washing with soap and water.


  3. If exposed, remove contaminated clothing, wash thoroughly, and seek medical attention.


  4. Follow official instructions for disposal of contaminated items and possible
  quarantine measures.


  ### Common failure modes


  Delayed response due to misinformation or lack of awareness, not practicing hygiene,
  and not seeking timely medical attention.


  ### Safety/boundary notes


  Always follow official instructions and do not assume symptoms are related to the
  attack without confirmation.


  ### Local adaptation notes


  Adapt response based on local public health guidelines and available resources.'
plain_language: This guide helps you understand what to do during a biological attack
  or if exposed to a biological agent, such as staying informed through media, maintaining
  hygiene, and getting medical help if needed.
