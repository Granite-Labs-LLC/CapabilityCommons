bundle_overrides:
  hook: Understanding how to respond to biological threats can save lives by preventing
    the spread of disease and ensuring timely medical intervention.
  primer: Biological threats, such as attacks or accidental exposure to harmful biological
    agents, pose significant risks to public health. These agents can spread diseases
    quickly, making it crucial to respond effectively and promptly. The first step
    in managing such a situation is to stay informed through reliable media sources
    like TV, radio, or the Internet. This helps you receive official updates on the
    nature of the threat, symptoms to watch for, and any medical advice or instructions
    from authorities. Practicing good hygiene, such as washing hands thoroughly with
    soap and water, is essential to minimize the risk of infection. If you suspect
    exposure to a biological agent, it is vital to remove contaminated clothing, wash
    your body thoroughly, and seek medical attention immediately. Following official
    instructions for the disposal of contaminated items and adhering to quarantine
    measures, if advised, can further prevent the spread of disease. By understanding
    these steps, you can protect yourself and others in the event of a biological
    threat.
  guide: '1. **Stay Informed**: Regularly monitor reliable media sources such as TV,
    radio, or the Internet for official updates about the biological threat. This
    includes information on symptoms, affected areas, and medical advice.


    2. **Practice Good Hygiene**: Wash your hands and body thoroughly with soap and
    water. This simple step is crucial in preventing the spread of infectious agents.


    3. **Decontaminate if Exposed**: If you believe you have been exposed to a biological
    agent, immediately remove and bag your clothes and personal items. Wash yourself
    thoroughly with soap and water, and put on clean clothes.


    4. **Seek Medical Assistance**: Contact medical authorities as soon as possible.
    They can provide guidance on symptoms and necessary treatments. Be prepared to
    follow their instructions, which may include quarantine measures.


    5. **Dispose of Contaminated Items**: Follow official instructions for the disposal
    of any contaminated items to prevent further spread of the agent.


    6. **Follow Quarantine Measures**: If advised by authorities, adhere to quarantine
    measures to protect yourself and others from potential infection.


    By following these steps, you can effectively manage your response to a biological
    threat and reduce the risk of infection.'
