summary_short: Identify signs of stress in adults after a disaster.
summary_medium: A reference sheet listing signs of disaster-related stress in adults,
  indicating when crisis counseling or stress management might be needed.
plain_language: This guide helps you recognize signs of stress in adults after experiencing
  a disaster and suggests when to seek professional help.
markdown_body: '# What this is

  This reference sheet helps identify signs of stress in adults following a disaster
  and provides guidance on when to seek professional help.


  # Why it matters

  Disasters can have a profound emotional impact, sometimes more severe than physical
  or financial losses. Recognizing stress signs is crucial for timely intervention
  and recovery.


  # What you need

  Awareness of stress signs and access to community resources or professional counseling
  services.


  # How to do it

  Look for signs such as difficulty communicating, sleeping, or maintaining balance
  in life. Notice increased substance use, poor work performance, or physical symptoms
  like headaches. Seek help if these signs are present.


  # Common failure modes

  Misinterpreting stress signs or delaying seeking help.


  # Safety/boundary notes

  Ensure to seek professional help if stress signs are severe or persistent.


  # Local adaptation notes

  Contact local organizations for available resources and support specific to your
  area.'
structured_data:
  definition: Disaster-related stress refers to the emotional and psychological strain
    experienced after a disaster.
  key_questions:
  - What are common signs of disaster-related stress?
  - When should professional help be sought?
  misconceptions:
  - Assuming stress signs will resolve on their own without intervention.
