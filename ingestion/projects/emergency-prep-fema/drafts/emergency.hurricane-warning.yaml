markdown_body: '### What this is

  A hurricane or tropical storm warning is an alert issued by weather authorities
  indicating that hurricane or tropical storm conditions are expected in a specific
  area, typically within 24 hours.


  ### Why it matters

  Understanding a hurricane or tropical storm warning is crucial for safety, as it
  signals the need to complete preparations and take protective actions to safeguard
  life and property.


  ### What you need

  Awareness of the warning and readiness to implement your emergency plan, including
  securing your home and having supplies ready.


  ### How to do it

  Upon receiving a warning, finalize your emergency preparations, secure outdoor items,
  and follow local evacuation orders if issued. Stay informed through official channels.


  ### Common failure modes

  Ignoring the warning, delaying preparations, or failing to follow evacuation orders
  can lead to increased risk of harm.


  ### Safety/boundary notes

  Always prioritize personal safety and adhere to official guidance and evacuation
  orders.


  ### Local adaptation notes

  Adapt your response based on local infrastructure, resources, and specific guidance
  from local authorities.'
