bundle_overrides:
  hook: Learning first aid and CPR can empower you to save lives in emergencies and
    provide peace of mind for you and your loved ones.
  primer: First aid and CPR are essential skills that can make a significant difference
    in emergency situations. First aid involves providing immediate care to someone
    who is injured or ill, while CPR (Cardiopulmonary Resuscitation) is a life-saving
    technique used when someone's breathing or heartbeat has stopped. These skills
    are crucial because they can help stabilize a person until professional medical
    help arrives. Taking a certified course, such as those offered by the American
    Red Cross, ensures you learn the correct techniques and gain legal protection
    under the 'good Samaritan' law. Certification courses typically cover how to assess
    a situation, perform CPR, use an automated external defibrillator (AED), and manage
    common injuries like cuts, burns, and fractures. With proper training, you can
    confidently assist in emergencies, potentially saving lives and reducing the severity
    of injuries.
  guide: '1. **Research Training Options**: Look for first aid and CPR courses offered
    by reputable organizations like the American Red Cross. Check their websites or
    contact local chapters for class schedules and availability.


    2. **Enroll in a Course**: Sign up for a course that fits your schedule. Consider
    factors like location, duration, and cost. Some courses may offer online components,
    but practical, hands-on training is essential.


    3. **Gather Necessary Materials**: Ensure you have access to a first aid kit and
    any required training materials. Some courses provide these, while others may
    require you to bring your own.


    4. **Attend the Training**: Participate actively in the course. Pay attention
    to instructions, ask questions, and practice the techniques thoroughly. Practical
    exercises are crucial for mastering the skills.


    5. **Complete Certification Requirements**: Successfully complete all course components,
    including written tests and practical assessments, to earn your certification.


    6. **Maintain Your Skills**: Regularly review your training materials and consider
    taking refresher courses to keep your skills sharp. Certification typically needs
    renewal every two years.


    7. **Stay Informed**: Keep updated on any changes in first aid and CPR guidelines
    by following reputable sources like the American Red Cross or the American Heart
    Association.'
  reference:
  - First aid kit
  - CPR training materials
  - American Red Cross
  - Good Samaritan law
  - Certification renewal every two years
  - Automated External Defibrillator (AED)
  worksheet:
