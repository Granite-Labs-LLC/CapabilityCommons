  - Describe the steps of performing CPR on an adult.
  - Identify the contents of a basic first aid kit.
  - Role-play a scenario where you need to use CPR and first aid.
  - Research and list local organizations offering first aid and CPR certification.
  teach_forward_kit:
    three_minute_version: First aid and CPR are vital skills for emergency situations.
      They help stabilize individuals until professional help arrives. Enroll in a
      certified course, practice the techniques, and maintain your certification to
      ensure you're prepared to assist effectively.
    ten_minute_outline:
