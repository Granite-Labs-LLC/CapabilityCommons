summary_short: Learn first aid and CPR to enhance family safety.
summary_medium: Guidance on learning first aid and CPR, including taking classes and
  obtaining certification from the American Red Cross.
plain_language: This guide helps you learn first aid and CPR, which are essential
  skills for emergency situations. You can take classes and get certified by the American
  Red Cross.
markdown_body: '# What this is

  This is a guide to learning first aid and CPR, which are critical skills for providing
  emergency assistance and potentially saving lives.


  # Why it matters

  Knowing how to administer first aid and CPR can make a significant difference in
  emergency situations, providing immediate care until professional help arrives.
  Certification also offers legal protection under the ''good Samaritan'' law.


  # What you need

  To learn these skills, you will need access to a first aid kit and CPR training
  materials. It is recommended to take a class offered by a recognized organization
  like the American Red Cross.


  # How to do it

  Enroll in a first aid and CPR class through your local American Red Cross chapter.
  Complete the training and obtain certification, which will equip you with the necessary
  skills and legal protection to administer aid.


  # Common failure modes

  Common mistakes include incorrect administration of first aid or CPR and attempting
  to provide aid without proper certification.


  # Safety/boundary notes

  Ensure you have received proper training before attempting to administer first aid
  or CPR to avoid causing harm.


  # Local adaptation notes

  Check the availability of local Red Cross chapters or other certified organizations
  that offer first aid and CPR training in your area.'
