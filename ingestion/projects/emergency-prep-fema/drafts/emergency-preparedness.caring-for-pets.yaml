markdown_body: '### What this is

  This guide provides steps to prepare a disaster plan for pets, ensuring their safety
  and well-being during emergencies.


  ### Why it matters

  Pets are vulnerable during disasters and require specific preparations to ensure
  their safety, as they are often not allowed in emergency shelters.


  ### What you need

  You''ll need a pet carrier, leash, veterinary records, and knowledge of local pet-friendly
  accommodations.


  ### How to do it

  1. Identify pet-friendly shelters and accommodations. Contact local emergency management
  or animal control for advice.

  2. Gather necessary pet supplies, including food, water, and a carrier.

  3. Ensure your pet has proper ID and up-to-date veterinary records.

  4. Prepare a pet carrier and leash for easy transport.


  ### Common failure modes

  Failing to identify shelter options, insufficient supplies, and missing ID or records
  can jeopardize pet safety.


  ### Safety/boundary notes

  Be aware that pets, except for service animals, are generally not allowed in emergency
  shelters.


  ### Local adaptation notes

  Check local shelter policies and identify pet-friendly accommodations in your area.'
