bundle_overrides:
  hook: In emergencies, your pets rely on you for safety and care—being prepared can
    make all the difference.
  primer: When disaster strikes, it's not just humans who are affected—our pets are
    vulnerable too. Many emergency shelters do not allow pets, except for service
    animals, due to health and safety concerns. This means pet owners need to have
    a plan in place to ensure their pets' safety and well-being during such times.
    Essential preparations include gathering necessary supplies like food, water,
    and a pet carrier, as well as ensuring your pet has proper identification and
    up-to-date veterinary records. Additionally, knowing where to find pet-friendly
    accommodations or shelters is crucial. By taking these steps, you can help ensure
    your pet remains safe and secure, even in the face of unexpected events.
  guide: '1. **Identify Pet-Friendly Shelters and Accommodations:** Start by contacting
    your local emergency management office, animal shelter, or animal control office.
    They can provide advice and information on pet-friendly shelters in your area.
    Make a list of these places and keep it accessible.


    2. **Gather Necessary Pet Supplies:** Prepare a kit that includes enough food
    and water for at least three days, a pet carrier, and a leash. Ensure the carrier
    is sturdy and comfortable for your pet.


    3. **Ensure Proper ID and Veterinary Records:** Make sure your pet has a collar
    with an ID tag that includes your contact information. Keep a copy of your pet''s
    veterinary records, including vaccination history, in your emergency kit.


    4. **Prepare for Easy Transport:** Have a pet carrier and leash ready for quick
    evacuation. Practice getting your pet into the carrier calmly and efficiently.


    5. **Regularly Update Your Plan:** Review and update your emergency plan and supplies
    regularly. Check expiration dates on food and water, and ensure your pet''s ID
    and records are current.


    By following these steps, you can help ensure your pet''s safety during emergencies.'
  reference:
  - Pets are not typically allowed in emergency shelters.
  - 'Gather pet supplies: food, water, carrier, leash.'
  - Ensure pet has proper ID and up-to-date veterinary records.
  - Identify pet-friendly shelters and accommodations.
  - Contact local emergency management for advice.
  worksheet:
  - List three local pet-friendly accommodations or shelters.
  - Create a checklist of pet supplies needed for emergencies.
  - Practice placing your pet in a carrier quickly and calmly.
  - Update your pet's ID tag with current contact information.
  - Review and update your pet's veterinary records.
  teach_forward_kit:
    three_minute_version: In emergencies, pets need special care as they are often
      not allowed in shelters. Prepare by gathering supplies, ensuring proper ID and
      records, and knowing where to find pet-friendly accommodations.
    ten_minute_outline:
    - Introduction to pet care in emergencies.
    - Discuss the importance of identifying pet-friendly shelters.
    - Explain the necessary supplies for pet emergency kits.
    - Highlight the need for proper ID and veterinary records.
    - Demonstrate how to prepare a pet carrier for transport.
    - Conclude with tips on maintaining and updating the emergency plan.
    discussion_prompts:
    - Why is it important to have a plan for pets during emergencies?
    - What challenges might pet owners face in finding pet-friendly shelters?
    - How can pet owners ensure their pets remain calm during evacuations?
    - What are some common mistakes people make when preparing for pet emergencies?
