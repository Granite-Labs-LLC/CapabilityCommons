markdown_body: '### What this is

  This reference sheet provides definitions for terms related to hurricane hazards.
  Understanding these terms can help you identify and prepare for different stages
  of a hurricane.


  ### Why it matters

  Knowing the specific terms used to describe hurricane conditions can help you understand
  weather reports and warnings, allowing you to take appropriate action to protect
  yourself and your property.


  ### What you need

  No specific tools or materials are needed to use this reference sheet. Familiarity
  with basic meteorological concepts may be helpful.


  ### How to do it

  - **Tropical Depression**: An organized system of clouds and thunderstorms with
  a defined surface circulation and maximum sustained winds of 38 MPH (33 knots) or
  less.

  - **Tropical Storm**: An organized system of strong thunderstorms with a defined
  surface circulation and maximum sustained winds of 39-73 MPH (34-63 knots).

  - **Hurricane**: An intense tropical weather system of strong thunderstorms with
  a well-defined surface circulation and maximum sustained winds of 74 MPH (64 knots)
  or higher.


  ### Common failure modes

  Misunderstanding the terms can lead to underestimating the severity of a storm and
  inadequate preparation.


  ### Safety/boundary notes

  Always follow local weather advisories and evacuation orders during hurricane threats.


  ### Local adaptation notes

  Local weather services may use additional terms or scales to describe storm intensity.
  Always refer to local guidelines for the most relevant information.'
