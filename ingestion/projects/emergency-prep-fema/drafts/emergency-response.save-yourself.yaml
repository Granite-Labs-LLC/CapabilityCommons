summary_short: Prioritize personal safety over possessions during a tsunami.
summary_medium: The story of Ramon Atala highlights the critical importance of prioritizing
  personal safety over possessions during a tsunami. Evacuate immediately to higher
  ground and avoid returning until it is safe.
plain_language: In a tsunami, your life is more important than any possessions. Always
  move to higher ground and stay there until authorities say it's safe to return.
markdown_body: '### What this is

  This concept emphasizes the importance of prioritizing personal safety over possessions
  during a tsunami. It is based on the tragic story of Ramon Atala, who lost his life
  trying to save possessions during the 1960 Chile tsunami.


  ### Why it matters

  Understanding this concept can save lives. In emergency situations like tsunamis,
  the instinct to protect possessions can lead to fatal decisions. Recognizing the
  priority of personal safety can prevent unnecessary loss of life.


  ### What you need

  Awareness of local tsunami risks and evacuation routes. A plan for immediate evacuation
  to higher ground.


  ### How to do it

  In the event of a tsunami warning, evacuate immediately to higher ground. Do not
  attempt to save possessions. Stay away from coastal areas until authorities declare
  it safe to return.


  ### Common failure modes

  Returning to danger zones too soon or prioritizing possessions over personal safety
  can lead to fatal outcomes.


  ### Safety/boundary notes

  Stay away from coastal areas during a tsunami and follow official evacuation orders.


  ### Local adaptation notes

  Communities should be aware of local tsunami risks and have clear evacuation routes
  and plans.'
structured_data:
  definition: Prioritizing personal safety over possessions during a tsunami involves
    evacuating immediately to higher ground and not returning until it is safe.
  key_questions:
  - Why is personal safety more important than possessions during a tsunami?
  - What are the risks of returning to coastal areas too soon?
  misconceptions:
  - Possessions can be saved without risk during a tsunami.
  - It is safe to return to coastal areas immediately after a tsunami wave.
  safety_boundary: This is background/awareness information about a hazard, adapted
