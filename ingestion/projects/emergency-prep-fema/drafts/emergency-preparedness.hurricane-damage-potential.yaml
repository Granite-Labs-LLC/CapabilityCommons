plain_language: Learn about the Saffir-Simpson Hurricane Scale, which classifies hurricanes
  by their wind speed and potential damage, and understand the risks they pose, such
  as flooding and structural damage.
markdown_body: '# What this is

  This reference sheet provides an overview of the Saffir-Simpson Hurricane Scale,
  which categorizes hurricanes based on their wind speed, central pressure, and potential
  damage. It is a tool used to assess the potential impact of hurricanes.


  # Why it matters

  Understanding the Saffir-Simpson Hurricane Scale helps individuals and communities
  prepare for hurricanes by providing a clear indication of the potential severity
  and impact of an approaching storm. This knowledge is crucial for making informed
  decisions about evacuations and other safety measures.


  # What you need

  Familiarity with the Saffir-Simpson Hurricane Scale and awareness of local emergency
  preparedness plans.


  # How to do it

  Refer to the Saffir-Simpson Hurricane Scale to determine the category of an approaching
  hurricane. Categories range from 1 to 5, with Category 1 indicating minimal damage
  potential and Category 5 indicating catastrophic damage potential. Use this information
  to guide your preparation and response actions.


  # Common failure modes

  Underestimating the potential impact of lower-category hurricanes can lead to inadequate
  preparation and increased risk of harm.


  # Safety/boundary notes

  Always follow local emergency management instructions and evacuate if advised. Do
  not rely solely on the category number; consider all potential hazards, including
  flooding and storm surges.


  # Local adaptation notes

  Adapt emergency plans to account for specific local risks, such as proximity to
  coastlines or flood-prone areas.'
