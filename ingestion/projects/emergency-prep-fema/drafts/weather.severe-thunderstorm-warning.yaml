plain_language: A Severe Thunderstorm Warning is issued when severe weather is happening
  or about to happen, posing a threat to life and property.
markdown_body: '### What this is

  A Severe Thunderstorm Warning is an alert issued by weather authorities when severe
  weather conditions, such as strong winds, hail, or heavy rain, have been reported
  by spotters or detected by radar.


  ### Why it matters

  This warning indicates that there is an imminent threat to life and property for
  those in the path of the storm. It is crucial to take immediate action to protect
  yourself and your surroundings.


  ### What you need

  Stay informed through weather updates, have a safe shelter plan, and ensure you
  have emergency supplies ready.


  ### How to do it

  Upon receiving a Severe Thunderstorm Warning, seek shelter immediately in a sturdy
  building, away from windows. Avoid using electrical appliances and stay tuned to
  local news for updates.


  ### Common failure modes

  Ignoring the warning or failing to seek proper shelter can result in injury or damage
  to property.


  ### Safety/boundary notes

  Do not stay in vehicles or mobile homes, as they offer little protection against
  severe weather.


  ### Local adaptation notes

  Adapt your response based on local infrastructure and available resources, such
  as community shelters.'
