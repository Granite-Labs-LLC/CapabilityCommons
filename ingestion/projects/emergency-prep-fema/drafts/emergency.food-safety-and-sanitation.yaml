plain_language: Learn how to keep food safe and maintain sanitation during emergencies
  with these guidelines on storage, handling, and cooking.
markdown_body: "### What this is\nThis reference sheet provides guidelines for maintaining\
  \ food safety and sanitation during emergencies. It covers proper food storage,\
  \ handling, and alternative cooking methods.\n\n### Why it matters\nDuring emergencies,\
  \ maintaining food safety and sanitation is crucial to prevent illness and ensure\
  \ access to safe food. Contaminated food can lead to health risks, especially when\
  \ resources are limited.\n\n### What you need\nYou will need soap, boiled or disinfected\
  \ water, canned baby formula, candle warmers, chafing dishes, fondue pots, a fireplace,\
  \ charcoal grills, camp stoves, and dry ice.\n\n### How to do it\n1. Keep food in\
  \ covered containers and cooking utensils clean. \n2. Dispose of garbage properly,\
  \ burying it if necessary. \n3. Wash hands frequently with soap and boiled or disinfected\
  \ water. \n4. Use only pre-prepared canned baby formula for infants. \n5. Discard\
  \ any food that has been in contact with contaminated water or has been at room\
  \ temperature for over two hours. \n6. Use alternative cooking sources like candle\
  \ warmers or camp stoves outdoors. \n7. Handle dry ice with heavy gloves and use\
  \ it to keep food frozen.\n\n### Common failure modes\nFood contamination, sanitation\
  \ issues, and fire hazards can occur if guidelines are not followed.\n\n### Safety/boundary\
  \ notes\nUse charcoal grills and camp stoves outdoors only. Handle dry ice with\
  \ heavy gloves to avoid injury.\n\n### Local adaptation notes\nConsider the availability\
  \ of dry ice and access to alternative cooking sources in your area."
