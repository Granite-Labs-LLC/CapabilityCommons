summary_short: Guidance for individuals with special needs during emergencies.
summary_medium: Guidance on additional steps for individuals with special needs during
  emergencies, including hearing and mobility impairments, language barriers, and
  dietary restrictions.
plain_language: If you or someone you know has a disability or special need, there
  are extra steps to take during emergencies to ensure safety and preparedness.
markdown_body: '# What this is

  This reference sheet provides guidance for individuals with special needs to prepare
  for emergencies. It includes considerations for those with disabilities, language
  barriers, and dietary restrictions.


  # Why it matters

  Emergencies can pose additional challenges for individuals with special needs. Proper
  planning and preparation can help mitigate these challenges and ensure safety and
  well-being.


  # What you need

  Awareness of specific needs, community resources, and a plan for communication,
  transportation, and dietary requirements.


  # How to do it

  1. Arrange for special warnings if hearing impaired.

  2. Plan for shelter assistance if mobility impaired.

  3. Seek community support if non-English speaking.

  4. Ensure transportation if without a vehicle.

  5. Prepare an emergency food supply if you have dietary restrictions.


  # Common failure modes

  Lack of communication, inadequate transportation, and insufficient food supply can
  hinder effective emergency response.


  # Safety/boundary notes

  Ensure that all plans respect personal safety and boundaries, particularly in terms
  of mobility and communication.


  # Local adaptation notes

  Engage with community and cultural groups for language-specific resources and support.'
