summary_short: Common reactions of children to disasters, categorized by age groups.
summary_medium: This reference sheet outlines typical reactions of children to disasters,
  categorized by age groups from birth to adolescence, highlighting how these reactions
  evolve as children grow.
plain_language: Children react differently to disasters depending on their age. This
  guide explains these reactions from infancy to adolescence.
markdown_body: '# What this is

  This reference sheet provides an overview of how children of different age groups
  typically react to disasters or traumatic events.


  # Why it matters

  Understanding age-specific reactions to trauma can help caregivers and professionals
  provide appropriate support to children affected by disasters.


  # What you need

  Awareness of the developmental stages of children and how these stages influence
  their reactions to trauma.


  # How to do it

  Use this guide to identify and understand the typical reactions of children in different
  age groups following a disaster. This can inform how you support and communicate
  with them.


  # Common failure modes

  Misunderstanding or overlooking the specific needs and reactions of children at
  different developmental stages can lead to inadequate support.


  # Safety/boundary notes

  Ensure that children feel safe and supported, and avoid exposing them to further
  trauma or misinformation.


  # Local adaptation notes

  Consider cultural and environmental factors that may influence children''s reactions
  and the support they require.'
structured_data:
  definition: Age-specific reactions to disasters in children.
  key_questions:
  - How do infants typically react to trauma?
  - What are common reactions in preschool children after a disaster?
  - How do school-age children process traumatic events?
  - What are typical adolescent responses to disasters?
  misconceptions:
  - All children react the same way to trauma.
  - Children will naturally forget traumatic events without intervention.
