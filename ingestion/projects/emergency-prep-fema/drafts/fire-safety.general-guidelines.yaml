bundle_overrides:
  hook: Fire safety knowledge can save lives and minimize damage during emergencies,
    ensuring you and your loved ones are prepared to act swiftly and safely.
  primer: Fire safety is crucial for protecting lives and property. Fires can occur
    unexpectedly, and having a plan in place can make all the difference. Basic fire
    safety involves understanding how to use fire extinguishers, recognizing the importance
    of fire sprinkler systems, and knowing safe evacuation procedures. A-B-C-type
    fire extinguishers are versatile and can handle most types of fires, making them
    essential for any home. Additionally, automatic fire sprinkler systems can help
    control fires before they spread, providing an extra layer of protection. It's
    also important to have your local fire department inspect your home for potential
    hazards and to practice fire drills regularly. In the event of a fire, knowing
    how to 'Stop, Drop, and Roll' can prevent serious injury if your clothes catch
    fire. Checking doors for heat before opening them, crawling low under smoke, and
    closing doors behind you as you exit are critical steps for a safe escape. Once
    you are out, never re-enter a burning building and call 9-1-1 immediately.
  guide: '1. **Install A-B-C-type Fire Extinguishers**: Place these extinguishers
    in accessible locations throughout your home, such as the kitchen and garage.
    Teach all family members how to use them properly.


    2. **Consider Fire Sprinkler Systems**: Evaluate the feasibility of installing
    an automatic fire sprinkler system in your home. These systems can help control
    fires early, reducing damage and increasing safety.


    3. **Fire Department Inspection**: Contact your local fire department to conduct
    a fire safety inspection of your residence. They can identify potential hazards
    and provide recommendations for improvement.


    4. **Practice ''Stop, Drop, and Roll''**: Ensure everyone in your household knows
    this technique to extinguish flames on clothing. Practice regularly to ensure
    it becomes second nature.


    5. **Check Doors for Heat**: Before opening any closed door during a fire, feel
    it with the back of your hand. If it''s hot, do not open it, as there may be fire
    on the other side.


    6. **Crawl Low Under Smoke**: Smoke rises, so staying low to the ground will help
    you avoid inhaling toxic fumes. Crawl to the nearest exit and close doors behind
    you to slow the spread of fire.


    7. **Stay Out and Call 9-1-1**: Once you have safely exited the building, do not
    go back inside for any reason. Call emergency services immediately to report the
    fire.'
