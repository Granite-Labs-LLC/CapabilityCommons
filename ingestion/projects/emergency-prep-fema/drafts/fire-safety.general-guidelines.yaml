markdown_body: '### What this is

  This guide provides general fire safety guidelines to help you prepare for and respond
  to fire emergencies effectively.


  ### Why it matters

  Understanding fire safety can save lives and minimize damage during a fire. Proper
  preparation and response can prevent injuries and ensure a safe escape.


  ### What you need

  - A-B-C-type fire extinguishers

  - Knowledge of fire escape routes

  - Possibly an automatic fire sprinkler system


  ### How to do it

  1. Install A-B-C-type fire extinguishers in your home and teach family members how
  to use them.

  2. Consider installing an automatic fire sprinkler system.

  3. Have your local fire department inspect your residence for fire safety.

  4. Practice ''Stop, Drop, and Roll'' if your clothes catch fire.

  5. Check closed doors for heat before opening during a fire.

  6. Crawl low under smoke to your exit and close doors behind you.

  7. Once out, stay out and call 9-1-1.


  ### Common failure modes

  Uninspected systems and non-functional extinguishers can fail during a fire emergency.


  ### Safety/boundary notes

  Always ensure fire safety equipment is functional and regularly inspected. Do not
  reenter a burning building once you have exited.


  ### Local adaptation notes

  Consult with local fire departments for specific fire safety regulations and resources
  available in your area.'
