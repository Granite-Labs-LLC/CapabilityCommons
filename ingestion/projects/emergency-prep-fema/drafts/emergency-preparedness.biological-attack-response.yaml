markdown_body: '### What this is

  This concept note provides guidance on how to respond to a biological attack, emphasizing
  the importance of following official instructions and understanding public health
  procedures.


  ### Why it matters

  In the event of a biological attack, timely and accurate response is crucial to
  minimize exposure and health risks. Understanding and following public health protocols
  can help protect you and your community.


  ### What you need

  Awareness of official communication channels such as radio, television, and emergency
  alert systems. Access to HEPA filters can also be beneficial.


  ### How to do it

  Pay attention to official warnings and instructions. Use HEPA filters in your home
  or office to help remove biological agents from the air. Follow public health procedures
  as you would for any infectious disease.


  ### Common failure modes

  Ignoring official instructions, not using available HEPA filters, and misunderstanding
  public health procedures can increase risk.


  ### Safety/boundary notes

  HEPA filters are effective for biological agents but not for chemical agents. Ensure
  you are using the correct type of filter for the situation.


  ### Local adaptation notes

  Adapt the use of HEPA filters based on your specific living or working environment,
  such as whether you are in a home, apartment, or office building.'
