summary_short: Safety tips for inspecting a damaged home post-disaster.
summary_medium: General safety tips for inspecting a damaged home after a disaster,
  including using battery-powered devices, avoiding animals, and staying off streets.
plain_language: Learn how to safely inspect your home after a disaster using battery-powered
  tools, avoiding animals, and staying off streets unless necessary.
markdown_body: "### What this is\nThis is a guide providing general safety tips for\
  \ inspecting a damaged home after a disaster.\n\n### Why it matters\nInspecting\
  \ a damaged home can be dangerous due to potential structural damage, gas leaks,\
  \ and other hazards. Following safety tips can help prevent injuries and further\
  \ damage.\n\n### What you need\nYou will need a battery-powered radio, a battery-powered\
  \ flashlight, and a stick for moving debris.\n\n### How to do it\n1. Keep a battery-powered\
  \ radio with you to listen for emergency updates. \n2. Use a battery-powered flashlight\
  \ to inspect your home, turning it on outside to avoid igniting any potential gas\
  \ leaks. \n3. Be cautious of animals, especially poisonous snakes, and use a stick\
  \ to move debris. \n4. Use the phone only for life-threatening emergencies. \n5.\
  \ Stay off the streets unless necessary, and watch for fallen objects and weakened\
  \ structures.\n\n### Common failure modes\nUsing a flashlight inside without checking\
  \ for gas leaks can cause ignition. Walking on unstable debris can lead to injury.\n\
  \n### Safety/boundary notes\nAvoid using the phone unnecessarily and stay off streets\
  \ unless absolutely necessary.\n\n### Local adaptation notes\nConsider the availability\
  \ of battery-powered devices and local wildlife when applying these tips."
