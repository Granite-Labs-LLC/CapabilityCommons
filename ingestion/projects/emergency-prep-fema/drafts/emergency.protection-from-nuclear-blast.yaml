markdown_body: '### What this is

  This guide provides strategies to protect yourself from the effects of a nuclear
  blast, focusing on the principles of distance, shielding, and time.


  ### Why it matters

  In the event of a nuclear blast, understanding how to minimize exposure to radioactive
  fallout can significantly reduce health risks.


  ### What you need

  Awareness of potential target areas, access to a suitable shelter, and knowledge
  of how to maximize distance and shielding.


  ### How to do it

  1. **Distance**: Increase the distance between yourself and fallout particles. Seek
  shelter in an underground area or the middle floors of a large building. Avoid top
  floors or areas near flat roofs.

  2. **Shielding**: Use dense materials like concrete, bricks, or earth to shield
  yourself from radiation.

  3. **Time**: Stay sheltered for at least two weeks, as radiation levels decrease
  significantly during this period.


  ### Common failure modes

  Inadequate shelter or insufficient distance from fallout can increase exposure to
  radiation.


  ### Safety/boundary notes

  Any protection is better than none. Prioritize increasing distance, using effective
  shielding, and allowing time for radiation levels to decrease.


  ### Local adaptation notes

  Adapt strategies based on local infrastructure and potential target areas.'
