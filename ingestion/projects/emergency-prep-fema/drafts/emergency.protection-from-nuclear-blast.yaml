bundle_overrides:
  hook: Understanding how to protect yourself from a nuclear blast can significantly
    reduce health risks by minimizing exposure to radioactive fallout.
  primer: 'A nuclear blast is a catastrophic event that can cause immediate and long-term
    harm. While the initial explosion can be devastating, the radioactive fallout
    that follows poses a significant health risk. Fallout consists of radioactive
    particles that can spread over large areas, carried by wind and weather patterns.
    Protecting yourself involves three key principles: distance, shielding, and time.
    Increasing the distance between yourself and the fallout reduces exposure. Effective
    shielding involves using dense materials like concrete or earth to block radiation.
    Lastly, time is crucial, as radiation levels decrease significantly over the first
    two weeks. Understanding these principles can help you make informed decisions
    to protect yourself and your loved ones in the event of a nuclear blast.'
  guide: "1. **Distance**: Immediately seek shelter to increase the distance between\
    \ yourself and the fallout. Ideal shelters are underground areas or the middle\
    \ floors of large buildings. Avoid top floors or areas near flat roofs where fallout\
    \ may accumulate. \n\n2. **Shielding**: Use dense materials to shield yourself\
    \ from radiation. Thick walls made of concrete, bricks, or even stacks of books\
    \ can provide effective protection. The more material between you and the fallout,\
    \ the better. \n\n3. **Time**: Stay sheltered for at least two weeks. Radiation\
    \ levels drop significantly during this period, reducing the risk of exposure.\
    \ Do not leave your shelter until authorities declare it safe. \n\n4. **Awareness**:\
    \ Be aware of potential target areas in your vicinity and plan your sheltering\
    \ strategy accordingly. \n\n5. **Preparation**: Stock your shelter with essential\
    \ supplies like food, water, and medical kits to last at least two weeks. \n\n\
    By following these steps, you can significantly reduce your risk of radiation\
    \ exposure in the event of a nuclear blast."
  reference:
  - 'Distance: Increase distance from fallout.'
  - 'Shielding: Use dense materials like concrete or earth.'
  - 'Time: Stay sheltered for at least two weeks.'
  - Avoid top floors or areas near flat roofs.
  - Stock shelter with essential supplies.
  worksheet:
  - Identify potential shelters in your area and evaluate their effectiveness.
  - List materials available in your home that could be used for shielding.
  - Create a checklist of essential supplies for a two-week shelter stay.
  - Map out a plan to reach your identified shelter quickly in an emergency.
  - Research local emergency services and their protocols for nuclear events.
