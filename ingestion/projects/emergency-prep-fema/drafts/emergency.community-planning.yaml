summary_short: Learn about community, workplace, and school emergency plans.
summary_medium: Guidance on understanding and engaging with community disaster/emergency
  plans, including workplace and school plans.
plain_language: This concept helps you understand the importance of knowing the emergency
  plans in your community, workplace, and your children's school. It guides you on
  how to find and engage with these plans.
markdown_body: '# What this is

  This concept focuses on the importance of understanding and engaging with emergency
  plans at the community, workplace, and school levels.


  # Why it matters

  Knowing these plans ensures you are prepared for emergencies and can respond effectively,
  reducing risks to yourself and others.


  # What you need

  You need to gather information from local officials, your employer, and your children''s
  school about their respective emergency plans.


  # How to do it

  Start by asking local officials if your community has a disaster plan, how to obtain
  it, and what it covers. Inquire about the frequency of updates. At work, ask your
  employer about disaster policies and how emergency information will be communicated.
  For schools, discuss the disaster procedures in place.


  # Common failure modes

  Common issues include lack of awareness of community plans, inadequate workplace
  policies, and being uninformed about school procedures.


  # Safety/boundary notes


  # Local adaptation notes

  Consider community-specific hazards and how often plans are updated.'
structured_data:
  definition: Community and other emergency plans are structured guidelines and procedures
    designed to prepare for and respond to disasters.
  key_questions:
  - Does my community have a disaster plan?
  - What does the plan contain?
  - How often is it updated?
  - What hazards does it cover?
  - What are the workplace policies for emergencies?
  - What are the disaster procedures at my child's school?
  misconceptions:
  - Assuming all plans are the same regardless of location.
  - Believing that knowing the plan is unnecessary if emergencies are rare.
