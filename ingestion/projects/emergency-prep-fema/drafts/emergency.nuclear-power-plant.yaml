summary_short: Actions to take during a nuclear power plant emergency.
summary_medium: Guidelines for actions to take during a nuclear power plant emergency,
  including evacuation and sheltering in place.
plain_language: Learn what to do if there's an emergency at a nuclear power plant,
  including when to evacuate or stay indoors.
markdown_body: "### What this is\nThis reference sheet provides guidelines for actions\
  \ to take during a nuclear power plant emergency.\n\n### Why it matters\nIn the\
  \ event of a nuclear power plant emergency, knowing the correct actions can significantly\
  \ reduce the risk of radiation exposure and ensure safety.\n\n### What you need\n\
  A battery-powered radio, a plastic bag, and access to a shower.\n\n### How to do\
  \ it\n1. Keep a battery-powered radio with you for instructions. \n2. If advised\
  \ to evacuate, keep car windows and vents closed and use recirculating air. \n3.\
  \ If advised to stay indoors, close and lock doors and windows, turn off air intakes,\
  \ and go to a basement if possible. \n4. If exposed to radiation, change clothes,\
  \ seal them in a plastic bag, and take a thorough shower. \n5. Keep food in covered\
  \ containers.\n\n### Common failure modes\nExposure to radiation due to not following\
  \ guidelines or contaminated food.\n\n### Safety/boundary notes\nEnsure all air\
  \ intakes are turned off to prevent contamination.\n\n### Local adaptation notes\n\
  Consider the availability of a basement or underground area and access to a battery-powered\
  \ radio."
