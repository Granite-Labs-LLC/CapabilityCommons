summary_short: Overview of chemical threats and their effects.
summary_medium: Learn about chemical threats, including types of agents, their effects,
  and signs of a chemical release.
plain_language: Chemical threats involve harmful substances that can affect people,
  animals, or plants. They can be released in various forms and may not always be
  detectable by smell or taste.
markdown_body: '### What this is

  Chemical threats involve the use of poisonous substances that can be in the form
  of vapors, aerosols, liquids, or solids. These agents can cause harm to people,
  animals, and plants.


  ### Why it matters

  Understanding chemical threats is crucial for preparedness and response. These agents
  can have immediate or delayed effects and can be challenging to detect and deliver
  in lethal concentrations.


  ### What you need

  Awareness of the signs of chemical release and knowledge of potential delivery methods
  are essential for safety.


  ### How to do it

  Stay informed about the types of chemical agents and their effects. Recognize signs
  such as difficulty breathing, eye irritation, and nausea as potential indicators
  of a chemical release.


  ### Common failure modes

  Failing to recognize the signs of a chemical release or underestimating the potential
  impact of chemical agents.


  ### Safety/boundary notes

  Chemical agents can be odorless and tasteless, making them difficult to detect without
  proper equipment.


  ### Local adaptation notes

  Consider local industrial activities or transportation routes that might increase
  the risk of chemical threats in your area.'
structured_data:
  definition: Chemical agents are toxic substances that can be released into the environment,
    affecting living organisms.
  key_questions:
  - What are the types of chemical agents?
  - How can chemical agents be delivered?
  - What are the signs of a chemical release?
  misconceptions:
  - Chemical agents are always detectable by smell or taste.
  - Chemical attacks are easy to execute effectively.
  safety_boundary: This is background/awareness information about a hazard, adapted
    from FEMA's public citizen-preparedness guide. It is not a substitute for official
