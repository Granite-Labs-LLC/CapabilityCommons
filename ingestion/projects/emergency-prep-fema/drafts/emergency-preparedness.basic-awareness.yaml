structured_data:
  definition: Basic awareness and guidelines in emergency preparedness involve understanding
    the types of emergencies that can occur and knowing how to prepare for them.
  key_questions:
  - What types of emergencies are most likely to occur in my area?
  - What supplies should be included in an emergency kit?
  - What should my emergency plan include?
  misconceptions:
  - Emergency preparedness is only necessary for large-scale disasters.
  - Once an emergency kit is prepared, it does not need to be updated.
