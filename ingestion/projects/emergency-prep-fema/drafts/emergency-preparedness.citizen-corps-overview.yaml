summary_short: Citizen Corps engages the public in safety and preparedness through
  education, training, and volunteer programs.
summary_medium: Citizen Corps offers opportunities for public participation in safety
  measures against crime, terrorism, public health issues, and disasters through education,
  training, and volunteer programs, managed locally by Citizen Corps Councils.
plain_language: Citizen Corps helps people get involved in making their communities
  safer by learning about and preparing for emergencies. Local councils organize these
  efforts, bringing together community leaders and volunteers.
markdown_body: '### What this is

  Citizen Corps is a national initiative that encourages public participation in safety
  and preparedness activities. It provides education, training, and volunteer opportunities
  to help individuals and communities prepare for and respond to emergencies.


  ### Why it matters

  By participating in Citizen Corps, individuals can enhance their own safety and
  contribute to the resilience of their communities against threats like crime, terrorism,
  public health crises, and natural disasters.


  ### What you need

  To get involved, you can join local Citizen Corps Councils, which coordinate efforts
  with community leaders and stakeholders. Participation may involve attending training
  sessions or volunteering in community safety programs.


  ### How to do it

  Visit the Citizen Corps website or contact your local council to learn about available
  programs. You can participate in activities like public education on disaster preparedness,
  citizen training, and volunteer programs.


  ### Common failure modes

  Lack of community engagement or insufficient coordination among local stakeholders
  can hinder the effectiveness of Citizen Corps programs.


  ### Safety/boundary notes

  Ensure that all activities comply with local safety regulations and guidelines.


  ### Local adaptation notes

  Citizen Corps Councils manage programs locally, allowing for adaptation to specific
  community needs and resources.'
