markdown_body: '### What this is

  This is a true or false quiz designed to test your knowledge of thunderstorm safety
  practices.


  ### Why it matters

  Understanding how to stay safe during thunderstorms can prevent injuries and save
  lives. Thunderstorms can be dangerous, with risks such as lightning strikes and
  strong winds.


  ### What you need

  You need basic knowledge of thunderstorm safety guidelines to complete this quiz.


  ### How to do it

  Read each statement about thunderstorm safety and decide if it is true or false.
  Check your answers against the provided answer key.


  ### Common failure modes

  Misunderstanding the protection offered by rubber materials or the safety of using
  certain devices during a storm.


  ### Safety/boundary notes

  Ensure you are in a safe location when taking the quiz, especially if a thunderstorm
  is occurring.


  ### Local adaptation notes

  Consider local weather patterns and common practices when discussing thunderstorm
  safety.'
