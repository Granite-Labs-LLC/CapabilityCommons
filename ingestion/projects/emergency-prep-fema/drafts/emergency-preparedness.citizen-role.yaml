summary_short: Understand the role of citizens in emergency preparedness and management.
summary_medium: This concept outlines the responsibilities of citizens within the
  national emergency management system, emphasizing individual preparedness before,
  during, and after emergencies.
plain_language: Learn how you, as a citizen, can prepare for emergencies by understanding
  risks, making plans, and helping your community.
markdown_body: '### What this is

  This concept explains the role of citizens in the national emergency management
  system, highlighting the importance of individual actions in preparing for, responding
  to, and recovering from emergencies.


  ### Why it matters

  Citizens form the base of the emergency management pyramid, and their preparedness
  is crucial for minimizing harm and ensuring effective response during emergencies.


  ### What you need

  Awareness of local risks, a personal emergency plan, a disaster supplies kit, and
  knowledge of community resources.


  ### How to do it

  Before an emergency, know the risks, develop a plan, purchase necessary insurance,
  and assemble a disaster kit. During an emergency, follow your plan and official
  guidance. After an emergency, repair damage and take steps to prevent future losses.


  ### Common failure modes

  Failing to prepare adequately, not having a plan, or lacking necessary supplies
  can lead to increased risk and harm during emergencies.


  ### Safety/boundary notes

  Ensure that your actions do not put yourself or others at unnecessary risk. Follow
  official guidance and safety protocols.


  ### Local adaptation notes

  Consider community-specific risks and volunteer opportunities to enhance local preparedness
  efforts.'
structured_data:
  definition: The role of citizens in emergency preparedness involves understanding
    risks, developing plans, assembling supplies, and participating in community efforts.
  key_questions:
  - What are the specific risks in my area?
  - How can I develop an effective emergency plan?
  - What should be included in a disaster supplies kit?
  misconceptions:
  - Emergency preparedness is solely the responsibility of government agencies.
  - Having insurance is enough to be prepared for emergencies.
