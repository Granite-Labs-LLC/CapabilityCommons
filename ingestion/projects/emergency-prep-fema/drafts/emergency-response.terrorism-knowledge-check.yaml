summary_short: Evaluate your knowledge on responding to terrorism-related scenarios.
summary_medium: This assessment helps evaluate your understanding of how to respond
  to various terrorism-related scenarios, including explosions, suspicious packages,
  bomb threats, nuclear blasts, and chemical attacks.
plain_language: Test your knowledge on how to safely respond to different terrorism
  threats like explosions, suspicious packages, and chemical attacks.
markdown_body: '# What this is

  This assessment is designed to evaluate your knowledge and preparedness for responding
  to terrorism-related scenarios. It covers situations such as explosions, suspicious
  packages, bomb threats, nuclear blasts, and chemical attacks.


  # Why it matters

  Understanding how to respond to terrorism threats is crucial for personal safety
  and the safety of others. Being prepared can significantly reduce the risks associated
  with these dangerous situations.


  # What you need

  To complete this assessment, you should have a basic understanding of emergency
  response procedures and access to materials such as a disaster supplies kit, duct
  tape, plastic sheeting, and scissors.


  # How to do it

  Answer the questions based on different scenarios: what to do during an explosion,
  how to handle a suspicious package, responding to a bomb threat, actions during
  a nuclear blast, and preparing for a chemical attack.


  # Common failure modes

  Common mistakes include inadequate sheltering during a nuclear blast, improper handling
  of suspicious items, and lack of necessary supplies for chemical attacks.


  # Safety/boundary notes

  Always prioritize personal safety and follow official guidance during actual emergencies.


  # Local adaptation notes

  Consider local building structures and the availability of materials when preparing
  for these scenarios.'
