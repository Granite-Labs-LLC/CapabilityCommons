markdown_body: '### What this is

  This reference sheet provides guidance on how to conserve water in swimming pools
  through the use of specific equipment and practices.


  ### Why it matters

  Conserving water in pools is important to reduce water waste, especially in areas
  prone to drought or with limited water resources. Using less water also helps lower
  utility bills and supports environmental sustainability.


  ### What you need

  To implement these water conservation measures, you will need a water-saving pool
  filter and a pool cover.


  ### How to do it

  1. Install a water-saving pool filter. Traditional filters can use between 180 to
  250 gallons of water per backflush. A water-saving filter reduces this usage significantly.

  2. Use a pool cover when the pool is not in use to minimize water loss through evaporation.


  ### Common failure modes

  One common failure mode is water loss through evaporation if the pool is not covered
  when not in use.


  ### Safety/boundary notes


  ### Local adaptation notes

  The effectiveness of these measures may depend on the availability of water-saving
  pool equipment in your area.'
