markdown_body: '# What this is

  This is an assessment designed to evaluate your understanding of the causes of landslides
  and the actions that can be taken to prevent them.


  # Why it matters

  Landslides are a significant natural hazard that can cause loss of life and property.
  Understanding their causes and how to mitigate them is crucial for community safety.


  # What you need

  You need to be aware of local regulations, community actions, and educational resources
  related to landslide prevention.


  # How to do it

  Review the information provided about landslides and answer the questions. Consider
  the impact of development in landslide-prone areas and the importance of community
  action.


  # Common failure modes

  A common failure is increased development in unsafe areas, which can exacerbate
  landslide risks.


  # Safety/boundary notes

  Ensure that any actions taken comply with local safety regulations and guidelines.


  # Local adaptation notes

  Adapt strategies based on local geography and community needs.'
structured_data:
  definition: Landslides are the movement of rock, earth, or debris down a slope.
  key_questions:
  - What factors contribute to the increase in landslides?
  - What community actions can help mitigate landslide risks?
  misconceptions:
  - Landslides only occur in mountainous regions.
  - Individual actions cannot impact landslide prevention.
