summary_short: Understanding the dangers and effects of extreme heat.
summary_medium: This section discusses the dangers of extreme heat, its effects on
  the human body, and the increased risks for certain populations and urban areas.
plain_language: Extreme heat can be dangerous because it makes it hard for our bodies
  to stay cool. This can lead to illnesses, especially in older adults, young children,
  and people who are sick or overweight. Urban areas can be hotter due to the 'urban
  heat island effect.'
markdown_body: '### What this is

  Extreme heat refers to very high temperatures that can be dangerous to human health.
  It becomes particularly hazardous when combined with high humidity, which makes
  it difficult for the body to cool itself through evaporation.


  ### Why it matters

  Extreme heat can lead to serious health issues, including heat-related illnesses.
  It is especially dangerous for vulnerable populations such as older adults, young
  children, and those with pre-existing health conditions. Urban areas are often more
  affected due to the ''urban heat island effect,'' where concrete and asphalt retain
  heat.


  ### What you need

  Awareness of the risks associated with extreme heat and understanding of how to
  protect oneself and others, especially in urban environments.


  ### How to do it

  Stay informed about weather conditions, limit outdoor activities during peak heat,
  stay hydrated, and seek air-conditioned environments when possible. Pay special
  attention to vulnerable individuals.


  ### Common failure modes

  Overexposure to heat and over-exercising during high temperatures can lead to heat-related
  illnesses.


  ### Safety/boundary notes

  Ensure that vulnerable populations are monitored during extreme heat events.


  ### Local adaptation notes

  Urban areas may require additional measures due to higher nighttime temperatures
  caused by the urban heat island effect.'
structured_data:
  definition: Extreme heat is a period of high temperatures that can pose health risks.
