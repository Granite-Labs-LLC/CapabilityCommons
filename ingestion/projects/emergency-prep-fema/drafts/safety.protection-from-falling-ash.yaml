plain_language: Learn how to protect yourself from falling ash during a volcanic eruption
  by wearing protective clothing, using goggles and dust masks, staying indoors, and
  taking precautions with vehicles.
markdown_body: '### What this is

  This reference sheet provides guidelines on how to protect yourself from falling
  ash during and after a volcanic eruption.


  ### Why it matters

  Volcanic ash can cause respiratory issues, damage property, and impair visibility.
  Taking the right precautions can help minimize these risks.


  ### What you need

  Protective clothing such as long-sleeved shirts and long pants, goggles, dust masks
  or damp cloths, and a safe indoor environment.


  ### How to do it

  - Wear long-sleeved shirts and long pants to protect your skin.

  - Use goggles and avoid contact lenses to protect your eyes.

  - Use a dust mask or a damp cloth over your face to help with breathing.

  - Stay indoors with all doors, windows, and ventilation closed until the ash settles.

  - Clear heavy ash from roofs and gutters to prevent collapse.

  - Avoid driving unless necessary, and if you must drive, keep your speed below 35
  MPH to prevent engine damage.


  ### Common failure modes

  Inhaling ash, roof collapse due to ash accumulation, and vehicle engine damage from
  ash.


  ### Safety/boundary notes

  Stay indoors as much as possible and avoid areas downwind from the volcano.


  ### Local adaptation notes

  Consider the availability of protective gear and the structure of local buildings
  when applying these guidelines.'
