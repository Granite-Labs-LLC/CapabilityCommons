summary_short: Heat stroke is a critical condition where the body's temperature regulation
  fails.
summary_medium: Heat stroke is a life-threatening condition where the body's temperature
  control system fails, potentially leading to brain damage or death if not cooled
  quickly.
plain_language: Heat stroke happens when your body gets too hot and can't cool itself
  down. This can be very dangerous and needs quick action to prevent serious harm.
markdown_body: '### What this is

  Heat stroke is a severe medical condition that occurs when the body''s temperature
  regulation system fails. Normally, the body cools itself through sweating, but in
  heat stroke, this mechanism stops working.


  ### Why it matters

  If not addressed immediately, heat stroke can lead to extremely high body temperatures,
  resulting in brain damage or even death. It is crucial to recognize and treat it
  quickly.


  ### What you need

  Immediate cooling methods such as moving to a cooler place, applying cool water,
  or using fans. Medical attention is essential.


  ### How to do it

  If you suspect someone has heat stroke, call emergency services. Move the person
  to a cooler environment, remove excess clothing, and apply cool water to their skin.
  Use fans or air conditioning to help lower their body temperature.


  ### Common failure modes

  Delaying treatment can result in severe complications like brain damage or death.
  Misidentifying the symptoms can also lead to inadequate response.


  ### Safety/boundary notes

  Ensure the person is not left alone and monitor their condition until help arrives.
  Avoid giving them fluids if they are unconscious.


  ### Local adaptation notes

  In areas with high temperatures, community awareness and access to cooling centers
  can be vital in preventing heat stroke.'
