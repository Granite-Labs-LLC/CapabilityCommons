summary_short: Understand terrorism and how to prepare for potential threats.
summary_medium: Learn about terrorism, its forms, and general guidelines for preparedness
  to ensure safety and awareness in potential threat situations.
plain_language: Terrorism involves using violence or threats to create fear and achieve
  goals. Being aware of your surroundings and knowing emergency procedures can help
  you stay safe.
markdown_body: '### What this is

  Terrorism is the use of force or violence against people or property to intimidate
  or coerce, often to achieve political goals. It can involve threats, assassinations,
  kidnappings, hijackings, bombings, cyber attacks, and the use of weapons of mass
  destruction.


  ### Why it matters

  Understanding terrorism is crucial because it can affect anyone, anywhere. Being
  prepared can help reduce fear and increase safety during potential terrorist events.


  ### What you need

  Awareness of surroundings, knowledge of emergency exits, and basic emergency supplies
  like a portable radio, flashlights, and a first aid kit.


  ### How to do it

  Stay alert to your environment, report suspicious activities, and be prepared for
  service disruptions. Work with building management to ensure emergency supplies
  are available.


  ### Common failure modes

  Failing to notice unusual behavior or not reporting suspicious activities can increase
  risk during a terrorist event.


  ### Safety/boundary notes

  Always follow instructions from police, fire, and other officials during a terrorist
  event.


  ### Local adaptation notes

  Adapt emergency plans to specific building layouts and local threat levels.'
