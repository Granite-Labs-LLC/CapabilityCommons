plain_language: If you find yourself in a landslide or debris flow, move away quickly.
  If you can't escape, curl into a ball and protect your head.
markdown_body: '# What this is

  This reference sheet provides guidelines on how to respond during a landslide or
  debris flow to maximize personal safety.


  # Why it matters

  Landslides and debris flows can occur suddenly and with great force, posing significant
  risks to life and property. Knowing how to respond can reduce the risk of injury
  or death.


  # What you need

  Awareness of your surroundings and the ability to move quickly.


  # How to do it

  If you notice a landslide or debris flow, immediately move away from its path as
  quickly as possible. If you cannot escape, curl into a tight ball and protect your
  head with your arms to minimize injury.


  # Common failure modes

  Inability to move quickly enough to escape the path of the landslide or failure
  to protect the head adequately if caught.


  # Safety/boundary notes

  Always prioritize personal safety and avoid areas prone to landslides during heavy
  rain or after wildfires.


  # Local adaptation notes

  Consider local terrain and weather patterns when planning for landslide risks.'
