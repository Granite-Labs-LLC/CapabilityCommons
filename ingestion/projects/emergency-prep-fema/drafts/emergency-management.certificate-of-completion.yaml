summary_short: Earn a certificate by completing the 'Are You Ready?' guide and passing
  a final exam.
summary_medium: Learn how to obtain a certificate of completion for the 'Are You Ready?'
  guide by scoring at least 75% on the final examination. This involves accessing
  the FEMA training website and completing the exam.
plain_language: To get a certificate for the 'Are You Ready?' guide, you need to pass
  a final exam with at least 75%. You can take the exam online through the FEMA training
  website. If you pass, you'll receive your certificate in about two weeks.
markdown_body: '### What this is

  This is a guide to obtaining a certificate of completion for the ''Are You Ready?''
  guide, which involves passing a final examination.


  ### Why it matters

  The certificate demonstrates your understanding and preparedness in emergency management,
  which can be beneficial for personal knowledge or professional development.


  ### What you need

  You need internet access to log on to the FEMA training website and complete the
  final examination.


  ### How to do it

  1. Log on to the FEMA training website at training.fema.gov/emiweb/ishome.htm.

  2. Follow the links to the ''Are You Ready? An In-depth Guide to Citizen Preparedness
  IS-22'' exam.

  3. Complete the exam and ensure you score at least 75%.

  4. If successful, expect to receive your certificate within two weeks.


  ### Common failure modes

  Not achieving a 75% score on the exam or encountering technical issues with the
  website.


  ### Safety/boundary notes

  Ensure you have a stable internet connection to avoid disruptions during the exam.


  ### Local adaptation notes

  Contact the FEMA Independent Study Program for any region-specific queries or assistance.'
