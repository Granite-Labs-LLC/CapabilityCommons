bundle_overrides:
  hook: Earn a certificate that showcases your emergency management skills by passing
    the 'Are You Ready?' final exam.
  primer: The 'Are You Ready?' guide is a comprehensive resource designed to enhance
    your understanding of emergency management. By completing this guide and passing
    a final examination, you can earn a certificate of completion. This certificate
    serves as a testament to your preparedness and knowledge in handling emergencies,
    which can be valuable for both personal growth and professional development. To
    obtain this certificate, you need to score at least 75% on the final exam, which
    is accessible online through the FEMA training website. Successfully passing the
    exam not only demonstrates your competence but also provides you with formal recognition
    from FEMA, which can be beneficial in various professional contexts.
  guide: 'To obtain your certificate of completion for the ''Are You Ready?'' guide,
    follow these steps:


    1. **Prepare for the Exam**: Thoroughly review the ''Are You Ready?'' guide to
    ensure you understand the material. This will help you achieve the required score
    of at least 75% on the final exam.


    2. **Access the FEMA Training Website**: Ensure you have a stable internet connection
    and log on to the FEMA training website at `training.fema.gov/emiweb/ishome.htm`.


    3. **Navigate to the Exam**: Once on the website, follow the links to the ''Are
    You Ready? An In-depth Guide to Citizen Preparedness IS-22'' exam.


    4. **Complete the Exam**: Carefully answer all the questions in the exam. Make
    sure to double-check your answers before submitting.


    5. **Submit Your Exam**: After completing the exam, submit it for evaluation.
    Ensure you have scored at least 75% to qualify for the certificate.


    6. **Receive Your Certificate**: If you pass the exam, expect to receive your
    certificate of completion within two weeks from the date of submission. This certificate
    will be sent to you by FEMA, acknowledging your successful completion of the guide.'
  reference:
  - Log on to training.fema.gov/emiweb/ishome.htm
  - Follow the links for 'Are You Ready? IS-22' exam
  - Score at least 75% on the final exam
  - Receive certificate within two weeks if successful
  - Contact FEMA Independent Study Program for assistance
  worksheet:
  - Review the 'Are You Ready?' guide thoroughly.
  - List three key concepts you learned from the guide.
  - Practice answering sample questions related to emergency management.
  - Simulate taking the exam by timing yourself and answering practice questions.
  - Ensure your internet connection is stable before starting the exam.
  teach_forward_kit:
    three_minute_version: To earn a certificate for the 'Are You Ready?' guide, study
      the material thoroughly, then take and pass the online exam with at least a
      75% score. Access the exam via the FEMA training website, and expect your certificate
      within two weeks if you pass.
    ten_minute_outline:
    - Introduction to the 'Are You Ready?' guide and its importance
    - Steps to access and navigate the FEMA training website
    - Tips for preparing for the final exam
    - Details on the exam format and scoring requirements
    - Process for receiving the certificate after passing
    - Resources for additional support and contact information
    discussion_prompts:
    - Why is it important to have a certificate in emergency management?
    - What challenges might you face when preparing for the exam?
    - How can this certification benefit your professional development?
    - Discuss the importance of having a stable internet connection during online
      exams.
    - What strategies can help ensure a successful exam outcome?
