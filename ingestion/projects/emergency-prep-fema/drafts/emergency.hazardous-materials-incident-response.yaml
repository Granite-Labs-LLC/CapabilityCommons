plain_language: Learn how to respond safely during a hazardous materials incident
  by following evacuation orders, seeking shelter, and sealing your environment.
markdown_body: "# What this is\nThis reference sheet provides guidelines on how to\
  \ respond during a hazardous materials incident to ensure personal safety and minimize\
  \ exposure to toxic chemicals.\n\n# Why it matters\nHazardous materials incidents\
  \ can release toxic chemicals that pose serious health risks. Proper response can\
  \ prevent exposure and reduce harm.\n\n# What you need\nA radio or television for\
  \ updates, plastic sheeting, and duct tape for sealing a shelter room.\n\n# How\
  \ to do it\n1. Listen to local radio or television for instructions. \n2. If asked\
  \ to evacuate, do so immediately. \n3. If caught outside, move upstream, uphill,\
  \ and upwind, staying at least one-half mile from the danger area. \n4. In a vehicle,\
  \ seek shelter in a building or keep windows closed and ventilation off. \n5. If\
  \ staying indoors, close and lock doors and windows, turn off ventilation, and seal\
  \ the shelter room with plastic and duct tape.\n\n# Common failure modes\nExposure\
  \ to toxic chemicals due to improper sealing of shelter or ignoring evacuation orders.\n\
  \n# Safety/boundary notes\nStay at least one-half mile from the danger area to minimize\
  \ risk.\n\n# Local adaptation notes\nConsider the availability of shelter rooms\
  \ and local building ventilation systems when planning your response."
