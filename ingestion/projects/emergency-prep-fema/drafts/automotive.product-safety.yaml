markdown_body: '### What this is

  This reference sheet lists common automotive products that are essential for vehicle
  maintenance and operation.


  ### Why it matters

  Understanding the different types of automotive products is crucial for maintaining
  vehicle performance and safety. Each product serves a specific function, such as
  lubrication, cooling, or cleaning, which helps in the efficient operation of a vehicle.


  ### What you need

  Familiarity with the types of automotive products and their specific uses in vehicle
  maintenance.


  ### How to do it

  Identify the specific needs of your vehicle and select the appropriate product from
  the list. For example, use motor oil for engine lubrication and antifreeze for temperature
  regulation.


  ### Common failure modes

  Using the wrong type of product can lead to vehicle damage. For instance, using
  incorrect oil viscosity can affect engine performance.


  ### Safety/boundary notes

  Always follow the manufacturer''s guidelines when selecting and using automotive
  products to ensure safety and compatibility.


  ### Local adaptation notes

  Product availability and specifications may vary by region, so check local automotive
  stores for the correct products.'
