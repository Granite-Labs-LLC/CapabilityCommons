markdown_body: '### What this is

  This reference sheet provides guidance on actions to take when the risk level is
  high, as part of emergency preparedness.


  ### Why it matters

  High risk situations require heightened awareness and preparedness to ensure safety
  and readiness for potential emergencies.


  ### What you need

  You will need your family emergency plan and awareness of your surroundings and
  community needs.


  ### How to do it

  1. Review your family emergency plan and ensure all family members understand their
  roles.

  2. Exercise caution when traveling and stay informed about travel advisories.

  3. Be patient and prepared for delays and security measures in public spaces.

  4. Check on neighbors or others who may need assistance during an emergency.


  ### Common failure modes

  Failing to communicate the emergency plan to all family members or neglecting to
  check on vulnerable neighbors.


  ### Safety/boundary notes

  Always prioritize personal safety when assisting others and follow official advisories.


  ### Local adaptation notes

  Consider local risk factors and community resources when planning and reviewing
  emergency actions.'
