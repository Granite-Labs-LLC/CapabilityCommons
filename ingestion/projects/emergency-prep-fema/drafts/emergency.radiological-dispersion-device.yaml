summary_short: Overview of Radiological Dispersion Devices (RDDs) and their impact.
summary_medium: Radiological Dispersion Devices (RDDs), also known as 'dirty bombs',
  combine conventional explosives with radioactive materials to spread fear and economic
  disruption.
plain_language: A Radiological Dispersion Device (RDD) is a type of weapon that uses
  a regular bomb to spread radioactive materials over a large area. It's not as powerful
  as a nuclear bomb but can cause fear and disrupt economies.
markdown_body: '### What this is

  A Radiological Dispersion Device (RDD), often called a ''dirty bomb'', is a weapon
  that combines conventional explosives with radioactive materials. It is designed
  to spread radioactive material over a large area.


  ### Why it matters

  RDDs are significant because they can cause widespread fear and economic disruption.
  They are easier to make and deploy than nuclear bombs, making them more likely to
  be used by terrorists.


  ### What you need

  Understanding of the components of an RDD and the potential impacts of its use.


  ### How to do it

  This section is not applicable as it is not about constructing an RDD but understanding
  its implications.


  ### Common failure modes

  Improper evacuation and inadequate sheltering can increase the harm caused by an
  RDD.


  ### Safety/boundary notes

  Ensure proper evacuation and sheltering plans are in place to minimize harm.


  ### Local adaptation notes

  Local meteorological conditions, such as wind and precipitation, can affect the
  spread of radioactive materials.'
