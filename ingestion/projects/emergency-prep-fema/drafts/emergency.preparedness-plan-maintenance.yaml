markdown_body: "### What this is\nThis is a guide to help you practice and maintain\
  \ your emergency preparedness plan effectively.\n\n### Why it matters\nRegular practice\
  \ and maintenance of your emergency plan ensure that everyone knows what to do in\
  \ an emergency and that your supplies are up-to-date.\n\n### What you need\nYou\
  \ will need your emergency plan, fire alarms, and disaster supplies.\n\n### How\
  \ to do it\n1. Ask questions to ensure everyone remembers key details like meeting\
  \ places and phone numbers. \n2. Conduct drills such as 'drop, cover, and hold on'\
  \ for earthquakes. \n3. Test fire alarms regularly. \n4. Replace and update your\
  \ disaster supplies as needed.\n\n### Common failure modes\nForgetting plan details\
  \ or having outdated supplies can hinder your response in an emergency.\n\n### Safety/boundary\
  \ notes\nEnsure drills are conducted safely and that all participants understand\
  \ the procedures.\n\n### Local adaptation notes\nAdapt your plan to include local\
  \ emergency procedures and resources."
