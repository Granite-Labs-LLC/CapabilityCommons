bundle_overrides:
  hook: Regular practice and maintenance of your emergency preparedness plan ensure
    everyone knows what to do in an emergency and that your supplies are up-to-date.
  primer: An emergency preparedness plan is essential for ensuring safety during unexpected
    events like natural disasters or accidents. Once you've developed your plan, it's
    crucial to practice and maintain it regularly. This involves conducting drills,
    such as 'drop, cover, and hold on' for earthquakes, and testing fire alarms to
    ensure they work correctly. Additionally, it's important to replace and update
    your disaster supplies periodically. By doing so, you ensure that everyone in
    your household knows what to do in an emergency and that your supplies are ready
    when needed. Regular practice helps reinforce the plan details, such as meeting
    places and emergency contact numbers, so they are fresh in everyone's mind. This
    proactive approach can significantly improve your household's readiness and response
    during an emergency.
  guide: '1. **Review Your Plan**: Start by reviewing your emergency preparedness
    plan with all household members. Ensure everyone understands the key details,
    such as meeting places, emergency contact numbers, and safety rules.


    2. **Conduct Drills**: Organize regular drills to practice your plan. For example,
    conduct ''drop, cover, and hold on'' drills for earthquake preparedness. Make
    sure everyone participates and understands their role.


    3. **Test Fire Alarms**: Regularly test your fire alarms to ensure they are functioning
    correctly. Replace batteries as needed and make sure everyone knows the sound
    of the alarm and what to do when it goes off.


    4. **Update Supplies**: Check your disaster supplies regularly. Replace expired
    items and ensure you have enough supplies to last at least 72 hours. Consider
    the needs of all family members, including pets.


    5. **Ask Questions**: Periodically ask family members questions about the plan
    to ensure they remember important details. This can include asking about meeting
    places, phone numbers, and what to do in specific scenarios.


    6. **Adapt and Improve**: After each drill or review, discuss what went well and
    what could be improved. Update your plan as needed to address any gaps or changes
    in your household or environment.'
  reference:
  - Review your emergency plan regularly.
  - Conduct drills such as 'drop, cover, and hold on' for earthquakes.
  - Test fire alarms regularly.
  - Replace and update disaster supplies as needed.
  - Ensure everyone remembers meeting places and emergency contacts.
  worksheet:
  - List your household's emergency meeting places and contact numbers.
  - Schedule a date for your next emergency drill.
  - Check the expiration dates on your disaster supplies and list items that need
    replacement.
  - Test your fire alarms and note any maintenance needed.
  - Role-play an emergency scenario with your family and discuss the outcome.
  teach_forward_kit:
    three_minute_version: Regularly practicing and maintaining your emergency preparedness
      plan ensures everyone knows what to do in an emergency and keeps your supplies
      up-to-date. Conduct drills, test alarms, and update supplies to stay prepared.
    ten_minute_outline:
    - Introduction to emergency preparedness
    - Importance of regular practice and maintenance
    - 'Steps to practice your plan: drills, testing alarms, updating supplies'
    - Common pitfalls and how to avoid them
    - Discussion on adapting plans to specific needs
    - Q&A session
    discussion_prompts:
    - What challenges have you faced in maintaining your emergency plan?
    - How often do you conduct drills, and what have you learned from them?
    - What strategies do you use to ensure your disaster supplies are up-to-date?
    - How do you involve all family members in emergency preparedness?
