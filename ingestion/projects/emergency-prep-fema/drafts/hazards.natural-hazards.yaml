summary_short: A list of natural hazards to consider in emergency planning.
summary_medium: This reference sheet lists various natural hazards such as floods,
  hurricanes, and earthquakes, which are important to consider when planning for emergencies.
plain_language: This sheet provides a list of different natural hazards that can occur,
  such as floods and earthquakes. Knowing about these can help you prepare for emergencies.
markdown_body: '### What this is

  This is a reference sheet that lists various natural hazards. It is intended to
  help individuals and communities recognize the types of natural events that may
  require emergency planning.


  ### Why it matters

  Understanding the types of natural hazards that can occur in your area is crucial
  for effective emergency preparedness. Being aware of these hazards allows you to
  develop plans to protect yourself, your family, and your property.


  ### What you need

  Familiarity with the types of natural hazards listed here is the first step in emergency
  planning. Additional resources may be needed to develop specific emergency plans.


  ### How to do it

  Review the list of natural hazards and assess which ones are relevant to your location.
  Use this information to guide your emergency planning efforts, ensuring you have
  strategies in place for each applicable hazard.


  ### Common failure modes

  Failing to consider all relevant hazards can lead to inadequate emergency planning.
  Ignoring less common hazards can also result in being unprepared for unexpected
  events.


  ### Safety/boundary notes

  Ensure that emergency plans are comprehensive and include safety measures for each
  type of hazard. Regularly update plans to reflect any changes in risk or new information.


  ### Local adaptation notes

  Adapt the list of hazards to reflect the specific risks in your local area. Some
  hazards may be more prevalent or severe depending on geographic and climatic conditions.'
structured_data:
  definition: Natural hazards are severe and extreme weather and environmental events
    that can cause damage and pose risks to life and property.
  key_questions:
  - What natural hazards are most likely to occur in my area?
  - How can I prepare for each type of hazard?
  - What resources are available to help with emergency planning?
  misconceptions:
  - Natural hazards are rare and unlikely to affect me.
  - Only certain types of hazards require emergency planning.
