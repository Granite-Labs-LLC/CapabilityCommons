plain_language: 'Biological agents, which are harmful organisms or toxins, can be
  spread in several ways: through the air, by animals, by contaminating food and water,
  or from person to person. Understanding these methods helps in preparing for potential
  biological threats.'
markdown_body: '### What this is

  Biological agents are harmful organisms or toxins that can cause illness or death
  in humans, animals, and plants. They can be used as weapons and are categorized
  into bacteria, viruses, and toxins.


  ### Why it matters

  Understanding how biological agents are dispersed is crucial for emergency preparedness.
  These agents can spread rapidly and cause widespread harm, making it essential to
  know the methods of dispersion to mitigate risks.


  ### What you need

  Awareness of the different methods of biological agent dispersion and access to
  reliable information sources like the CDC.


  ### How to do it

  Biological agents can be dispersed in several ways:

  - **Aerosols**: Agents are sprayed into the air, forming a mist that can travel
  long distances and be inhaled.

  - **Animals**: Diseases can be spread by insects and animals such as fleas, mice,
  and mosquitoes.

  - **Food and water contamination**: Pathogens can persist in food and water. Cooking
  and boiling can deactivate many, but official guidance should be followed.

  - **Person-to-person**: Some agents can spread directly between people, as seen
  with diseases like smallpox.


  ### Common failure modes

  - Underestimating the persistence of certain agents in the environment.

  - Inadequate cooking or boiling of food and water.


  ### Safety/boundary notes

  Follow official instructions for decontamination and safety measures. Be aware of
  the specific characteristics of different biological agents.


  ### Local adaptation notes

  Local conditions such as climate and available resources may affect the persistence
  and spread of biological agents. Adapt strategies accordingly.'
