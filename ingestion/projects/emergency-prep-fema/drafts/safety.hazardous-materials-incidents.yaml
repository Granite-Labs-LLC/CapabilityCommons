summary_short: An overview of the risks and prevalence of hazardous materials in various
  industries.
summary_medium: This section discusses the prevalence and risks associated with hazardous
  materials, highlighting their presence in various industries and the potential dangers
  they pose if mishandled.
plain_language: Hazardous materials are chemicals that can be dangerous to humans
  or the environment if not handled properly. They are found in many places, including
  factories, hospitals, and waste sites.
markdown_body: '### What this is

  Hazardous materials are chemicals that, if not handled correctly, can pose significant
  risks to human health and the environment. These materials are prevalent in many
  industries and everyday locations.


  ### Why it matters

  Understanding hazardous materials is crucial because they are integral to many processes
  that benefit society, such as water purification and agriculture. However, improper
  handling or accidental release can lead to serious health and environmental issues.


  ### What you need

  Awareness of the types of hazardous materials in your environment and the potential
  risks associated with them.


  ### How to do it

  Identify and understand the hazardous materials present in your community or workplace.
  Follow safety guidelines for handling, storage, and disposal to minimize risks.


  ### Common failure modes

  Improper use or accidental release of hazardous materials can lead to dangerous
  situations.


  ### Safety/boundary notes

  Always adhere to safety protocols and guidelines when dealing with hazardous materials
  to prevent accidents.


  ### Local adaptation notes

  Consider local regulations and resources when developing safety plans for hazardous
  materials.'
