markdown_body: '### What this is

  This document provides guidelines for safely handling encounters with wild or injured
  animals during emergencies. It emphasizes the importance of avoiding direct contact
  and seeking professional assistance.


  ### Why it matters

  During emergencies, wild or injured animals may pose a threat to human safety. Proper
  handling of these situations can prevent injuries and health risks.


  ### What you need

  Awareness of local animal control and wildlife resource contacts, and knowledge
  of basic safety precautions.


  ### How to do it

  - Do not approach or attempt to help an injured or stranded animal. Instead, call
  your local animal control or wildlife resource office.

  - Avoid cornering wild animals or trying to rescue them, as they may feel threatened
  and endanger themselves.

  - If wild animals take refuge in your home, provide an escape route by opening a
  window. Do not attempt to capture or handle them.

  - Do not attempt to move dead animals due to health risks. Contact your local emergency
  management or health department for assistance.

  - If bitten by an animal, seek immediate medical attention.


  ### Common failure modes

  Approaching wild animals, handling dead animals.


  ### Safety/boundary notes

  Avoid contact with wild animals and do not attempt to move dead animals.


  ### Local adaptation notes

  Contact local animal control or health department for specific guidance.'
