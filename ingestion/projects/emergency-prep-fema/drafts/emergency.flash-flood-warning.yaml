summary_short: Immediate actions during a flash flood warning.
summary_medium: Guidance on immediate actions to take during a flash flood warning,
  including seeking higher ground on foot.
plain_language: If a flash flood warning is issued, move to higher ground on foot
  immediately.
markdown_body: '### What this is

  This reference sheet provides immediate actions to take when a flash flood warning
  is issued.


  ### Why it matters

  Flash floods can occur suddenly and with little warning, posing significant risks
  to life and property. Taking immediate action is crucial for safety.


  ### What you need

  Awareness of your surroundings and the ability to move quickly to higher ground.


  ### How to do it

  Upon receiving a flash flood warning, leave your current location and move to higher
  ground on foot as quickly as possible. Avoid walking through floodwaters.


  ### Common failure modes

  Failing to move to higher ground immediately can result in being caught in rapidly
  rising waters.


  ### Safety/boundary notes

  Do not attempt to drive through flooded areas. Always prioritize personal safety
  over belongings.


  ### Local adaptation notes

  Consider local geography and available routes to higher ground when planning your
  response.'
structured_data:
  definition: A flash flood warning indicates that a flash flood is occurring or imminent.
  key_questions:
  - What is the fastest route to higher ground?
  - Are there any obstacles that might impede reaching safety?
  misconceptions:
