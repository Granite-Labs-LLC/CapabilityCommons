summary_short: Freezing rain creates ice coatings on surfaces.
summary_medium: Freezing rain occurs when rain freezes upon contact with surfaces,
  forming ice on roads, trees, and power lines.
plain_language: Freezing rain is rain that turns into ice when it hits the ground,
  making roads and other surfaces slippery and dangerous.
markdown_body: '### What this is

  Freezing rain is a type of precipitation where rain droplets freeze upon impact
  with surfaces, resulting in a layer of ice.


  ### Why it matters

  Freezing rain can create hazardous conditions by forming ice on roads, walkways,
  trees, and power lines, leading to accidents, power outages, and damage to infrastructure.


  ### What you need

  Awareness of weather forecasts and preparedness for icy conditions.


  ### How to do it

  Monitor weather reports for freezing rain alerts and take precautions such as avoiding
  travel and securing outdoor items.


  ### Common failure modes

  Underestimating the impact of ice accumulation on surfaces, leading to accidents
  or injuries.


  ### Safety/boundary notes

  Exercise caution when walking or driving on icy surfaces and be prepared for potential
  power outages.


  ### Local adaptation notes

  In regions prone to freezing rain, infrastructure may be adapted to better withstand
  ice accumulation.'
