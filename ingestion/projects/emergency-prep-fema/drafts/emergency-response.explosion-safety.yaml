plain_language: Learn what to do during an explosion to stay safe, such as getting
  under a sturdy table, leaving the building quickly, and avoiding elevators.
markdown_body: '# What this is

  This guide provides essential actions to take during an explosion to ensure personal
  safety.


  # Why it matters

  Explosions can cause structural damage and falling debris, posing significant risks.
  Knowing how to respond can prevent injuries and save lives.


  # What you need

  Awareness of your surroundings and a plan for quick evacuation.


  # How to do it

  1. If things are falling around you, get under a sturdy table or desk.

  2. Once it is safe, leave the building quickly, watching for weakened floors and
  stairways.

  3. Be cautious of falling debris as you exit.

  4. Do not use elevators.

  5. Do not stop to retrieve personal possessions or make phone calls.


  # Common failure modes

  Stopping to retrieve personal possessions or using elevators during evacuation can
  lead to injury or death.


  # Safety/boundary notes

  Watch for weakened floors and stairways, and be cautious of falling debris.


  # Local adaptation notes

  Consider local building structures and materials when planning evacuation routes.'
