bundle_overrides:
  hook: Knowing how to respond during an explosion can prevent injuries and save lives.
  primer: Explosions can happen unexpectedly and cause significant structural damage,
    leading to falling debris and other hazards. Being prepared and knowing the right
    actions to take can make a critical difference in ensuring your safety. The key
    is to remain calm, act quickly, and follow established safety guidelines. This
    includes seeking immediate shelter under sturdy furniture if debris is falling,
    and evacuating the building as soon as it is safe to do so. It's important to
    avoid using elevators and not to stop for personal belongings or phone calls during
    an evacuation. By understanding these basic steps, you can protect yourself and
    others in the event of an explosion.
  guide: '1. If you notice things falling around you during an explosion, immediately
    get under a sturdy table or desk to protect yourself from debris.


    2. Once it is safe and the falling debris has stopped, leave the building quickly.
    Be vigilant for weakened floors and stairways that could pose additional risks.


    3. As you exit, remain cautious of any falling debris that could still be a threat.


    4. Do not use elevators under any circumstances, as they may become inoperable
    or unsafe during an explosion.


    5. Avoid stopping to retrieve personal possessions or making phone calls. Your
    priority should be to exit the building safely and quickly.


    By following these steps, you can increase your chances of evacuating safely and
    without injury.'
  reference:
  - Get under a sturdy table or desk if things are falling.
  - Leave the building quickly once it is safe.
  - Watch for weakened floors and stairways.
  - Be cautious of falling debris as you exit.
  - Do not use elevators.
  - Do not stop to retrieve personal possessions or make phone calls.
  worksheet:
  - Identify sturdy furniture in your home or workplace that can be used for protection
    during an explosion.
  - Plan and practice a quick evacuation route from your building, considering alternative
    exits.
  - Discuss with family or colleagues the importance of not using elevators during
    emergencies.
  - Create a checklist of essential items to have ready for quick evacuation, but
    remember not to stop for them during an actual emergency.
  teach_forward_kit:
    three_minute_version: In an explosion, protect yourself by getting under sturdy
      furniture if debris is falling. Once safe, evacuate quickly, avoiding elevators
      and not stopping for personal items.
    ten_minute_outline:
