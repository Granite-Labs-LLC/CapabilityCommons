summary_short: Guidance on medical treatment and recovery after nuclear incidents.
summary_medium: Provides instructions on seeking medical treatment for radiation symptoms
  and following disaster recovery steps after a nuclear power plant incident.
plain_language: If you've been near a nuclear power plant incident, watch for unusual
  symptoms like nausea. Get medical help if you notice these symptoms, and follow
  any disaster recovery instructions given by authorities.
markdown_body: '# What this is

  This reference sheet provides guidance on what to do after a nuclear power plant
  incident, focusing on health and safety measures.


  # Why it matters

  Exposure to radiation can have serious health effects. Prompt medical attention
  and following recovery instructions can mitigate risks and aid in community recovery.


  # What you need

  Awareness of symptoms related to radiation exposure and access to medical services.


  # How to do it

  1. Monitor yourself and others for unusual symptoms such as nausea. 2. Seek medical
  treatment immediately if symptoms appear. 3. Follow official disaster recovery instructions
  to ensure safety and compliance.


  # Common failure modes

  Ignoring symptoms of radiation exposure or failing to follow recovery instructions
  can lead to severe health consequences and hinder community recovery efforts.


  # Safety/boundary notes

  Always prioritize health and safety by seeking professional medical advice and adhering
  to official guidelines.


  # Local adaptation notes

  Local authorities may have specific instructions based on the incident''s context.
  Always follow local guidance in addition to general recommendations.'
