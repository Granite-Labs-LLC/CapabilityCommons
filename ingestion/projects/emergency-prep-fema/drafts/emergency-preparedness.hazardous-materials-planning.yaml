summary_short: Understand the role of Local Emergency Planning Committees in hazardous
  materials preparedness.
summary_medium: This concept note explains the responsibilities of Local Emergency
  Planning Committees (LEPCs) in preparing for hazardous materials incidents, emphasizing
  community awareness and the importance of emergency plans and public notifications.
plain_language: Learn how Local Emergency Planning Committees help communities prepare
  for hazardous materials incidents by developing emergency plans and informing the
  public.
markdown_body: '### What this is

  This concept note covers the role of Local Emergency Planning Committees (LEPCs)
  in preparing for hazardous materials incidents. LEPCs are responsible for gathering
  information about hazardous materials in the community and making it available to
  the public. They also develop emergency plans to handle chemical emergencies.


  ### Why it matters

  Understanding the role of LEPCs is crucial for community safety. Proper planning
  and public awareness can significantly reduce the risks associated with hazardous
  materials incidents.


  ### What you need

  To engage with LEPCs, you need to contact your local emergency management office
  for information. Additionally, having a disaster supplies kit with items like plastic
  sheeting, duct tape, and scissors is recommended.


  ### How to do it

  Reach out to your local LEPC to learn about chemical hazards in your area and the
  emergency plans in place. Ensure you understand the public notification strategies
  and actions required during an incident.


  ### Common failure modes

  Common issues include a lack of public awareness about hazardous materials and inadequate
  emergency planning.


  ### Safety/boundary notes

  Ensure that you are aware of community-specific chemical hazards and have access
  to local emergency contact information.


  ### Local adaptation notes

  Adapt emergency plans to address specific chemical hazards present in your community
  and ensure local emergency contact information is up-to-date.'
structured_data:
  definition: Local Emergency Planning Committees (LEPCs) are responsible for preparing
    communities for hazardous materials incidents by developing emergency plans and
    informing the public.
  key_questions:
  - What is the role of LEPCs in hazardous materials preparedness?
  - How can the public access information about chemical hazards?
  - What should be included in a community emergency plan?
  misconceptions:
  - LEPCs are only responsible for responding to incidents, not planning.
  - Public notification is not a part of emergency planning.
