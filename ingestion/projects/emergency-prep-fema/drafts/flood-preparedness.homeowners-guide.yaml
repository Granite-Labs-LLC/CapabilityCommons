summary_short: Guidance for homeowners on retrofitting homes to prevent flood damage.
summary_medium: This guide provides detailed information on six retrofitting techniques
  to protect homes from flooding, aimed at homeowners seeking to mitigate flood risks.
plain_language: Learn how to retrofit your home to protect it from flooding with this
  detailed guide, which covers six effective methods.
markdown_body: '# What this is

  This guide is a comprehensive resource for homeowners looking to retrofit their
  homes to prevent flood damage. It details six specific methods that can be implemented
  to protect homes from flooding.


  # Why it matters

  Flooding can cause significant damage to homes, leading to costly repairs and loss
  of property. By retrofitting homes, homeowners can reduce the risk of flood damage,
  ensuring safety and preserving property value.


  # What you need

  Access to the guide, which includes a brochure and a detailed manual, is essential.
  Homeowners may also need to consult with professionals for certain retrofitting
  techniques.


  # How to do it

  The guide outlines six retrofitting techniques, providing step-by-step instructions
  and considerations for each method. Homeowners should assess their specific needs
  and conditions to choose the most appropriate techniques.


  # Common failure modes

  Improper retrofitting can lead to inadequate flood protection. It''s crucial to
  follow the guide carefully and consult professionals when necessary.


  # Safety/boundary notes

  Ensure all retrofitting work complies with local building codes and safety standards.


  # Local adaptation notes

  Consider local flood risks and building regulations when planning retrofitting projects.'
