markdown_body: '### What this is

  This is a glossary of terms related to thunderstorms. Understanding these terms
  can help you identify and prepare for thunderstorm hazards.


  ### Why it matters

  Knowing these terms is crucial for recognizing the signs of a thunderstorm and taking
  appropriate safety measures.


  ### What you need

  Familiarity with basic weather terminology and an interest in understanding thunderstorm
  hazards.


  ### How to do it

  Review the list of terms and their definitions. Familiarize yourself with each term
  to better understand weather reports and warnings related to thunderstorms.


  ### Common failure modes

  Misunderstanding or not recognizing the terms can lead to inadequate preparation
  for a thunderstorm.


  ### Safety/boundary notes

  Ensure that you understand the terms to accurately assess the risk and take necessary
  precautions during a thunderstorm.


  ### Local adaptation notes

  Consider local weather patterns and terminology that may differ from standard definitions.'
