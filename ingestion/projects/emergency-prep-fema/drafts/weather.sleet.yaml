summary_short: Sleet is rain that turns into ice pellets before reaching the ground.
summary_medium: Sleet consists of rain that freezes into ice pellets before reaching
  the ground, often causing slippery conditions on roads.
plain_language: Sleet happens when rain freezes into small ice pellets before it hits
  the ground. This can make roads very slippery.
markdown_body: '### What this is

  Sleet is a type of precipitation that occurs when rain falls through a layer of
  cold air and freezes into ice pellets before reaching the ground.


  ### Why it matters

  Sleet can create hazardous conditions, especially on roads and sidewalks, as the
  ice pellets can cause surfaces to become slippery and dangerous for driving and
  walking.


  ### What you need

  Awareness of weather forecasts and conditions to prepare for sleet, and appropriate
  footwear or vehicle equipment to handle slippery surfaces.


  ### How to do it

  Monitor weather reports to anticipate sleet conditions. If sleet is expected, take
  precautions such as driving slowly, using winter tires, or wearing shoes with good
  traction.


  ### Common failure modes

  Ignoring weather warnings about sleet can lead to accidents due to slippery roads.
  Not using appropriate footwear or vehicle equipment can increase the risk of falls
  or crashes.


  ### Safety/boundary notes

  Always prioritize safety by avoiding travel during sleet conditions if possible.
  If you must travel, ensure your vehicle is equipped for winter conditions.


  ### Local adaptation notes

  In areas where sleet is common, local authorities may provide additional resources
  or advisories to help residents prepare and stay safe.'
