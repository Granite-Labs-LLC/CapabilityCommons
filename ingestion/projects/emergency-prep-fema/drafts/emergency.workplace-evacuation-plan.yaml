plain_language: This project involves developing a plan to evacuate a workplace building
  safely in case of an emergency. It includes practicing the evacuation regularly,
  ensuring the HVAC system is secure, and having emergency supplies ready.
markdown_body: '### What this is

  A workplace building evacuation plan is a structured approach to ensure the safe
  and efficient evacuation of employees during emergencies. It includes procedures
  for regular practice, securing HVAC systems, and maintaining emergency supplies.


  ### Why it matters

  Having a well-developed evacuation plan can save lives and reduce panic during emergencies.
  It ensures that everyone knows what to do and where to go, minimizing confusion
  and potential injuries.


  ### What you need

  To create an effective plan, you need an evacuation plan template, an HVAC assessment
  checklist, and an emergency supply list.


  ### How to do it

  1. Develop a detailed evacuation plan using a template.

  2. Regularly practice the evacuation with all employees.

  3. Assess the HVAC system for security and the ability to filter contaminants, and
  know how to turn it off if necessary.

  4. Stock appropriate emergency supplies, considering local needs.


  ### Common failure modes

  1. Inadequate evacuation practice leading to confusion during an actual emergency.

  2. Unsecured HVAC systems that could allow contaminants to spread.

  3. Insufficient emergency supplies for employees who cannot go home.


  ### Safety/boundary notes

  Ensure that all safety protocols are followed during evacuation drills to prevent
  accidents.


  ### Local adaptation notes

  Consider regional HVAC standards and local emergency supply needs when developing
  your plan.'
