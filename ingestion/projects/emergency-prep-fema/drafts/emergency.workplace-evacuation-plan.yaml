bundle_overrides:
  hook: A well-prepared workplace evacuation plan can save lives and prevent chaos
    during emergencies.
  primer: A workplace building evacuation plan is a critical safety measure designed
    to ensure the safe and efficient evacuation of employees during emergencies. This
    plan outlines the procedures for evacuating a building, securing the HVAC systems
    to prevent the spread of contaminants, and maintaining adequate emergency supplies.
    Regular practice of the evacuation plan is essential to ensure that all employees
    know what to do and where to go, reducing confusion and potential injuries during
    an actual emergency. Creating an effective plan involves using an evacuation plan
    template, conducting an HVAC assessment, and preparing an emergency supply list.
    By having a well-developed evacuation plan, workplaces can significantly reduce
    panic and improve safety during emergencies.
  guide: '1. **Develop the Evacuation Plan**: Start by using an evacuation plan template
    to outline the steps for safely exiting the building. Include details such as
    exit routes, assembly points, and roles for key personnel.


    2. **Practice Regularly**: Schedule regular evacuation drills with all employees
    to ensure everyone is familiar with the plan. These drills should be conducted
    at least twice a year and after any significant changes to the building layout
    or staff.


    3. **Assess the HVAC System**: Conduct a thorough assessment of your heating,
    ventilation, and air conditioning (HVAC) system. Ensure it is secure and capable
    of filtering out potential contaminants. Know how to turn off the system if necessary
    during an emergency.


    4. **Stock Emergency Supplies**: Prepare an emergency supply list and ensure that
    all necessary items are readily available. Supplies should include first aid kits,
    flashlights, batteries, water, and non-perishable food items. Consider the specific
    needs of your location and employees.


    5. **Review and Update**: Regularly review and update the evacuation plan to incorporate
    any changes in building layout, staff, or local regulations. Ensure that all employees
    are informed of any updates.'
  reference:
  - Evacuation plan template
  - HVAC assessment checklist
  - Emergency supply list
  - Regular evacuation drills
  - HVAC system security
  - Adequate emergency supplies
  worksheet:
  - Identify the primary and secondary exit routes in your workplace.
  - List the roles and responsibilities of key personnel during an evacuation.
  - Conduct a mock evacuation drill and note any areas for improvement.
  - Assess your HVAC system and document any security or filtration upgrades needed.
  - Create an emergency supply list tailored to your workplace needs.
  teach_forward_kit:
    three_minute_version: A workplace evacuation plan ensures safe and efficient evacuation
      during emergencies. It involves regular drills, securing HVAC systems, and maintaining
      emergency supplies. Regular practice and updates are crucial for effectiveness.
    ten_minute_outline:
    - Introduction to the importance of evacuation plans
    - Key components of an evacuation plan
    - Steps to develop and implement the plan
    - Importance of regular practice and updates
    - Assessing and securing HVAC systems
    - Maintaining and updating emergency supplies
    discussion_prompts:
    - Why is it important to have a workplace evacuation plan?
    - What challenges might arise during an evacuation, and how can they be addressed?
    - How can regular drills improve the effectiveness of an evacuation plan?
    - What specific considerations should be made for securing HVAC systems?
    - How can workplaces ensure they have adequate emergency supplies?
