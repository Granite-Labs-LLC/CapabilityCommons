summary_short: The heat index measures perceived heat by combining air temperature
  and humidity.
summary_medium: The heat index is a measure in degrees Fahrenheit that indicates how
  hot it feels when relative humidity is added to the air temperature. Full sunshine
  exposure can increase the heat index by 15 degrees.
plain_language: The heat index helps us understand how hot it feels outside by considering
  both the air temperature and the humidity. When it's sunny, it can feel even hotter.
markdown_body: '### What this is

  The heat index is a number that represents how hot it feels when you combine the
  air temperature with the relative humidity. It is expressed in degrees Fahrenheit.


  ### Why it matters

  Understanding the heat index is important for assessing the risk of heat-related
  illnesses. It helps people make informed decisions about outdoor activities and
  necessary precautions during hot weather.


  ### What you need

  To calculate the heat index, you need the current air temperature and the relative
  humidity percentage.


  ### How to do it

  Use a heat index chart or an online calculator where you input the air temperature
  and relative humidity to find out how hot it feels. Be aware that full sunshine
  can increase the heat index by up to 15 degrees Fahrenheit.


  ### Common failure modes

  Ignoring the heat index can lead to underestimating the risk of heat-related illnesses.
  Not accounting for full sunshine exposure can result in a miscalculation of perceived
  heat.


  ### Safety/boundary notes

  Always consider the heat index when planning outdoor activities in hot weather to
  prevent heat exhaustion or heat stroke.


  ### Local adaptation notes

  In areas with high humidity, the heat index can be significantly higher, requiring
  more caution during hot weather.'
