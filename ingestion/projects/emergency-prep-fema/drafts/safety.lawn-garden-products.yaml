markdown_body: '### What this is

  This reference sheet provides an overview of safety considerations for using common
  lawn and garden products, including herbicides, insecticides, and fungicides/wood
  preservatives.


  ### Why it matters

  Understanding the safety aspects of these products is crucial to prevent harm to
  humans, pets, and the environment.


  ### What you need

  Knowledge of the specific products you are using, including their intended use and
  safety instructions.


  ### How to do it

  Always read and follow the label instructions on each product. Use appropriate protective
  gear such as gloves and masks, and ensure proper storage away from children and
  pets.


  ### Common failure modes

  Misuse of products, such as over-application or incorrect mixing, can lead to safety
  hazards.


  ### Safety/boundary notes

  Ensure products are used in well-ventilated areas and avoid contact with skin and
  eyes. Dispose of containers according to local regulations.


  ### Local adaptation notes

  Check local guidelines for specific restrictions or recommendations on the use of
  these products.'
