summary_short: Lawn care tips for conserving water.
summary_medium: Learn how to conserve water while maintaining your lawn with effective
  watering strategies, proper mower blade height, and appropriate fertilizer use.
plain_language: This guide provides tips on how to care for your lawn in a way that
  conserves water. It includes advice on watering, mowing, and fertilizing.
markdown_body: "### What this is\nThis reference sheet provides guidelines for maintaining\
  \ a lawn while conserving water. It covers watering techniques, mower adjustments,\
  \ and fertilizer use.\n\n### Why it matters\nConserving water is crucial for environmental\
  \ sustainability, especially in areas prone to drought. Proper lawn care can significantly\
  \ reduce water usage.\n\n### What you need\nYou will need a sprinkler system, a\
  \ lawn mower, and fertilizers. Ensure your sprinkler system is efficient and your\
  \ mower blade is adjustable.\n\n### How to do it\n1. Avoid over watering; lawns\
  \ typically need one inch of water per week. \n2. Water in short sessions for better\
  \ absorption. \n3. Position sprinklers to avoid watering paved areas. \n4. Use sprinklers\
  \ that don't produce a fine mist. \n5. Raise mower blades to at least three inches.\
  \ \n6. Use drought-resistant seeds. \n7. Apply slow-release fertilizers sparingly.\n\
  \n### Common failure modes\nOver watering, inefficient sprinkler use, and over-fertilizing\
  \ are common mistakes that lead to excessive water use.\n\n### Safety/boundary notes\n\
  Ensure sprinklers and hoses are not left unattended to prevent water wastage.\n\n\
  ### Local adaptation notes\nAdjust practices based on local climate conditions and\
  \ the availability of drought-resistant seeds."
