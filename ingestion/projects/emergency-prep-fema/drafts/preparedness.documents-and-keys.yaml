markdown_body: '### What this is

  This is a checklist of essential documents and keys that should be stored in a watertight
  container to ensure they are protected and accessible during emergencies.


  ### Why it matters

  In emergencies, having quick access to important documents and keys can be crucial
  for safety, identification, and accessing resources. Protecting these items from
  water damage ensures they remain usable when needed most.


  ### What you need

  A watertight container to store the documents and keys.


  ### How to do it

  Gather personal identification, cash, credit cards, extra keys, and copies of important
  documents such as birth certificates, marriage certificates, driver''s licenses,
  Social Security cards, passports, wills, deeds, household inventory, insurance papers,
  immunization records, bank and credit card account numbers, stocks and bonds. Include
  an emergency contact list, phone numbers, and a map of the area. Store all these
  items in a watertight container.


  ### Common failure modes

  Documents may be damaged by water if not stored properly. The document set may be
  incomplete if not regularly updated.


  ### Safety/boundary notes


  ### Local adaptation notes

  Consider the availability of secure storage options and any local document requirements
  when preparing your emergency kit.'
