summary_short: A reference sheet listing various indoor pesticides.
summary_medium: This reference sheet provides a list of common indoor pesticides including
  ant sprays, cockroach sprays, flea repellents, and mouse poisons.
plain_language: Learn about different types of indoor pesticides and their uses.
markdown_body: '### What this is

  This reference sheet lists various types of indoor pesticides commonly used to control
  pests within homes.


  ### Why it matters

  Understanding the types of indoor pesticides available can help in effectively managing
  pest problems while ensuring safety.


  ### What you need

  Awareness of the specific pest problem and the appropriate pesticide to use.


  ### How to do it

  Identify the pest issue and select the corresponding pesticide from the list: ant
  sprays and baits, cockroach sprays and baits, flea repellents and shampoos, bug
  sprays, houseplant insecticides, moth repellents, mouse and rat poisons and baits.


  ### Common failure modes

  Using the wrong type of pesticide for a specific pest can lead to ineffective pest
  control.


  ### Safety/boundary notes

  Always follow the manufacturer''s instructions and safety guidelines when using
  pesticides to avoid health risks.


  ### Local adaptation notes

  Consider local pest types and regulations regarding pesticide use.'
structured_data:
  definition: Indoor pesticides are chemical substances used to control or kill pests
    inside homes.
  key_questions:
  - What type of pest are you dealing with?
  - Which pesticide is appropriate for the pest?
  misconceptions:
  - All pesticides work on all types of pests.
  - More pesticide is always better.
