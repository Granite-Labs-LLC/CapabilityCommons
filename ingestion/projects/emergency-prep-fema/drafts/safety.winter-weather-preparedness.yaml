markdown_body: '### What this is

  This reference sheet provides guidelines on how to dress and what actions to take
  during winter storms or extreme cold conditions to ensure safety and prevent health
  risks.


  ### Why it matters

  Winter storms and extreme cold can pose serious health risks such as frostbite and
  hypothermia. Proper preparation and response can prevent these dangers and ensure
  safety.


  ### What you need

  - NOAA Weather Radio

  - Mittens

  - Hat

  - Scarf

  - Layered clothing


  ### How to do it

  Wear several layers of loose-fitting, lightweight, warm clothing. Use mittens instead
  of gloves, wear a hat, and cover your mouth with a scarf. Listen to weather reports
  and avoid overexertion. If driving, stay on main roads and inform others of your
  schedule. If stranded, stay in your vehicle, run the engine periodically for warmth,
  and maintain ventilation.


  ### Common failure modes

  - Frostbite

  - Hypothermia

  - Carbon monoxide poisoning


  ### Safety/boundary notes

  Maintain ventilation when using heaters to avoid toxic fumes. Avoid caffeine and
  alcohol as they can affect body temperature regulation.


  ### Local adaptation notes

  Use local weather reports for accurate information. Adapt clothing to fit the local
  climate conditions.'
