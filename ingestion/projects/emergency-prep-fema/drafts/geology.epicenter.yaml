summary_short: The epicenter is the surface location directly above the earthquake's
  origin.
summary_medium: The epicenter is the point on the earth's surface directly above where
  an earthquake rupture begins on a fault line.
plain_language: The epicenter is the spot on the ground right above where an earthquake
  starts deep in the earth.
markdown_body: '### What this is

  The epicenter is the location on the earth''s surface that is directly above the
  point where an earthquake starts, known as the focus or hypocenter. It is the point
  from which seismic waves spread outward during an earthquake.


  ### Why it matters

  Understanding the epicenter is crucial for assessing the impact of an earthquake.
  It helps in determining which areas are most affected and in planning emergency
  response and recovery efforts.


  ### What you need

  To identify an epicenter, seismologists use data from multiple seismic stations
  to triangulate the location of the earthquake''s origin.


  ### How to do it

  Seismologists measure the time it takes for seismic waves to reach different stations.
  By comparing these times, they can calculate the distance to the epicenter from
  each station and pinpoint its location using triangulation.


  ### Common failure modes

  Errors in locating the epicenter can occur if there are insufficient seismic stations
  or if the data from these stations is inaccurate.


  ### Safety/boundary notes

  While the epicenter is a critical point for understanding an earthquake''s impact,
  the most severe damage may not always occur directly above it due to the nature
  of seismic wave propagation.


  ### Local adaptation notes

  In regions with dense seismic networks, epicenter locations can be determined more
  accurately, aiding in more effective emergency response.'
