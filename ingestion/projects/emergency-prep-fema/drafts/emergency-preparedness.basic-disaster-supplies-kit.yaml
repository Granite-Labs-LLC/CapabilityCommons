    page_start: 36
    page_end: 36
    segment_id: src.fema.are-you-ready.2004::seg_000050
    excerpt: 'If you live in a cold climate, you must think about warmth. It is possible
      that you will not have heat. Think about your clothing and bedding supplies.
      Be sure to include one complete change of clothing and shoes per person, including:
      Jacket or coat. Long pants. Long sleeve shirt. Sturdy shoes. Hat, mittens, and
      scarf. Sleeping bag or warm blanket (per person). Be sure to account for growing
      children and other family changes.'
    start_char: 0
    end_char: 1000
    support_strength: strong
