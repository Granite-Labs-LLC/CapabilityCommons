- object_id: emergency-preparedness.basic-disaster-supplies-kit
  claim_id: clm_005
  claim_text: Common issues include having an incomplete kit, expired supplies, or
    inadequate clothing for the climate.
  support:
  - source_id: src.fema.are-you-ready.2004
    page_start: 37
    page_end: 37
    segment_id: src.fema.are-you-ready.2004::seg_000051
    excerpt: 'Just as important as putting your supplies together is maintaining them
      so they are safe to use when needed. Here are some tips to keep your supplies
      ready and in good condition: Keep canned foods in a dry place where the temperature
      is cool. Store boxed food in tightly closed plastic or metal containers to protect
      from pests and to extend its shelf life. Throw out any canned good that becomes
      swollen, dented, or corroded. Use foods before they go bad, and replace them
      with fresh supplies. Place new items at the back of the storage area and older
      ones in the front. Change stored food and water supplies every six months. Be
      sure to write the date you store it on all containers. Re-think your needs every
      year and update your kit as your family needs change. Keep items in airtight
      plastic bags and put your entire disaster supplies kit in one or two easy-to-carry
      containers, such as an unused trashcan, camping backpack, or duffel bag.'
    start_char: 0
    end_char: 1000
    support_strength: medium
