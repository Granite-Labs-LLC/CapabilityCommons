plain_language: This guide helps you prepare a basic disaster supplies kit with essential
  items like food, water, and clothing to ensure safety and comfort during emergencies.
markdown_body: '### What this is

  A basic disaster supplies kit is a collection of essential items you may need in
  the event of an emergency. It includes food, water, clothing, and other necessities
  to help you and your family stay safe and comfortable.


  ### Why it matters

  Having a well-prepared disaster supplies kit can be crucial during emergencies,
  ensuring that you have the necessary resources to survive and maintain well-being
  when access to regular supplies and services is disrupted.


  ### What you need

  You will need non-perishable food, water, a battery-powered radio, flashlight, first
  aid kit, sanitation items, matches, a whistle, extra clothing, kitchen accessories,
  cash, and any special needs items specific to your family.


  ### How to do it

  Assemble a three-day supply of non-perishable food and water (one gallon per person
  per day). Include a portable radio, flashlight, first aid kit, sanitation items,
  matches, a whistle, extra clothing, kitchen utensils, and cash. Consider special
  needs such as medications and items for infants. Adjust clothing and bedding for
  cold climates.


  ### Common failure modes

  Common issues include having an incomplete kit, expired supplies, or inadequate
  clothing for the climate.


  ### Safety/boundary notes

  Ensure all items are safe to use and check expiration dates regularly. Tailor the
  kit to your family''s specific needs.


  ### Local adaptation notes

  Consider climate-specific clothing and bedding. Account for family changes, such
  as growing children or new medical needs.'
