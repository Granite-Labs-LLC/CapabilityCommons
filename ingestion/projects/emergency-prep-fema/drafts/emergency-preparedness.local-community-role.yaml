summary_short: Local communities play a crucial role in emergency management by identifying
  hazards, planning, and coordinating resources.
summary_medium: Local communities are responsible for identifying hazards, enforcing
  codes, coordinating emergency plans, and managing resources to ensure effective
  emergency response and recovery.
plain_language: Local communities are essential in managing emergencies. They identify
  risks, plan responses, and coordinate resources to protect citizens during disasters.
markdown_body: '### What this is

  This concept note explains the responsibilities of local communities in emergency
  preparedness and management. It highlights the critical role local officials and
  volunteers play in ensuring community safety during emergencies.


  ### Why it matters

  Local communities are often the first responders in emergencies. Their ability to
  identify hazards, enforce safety codes, and coordinate plans directly impacts the
  effectiveness of emergency responses and the safety of citizens.


  ### What you need

  Understanding of local hazards, emergency planning skills, and knowledge of available
  community resources.


  ### How to do it

  Local officials should identify potential hazards, enforce building and safety codes,
  coordinate emergency plans, establish warning systems, and stock emergency supplies.
  They should also assess damage and coordinate recovery efforts.


  ### Common failure modes

  Insufficient resources, poor coordination, and lack of hazard identification can
  lead to ineffective emergency responses.


  ### Safety/boundary notes

  Ensure all emergency plans comply with local, state, and federal regulations to
  maintain safety and effectiveness.


  ### Local adaptation notes

  Adapt emergency plans based on local hazard assessments and available community
  resources.'
structured_data:
  definition: Local communities are responsible for managing emergencies by identifying
