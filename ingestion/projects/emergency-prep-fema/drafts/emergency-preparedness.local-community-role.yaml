  key_questions:
  - What are the primary hazards in the local area?
  - How can local resources be best utilized during an emergency?
  - What are the roles of local officials and volunteers in emergency management?
  misconceptions:
  - Emergency management is solely the responsibility of the federal government.
  - Local communities do not need to prepare if state or federal assistance is available.
