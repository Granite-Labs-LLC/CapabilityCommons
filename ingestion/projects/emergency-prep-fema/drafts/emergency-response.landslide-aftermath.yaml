markdown_body: '### What this is

  This document provides guidelines for actions to take after experiencing a landslide
  or debris flow. It includes safety precautions and steps for recovery.


  ### Why it matters

  Landslides and debris flows can cause significant damage and pose ongoing risks.
  Knowing how to respond safely can prevent further harm and aid in recovery.


  ### What you need

  Awareness of potential dangers, access to emergency services, and contact with geotechnical
  experts.


  ### How to do it

  - **Stay away from the slide area**: Additional slides may occur, posing further
  danger.

  - **Check for injured persons**: Without entering the slide area, identify and direct
  rescuers to any injured or trapped individuals.

  - **Watch for associated dangers**: Be alert for broken utility lines and damaged
  infrastructure.

  - **Replant damaged ground**: To prevent erosion and potential flash flooding, replant
  ground cover as soon as possible.

  - **Seek expert advice**: Consult with geotechnical experts to assess hazards and
  design corrective measures.


  ### Common failure modes

  Entering the slide area, ignoring potential dangers like broken utility lines, and
  failing to address erosion risks.


  ### Safety/boundary notes

  Avoid entering the slide area due to the risk of additional slides.


  ### Local adaptation notes

  Consult local geotechnical experts to tailor recovery efforts to specific regional
  conditions.'
