summary_short: Understand flood hazards and risks in the U.S.
summary_medium: An overview of flood hazards, types, and risks in the United States,
  emphasizing the importance of awareness regardless of location.
plain_language: Floods are common in the U.S. and can happen anywhere. It's important
  to know the risks and be prepared.
markdown_body: '### What this is

  Flood awareness involves understanding the different types of floods and the risks
  they pose. Floods can be local or widespread, affecting small areas or entire regions.


  ### Why it matters

  Floods are one of the most common natural hazards in the United States. Awareness
  is crucial because floods can occur anywhere, and even small streams or dry areas
  can become dangerous.


  ### What you need

  Knowledge of local flood risks and potential flood areas, such as low-lying regions
  or areas near water bodies or dams.


  ### How to do it

  Stay informed about flood hazards in your area, understand the types of floods that
  can occur, and recognize the signs of potential flooding.


  ### Common failure modes

  Underestimating flood risk and ignoring small streams or dry areas that can flood.


  ### Safety/boundary notes

  Be particularly cautious if you live in low-lying areas or near water bodies.


  ### Local adaptation notes

  Consider local geography, such as proximity to rivers, streams, or dams, when assessing
  flood risk.'
structured_data:
  definition: Flood awareness is the understanding of flood hazards, types, and risks.
  key_questions:
  - What are the different types of floods?
  - How can floods affect my area?
  - What are the signs of an impending flood?
  misconceptions:
  - Floods only happen near large rivers.
  - Dry areas are always safe from flooding.
