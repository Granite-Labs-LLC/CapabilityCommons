summary_short: Learn how to safely use heating sources to prevent fires.
summary_medium: This guide provides safety measures for using heating sources, such
  as kerosene heaters and fireplaces, to prevent fires. It includes inspection tips
  and proper fuel usage.
plain_language: Using heating sources like fireplaces and kerosene heaters can be
  risky if not done properly. This guide will help you understand how to use these
  sources safely to prevent fires.
markdown_body: '### What this is

  This guide covers safety measures for using various heating sources, including kerosene
  heaters and fireplaces, to prevent fire hazards.


  ### Why it matters

  Improper use of heating sources can lead to fires, causing damage to property and
  endangering lives. Understanding and implementing safety measures can significantly
  reduce these risks.


  ### What you need

  You will need kerosene heaters, a metal container for ashes, and access to a certified
  specialist for inspections.


  ### How to do it

  1. Check with your local fire department about the legality of using kerosene heaters.

  2. Always fill kerosene heaters outside and only when they are cool.

  3. Place heaters at least three feet away from flammable materials and ensure proper
  insulation of floors and walls.

  4. Use only the designated fuel for your unit and follow the manufacturer''s instructions.

  5. Store ashes in a metal container outside and away from your residence.

  6. Keep open flames away from walls, furniture, and other flammable items.

  7. Use a screen in front of fireplaces.

  8. Have heating units inspected and cleaned annually by a certified specialist.


  ### Common failure modes

  Improper fuel use, uninspected units, and placing heaters too close to flammable
  materials.


  ### Safety/boundary notes

  Ensure all safety measures are followed to prevent fire hazards.


  ### Local adaptation notes

  Check local regulations regarding the use of specific heating sources like kerosene
  heaters.'
