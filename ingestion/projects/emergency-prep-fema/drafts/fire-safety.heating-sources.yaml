bundle_overrides:
  hook: Using heating sources safely can prevent fires, protect your home, and save
    lives.
  primer: Heating sources like kerosene heaters and fireplaces are common in many
    homes, especially during colder months. While they provide warmth, they also pose
    significant fire risks if not used correctly. Understanding how to safely operate
    these heating devices is crucial to prevent accidents. This guide will cover essential
    safety measures, such as keeping heaters away from flammable materials, using
    the correct type of fuel, and ensuring regular maintenance. By following these
    guidelines, you can enjoy the comfort of a warm home without compromising safety.
  guide: '1. **Check Local Regulations**: Before using a kerosene heater, contact
    your local fire department to ensure it''s legal in your area.


    2. **Safe Refueling Practices**: Always fill kerosene heaters outside and only
    when they are cool to prevent accidental fires.


    3. **Maintain Safe Distances**: Place heaters at least three feet away from flammable
    materials like curtains, furniture, and walls. Ensure that floors and walls are
    properly insulated.


    4. **Use Correct Fuel**: Only use the type of fuel specified by the manufacturer
    for your heating unit. This prevents malfunctions and potential hazards.


    5. **Ash Disposal**: Store ashes from fireplaces in a metal container, and keep
    it outside and away from your residence to prevent fire risks.


    6. **Manage Open Flames**: Keep open flames away from walls, furniture, and other
    flammable items. Always use a screen in front of fireplaces to contain sparks.


    7. **Regular Maintenance**: Have all heating units inspected and cleaned annually
    by a certified specialist to ensure they are in safe working condition.'
