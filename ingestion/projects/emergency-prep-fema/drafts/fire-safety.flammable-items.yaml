markdown_body: '### What this is

  This guide provides instructions on how to safely store and handle flammable items
  to prevent fires.


  ### Why it matters

  Improper storage and handling of flammable items can lead to accidental fires, posing
  a risk to life and property.


  ### What you need

  - Approved containers for flammable liquids

  - A metal container for discarding soaked rags


  ### How to do it

  Store flammable liquids in approved containers and keep them in well-ventilated
  areas. Never smoke near these liquids. Discard rags soaked in flammable liquids
  in a metal container outdoors.


  ### Common failure modes

  - Improper storage of flammable liquids

  - Ignition due to smoking near flammable items


  ### Safety/boundary notes

  Ensure all storage areas are well-ventilated and away from ignition sources.


  ### Local adaptation notes

  Consider local regulations and guidelines for storing flammable materials.'
