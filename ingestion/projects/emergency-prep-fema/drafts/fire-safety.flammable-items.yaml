bundle_overrides:
  hook: Properly handling and storing flammable items can prevent dangerous fires
    and protect your home and loved ones.
  primer: Flammable items, such as gasoline and certain cleaning agents, pose a significant
    fire risk if not handled and stored correctly. These substances can ignite easily,
    leading to potentially devastating fires. To mitigate these risks, it's crucial
    to store flammable liquids in approved containers and keep them in well-ventilated
    areas. Smoking near these items should be strictly avoided, as even a small spark
    can cause ignition. Additionally, rags soaked in flammable liquids should be discarded
    in a metal container outdoors to prevent spontaneous combustion. By following
    these guidelines, you can significantly reduce the risk of fire in your home or
    workplace.
  guide: '1. **Gather Materials**: Ensure you have approved containers for storing
    flammable liquids and a metal container for discarding soaked rags.


    2. **Store Flammable Liquids Safely**: Place all flammable liquids in approved
    containers. These containers are specifically designed to prevent leaks and reduce
    the risk of ignition. Store these containers in a well-ventilated area, away from
    any potential sources of ignition such as electrical outlets or open flames.


    3. **Avoid Smoking Near Flammable Items**: Smoking near flammable liquids is extremely
    dangerous. Ensure that no one smokes in areas where these items are stored or
    used.


    4. **Dispose of Soaked Rags Properly**: After using rags with flammable liquids,
    do not leave them indoors. Instead, place them in a metal container and store
    them outdoors. This prevents the risk of spontaneous combustion, which can occur
    if the rags are left in a confined space.


    5. **Regularly Check Storage Areas**: Periodically inspect the storage areas to
    ensure they remain well-ventilated and free from ignition sources. Ensure that
    all containers are in good condition and replace any that are damaged.


    6. **Follow Local Regulations**: Be aware of and comply with any local regulations
    regarding the storage and disposal of flammable materials. These regulations are
    designed to keep you and your community safe.'
