summary_short: Overview of explosive devices used by terrorists.
summary_medium: Explosive devices are commonly used by terrorists due to their availability
  and impact. They can be constructed from materials found in everyday stores and
  are easily transported and detonated.
plain_language: Explosive devices are tools used by terrorists to cause harm and disruption.
  They are made from materials that are easy to find and can be set off remotely or
  by individuals.
markdown_body: '# What this is

  Explosive devices are weapons used by terrorists to inflict damage and instill fear.
  They are constructed from readily available materials and can be transported and
  detonated with ease.


  # Why it matters

  Understanding the use of explosive devices is crucial for public safety and emergency
  response. These devices have been used to target financial, political, social, and
  religious institutions, causing significant harm and loss of life.


  # What you need

  Knowledge of the materials and methods used to construct and deploy explosive devices
  is essential for identifying potential threats and implementing safety measures.


  # How to do it

  Emergency responders should be trained to recognize the signs of explosive devices
  and understand the protocols for safely managing and defusing such threats.


  # Common failure modes

  Failure to identify the materials or methods used in explosive devices can lead
  to inadequate response and increased risk of harm.


  # Safety/boundary notes

  Always prioritize personal safety and follow established protocols when dealing
  with potential explosive threats. Engage professional bomb disposal units when necessary.


  # Local adaptation notes

  Adapt response strategies to local contexts, considering the availability of materials
  and potential targets in the area.'
structured_data:
  definition: Explosive devices are tools used by terrorists to cause destruction
    and fear, constructed from accessible materials and capable of being transported
    and detonated easily.
  key_questions:
  - What materials are commonly used in explosive devices?
  - How are explosive devices typically transported and detonated?
  - What are the common targets of explosive device attacks?
  misconceptions:
  - Explosive devices are difficult to construct and require specialized knowledge.
  - Only large, high-profile targets are at risk of explosive device attacks.
  safety_boundary: This is background/awareness information about a hazard, adapted
    from FEMA's public citizen-preparedness guide. It is not a substitute for official
    warnings, alerts, or instructions from local emergency management, law enforcement,
    or emergency responders during an actual event.
