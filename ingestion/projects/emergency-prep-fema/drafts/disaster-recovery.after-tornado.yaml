plain_language: Learn how to safely recover after a tornado with these step-by-step
  instructions.
markdown_body: "### What this is\nThis guide provides instructions on how to recover\
  \ after experiencing a tornado, focusing on safety and effective recovery strategies.\n\
  \n### Why it matters\nTornadoes can cause significant damage and pose serious safety\
  \ risks. Proper recovery steps are crucial to ensure safety and begin rebuilding.\n\
  \n### What you need\nA clear understanding of safety protocols, access to emergency\
  \ services, and knowledge of local resources.\n\n### How to do it\n1. Ensure your\
  \ safety and the safety of others by avoiding damaged structures. \n2. Listen to\
  \ local authorities for updates and instructions. \n3. Check for injuries and provide\
  \ first aid if necessary. \n4. Avoid downed power lines and report them to the authorities.\
  \ \n5. Document damage for insurance purposes. \n6. Begin cleanup and repairs only\
  \ when it is safe to do so.\n\n### Common failure modes\nIgnoring safety warnings,\
  \ attempting to enter unsafe structures, and failing to document damage properly.\n\
  \n### Safety/boundary notes\nAlways prioritize personal safety and the safety of\
  \ others. Do not enter damaged buildings until they have been declared safe by authorities.\n\
  \n### Local adaptation notes\nAdapt recovery efforts based on local resources and\
  \ specific community needs."
