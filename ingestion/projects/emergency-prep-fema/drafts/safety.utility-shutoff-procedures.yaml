bundle_overrides:
  hook: Knowing how to safely shut off utilities during emergencies can prevent fires
    and ensure water safety, protecting your home and loved ones.
  primer: In the event of a disaster, utility lines such as those for natural gas
    and water can become damaged, leading to potential hazards like gas leaks or water
    contamination. Understanding how to safely shut off these utilities is crucial
    for preventing fires and ensuring the safety of your water supply. This guide
    provides essential instructions on how to turn off utilities like natural gas
    and water during emergencies. It is important for all household members to be
    familiar with these procedures to act quickly and effectively when needed. The
    guide emphasizes the importance of contacting local utility companies to learn
    the specific shut-off procedures for your home, as different configurations may
    require different actions. Additionally, practicing the shut-off procedures without
    actually turning off the utilities is recommended to ensure everyone knows what
    to do in an emergency. Remember, never attempt to turn the gas back on yourself;
    always have a qualified professional do it.
  guide: '1. **Contact Local Utility Companies**: Reach out to your local gas and
    water companies to learn the proper shut-off procedures for your specific utility
    meter configurations. Share this information with all household members.


    2. **Practice the Procedure**: Familiarize yourself with the gas shut-off procedure
    by practicing it without actually turning off the gas. This ensures everyone knows
    what to do in an emergency.


    3. **Respond to Gas Leaks**: If you smell gas or hear a hissing noise, evacuate
    the premises immediately. Turn off the gas at the main valve if it is safe to
    do so, and call the gas company from a safe location.


    4. **Shut Off Water**: Learn how to shut off the water at the main house valve
    to prevent contamination. Avoid using the street valve as it requires a special
    tool and is difficult to operate.


    5. **Safety Precautions**: Never attempt to turn the gas back on yourself. Always
    have a qualified professional handle it to ensure safety.


    6. **Review and Update**: Regularly review the shut-off procedures with your household
    and update any information as needed, especially if there are changes to your
    utility services or household members.'
  reference:
  - Contact local utility companies for shut-off procedures.
  - Practice gas shut-off without turning it off.
  - Evacuate if you smell gas or hear hissing.
  - Shut off water at the main house valve.
  - Never turn gas back on yourself; call a professional.
  worksheet:
  - List the contact information for your local gas and water companies.
  - Identify and label the main gas and water shut-off valves in your home.
  - Practice the gas shut-off procedure with all household members.
  - Discuss and document the steps to take if a gas leak is suspected.
  - Review the procedure for shutting off water at the main house valve.
