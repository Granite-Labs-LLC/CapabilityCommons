plain_language: This guide helps you learn how to safely turn off utilities like natural
  gas and water in case of an emergency. It includes steps to follow and safety tips.
markdown_body: '# What this is

  This guide provides instructions on how to safely shut off utilities, such as natural
  gas and water, during emergencies to prevent hazards like fires and water contamination.


  # Why it matters

  In disasters, utility lines can become damaged, leading to gas leaks or water contamination.
  Knowing how to shut off utilities can prevent fires and ensure water safety.


  # What you need

  Contact information for local utility companies, knowledge of your utility meter
  configurations, and a special tool for the street valve if needed.


  # How to do it

  1. Contact your local gas company to learn the proper shut-off procedure for your
  gas meter. Share this information with all household members.

  2. Practice the gas shut-off procedure without actually turning off the gas.

  3. If you smell gas or hear a hissing noise, evacuate immediately, turn off the
  gas at the main valve, and call the gas company from a safe location.

  4. Learn how to shut off water at the main house valve to prevent contamination.
  Do not use the street valve as it requires a special tool.


  # Common failure modes

  Incorrect shut-off procedure, attempting to turn gas back on without professional
  help.


  # Safety/boundary notes

  Never attempt to turn the gas back on yourself. Always have a qualified professional
  do it.


  # Local adaptation notes

  Modify shut-off procedures based on guidance from your local utility company.'
