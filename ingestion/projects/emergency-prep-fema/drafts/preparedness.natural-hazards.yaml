summary_short: Learn how to prepare for various natural hazards.
summary_medium: This module provides guidance on preparing for natural hazards such
  as floods, tornadoes, hurricanes, and more.
plain_language: This guide helps you get ready for different natural disasters by
  explaining what they are and how to prepare for them.
markdown_body: '# What this is

  This module is a comprehensive guide to preparing for various natural hazards. It
  covers a range of disasters including floods, tornadoes, hurricanes, thunderstorms,
  winter storms, extreme heat, earthquakes, volcanoes, landslides, tsunamis, fires,
  and wildfires.


  # Why it matters

  Natural hazards can cause significant damage and pose serious risks to life and
  property. Being prepared can help mitigate these risks and ensure safety during
  such events.


  # What you need

  To prepare for natural hazards, you need information about the specific risks in
  your area, a disaster supplies kit, and a family emergency plan.


  # How to do it

  1. Get informed about the types of natural hazards that can occur in your area.
  2. Develop an emergency plan that includes evacuation routes and communication strategies.
  3. Assemble a disaster supplies kit with essentials such as water, food, and medical
  supplies. 4. Practice and maintain your plan regularly.


  # Common failure modes

  Failing to update emergency plans, not having a complete disaster supplies kit,
  and not practicing evacuation routes can lead to increased risk during a natural
  hazard.


  # Safety/boundary notes

  Always prioritize safety by following official guidance and evacuation orders during
  a natural hazard.


  # Local adaptation notes

  Adapt your preparedness plans based on the specific natural hazards prevalent in
  your local area.'
