bundle_overrides:
  hook: Being prepared for natural hazards can save lives and reduce damage to your
    property.
  primer: Natural hazards, such as floods, hurricanes, earthquakes, and wildfires,
    can cause significant damage and pose serious risks to life and property. Preparing
    for these events is crucial to ensure safety and minimize potential losses. This
    involves understanding the specific risks in your area, creating a comprehensive
    emergency plan, and assembling a disaster supplies kit. An emergency plan should
    include evacuation routes and communication strategies, while a disaster supplies
    kit should contain essentials like water, food, and medical supplies. Regular
    practice and updates to your plan are necessary to maintain readiness. By being
    informed and prepared, you can reduce fear and anxiety during a disaster and ensure
    a quicker recovery.
  guide: '1. **Get Informed**: Research the types of natural hazards that can occur
    in your area. This includes understanding the local climate and geography to identify
    potential risks such as floods, earthquakes, or hurricanes.


    2. **Develop an Emergency Plan**: Create a plan that includes evacuation routes,
    communication strategies, and meeting points for family members. Ensure everyone
    in your household knows the plan and practices it regularly.


    3. **Assemble a Disaster Supplies Kit**: Gather essentials such as water, non-perishable
    food, a first-aid kit, flashlights, batteries, and important documents. Store
    these items in a portable container that is easily accessible.


    4. **Practice and Maintain Your Plan**: Regularly review and practice your emergency
    plan with your family. Update the plan and supplies kit as needed, especially
    when there are changes in your household or local hazard information.


    5. **Stay Informed During a Hazard**: Monitor local news and weather reports for
    updates during a natural hazard. Follow official guidance and evacuation orders
    to ensure your safety.'
  reference:
  - Get informed about local natural hazards.
  - Develop an emergency plan with evacuation routes.
  - Assemble a disaster supplies kit.
  - Practice and maintain your emergency plan.
  - Follow official guidance during a natural hazard.
  worksheet:
  - List the natural hazards most likely to occur in your area.
  - Create a family emergency plan and outline evacuation routes.
  - Inventory your current disaster supplies kit and identify missing items.
  - Schedule a family practice session for your emergency plan.
  - Research local emergency services and their contact information.
  teach_forward_kit:
    three_minute_version: Prepare for natural hazards by knowing your local risks,
      creating an emergency plan, and assembling a disaster supplies kit. Regular
      practice and updates are key to ensuring safety.
    ten_minute_outline:
    - Introduction to natural hazards and their impact.
    - Steps to get informed about local risks.
    - Developing a comprehensive emergency plan.
    - Assembling and maintaining a disaster supplies kit.
    - Importance of practicing and updating your plan.
    - Following official guidance during a hazard.
    discussion_prompts:
    - What natural hazards are most common in your area?
    - How can you ensure your emergency plan is effective?
    - What challenges might you face in assembling a disaster supplies kit?
    - Why is it important to practice your emergency plan regularly?
    - How can community involvement enhance preparedness efforts?
