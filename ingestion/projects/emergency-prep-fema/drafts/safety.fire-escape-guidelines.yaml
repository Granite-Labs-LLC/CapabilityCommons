markdown_body: '### What this is

  This document provides safety guidelines for escaping fires and instructions for
  recovering from disasters.


  ### Why it matters

  Understanding how to safely escape a fire and recover from a disaster can save lives
  and minimize harm.


  ### What you need

  Familiarity with your building''s fire escape plan and basic disaster recovery steps.


  ### How to do it

  In case of a fire, follow your building''s escape plan, stay low to avoid smoke,
  and use the stairs instead of elevators. After a disaster, assess the situation,
  ensure safety, and follow recovery instructions.


  ### Common failure modes

  Not knowing the escape plan, using elevators during a fire, and not having a disaster
  recovery plan.


  ### Safety/boundary notes

  Always prioritize personal safety and follow official guidelines during emergencies.


  ### Local adaptation notes

  Adapt the guidelines to fit local building codes and disaster recovery resources.'
