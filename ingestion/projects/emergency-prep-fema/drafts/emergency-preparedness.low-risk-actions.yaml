markdown_body: '### What this is

  This reference sheet provides guidelines for taking low-risk actions to prepare
  for emergencies. It includes steps for developing a family emergency plan, creating
  an emergency supply kit, and participating in community volunteer opportunities.


  ### Why it matters

  Being prepared for emergencies can significantly reduce risks and improve safety
  for you and your family. By having a plan and the necessary supplies, you can respond
  more effectively during a crisis.


  ### What you need

  To get started, you''ll need to create a family emergency plan, assemble an emergency
  supply kit, and explore volunteer opportunities in your community.


  ### How to do it

  1. Develop a family emergency plan and practice it with your family. Share it with
  friends and visit www.Ready.gov for guidance.

  2. Assemble an emergency supply kit with essentials like water, food, and first
  aid supplies.

  3. Stay informed by visiting www.Ready.gov or calling 1-800-BE-READY.

  4. Learn how to shelter safely and turn off utilities in your home.

  5. Engage in community volunteer opportunities such as Citizen Corps or Neighborhood
  Watch, and consider taking first aid or CPR courses.


  ### Common failure modes

  Failing to regularly update and practice your emergency plan can lead to confusion
  during an actual emergency. Not maintaining your emergency supply kit can result
  in missing or expired items when needed.


  ### Safety/boundary notes

  Ensure that all family members are aware of the emergency plan and know how to safely
  turn off utilities. Regularly check and update your emergency supply kit.


  ### Local adaptation notes

  Consider local community volunteer opportunities that may be specific to your area,
  such as local CERT programs or neighborhood initiatives.'
