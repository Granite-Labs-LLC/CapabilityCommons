summary_short: Magnitude measures the energy released during an earthquake.
summary_medium: Magnitude is the amount of energy released during an earthquake, calculated
  from seismic wave amplitudes. Each whole number increase on the scale represents
  about 30 times more energy.
plain_language: Magnitude tells us how much energy an earthquake releases. It's calculated
  from the size of the seismic waves. A jump from one whole number to the next on
  the scale means the earthquake is about 30 times more powerful.
markdown_body: '### What this is

  Magnitude is a measure of the energy released during an earthquake. It is calculated
  based on the amplitude of seismic waves recorded by seismographs.


  ### Why it matters

  Understanding magnitude helps us assess the potential impact of an earthquake. Higher
  magnitude earthquakes release more energy and can cause more damage.


  ### What you need

  To understand magnitude, one needs to be familiar with seismic waves and how they
  are measured.


  ### How to do it

  Magnitude is determined by analyzing the amplitude of seismic waves. Each whole
  number increase on the magnitude scale indicates approximately 30 times more energy
  release.


  ### Common failure modes

  Misinterpreting the scale as linear rather than logarithmic can lead to underestimating
  the energy difference between magnitudes.


  ### Safety/boundary notes

  Magnitude alone does not determine the damage potential; factors like depth and
  location also play significant roles.


  ### Local adaptation notes

  Local geological conditions can affect how seismic waves are felt and should be
  considered when assessing earthquake impact.'
