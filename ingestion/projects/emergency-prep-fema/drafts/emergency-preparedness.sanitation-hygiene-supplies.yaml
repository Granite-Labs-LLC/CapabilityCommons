markdown_body: '### What this is

  This is a checklist of essential sanitation and hygiene supplies to prepare for
  emergencies. These items help maintain cleanliness and prevent the spread of disease
  when regular facilities may not be available.


  ### Why it matters

  In emergencies, access to regular sanitation facilities may be limited. Having the
  right supplies ensures you can maintain personal hygiene, which is crucial for health
  and well-being.


  ### What you need

  You will need items such as washcloths, towels, soap, hand sanitizer, toothpaste,
  toothbrushes, shampoo, deodorants, razors, lip balm, insect repellent, contact lens
  solutions, a mirror, feminine supplies, heavy-duty plastic garbage bags, a medium-sized
  plastic bucket with a tight lid, disinfectant, household chlorine bleach, a small
  shovel for digging a latrine, and toilet paper.


  ### How to do it

  Gather the listed items and store them in a designated emergency kit. Ensure that
  all items are in good condition and replace them as needed. Keep the kit in an accessible
  location.


  ### Common failure modes

  Failing to regularly check and update supplies can lead to expired or unusable items.
  Not having a complete kit can result in inadequate sanitation during an emergency.


  ### Safety/boundary notes

  Ensure that all chemicals, like bleach, are stored safely to prevent accidental
  ingestion or contact. Follow instructions for use to avoid harm.


  ### Local adaptation notes

  Consider local climate and common emergencies when selecting supplies. For example,
  in hot climates, additional sunscreen may be necessary.'
