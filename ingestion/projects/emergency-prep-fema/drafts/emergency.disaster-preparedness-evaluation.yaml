summary_short: Evaluate your personal and family preparedness for disasters.
summary_medium: This assessment helps you evaluate how prepared you and your family
  are for various threat levels and disasters, ensuring you have a disaster plan,
  supplies kit, and knowledge of community warning systems.
plain_language: Use this evaluation to check if you and your family are ready for
  emergencies. It covers having a plan, a kit, knowing warning systems, and understanding
  evacuations.
markdown_body: '### What this is

  This is an assessment tool designed to help individuals and families evaluate their
  preparedness for various disaster scenarios. It focuses on key areas such as having
  a disaster plan, a supplies kit, and understanding community warning systems.


  ### Why it matters

  Being prepared for disasters can significantly reduce the risks and impacts on you
  and your family. This evaluation ensures you have the necessary plans and resources
  in place to respond effectively to emergencies.


  ### What you need

  To complete this assessment, you need to have a family disaster plan, a disaster
  supplies kit, knowledge of community warning systems, and an understanding of evacuation
  procedures.


  ### How to do it

  Review your current preparedness against the guidelines provided. Ensure you have
  a comprehensive disaster plan, a well-stocked supplies kit, and are familiar with
  local warning systems and evacuation routes. Check the current threat level through
  reliable sources and adjust your preparedness accordingly.


  ### Common failure modes

  Common issues include not having a complete disaster plan, insufficient supplies
  in the kit, or lack of awareness of community warning systems and evacuation procedures.


  ### Safety/boundary notes

  Ensure all family members are aware of the disaster plan and know how to use the
  supplies kit. Regularly update your knowledge of community warning systems.


  ### Local adaptation notes

  Adapt your disaster plan and supplies kit based on local hazards and community resources
  available.'
