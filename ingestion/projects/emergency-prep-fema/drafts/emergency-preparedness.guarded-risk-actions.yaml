markdown_body: '### What this is

  This reference sheet outlines the actions to take when the risk level is guarded.
  It includes reviewing your disaster supplies and being vigilant about your surroundings.


  ### Why it matters

  Being prepared at a guarded risk level ensures that you are ready for potential
  emergencies and can respond quickly if the situation escalates.


  ### What you need

  You need to have access to your stored disaster supplies and be aware of your surroundings.


  ### How to do it

  1. Review your stored disaster supplies and replace any items that are outdated.

  2. Stay alert to any suspicious activity in your area and report it to the proper
  authorities.


  ### Common failure modes

  Failing to replace outdated supplies or ignoring suspicious activities can leave
  you unprepared in an emergency.


  ### Safety/boundary notes

  Ensure that you report suspicious activities to authorities rather than confronting
  them yourself.


  ### Local adaptation notes

  Consider local threats and adjust your vigilance and supplies accordingly.'
