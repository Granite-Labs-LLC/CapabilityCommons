bundle_overrides:
  hook: Knowing how to quickly and safely exit your home during an emergency can save
    lives—make sure everyone in your household is prepared.
  primer: Creating and posting home escape route plans is a crucial step in emergency
    preparedness. In the event of a fire or other emergency, having a clear and practiced
    escape plan can make all the difference. This involves drawing detailed floor
    plans of your home, marking two escape routes from each room, and ensuring that
    these plans are visible and understandable to all household members, especially
    children. It's important to establish a meeting point near your home and another
    outside the immediate area to ensure everyone can regroup safely. This project
    requires minimal materials—just some blank sheets of paper and writing tools—and
    can be completed in a couple of hours. By involving all family members in the
    process, you ensure that everyone knows what to do and where to go in an emergency.
  guide: '1. Gather your materials: blank sheets of paper and writing tools.

    2. Start by drawing a floor plan of your home on a separate sheet of paper for
    each floor. Include all rooms, hallways, and exits.

    3. For each room, identify and mark two escape routes. These could be doors or
    windows, depending on the room''s layout.

    4. Involve your children in the process. Explain the escape routes to them and
    ensure they understand the plan.

    5. Post a copy of the escape route plans at eye level in each child''s room and
    in common areas where everyone can see them.

    6. Establish a meeting point near your home, such as a neighbor''s house or a
    specific tree in the yard. Also, choose a secondary meeting point outside the
    immediate area, like a nearby park or community center.

    7. Practice the escape plan with your family regularly to ensure everyone is familiar
    with the routes and meeting points.

    8. Review and update the plans as needed, especially if there are changes to your
    home''s layout or if you move to a new home.'
  reference:
  - Draw a floor plan for each floor of your home.
  - Mark two escape routes from each room.
  - Post plans at eye level for children.
  - Establish a nearby and a distant meeting point.
  - Involve children in understanding the plans.
  - Practice the escape plan regularly.
  worksheet:
  - Draw a floor plan of one floor of your home.
  - Identify and mark two escape routes from each room.
  - Explain the escape routes to a family member and ensure they understand.
  - 'Choose and note down two meeting points: one near your home and one further away.'
  - Practice a mock escape with your family using the routes and meeting points.
  teach_forward_kit:
    three_minute_version: Create and post escape route plans for your home to ensure
      everyone knows how to exit safely during an emergency. Draw floor plans, mark
      escape routes, and establish meeting points.
