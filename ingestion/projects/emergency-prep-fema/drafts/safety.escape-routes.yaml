plain_language: Learn how to draw and display escape routes for your home to ensure
  everyone knows how to exit safely during an emergency.
markdown_body: '# What this is

  This project involves creating detailed escape route plans for each floor of your
  home and posting them where they are easily visible, especially to children.


  # Why it matters

  Having clear escape routes can save lives during emergencies like fires by ensuring
  everyone knows how to exit the home quickly and safely.


  # What you need

  You will need blank sheets of paper and writing tools to draw the floor plans and
  mark escape routes.


  # How to do it

  1. Draw a floor plan of your home on a blank sheet of paper for each floor. 2. Mark
  two escape routes from each room. 3. Ensure children understand the drawings. 4.
  Post a copy of the drawings at eye level in each child''s room. 5. Establish a meeting
  point near the home and another outside the immediate area.


  # Common failure modes

  Escape routes that are unclear or plans that are not visible to children can lead
  to confusion during an emergency.


  # Safety/boundary notes

  Ensure that escape routes are practical and accessible for all family members, including
  children and those with mobility issues.


  # Local adaptation notes

  Consider different home layouts and local meeting point options when creating your
  escape plans.'
