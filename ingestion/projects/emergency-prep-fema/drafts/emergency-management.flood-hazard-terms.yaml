summary_short: Glossary of terms for identifying flood hazards.
summary_medium: A glossary of terms designed to help individuals identify and understand
  flood hazards.
plain_language: This glossary explains terms related to flood hazards, helping you
  understand warnings and prepare for potential flooding.
markdown_body: '### What this is

  This is a glossary of terms related to flood hazards. Understanding these terms
  can help you recognize and respond to flood warnings effectively.


  ### Why it matters

  Knowing these terms is crucial for interpreting flood warnings and taking appropriate
  actions to ensure safety during flood events.


  ### What you need

  Familiarity with these terms is essential for anyone living in areas prone to flooding
  or involved in emergency management.


  ### How to do it

  Review and memorize the terms related to flood hazards. Pay attention to official
  warnings and advisories that use these terms.


  ### Common failure modes

  Misunderstanding or ignoring flood-related terms can lead to inadequate preparation
  and increased risk during flood events.


  ### Safety/boundary notes

  Ensure you understand the severity and implications of each term to make informed
  decisions during a flood.


  ### Local adaptation notes

  Terms may vary slightly based on local emergency management protocols. Check with
  local authorities for any region-specific terminology.'
