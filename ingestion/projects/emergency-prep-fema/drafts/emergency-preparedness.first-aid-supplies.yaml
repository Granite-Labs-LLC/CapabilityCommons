markdown_body: '### What this is

  This is a checklist of essential first aid supplies that should be available in
  your home, vehicle, and workplace. It ensures you are prepared for minor injuries
  and emergencies.


  ### Why it matters

  Having a well-stocked first aid kit can help you respond effectively to common injuries
  and emergencies, potentially reducing the severity of an injury and providing immediate
  care until professional help is available.


  ### What you need

  You need to gather various first aid supplies such as adhesive bandages, sterile
  dressings, gauze pads, hand sanitizer, medical gloves, scissors, tweezers, a thermometer,
  and a first aid manual.


  ### How to do it

  Review the checklist and ensure that each item is present in your first aid kits
  at home, in your vehicle, and at work. Regularly check and replenish supplies as
  needed, especially after use.


  ### Common failure modes

  Failing to regularly check and replenish supplies can lead to missing critical items
  during an emergency. Ensure all items are within their expiration dates.


  ### Safety/boundary notes

  Ensure that all users of the first aid kit are familiar with its contents and know
  how to use them safely. Keep the kit out of reach of children.


  ### Local adaptation notes

  Consider local hazards and specific needs when customizing your first aid kit. For
  example, include sunscreen if you are in a sunny area or additional cold packs in
  colder climates.'
