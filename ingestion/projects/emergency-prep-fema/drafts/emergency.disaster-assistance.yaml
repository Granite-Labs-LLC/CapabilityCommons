summary_short: Guidance on seeking disaster assistance from organizations and federal
  programs.
summary_medium: Learn how to seek disaster assistance from organizations like the
  American Red Cross and federal programs available after a major disaster declaration.
plain_language: This guide helps you understand how to get help after a disaster,
  including from local organizations and federal programs.
markdown_body: '# What this is

  This reference sheet provides information on how to seek assistance after a disaster,
  including direct help from organizations and federal aid available after a major
  disaster declaration.


  # Why it matters

  After a disaster, knowing where and how to get assistance is crucial for recovery.
  This guide helps you navigate the available resources.


  # What you need

  Access to local media for updates and information on assistance programs.


  # How to do it

  Monitor local media for information on emergency housing, food, first aid, clothing,
  and financial assistance. Direct assistance may be available from organizations
  like the American Red Cross and Salvation Army. Federal assistance is available
  after a major disaster declaration, which includes temporary housing, counseling,
  and financial aid.


  # Common failure modes

  Lack of information on available assistance can hinder recovery efforts.


  # Safety/boundary notes

  Ensure that the sources of information are credible and verified.


  # Local adaptation notes

  The availability of local volunteer organizations may vary, so check local resources
  for specific assistance.'
structured_data:
  definition: Disaster assistance refers to the help provided to individuals and families
    affected by a disaster, including direct aid from organizations and federal programs.
  key_questions:
  - What types of assistance are available after a disaster?
  - How can I apply for federal disaster assistance?
  misconceptions:
  - Assistance is only available from the government.
  - All assistance is immediate and comprehensive.
