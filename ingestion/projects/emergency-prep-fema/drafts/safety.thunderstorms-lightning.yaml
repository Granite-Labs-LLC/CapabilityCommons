summary_short: Overview of the dangers associated with thunderstorms and lightning.
summary_medium: This section provides an overview of the dangers associated with thunderstorms
  and lightning, including statistics on injuries and fatalities, and facts about
  their occurrence and characteristics.
plain_language: Thunderstorms and lightning are dangerous weather phenomena that can
  cause injuries, fatalities, and property damage. Understanding their characteristics
  and associated risks can help in taking appropriate safety measures.
markdown_body: '### What this is

  Thunderstorms are weather events characterized by the presence of lightning and
  thunder. They can occur singly, in clusters, or in lines, and are often accompanied
  by heavy rain, strong winds, hail, and sometimes tornadoes.


  ### Why it matters

  Thunderstorms and lightning pose significant risks to personal safety and property.
  In the U.S., lightning injures about 300 people and kills 80 annually. Flash flooding,
  a common thunderstorm hazard, causes over 140 fatalities each year.


  ### What you need

  Awareness of weather conditions, access to a safe indoor location, and knowledge
  of safety precautions to take during thunderstorms.


  ### How to do it

  Stay indoors during thunderstorms, avoid using electrical appliances, and do not
  take shelter under trees. Be aware of the weather forecast and seek shelter if thunderstorms
  are predicted.


  ### Common failure modes

  Ignoring weather warnings, staying outdoors during a storm, and using electrical
  devices during a thunderstorm.


  ### Safety/boundary notes

  Avoid outdoor activities during thunderstorms. If caught outside, seek shelter in
  a building or vehicle immediately.


  ### Local adaptation notes

  In the western U.S., dry thunderstorms are common and can start wildfires. Be aware
  of local weather patterns and adapt safety measures accordingly.'
