markdown_body: '### What this is

  This reference sheet provides guidelines for reducing water usage in the bathroom
  by using efficient fixtures and adopting water-saving habits.


  ### Why it matters

  Conserving water in the bathroom helps reduce water bills and supports environmental
  sustainability by minimizing water waste.


  ### What you need

  To implement these practices, you may need a low-volume toilet, a toilet displacement
  device, an ultra-low-flow showerhead, and a bucket.


  ### How to do it

  1. Consider purchasing a low-volume toilet that uses less water. Check local regulations
  as these may be required by law.

  2. Install a toilet displacement device, such as a one-gallon plastic jug of water,
  in the toilet tank to reduce water usage per flush. Avoid using bricks as they can
  dissolve and damage the toilet.

  3. Replace your showerhead with an ultra-low-flow version to reduce water flow.

  4. Use a bucket in the shower to catch excess water for watering plants.

  5. Dispose of tissues and similar waste in the trash instead of flushing.

  6. Take short showers and turn off the water when not needed, such as while lathering
  or brushing teeth.


  ### Common failure modes

  Using a brick in the toilet tank can cause damage as it may dissolve and release
  particles.


  ### Safety/boundary notes


  ### Local adaptation notes

  Check local legal requirements for low-volume toilets as they may vary.'
