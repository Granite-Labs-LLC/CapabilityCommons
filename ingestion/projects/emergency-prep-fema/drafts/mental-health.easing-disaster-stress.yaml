bundle_overrides:
  hook: Managing stress after a disaster is crucial for emotional recovery and maintaining
    mental health.
  primer: Disasters, whether natural or man-made, can leave a lasting emotional impact
    on individuals and communities. The stress that follows such events can sometimes
    be more overwhelming than the physical or financial damage incurred. This stress
    can manifest in various ways, including anxiety, depression, and a sense of hopelessness.
    It's important to recognize these feelings and take proactive steps to manage
    them. By talking about your emotions, seeking professional counseling, and maintaining
    a healthy lifestyle, you can begin to heal and regain a sense of normalcy. Engaging
    in community support activities and keeping up with daily routines can also provide
    comfort and stability. Remember, managing stress is not just about coping in the
    moment but also about fostering long-term mental health and resilience.
  guide: '1. **Talk About Your Feelings**: Open up to someone you trust about your
    emotions. This could be a family member, friend, or a support group. Sharing your
    feelings can help you process them and feel less isolated.


    2. **Seek Professional Counseling**: If you find it difficult to manage stress
    on your own, consider reaching out to a professional counselor. They can provide
    guidance and strategies tailored to your needs.


    3. **Maintain a Healthy Lifestyle**: Ensure you are eating nutritious meals, getting
    enough rest, and engaging in regular physical activity. These habits can significantly
    impact your emotional well-being.


    4. **Keep Up with Daily Routines**: Try to maintain your usual daily activities
    as much as possible. This can provide a sense of normalcy and control amidst the
    chaos.


    5. **Engage in Community Support**: Participate in community activities or memorials.
    These can offer a sense of belonging and shared experience, which can be comforting.


    6. **Limit Demanding Responsibilities**: Be mindful not to overburden yourself
    or your family with too many responsibilities. Allow yourself the time and space
    to heal.'
  reference:
  - Talk about your feelings with someone you trust.
  - Seek professional counseling if needed.
  - Maintain a healthy lifestyle with proper nutrition, rest, and exercise.
  - Keep up with daily routines to provide a sense of normalcy.
  - Engage in community support and memorial activities.
  worksheet:
  - List three people you can talk to about your feelings.
  - Identify one professional counseling service in your area.
  - Create a daily routine that includes time for rest, exercise, and meals.
  - Find a community support group or activity you can join.
  - Reflect on a past experience where maintaining a routine helped you cope with
    stress.
  teach_forward_kit:
    three_minute_version: Disasters can deeply affect our emotions. To manage stress,
      talk about your feelings, seek professional help if needed, maintain a healthy
      lifestyle, keep up with daily routines, and engage in community support.
