bundle_overrides:
  hook: Understanding natural hazards can save lives and protect property by helping
    you prepare effectively.
  primer: Natural hazards are events that occur due to natural processes and can pose
    significant threats to life, property, and the environment. Common examples include
    floods, fires, earthquakes, tornadoes, and windstorms. These hazards often occur
    in predictable patterns, usually in specific geographical areas due to weather
    conditions or physical characteristics of the region. By understanding these hazards,
    individuals and communities can take proactive steps to mitigate their impact.
    This involves learning about the characteristics and terms associated with each
    hazard, recognizing the risks they pose, and incorporating this knowledge into
    a family disaster plan. Preparing for natural hazards is crucial as it can significantly
    reduce the potential for harm and increase resilience against these events.
  guide: "1. Identify the natural hazards common in your area by researching local\
    \ history and consulting with local authorities or resources. \n2. Learn about\
    \ the characteristics of each hazard. For example, understand how floods develop,\
    \ the signs of an approaching tornado, or the aftershocks of an earthquake. \n\
    3. Familiarize yourself with the terminology associated with these hazards, such\
    \ as 'evacuation order' for fires or 'seismic activity' for earthquakes. \n4.\
    \ Develop a family disaster plan that includes specific actions to take for each\
    \ type of hazard. This plan should cover evacuation routes, emergency contacts,\
    \ and a communication strategy. \n5. Gather necessary supplies such as food, water,\
    \ first aid kits, and other essentials that might be needed during a natural hazard\
    \ event. \n6. Regularly review and update your disaster plan to incorporate new\
    \ information or changes in your environment or family situation. \n7. Educate\
    \ all family members about the plan and conduct regular drills to ensure everyone\
    \ knows what to do in case of an emergency."
  reference:
  - 'Natural hazards: floods, fires, earthquakes, tornadoes, windstorms'
  - 'Characteristics: predictable patterns, geographical occurrence'
  - 'Protective measures: family disaster plan, emergency supplies'
  - 'Key terms: evacuation order, seismic activity'
  - 'Resources: local authorities, historical data'
  worksheet:
  - List the natural hazards that are most likely to occur in your area.
  - Describe the characteristics of two natural hazards you might face.
  - Create a basic family disaster plan for one type of natural hazard.
  - Identify three protective measures you can take to prepare for a natural hazard.
  - Conduct a mock drill with your family based on your disaster plan.
  teach_forward_kit:
    three_minute_version: Natural hazards are events like floods and earthquakes that
      can threaten lives and property. By understanding these hazards and preparing
      through a family disaster plan, you can reduce risks and protect your loved
      ones.
    ten_minute_outline:
    - Introduction to natural hazards
    - Examples of common natural hazards
    - Characteristics and patterns of occurrence
    - Importance of understanding and preparing for hazards
    - Steps to create a family disaster plan
    - Review and update strategies for disaster preparedness
    discussion_prompts:
    - What natural hazards are you most concerned about in your area?
    - How can understanding natural hazards change your approach to emergency preparedness?
    - What challenges might you face when creating a family disaster plan?
    - How can communities work together to improve preparedness for natural hazards?
