summary_short: Learn about natural hazards and how to incorporate this knowledge into
  your disaster plan.
summary_medium: This module provides an overview of natural hazards, their characteristics,
  associated terms, and protective measures. It aims to help individuals incorporate
  this information into their family disaster plans.
plain_language: Understand different types of natural hazards and learn how to prepare
  for them by including this information in your family disaster plan.
markdown_body: '# What this is

  This module offers an overview of various natural hazards, including their characteristics,
  associated terms, and protective measures. It is designed to help individuals understand
  the risks posed by natural hazards and how to incorporate this knowledge into their
  family disaster plans.


  # Why it matters

  Natural hazards such as floods, fires, earthquakes, tornadoes, and windstorms affect
  thousands of people every year. Understanding these hazards and preparing for them
  can help protect lives, property, and communities.


  # What you need

  To effectively use this module, you need to be willing to learn about different
  natural hazards and be prepared to update your family disaster plan with this information.


  # How to do it

  1. Learn about the natural hazards that pose a risk to your area. 2. Understand
  the characteristics and terms associated with each hazard. 3. Take protective measures
  to avoid or lessen the impact of these events. 4. Include this information in your
  family disaster plan.


  # Common failure modes

  Failing to update your disaster plan with new information about natural hazards
  or neglecting to take recommended protective measures can increase risk during an
  event.


  # Safety/boundary notes

  Ensure that all family members are aware of the disaster plan and understand the
  protective measures to take during a natural hazard event.


  # Local adaptation notes

  Adapt the information and protective measures to suit the specific natural hazards
  prevalent in your geographical location.'
structured_data:
  definition: Natural hazards are natural events that threaten lives, property, and
    other assets. They often occur in the same geographical locations due to weather
    patterns or physical characteristics of an area.
  key_questions:
  - What natural hazards are common in my area?
  - What are the characteristics and terms associated with these hazards?
  - What protective measures can be taken to mitigate the impact of these hazards?
  misconceptions:
  - Natural hazards cannot be predicted.
  - There is nothing that can be done to prepare for natural hazards.
