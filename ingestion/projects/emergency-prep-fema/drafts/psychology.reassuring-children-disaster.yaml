plain_language: Learn how to comfort and support children after a disaster by maintaining
  routines and involving them in recovery activities.
markdown_body: '### What this is

  This guide provides strategies to help reassure children after experiencing a disaster.
  It focuses on maintaining a sense of normalcy and involving children in recovery
  efforts.


  ### Why it matters

  Children can be particularly vulnerable to stress and anxiety after a disaster.
  Providing reassurance and involving them in recovery can help mitigate these effects
  and promote emotional healing.


  ### What you need

  A calm demeanor, willingness to communicate, and the ability to involve children
  in daily routines and recovery tasks.


  ### How to do it

  1. Offer personal contact through hugs and touch to reassure children.

  2. Calmly share factual information about the disaster and recovery plans.

  3. Encourage children to express their feelings.

  4. Spend extra time with them, especially during bedtime.

  5. Re-establish daily routines for work, school, play, meals, and rest.

  6. Involve children in recovery by assigning them specific chores.

  7. Praise responsible behavior.

  8. Understand that children may react differently and adjust your approach accordingly.


  ### Common failure modes

  Disruption of routine, lack of involvement, or failing to address children''s emotional
  needs.


  ### Safety/boundary notes

  Monitor children''s reactions and seek professional help if stress persists or worsens.


  ### Local adaptation notes

  Adapt routines and involvement tasks to fit local cultural practices and available
  resources.'
