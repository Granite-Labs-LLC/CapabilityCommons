bundle_overrides:
  hook: Helping children feel safe and secure after a disaster is crucial for their
    emotional recovery and well-being.
  primer: Disasters can be traumatic for everyone, but children are particularly vulnerable
    to the stress and anxiety that follow such events. Their sense of security can
    be deeply shaken, and they may not have the tools to process their emotions effectively.
    As caregivers, it's important to provide reassurance and stability to help them
    cope. This involves maintaining a sense of normalcy through daily routines, encouraging
    open communication about their feelings, and involving them in recovery efforts.
    By doing so, we can help children regain a sense of control and safety, which
    is essential for their emotional healing. It's also important to monitor their
    reactions and be prepared to seek professional help if their stress persists or
    worsens.
  guide: '1. **Offer Personal Contact**: Physical touch, such as hugs, can be very
    comforting to children. It reassures them that they are safe and loved.


    2. **Share Factual Information**: Calmly explain what happened during the disaster
    and what steps are being taken to ensure safety and recovery. This helps children
    understand the situation and reduces fear of the unknown.


    3. **Encourage Expression**: Invite children to talk about their feelings. Listen
    to them without judgment and validate their emotions.


    4. **Spend Extra Time Together**: Especially during bedtime, spend additional
    time with your children to provide comfort and security.


    5. **Re-establish Routines**: Try to maintain regular schedules for work, school,
    play, meals, and rest. Routines provide a sense of normalcy and stability.


    6. **Involve Them in Recovery**: Assign age-appropriate chores to help them feel
    they are contributing to the recovery process. This can empower them and foster
    a sense of responsibility.


    7. **Praise Responsible Behavior**: Recognize and praise children when they act
    responsibly. Positive reinforcement encourages them to continue such behavior.


    8. **Adjust Your Approach**: Understand that each child may react differently.
    Be flexible and adjust your approach based on their individual needs.


    9. **Monitor and Seek Help**: Keep an eye on their reactions. If stress persists
    or worsens, consider consulting a professional for additional support.'
