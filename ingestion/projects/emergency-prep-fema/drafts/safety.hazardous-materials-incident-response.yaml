plain_language: Learn what to do after a hazardous materials incident to ensure your
  safety and proper decontamination.
markdown_body: "### What this is\nThis reference sheet provides guidelines for actions\
  \ to take following a hazardous materials incident, focusing on safety measures\
  \ and decontamination procedures.\n\n### Why it matters\nHazardous materials incidents\
  \ can pose serious health risks. Proper response is crucial to minimize exposure\
  \ and ensure safety.\n\n### What you need\nFans for ventilation, sealed containers\
  \ for contaminated items, and access to local authority instructions.\n\n### How\
  \ to do it\n1. Return home only when authorities say it is safe. \n2. Ventilate\
  \ your home by opening windows and using fans. \n3. Follow decontamination instructions\
  \ from local authorities, which may include showering or other procedures. \n4.\
  \ Seek medical treatment for any unusual symptoms. \n5. Place contaminated clothing\
  \ and shoes in sealed containers and contact local authorities for disposal instructions.\
  \ \n6. Inform anyone who may have come into contact with you about your exposure.\
  \ \n7. Report lingering hazards to emergency services.\n\n### Common failure modes\n\
  Improper decontamination and exposure to lingering hazards.\n\n### Safety/boundary\
  \ notes\nAvoid contact with contaminated materials and strictly follow local authority\
  \ instructions.\n\n### Local adaptation notes\nFollow specific instructions from\
  \ local authorities and consider community-specific hazards."
