bundle_overrides:
  hook: Protect your family by learning how to safely manage hazardous materials in
    your home.
  primer: Hazardous materials are common in many households, from cleaning products
    to paints and pesticides. While these items are useful, they can pose significant
    risks if not handled properly. Exposure to toxic substances can lead to health
    issues such as difficulty breathing and skin irritation. This guide is designed
    to help parents and teachers understand how to identify and manage these materials
    safely. By following the guidelines provided, you can reduce the risk of accidents
    and ensure a safer home environment. The guide is part of a web-based program
    offered by FEMA, which provides comprehensive information on household hazardous
    materials and safety practices.
  guide: "1. **Identify Hazardous Materials**: Start by taking inventory of all potentially\
    \ hazardous materials in your home. This includes cleaning supplies, paints, pesticides,\
    \ and any other chemicals. \n\n2. **Read Labels Carefully**: Check the labels\
    \ on each product for safety instructions and warnings. Look for symbols indicating\
    \ toxicity or flammability. \n\n3. **Proper Storage**: Store hazardous materials\
    \ in a secure location, out of reach of children and pets. Use locked cabinets\
    \ if necessary. Ensure that containers are sealed tightly to prevent leaks or\
    \ spills. \n\n4. **Use Materials Safely**: Follow the instructions on the label\
    \ when using any hazardous material. Wear protective gear such as gloves or masks\
    \ if recommended. Ensure good ventilation in the area where you are using the\
    \ product. \n\n5. **Dispose of Materials Properly**: Do not pour hazardous materials\
    \ down the drain or throw them in the trash. Check local regulations for proper\
    \ disposal methods, such as community hazardous waste collection events. \n\n\
    6. **Participate in FEMA's Program**: Engage with the web-based safety program\
    \ provided by FEMA to deepen your understanding of hazardous materials and safety\
    \ practices. \n\n7. **Regularly Review Safety Practices**: Periodically review\
    \ your safety practices and update your knowledge to ensure ongoing safety in\
    \ your home."
  reference:
  - Identify and inventory hazardous materials in your home.
  - Read and follow label instructions carefully.
  - Store materials securely and out of reach of children.
  - Use protective gear as needed.
  - Dispose of materials according to local regulations.
  - Participate in FEMA's web-based safety program.
  worksheet:
  - List five hazardous materials found in your home and describe their potential
    risks.
  - Create a storage plan for hazardous materials to ensure they are out of reach
    of children.
  - Research local disposal methods for hazardous waste and outline the steps for
    proper disposal.
  - Identify three safety practices you can implement immediately to reduce risk in
    your home.
  teach_forward_kit:
    three_minute_version: Hazardous materials in the home can pose serious risks if
      not managed properly. By identifying these materials, storing them safely, and
      following usage instructions, you can protect your family from potential harm.
      Engage with FEMA's web-based program to enhance your understanding and ensure
      a safer home environment.
    ten_minute_outline:
    - Introduction to hazardous materials in the home.
    - Importance of reading labels and understanding risks.
    - Steps for safe storage and handling of materials.
    - Proper disposal methods for hazardous waste.
    - Overview of FEMA's web-based safety program.
    - Discussion on implementing safety practices at home.
    discussion_prompts:
    - What are some common hazardous materials found in homes, and what risks do they
      pose?
    - How can we ensure that hazardous materials are stored safely, especially in
      homes with children?
    - What challenges might you face in disposing of hazardous materials, and how
      can you overcome them?
    - How can participating in a program like FEMA's enhance your understanding of
      home safety?
