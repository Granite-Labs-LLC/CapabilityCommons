plain_language: Learn how to keep your home safe from hazardous materials with this
  guide designed for parents and teachers.
markdown_body: '### What this is

  This is a safety guide focused on reducing the number of injuries and deaths in
  the home caused by hazardous materials. It is a web-based program designed for parents
  and teachers.


  ### Why it matters

  Hazardous materials in the home can pose significant risks, including exposure to
  toxic substances. Understanding how to manage these materials can prevent accidents
  and save lives.


  ### What you need

  Access to the web-based program and a willingness to learn about hazardous materials
  and home safety.


  ### How to do it

  Participate in the web-based safety program provided by FEMA. Follow the guidelines
  and recommendations to identify and manage hazardous materials in your home.


  ### Common failure modes

  Failure to recognize hazardous materials, improper storage, and lack of awareness
  about the risks associated with these materials.


  ### Safety/boundary notes

  Ensure that all hazardous materials are stored safely and out of reach of children.
  Follow all safety guidelines provided in the program.


  ### Local adaptation notes

  Consider local regulations and resources when implementing safety measures in your
  home.'
