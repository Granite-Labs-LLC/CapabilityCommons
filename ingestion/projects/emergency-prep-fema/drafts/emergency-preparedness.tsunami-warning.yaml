summary_short: A tsunami warning signals a potential or actual tsunami, urging evacuation.
summary_medium: A tsunami warning indicates that a tsunami was or may have been generated,
  which could cause damage, and people in the warned area are strongly advised to
  evacuate.
plain_language: If you hear a tsunami warning, it means a tsunami might be coming.
  You should leave the area immediately to stay safe.
markdown_body: '### What this is

  A tsunami warning is an alert issued to inform people that a tsunami has been or
  might have been generated. This warning is crucial as it indicates the potential
  for significant damage and danger to life.


  ### Why it matters

  Understanding and responding to a tsunami warning is vital for personal safety and
  community well-being. Tsunamis can cause widespread destruction, and timely evacuation
  can save lives.


  ### What you need

  Awareness of local evacuation routes and access to emergency supplies are essential
  when a tsunami warning is issued.


  ### How to do it

  Upon receiving a tsunami warning, immediately evacuate to higher ground or as directed
  by local authorities. Follow established evacuation routes and stay informed through
  official channels.


  ### Common failure modes

  Ignoring the warning, delaying evacuation, or returning to the area too soon can
  lead to injury or death.


  ### Safety/boundary notes

  Always prioritize safety and follow official instructions. Do not attempt to watch
  the tsunami from the shore.


  ### Local adaptation notes

  Local authorities may have specific evacuation plans and routes. Familiarize yourself
  with these in advance.'
