summary_short: A list of reference sources for emergency preparedness.
summary_medium: This reference sheet provides contact information for obtaining publications
  from FEMA and other organizations like the American Red Cross, National Weather
  Service, CDC, and USGS, which offer additional information on emergency preparedness.
plain_language: This document lists where you can find more information on emergency
  preparedness from various organizations.
markdown_body: '### What this is

  This reference sheet lists organizations that provide publications and resources
  on emergency preparedness topics.


  ### Why it matters

  Access to reliable information is crucial for effective emergency preparedness.
  These organizations offer authoritative resources that can help individuals and
  communities prepare for emergencies.


  ### What you need

  Contact information for FEMA, the American Red Cross, the National Weather Service,
  the CDC, and the USGS.


  ### How to do it

  To obtain publications, contact the organizations directly using the provided phone
  numbers or websites. For FEMA publications, you can call the FEMA Distribution Center
  or request them by mail.


  ### Common failure modes

  Failing to obtain the most current publications or not verifying the credibility
  of the sources.


  ### Safety/boundary notes

  Ensure that the information obtained is from official and updated sources to avoid
  misinformation.


  ### Local adaptation notes

  Consider local emergency management offices for additional resources and guidance
  tailored to your specific area.'
