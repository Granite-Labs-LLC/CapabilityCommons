  worksheet:
  - List the types of media your family consumes regularly.
  - Create a schedule to limit media exposure time each day.
  - Plan a family discussion about a recent news event and practice providing explanations.
  - Identify alternative activities to replace media time.
  - Reflect on your own media consumption habits and set personal limits.
  teach_forward_kit:
    three_minute_version: Managing media exposure after a disaster is key to reducing
      anxiety, especially in children. Monitor what your family watches, limit screen
      time, be present to explain content, and set a good example by managing your
      own media habits.
