markdown_body: '### What this is

  This skill guide provides strategies for managing media exposure for families following
  a disaster. It focuses on reducing anxiety and confusion, especially in children,
  by controlling the amount and type of media consumed.


  ### Why it matters

  Exposure to media coverage of disasters can cause fear and anxiety, particularly
  in children who may not understand that repeated images are not new events. Managing
  this exposure helps maintain emotional stability and prevent unnecessary stress.


  ### What you need

  Awareness of the media content being consumed by your family and the ability to
  supervise and limit this exposure.


  ### How to do it

  1. Monitor the media your family is exposed to, especially news related to disasters.

  2. Limit the time spent on consuming such media.

  3. Be present with children when they are exposed to media, providing explanations
  and encouraging communication.

  4. Consider limiting your own exposure to anxiety-provoking media to set an example.


  ### Common failure modes

  Allowing overexposure to media, which can increase anxiety and confusion.


  ### Safety/boundary notes

  Ensure that explanations provided to children are age-appropriate and do not increase
  their anxiety.


  ### Local adaptation notes

  Adapt the level of media exposure based on the specific needs and sensitivities
  of your family.'
