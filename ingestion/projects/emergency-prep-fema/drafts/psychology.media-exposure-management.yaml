bundle_overrides:
  hook: In the aftermath of a disaster, managing media exposure can be crucial for
    maintaining your family's emotional well-being, especially for children who may
    not understand the repeated images they see.
  primer: After a disaster, media coverage can be overwhelming and often distressing,
    especially for children. The constant replay of images and news can create a false
    sense of ongoing danger, leading to increased fear and anxiety. Children, in particular,
    may struggle to differentiate between live events and repeated broadcasts, which
    can exacerbate their stress. It's important for families to manage this exposure
    to help maintain emotional stability. By monitoring and limiting the media content
    that family members, especially children, are exposed to, parents can help mitigate
    unnecessary stress and confusion. This involves being present to provide context
    and explanations, encouraging open communication, and setting an example by managing
    their own media consumption. These strategies can help create a more supportive
    environment for recovery and understanding.
  guide: '1. **Monitor Media Exposure**: Keep track of the types of media your family
    is consuming, especially news related to disasters. Be aware of the content and
    its potential impact on family members.


    2. **Limit Media Time**: Set specific times for consuming media and stick to them.
    This helps prevent overexposure, which can lead to increased anxiety and confusion.


    3. **Be Present**: When children are exposed to media, be there with them. Provide
    explanations and encourage them to ask questions. This helps them process the
    information better and reduces fear.


    4. **Set an Example**: Limit your own exposure to anxiety-provoking media. Children
    often mimic adult behavior, so by managing your own media consumption, you set
    a positive example.


    5. **Encourage Alternative Activities**: Engage in activities that do not involve
    media, such as reading, playing games, or outdoor activities. This helps distract
    from the constant media cycle and provides a break from stress.


    6. **Discuss Media Content**: Have open discussions about what is seen in the
    media. This can help children understand the context and reduce misunderstandings
    or fears.'
  reference:
  - Monitor media exposure, especially disaster-related news.
  - Limit time spent on consuming media.
  - Be present with children during media exposure.
  - Provide explanations and encourage communication.
  - Limit your own exposure to anxiety-provoking media.
