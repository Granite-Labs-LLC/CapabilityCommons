markdown_body: '### What this is

  This reference sheet provides essential guidelines for individuals who find themselves
  trapped in debris, focusing on signaling rescuers and protecting oneself from dust
  inhalation.


  ### Why it matters

  Being trapped in debris can be life-threatening due to the risk of dust inhalation
  and the difficulty rescuers may have in locating you. Following these guidelines
  can increase your chances of being found and reduce health risks.


  ### What you need

  A flashlight, dense-weave cotton material, and a whistle are recommended tools to
  have on hand.


  ### How to do it

  1. Use a flashlight to signal your location to rescuers if possible.

  2. Minimize movement to avoid kicking up dust.

  3. Cover your nose and mouth with dense-weave cotton material to filter dust.

  4. Tap on a pipe or wall to make noise.

  5. Use a whistle to signal rescuers if available.

  6. Shout only as a last resort to avoid inhaling dust.


  ### Common failure modes

  Failing to signal effectively, inhaling dust due to shouting, and not being heard
  by rescuers.


  ### Safety/boundary notes

  Avoid shouting unless absolutely necessary to prevent dust inhalation.


  ### Local adaptation notes

  Adapt the guidelines based on available materials and tools in your environment.'
