bundle_overrides:
  hook: Stay safe and minimize damage by knowing exactly what to do when a flood watch
    is issued in your area.
  primer: A flood watch is an alert issued by weather authorities indicating that
    conditions are favorable for flooding in your area. It is crucial to stay informed
    and prepared during this time to ensure your safety and protect your property.
    Flooding can occur rapidly, and being caught unprepared can lead to dangerous
    situations. To stay informed, you will need access to a NOAA Weather Radio, commercial
    radio, or television. These sources will provide the latest updates and information
    on the potential for flooding. Common mistakes during a flood watch include not
    monitoring updates frequently enough and ignoring warnings. It is essential to
    have a reliable way to receive updates, especially if power outages are possible.
    Local radio stations or community alert systems may also provide additional relevant
    information.
  guide: "1. **Understand the Alert**: A flood watch means that conditions are favorable\
    \ for flooding. It does not mean flooding will definitely occur, but it is a possibility.\
    \ \n\n2. **Tune In for Updates**: Immediately tune in to a NOAA Weather Radio,\
    \ commercial radio, or television for the latest information. These sources will\
    \ provide updates on weather conditions and any changes in the flood watch status.\
    \ \n\n3. **Prepare for Possible Flooding**: Gather emergency supplies such as\
    \ water, food, medications, and important documents. Ensure that your family knows\
    \ the emergency plan and evacuation routes. \n\n4. **Monitor Continuously**: Keep\
    \ monitoring the radio or television for updates. Flood conditions can change\
    \ rapidly, and staying informed is crucial. \n\n5. **Avoid Common Mistakes**:\
    \ Do not ignore warnings or fail to check updates frequently. These mistakes can\
    \ lead to being unprepared if conditions worsen. \n\n6. **Plan for Power Outages**:\
    \ Ensure you have a battery-powered radio or other means to receive updates if\
    \ the power goes out. \n\n7. **Local Information**: Consider using local radio\
    \ stations or community alert systems for additional information specific to your\
    \ area."
  reference:
  - Flood watch indicates possible flooding.
  - Tune in to NOAA Weather Radio, commercial radio, or television for updates.
  - 'Common mistakes: missing updates, ignoring warnings.'
  - Ensure a reliable way to receive updates, especially during power outages.
  - Local stations may provide additional information.
  worksheet:
  - List the local radio stations that provide weather updates in your area.
  - Identify the nearest evacuation routes from your home.
  - Create a checklist of emergency supplies to gather during a flood watch.
  - Practice tuning into NOAA Weather Radio or other sources for updates.
  - Discuss with your family the steps to take if a flood warning is issued.
  teach_forward_kit:
    three_minute_version: A flood watch means that conditions are favorable for flooding.
      Stay informed by tuning into NOAA Weather Radio, commercial radio, or television
      for updates. Prepare by gathering emergency supplies and knowing evacuation
      routes. Avoid common mistakes like ignoring updates and ensure you have a reliable
      way to receive information, especially if power outages occur.
    ten_minute_outline:
    - Introduction to Flood Watch
    - Importance of Staying Informed
    - How to Receive Updates
    - Preparing for Possible Flooding
    - Common Mistakes to Avoid
    - Local Adaptations and Resources
    discussion_prompts:
    - Why is it important to stay informed during a flood watch?
    - What are some reliable sources for weather updates?
    - How can you prepare your home and family for a potential flood?
    - What are the consequences of ignoring flood watch updates?
    - How can local resources be utilized during a flood watch?
