markdown_body: '### What this is

  This guide provides steps to follow when a flood watch is issued, indicating that
  flooding is possible in your area.


  ### Why it matters

  Staying informed during a flood watch can help you prepare for potential flooding,
  ensuring your safety and minimizing damage.


  ### What you need

  You will need access to a NOAA Weather Radio, commercial radio, or television to
  receive updates.


  ### How to do it

  When a flood watch is announced, immediately tune in to NOAA Weather Radio, commercial
  radio, or television. These sources will provide the latest information and updates
  on the potential for flooding in your area.


  ### Common failure modes

  Common mistakes include missing updates due to not monitoring the radio or television,
  and ignoring warnings that are issued.


  ### Safety/boundary notes

  Ensure you have a reliable way to receive updates, especially if power outages are
  possible.


  ### Local adaptation notes

  Consider local radio stations or community alert systems that may provide additional
  relevant information.'
