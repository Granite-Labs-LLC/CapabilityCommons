markdown_body: '# What this is

  This reference sheet is a guide for homeowners on how to recover after experiencing
  a fire. It includes steps to take immediately after the fire, insurance considerations,
  and tips for salvaging valuables.


  # Why it matters

  Recovering from a fire can be overwhelming. This guide helps homeowners navigate
  the critical first steps to ensure safety and begin the recovery process effectively.


  # What you need

  Access to the ''After the Fire: Returning to Normal'' booklet, available online.


  # How to do it

  Follow the steps outlined in the booklet, starting with ensuring safety, contacting
  your insurance provider, and documenting damages. Prioritize replacing important
  documents and consider professional help for salvage operations.


  # Common failure modes

  Delaying the recovery process can lead to further complications, such as mold growth
  or insurance claim issues.


  # Safety/boundary notes

  Ensure the fire department has declared the area safe before entering. Be cautious
  of structural damage.


  # Local adaptation notes

  Consider local resources and support systems available for fire recovery assistance.'
