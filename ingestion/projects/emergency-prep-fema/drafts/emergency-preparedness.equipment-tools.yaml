plain_language: This guide provides a list of essential equipment and tools to have
  on hand for emergencies, such as natural disasters or power outages.
markdown_body: '# What this is

  This is a checklist of essential equipment and tools that are recommended for use
  in emergency situations. It includes items that can help you stay informed, safe,
  and prepared during emergencies.


  # Why it matters

  Having the right equipment and tools during an emergency can make a significant
  difference in ensuring your safety and well-being. These items can help you communicate,
  navigate, and manage basic needs when regular services are disrupted.


  # What you need

  You will need a variety of tools and equipment such as a battery-powered radio,
  NOAA Weather Radio, flashlight, matches, shut-off wrench, duct tape, plastic sheeting,
  whistle, and a fire extinguisher.


  # How to do it

  Gather the listed items and store them in an accessible location. Regularly check
  and replace batteries, and ensure all items are in working order. Customize your
  kit based on local needs and personal circumstances.


  # Common failure modes

  Failing to regularly check and maintain equipment, not having enough batteries,
  or not tailoring the kit to specific local risks can reduce the effectiveness of
  your emergency preparedness.


  # Safety/boundary notes

  Ensure all items are stored safely and are easily accessible. Be aware of any local
  regulations regarding the storage of certain items like fuel or chemicals.


  # Local adaptation notes

  Consider local risks such as hurricanes, earthquakes, or floods when assembling
  your kit. Adjust the contents based on the specific needs of your area.'
