summary_short: Explains the impact of an electromagnetic pulse (EMP) from a nuclear
  explosion.
summary_medium: Describes how an electromagnetic pulse (EMP) from a nuclear detonation
  can damage electronic devices, affecting communication systems, computers, and more.
plain_language: An electromagnetic pulse (EMP) is a burst of electromagnetic energy
  that can occur after a nuclear explosion, potentially damaging electronic devices
  over a wide area.
markdown_body: '### What this is

  An electromagnetic pulse (EMP) is a burst of electromagnetic energy that can occur
  when a nuclear weapon is detonated in or above the earth''s atmosphere. It creates
  a high-density electrical field similar to lightning but much stronger and faster.


  ### Why it matters

  An EMP can cause significant damage to electronic devices, affecting communication
  systems, computers, and other electrical appliances. This can disrupt essential
  services and infrastructure, leading to broader societal impacts.


  ### What you need

  Understanding of electronic devices and their vulnerabilities to electromagnetic
  interference.


  ### How to do it

  To mitigate the effects of an EMP, consider using protective measures such as Faraday
  cages for critical electronics, and ensure backup systems are in place for essential
  services.


  ### Common failure modes

  Electronic devices connected to power sources or antennas are particularly vulnerable.
  Damage can range from minor interruptions to complete burnout of components.


  ### Safety/boundary notes

  While an EMP is unlikely to harm most people directly, it could affect individuals
  with pacemakers or other implanted electronic devices.


  ### Local adaptation notes

  Consider local infrastructure and the prevalence of electronic devices when planning
  for EMP scenarios.'
