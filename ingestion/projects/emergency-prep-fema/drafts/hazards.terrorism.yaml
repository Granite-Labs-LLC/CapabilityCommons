summary_short: A reference sheet on terrorism-related hazards for emergency planning.
summary_medium: This reference sheet lists various terrorism-related hazards, including
  explosions and biological threats, to aid in emergency planning.
plain_language: This sheet helps you understand different types of terrorism-related
  hazards, like explosions and biological threats, which are important to consider
  when planning for emergencies.
markdown_body: '### What this is

  This reference sheet provides a list of hazards associated with terrorism that should
  be considered in emergency planning.


  ### Why it matters

  Understanding the different types of terrorism-related hazards is crucial for effective
  emergency preparedness and response. These hazards can have severe impacts on public
  safety and infrastructure.


  ### What you need

  Familiarity with emergency planning processes and an understanding of local risk
  factors related to terrorism.


  ### How to do it

  Review the listed hazards and incorporate them into your emergency planning efforts.
  Consider the specific risks each hazard poses to your community or organization.


  ### Common failure modes

  Failing to consider all types of hazards can lead to incomplete emergency plans,
  leaving gaps in preparedness and response strategies.


  ### Safety/boundary notes

  Ensure that emergency plans are comprehensive and include measures to protect public
  safety in the event of any listed hazard.


  ### Local adaptation notes

  Adapt the consideration of these hazards based on local threat levels and historical
  data on terrorism-related incidents in your area.'
structured_data:
  definition: Terrorism-related hazards are potential threats that arise from acts
    of terrorism, including explosions, biological threats, chemical threats, nuclear
    blasts, and radiological dispersion device events.
  key_questions:
  - What are the potential impacts of each type of terrorism-related hazard?
  - How can these hazards be mitigated through emergency planning?
  misconceptions:
  - Terrorism-related hazards are only a concern in large cities.
  - Emergency plans do not need to address terrorism-related hazards if there is no
    immediate threat.
  safety_boundary: This is background/awareness information about a hazard, adapted
    from FEMA's public citizen-preparedness guide. It is not a substitute for official
    warnings, alerts, or instructions from local emergency management, law enforcement,
    or emergency responders during an actual event.
