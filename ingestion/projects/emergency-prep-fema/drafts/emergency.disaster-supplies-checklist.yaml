plain_language: This checklist helps you figure out what items to include in your
  disaster supplies kit to ensure your family is prepared for emergencies.
markdown_body: '# What this is

  This is a checklist designed to help you gather the necessary supplies for a disaster
  supplies kit tailored to your family''s specific needs.


  # Why it matters

  Having a well-prepared disaster supplies kit can be crucial during emergencies,
  ensuring that your family has the essentials needed to survive and stay safe.


  # What you need

  You need to assess your family''s specific needs and gather supplies such as food,
  water, medical supplies, and other essentials.


  # How to do it

  Review the checklist and gather items such as non-perishable food, water, first
  aid supplies, medications, flashlights, batteries, and important documents. Customize
  the kit based on your family''s unique requirements.


  # Common failure modes

  Common issues include having an incomplete kit or inadequate supplies that do not
  meet the family''s needs.


  # Safety/boundary notes

  Ensure that all items are safe to use and stored properly to prevent accidents or
  spoilage.


  # Local adaptation notes

  Consider regional supply variations and family-specific needs when compiling your
  kit.'
