plain_language: This guide helps you understand how to safely handle flammable products
  like propane tanks and kerosene, and what to do in case of an emergency.
markdown_body: '### What this is

  This reference sheet provides guidance on the safe handling of various flammable
  products, including propane tanks, kerosene, home heating oil, diesel fuel, gas/oil
  mix, and lighter fluid.


  ### Why it matters

  Flammable products pose a risk of fire or explosion if not handled properly. Understanding
  how to manage these products can significantly reduce the risk of accidents and
  injuries.


  ### What you need

  Familiarity with the types of flammable products you have and basic safety equipment
  such as fire extinguishers.


  ### How to do it

  Store flammable products in a cool, dry place away from heat sources. Ensure containers
  are sealed properly. Follow manufacturer instructions for use and storage. In case
  of a leak or spill, ventilate the area and avoid ignition sources.


  ### Common failure modes

  Improper storage, using damaged containers, and ignoring safety instructions can
  lead to accidents.


  ### Safety/boundary notes

  Always keep flammable products away from children and pets. Do not smoke or use
  open flames near these products.


  ### Local adaptation notes

  Consider local regulations regarding the storage and disposal of flammable products.'
