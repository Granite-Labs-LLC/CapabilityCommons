markdown_body: '### What this is


  Flood insurance is a specific type of insurance policy that covers losses due to
  flooding, which is not covered under standard homeowners'' insurance policies.


  ### Why it matters


  Flooding can cause significant damage to property, and without flood insurance,
  homeowners may face substantial financial losses. The National Flood Insurance Program
  (NFIP) provides a way for homeowners to protect themselves against these risks.


  ### What you need


  To obtain flood insurance, you need to contact an insurance agent who offers policies
  through the NFIP. It''s important to be aware of the 30-day waiting period before
  the insurance becomes effective.


  ### How to do it


  Contact an insurance agent to purchase a flood insurance policy. Ensure your community
  participates in the NFIP by adopting floodplain management ordinances. Remember
  the 30-day waiting period before coverage starts.


  ### Common failure modes


  A common mistake is assuming that standard homeowners'' insurance covers flood damage.
  Another is delaying the purchase of flood insurance, not accounting for the 30-day
  waiting period.


  ### Safety/boundary notes


  Flood insurance is available whether or not your property is in a designated flood-prone
  area, but it''s crucial to understand the specific terms and coverage limits of
  your policy.


  ### Local adaptation notes


  Communities must adopt and enforce floodplain management ordinances to participate
  in the NFIP, which can vary by location.'
plain_language: Flood insurance is not included in standard homeowners' insurance.
  It's managed by FEMA and available through the National Flood Insurance Program.
  There's a 30-day waiting period before it starts.
