summary_short: Understand the characteristics and risks of tornadoes.
summary_medium: This section provides an overview of tornadoes, describing their characteristics,
  behavior, and the risks they pose.
plain_language: Learn about tornadoes, how they form, their potential dangers, and
  when they are most likely to occur.
markdown_body: '# What this is

  Tornadoes are violent storms that can cause significant damage and fatalities. They
  are characterized by a rotating, funnel-shaped cloud that extends from a thunderstorm
  to the ground.


  # Why it matters

  Understanding tornadoes is crucial for safety and preparedness, as they can strike
  with little warning and cause widespread destruction.


  # What you need

  Awareness of tornado characteristics, typical behaviors, and the conditions under
  which they form.


  # How to do it

  Learn to recognize the signs of an approaching tornado, such as a still atmosphere
  or a cloud of debris. Be aware of the typical times and seasons when tornadoes are
  most likely to occur.


  # Common failure modes

  Failing to recognize the signs of a tornado or misunderstanding the risks associated
  with different weather conditions.


  # Safety/boundary notes

  Always prioritize safety by seeking shelter in a sturdy building or designated tornado
  shelter when a tornado warning is issued.


  # Local adaptation notes

  Adapt awareness and preparedness strategies based on local tornado frequency and
  typical weather patterns.'
structured_data:
  definition: Tornadoes are rapidly rotating columns of air extending from a thunderstorm
    to the ground.
  key_questions:
  - What are the signs of an approaching tornado?
  - When are tornadoes most likely to occur?
  - What are the typical characteristics of tornadoes?
  misconceptions:
