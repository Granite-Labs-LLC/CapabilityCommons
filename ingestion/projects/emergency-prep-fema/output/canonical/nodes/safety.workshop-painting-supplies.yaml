markdown_body: '### What this is

  This reference sheet lists various supplies commonly used in workshops and for painting
  projects. It includes items such as adhesives, paint thinners, and photographic
  chemicals.


  ### Why it matters

  Understanding the types of supplies used in workshops and painting is crucial for
  maintaining safety. Many of these materials can be hazardous if not handled properly.


  ### What you need

  Familiarity with the types of supplies listed and their potential hazards is necessary
  for safe handling and storage.


  ### How to do it

  Review the list of supplies and ensure you understand the safety precautions for
  each. Use appropriate protective gear and follow storage guidelines to minimize
  risks.


  ### Common failure modes

  Improper storage or handling of these materials can lead to accidents, such as spills
  or exposure to toxic fumes.


  ### Safety/boundary notes

  Always use these materials in well-ventilated areas and wear protective equipment
  such as gloves and masks. Follow manufacturer instructions for use and disposal.


  ### Local adaptation notes

  Consider local regulations regarding the use and disposal of hazardous materials,
  as these can vary by region.'
