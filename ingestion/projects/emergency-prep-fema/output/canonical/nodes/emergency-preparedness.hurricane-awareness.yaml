summary_short: Understand hurricanes, their classification, and impacts.
summary_medium: Learn about hurricanes, their classification using the Saffir-Simpson
  Hurricane Scale, and the potential impacts including wind damage, storm surges,
  and flooding.
plain_language: Hurricanes are powerful storms that can cause severe damage. They
  are classified by wind speed and potential damage, and can lead to flooding and
  other hazards.
markdown_body: '# What this is

  A hurricane is a type of tropical cyclone, which is a low-pressure system typically
  forming in the tropics. It is characterized by thunderstorms and a counterclockwise
  wind circulation in the Northern Hemisphere.


  # Why it matters

  Hurricanes can cause catastrophic damage to coastlines and areas several hundred
  miles inland. They bring high winds, heavy rain, storm surges, and can lead to flooding
  and landslides, posing significant risks to life and property.


  # What you need

  Awareness of the hurricane season, which runs from June to November, and understanding
  of the Saffir-Simpson Hurricane Scale to assess potential risks.


  # How to do it

  Monitor weather reports during hurricane season, understand the categories of hurricanes,
  and prepare for potential impacts such as securing property and having an evacuation
  plan.


  # Common failure modes

  Underestimating the severity of lower category hurricanes, not preparing for inland
  flooding, and failing to evacuate when advised.


  # Safety/boundary notes

  Always follow local authority guidance on evacuations and safety measures. Be aware
  of the potential for flooding and landslides, especially in mountainous areas.


  # Local adaptation notes

  Adapt preparation and response plans based on local geography and infrastructure
  vulnerabilities.'
structured_data:
  definition: A hurricane is a tropical cyclone with sustained winds of at least 74
    mph, classified into five categories based on wind speed and damage potential.
  key_questions:
  - What is a hurricane?
  - How are hurricanes classified?
  - What are the potential impacts of a hurricane?
  misconceptions:
  - Only coastal areas are affected by hurricanes.
  - Lower category hurricanes are not dangerous.
