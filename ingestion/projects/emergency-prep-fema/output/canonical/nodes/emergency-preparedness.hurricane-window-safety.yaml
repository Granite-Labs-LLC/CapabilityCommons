markdown_body: '### What this is

  This is an assessment scenario designed to evaluate the effectiveness of actions
  taken to prepare windows and doors in the event of a hurricane.


  ### Why it matters

  Properly managing windows and doors during a hurricane is crucial to prevent damage
  and ensure the safety of the household. Incorrect actions can lead to increased
  risk of injury and property damage.


  ### What you need

  An understanding of best practices for hurricane preparedness, specifically related
  to window and door management.


  ### How to do it

  Consider the scenario where a household plans to close windows and doors on the
  storm side and open them on the opposite side, while also taping the windows. Assess
  whether these actions are effective.


  ### Common failure modes

  Leaving windows open on any side of the house and taping windows are common mistakes.
  These actions do not provide protection and can increase risk.


  ### Safety/boundary notes

  Ensure all windows and doors are closed and, if possible, shuttered to protect against
  debris and high winds.


  ### Local adaptation notes

  Consider local building codes and available resources for window protection, such
  as shutters or impact-resistant glass.'
