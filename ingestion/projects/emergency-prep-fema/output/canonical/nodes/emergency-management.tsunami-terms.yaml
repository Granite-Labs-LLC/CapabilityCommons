markdown_body: '### What this is

  This is a glossary of terms related to tsunamis, which are large ocean waves typically
  caused by underwater earthquakes or volcanic eruptions.


  ### Why it matters

  Understanding these terms is crucial for recognizing tsunami hazards and taking
  appropriate safety measures.


  ### What you need

  Familiarity with basic oceanographic and geological concepts can be helpful.


  ### How to do it

  Review and memorize the terms related to tsunamis to enhance your ability to identify
  potential hazards.


  ### Common failure modes

  Misunderstanding or misusing terms can lead to underestimating the risk of a tsunami.


  ### Safety/boundary notes

  Always follow official guidance and warnings during a tsunami threat.


  ### Local adaptation notes

  Terms may vary slightly based on regional language and local practices.'
