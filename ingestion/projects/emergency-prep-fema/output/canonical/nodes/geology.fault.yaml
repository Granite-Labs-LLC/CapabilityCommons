summary_short: A fault is a fracture where displacement occurs during an earthquake.
summary_medium: A fault is a geological fracture where displacement occurs during
  an earthquake, with slippage ranging from less than an inch to over 10 yards.
plain_language: A fault is a crack in the Earth's surface where movement happens during
  an earthquake. This movement can be small or very large.
markdown_body: '### What this is

  A fault is a fracture in the Earth''s crust where sections of rock have moved past
  each other. This movement is known as displacement.


  ### Why it matters

  Faults are significant because they are the sites of earthquakes. Understanding
  faults helps in assessing earthquake risks and preparing for potential seismic activity.


  ### What you need

  Basic understanding of geological terms and earthquake mechanics.


  ### How to do it

  To study faults, geologists examine the Earth''s surface and subsurface using tools
  like seismographs and geological maps to identify and measure displacement.


  ### Common failure modes

  Misidentifying the location or extent of a fault can lead to inaccurate risk assessments.


  ### Safety/boundary notes

  Fieldwork near active faults should be conducted with caution due to the potential
  for sudden seismic activity.


  ### Local adaptation notes

  In regions with high seismic activity, local building codes may require structures
  to be designed to withstand fault movements.'
