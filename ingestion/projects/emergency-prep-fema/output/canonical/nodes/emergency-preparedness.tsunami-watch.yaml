plain_language: A tsunami watch means that a tsunami might have been created, but
  it is at least two hours away from reaching the area.
markdown_body: '### What this is

  A tsunami watch is an alert that indicates a tsunami has been or may have been generated.
  It is a precautionary measure to inform people that a tsunami could potentially
  impact the area, but it is at least two hours away.


  ### Why it matters

  Understanding a tsunami watch is crucial for preparedness and safety. It provides
  an early warning that allows individuals and communities to take necessary precautions
  and prepare for a possible tsunami impact.


  ### What you need

  Awareness of local emergency procedures and access to reliable information sources
  to stay updated on the situation.


  ### How to do it

  Upon receiving a tsunami watch, monitor official communication channels for updates
  and prepare to evacuate if necessary. Ensure you have an emergency kit ready and
  know the evacuation routes.


  ### Common failure modes

  Ignoring the watch, assuming it will not escalate, or not having an evacuation plan
  can lead to inadequate preparation.


  ### Safety/boundary notes

  Always prioritize safety and follow instructions from local authorities. Do not
  wait for a tsunami warning to take action.


  ### Local adaptation notes

  Local authorities may have specific procedures and communication channels. Familiarize
  yourself with these to ensure timely and accurate information.'
