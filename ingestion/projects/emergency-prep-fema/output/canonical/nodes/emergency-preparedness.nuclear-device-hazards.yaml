- object_id: emergency-preparedness.nuclear-device-hazards
  claim_id: clm_001
  claim_text: The extent, nature, and timing of the hazards that may arise from a
    nuclear explosion are influenced by various factors.
  support:
  - source_id: src.fema.are-you-ready.2004
    page_start: 165
    page_end: 165
    segment_id: src.fema.are-you-ready.2004::seg_000249
    excerpt: 'The extent, nature, and arrival time of these hazards are difficult
      to predict. The geographical dispersion of hazard effects will be defined by
      the following: Size of the device. A more powerful bomb will produce more distant
      effects. Height above the ground the device was detonated. This will determine
      the extent of blast effects. Nature of the surface beneath the explosion. Some
      materials are more likely to become radioactive and airborne than others. Flat
      areas are more susceptible to blast effects. Existing meteorological conditions.
      Wind speed and direction will affect arrival time of fallout; precipitation
      may wash fallout from the atmosphere.'
    start_char: 0
    end_char: 503
    support_strength: strong
