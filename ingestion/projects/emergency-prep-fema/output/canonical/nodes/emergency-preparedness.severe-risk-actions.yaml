plain_language: 'When there is a severe risk, follow these steps: listen to local
  officials, stay informed via TV or radio, and be ready to shelter or evacuate if
  needed.'
markdown_body: '### What this is

  This reference sheet outlines the actions to take when a severe risk level is declared
  by local authorities.


  ### Why it matters

  Understanding and following the correct procedures during a severe risk situation
  can ensure safety and help manage the situation effectively.


  ### What you need

  Access to a TV or radio, a plan for sheltering or evacuating, and communication
  with local authorities.


  ### How to do it

  1. Complete all recommended actions from lower risk levels.

  2. Listen to local emergency management officials for instructions.

  3. Stay tuned to TV or radio for the latest information.

  4. Be prepared to shelter in place or evacuate as instructed.

  5. Anticipate traffic delays and restrictions.

  6. Volunteer services only if requested.

  7. Check with your school or workplace regarding their operational status.


  ### Common failure modes

  Ignoring official instructions, failing to prepare for evacuation, and volunteering
  services without being requested.


  ### Safety/boundary notes

  Always prioritize your safety and follow official guidance. Do not attempt to volunteer
  unless specifically requested.


  ### Local adaptation notes

  Adapt actions based on local infrastructure and resources available. Communicate
  with local emergency services for specific instructions.'
