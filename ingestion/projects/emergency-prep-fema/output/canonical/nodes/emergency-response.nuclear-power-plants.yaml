summary_short: Overview of nuclear power plants, their operation, potential risks,
  and emergency response plans.
summary_medium: Nuclear power plants use nuclear fission to generate electricity.
  They are closely monitored, but accidents can lead to radiation exposure. Emergency
  plans are in place to protect nearby populations.
plain_language: Nuclear power plants generate electricity using nuclear fission. While
  they are generally safe, accidents can happen, leading to radiation exposure. Emergency
  response plans are essential to protect people living near these plants.
markdown_body: '# What this is

  Nuclear power plants are facilities that use nuclear fission to generate electricity.
  They convert the heat produced by fission into steam, which powers generators.


  # Why it matters

  These plants provide about 20% of the nation''s electricity. However, accidents
  can occur, potentially releasing harmful radiation into the environment, posing
  health risks to nearby populations.


  # What you need

  Understanding of nuclear fission, radiation exposure, and emergency planning zones
  is essential. Familiarity with local emergency response plans is also important.


  # How to do it

  Monitor radiation levels and implement emergency response plans as needed. Be aware
  of the two emergency planning zones: a 10-mile zone for direct radiation exposure
  and a 50-mile zone for potential contamination.


  # Common failure modes

  Radiation leaks and inadequate emergency response are potential failure modes.


  # Safety/boundary notes

  The 10-mile emergency planning zone is critical for direct exposure, while the 50-mile
  zone addresses contamination risks.


  # Local adaptation notes

  Adapt emergency plans based on proximity to nuclear power plants and local government
  guidelines.'
structured_data:
  definition: Nuclear power plants use nuclear fission to generate electricity, which
    involves splitting atoms to release energy.
  key_questions:
