    segment_id: src.fema.are-you-ready.2004::seg_000218
    excerpt: Local and state governments, federal agencies, and the electric utilities
      have emergency response plans in the event of a nuclear power plant incident.
      The plans defi ne two "emergency planning zones." One zone covers an area within
      a 10 mile radius of the plant, where it is possible that people could be harmed
      by direct radiation exposure. The second zone covers a broader area, usually
      up to a 50-mile radius from the plant, where radioactive materials could contaminate
      water supplies, food crops, and livestock.
