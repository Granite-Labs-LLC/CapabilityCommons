summary_short: Seismic waves are vibrations from an earthquake fault causing destruction.
summary_medium: Seismic waves are vibrations that travel outward from an earthquake
  fault, causing most of the destruction during earthquakes.
plain_language: Seismic waves are the vibrations that spread out from where an earthquake
  starts. These vibrations are what usually cause the most damage during an earthquake.
markdown_body: '### What this is

  Seismic waves are vibrations that travel outward from the point of fault slippage
  during an earthquake. They move at speeds of several miles per second.


  ### Why it matters

  Understanding seismic waves is crucial because they are responsible for most of
  the damage during earthquakes. This knowledge helps in designing structures that
  can withstand such forces.


  ### What you need

  A basic understanding of geology and earthquake mechanics.


  ### How to do it

  To study seismic waves, one can use seismographs to measure the vibrations and analyze
  their patterns to understand the earthquake''s impact.


  ### Common failure modes

  Misinterpreting seismic data can lead to inadequate structural designs that fail
  during earthquakes.


  ### Safety/boundary notes

  Ensure that all seismic studies and constructions adhere to local safety regulations
  and building codes.


  ### Local adaptation notes

  Consider local geological conditions when applying seismic wave knowledge to construction
  and safety planning.'
