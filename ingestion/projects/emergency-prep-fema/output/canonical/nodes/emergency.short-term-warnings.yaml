summary_short: Learn about short term watches and warnings for hurricane threats.
summary_medium: This reference sheet provides information on short term watches and
  warnings related to specific hurricane threats, including flash floods and tornadoes.
plain_language: This guide helps you understand the short term watches and warnings
  issued for hurricane threats like flash floods and tornadoes, so you can stay safe.
markdown_body: '### What this is

  Short term watches and warnings are alerts issued to inform the public about specific
  and immediate hurricane-related threats, such as flash floods and tornadoes.


  ### Why it matters

  Understanding these warnings is crucial for taking timely action to protect yourself
  and your property from sudden and severe weather events.


  ### What you need

  Stay informed through reliable sources like weather apps, radio, or TV broadcasts
  to receive these warnings promptly.


  ### How to do it

  Monitor local weather updates regularly, especially during hurricane season, and
  be prepared to act quickly if a warning is issued.


  ### Common failure modes

  Ignoring warnings or delaying action can lead to increased risk of harm or property
  damage.


  ### Safety/boundary notes

  Always prioritize safety by following evacuation orders and seeking shelter when
  advised.


  ### Local adaptation notes

  Adapt your response based on local infrastructure and resources available for emergency
  situations.'
