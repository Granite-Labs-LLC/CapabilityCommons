bundle_overrides:
  hook: Properly managing your food supplies during emergencies can ensure safety
    and nutrition when you need it most.
  primer: In times of emergency, having a well-organized and managed food supply can
    make a significant difference in your ability to cope with the situation. Emergencies
    can disrupt normal food supply chains, making it essential to have a stockpile
    of non-perishable foods that can sustain you and your family. This involves selecting
    foods that are nutritious and have a long shelf life, such as canned goods, dried
    fruits, and grains. Proper storage is crucial to prevent spoilage and contamination.
    Food should be kept in a cool, dry place, ideally in airtight containers to protect
    against pests and moisture. Regularly rotating your supplies by using older items
    first and replacing them with new ones ensures that your food remains fresh and
    safe to consume. Avoiding expired foods and ensuring proper storage conditions
    are key to maintaining a reliable food supply during emergencies.
  guide: '1. **Select Non-Perishable Foods**: Choose items that are high in nutrition
    and have a long shelf life. Good options include canned goods, dried fruits, grains,
    and other non-perishable items. These foods should be able to sustain you without
    the need for refrigeration.


    2. **Proper Storage**: Store your food in a cool, dry place to prevent spoilage.
    Use airtight containers to protect against pests and moisture. Ensure that the
    storage area is clean and organized, with shelves and labels to help you keep
    track of your supplies.


    3. **Rotate Supplies**: Regularly check your food supplies and use older items
    first. This practice, known as ''first in, first out,'' helps prevent spoilage
    and ensures that your food remains fresh. Replace used items with new ones to
    maintain a steady supply.


    4. **Check Expiration Dates**: Regularly inspect your food supplies for expiration
    dates. Discard any items that are expired or show signs of spoilage, such as unusual
    odors, colors, or textures.


    5. **Adapt to Local Conditions**: Consider local climate and available food items
    when planning your food storage. Adjust your selection and storage methods to
    suit your environment, ensuring that your supplies remain safe and effective.'
  reference:
  - Store food in a cool, dry place.
  - Use airtight containers to protect against pests.
  - Rotate supplies regularly, using older items first.
  - Select non-perishable foods with long shelf lives.
  - Avoid consuming expired foods.
  - Ensure proper storage conditions to prevent spoilage.
  worksheet:
  - List five non-perishable food items you can store for emergencies.
  - Identify a suitable storage area in your home and describe how you will organize
    it.
  - Create a rotation schedule for your food supplies.
  - Check the expiration dates of your current food supplies and note any that need
    replacing.
  - Describe how you would adapt your food storage plan for a different climate.
  teach_forward_kit:
    three_minute_version: Managing food supplies during emergencies involves selecting
      non-perishable foods, storing them properly, and rotating them regularly to
      ensure freshness and safety. Key steps include using airtight containers, keeping
      food in a cool, dry place, and checking expiration dates.
    ten_minute_outline:
    - Introduction to the importance of managing food supplies during emergencies.
    - Discuss selecting non-perishable foods with long shelf lives.
    - Explain proper storage techniques to prevent spoilage.
    - Highlight the importance of rotating supplies and checking expiration dates.
    - Discuss adapting storage methods to local conditions.
    discussion_prompts:
    - Why is it important to have a well-organized food supply during emergencies?
    - What are some challenges you might face in managing food supplies?
    - How can local climate affect your food storage plan?
    - What are some strategies for ensuring your food supplies remain fresh and safe?
