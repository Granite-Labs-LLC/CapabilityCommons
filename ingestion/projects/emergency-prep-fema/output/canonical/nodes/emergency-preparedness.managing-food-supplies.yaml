summary_short: Learn how to manage food supplies effectively during emergencies.
summary_medium: This guide provides essential steps for managing food supplies during
  emergencies, focusing on storage, rotation, and selection of non-perishable items
  to ensure food safety and availability.
plain_language: This guide helps you prepare and manage your food supplies in case
  of an emergency. It covers how to store food properly, rotate your supplies to keep
  them fresh, and choose the right non-perishable foods.
markdown_body: "# What this is\nThis guide explains how to manage food supplies effectively\
  \ during emergencies. It includes tips on storing, rotating, and selecting non-perishable\
  \ food items to ensure you have enough safe food available when needed.\n\n# Why\
  \ it matters\nProper management of food supplies is crucial during emergencies to\
  \ prevent spoilage, ensure food safety, and maintain adequate nutrition. Having\
  \ a well-organized food supply can reduce stress and increase resilience in crisis\
  \ situations.\n\n# What you need\nYou'll need storage containers, shelves, and labels\
  \ to organize your food supplies. It's also important to have a list of non-perishable\
  \ food items that are suitable for long-term storage.\n\n# How to do it\n1. Store\
  \ food in a cool, dry place to prevent spoilage. Use airtight containers to protect\
  \ against pests and moisture. \n2. Rotate your supplies regularly by using older\
  \ items first and replacing them with new ones. \n3. Select non-perishable foods\
  \ that are high in nutrition and have a long shelf life, such as canned goods, dried\
  \ fruits, and grains.\n\n# Common failure modes\nCommon issues include food spoilage\
  \ due to improper storage conditions, insufficient supplies due to poor planning,\
  \ and contamination from pests or expired items.\n\n# Safety/boundary notes\nAvoid\
  \ consuming expired foods and ensure all food is stored under proper conditions\
  \ to prevent contamination and spoilage.\n\n# Local adaptation notes\nConsider the\
  \ availability of local food items and how the local climate might impact storage\
  \ conditions. Adjust your food selection and storage methods accordingly."
