markdown_body: '# What this is

  This reference sheet provides essential safety tips and mitigation techniques to
  help individuals and communities prepare for wildfires.


  # Why it matters

  Wildfires can cause significant damage to property and pose serious risks to personal
  safety. Being prepared with the right knowledge and actions can help mitigate these
  risks.


  # What you need

  Access to reliable information on wildfire safety and preparedness, such as pamphlets
  or guides.


  # How to do it

  Implement recommended safety tips such as creating defensible space around your
  property, having an evacuation plan, and staying informed about local fire conditions.


  # Common failure modes

  Inadequate preparation, such as failing to clear flammable materials from around
  the home or not having an evacuation plan.


  # Safety/boundary notes

  Ensure that all safety measures are in compliance with local regulations and guidelines.


  # Local adaptation notes

  Adapt safety measures to fit local environmental conditions and community resources.'
