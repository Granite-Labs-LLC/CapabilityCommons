plain_language: This guide helps you prepare emergency kits for different locations
  like home, work, and your car, so you're ready for any situation.
markdown_body: '### What this is

  This reference sheet provides guidelines for preparing emergency supply kits for
  your home, workplace, and vehicle.


  ### Why it matters

  Emergencies can happen at any time and place. Having a well-prepared kit ensures
  you have the necessary supplies to either evacuate quickly or shelter in place.


  ### What you need

  You need to gather essential supplies such as food, water, first aid supplies, flares,
  jumper cables, and walking shoes.


  ### How to do it

  1. **Home**: Store a kit with essential food, water, and supplies for at least three
  days in a designated place. Ensure all family members know its location. Consider
  additional supplies for up to two weeks of sheltering.

  2. **Work**: Keep a ''grab and go'' kit with food, water, and walking shoes in case
  of evacuation.

  3. **Vehicle**: Maintain a kit with food, water, first aid supplies, flares, jumper
  cables, and seasonal items in your car.


  ### Common failure modes

  Kits not being accessible, having insufficient supplies, or family members not knowing
  the kit''s location.


  ### Safety/boundary notes

  Ensure kits are stored in safe, easily accessible locations.


  ### Local adaptation notes

  Consider regional climate and workplace policies when preparing kits.'
