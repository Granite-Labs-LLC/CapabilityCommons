markdown_body: '### What this is

  This guide provides steps to ensure your home''s electrical wiring is safe and reduces
  the risk of fire.


  ### Why it matters

  Faulty electrical wiring is a common cause of house fires. Regular inspections and
  maintenance can prevent dangerous situations.


  ### What you need

  You may need extension cords and UL-approved units with built-in circuit breakers.


  ### How to do it

  1. Have a professional electrician check your home''s wiring.

  2. Inspect extension cords for any damage like frayed wires or loose plugs.

  3. Ensure all outlets have cover plates and no exposed wiring.

  4. Avoid running wires under rugs, over nails, or in high-traffic areas.

  5. Do not overload outlets or extension cords; use UL-approved units with circuit
  breakers if multiple appliances need to be plugged in.

  6. Ensure insulation does not touch bare wires.


  ### Common failure modes

  Overloaded circuits and frayed wires are common issues that can lead to fires.


  ### Safety/boundary notes

  Always consult a professional electrician for wiring issues beyond basic inspections.


  ### Local adaptation notes

  Consider local building codes and regulations when inspecting and maintaining wiring.'
