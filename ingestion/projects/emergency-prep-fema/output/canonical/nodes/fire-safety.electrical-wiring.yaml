bundle_overrides:
  hook: Faulty electrical wiring is a leading cause of house fires, but with regular
    maintenance, you can keep your home safe.
  primer: Electrical wiring safety is crucial for preventing house fires and ensuring
    the safety of your home. Faulty wiring, overloaded circuits, and frayed wires
    are common issues that can lead to dangerous situations. Regular inspections and
    maintenance can help identify and rectify these problems before they escalate.
    It's important to have a professional electrician check your home's wiring periodically,
    as they have the expertise to spot issues that may not be obvious to the untrained
    eye. Additionally, using UL-approved units with built-in circuit breakers can
    prevent sparks and short circuits when multiple appliances are plugged in. Simple
    actions like ensuring all outlets have cover plates, avoiding running wires under
    rugs, and inspecting extension cords for damage can significantly reduce the risk
    of electrical fires. By following these guidelines, you can maintain a safe electrical
    environment in your home.
  guide: '1. Schedule a professional electrician to inspect your home''s wiring. This
    is essential for identifying any hidden issues that could lead to fires.


    2. Regularly check extension cords for any signs of damage, such as frayed wires
    or loose plugs. Replace any damaged cords immediately to prevent electrical hazards.


    3. Ensure all electrical outlets in your home have cover plates and that there
    is no exposed wiring. This prevents accidental contact with live wires.


    4. Avoid running electrical wires under rugs, over nails, or in high-traffic areas.
    These practices can damage the wires and create fire hazards.


    5. Do not overload electrical outlets or extension cords. If you need to plug
    in multiple appliances, use a UL-approved unit with built-in circuit breakers
    to prevent overloading.


    6. Make sure that insulation does not come into contact with bare wires, as this
    can lead to overheating and potential fires.


    By following these steps, you can significantly reduce the risk of electrical
    fires in your home.'
  reference:
  - Have a professional electrician check your home's wiring.
  - Inspect extension cords for frayed wires or loose plugs.
  - Ensure all outlets have cover plates and no exposed wiring.
  - Avoid running wires under rugs, over nails, or in high-traffic areas.
  - Do not overload outlets or extension cords; use UL-approved units with circuit
    breakers.
  - Ensure insulation does not touch bare wires.
  worksheet:
  - List three signs of faulty electrical wiring in your home.
  - Inspect all extension cords in your home and note any that need replacement.
  - Check all outlets for cover plates and exposed wiring.
  - Identify any areas where wires are improperly placed (e.g., under rugs) and plan
    how to fix them.
  - Calculate the load on your most used outlet and determine if it is overloaded.
  teach_forward_kit:
    three_minute_version: Faulty electrical wiring can lead to house fires. Regular
      inspections, using UL-approved units, and ensuring proper placement of wires
      can prevent these hazards.
    ten_minute_outline:
    - Introduction to electrical wiring safety
    - Common causes of electrical fires
    - Importance of professional inspections
    - 'DIY checks: extension cords, outlets, and wire placement'
    - Using UL-approved units to prevent overload
    - Q&A session
    discussion_prompts:
    - What are the most common electrical hazards in homes?
    - Why is it important to use UL-approved units?
    - How can regular maintenance prevent electrical fires?
    - What steps can you take today to improve electrical safety in your home?
