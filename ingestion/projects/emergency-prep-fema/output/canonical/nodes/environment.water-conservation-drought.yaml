markdown_body: '### What this is

  This concept note explores the causes and impacts of water shortages during droughts
  and emphasizes the importance of water conservation.


  ### Why it matters

  Droughts can lead to severe water shortages, affecting large populations and increasing
  the risk of other hazards like fires and floods. Conserving water ensures that there
  is enough for critical needs.


  ### What you need

  An understanding of local water availability and conservation policies, and a willingness
  to implement water-saving practices.


  ### How to do it

  Adopt water-saving practices both indoors and outdoors. This includes fixing leaks,
  using water-efficient appliances, and reducing water usage in daily activities.


  ### Common failure modes

  Ineffective water management can exacerbate shortages and lead to insufficient water
  for essential needs.


  ### Safety/boundary notes

  Ensure that water conservation efforts do not compromise hygiene and sanitation
  standards.


  ### Local adaptation notes

  Consider regional water availability and local conservation policies when implementing
  water-saving practices.'
