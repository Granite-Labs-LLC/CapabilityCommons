plain_language: Learn how to build a safe room in your house that can protect you
  from tornadoes, hurricanes, and other high winds using FEMA's detailed guides.
markdown_body: '### What this is

  This reference sheet provides information on constructing a safe room within your
  home that can withstand extreme wind events such as tornadoes and hurricanes.


  ### Why it matters

  Safe rooms are crucial for protecting lives during severe weather events. They provide
  a secure space that can resist high winds and flying debris, significantly increasing
  the safety of occupants.


  ### What you need

  To build a safe room, you will need detailed construction plans, appropriate building
  materials, and possibly professional assistance to ensure the room meets safety
  standards.


  ### How to do it

  Refer to FEMA''s brochure ''Taking Shelter from the Storm: Building a Safe Room
  Inside Your House'' (L-233) and the manual (FEMA-320) for comprehensive guidance
  on planning and constructing a safe room. These resources include step-by-step instructions
  and necessary specifications.


  ### Common failure modes

  Improper construction or using inadequate materials can compromise the safety of
  the room. Ensure adherence to the guidelines provided in the FEMA resources.


  ### Safety/boundary notes

  Ensure that the safe room is accessible to all household members and that it is
  regularly maintained to remain effective.


  ### Local adaptation notes

  Consider local building codes and weather patterns when planning your safe room
  to ensure it meets regional safety requirements.'
