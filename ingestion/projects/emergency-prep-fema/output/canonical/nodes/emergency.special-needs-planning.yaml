bundle_overrides:
  hook: Emergency planning for individuals with special needs is crucial to ensure
    safety and well-being during unexpected situations.
  primer: Emergencies can pose significant challenges for individuals with special
    needs, making it essential to have a well-thought-out plan. This involves registering
    with local emergency services to ensure you receive timely assistance. Building
    a support network of neighbors, friends, and coworkers is also vital, as they
    can provide immediate help when needed. Discussing your specific needs with your
    employer can ensure that your workplace is prepared to accommodate you during
    an emergency. For those with mobility impairments, having an escape chair ready,
    especially in high-rise buildings, can be lifesaving. Additionally, keeping specialized
    items such as extra wheelchair batteries, oxygen, catheters, medications, and
    food for service animals ensures that you have everything you need to maintain
    your health and safety during an emergency. Proper planning can significantly
    reduce risks and provide peace of mind.
  guide: '1. **Register with Local Emergency Services**: Contact your local emergency
    services or fire department to register your needs. This ensures that they are
    aware of your situation and can provide the necessary assistance during an emergency.


    2. **Build a Support Network**: Create a network of neighbors, relatives, friends,
    and coworkers who can assist you in an emergency. Make sure they are aware of
    your needs and how they can help.


    3. **Discuss Needs with Your Employer**: Talk to your employer about your specific
    needs and ensure that your workplace has a plan in place to accommodate you during
    an emergency.


    4. **Prepare for Mobility Impairments**: If you have mobility challenges, especially
    in high-rise buildings, have an escape chair ready. This can help you evacuate
    safely if needed.


    5. **Gather Specialized Supplies**: Keep essential items ready, such as extra
    wheelchair batteries, oxygen, catheters, medications, and food for service animals.
    Regularly check these supplies to ensure they are in good condition and not expired.


    6. **Regularly Review and Update Your Plan**: Emergency plans should be reviewed
    and updated regularly to account for any changes in your needs or circumstances.'
  reference:
