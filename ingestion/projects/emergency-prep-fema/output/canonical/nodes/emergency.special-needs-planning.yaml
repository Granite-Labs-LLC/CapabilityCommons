summary_short: Prepare for emergencies with special needs considerations.
summary_medium: Guidance for individuals with special needs to prepare for emergencies,
  including community registration, creating support networks, and maintaining necessary
  supplies.
plain_language: If you have special needs, it's important to prepare for emergencies
  by registering with local services, building a support network, and ensuring you
  have necessary supplies.
markdown_body: '# What this is

  This guide helps individuals with special needs prepare for emergencies by outlining
  steps to ensure their safety and well-being.


  # Why it matters

  In emergencies, individuals with special needs may face additional challenges. Proper
  planning can ensure they receive the necessary assistance and maintain their health
  and safety.


  # What you need

  You need to register with local emergency services, create a support network, and
  gather specialized items like wheelchair batteries, oxygen, and medications.


  # How to do it

  1. Register with your local emergency services or fire department to ensure you
  receive assistance.

  2. Create a network of neighbors, relatives, friends, and coworkers who can help
  you in an emergency.

  3. Discuss your needs with your employer and ensure your workplace is prepared.

  4. If mobility impaired, have an escape chair ready, especially in high-rise buildings.

  5. Keep specialized items ready, such as extra wheelchair batteries, oxygen, catheters,
  medications, and food for service animals.


  # Common failure modes

  Failing to register with emergency services, not having a robust support network,
  and lacking sufficient specialized supplies can lead to increased risk during emergencies.


  # Safety/boundary notes

  Ensure all equipment is in good working order and that your support network is familiar
  with its operation.


  # Local adaptation notes

  Consider the availability of community assistance and cooperation from building
  management when planning.'
