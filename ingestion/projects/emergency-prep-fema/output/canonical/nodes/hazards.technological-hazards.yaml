summary_short: A list of technological hazards for emergency planning.
summary_medium: This reference sheet outlines technological hazards such as hazardous
  materials incidents and nuclear power plant emergencies, important for emergency
  planning.
plain_language: This sheet helps you understand different technological hazards like
  chemical spills and nuclear emergencies, which are important to consider when planning
  for emergencies.
markdown_body: '### What this is

  This reference sheet provides an overview of various technological hazards that
  can impact communities. It includes incidents involving hazardous materials, household
  chemical emergencies, and nuclear power plant emergencies.


  ### Why it matters

  Understanding technological hazards is crucial for effective emergency planning.
  These hazards can pose significant risks to public safety and require specific preparedness
  measures.


  ### What you need

  Familiarity with local industrial sites, chemical storage facilities, and nearby
  nuclear power plants can help in assessing potential risks.


  ### How to do it

  Review local emergency management plans and resources to understand how these hazards
  are addressed in your area. Participate in community preparedness programs and stay
  informed about safety protocols.


  ### Common failure modes

  Ignoring the potential for technological hazards or underestimating their impact
  can lead to inadequate preparedness and response.


  ### Safety/boundary notes

  Ensure that safety measures are in place for handling hazardous materials and that
  evacuation plans are clear and accessible.


  ### Local adaptation notes

  Adapt emergency plans to reflect local industrial activities and the proximity of
  nuclear facilities. Engage with local authorities to tailor preparedness efforts.'
structured_data:
  definition: Technological hazards are emergencies that arise from the use or failure
    of technology, including hazardous materials incidents and nuclear power plant
    emergencies.
  key_questions:
  - What types of technological hazards are present in my area?
  - How can I prepare for a hazardous materials incident?
  - What are the safety protocols for a nuclear power plant emergency?
  misconceptions:
  - Technological hazards are rare and unlikely to affect me.
  - Only industrial areas need to worry about hazardous materials.
