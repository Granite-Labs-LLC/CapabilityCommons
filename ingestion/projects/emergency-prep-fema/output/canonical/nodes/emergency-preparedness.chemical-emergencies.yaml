plain_language: This sheet helps you understand the dangers of household chemicals
  and what to do if there's an emergency involving them.
markdown_body: "### What this is\nThis reference sheet provides information on how\
  \ to handle emergencies involving household chemicals. It outlines potential hazards\
  \ and the steps to take in an emergency situation.\n\n### Why it matters\nHousehold\
  \ chemicals can pose significant risks if not handled properly. Understanding these\
  \ risks and knowing how to respond in an emergency can prevent harm and ensure safety.\n\
  \n### What you need\nAwareness of the types of chemicals in your home, knowledge\
  \ of emergency procedures, and access to emergency contact information.\n\n### How\
  \ to do it\n1. Identify the chemicals in your home and understand their potential\
  \ hazards. \n2. Learn the emergency procedures for chemical spills, leaks, or exposure.\
  \ \n3. Keep emergency contact numbers readily available. \n4. In case of an emergency,\
  \ follow the recommended procedures promptly.\n\n### Common failure modes\nMisidentification\
  \ of chemicals and inadequate emergency response can lead to increased risk and\
  \ harm.\n\n### Safety/boundary notes\nAlways use protective gear when handling chemicals\
  \ and ensure proper ventilation in areas where chemicals are used or stored.\n\n\
  ### Local adaptation notes\nAdapt procedures based on the specific chemicals present\
  \ in your home and local emergency services available."
