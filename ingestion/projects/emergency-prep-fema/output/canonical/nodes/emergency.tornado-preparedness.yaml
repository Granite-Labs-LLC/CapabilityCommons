summary_short: Guidelines for preparing for a tornado, including recognizing danger
  signs and seeking appropriate shelter.
summary_medium: Learn how to prepare for a tornado by recognizing danger signs, listening
  to weather updates, and knowing where to seek shelter.
plain_language: This guide helps you prepare for a tornado by teaching you how to
  recognize danger signs, listen to weather updates, and find safe shelter.
markdown_body: "# What this is\nThis guide provides steps to prepare for and respond\
  \ to a tornado, focusing on recognizing danger signs and finding appropriate shelter.\n\
  \n# Why it matters\nTornadoes can cause significant damage and pose serious risks\
  \ to safety. Being prepared can help minimize injuries and fatalities.\n\n# What\
  \ you need\nAccess to NOAA Weather Radio, commercial radio, or television for weather\
  \ updates. Knowledge of safe shelter locations.\n\n# How to do it\n1. Stay alert\
  \ to changing weather conditions. \n2. Listen to NOAA Weather Radio or commercial\
  \ broadcasts for updates. \n3. Recognize danger signs like a dark, greenish sky,\
  \ large hail, a large, dark, low-lying cloud, or a loud roar. \n4. If a tornado\
  \ warning is issued, seek shelter immediately. If indoors, go to a safe room, basement,\
  \ or the lowest level of a building. If outdoors, lie flat in a ditch and cover\
  \ your head.\n\n# Common failure modes\nInjury from debris, inadequate shelter,\
  \ attempting to outrun a tornado in a vehicle.\n\n# Safety/boundary notes\nAvoid\
  \ windows and doors. Do not open windows. Do not seek shelter under bridges or overpasses.\n\
  \n# Local adaptation notes\nConsider local building structures and available shelters\
  \ when planning."
