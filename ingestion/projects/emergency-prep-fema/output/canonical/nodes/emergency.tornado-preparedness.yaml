bundle_overrides:
  hook: Tornadoes can strike with little warning, but being prepared can save lives
    and minimize injuries.
  primer: Tornadoes are powerful and unpredictable natural disasters that can cause
    significant damage and pose serious risks to safety. They are characterized by
    a rotating column of air extending from a thunderstorm to the ground. Recognizing
    the signs of an impending tornado and knowing how to respond can make a critical
    difference. Key danger signs include a dark, often greenish sky, large hail, a
    large, dark, low-lying cloud, and a loud roar similar to a freight train. It is
    crucial to stay informed through NOAA Weather Radio, commercial radio, or television
    for the latest weather updates. When a tornado warning is issued, immediate action
    is necessary. Seek shelter in a safe room, basement, or the lowest level of a
    building. If you are outdoors, lie flat in a ditch and cover your head. Avoid
    windows, doors, and do not seek shelter under bridges or overpasses. Being prepared
    and knowing these steps can help protect you and your loved ones during a tornado.
  guide: '1. **Stay Informed**: Regularly check weather updates from reliable sources
    such as NOAA Weather Radio, commercial radio, or television. This will keep you
    informed about any changes in weather conditions and potential tornado warnings.


    2. **Recognize Danger Signs**: Be alert to signs of an approaching tornado, such
    as a dark, greenish sky, large hail, a large, dark, low-lying cloud, or a loud
    roar similar to a freight train. These signs indicate that a tornado may be imminent.


    3. **Seek Shelter Immediately**: If a tornado warning is issued, do not delay.
    If you are indoors, go to a pre-designated shelter area such as a safe room, basement,
    or the lowest level of a building. Avoid windows and doors.


    4. **Outdoor Safety**: If you are caught outside and cannot reach a building,
    lie flat in a nearby ditch or depression and cover your head with your hands.
    This position helps protect you from flying debris.


    5. **Avoid Unsafe Areas**: Do not open windows, as this can increase the risk
    of injury from flying glass. Avoid seeking shelter under bridges or overpasses,
    as these structures can be dangerous during a tornado.


    6. **Plan Ahead**: Familiarize yourself with your local area''s tornado safety
    plan and identify the safest places to take shelter. Practice tornado drills with
    your family to ensure everyone knows what to do in an emergency.'
  reference:
  - Stay informed with NOAA Weather Radio or commercial broadcasts.
  - 'Recognize danger signs: dark greenish sky, large hail, low-lying cloud, loud
    roar.'
  - Seek immediate shelter in a safe room, basement, or lowest building level.
  - If outdoors, lie flat in a ditch and cover your head.
  - Avoid windows, doors, and do not open windows.
  - Do not seek shelter under bridges or overpasses.
  worksheet:
  - List three reliable sources for weather updates.
  - Identify the danger signs of a tornado.
  - Describe the steps to take if a tornado warning is issued while you are indoors.
  - Explain what to do if you are caught outside during a tornado.
  - Discuss why it is unsafe to seek shelter under bridges or overpasses.
  teach_forward_kit:
    three_minute_version: Tornadoes are dangerous and unpredictable. Stay informed
      through reliable weather updates, recognize danger signs like a dark sky and
      loud roar, and seek immediate shelter in a safe room or basement when a warning
      is issued. Avoid windows and do not seek shelter under bridges.
    ten_minute_outline:
    - Introduction to tornadoes and their risks.
    - Importance of staying informed with weather updates.
    - Recognizing danger signs of a tornado.
    - Steps to take when a tornado warning is issued.
    - Safety measures for indoors and outdoors.
    - Common mistakes and safety tips.
    discussion_prompts:
    - Why is it important to have multiple sources for weather updates?
    - What are the most common danger signs of a tornado?
    - How can practicing tornado drills improve safety?
    - Why is it dangerous to seek shelter under bridges during a tornado?
