plain_language: Learn what to do when a flash flood watch is issued, such as moving
  to higher ground and staying informed through weather updates.
markdown_body: '### What this is

  A flash flood watch means that flash flooding is possible in your area. It is a
  time to prepare and stay informed.


  ### Why it matters

  Flash floods can occur suddenly and with little warning, posing significant risks
  to life and property. Being prepared can help ensure safety.


  ### What you need

  Access to NOAA Weather Radio, commercial radio, or television to receive updates.


  ### How to do it

  When a flash flood watch is issued, be ready to move to higher ground immediately.
  Continuously listen to NOAA Weather Radio, commercial radio, or television for the
  latest information and instructions.


  ### Common failure modes

  Failing to move to higher ground promptly and ignoring weather updates can lead
  to dangerous situations.


  ### Safety/boundary notes

  Always prioritize personal safety and follow official instructions.


  ### Local adaptation notes

  Consider local geography and infrastructure when planning evacuation routes.'
