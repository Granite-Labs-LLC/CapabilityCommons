summary_short: Essential supplies for a disaster kit tailored to hazardous materials
  incidents.
summary_medium: This guide outlines additional supplies to include in a disaster supplies
  kit specifically for hazardous materials incidents, enhancing preparedness and safety.
plain_language: Learn what extra items to add to your disaster supplies kit to be
  ready for hazardous materials incidents.
markdown_body: '# What this is

  This reference sheet provides guidance on enhancing your disaster supplies kit to
  better prepare for hazardous materials incidents.


  # Why it matters

  In the event of a hazardous materials incident, having the right supplies can help
  protect you and your family from exposure to dangerous chemicals.


  # What you need

  To prepare your disaster supplies kit for hazardous materials incidents, you will
  need plastic sheeting, duct tape, and scissors.


  # How to do it

  Add plastic sheeting, duct tape, and scissors to your existing disaster supplies
  kit. These items can be used to seal off windows and doors to prevent chemical exposure.


  # Common failure modes

  An incomplete disaster kit may leave you unprepared for hazardous materials incidents,
  increasing the risk of exposure.


  # Safety/boundary notes

  Ensure that all family members know how to use the supplies effectively in an emergency.


  # Local adaptation notes

  Contact your Local Emergency Planning Committees (LEPCs) to understand specific
  chemical hazards in your area and adjust your kit accordingly.'
