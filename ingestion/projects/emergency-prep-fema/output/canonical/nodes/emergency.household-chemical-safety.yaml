markdown_body: '### What this is

  This reference sheet provides guidelines for safely responding to emergencies involving
  household chemicals.


  ### Why it matters

  Household chemical emergencies can pose significant risks, including fire, explosion,
  and toxic exposure. Proper response can prevent injuries and save lives.


  ### What you need

  A cellular phone and emergency contact numbers are essential tools for managing
  a chemical emergency.


  ### How to do it

  If there''s a risk of fire or explosion, evacuate immediately without collecting
  items. Call the fire department from a safe location. Stay upwind to avoid toxic
  fumes. If someone is exposed, find the chemical container for information and call
  emergency services. Follow first aid instructions from emergency operators and do
  not give anything by mouth unless advised by a professional.


  ### Common failure modes

  Delaying evacuation or providing incorrect first aid can worsen the situation.


  ### Safety/boundary notes

  Do not re-enter the residence until it is declared safe. Avoid giving anything by
  mouth unless instructed by a professional.


  ### Local adaptation notes

  Consider the availability of local emergency services and common household chemicals
  in your area.'
