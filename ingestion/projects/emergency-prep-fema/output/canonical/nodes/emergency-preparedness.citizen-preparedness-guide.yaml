summary_short: A guide to help citizens prepare for emergencies.
summary_medium: This guide provides essential information on how citizens can prepare
  for various emergencies, enhancing readiness and resilience.
plain_language: Learn how to prepare yourself and your family for emergencies with
  this comprehensive guide.
markdown_body: '### What this is

  This guide is an introduction to citizen preparedness, offering detailed information
  on how individuals and families can prepare for emergencies.


  ### Why it matters

  Being prepared for emergencies can significantly reduce the impact of disasters
  on individuals and communities, ensuring safety and resilience.


  ### What you need

  A willingness to plan and gather necessary resources for emergency situations.


  ### How to do it

  Follow the steps outlined in the guide to assess risks, create a plan, and assemble
  an emergency kit.


  ### Common failure modes

  Failing to regularly update emergency plans and supplies, or not practicing emergency
  drills.


  ### Safety/boundary notes

  Ensure that all family members are aware of the emergency plan and know how to execute
  it safely.


  ### Local adaptation notes

  Consider local risks and resources when developing your emergency preparedness plan.'
structured_data:
  definition: Citizen preparedness involves planning and taking actions to ensure
    safety and resilience in the face of emergencies.
  key_questions:
  - What types of emergencies are most likely to occur in my area?
  - What steps can I take to prepare my family for these emergencies?
  misconceptions:
  - Emergency preparedness is only necessary for large-scale disasters.
  - Once a plan is made, it does not need to be updated.
