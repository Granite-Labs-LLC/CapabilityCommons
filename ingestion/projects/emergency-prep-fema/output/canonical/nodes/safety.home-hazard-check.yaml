summary_short: Identify and manage hazardous materials in your home.
summary_medium: A guide to identifying, storing, and disposing of hazardous materials
  in your home safely.
plain_language: Learn how to find and handle hazardous materials in your home to keep
  everyone safe.
markdown_body: '# What this is

  This guide helps you identify and manage hazardous materials in your home to ensure
  safety.


  # Why it matters

  Many common household items can be hazardous if not handled properly. Ensuring they
  are stored and disposed of correctly reduces risks to health and safety, especially
  for children.


  # What you need

  A list of common hazardous household items and the manufacturer''s directions for
  each product.


  # How to do it

  Tour your home to locate hazardous materials. Check each item''s label for proper
  usage, storage, and disposal instructions. Ensure that all chemicals are stored
  out of children''s reach.


  # Common failure modes

  Improper storage or incorrect disposal of hazardous materials can lead to accidents
  or health issues.


  # Safety/boundary notes

  Always keep hazardous materials out of the reach of children.


  # Local adaptation notes

  Consider the availability of storage solutions in your area to safely store hazardous
  materials.'
