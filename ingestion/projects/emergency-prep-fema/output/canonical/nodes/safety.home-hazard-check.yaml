bundle_overrides:
  hook: Protect your family by learning how to identify and safely manage hazardous
    materials in your home.
  primer: Many common household items can be hazardous if not handled properly. These
    include everyday products like aerosol cans, nail polish remover, and toilet bowl
    cleaners. If not stored and disposed of correctly, these items can pose significant
    risks to health and safety, especially for children. By conducting a thorough
    check of your home, you can identify these materials and ensure they are managed
    safely. This process involves checking labels for proper usage, storage, and disposal
    instructions, and ensuring that all chemicals are stored out of children's reach.
    Proper management of these materials not only prevents accidents but also contributes
    to a safer living environment for everyone in the household.
  guide: "1. **Prepare**: Gather a list of common hazardous household items and the\
    \ manufacturer's directions for each product. \n\n2. **Tour Your Home**: Walk\
    \ through each room in your home, including the garage and basement, to locate\
    \ hazardous materials. Look for items like cleaning supplies, paints, and personal\
    \ care products. \n\n3. **Check Labels**: For each item you find, read the label\
    \ carefully. Pay attention to instructions on how to use, store, and dispose of\
    \ the product safely. \n\n4. **Safe Storage**: Ensure all hazardous materials\
    \ are stored in a secure location, out of reach of children. Consider using locked\
    \ cabinets or high shelves. \n\n5. **Proper Disposal**: Follow the manufacturer's\
    \ instructions for disposing of hazardous materials. Never pour chemicals down\
    \ the drain or throw them in the trash unless specified as safe. \n\n6. **Review\
    \ Regularly**: Make it a habit to review your home for hazardous materials regularly,\
    \ especially after purchasing new products. \n\nBy following these steps, you\
    \ can significantly reduce the risk of accidents and health issues related to\
    \ hazardous materials in your home."
  reference:
  - 'Common hazardous items: aerosol cans, nail polish remover, toilet bowl cleaners.'
  - Always check labels for usage, storage, and disposal instructions.
  - Store hazardous materials out of children's reach.
  - Never mix incompatible chemicals.
  - Review and update your home hazard check regularly.
  worksheet:
  - List five hazardous items you found in your home.
  - Describe the storage solution you used for each item.
  - Explain the disposal method for one hazardous material.
  - Identify one area in your home that needs improved storage for hazardous materials.
  - Reflect on any new products you have purchased recently that require safe storage.
  teach_forward_kit:
    three_minute_version: Conduct a quick home tour to identify hazardous materials,
      check labels for safety instructions, and ensure all items are stored out of
      children's reach.
    ten_minute_outline:
    - Introduction to hazardous household materials.
    - Steps to identify and locate hazardous items.
    - Importance of checking labels for safety instructions.
    - Safe storage practices to protect children.
    - Proper disposal methods for hazardous materials.
    - Regular review and update of home hazard checks.
    discussion_prompts:
    - What are some common household items that might be hazardous?
    - Why is it important to check the labels of household products?
    - How can improper storage of hazardous materials affect your family?
    - What strategies can you use to ensure hazardous materials are out of children's
      reach?
    - How often should you conduct a home hazard check?
