markdown_body: '### What this is

  This reference sheet provides information on the dangers of low water crossings
  during flood conditions, as described in the National Weather Service brochure ''The
  Hidden Danger: Low Water Crossing''.


  ### Why it matters

  Driving through flooded areas can be extremely dangerous. Understanding these hazards
  can prevent accidents and save lives.


  ### What you need

  Awareness of local weather conditions and flood warnings. Access to alternative
  routes to avoid flooded areas.


  ### How to do it

  Avoid driving through flooded roads. If you encounter a flooded road, turn around
  and find an alternative route. Stay informed about weather conditions through reliable
  sources.


  ### Common failure modes

  Underestimating the depth and force of floodwaters. Attempting to drive through
  flooded areas despite warnings.


  ### Safety/boundary notes

  Never drive through water if you cannot see the road beneath it. Even shallow water
  can be dangerous.


  ### Local adaptation notes

  Consider local flood patterns and road conditions when planning travel routes during
  heavy rain or flood warnings.'
structured_data:
  definition: Low water crossings are areas where roads dip down to cross a stream
    or river, which can become hazardous during floods.
