plain_language: After a disaster, it's important to focus on health and safety. This
  includes checking for injuries, preventing exhaustion, and being aware of new safety
  hazards.
markdown_body: '# What this is

  This reference sheet provides guidelines for maintaining health and safety in the
  aftermath of a disaster. It includes advice on first aid, preventing exhaustion,
  and identifying new safety hazards.


  # Why it matters

  After a disaster, ensuring the health and safety of yourself and your family is
  crucial. Properly addressing injuries and being aware of new hazards can prevent
  further harm and aid in recovery.


  # What you need

  Basic first aid knowledge, blankets, sturdy work boots, gloves, soap, and access
  to clean water.


  # How to do it

  1. Check for injuries and stabilize any seriously injured persons without moving
  them unless absolutely necessary.

  2. If someone is not breathing, perform artificial respiration.

  3. Maintain body temperature using blankets, but avoid overheating.

  4. Do not give liquids to unconscious individuals.

  5. Pace yourself to avoid exhaustion, drink clean water, eat well, and wear protective
  gear.

  6. Be vigilant for new safety hazards like gas leaks or contaminated water and report
  them to authorities.


  # Common failure modes

  Moving seriously injured persons unnecessarily, overexertion, and ignoring new safety
  hazards.


  # Safety/boundary notes

  Do not move seriously injured persons unless necessary and do not feed liquids to
  unconscious persons.


  # Local adaptation notes

  Consider the availability of clean water and the response of local authorities when
  adapting these guidelines to your situation.'
