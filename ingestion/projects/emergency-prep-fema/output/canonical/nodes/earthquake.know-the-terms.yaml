markdown_body: '### What this is

  This is a glossary of terms related to earthquake hazards. Understanding these terms
  is crucial for identifying and preparing for potential earthquake risks.


  ### Why it matters

  Knowing the terminology associated with earthquakes helps in recognizing hazards
  and understanding safety information, which is essential for effective preparedness
  and response.


  ### What you need

  No specific tools or materials are needed to familiarize yourself with these terms.


  ### How to do it

  Read through the glossary and ensure you understand each term. Consider how each
  term might relate to your local environment and potential earthquake risks.


  ### Common failure modes

  Not taking the time to understand the terms can lead to confusion during an actual
  earthquake event, potentially increasing risk.


  ### Safety/boundary notes

  Ensure that you understand the context in which each term is used to avoid misinterpretation.


  ### Local adaptation notes

  Consider how these terms apply to your local area, as regional differences in geology
  and infrastructure can affect earthquake hazards.'
