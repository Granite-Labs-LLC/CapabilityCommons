summary_short: A worksheet to assess and reduce family risk from hazards.
summary_medium: This worksheet helps families assess risks from various hazards and
  emergencies and suggests ways to reduce these risks.
plain_language: Use this worksheet to figure out what kinds of emergencies could happen
  in your area and how risky they are. Then, think about what you can do to make those
  risks smaller.
markdown_body: '### What this is

  This is a worksheet designed to help individuals and families assess the risk levels
  of various natural and technological hazards that may affect them. It includes a
  list of potential hazards and a space to record the risk level and strategies for
  risk reduction.


  ### Why it matters

  Understanding the risks associated with different hazards allows families to prepare
  effectively and reduce potential harm. By assessing these risks, families can take
  proactive steps to ensure their safety and resilience in the face of emergencies.


  ### What you need

  You will need access to local hazard information, which can be obtained from local
  authorities or FEMA''s hazard maps. A printed copy of the worksheet is also necessary
  to record findings.


  ### How to do it

  1. Consult local authorities or FEMA''s website to gather information about potential
  hazards in your area. 2. Use the worksheet to list each hazard and assess its risk
  level as none, low, moderate, or high. 3. For each hazard, identify and record strategies
  to reduce your risk.


  ### Common failure modes

  Failing to complete a thorough risk assessment or neglecting to consult local authorities
  and available resources can lead to incomplete or inaccurate risk evaluations.


  ### Safety/boundary notes

  Ensure that all family members are involved in the assessment process to increase
  awareness and preparedness.


  ### Local adaptation notes

  Consider local hazard types and community resources when assessing risks and planning
  risk reduction strategies.'
