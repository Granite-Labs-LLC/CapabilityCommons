markdown_body: '### What this is

  This reference sheet lists common cleaning products that require careful handling
  due to potential safety hazards.


  ### Why it matters

  Many cleaning products contain chemicals that can be harmful if not used properly.
  Understanding which products require special attention can help prevent accidents
  and ensure safe usage.


  ### What you need

  Awareness of the cleaning products you use and their potential hazards.


  ### How to do it

  Identify the cleaning products in your home or workplace. Refer to this list to
  determine which products require special handling and follow the safety instructions
  on their labels.


  ### Common failure modes

  Ignoring safety instructions, mixing incompatible products, or using products in
  poorly ventilated areas can lead to harmful exposure.


  ### Safety/boundary notes

  Always read and follow the manufacturer''s instructions. Use protective gear if
  recommended, and ensure proper ventilation when using these products.


  ### Local adaptation notes

  Consider local regulations and guidelines regarding the use and disposal of cleaning
  products.'
