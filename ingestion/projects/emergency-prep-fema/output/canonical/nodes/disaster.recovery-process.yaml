summary_short: Steps for recovering from a disaster, including damage assessment and
  insurance contact.
summary_medium: Guidelines for recovering from a disaster, focusing on assessing damage,
  contacting insurance, and seeking assistance.
plain_language: Learn how to recover from a disaster by assessing damage, contacting
  your insurance, and seeking help.
markdown_body: "# What this is\nThis guide provides a structured approach to recovering\
  \ from a disaster, focusing on key steps such as assessing damage, contacting insurance\
  \ companies, and seeking assistance from local programs.\n\n# Why it matters\nRecovering\
  \ from a disaster can be overwhelming. Following a structured process helps ensure\
  \ that all necessary steps are taken to secure financial support and begin rebuilding.\n\
  \n# What you need\nYou will need insurance documents, damage assessment forms, and\
  \ information on local assistance programs.\n\n# How to do it\n1. Assess the damage\
  \ to your property and document it thoroughly. \n2. Contact your insurance company\
  \ as soon as possible to report the damage and begin the claims process. \n3. Seek\
  \ assistance from local programs or government agencies that offer support for disaster\
  \ recovery.\n\n# Common failure modes\nFailing to complete a thorough damage assessment\
  \ or delaying contact with your insurance company can hinder the recovery process.\n\
  \n# Safety/boundary notes\nEnsure personal safety when assessing damage, especially\
  \ if structural integrity is compromised.\n\n# Local adaptation notes\nConsider\
  \ the availability of local assistance programs and regional insurance policies\
  \ when planning your recovery process."
