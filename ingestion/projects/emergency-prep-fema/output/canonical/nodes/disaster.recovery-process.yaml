bundle_overrides:
  hook: Recovering from a disaster can be overwhelming, but a structured approach
    ensures you don't miss critical steps for financial support and rebuilding.
  primer: Disasters can strike unexpectedly, leaving individuals and communities in
    distress. Recovering from such events is a gradual process that requires careful
    planning and execution. The primary focus is on ensuring safety, both physically
    and mentally, while also addressing the financial and structural impacts. A structured
    disaster recovery process involves assessing the damage to your property, contacting
    your insurance company promptly, and seeking assistance from local programs or
    government agencies. Having the right documents, such as insurance papers and
    damage assessment forms, is crucial. This process not only helps in securing financial
    support but also aids in rebuilding lives and communities. By following a systematic
    approach, you can make the recovery process less stressful and more efficient.
  guide: '1. **Ensure Safety**: Before anything else, make sure that it is safe to
    assess the damage. Check for hazards like loose power lines, gas leaks, or structural
    damage. If in doubt, have a professional inspect the area.


    2. **Assess the Damage**: Carefully document all damage to your property. Take
    photos and notes, as these will be essential for insurance claims and assistance
    applications.


    3. **Contact Your Insurance Company**: As soon as it is safe, contact your insurance
    provider to report the damage. Provide them with the documentation you have gathered
    to start the claims process.


    4. **Seek Local Assistance**: Look for local programs or government agencies that
    offer disaster recovery support. These can provide additional resources and financial
    aid.


    5. **Document Everything**: Keep a detailed record of all communications and transactions
    related to the recovery process. This includes insurance claims, assistance applications,
    and any repairs or rebuilding efforts.


    6. **Plan for Rebuilding**: Once immediate needs are addressed, start planning
    for long-term rebuilding. This may involve hiring contractors, applying for additional
    financial aid, or making decisions about future safety measures.'
  reference:
  - Ensure personal safety first.
  - Document all damage thoroughly.
  - Contact insurance promptly.
  - Seek local assistance programs.
  - Keep detailed records.
  - Plan for long-term rebuilding.
  worksheet:
  - List potential hazards to check for before assessing damage.
  - Create a checklist for documenting property damage.
  - Draft a script for contacting your insurance company.
  - Research local assistance programs available in your area.
  - Outline a plan for keeping records during the recovery process.
  - Develop a long-term rebuilding plan considering future safety measures.
  teach_forward_kit:
    three_minute_version: Disaster recovery involves ensuring safety, assessing damage,
      contacting insurance, and seeking local assistance. Document everything and
      plan for rebuilding.
    ten_minute_outline:
    - Introduction to disaster recovery
    - Importance of safety and initial assessment
    - Steps to document damage
    - How to contact insurance and start claims
    - Exploring local assistance options
    - Importance of record-keeping
    - Planning for long-term rebuilding
    discussion_prompts:
    - What are the first steps you would take after a disaster?
    - How can documenting damage help in the recovery process?
    - What challenges might arise when contacting insurance companies?
    - Why is it important to seek local assistance programs?
    - How can planning for future safety measures benefit long-term recovery?
