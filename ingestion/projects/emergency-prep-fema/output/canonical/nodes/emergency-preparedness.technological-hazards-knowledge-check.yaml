summary_short: Assess your knowledge of technological hazards and preparedness.
summary_medium: This assessment evaluates your understanding of technological hazards,
  including hazardous materials, radiation exposure, and nuclear power plant emergencies.
plain_language: This is a set of questions to test how well you know about dealing
  with technological hazards like hazardous materials, radiation, and nuclear emergencies.
markdown_body: '### What this is

  This knowledge check consists of questions designed to assess your understanding
  and preparedness for technological hazards. It covers topics such as hazardous materials,
  radiation exposure, and nuclear power plant emergencies.


  ### Why it matters

  Understanding technological hazards is crucial for ensuring personal and community
  safety. Being prepared can significantly reduce risks and improve response during
  emergencies.


  ### What you need

  Familiarity with emergency procedures, contact information for the National Poison
  Control Center, and knowledge of local hazardous materials information.


  ### How to do it

  Answer the questions provided in the assessment. Use the answer key to check your
  responses and identify areas where you may need further study or preparation.


  ### Common failure modes

  Common issues include a lack of knowledge about emergency procedures and an inability
  to contact emergency services when needed.


  ### Safety/boundary notes

  Ensure you have access to accurate and up-to-date emergency contact numbers and
  community-specific hazardous materials information.


  ### Local adaptation notes

  Adapt the knowledge check to include local emergency contact numbers and information
  about hazardous materials specific to your community.'
