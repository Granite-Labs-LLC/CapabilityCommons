plain_language: Learn how to stay safe during a winter storm, whether you're at home
  or caught in your car. These guidelines cover everything from dressing warmly to
  conserving fuel and staying visible to rescuers.
markdown_body: '### What this is

  This document provides guidelines for staying safe during a winter storm, with a
  focus on personal safety, driving precautions, and survival strategies if trapped
  in a vehicle.


  ### Why it matters

  Winter storms can be life-threatening due to extreme cold, snow, and ice. Understanding
  how to protect yourself can prevent accidents, injuries, and fatalities.


  ### What you need

  Basic supplies include warm clothing, a distress flag, road maps, and materials
  for insulation like seat covers and floor mats.


  ### How to do it

  During a winter storm, stay informed through weather reports. Dress in layers, eat
  regularly, and avoid overexertion. If driving is necessary, travel during the day
  and keep others informed of your schedule. If trapped in a car, stay inside, run
  the engine periodically for warmth, and ensure ventilation to prevent carbon monoxide
  poisoning. Use available materials for insulation and signal for help.


  ### Common failure modes

  Common issues include dehydration, carbon monoxide poisoning, and battery depletion.
  Avoid these by drinking fluids, ensuring proper ventilation, and conserving battery
  power.


  ### Safety/boundary notes

  Always open a window slightly for ventilation when running the engine and clear
  the exhaust pipe regularly. Avoid overexertion and stay visible to rescuers.


  ### Local adaptation notes

  Adapt guidelines to local road conditions and use locally available materials for
  insulation.'
