plain_language: Learn how to prepare for emergencies based on the Homeland Security
  Advisory System with specific recommendations for different groups like families
  and schools.
markdown_body: '### What this is

  This reference sheet outlines preparedness activities recommended by the American
  Red Cross for various populations under the Homeland Security Advisory System. It
  provides guidance for individuals, families, neighborhoods, schools, and businesses
  to enhance their readiness for potential emergencies.


  ### Why it matters

  Understanding and implementing these recommendations can significantly improve safety
  and preparedness during different threat levels, ensuring that communities are better
  equipped to handle emergencies.


  ### What you need

  Access to online resources provided by the American Red Cross, including specific
  guidelines for each population group.


  ### How to do it

  Review the recommendations for your specific group, such as families or businesses,
  and implement the suggested preparedness activities. These may include creating
  emergency plans, assembling supply kits, and staying informed about threat levels.


  ### Common failure modes

  A common failure is the lack of awareness about the recommendations or incomplete
  implementation of the suggested activities, which can lead to inadequate preparedness.


  ### Safety/boundary notes

  Ensure that all preparedness activities are conducted safely and in accordance with
  local regulations and guidelines.


  ### Local adaptation notes

  Consider community-specific needs and resources when implementing these recommendations
  to ensure they are effective and relevant.'
