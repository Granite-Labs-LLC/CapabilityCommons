summary_short: A storm tide is the combined effect of a storm surge and the normal
  tide.
summary_medium: A storm tide results from the combination of a storm surge with the
  normal tide, leading to a higher water level than the mean sea level.
plain_language: When a storm pushes extra water onto the shore, it combines with the
  regular tide to create a storm tide, which is higher than usual water levels.
markdown_body: '### What this is

  A storm tide is the result of a storm surge combining with the normal tide. For
  example, if a storm surge raises the water level by 15 feet and the normal high
  tide is 2 feet, the storm tide would be 17 feet above the mean sea level.


  ### Why it matters

  Understanding storm tides is crucial for coastal areas as they can lead to significant
  flooding and damage. The increased water levels can impact infrastructure, homes,
  and ecosystems.


  ### What you need

  Knowledge of local tide patterns and storm surge predictions can help in preparing
  for potential storm tides.


  ### How to do it

  Monitor weather forecasts for storm surge warnings and compare them with local tide
  schedules to anticipate potential storm tide levels.


  ### Common failure modes

  Underestimating the impact of combined water levels can lead to inadequate preparation
  and increased risk of damage.


  ### Safety/boundary notes

  Always prioritize safety and evacuate if advised by local authorities during storm
  tide warnings.


  ### Local adaptation notes

  Consider local geographical features and historical data to better predict and prepare
  for storm tides in your area.'
