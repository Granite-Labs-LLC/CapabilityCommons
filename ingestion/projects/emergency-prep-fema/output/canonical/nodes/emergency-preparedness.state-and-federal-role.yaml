summary_short: Roles of state and federal governments in emergency management.
summary_medium: This section outlines the roles of state and federal governments in
  supporting local emergency management efforts, including resource provision and
  coordination.
plain_language: Learn how state and federal governments support local emergency management
  by providing resources and coordinating plans.
markdown_body: '### What this is

  This concept note explains the roles of state and federal governments in emergency
  preparedness, focusing on how they support local efforts.


  ### Why it matters

  Understanding these roles is crucial for effective emergency management, ensuring
  that local communities have the necessary support and resources during emergencies.


  ### What you need

  Awareness of local, state, and federal emergency management structures and the resources
  they provide.


  ### How to do it

  Local communities should identify hazards, enforce safety regulations, and coordinate
  emergency plans. When local resources are insufficient, they can request state assistance
  for additional resources and coordination. The federal government can further support
  with educational materials, financial grants, and technical assistance.


  ### Common failure modes

  Resource gaps and conflicting activities can occur if coordination between local,
  state, and federal levels is inadequate.


  ### Safety/boundary notes

  Ensure all actions comply with local and national safety regulations.


  ### Local adaptation notes

  Adapt strategies based on state-specific programs and the availability of federal
  assistance.'
structured_data:
  definition: The roles of state and federal governments in emergency preparedness
    involve providing supplemental resources and coordinating plans to support local
    efforts.
  key_questions:
  - What resources can the state provide to local communities during emergencies?
  - How does the federal government support state and local emergency management efforts?
  misconceptions:
  - The federal government always takes the lead in emergencies.
  - Local communities do not need to prepare if state and federal support is available.
