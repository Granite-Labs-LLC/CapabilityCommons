markdown_body: '# What this is

  This document outlines guidelines for sheltering during emergencies, providing essential
  steps to ensure safety and preparedness.


  # Why it matters

  Understanding how to properly shelter during emergencies can protect you and your
  family from harm and ensure you are prepared for various scenarios.


  # What you need

  Familiarity with your local emergency plans and access to basic supplies such as
  food, water, and first aid kits.


  # How to do it

  Review the detailed sheltering instructions in Section 1.4: Shelter. Ensure you
  have a designated safe area in your home or know the location of community shelters.
  Keep emergency supplies accessible.


  # Common failure modes

  Failing to prepare a shelter area in advance or not having necessary supplies on
  hand can lead to increased risk during an emergency.


  # Safety/boundary notes

  Always follow local authority instructions and evacuate if advised. Ensure your
  shelter area is structurally sound.


  # Local adaptation notes

  Adapt guidelines based on local climate, common natural disasters, and available
  resources.'
