summary_short: Understanding tsunamis and their impact on coastlines.
summary_medium: Overview of tsunamis, their causes, and potential impacts on coastlines,
  emphasizing the need for awareness and preparedness.
plain_language: Tsunamis are large waves caused by underwater disturbances like earthquakes.
  They can travel fast and cause significant damage when they hit the shore. It's
  important to be aware and prepared, especially if you live near the coast.
markdown_body: '# What this is

  Tsunamis are a series of large waves caused by underwater disturbances such as earthquakes,
  landslides, volcanic eruptions, or meteorites. They can travel at high speeds across
  the ocean and cause significant damage when they reach land.


  # Why it matters

  Tsunamis can be extremely destructive, impacting coastlines with little warning.
  Understanding their causes and potential impacts is crucial for preparedness and
  safety, especially for those living near the coast.


  # What you need

  Awareness of tsunami risks, understanding of local topography, and knowledge of
  evacuation routes and safety measures.


  # How to do it

  Stay informed about tsunami risks in your area, have an emergency plan, and know
  the signs of an impending tsunami such as a rapid receding of water from the shore.


  # Common failure modes

  Lack of warning systems, inadequate evacuation plans, and failure to recognize natural
  warning signs.


  # Safety/boundary notes

  Areas less than 25 feet above sea level and within a mile of the shore are at greater
  risk. Drowning is the most common cause of death in tsunamis.


  # Local adaptation notes

  Consider the specific topography of your coastline and proximity to the shoreline
  when planning for tsunamis.'
