markdown_body: '# What this is

  This is a set of guidelines to help individuals effectively contribute to disaster
  relief efforts through volunteering, donating money, and providing supplies.


  # Why it matters

  In the aftermath of a disaster, coordinated efforts are crucial to ensure that aid
  reaches those in need efficiently. Uncoordinated actions can overwhelm relief agencies
  and lead to wasted resources.


  # What you need

  A willingness to help, awareness of local needs, and the ability to follow instructions
  from recognized organizations.


  # How to do it

  1. Volunteer with local organizations by checking local news or contacting them
  directly. Avoid going to disaster areas unless specifically requested.

  2. If volunteering in a disaster area, bring your own food, water, and emergency
  supplies.

  3. Donate money to recognized disaster relief organizations to ensure funds are
  used effectively.

  4. Avoid unsolicited donations of items unless specifically requested by relief
  agencies.


  # Common failure modes

  Unsolicited donations can overwhelm agencies, and lack of coordination can lead
  to ineffective distribution of supplies.


  # Safety/boundary notes

  Ensure personal safety by not entering disaster areas unless requested and prepared.


  # Local adaptation notes

  Pay attention to local news and specific requests from organizations to tailor your
  help to current needs.'
