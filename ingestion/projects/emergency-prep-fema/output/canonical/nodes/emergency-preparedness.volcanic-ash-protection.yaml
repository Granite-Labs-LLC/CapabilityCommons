summary_short: Learn how to protect yourself from volcanic ash.
summary_medium: Understand the necessary protective measures during volcanic ash fall,
  including the use of masks, goggles, and protective clothing.
plain_language: This guide helps you prepare for and protect yourself during a volcanic
  ash fall, like the one experienced in Yakima after Mount St. Helens erupted.
markdown_body: "### What this is\nThis guide provides instructions on how to protect\
  \ yourself during a volcanic ash fall, focusing on personal protective equipment\
  \ and safety measures.\n\n### Why it matters\nVolcanic ash can cause respiratory\
  \ issues, reduce visibility, and create hazardous conditions. Proper protection\
  \ is essential to minimize health risks and ensure safety.\n\n### What you need\n\
  You will need protective masks, goggles, and protective clothing to shield yourself\
  \ from ash particles.\n\n### How to do it\n1. Wear a protective mask to prevent\
  \ inhaling ash particles. \n2. Use goggles to protect your eyes from irritation.\
  \ \n3. Wear long-sleeved clothing and cover as much skin as possible. \n4. Limit\
  \ outdoor exposure and ensure adequate lighting if visibility is reduced.\n\n###\
  \ Common failure modes\nFailing to use adequate protection can lead to respiratory\
  \ issues and visibility hazards.\n\n### Safety/boundary notes\nAvoid outdoor exposure\
  \ without proper protection. Ensure you have adequate lighting if ash fall reduces\
  \ visibility.\n\n### Local adaptation notes\nConsider the availability of protective\
  \ gear and community resources for ash cleanup in your area."
