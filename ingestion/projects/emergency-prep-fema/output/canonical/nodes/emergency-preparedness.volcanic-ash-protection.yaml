bundle_overrides:
  hook: Volcanic ash can pose serious health risks and visibility challenges—learn
    how to protect yourself effectively.
  primer: Volcanic ash is not just a nuisance; it can be a serious health hazard.
    When a volcano erupts, it can release ash into the atmosphere, which then falls
    to the ground. This ash is made up of tiny, abrasive particles that can cause
    respiratory issues, irritate the eyes, and reduce visibility. Protecting yourself
    during an ash fall is crucial to minimize these risks. Essential protective measures
    include wearing masks to prevent inhalation of ash particles, using goggles to
    shield your eyes, and wearing long-sleeved clothing to cover your skin. Limiting
    outdoor exposure and ensuring adequate lighting are also important if visibility
    is compromised. Understanding these protective steps can help you stay safe during
    a volcanic ash event.
  guide: '1. **Wear a Protective Mask**: Use a dust mask or hold a damp cloth over
    your nose and mouth to prevent inhaling ash particles. This is crucial for protecting
    your respiratory system.


    2. **Use Goggles**: Protect your eyes from irritation by wearing goggles. If you
    wear glasses, use them instead of contact lenses to avoid further eye irritation.


    3. **Wear Protective Clothing**: Dress in long-sleeved shirts and long pants to
    cover as much skin as possible. This helps prevent skin irritation from ash particles.


    4. **Limit Outdoor Exposure**: Stay indoors as much as possible to avoid direct
    contact with ash. If you must go outside, ensure you are fully protected.


    5. **Ensure Adequate Lighting**: Ash fall can significantly reduce visibility.
    Keep lights on during the day if necessary to maintain visibility indoors and
    outdoors.


    6. **Avoid Driving**: Driving in heavy ash fall can be dangerous due to reduced
    visibility and slippery roads. Only drive if absolutely necessary and with caution.'
  reference:
  - Wear a protective mask to prevent inhaling ash particles.
  - Use goggles to protect your eyes from irritation.
  - Wear long-sleeved clothing and cover as much skin as possible.
  - Limit outdoor exposure and ensure adequate lighting if visibility is reduced.
  - Avoid driving in heavy ash fall unless absolutely required.
  worksheet:
  - List the essential protective gear needed during a volcanic ash fall.
  - Describe the steps you would take to protect yourself if you were caught outside
    during an ash fall.
  - Explain why it is important to avoid wearing contact lenses during an ash fall.
  - Discuss the potential health risks associated with volcanic ash exposure.
  - Plan a checklist of items to have ready in case of a volcanic ash fall.
  teach_forward_kit:
    three_minute_version: Volcanic ash can cause serious health and visibility issues.
      Protect yourself by wearing a mask, goggles, and long-sleeved clothing. Stay
      indoors if possible and ensure good lighting if visibility is reduced.
    ten_minute_outline:
    - Introduction to volcanic ash and its hazards
    - Importance of protective measures
    - Detailed steps for personal protection
    - Discussion on visibility and safety
    - Q&A session
    discussion_prompts:
    - What are the most important protective measures during a volcanic ash fall?
    - How can communities prepare for a volcanic ash event?
    - What challenges might arise in ensuring everyone has access to protective gear?
