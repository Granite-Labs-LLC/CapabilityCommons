plain_language: Learn how to use the FEMA guide to prepare for disasters effectively,
  with advice on consulting local resources.
markdown_body: '### What this is

  This is a reference sheet on how to effectively use the FEMA guide, ''Are You Ready?'',
  for disaster preparation.


  ### Why it matters

  Using the FEMA guide helps individuals and communities prepare for, respond to,
  and recover from disasters. It provides structured advice that, when combined with
  local information, enhances preparedness.


  ### What you need

  To use the guide effectively, you need the FEMA guide itself and access to local
  emergency management instructions and Red Cross information.


  ### How to do it

  Follow the step-by-step advice in the FEMA guide. Supplement this with information
  from your local emergency management offices and the American Red Cross to ensure
  comprehensive preparedness.


  ### Common failure modes

  Common mistakes include not using the guide at all or ignoring local emergency instructions,
  which can lead to inadequate preparation.


  ### Safety/boundary notes

  Ensure that all advice is adapted to local conditions and regulations to maintain
  safety.


  ### Local adaptation notes

  Consult local emergency management offices to adapt the general advice in the guide
  to specific local needs and conditions.'
