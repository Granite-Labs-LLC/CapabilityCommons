summary_short: Prepare for floods by elevating utilities, installing check valves,
  and constructing barriers.
summary_medium: Learn how to prepare for floods by avoiding construction in floodplains,
  elevating utilities, installing check valves, constructing barriers, and sealing
  walls.
plain_language: This guide helps you prepare for floods by taking measures like elevating
  your home's utilities, installing check valves to prevent water backup, and building
  barriers to keep floodwaters out.
markdown_body: '# What this is

  This guide provides steps to prepare your home and family for potential flooding,
  focusing on preventive measures to minimize damage.


  # Why it matters

  Floods can cause significant damage to homes and infrastructure. Preparing in advance
  can reduce the impact and ensure safety.


  # What you need

  Check valves, waterproofing compounds, materials for constructing barriers like
  levees or floodwalls.


  # How to do it

  1. Avoid building in flood-prone areas unless you can elevate and reinforce your
  home.

  2. Elevate the furnace, water heater, and electric panel to prevent flood damage.

  3. Install check valves in sewer traps to prevent floodwater from backing up into
  your home.

  4. Construct barriers such as levees or floodwalls to stop floodwater from entering
  your building.

  5. Seal basement walls with waterproofing compounds to prevent seepage.


  # Common failure modes

  Floodwater can back up into drains if check valves are not installed. Seepage can
  occur if walls are not properly sealed.


  # Safety/boundary notes

  Do not walk or drive through moving water. Six inches of moving water can knock
  you down, and cars can be swept away.


  # Local adaptation notes

  Consider local flood risks and adapt measures accordingly, such as using materials
  suitable for your climate.'
