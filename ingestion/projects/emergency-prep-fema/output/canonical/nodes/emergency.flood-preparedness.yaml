bundle_overrides:
  hook: Floods can cause devastating damage, but with the right preparation, you can
    protect your home and ensure your family's safety.
  primer: Flood preparedness is essential for minimizing the damage caused by floods,
    which are among the most common and destructive natural disasters. Floods can
    occur due to heavy rainfall, storm surges, or overflowing rivers, and they can
    lead to significant property damage and even loss of life. Preparing for floods
    involves taking proactive measures to protect your home and ensure the safety
    of your family. Key steps include avoiding construction in flood-prone areas unless
    you can elevate and reinforce your home, elevating utilities like furnaces and
    water heaters, installing check valves to prevent water backup, constructing barriers
    such as levees or floodwalls, and sealing basement walls with waterproofing compounds.
    Additionally, it's crucial to avoid walking or driving through moving water, as
    even six inches can knock you down, and cars can be swept away. By understanding
    these preventive measures, you can reduce the impact of floods and enhance your
    resilience against such events.
  guide: '1. **Avoid Building in Flood-Prone Areas**: If possible, choose to build
    your home outside of floodplains. If you must build in such areas, ensure your
    home is elevated and reinforced to withstand potential flooding.


    2. **Elevate Utilities**: Raise your furnace, water heater, and electric panel
    above the expected flood level. This prevents costly damage and ensures these
    essential systems remain operational during a flood.


    3. **Install Check Valves**: Place check valves in sewer traps to prevent floodwater
    from backing up into your home. This simple installation can save you from significant
    water damage and sewage issues.


    4. **Construct Barriers**: Build barriers like levees or floodwalls around your
    property to stop floodwater from entering. Use materials that are suitable for
    your local climate and conditions.


    5. **Seal Basement Walls**: Apply waterproofing compounds to basement walls to
    prevent water seepage. Proper sealing is crucial to maintaining the integrity
    of your home''s foundation.


    6. **Safety Precautions**: Never walk or drive through moving water. Even a small
    amount of moving water can be dangerous, potentially knocking you down or sweeping
    your vehicle away.


    By following these steps, you can significantly reduce the risk of flood damage
    to your home and ensure the safety of your family.'
  reference:
  - Avoid building in flood-prone areas unless elevated and reinforced.
  - Elevate furnace, water heater, and electric panel.
  - Install check valves in sewer traps.
  - Construct barriers like levees or floodwalls.
  - Seal basement walls with waterproofing compounds.
  - Do not walk or drive through moving water.
  worksheet:
  - Identify if your home is in a flood-prone area and list potential elevation solutions.
  - Create a plan to elevate utilities in your home.
  - Research and list local suppliers for check valves and waterproofing compounds.
  - Design a simple barrier plan for your property using available materials.
  - Inspect your basement walls and note areas that need sealing.
  - Simulate a flood evacuation plan with your family.
