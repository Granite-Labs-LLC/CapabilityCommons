markdown_body: '### What this is

  The U.S. Geological Survey''s Volcano Hazards Program is a resource that provides
  updates on volcanic activity, feature stories, and information about volcano hazards.


  ### Why it matters

  Understanding volcanic activity and hazards is crucial for public safety and preparedness,
  especially for communities living near active volcanoes.


  ### What you need

  Access to the internet to visit the USGS Volcano Hazards Program website.


  ### How to do it

  Visit the USGS Volcano Hazards Program website at http://volcanoes.usgs.gov to access
  the latest updates and resources on volcanic activity.


  ### Common failure modes

  Not regularly checking for updates can lead to missing important information about
  volcanic activity.


  ### Safety/boundary notes

  Ensure that you follow any safety guidelines provided by local authorities in the
  event of volcanic activity.


  ### Local adaptation notes

  Local communities should adapt the information provided to their specific needs
  and circumstances, especially if they are in proximity to active volcanoes.'
