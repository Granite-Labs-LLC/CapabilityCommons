bundle_overrides:
  hook: Earthquake preparedness can significantly reduce the risk of injury and damage
    to your home, ensuring the safety of your loved ones.
  primer: Earthquakes are natural disasters that can strike without warning, causing
    significant damage to buildings and posing serious risks to personal safety. Preparing
    for an earthquake involves taking proactive steps to secure your home and educate
    your family on safety measures. Key actions include repairing defective electrical
    wiring and leaky gas lines, securing heavy appliances like water heaters and refrigerators,
    and placing heavy objects on lower shelves. Additionally, installing flexible
    pipe fittings can prevent leaks during an earthquake. Conducting regular earthquake
    drills with your family, practicing the 'Drop, Cover, and Hold On' technique,
    is crucial for ensuring everyone knows what to do when an earthquake occurs. By
    taking these steps, you can minimize the risks associated with earthquakes and
    protect your home and family.
  guide: '1. **Repair Utilities**: Begin by inspecting your home for defective electrical
    wiring and leaky gas lines. These can pose significant hazards during an earthquake.
    Hire a professional to repair any issues you find, as working with gas or electrical
    lines yourself can be dangerous.


    2. **Secure Heavy Appliances**: Use bolts to secure heavy appliances such as water
    heaters, refrigerators, and furnaces to wall studs. This prevents them from tipping
    over during an earthquake, reducing the risk of injury and damage.


    3. **Organize Shelves**: Place heavy objects on lower shelves to prevent them
    from falling. Fasten shelves, mirrors, and large picture frames securely to the
    walls to keep them in place during tremors.


    4. **Install Flexible Pipe Fittings**: Replace rigid pipe fittings with flexible
    ones to reduce the risk of gas or water leaks. Flexible fittings are more resistant
    to breakage during an earthquake.


    5. **Conduct Earthquake Drills**: Regularly practice earthquake drills with your
    family. The ''Drop, Cover, and Hold On'' technique involves dropping to the ground,
    taking cover under sturdy furniture, and holding on until the shaking stops. Ensure
    everyone knows safe spots in each room of your home.


    By following these steps, you can create a safer environment in your home and
    be better prepared for an earthquake.'
