markdown_body: '### What this is

  This guide provides steps to prepare your home and family for an earthquake, focusing
  on securing objects, repairing utilities, and conducting safety drills.


  ### Why it matters

  Earthquakes can cause significant damage and injury. Proper preparation can minimize
  risks to your home and loved ones.


  ### What you need

  - Bolts

  - Flexible pipe fittings

  - Professional help for utility repairs


  ### How to do it

  1. Repair defective electrical wiring and leaky gas lines with professional help.

  2. Secure heavy appliances like water heaters and refrigerators to wall studs.

  3. Place heavy objects on lower shelves and fasten shelves and frames to walls.

  4. Install flexible pipe fittings to prevent leaks.

  5. Conduct regular earthquake drills with your family, practicing ''Drop, Cover,
  and Hold On''.


  ### Common failure modes

  - Gas leaks

  - Falling objects

  - Unsecured heavy items


  ### Safety/boundary notes

  Do not attempt to repair gas or electrical lines yourself; seek professional assistance.


  ### Local adaptation notes

  Consider local building codes and recommendations from local authorities for additional
  safety measures.'
