summary_short: Guidelines for preparing for a hurricane, including securing property
  and evacuation criteria.
summary_medium: This reference sheet provides essential guidelines for hurricane preparedness,
  including securing your home, managing utilities, and understanding when to evacuate.
plain_language: Learn how to prepare for a hurricane by securing your home, managing
  utilities, and knowing when to evacuate.
markdown_body: "### What this is\nThis is a guide to help you prepare for a hurricane\
  \ by securing your home, managing utilities, and understanding evacuation criteria.\n\
  \n### Why it matters\nProper preparation can protect your property and ensure your\
  \ safety during a hurricane, reducing the risk of injury or damage.\n\n### What\
  \ you need\nYou will need access to a radio or TV for updates, storm shutters, water\
  \ containers, and a plan for securing outdoor objects.\n\n### How to do it\n1. Listen\
  \ to the radio or TV for updates. \n2. Secure your home by closing storm shutters\
  \ and bringing outdoor objects indoors. \n3. Turn off utilities if instructed, and\
  \ set your refrigerator to the coldest setting. \n4. Moor your boat if time permits.\
  \ \n5. Fill bathtubs and large containers with water for sanitation. \n6. Evacuate\
  \ if directed by authorities or if you live in a vulnerable area.\n\n### Common\
  \ failure modes\nFailing to secure outdoor objects, ignoring evacuation orders,\
  \ and staying in unsafe structures can lead to increased risk during a hurricane.\n\
  \n### Safety/boundary notes\nStay indoors during the hurricane, avoid windows and\
  \ glass doors, and take refuge in a small interior room if necessary.\n\n### Local\
  \ adaptation notes\nFollow instructions from local authorities and be aware of specific\
  \ evacuation routes in your area."
