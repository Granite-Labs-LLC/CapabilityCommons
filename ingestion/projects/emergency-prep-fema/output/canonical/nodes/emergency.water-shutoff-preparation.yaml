bundle_overrides:
  hook: Knowing how to shut off your home's water supply in an emergency can prevent
    costly water damage and ensure your family's safety.
  primer: In an emergency, such as a burst pipe or natural disaster, being able to
    quickly shut off your home's water supply is crucial. The main water shut-off
    valve is a key component in this process. It is typically located where the main
    water line enters your home. Ensuring that this valve is functional and easily
    accessible can save you from significant water damage and other hazards. Regular
    maintenance, such as checking for rust or partial closure, is necessary to ensure
    the valve works when needed. Additionally, labeling the valve and informing all
    household members of its location and operation are essential steps in emergency
    preparedness. This guide will walk you through the process of locating, testing,
    and labeling your water shut-off valve.
  guide: '1. **Locate the Shut-Off Valve**: Find the main water shut-off valve in
    your home. It is usually located where the main water line enters the house, such
    as in the basement, crawl space, or utility area.


    2. **Test the Valve**: Turn the valve to ensure it can be completely shut off.
    If the valve is rusted open or only partially closes, it may not function properly
    in an emergency. If necessary, replace the valve to ensure it can fully stop the
    water flow.


    3. **Label the Valve**: Use a valve tag to label the shut-off valve clearly. This
    will help you and others identify it quickly during an emergency.


    4. **Inform Household Members**: Make sure all household members know the location
    of the shut-off valve and how to operate it. Conduct a brief demonstration if
    needed.


    5. **Regular Maintenance**: Periodically check the valve to ensure it remains
    operable and free of rust or other obstructions. Regular checks will help ensure
    that the valve is ready to function when needed.'
  reference:
  - Locate the main water shut-off valve.
  - Check valve functionality regularly.
  - Label the valve for easy identification.
  - Inform all household members about the valve's location and operation.
  - Replace the valve if it is rusted or does not close fully.
  worksheet:
