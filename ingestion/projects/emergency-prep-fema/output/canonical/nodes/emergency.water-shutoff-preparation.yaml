markdown_body: '### What this is

  This guide provides steps to prepare for shutting off your home''s water supply
  in an emergency.


  ### Why it matters

  Being able to quickly shut off your water supply can prevent water damage and other
  hazards during emergencies.


  ### What you need

  A valve tag for labeling the shut-off valve.


  ### How to do it

  1. Locate the shut-off valve for the main water line entering your house.

  2. Check that the valve can be completely shut off; replace it if it''s rusted or
  doesn''t close fully.

  3. Label the valve with a tag for easy identification.

  4. Ensure all household members know the valve''s location and how to operate it.


  ### Common failure modes

  The valve may be rusted open or only partially close, preventing effective shut-off.


  ### Safety/boundary notes

  Ensure the valve is accessible and operable by all responsible household members.


  ### Local adaptation notes

  Consider local plumbing codes and practices when replacing or maintaining the valve.'
