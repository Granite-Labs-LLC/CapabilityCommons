markdown_body: '### What this is

  This is a guide on preparing to shut off electricity in your home during an emergency
  situation.


  ### Why it matters

  In emergencies, such as a natural gas leak, electrical sparks can ignite the gas,
  leading to fires or explosions. Knowing how to shut off electricity can prevent
  such hazards.


  ### What you need

  You need to know the location of your home''s main electrical shut-off switch and
  ensure it is accessible.


  ### How to do it

  1. Locate your home''s main electrical shut-off switch.

  2. Ensure all responsible household members know where it is and how to operate
  it.

  3. Practice turning it off and on to ensure it works properly.


  ### Common failure modes

  Failing to locate the main switch, not ensuring all household members are informed,
  or having a malfunctioning switch.


  ### Safety/boundary notes

  Avoid creating sparks near potential gas leaks. Ensure the area is safe before operating
  the switch.


  ### Local adaptation notes

  Consider local building codes and regulations regarding electrical systems.'
