bundle_overrides:
  hook: Knowing how to shut off your home's electricity in an emergency can prevent
    fires or explosions caused by gas leaks.
  primer: In emergency situations, such as a natural gas leak, electrical sparks can
    ignite the gas, leading to potentially dangerous fires or explosions. This makes
    it crucial to know how to quickly and safely shut off your home's electricity.
    The main electrical shut-off switch is a critical component in your home that
    allows you to cut off power to the entire house. It's important for all responsible
    household members to know the location of this switch and how to operate it. Practicing
    the shut-off procedure ensures that everyone is prepared and that the switch functions
    properly. Additionally, safety precautions must be taken to avoid creating sparks
    near potential gas leaks. This guide will help you understand the steps necessary
    to prepare for such emergencies, ensuring the safety of your household.
  guide: '1. **Locate the Main Electrical Shut-off Switch**: Find the main electrical
    shut-off switch in your home. This is usually located in the circuit breaker box
    or fuse box. Make sure it is easily accessible and not blocked by any objects.


    2. **Educate Household Members**: Ensure that all responsible members of your
    household know where the main shut-off switch is located. Explain the importance
    of being able to shut off the electricity in an emergency.


    3. **Practice the Shut-off Procedure**: Regularly practice turning the switch
    off and on to ensure it works properly. This will also help household members
    become familiar with the process.


    4. **Safety Precautions**: Before operating the switch, ensure that there are
    no gas leaks present. Avoid creating sparks, which can ignite leaking gas. If
    you suspect a gas leak, evacuate the area and contact emergency services.


    5. **Coordinate with Building Management**: If you live in an apartment building,
    coordinate with building management to ensure you have access to the main electrical
    controls.


    6. **Regular Checks**: Periodically check the switch for any signs of damage or
    malfunction. If the switch is not functioning properly, contact a professional
    electrician for repairs.'
