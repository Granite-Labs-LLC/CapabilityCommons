bundle_overrides:
  hook: HEPA filters can significantly enhance air safety during biological attacks
    by removing harmful agents from the air.
  primer: HEPA (High Efficiency Particulate Air) filters are designed to capture particles
    as small as 0.3 microns, making them effective at removing most biological agents
    from the air. During a biological attack, the air can become contaminated with
    harmful agents that pose health risks. By using HEPA filters, you can reduce the
    concentration of these agents in your home, creating a safer environment. HEPA
    filters can be integrated into central heating and cooling systems or used as
    portable units. It's important to note that while HEPA filters are effective against
    biological agents, they do not filter out chemical agents. Therefore, they should
    be used as part of a broader emergency preparedness plan.
  guide: '1. **Identify Your System**: Determine if your home has a central heating
    and cooling system with a HEPA filter or if you need a portable HEPA filter.


    2. **Central System Usage**: If you have a central system with a HEPA filter,
    ensure it is running. If it''s not running, turn on the fan to circulate air through
    the filter. This helps to continuously remove biological agents from the air.


    3. **Portable HEPA Filter Usage**: If you do not have a central system, use a
    portable HEPA filter. Place it in the room where you will be sheltering during
    a biological attack. Turn it on to start filtering the air.


    4. **Monitor Air Quality**: Regularly check the air quality in your home. If you
    notice any issues or if the HEPA filter is not functioning properly, take corrective
    action immediately.


    5. **Maintenance**: Regularly replace or clean the HEPA filter according to the
    manufacturer''s instructions to ensure it remains effective.


    6. **Limitations**: Remember that HEPA filters do not filter chemical agents.
    They should be used in conjunction with other safety measures during a biological
    attack.'
