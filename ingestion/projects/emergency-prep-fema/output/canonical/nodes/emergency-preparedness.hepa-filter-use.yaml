  and portable HEPA filters.
markdown_body: '### What this is

  This guide provides instructions on using HEPA filters to improve air quality during
  biological attacks.


  ### Why it matters

  HEPA filters can help remove biological agents from the air, providing a safer environment
  during a biological attack.


  ### What you need

  A central heating and cooling system with a HEPA filter or a portable HEPA filter.


  ### How to do it

  If you have a central system with a HEPA filter, keep it running or turn on the
  fan. If using a portable HEPA filter, take it to your shelter room and turn it on.


  ### Common failure modes

  HEPA filters do not filter chemical agents.


  ### Safety/boundary notes

  HEPA filters are effective for biological agents but not for chemical threats.


  ### Local adaptation notes

  Ensure the availability of a central heating and cooling system or a portable HEPA
  filter.'
