bundle_overrides:
  hook: In emergency situations, distillation can be a lifesaver by turning contaminated
    water into safe drinking water.
  primer: Distillation is a water purification method that involves boiling water
    and collecting the vapor. This process effectively removes impurities such as
    microbes, heavy metals, and salts, which are often present in contaminated water
    sources. Distillation is particularly useful in emergency situations where other
    purification methods may not be effective. The basic setup requires a pot, a cup,
    and a lid. By boiling the water, the impurities are left behind, and the vapor
    that condenses is collected as purified water. This method is simple yet effective,
    making it a valuable skill to have in situations where clean water is not readily
    available.
  guide: "To distill water, follow these steps: \n1. Gather your materials: a pot,\
    \ a cup, and a lid that fits the pot. \n2. Fill the pot halfway with water. \n\
    3. Tie the cup to the handle of the pot's lid so that the cup hangs right-side-up\
    \ when the lid is placed upside-down. Ensure the cup does not touch the water.\
    \ \n4. Place the lid on the pot upside-down, ensuring the cup is positioned to\
    \ catch the distilled water. \n5. Boil the water for 20 minutes. During this time,\
    \ the water will evaporate, and the vapor will condense on the lid, dripping into\
    \ the cup. \n6. After 20 minutes, carefully remove the cup and allow it to cool.\
    \ The water collected in the cup is now distilled and safe to drink. \nRemember\
    \ to handle boiling water with care to avoid burns, and ensure the cup is not\
    \ dangling into the water to achieve proper distillation."
