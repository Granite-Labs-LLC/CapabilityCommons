plain_language: This guide teaches you how to purify water by distillation, which
  removes germs, heavy metals, salts, and other impurities.
markdown_body: '### What this is

  Distillation is a method of purifying water by boiling it and collecting the vapor,
  which leaves behind impurities.


  ### Why it matters

  Distillation is crucial in emergency situations where water may be contaminated
  with microbes, heavy metals, or salts that other purification methods cannot remove.


  ### What you need

  You will need a pot, a cup, and a lid that fits the pot.


  ### How to do it

  1. Fill a pot halfway with water.

  2. Tie a cup to the handle on the pot''s lid so that the cup hangs right-side-up
  when the lid is upside-down. Ensure the cup does not touch the water.

  3. Boil the water for 20 minutes.

  4. Collect the distilled water that drips from the lid into the cup.


  ### Common failure modes

  Ensure the cup is not dangling into the water, and boil the water for the full 20
  minutes to ensure proper distillation.


  ### Safety/boundary notes

  Be cautious when handling boiling water to avoid burns.


  ### Local adaptation notes

  Consider the availability of pots and cups and the specific impurities in local
  water sources.'
