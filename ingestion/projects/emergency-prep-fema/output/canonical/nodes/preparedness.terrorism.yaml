markdown_body: '### What this is

  This module provides guidance on preparing for terrorism-related incidents. It includes
  information on various threats such as explosions, biological and chemical threats,
  nuclear blasts, and radiological dispersion devices.


  ### Why it matters

  Understanding how to prepare for terrorism-related incidents can significantly reduce
  the risk of harm and increase your ability to respond effectively in such situations.


  ### What you need

  Awareness of potential threats, a disaster supplies kit, and a well-practiced emergency
  plan.


  ### How to do it

  1. Stay informed about potential threats in your area. 2. Assemble a disaster supplies
  kit with essentials like water, food, and medical supplies. 3. Develop and practice
  an emergency plan with your family or household. 4. Learn specific actions to take
  for different types of threats, such as seeking shelter during a nuclear blast or
  avoiding contaminated areas during a chemical threat.


  ### Common failure modes

  Failing to stay informed about current threats, not having a disaster supplies kit
  ready, and not practicing emergency plans regularly.


  ### Safety/boundary notes

  Always prioritize personal safety and follow official guidance during any terrorism-related
  incident.


  ### Local adaptation notes

  Adapt your emergency plan and supplies kit based on local threats and available
  resources.'
