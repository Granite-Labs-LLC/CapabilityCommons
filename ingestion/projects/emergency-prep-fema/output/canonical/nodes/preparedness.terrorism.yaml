bundle_overrides:
  hook: Being prepared for terrorism-related incidents can save lives and reduce panic
    during emergencies.
  primer: Terrorism-related incidents, such as explosions, biological and chemical
    threats, nuclear blasts, and radiological dispersion devices, pose significant
    risks to public safety. Understanding how to prepare for these events can greatly
    reduce the risk of harm and improve your ability to respond effectively. Preparation
    involves staying informed about potential threats, assembling a disaster supplies
    kit, and developing a well-practiced emergency plan. Staying informed means being
    aware of the types of threats that could occur in your area and understanding
    the recommended actions to take. A disaster supplies kit should include essentials
    like water, food, and medical supplies, ensuring you have what you need to survive
    for at least 72 hours. Practicing your emergency plan with family or household
    members ensures everyone knows what to do in case of an incident. By taking these
    steps, you can increase your resilience and safety during terrorism-related emergencies.
  guide: '1. **Stay Informed**: Regularly check local news and official sources for
    updates on potential threats in your area. Sign up for alerts from local emergency
    services if available.


    2. **Assemble a Disaster Supplies Kit**: Gather essential items such as water,
    non-perishable food, a first-aid kit, flashlights, batteries, and any necessary
    medications. Ensure the kit is easily accessible and check it regularly to replace
    expired items.


    3. **Develop an Emergency Plan**: Create a plan that includes evacuation routes,
    communication methods, and meeting points for your family or household. Ensure
    everyone understands their role and responsibilities.


    4. **Practice Your Plan**: Conduct regular drills to practice your emergency plan.
    This helps identify any gaps or areas for improvement and ensures everyone knows
    what to do in an emergency.


    5. **Learn Specific Actions for Different Threats**: Educate yourself on the specific
    actions to take for various threats. For example, seek shelter during a nuclear
    blast or avoid contaminated areas during a chemical threat.


    6. **Adapt Your Plan**: Tailor your emergency plan and supplies kit based on local
    threats and available resources. Consider factors such as your location, family
    needs, and any specific vulnerabilities.'
  reference:
  - Stay informed about potential threats.
  - Assemble a disaster supplies kit.
  - Develop and practice an emergency plan.
  - Learn specific actions for different threats.
  - Adapt your plan based on local threats.
  worksheet:
  - List the types of terrorism-related threats that could occur in your area.
  - Create a checklist of items for your disaster supplies kit.
  - Draft an emergency plan for your household, including evacuation routes and communication
    methods.
  - Conduct a practice drill of your emergency plan and note any areas for improvement.
  - Research specific actions to take for different types of threats and write them
    down.
  teach_forward_kit:
    three_minute_version: Being prepared for terrorism-related incidents involves
      staying informed, having a disaster supplies kit, and practicing an emergency
      plan. These steps can reduce harm and improve response effectiveness.
    ten_minute_outline:
    - Introduction to terrorism-related threats.
    - Importance of preparedness.
    - Steps to stay informed about threats.
    - How to assemble a disaster supplies kit.
    - Developing and practicing an emergency plan.
    - Adapting plans based on local threats.
    discussion_prompts:
    - Why is it important to stay informed about potential threats?
    - What items are essential in a disaster supplies kit?
    - How can practicing an emergency plan benefit your household?
    - What challenges might you face when adapting your plan to local threats?
