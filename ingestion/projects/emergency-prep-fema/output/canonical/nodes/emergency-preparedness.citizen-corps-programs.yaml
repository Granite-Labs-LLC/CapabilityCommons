plain_language: Citizen Corps programs help make communities safer by offering education,
  training, and volunteer opportunities. These programs include Neighborhood Watch,
  CERT, and Medical Reserve Corps.
markdown_body: '### What this is

  Citizen Corps is a national initiative that provides opportunities for individuals
  to participate in programs that enhance the safety of their families, homes, and
  communities. It includes programs like Neighborhood Watch, CERT, and Medical Reserve
  Corps.


  ### Why it matters

  Participating in Citizen Corps programs helps communities become better prepared
  for emergencies, reducing the risks from crime, terrorism, public health issues,
  and disasters.


  ### What you need

  To get involved, you need to connect with your local Citizen Corps Council, which
  coordinates these programs and provides necessary training and resources.


  ### How to do it

  Join a local Citizen Corps program by visiting their website or contacting your
  local council. Participate in training sessions and volunteer opportunities to support
  community safety efforts.


  ### Common failure modes

  Lack of participation or engagement from community members can limit the effectiveness
  of these programs.


  ### Safety/boundary notes

  Ensure that all activities are coordinated with local emergency services to maintain
  safety and effectiveness.


  ### Local adaptation notes

  Programs should be integrated with local emergency services and tailored to meet
  the specific needs of the community.'
