bundle_overrides:
  hook: Citizen Corps programs empower you to actively contribute to your community's
    safety, making it a safer place for everyone.
  primer: Citizen Corps is a national initiative designed to enhance community safety
    by involving citizens in various programs. These programs include Neighborhood
    Watch, Community Emergency Response Teams (CERT), and the Medical Reserve Corps.
    By participating, individuals can help reduce risks associated with crime, terrorism,
    public health issues, and disasters. The initiative is managed locally by Citizen
    Corps Councils, which coordinate with law enforcement, emergency services, and
    other community stakeholders to provide necessary training and resources. Engaging
    in these programs not only helps protect your family and home but also strengthens
    the community's overall preparedness for emergencies. Participation is crucial,
    as the effectiveness of these programs largely depends on community involvement.
  guide: To get involved with Citizen Corps programs, start by visiting the Citizen
    Corps website or contacting your local Citizen Corps Council. These councils are
    responsible for organizing and coordinating the programs in your area. They bring
    together leaders from various sectors, including law enforcement, emergency services,
    and volunteer organizations. Once you have identified your local council, express
    your interest in participating. They will provide you with information on available
    programs, training sessions, and volunteer opportunities. For example, you might
    join a Neighborhood Watch group to help monitor and report suspicious activities
    in your area, or participate in CERT training to learn basic disaster response
    skills. The Medical Reserve Corps offers opportunities for those with medical
    backgrounds to assist in public health emergencies. Remember, active participation
    is key to the success of these programs, so engage with your community and encourage
    others to join as well. By doing so, you contribute to a safer, more resilient
    community.
  reference:
  - 'Citizen Corps website: www.citizencorps.gov'
  - Local Citizen Corps Council contact
  - Programs include Neighborhood Watch, CERT, Medical Reserve Corps
  - Training and volunteer opportunities available
  - Community involvement is crucial for effectiveness
  worksheet:
  - Identify your local Citizen Corps Council and note their contact information.
  - List three Citizen Corps programs available in your community.
  - Attend a training session for one of the programs and summarize what you learned.
  - Volunteer for a community safety event and describe your experience.
  - Discuss with a neighbor or friend about joining a Citizen Corps program together.
  teach_forward_kit:
    three_minute_version: Citizen Corps programs offer a way for individuals to enhance
      their community's safety through education, training, and volunteering. By joining
      programs like Neighborhood Watch, CERT, and Medical Reserve Corps, you can help
      reduce risks from crime, terrorism, and disasters. Get involved by contacting
      your local Citizen Corps Council.
    ten_minute_outline:
