markdown_body: '# What this is

  This is a knowledge check designed to test your understanding of the appropriate
  actions to take during an earthquake based on your location.


  # Why it matters

  Knowing the correct actions to take during an earthquake can significantly reduce
  the risk of injury and increase your safety.


  # What you need

  You need to understand the basic principles of earthquake safety and how to apply
  them in different scenarios.


  # How to do it

  For each question, choose the best action to take during an earthquake based on
  the location described. Compare your answers with the provided answer key to assess
  your knowledge.


  # Common failure modes

  A common mistake is choosing unsafe locations, such as standing by windows or running
  outside during an earthquake.


  # Safety/boundary notes

  Always prioritize your safety by staying away from windows, exterior walls, and
  heavy objects that might fall.


  # Local adaptation notes

  Consider local building codes and structures, as they may influence the safest actions
  during an earthquake.'
