bundle_overrides:
  hook: Handling hazardous materials safely is crucial to prevent health risks and
    environmental damage—learn how to do it right.
  primer: Hazardous materials are substances that can pose a risk to health, safety,
    or the environment. These materials are commonly found in households and workplaces,
    including cleaning products, paints, and pesticides. Proper handling of these
    materials is essential to prevent accidents, health issues, and environmental
    harm. Identifying hazardous materials involves reading labels and safety data
    sheets, which provide information on the potential risks and safe handling practices.
    It's important to store these materials in their original containers unless they
    are corroding, and never in food containers to avoid contamination. Mixing chemicals
    can lead to dangerous reactions, so it should be avoided. Disposal of hazardous
    waste should be done through local collection programs to ensure it is handled
    safely. Immediate cleanup of spills using rags and avoiding smoking near hazardous
    materials are also critical safety measures. By following these guidelines, you
    can minimize risks associated with hazardous materials.
  guide: '1. **Identify Hazardous Materials**: Start by reading the labels and safety
    data sheets of products to understand their hazards. Look for symbols and warnings
    that indicate the material is hazardous.


    2. **Follow Instructions**: Always adhere to the manufacturer''s instructions
    for storage, use, and disposal. This ensures that you are handling the materials
    as intended and minimizing risks.


    3. **Proper Storage**: Keep hazardous materials in their original containers unless
    they are corroding. This helps prevent leaks and ensures that the labels remain
    intact for future reference.


    4. **Avoid Food Containers**: Never transfer hazardous materials into food containers.
    This prevents accidental ingestion and contamination.


    5. **Do Not Mix Chemicals**: Mixing different chemicals can result in dangerous
    reactions. Always keep chemicals separate unless you are certain they can be safely
    combined.


    6. **Dispose Safely**: Use local hazardous waste collection programs for disposal.
    These programs are designed to handle hazardous waste safely and prevent environmental
    contamination.


    7. **Immediate Spill Cleanup**: If a spill occurs, clean it up immediately using
    rags. This prevents the spread of hazardous materials and reduces the risk of
    accidents.


    8. **No Smoking**: Avoid smoking near hazardous materials to prevent fires and
    explosions.


    By following these steps, you can handle hazardous materials safely and reduce
    the risk of accidents.'
