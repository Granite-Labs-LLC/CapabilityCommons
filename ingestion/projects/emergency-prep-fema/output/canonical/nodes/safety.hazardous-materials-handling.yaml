  - Dispose of hazardous waste through local collection programs.
  - Clean up spills immediately using rags.
  - Do not smoke near hazardous materials.
  - Stay at least one-half mile away from large spills.
  worksheet:
  - List five common household hazardous materials and their potential risks.
  - Read the label of a cleaning product and identify any hazard symbols.
  - Practice storing a hazardous material in its original container and explain why
    this is important.
  - Research local hazardous waste collection programs and note their operating hours.
  - Simulate a spill cleanup using water and rags, and describe the steps taken.
  - Discuss why mixing certain household chemicals can be dangerous.
  teach_forward_kit:
    three_minute_version: Handling hazardous materials safely involves identifying
      them through labels, storing them properly, and disposing of them via local
      programs. Avoid mixing chemicals and clean spills immediately to prevent accidents.
    ten_minute_outline:
