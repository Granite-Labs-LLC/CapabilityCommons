markdown_body: '### What this is

  This guide provides essential practices for safely handling hazardous materials,
  including identification, storage, and disposal.


  ### Why it matters

  Improper handling of hazardous materials can lead to serious health risks, environmental
  damage, and accidents. Following these guidelines helps prevent such outcomes.


  ### What you need

  Original containers for storage, rags for spill cleanup, and access to local hazardous
  waste collection programs.


  ### How to do it

  1. Identify hazardous materials by reading labels and safety data sheets.

  2. Follow manufacturer''s instructions for storage, use, and disposal.

  3. Store materials in their original containers unless they are corroding.

  4. Never store hazardous products in food containers.

  5. Avoid mixing chemicals to prevent dangerous reactions.

  6. Dispose of hazardous waste through local collection programs.

  7. Clean up spills immediately using rags.

  8. Do not smoke near hazardous materials.


  ### Common failure modes

  Mixing incompatible chemicals, improper storage leading to leaks, and using food
  containers for storage.


  ### Safety/boundary notes

  Do not smoke near chemicals and avoid contact with spills. Stay at least one-half
  mile away from large spills.


  ### Local adaptation notes

  Check for the availability of local hazardous waste collection programs.'
