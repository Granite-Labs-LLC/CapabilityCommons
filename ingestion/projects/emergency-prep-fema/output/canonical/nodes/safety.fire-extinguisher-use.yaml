bundle_overrides:
  hook: Knowing how to use a fire extinguisher can stop a small fire from turning
    into a disaster, ensuring safety for you and those around you.
  primer: A fire extinguisher is a crucial safety tool that can prevent small fires
    from escalating into dangerous situations. In homes and workplaces, having an
    ABC type fire extinguisher is recommended because it is suitable for most types
    of fires you might encounter. The ABC type can handle fires involving ordinary
    combustibles, flammable liquids, and electrical equipment. It's important not
    only to have a fire extinguisher but also to know how to use it effectively. The
    PASS technique—Pull, Aim, Squeeze, and Sweep—is a simple method to remember when
    operating a fire extinguisher. Ensuring that everyone in your home or workplace
    knows the location of the fire extinguisher and how to use it can make a significant
    difference in an emergency. Regular checks and maintenance of the extinguisher
    are also essential to ensure it functions properly when needed.
  guide: "1. **Locate Your Fire Extinguisher**: Ensure that your fire extinguisher\
    \ is easily accessible and not blocked by furniture or other obstacles. Everyone\
    \ in the household or workplace should know its location.\n\n2. **Familiarize\
    \ Yourself with the Instructions**: Take a moment to read the instructions on\
    \ the fire extinguisher. Each extinguisher may have specific guidelines, so understanding\
    \ them beforehand is crucial.\n\n3. **Practice the PASS Technique**:\n   - **Pull\
    \ the Pin**: This will break the tamper seal and allow you to discharge the extinguisher.\n\
    \   - **Aim at the Base of the Fire**: Point the nozzle or hose at the base of\
    \ the fire, not the flames. This targets the fuel source.\n   - **Squeeze the\
    \ Handle**: This releases the extinguishing agent. Maintain a firm grip and control\
    \ the flow.\n   - **Sweep Side to Side**: Move the nozzle from side to side at\
    \ the base of the fire until it appears to be out. Keep an eye on the area in\
    \ case the fire reignites.\n\n4. **Safety Considerations**: Only use the extinguisher\
    \ if the fire is small and manageable. If the fire is spreading or you feel unsafe,\
    \ evacuate immediately and call emergency services.\n\n5. **Regular Maintenance**:\
    \ Check the pressure gauge monthly to ensure the extinguisher is charged and ready\
    \ for use. Replace or service as needed."
