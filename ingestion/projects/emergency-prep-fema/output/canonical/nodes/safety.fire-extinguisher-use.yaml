markdown_body: "### What this is\nThis guide helps you learn how to use a fire extinguisher\
  \ effectively and ensure that everyone in your home or workplace knows its location.\n\
  \n### Why it matters\nKnowing how to use a fire extinguisher can prevent small fires\
  \ from becoming large and dangerous. It is crucial for safety in emergencies.\n\n\
  ### What you need\nAn ABC type fire extinguisher, which is suitable for most types\
  \ of fires you might encounter in a home or office setting.\n\n### How to do it\n\
  1. Locate your fire extinguisher and ensure it is easily accessible. \n2. Familiarize\
  \ yourself with the instructions on the extinguisher. \n3. Practice the PASS technique:\
  \ Pull the pin, Aim at the base of the fire, Squeeze the handle, and Sweep side\
  \ to side.\n\n### Common failure modes\nUsing the wrong type of extinguisher for\
  \ the fire, not knowing how to operate the extinguisher, or not being able to locate\
  \ it quickly in an emergency.\n\n### Safety/boundary notes\nEnsure the fire is small\
  \ and manageable before attempting to extinguish it. If in doubt, evacuate and call\
  \ emergency services.\n\n### Local adaptation notes\nCheck the availability of ABC\
  \ type extinguishers in your area and ensure they are maintained regularly."
