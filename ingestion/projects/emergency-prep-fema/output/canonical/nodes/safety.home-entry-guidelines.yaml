markdown_body: '# What this is

  This reference sheet provides guidelines for safely entering your home after a disaster.
  It includes checks for gas leaks, electrical safety, structural integrity, and contamination.


  # Why it matters

  Entering a home after a disaster can be dangerous due to potential gas leaks, electrical
  hazards, structural damage, and contamination. Following these guidelines helps
  ensure your safety and the safety of others.


  # What you need

  You will need access to the main gas valve, main fuse box, or circuit breaker. It
  may also be helpful to have contact information for local authorities and professional
  inspectors.


  # How to do it

  1. Do not enter if you smell gas, see floodwaters around the building, or if the
  home was damaged by fire and not declared safe by authorities.

  2. If you smell gas or hear a hissing sound, open a window, leave immediately, and
  turn off the main gas valve from outside. Call the gas company from a neighbor''s
  residence.

  3. Check the electrical system only if it is safe. Turn off electricity at the main
  fuse box or circuit breaker if possible.

  4. Inspect the roof, foundation, and chimney for cracks. Leave immediately if collapse
  seems possible.

  5. If appliances are wet, turn off electricity, unplug them, and let them dry. Have
  them checked by a professional before use.

  6. Check water and sewage systems for damage. Turn off the main water valve if pipes
  are damaged. Consult local authorities about water safety.

  7. Dispose of any food or supplies that may be contaminated.

  8. Pump out flooded basements gradually to prevent structural damage.

  9. Be cautious of falling objects when opening cabinets.

  10. Clean up chemical spills and disinfect contaminated items.

  11. Document damages and contact your insurance agent.


  # Common failure modes

  Ignoring gas smells can lead to explosions. Entering a building with structural
  damage can result in collapse. Using electrical systems without inspection can cause
  shocks or fires.


  # Safety/boundary notes

  Do not enter if you smell gas or see floodwaters. Avoid using open flames until
  you are sure there is no gas leak.


  # Local adaptation notes

  Consider local building codes and the availability of professional inspectors when
  adapting these guidelines.'
