markdown_body: '### What this is

  A tornado watch means that tornadoes are possible in your area. It is a time to
  remain vigilant and prepared for potential severe weather.


  ### Why it matters

  Understanding and responding appropriately to a tornado watch can help ensure your
  safety by giving you time to prepare for a possible tornado.


  ### What you need

  Access to NOAA Weather Radio, commercial radio, or television to receive weather
  updates.


  ### How to do it

  Stay alert for signs of approaching storms. Regularly check NOAA Weather Radio,
  commercial radio, or television for updates on the weather situation.


  ### Common failure modes

  Ignoring weather updates or failing to monitor the situation can lead to being unprepared
  for a tornado.


  ### Safety/boundary notes

  Ensure you have a safe place to go if a tornado warning is issued.


  ### Local adaptation notes

  Consider local weather patterns and adjust monitoring practices accordingly.'
