summary_short: Strategies for taking shelter during disasters.
summary_medium: This section discusses strategies for taking shelter during disasters,
  including choosing safe locations based on specific hazards, and managing supplies
  and behavior in mass care shelters.
plain_language: Learn how to choose safe places to shelter during disasters and manage
  your supplies and behavior in mass care shelters.
markdown_body: '# What this is

  This concept note provides guidance on how to effectively take shelter during various
  types of disasters. It covers choosing safe locations, managing supplies, and maintaining
  cooperation in mass care shelters.


  # Why it matters

  Sheltering is crucial for protection during disasters. Choosing the right location
  and managing resources can significantly impact safety and comfort.


  # What you need

  A disaster supplies kit and a radio are essential. You should also have knowledge
  of safe shelter locations for specific hazards.


  # How to do it

  1. Identify the hazard and select a safe location in your home or building. For
  example, during a tornado, choose a basement or interior room on the lowest level.

  2. Bring your disaster supplies kit to the shelter.

  3. Cooperate with shelter managers and others.

  4. Follow local authorities'' instructions on when it is safe to leave.

  5. Manage food and water supplies during extended sheltering.


  # Common failure modes

  Choosing an unsafe shelter location and lack of cooperation in shelters can lead
  to increased risk and discomfort.


  # Safety/boundary notes

  No alcoholic beverages or weapons are allowed in emergency shelters, and smoking
  is restricted.


  # Local adaptation notes

  Adapt shelter location choices based on local hazards and conditions.'
structured_data:
  definition: Sheltering involves seeking protection in a safe location during a disaster.
  key_questions:
  - What is the safest location for sheltering during specific hazards?
  - What supplies are necessary for effective sheltering?
  - How can cooperation be maintained in mass care shelters?
  misconceptions:
