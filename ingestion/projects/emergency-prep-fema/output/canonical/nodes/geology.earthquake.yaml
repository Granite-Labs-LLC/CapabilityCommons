summary_short: An overview of earthquakes, defined as a sudden slipping or movement
  of a portion of the earth's crust, followed by vibrations.
summary_medium: Earthquakes are sudden movements of the earth's crust that result
  in vibrations. This concept explores the causes and effects of these natural phenomena.
plain_language: An earthquake happens when a part of the earth's crust suddenly moves,
  causing the ground to shake.
markdown_body: '### What this is

  An earthquake is a natural event characterized by the sudden slipping or movement
  of a portion of the earth''s crust. This movement is typically accompanied and followed
  by a series of vibrations or seismic waves.


  ### Why it matters

  Understanding earthquakes is crucial because they can have significant impacts on
  human life and infrastructure. They can cause buildings to collapse, trigger landslides,
  and lead to tsunamis, making them a major natural hazard.


  ### What you need

  To understand earthquakes, one needs a basic knowledge of geology, particularly
  the structure of the earth''s crust and tectonic plates.


  ### How to do it

  Studying earthquakes involves examining seismic data, understanding tectonic plate
  movements, and learning about the different types of seismic waves.


  ### Common failure modes

  Misinterpreting seismic data or underestimating the potential impact of an earthquake
  can lead to inadequate preparedness and response.


  ### Safety/boundary notes

  While studying earthquakes, it''s important to consider safety measures for earthquake-prone
  areas, such as building codes and emergency preparedness plans.


  ### Local adaptation notes

  In regions prone to earthquakes, local adaptations may include specific building
  designs and community education programs to enhance resilience.'
