markdown_body: '### What this is

  This reference sheet provides guidelines for actions to take immediately after evacuating
  a building during an emergency.


  ### Why it matters

  Following these protocols helps ensure personal safety and allows emergency personnel
  to perform their duties without obstruction.


  ### What you need

  Awareness of your surroundings and the ability to follow instructions quickly.


  ### How to do it

  Once you have evacuated a building, do not stand in front of windows, glass doors,
  or other potentially hazardous areas. Move away from sidewalks or streets that may
  be used by emergency officials or others still exiting the building.


  ### Common failure modes

  Standing in hazardous areas or blocking emergency routes can endanger yourself and
  others.


  ### Safety/boundary notes

  Ensure you are in a safe location away from potential hazards and clear of emergency
  pathways.


  ### Local adaptation notes

  Adjust these guidelines based on local emergency protocols and the specific layout
  of the building and surrounding area.'
