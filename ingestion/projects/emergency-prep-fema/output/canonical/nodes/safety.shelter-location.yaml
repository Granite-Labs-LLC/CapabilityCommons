  - Draw a floor plan of your home and mark the safest shelter locations.
  - Identify and remove any potential hazards in your chosen shelter area.
  - Conduct a drill with your family to practice reaching the shelter area quickly.
  - Create a checklist of emergency supplies to keep in your shelter area.
