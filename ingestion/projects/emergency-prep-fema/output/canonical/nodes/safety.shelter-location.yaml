bundle_overrides:
  hook: Knowing the safest place to take shelter in your home can protect you and
    your loved ones during emergencies when evacuation isn't possible.
  primer: In emergencies like severe weather or other threats, knowing where to take
    shelter in your home can be crucial for your safety. This guide helps you identify
    the safest places in your home to seek shelter when you cannot evacuate. The key
    is to find a location that minimizes exposure to external dangers such as flying
    debris or structural collapse. For apartments, interior rooms away from windows
    are ideal. In one-story homes, a small, windowless interior room on the lowest
    floor is recommended. For two-story homes, prioritize the first floor and avoid
    rooms with large windows or exterior walls. It's also important to ensure that
    the chosen shelter area is free from potential hazards like heavy objects that
    could fall. By understanding your home's layout and potential risks, you can make
    informed decisions to keep yourself and your family safe during emergencies.
  guide: '1. **Identify Your Home Type**: Determine if you live in an apartment, one-story
    home, or two-story home, as this will guide your shelter selection.


    2. **For Apartments**: Seek shelter in an interior room away from windows. Ideal
    locations include interior hallways, closets, or bathrooms without windows.


    3. **For One-Story Homes**: Choose a small, windowless interior room on the lowest
    floor. This could be a bathroom, closet, or interior hallway. Avoid rooms with
    windows or exterior walls.


    4. **For Two-Story Homes**: Prioritize shelter on the first floor. Select a small,
    windowless interior room, such as a bathroom or closet. Avoid rooms with large
    windows or exterior walls.


    5. **Check for Hazards**: Ensure the chosen shelter area is free from potential
    hazards like heavy objects that could fall during an emergency. Remove any items
    that could pose a risk.


    6. **Prepare the Area**: Keep essential supplies like water, a flashlight, and
    a first-aid kit in your shelter area. Make sure everyone in your household knows
    where to go and what to do during an emergency.


    7. **Practice**: Conduct regular drills to ensure everyone knows how to quickly
    and safely reach the shelter area.'
  reference:
