markdown_body: '### What this is

  This guide provides instructions on identifying the safest places in your home to
  seek shelter during emergencies when evacuation is not possible.


  ### Why it matters

  Knowing where to take shelter in your home can protect you from harm during emergencies
  such as severe weather or other threats when leaving the home is not an option.


  ### What you need

  Familiarity with your home''s layout and an understanding of potential hazards.


  ### How to do it

  1. For apartments, seek shelter in interior rooms away from windows.

  2. In one-story homes, choose a small, windowless interior room on the lowest floor.

  3. In two-story homes, use a similar approach, prioritizing the first floor. Avoid
  rooms with large windows or exterior walls.


  ### Common failure modes

  Choosing a room with windows or exterior walls, which may not provide adequate protection.


  ### Safety/boundary notes

  Ensure the chosen shelter area is free from potential hazards like heavy objects
  that could fall.


  ### Local adaptation notes

  Consider local building codes and typical weather patterns when selecting shelter
  areas.'
