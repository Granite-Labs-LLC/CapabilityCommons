markdown_body: '### What this is

  This reference sheet lists various miscellaneous hazardous materials that are commonly
  found in households and require special handling due to their potential risks.


  ### Why it matters

  Proper identification and handling of hazardous materials are crucial to prevent
  environmental contamination and ensure personal safety. These materials can pose
  health risks if not managed correctly.


  ### What you need

  Awareness of the types of materials that are considered hazardous and knowledge
  of local disposal regulations.


  ### How to do it

  Identify these materials in your home and follow local guidelines for safe disposal.
  For example, batteries should be recycled at designated facilities, and mercury-containing
  devices should be handled with care to avoid breakage.


  ### Common failure modes

  Improper disposal of these materials can lead to environmental damage and health
  hazards. For instance, throwing batteries in regular trash can lead to chemical
  leaks.


  ### Safety/boundary notes

  Always wear protective gear when handling hazardous materials and ensure they are
  stored in a safe location away from children and pets.


  ### Local adaptation notes

  Check with local waste management authorities for specific disposal instructions
  and recycling programs available in your area.'
