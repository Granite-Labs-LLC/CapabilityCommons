summary_short: A guide for the public on preparing for emergencies, including creating
  plans and assembling a disaster supplies kit.
summary_medium: This guide helps the public learn how to protect themselves and their
  families against various hazards by developing, practicing, and maintaining emergency
  plans and assembling a disaster supplies kit.
plain_language: Learn how to prepare for emergencies by making plans and gathering
  supplies.
markdown_body: '# What this is

  This guide is designed to help the general public prepare for emergencies by providing
  information on how to develop, practice, and maintain emergency plans, as well as
  how to assemble a disaster supplies kit.


  # Why it matters

  Being prepared for emergencies can significantly reduce the risks to you and your
  family during disasters. Having a plan and necessary supplies can help ensure safety
  and survival when relying on your own resources.


  # What you need

  To prepare, you need to develop a comprehensive emergency plan and assemble a disaster
  supplies kit with food, water, and other essentials.


  # How to do it

  Start by identifying potential hazards in your area. Develop a plan that includes
  what to do before, during, and after a disaster. Practice this plan regularly. Assemble
  a disaster supplies kit with enough provisions to last for several days.


  # Common failure modes

  Common mistakes include incomplete emergency plans and insufficient supplies in
  the disaster kit.


  # Safety/boundary notes

  Ensure your plans account for the specific needs of your household and consider
  local environmental and infrastructural factors.


  # Local adaptation notes

  Adapt your plans and kits based on local differences in buildings, infrastructure,
  and environmental features.'
