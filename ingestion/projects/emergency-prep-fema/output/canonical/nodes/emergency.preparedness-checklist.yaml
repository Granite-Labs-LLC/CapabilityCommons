plain_language: This checklist helps you prepare for emergencies by listing essential
  supplies and actions to take before, during, and after an emergency.
markdown_body: '# What this is

  This is a checklist designed to help individuals and families prepare for emergencies.
  It includes essential supplies and actions to ensure safety and readiness.


  # Why it matters

  Being prepared for emergencies can significantly reduce the impact of disasters
  on your family and community. Having a plan and the necessary supplies can save
  lives and minimize stress during a crisis.


  # What you need

  You will need an emergency kit, communication devices, and a clear plan that all
  family members understand.


  # How to do it

  1. Gather essential supplies such as water, non-perishable food, first aid kit,
  flashlight, batteries, and important documents.

  2. Create a communication plan that includes emergency contacts and meeting places.

  3. Stay informed about potential hazards in your area and update your plan accordingly.


  # Common failure modes

  Common issues include lack of supplies, poor communication among family members,
  and failure to update the plan regularly.


  # Safety/boundary notes

  Ensure all family members are aware of the emergency plan and know how to execute
  it. Regularly review and practice the plan.


  # Local adaptation notes

  Consider regional hazards and available community resources when creating your emergency
  plan.'
