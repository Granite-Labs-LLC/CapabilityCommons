markdown_body: '### What this is

  This is a true or false knowledge check designed to assess your understanding of
  flood emergencies and safety measures.


  ### Why it matters

  Understanding flood risks and safety measures is crucial for personal safety and
  preparedness during flood emergencies.


  ### What you need

  You need to read each statement and decide if it is true or false based on your
  knowledge of flood emergencies.


  ### How to do it

  Review each statement carefully. Mark ''T'' for true or ''F'' for false. After completing
  all statements, check your answers against the provided answer key.


  ### Common failure modes

  Misunderstanding the nature of flood risks or the availability of insurance can
  lead to incorrect answers.


  ### Safety/boundary notes

  Ensure you understand the safety implications of each statement, particularly those
  related to physical safety during floods.


  ### Local adaptation notes

  Consider local flood risks and insurance availability, as these can vary by region.'
