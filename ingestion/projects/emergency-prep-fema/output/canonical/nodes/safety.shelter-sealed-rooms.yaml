markdown_body: '### What this is

  This reference sheet provides guidelines for maintaining safety in sealed rooms
  during emergencies. It includes recommendations on space requirements per person
  and ventilation advice to prevent carbon dioxide build-up.


  ### Why it matters

  In emergencies where outside air is contaminated, sealed rooms can offer temporary
  protection. However, understanding how to manage air quality and space is crucial
  to avoid health risks.


  ### What you need

  A sealed room with at least ten square feet of floor space per person to ensure
  sufficient air supply for up to five hours.


  ### How to do it

  Calculate the space in your sealed room to ensure at least ten square feet per person.
  Limit the time spent in the sealed room to 2-3 hours as recommended by local officials.
  Once the emergency has passed, ventilate the room to remove any contaminated air.


  ### Common failure modes

  Insufficient ventilation and extended sheltering time can lead to carbon dioxide
  build-up and exposure to contaminated air.


  ### Safety/boundary notes

  Limit shelter time to 2-3 hours to prevent the diminishing effectiveness of the
  sealed room.


  ### Local adaptation notes

  Follow local official recommendations for sheltering times and procedures.'
