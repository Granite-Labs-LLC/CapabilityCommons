bundle_overrides:
  hook: In the face of extreme windstorms, a well-prepared safe room can be the difference
    between safety and disaster for you and your family.
  primer: A safe room is a fortified space within your home designed to provide protection
    during extreme windstorms, such as tornadoes and hurricanes. These storms can
    cause significant damage to buildings, posing a serious threat to occupants. A
    safe room is constructed to withstand high winds and flying debris, ensuring the
    safety of its occupants even if the rest of the house is damaged. To build a safe
    room, you need to select a suitable location, such as a basement, a concrete slab-on-grade
    foundation, or an interior room on the first floor. The materials used must be
    wind-resistant, and the room must be properly anchored to prevent overturning
    and uplift. Additionally, it is crucial to separate the safe room structure from
    the rest of the residence to prevent damage transfer. Proper construction and
    material selection are vital to avoid common failure modes like overturning and
    debris penetration. If built below ground, the design must also prevent water
    accumulation.
  guide: '1. **Choose a Location:** Ideally, select a below-ground location for maximum
    protection. If that''s not possible, an interior room on the first floor can also
    be effective.


    2. **Anchor the Room:** Ensure the safe room is adequately anchored to resist
    overturning and uplift. This involves using strong anchoring tools and techniques
    to secure the structure to the foundation.


    3. **Select Materials:** Use wind-resistant materials for the walls, ceiling,
    and door. These materials should be capable of withstanding wind pressure and
    resisting penetration by windborne objects and debris.


    4. **Strengthen Connections:** All connections between parts of the safe room
    must be strong enough to resist wind forces. This includes ensuring that bolts,
    screws, and other fasteners are secure and appropriate for high-stress conditions.


    5. **Separate from Residence:** The safe room should be structurally independent
    from the rest of the house. This separation prevents damage to the main structure
    from affecting the integrity of the safe room.


    6. **Water Prevention:** If the safe room is below ground, incorporate measures
    to prevent water accumulation, such as proper drainage systems, to handle the
    heavy rains that often accompany severe windstorms.'
  reference:
  - 'Choose a location: Preferably below ground.'
  - Anchor the room to resist overturning and uplift.
  - Use wind-resistant materials for construction.
  - Ensure strong connections to resist wind.
  - Separate the safe room from the main structure.
  - Prevent water accumulation in below-ground rooms.
  worksheet:
  - Identify potential locations in your home for a safe room.
  - List materials needed for wind-resistant construction.
  - Sketch a basic design of your safe room, including anchoring points.
  - Research local building codes related to safe room construction.
  - Plan a drainage system for a below-ground safe room.
  teach_forward_kit:
    three_minute_version: A safe room is a fortified space in your home designed to
      protect you during extreme windstorms. It should be built in a secure location,
      using wind-resistant materials, and properly anchored to withstand high winds
      and debris. Ensure it is separate from the main structure to prevent damage
      transfer.
    ten_minute_outline:
    - Introduction to safe rooms and their purpose.
    - Importance of location selection and anchoring.
    - Materials and construction techniques for wind resistance.
    - Ensuring structural independence from the main house.
    - Addressing water accumulation in below-ground rooms.
    - Review of common construction mistakes and how to avoid them.
    discussion_prompts:
    - Why is it important to have a safe room in areas prone to extreme windstorms?
    - What are the key considerations when selecting a location for a safe room?
    - How can you ensure that a safe room remains structurally sound during a storm?
    - What are the potential challenges of building a below-ground safe room?
