summary_short: Guidelines for building a safe room to protect against extreme windstorms.
summary_medium: Guidelines for building a safe room to protect against extreme windstorms,
  including location options and construction requirements.
plain_language: Learn how to build a safe room in your home to protect against extreme
  windstorms like tornadoes and hurricanes.
markdown_body: "### What this is\nA safe room is a specially designed space in your\
  \ home that provides high-level protection during extreme windstorms, such as tornadoes\
  \ and hurricanes.\n\n### Why it matters\nExtreme windstorms can severely damage\
  \ buildings, posing a threat to occupants. A safe room offers a refuge that can\
  \ withstand high winds and flying debris, ensuring the safety of you and your family.\n\
  \n### What you need\nYou will need a suitable location in your home, such as a basement,\
  \ a concrete slab-on-grade foundation, or an interior room on the first floor. Materials\
  \ must be wind-resistant, and the room must be properly anchored.\n\n### How to\
  \ do it\n1. Choose a location: Preferably below ground for maximum protection. \n\
  2. Ensure the room is adequately anchored to resist overturning and uplift. \n3.\
  \ Use wind-resistant materials for walls, ceiling, and door. \n4. Ensure all connections\
  \ are strong enough to resist wind. \n5. Separate the safe room structure from the\
  \ rest of the residence to prevent damage transfer.\n\n### Common failure modes\n\
  Overturning, uplift, and penetration by debris are common failure modes if the safe\
  \ room is not properly constructed.\n\n### Safety/boundary notes\nEnsure the safe\
  \ room is designed to prevent water accumulation, especially if built below ground.\n\
  \n### Local adaptation notes\nConsider local weather patterns and potential water\
  \ accumulation when designing a below-ground safe room."
structured_data:
  goal: To build a safe room that provides protection during extreme windstorms.
  deliverables: A completed safe room that meets safety standards for wind resistance.
  acceptance_criteria: The safe room must withstand high winds and flying debris,
    and be separate from the main structure to prevent damage transfer.
  implementation:
    smallest_viable_version: A basic safe room built in an interior first-floor room.
    tools:
    - Concrete tools
    - Anchoring tools
    materials:
    - Concrete slab
    - Wind-resistant materials
    expected_time: Several weeks
    expected_cost: Medium
    success_checks:
    - Room withstands simulated wind pressure
    - No water accumulation
    stop_conditions:
    - Structural instability
    - Water leakage
    common_mistakes:
    - Improper anchoring
    - Using non-resistant materials
    variants:
    - label: Below-ground design
      when: If local conditions allow
      notes: Provides maximum protection but requires water prevention measures.
    when_to_escalate:
    - If structural integrity is compromised
    - If water leakage is detected
  safety_boundary: Safe-room construction must meet FEMA/ICC 500 or an equivalent
    local-code-compliant design — an improperly anchored or built safe room can fail
    exactly when it's needed. Consult a qualified contractor or structural engineer
    and verify compliance with local building code before construction; do not rely
    on an unverified design during an actual severe-wind event.
