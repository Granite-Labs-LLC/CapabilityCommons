markdown_body: '### What this is

  This reference sheet helps you identify warning signs of potential landslides, which
  can prevent damage and save lives.


  ### Why it matters

  Recognizing these signs early can help you take action to protect yourself and your
  property from landslides, which can occur suddenly and cause significant damage.


  ### What you need

  Awareness of your surroundings and the ability to notice changes in the landscape
  or structures.


  ### How to do it

  Monitor for changes in storm-water drainage patterns, land movement, or leaning
  trees. Check for sticking doors or windows, new cracks in structures, or bulging
  ground. Listen for unusual sounds like rumbling or cracking. Be alert for signs
  of debris flow when driving.


  ### Common failure modes

  Ignoring warning signs or misinterpreting natural sounds as harmless.


  ### Safety/boundary notes

  Stay informed about local geological conditions and construction practices that
  may affect landslide risks.


  ### Local adaptation notes

  Consider regional geological conditions and local construction practices when assessing
  landslide risks.'
