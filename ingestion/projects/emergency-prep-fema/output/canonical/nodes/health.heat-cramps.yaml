markdown_body: '### What this is

  Heat cramps are muscular pains and spasms that occur as a result of heavy exertion
  in hot conditions. They are the least severe form of heat-related illnesses but
  serve as an early warning sign that the body is struggling to cope with heat.


  ### Why it matters

  Recognizing heat cramps is important because they are often the first indication
  that the body is overheating. Addressing them promptly can prevent more serious
  heat-related conditions such as heat exhaustion or heat stroke.


  ### What you need

  Awareness of symptoms and understanding of how to cool down and rehydrate effectively.


  ### How to do it

  If you experience heat cramps, stop all activity and sit quietly in a cool place.
  Drink clear juice or an electrolyte-rich sports beverage. Avoid strenuous activity
  for a few hours after the cramps subside.


  ### Common failure modes

  Ignoring the symptoms and continuing to exert oneself can lead to more severe heat-related
  illnesses.


  ### Safety/boundary notes

  Ensure you are in a safe, cool environment when addressing heat cramps. Avoid alcohol
  and caffeine, as they can exacerbate dehydration.


  ### Local adaptation notes

  In areas with high humidity, it may be necessary to take additional precautions,
  as sweat does not evaporate as quickly, reducing the body''s ability to cool itself.'
