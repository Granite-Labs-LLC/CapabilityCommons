summary_short: Effectiveness of various water treatment methods in emergencies.
summary_medium: This reference sheet details the effectiveness of boiling, chlorination,
  and distillation in treating water during emergencies, focusing on their ability
  to kill microbes and remove contaminants.
plain_language: Learn how boiling, chlorination, and distillation can make water safe
  to drink by killing germs and removing harmful substances.
markdown_body: '### What this is

  This reference sheet provides information on the effectiveness of different water
  treatment methods in emergency situations. It focuses on three primary methods:
  boiling, chlorination, and distillation.


  ### Why it matters

  In emergencies, access to clean drinking water is crucial for survival. Understanding
  how to effectively treat water can prevent waterborne illnesses and ensure safe
  hydration.


  ### What you need

  To treat water using these methods, you will need a heat source for boiling, chlorine
  tablets for chlorination, and a distillation apparatus for distillation.


  ### How to do it

  1. **Boiling**: Bring water to a rolling boil for at least one minute to kill most
  microbes.

  2. **Chlorination**: Add chlorine tablets according to the instructions to disinfect
  water.

  3. **Distillation**: Use a distillation apparatus to heat water until it vaporizes,
  then condense the vapor back into liquid to remove contaminants.


  ### Common failure modes

  1. Incomplete boiling may not kill all microbes.

  2. Incorrect chlorine dosage can lead to ineffective disinfection.

  3. Improper distillation setup may not remove all contaminants.


  ### Safety/boundary notes

  Ensure proper handling of heat sources and chemicals to avoid accidents. Follow
  guidelines for each method to ensure effectiveness.


  ### Local adaptation notes

  Consider the availability of heat sources, access to chlorine, and distillation
  equipment when choosing a method.'
