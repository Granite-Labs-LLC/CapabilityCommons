summary_short: A storm surge is a large dome of water pushed onshore by storm winds.
summary_medium: Storm surges are domes of water pushed onshore by hurricane and tropical
  storm winds, potentially reaching 25 feet high and 50-100 miles wide.
plain_language: A storm surge happens when strong winds from a hurricane or tropical
  storm push a large amount of water onto the shore, creating a dome of water that
  can be very high and wide.
markdown_body: '### What this is

  A storm surge is a large dome of water that is pushed onto land by the strong winds
  of a hurricane or tropical storm. These surges can be extremely large, reaching
  heights of up to 25 feet and spanning widths of 50 to 100 miles.


  ### Why it matters

  Storm surges are significant because they can cause severe flooding and damage to
  coastal areas. Understanding storm surges helps in preparing for and mitigating
  the impacts of hurricanes and tropical storms.


  ### What you need

  Awareness of the potential for storm surges during hurricanes and tropical storms,
  and knowledge of local emergency plans.


  ### How to do it

  Monitor weather reports during hurricane season, understand evacuation routes, and
  follow local emergency management instructions.


  ### Common failure modes

  Underestimating the height and reach of a storm surge, not evacuating in time, and
  failing to secure property.


  ### Safety/boundary notes

  Always prioritize safety by evacuating when advised and staying informed about weather
  conditions.


  ### Local adaptation notes

  Coastal areas should have specific plans and infrastructure to deal with storm surges,
  including barriers and evacuation routes.'
