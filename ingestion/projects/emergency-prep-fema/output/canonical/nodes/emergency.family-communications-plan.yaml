summary_short: A worksheet to help families create a communications plan for emergencies.
summary_medium: This worksheet guides families in creating a communications plan for
  emergencies, including contact information, meeting places, and important phone
  numbers.
plain_language: Use this worksheet to prepare a family communications plan for emergencies.
  It helps you gather contact details, decide on meeting places, and list important
  phone numbers.
markdown_body: '# What this is

  This worksheet is a tool for families to organize and document their emergency communication
  plans. It includes sections for contact information, meeting places, and important
  phone numbers.


  # Why it matters

  In an emergency, family members may be separated and unable to communicate. Having
  a pre-established plan ensures everyone knows how to reach each other and where
  to meet.


  # What you need

  You will need the contact information of all family members, details of meeting
  places, and important phone numbers such as emergency services and out-of-state
  contacts.


  # How to do it

  1. Fill out the contact information for each family member, including name, phone
  number, and any important medical information.

  2. Identify neighborhood and regional meeting places.

  3. List important phone numbers, such as emergency services and out-of-state contacts.

  4. Regularly update the information to ensure accuracy.


  # Common failure modes

  Common issues include outdated information and incomplete contact details, which
  can hinder communication during an emergency.


  # Safety/boundary notes

  Ensure that all family members are aware of the plan and know how to access it.
  Keep a copy in a safe but accessible location.


  # Local adaptation notes

  Consider regional meeting places and local emergency numbers that are specific to
  your area.'
