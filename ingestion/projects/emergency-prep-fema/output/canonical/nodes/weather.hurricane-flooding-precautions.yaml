plain_language: Learn about the dangers of hurricane flooding and how to stay safe.
markdown_body: '### What this is

  This reference sheet provides information on the dangers of hurricane flooding,
  particularly the risks posed inland, and outlines precautions to take to ensure
  safety.


  ### Why it matters

  Hurricane flooding is not only a coastal threat but can also cause significant damage
  and danger inland. Understanding these risks and taking appropriate precautions
  can save lives and reduce property damage.


  ### What you need

  Awareness of local flood risks, an emergency plan, and access to reliable weather
  updates.


  ### How to do it

  Stay informed about weather conditions through reliable sources like the National
  Weather Service. Prepare an emergency kit, have a family communication plan, and
  know your evacuation routes. Avoid driving through flooded areas and heed all warnings
  from local authorities.


  ### Common failure modes

  Ignoring evacuation orders, underestimating the power of floodwaters, and attempting
  to drive through flooded roads.


  ### Safety/boundary notes

  Never drive or walk through floodwaters. Always follow the instructions of local
  emergency management officials.


  ### Local adaptation notes

  Adapt precautions based on local geography and infrastructure, such as proximity
  to rivers or low-lying areas.'
