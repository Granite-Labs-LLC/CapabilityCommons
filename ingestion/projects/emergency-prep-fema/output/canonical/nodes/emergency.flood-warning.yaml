summary_short: Actions to take during a flood warning.
summary_medium: Instructions for actions to take during a flood warning, including
  immediate evacuation if advised.
plain_language: If a flood warning is issued, it means flooding is happening or will
  happen soon. Follow evacuation orders immediately.
markdown_body: '### What this is

  A flood warning indicates that flooding is either occurring or will occur soon in
  your area.


  ### Why it matters

  Floods can pose significant risks to life and property. Acting quickly can help
  ensure safety.


  ### What you need

  Stay informed through local news and weather updates. Be prepared to evacuate if
  advised.


  ### How to do it

  If a flood warning is issued, monitor local news for updates. If authorities advise
  evacuation, leave immediately and follow designated evacuation routes.


  ### Common failure modes

  Delaying evacuation can lead to being trapped by rising waters, increasing risk
  to personal safety.


  ### Safety/boundary notes

  Always prioritize personal safety and follow official guidance during a flood warning.


  ### Local adaptation notes

  Local authorities may have specific evacuation routes and shelters. Familiarize
  yourself with these in advance.'
structured_data:
  definition: A flood warning is an alert issued by authorities indicating that flooding
    is occurring or imminent.
  key_questions:
  - What should I do if a flood warning is issued?
  - Where can I find information on evacuation routes?
  misconceptions:
  - A flood warning means I have plenty of time to prepare.
  - I can wait until I see water rising before evacuating.
