summary_short: Steps to prepare your home if a wildfire threatens.
summary_medium: Precautions to take if a wildfire threatens your home, including shutting
  off gas, sealing vents, and preparing for evacuation.
plain_language: Learn how to prepare your home and family if a wildfire is approaching.
  This includes turning off utilities, sealing vents, and getting ready to leave quickly
  if needed.
markdown_body: '### What this is

  This reference sheet provides guidance on how to prepare your home and family if
  a wildfire is threatening your area.


  ### Why it matters

  Wildfires can spread rapidly and cause significant damage. Being prepared can help
  protect your home and ensure your safety.


  ### What you need

  - Garden hose

  - Lawn sprinklers

  - Fire tools (rake, axe, handsaw or chainsaw, bucket, shovel)

  - Plywood or commercial seals

  - Vehicle with keys


  ### How to do it

  1. Shut off gas at the meter. Only a qualified professional can safely turn it back
  on.

  2. Seal attic and ground vents with pre-cut plywood or commercial seals.

  3. Turn off propane tanks.

  4. Place combustible patio furniture inside.

  5. Connect a garden hose to outside taps and place lawn sprinklers on the roof and
  near above-ground fuel tanks. Wet the roof.

  6. Wet or remove shrubs within 15 feet of your residence.

  7. Gather fire tools such as a rake, axe, handsaw or chainsaw, bucket, and shovel.

  8. Back your car into the garage or park it in an open space facing the direction
  of escape. Shut doors and roll up windows. Leave the key in the ignition and the
  car doors unlocked. Close garage windows and doors, but leave them unlocked. Disconnect
  automatic garage door openers.

  9. Open fireplace damper. Close fireplace screens.

  10. Close windows, vents, doors, blinds or noncombustible window coverings, and
  heavy drapes. Remove flammable drapes and curtains.

  11. Move flammable furniture into the center of the residence away from windows
  and sliding-glass doors.

  12. Close all interior doors and windows to prevent drafts.

  13. Place valuables that will not be damaged by water in a pool or pond.


  ### Common failure modes

  Inadequate preparation, such as failing to seal vents or not having fire tools ready.


  ### Safety/boundary notes

  Maintain a 15-foot clearance for shrubs around your home.


  ### Local adaptation notes

  Adjust the preparation steps based on local fire department recommendations and
  specific geographic risks.'
