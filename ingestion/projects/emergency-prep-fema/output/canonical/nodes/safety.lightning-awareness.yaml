markdown_body: '# What this is

  This is a reference sheet providing essential information about lightning safety
  specifically for boaters.


  # Why it matters

  Lightning poses significant risks to those on the water. Understanding these risks
  and implementing safety measures can prevent accidents and save lives.


  # What you need

  Awareness of weather conditions, a plan for seeking shelter, and knowledge of safety
  measures to implement on boats.


  # How to do it

  Monitor weather forecasts and be aware of developing storms. If lightning is detected,
  seek shelter immediately. Avoid open water and metal objects. Ensure all safety
  equipment is in good condition.


  # Common failure modes

  Ignoring lightning warnings, failing to seek shelter promptly, and inadequate safety
  measures on boats.


  # Safety/boundary notes

  Always prioritize personal safety over property. Do not attempt to ride out a storm
  on open water.


  # Local adaptation notes

  Adapt safety measures based on local weather patterns and available shelter options.'
