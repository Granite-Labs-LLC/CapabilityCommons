bundle_overrides:
  hook: Preventing accidental fires starts with safe handling of matches and smoking
    materials—protect your home and loved ones.
  primer: Fire safety is crucial in every household, especially when it comes to handling
    matches and smoking materials. Matches and lighters, if not stored properly, can
    easily fall into the hands of children, leading to dangerous situations. Similarly,
    careless smoking habits, such as smoking in bed or when drowsy, can result in
    accidental fires. To mitigate these risks, it's important to store matches and
    lighters in a locked cabinet, out of children's reach. Smokers should use deep,
    sturdy ashtrays and ensure that cigarette and cigar butts are fully extinguished
    with water before disposal. By following these simple precautions, you can significantly
    reduce the risk of fire hazards in your home.
  guide: '1. **Store Matches and Lighters Safely**: Always keep matches and lighters
    in a locked cabinet, away from the reach of children. This prevents accidental
    access and potential misuse.


    2. **Avoid Smoking in Risky Situations**: Never smoke in bed or when you are feeling
    drowsy or under the influence of medication. These conditions increase the likelihood
    of falling asleep with a lit cigarette, which can lead to fires.


    3. **Use Proper Ashtrays**: Provide smokers with deep, sturdy ashtrays. These
    should be placed on non-flammable surfaces to prevent any accidental fires from
    tipping or falling ash.


    4. **Extinguish Smoking Materials Properly**: After smoking, ensure that all cigarette
    and cigar butts are doused with water before disposal. This ensures they are fully
    extinguished and reduces the risk of starting a fire in the trash.


    5. **Regularly Check for Safety**: Routinely check that matches and lighters remain
    inaccessible to children and that all smoking materials are properly extinguished.
    This proactive approach helps maintain a safe environment.'
  reference:
