markdown_body: '### What this is

  This guide provides safety precautions for handling matches and smoking materials
  to prevent fires.


  ### Why it matters

  Improper handling of matches and smoking materials can lead to accidental fires,
  posing a risk to life and property.


  ### What you need

  A locked cabinet for storing matches and lighters, and deep, sturdy ashtrays for
  smokers.


  ### How to do it

  Store matches and lighters in a locked cabinet, out of reach of children. Never
  smoke in bed or when you are drowsy or medicated. Use deep, sturdy ashtrays and
  ensure cigarette and cigar butts are doused with water before disposal.


  ### Common failure modes

  Leaving smoking materials unattended or storing matches where children can access
  them.


  ### Safety/boundary notes

  Ensure all smoking materials are fully extinguished before disposal to prevent accidental
  fires.


  ### Local adaptation notes

  Consider local regulations and cultural practices regarding smoking and fire safety.'
