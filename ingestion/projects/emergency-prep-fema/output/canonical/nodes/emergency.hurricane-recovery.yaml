markdown_body: '### What this is

  This reference sheet provides guidelines for recovering from a hurricane, based
  on disaster recovery instructions.


  ### Why it matters

  Recovering from a hurricane safely and effectively is crucial to minimize further
  harm and begin rebuilding.


  ### What you need

  Access to recovery instructions and any necessary tools or resources as outlined
  in Part 5.


  ### How to do it

  Follow the detailed recovery instructions provided in Part 5 of the source material
  to ensure a safe and effective recovery process.


  ### Common failure modes

  Not following the recovery instructions can lead to safety hazards and prolonged
  recovery time.


  ### Safety/boundary notes

  Ensure all safety guidelines are followed to prevent injury or further damage during
  recovery.


  ### Local adaptation notes

  Adapt the recovery instructions to fit local conditions and available resources.'
