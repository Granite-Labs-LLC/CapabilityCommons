markdown_body: '### What this is

  This assessment is designed to evaluate your knowledge of fire safety and the appropriate
  actions to take during a fire emergency.


  ### Why it matters

  Understanding fire safety and knowing how to respond in an emergency can save lives
  and prevent injuries.


  ### What you need

  No special tools or materials are required. Just your knowledge and understanding
  of fire safety practices.


  ### How to do it

  Answer each question based on your knowledge of fire safety. Use the answer key
  to check your responses.


  ### Common failure modes

  Common mistakes include opening a hot door without checking for heat and incorrect
  treatment of burns.


  ### Safety/boundary notes

  Ensure that all actions taken during a fire emergency prioritize personal safety
  and the safety of others.


  ### Local adaptation notes

  Consider local fire safety regulations and resources when adapting this assessment
  for specific communities.'
