bundle_overrides:
  hook: Knowing how to safely shut off your home's electricity can prevent accidents
    and ensure safety during emergencies or repairs.
  primer: Electricity is a vital part of our daily lives, but it can also pose significant
    risks if not handled properly. Knowing how to shut off electricity in your home
    is crucial, especially during emergencies like electrical fires or when performing
    repairs. The main tool you'll need is familiarity with your home's circuit box,
    which is usually located in a utility room, basement, or garage. The circuit box
    contains all the circuit breakers that control the flow of electricity to different
    parts of your home. By learning how to operate these breakers, you can safely
    cut off electricity to specific areas or the entire house. This skill is not only
    important for your safety but also for the safety of everyone in your household.
    Teaching all responsible household members how to shut off electricity ensures
    that anyone can act quickly if the need arises.
  guide: '1. **Locate Your Circuit Box**: Find the circuit box in your home. It''s
    often in a utility room, basement, or garage. Familiarize yourself with its location
    and ensure it''s easily accessible.


    2. **Understand the Circuit Breakers**: Inside the circuit box, you''ll find individual
    circuit breakers and a main circuit breaker. Each individual breaker controls
    electricity to specific areas or appliances in your home, while the main breaker
    controls the power to the entire house.


    3. **Teach Household Members**: Gather all responsible household members and show
    them the location of the circuit box. Explain the function of the individual and
    main circuit breakers.


    4. **Practice Shutting Off Electricity**: Demonstrate how to turn off an individual
    circuit breaker by flipping it to the ''off'' position. Then, show how to turn
    off the main circuit breaker, but only after all individual breakers are off.
    This prevents electrical surges and potential hazards.


    5. **Label the Breakers**: Clearly label each circuit breaker with the area or
    appliance it controls. This will make it easier for anyone to quickly shut off
    the correct breaker in an emergency.


    6. **Review Regularly**: Periodically review the procedure with household members
    to ensure everyone remembers how to safely shut off electricity.'
  reference:
  - Locate your electricity circuit box.
  - Teach all responsible household members how to shut off the electricity.
  - Always shut off all individual circuits before the main circuit breaker.
  - Label circuits clearly for easy identification.
  - Review the procedure regularly with household members.
  worksheet:
  - Find and note the location of your circuit box.
  - List all household members who should know how to shut off electricity.
  - Label each circuit breaker with its corresponding area or appliance.
  - Practice shutting off an individual circuit breaker and the main breaker.
  - Create a schedule for reviewing this procedure with your household.
