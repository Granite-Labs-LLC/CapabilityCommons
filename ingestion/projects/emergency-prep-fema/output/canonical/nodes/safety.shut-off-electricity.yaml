markdown_body: '# What this is

  This guide explains how to safely shut off electricity in your home by locating
  the circuit box and instructing household members on the procedure.


  # Why it matters

  Knowing how to shut off electricity is crucial during emergencies or when performing
  electrical repairs, ensuring safety and preventing accidents.


  # What you need

  No special tools are required, but familiarity with your home''s circuit box is
  essential.


  # How to do it

  1. Locate your electricity circuit box.

  2. Teach all responsible household members how to shut off the electricity to the
  entire house.

  3. Always shut off all the individual circuits before shutting off the main circuit
  breaker.


  # Common failure modes

  Failing to shut off individual circuits before the main breaker can cause electrical
  hazards.


  # Safety/boundary notes

  Ensure all individual circuits are shut off before the main breaker to prevent electrical
  surges or accidents.


  # Local adaptation notes

  Consider labeling circuits clearly for easier identification by all household members.'
