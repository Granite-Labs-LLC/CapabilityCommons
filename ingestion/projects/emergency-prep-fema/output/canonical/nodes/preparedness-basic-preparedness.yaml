summary_medium: This module provides worksheets and guidance for creating a community-based
  emergency plan, focusing on hazard identification, evacuation routes, communication
  strategies, and disaster supplies checklists.
summary_short: Develop a community-based emergency plan with worksheets and guidance.
version_no: 1
