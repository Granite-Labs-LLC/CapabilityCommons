markdown_body: "### What this is\nThis module helps you create a comprehensive emergency\
  \ plan using worksheets and checklists. It focuses on identifying community hazards,\
  \ planning evacuation routes, establishing communication strategies, and preparing\
  \ a disaster supplies kit.\n\n### Why it matters\nHaving a well-prepared emergency\
  \ plan can significantly reduce the risks and impacts of disasters on you and your\
  \ family. It ensures you know what to do, where to go, and how to communicate during\
  \ emergencies.\n\n### What you need\nTo get started, you need to gather information\
  \ about potential hazards, develop an emergency plan, and assemble a disaster supplies\
  \ kit.\n\n### How to do it\n1. Get informed about hazards that may affect you. \n\
  2. Develop an emergency plan that includes evacuation routes and communication strategies.\
  \ \n3. Assemble a disaster supplies kit with essentials like food, water, and medical\
  \ supplies. \n4. Identify community warning systems and shelters. \n5. Practice\
  \ your plan regularly to ensure everyone knows what to do.\n\n### Common failure\
  \ modes\nCommon issues include having an incomplete emergency plan, not practicing\
  \ the plan, and failing to update the plan with current information.\n\n### Safety/boundary\
  \ notes\nEnsure your plan includes safe evacuation routes and that all family members\
  \ are aware of them.\n\n### Local adaptation notes\nAdapt your plan to include community-specific\
  \ evacuation routes and local warning systems."
plain_language: Learn how to prepare for emergencies by identifying local hazards,
  planning evacuation routes, setting up communication plans, and assembling a disaster
  supplies kit.
