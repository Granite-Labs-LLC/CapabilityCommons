bundle_overrides:
  hook: Being prepared for emergencies can save lives and reduce the impact of disasters
    on you and your family.
  primer: Basic preparedness involves creating a comprehensive emergency plan that
    can be adapted to various hazards. This includes identifying potential community
    hazards, planning evacuation routes, establishing communication strategies, and
    assembling a disaster supplies kit. Understanding the risks specific to your area
    is crucial, as it allows you to tailor your plan to address those threats effectively.
    A well-prepared plan ensures that you and your family know what to do, where to
    go, and how to communicate during emergencies. It is important to regularly practice
    and update your plan to ensure its effectiveness. This module provides worksheets
    and checklists to guide you through the process of gathering necessary information
    and developing a robust emergency plan.
  guide: "1. **Get Informed**: Start by researching the types of hazards that could\
    \ affect your community. This includes natural disasters like floods, earthquakes,\
    \ or hurricanes, as well as man-made hazards such as chemical spills or power\
    \ outages. \n\n2. **Develop an Emergency Plan**: Create a plan that includes evacuation\
    \ routes and communication strategies. Identify safe places to go and how to get\
    \ there. Make sure everyone in your household knows the plan and their role in\
    \ it. \n\n3. **Assemble a Disaster Supplies Kit**: Gather essential items such\
    \ as food, water, medical supplies, flashlights, batteries, and important documents.\
    \ Ensure the kit is easily accessible and regularly check its contents for expiration\
    \ dates. \n\n4. **Identify Community Warning Systems and Shelters**: Learn about\
    \ local warning systems and the locations of community shelters. This information\
    \ should be included in your emergency plan. \n\n5. **Practice Your Plan**: Conduct\
    \ regular drills with your family to ensure everyone knows what to do in an emergency.\
    \ Update your plan as needed to incorporate any changes in your community or household.\
    \ \n\n6. **Consider Special Needs**: Make sure your plan accounts for any special\
    \ needs, such as disabilities or pets. Ensure that all necessary accommodations\
    \ are included in your preparations."
  reference:
  - Identify potential community hazards.
  - Plan evacuation routes.
  - Establish communication strategies.
  - Assemble a disaster supplies kit.
  - Identify community warning systems and shelters.
  - Practice and update your emergency plan regularly.
  - Consider special needs and accommodations.
  worksheet:
  - List potential hazards in your community.
  - Map out evacuation routes from your home.
  - Create a communication plan with contact information.
  - Inventory items for your disaster supplies kit.
  - Identify local warning systems and shelter locations.
  - Schedule a family drill to practice your emergency plan.
  teach_forward_kit:
    three_minute_version: Prepare for emergencies by identifying local hazards, planning
      evacuation routes, setting up communication plans, and assembling a disaster
      supplies kit. Regular practice and updates ensure your plan remains effective.
    ten_minute_outline:
    - Introduction to basic preparedness and its importance.
    - Steps to identify community hazards.
    - How to develop an emergency plan.
    - Assembling a disaster supplies kit.
    - Understanding community warning systems and shelters.
    - Importance of practicing and updating the plan.
    - Considerations for special needs and accommodations.
    discussion_prompts:
    - What are the most common hazards in your area?
    - How can you ensure your emergency plan is effective?
    - What challenges might you face in assembling a disaster supplies kit?
    - How can you involve your community in preparedness efforts?
    - What special considerations should be made for vulnerable populations?
