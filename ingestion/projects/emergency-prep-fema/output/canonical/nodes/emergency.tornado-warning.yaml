summary_short: Take immediate shelter during a tornado warning.
summary_medium: Instructions for immediate action when a tornado warning is issued,
  including taking shelter.
plain_language: If a tornado warning is issued, it means a tornado has been seen or
  detected by radar. You should go to a safe place immediately.
markdown_body: '### What this is

  A tornado warning means that a tornado has been sighted or detected by weather radar.
  It is a signal to take immediate action to protect yourself.


  ### Why it matters

  Tornadoes can cause significant damage and pose a serious threat to life. Taking
  immediate shelter can greatly reduce the risk of injury or death.


  ### What you need

  A safe location, such as a basement or an interior room on the lowest floor of a
  sturdy building, away from windows.


  ### How to do it

  Upon receiving a tornado warning, immediately move to your designated safe area.
  Avoid windows and cover yourself with a mattress or heavy blankets if possible.


  ### Common failure modes

  Delaying taking shelter or ignoring the warning can lead to increased risk of injury.


  ### Safety/boundary notes

  Ensure your safe area is accessible and free of hazards. Do not leave your shelter
  until the warning has been lifted.


  ### Local adaptation notes

  Adapt your shelter plan based on your local environment and building structures.'
