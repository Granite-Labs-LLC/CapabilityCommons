summary_short: An aftershock is an earthquake that follows the main earthquake.
summary_medium: An aftershock is an earthquake of similar or lesser intensity that
  occurs after the main earthquake.
plain_language: Aftershocks are smaller earthquakes that happen after the main earthquake.
  They can be less intense but still cause damage.
markdown_body: '### What this is

  An aftershock is an earthquake that occurs after the main seismic event. It is typically
  of similar or lesser intensity compared to the main earthquake.


  ### Why it matters

  Aftershocks can cause additional damage to structures weakened by the main earthquake.
  Understanding aftershocks helps in assessing ongoing risks and planning for safety.


  ### What you need

  Knowledge of the main earthquake''s impact and preparedness for potential further
  seismic activity.


  ### How to do it

  Monitor seismic activity reports and follow safety guidelines to protect yourself
  during aftershocks. Secure loose items and stay away from damaged structures.


  ### Common failure modes

  Underestimating the potential intensity of aftershocks and failing to take necessary
  precautions can lead to increased risk of injury or damage.


  ### Safety/boundary notes

  Always be prepared for aftershocks following a major earthquake. Stay informed through
  reliable sources and adhere to safety protocols.


  ### Local adaptation notes

  In areas prone to earthquakes, local building codes and emergency plans may include
  specific measures for aftershock preparedness.'
