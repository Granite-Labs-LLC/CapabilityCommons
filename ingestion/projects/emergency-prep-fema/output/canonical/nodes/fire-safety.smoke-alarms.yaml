bundle_overrides:
  hook: Properly working smoke alarms can cut your risk of dying in a fire by half,
    making them a crucial part of home safety.
  primer: Smoke alarms are vital devices that alert you to the presence of smoke,
    often indicating a fire. They are designed to provide an early warning, allowing
    you and your family to escape safely. Installing smoke alarms on every level of
    your home, particularly outside sleeping areas, is essential. They should be placed
    on the ceiling or high on the wall, 4 to 12 inches from the ceiling, to function
    optimally. Regular maintenance is key to ensuring they work correctly; this includes
    testing and cleaning them monthly, replacing batteries annually, and replacing
    the entire unit every 10 years. Proper placement is also crucial to avoid false
    alarms, especially near kitchens. By following these guidelines, you can significantly
    enhance your home's fire safety.
  guide: "1. **Gather Materials**: You will need smoke alarms and batteries. \n2.\
    \ **Choose Locations**: Install smoke alarms on every level of your home, especially\
    \ outside bedrooms. Place them on the ceiling or high on the wall, 4 to 12 inches\
    \ from the ceiling. Avoid placing them too close to the kitchen to prevent false\
    \ alarms. \n3. **Install Smoke Alarms**: Follow the manufacturer's instructions\
    \ for installation. Use a drill to secure the mounting bracket to the wall or\
    \ ceiling, then attach the smoke alarm. \n4. **Test Alarms Monthly**: Press the\
    \ test button on each smoke alarm to ensure it sounds. If it doesn't, replace\
    \ the batteries or the unit if necessary. \n5. **Clean Alarms Monthly**: Use a\
    \ vacuum cleaner to remove dust from the vents. This helps maintain sensitivity\
    \ and functionality. \n6. **Replace Batteries Annually**: Even if the alarm doesn't\
    \ chirp, replace the batteries at least once a year to ensure reliability. \n\
    7. **Replace Units Every 10 Years**: Smoke alarms lose their effectiveness over\
    \ time. Mark the installation date on the unit and replace it after 10 years."
  reference:
  - Install smoke alarms on every level of your home.
  - Place alarms outside bedrooms, on the ceiling or high on the wall.
  - Test and clean alarms monthly.
  - Replace batteries annually.
  - Replace smoke alarm units every 10 years.
  - Avoid placing alarms too close to the kitchen.
  worksheet:
  - Identify and list all the locations in your home where smoke alarms are needed.
  - Test each smoke alarm in your home and record the results.
  - Create a maintenance schedule for testing, cleaning, and replacing batteries in
    your smoke alarms.
  - Research local building codes regarding smoke alarm installation and note any
    specific requirements.
  - Simulate a fire drill with your family to ensure everyone knows the sound of the
    alarm and the escape plan.
