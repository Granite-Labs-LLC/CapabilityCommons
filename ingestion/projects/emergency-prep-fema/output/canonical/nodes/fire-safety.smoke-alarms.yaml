markdown_body: '### What this is

  This guide provides instructions on how to install and maintain smoke alarms in
  your home to enhance fire safety.


  ### Why it matters

  Properly working smoke alarms can decrease your chances of dying in a fire by half.
  They provide early warning, allowing you to escape safely.


  ### What you need

  You will need smoke alarms and batteries.


  ### How to do it

  Install smoke alarms on every level of your home, especially outside bedrooms. Place
  them on the ceiling or high on the wall, 4 to 12 inches from the ceiling. Test and
  clean your smoke alarms monthly and replace the batteries at least once a year.
  Replace the entire smoke alarm unit every 10 years.


  ### Common failure modes

  Smoke alarms may become non-functional if not tested regularly or if batteries are
  not replaced. Alarms can also expire after 10 years.


  ### Safety/boundary notes

  Ensure smoke alarms are placed correctly to avoid false alarms, especially near
  kitchens.


  ### Local adaptation notes

  Consider local building codes and regulations when installing smoke alarms.'
