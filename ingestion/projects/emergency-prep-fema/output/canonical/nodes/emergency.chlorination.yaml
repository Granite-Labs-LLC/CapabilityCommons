bundle_overrides:
  hook: In emergencies, clean drinking water is crucial. Learn how to use household
    bleach to make water safe and prevent waterborne diseases.
  primer: In emergency situations, access to clean drinking water can be severely
    limited. Contaminated water can harbor harmful microorganisms that cause diseases
    such as dysentery, cholera, and typhoid. Chlorination is a simple, effective method
    to disinfect water and make it safe for consumption. This process involves using
    household liquid bleach, which contains sodium hypochlorite, to kill these microorganisms.
    It's important to use only unscented, regular household bleach with a concentration
    of 5.25 to 6.0 percent sodium hypochlorite. Avoid using scented, color-safe, or
    bleach with added cleaners, as these can be ineffective or harmful. By following
    the correct procedure, you can ensure that your water is safe to drink, even in
    challenging conditions.
  guide: "To disinfect water using household bleach, follow these steps: \n\n1. Gather\
    \ your materials: regular household liquid bleach (5.25 to 6.0 percent sodium\
    \ hypochlorite), a measuring spoon, and a stirring utensil. \n\n2. Ensure the\
    \ bleach is unscented and does not have added cleaners. Check that it is not expired,\
    \ as the potency diminishes over time. \n\n3. Add 16 drops (or 1/8 teaspoon) of\
    \ bleach per gallon of water. \n\n4. Stir the water thoroughly to ensure the bleach\
    \ is evenly distributed. \n\n5. Let the water stand for 30 minutes. This allows\
    \ the bleach to effectively kill harmful microorganisms. \n\n6. After 30 minutes,\
    \ check the water for a slight bleach odor. This indicates that the water has\
    \ been properly disinfected. \n\n7. If there is no bleach odor, repeat the dosage\
    \ and let it stand for another 15 minutes. \n\n8. If the water still does not\
    \ smell of chlorine after the second treatment, discard it and find another water\
    \ source. \n\nBy following these steps, you can ensure that your water is safe\
    \ to drink during emergencies."
  reference:
  - Use regular household liquid bleach (5.25 to 6.0% sodium hypochlorite).
  - Avoid scented, color-safe, or bleach with added cleaners.
  - Add 16 drops (1/8 teaspoon) of bleach per gallon of water.
  - Stir and let stand for 30 minutes.
  - Water should have a slight bleach odor.
  - Repeat dosage if no odor, then wait 15 more minutes.
  - Discard water if no odor after two treatments.
  worksheet:
  - Identify the correct type of bleach to use for water chlorination.
  - Calculate the amount of bleach needed for 3 gallons of water.
  - Practice the steps of adding bleach and stirring water.
  - Simulate checking for a bleach odor in treated water.
  - Discuss what to do if the water does not smell of chlorine after treatment.
  teach_forward_kit:
    three_minute_version: In emergencies, use regular household bleach to disinfect
      water. Add 16 drops per gallon, stir, and let it stand for 30 minutes. Ensure
      a slight bleach odor is present to confirm safety.
