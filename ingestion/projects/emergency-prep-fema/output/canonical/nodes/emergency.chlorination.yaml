plain_language: Learn how to safely use household bleach to make water safe to drink
  in an emergency by killing harmful microorganisms.
markdown_body: '### What this is

  This guide explains how to use household liquid bleach to disinfect water, making
  it safe to drink during emergencies by killing harmful microorganisms.


  ### Why it matters

  In emergency situations, access to clean drinking water may be limited. Chlorination
  is a simple and effective method to ensure water safety, preventing waterborne diseases.


  ### What you need

  You will need regular household liquid bleach (5.25 to 6.0 percent sodium hypochlorite),
  a measuring spoon, and a stirring utensil.


  ### How to do it

  1. Use only regular household liquid bleach with 5.25 to 6.0 percent sodium hypochlorite.
  Avoid scented, color-safe, or bleach with added cleaners.

  2. Add 16 drops (1/8 teaspoon) of bleach per gallon of water.

  3. Stir the water and let it stand for 30 minutes.

  4. The water should have a slight bleach odor. If not, repeat the dosage and let
  it stand for another 15 minutes. If it still does not smell of chlorine, discard
  it and find another water source.


  ### Common failure modes

  Using scented or color-safe bleach, using bleach with added cleaners, using expired
  bleach, or incorrect dosage can lead to ineffective disinfection.


  ### Safety/boundary notes

  Ensure the bleach used is within the specified concentration range and is not expired.
  Do not use other chemicals like iodine or non-recommended water treatment products.


  ### Local adaptation notes

  Availability of regular household bleach may vary; ensure you have access to the
  correct type of bleach.'
