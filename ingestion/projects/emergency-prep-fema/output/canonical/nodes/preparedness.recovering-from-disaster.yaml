bundle_overrides:
  hook: Understanding how to recover from disasters is essential for minimizing long-term
    impacts and restoring normalcy in communities.
  primer: Disasters, whether natural or man-made, can have devastating effects on
    individuals and communities. Recovering from such events involves both immediate
    actions and long-term strategies to ensure safety and return to normal life. Immediate
    actions include assessing personal safety, contacting local authorities, and documenting
    damages for insurance claims. Long-term recovery involves accessing community
    resources, developing a recovery plan, and addressing mental health needs. Awareness
    of local resources and support services is crucial in this process. By preparing
    and understanding recovery strategies, individuals can reduce fear, anxiety, and
    losses associated with disasters.
  guide: "1. **Ensure Immediate Safety**: Before beginning any recovery efforts, make\
    \ sure you and your family are safe. Follow guidance from local authorities and\
    \ stay informed about any ongoing risks. \n\n2. **Contact Local Authorities**:\
    \ Reach out to local emergency services for assistance and updates. They can provide\
    \ crucial information and support during the recovery process. \n\n3. **Document\
    \ Damages**: Take photos and notes of any damages to your property. This documentation\
    \ is essential for insurance claims and assessing the extent of recovery needed.\
    \ \n\n4. **Access Community Resources**: Utilize local resources such as shelters,\
    \ food banks, and community support services. These resources can provide immediate\
    \ relief and support. \n\n5. **Develop a Long-term Recovery Plan**: Create a plan\
    \ that outlines steps for rebuilding and returning to normal life. This plan should\
    \ include financial considerations, mental health support, and community engagement.\
    \ \n\n6. **Address Mental Health**: Disasters can have a significant impact on\
    \ mental health. Seek support from mental health professionals or community groups\
    \ to help cope with stress and trauma."
  reference:
  - Ensure personal safety before starting recovery.
  - Contact local authorities for assistance.
  - Document damages for insurance claims.
  - Access community resources for support.
  - Develop a long-term recovery plan.
  - Address mental health needs.
  worksheet:
