    - Introduction to disaster recovery
    - Immediate actions post-disaster
    - Importance of documentation
    - Utilizing community resources
    - Developing a long-term recovery plan
    - Mental health considerations
    discussion_prompts:
    - Why is it important to document damages immediately after a disaster?
    - How can community resources aid in disaster recovery?
    - What are some challenges you might face in developing a long-term recovery plan?
    - Discuss the role of mental health support in disaster recovery.
