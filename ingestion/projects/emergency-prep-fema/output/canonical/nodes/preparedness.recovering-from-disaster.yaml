markdown_body: "# What this is\nThis module offers a comprehensive guide to recovering\
  \ from disasters, focusing on both immediate actions and long-term recovery strategies.\n\
  \n# Why it matters\nUnderstanding how to recover from disasters is crucial for minimizing\
  \ long-term impacts on individuals and communities, ensuring safety, and restoring\
  \ normalcy.\n\n# What you need\nAwareness of local resources, a recovery plan, and\
  \ access to support services.\n\n# How to do it\n1. Assess immediate needs and ensure\
  \ safety. \n2. Contact local authorities for assistance. \n3. Document damages for\
  \ insurance claims. \n4. Access community resources for recovery support. \n5. Develop\
  \ a long-term recovery plan.\n\n# Common failure modes\nFailing to document damages,\
  \ not seeking available resources, and neglecting mental health during recovery.\n\
  \n# Safety/boundary notes\nEnsure personal safety before beginning recovery efforts.\
  \ Follow local authority guidance.\n\n# Local adaptation notes\nAdapt recovery strategies\
  \ based on local resources and community support systems."
