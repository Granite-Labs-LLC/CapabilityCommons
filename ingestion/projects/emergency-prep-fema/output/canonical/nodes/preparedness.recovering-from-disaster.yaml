  - Identify local resources available in your community for disaster recovery.
  - Create a checklist for documenting damages to your property.
  - Outline a basic long-term recovery plan for your household.
  - Discuss the importance of mental health support during recovery.
  teach_forward_kit:
    three_minute_version: Recovering from disasters involves ensuring immediate safety,
      documenting damages, accessing local resources, and developing a long-term recovery
      plan. It's crucial to follow local authority guidance and address mental health
      needs.
