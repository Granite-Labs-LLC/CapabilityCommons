summary_short: Guidelines for understanding school emergency plans.
summary_medium: Guidelines for understanding and engaging with school emergency plans,
  including communication, supplies, and shelter-in-place procedures.
plain_language: Learn how to understand and engage with your children's school emergency
  plans, focusing on communication, supplies, and shelter-in-place procedures.
markdown_body: "# What this is\nThis reference sheet provides guidance on understanding\
  \ and engaging with school emergency plans. It covers key aspects such as communication\
  \ methods, supplies, and shelter-in-place procedures.\n\n# Why it matters\nKnowing\
  \ the school's emergency plan helps ensure the safety of your children during a\
  \ crisis. It prepares you to respond appropriately and ensures you understand the\
  \ school's procedures.\n\n# What you need\nYou need to ask the school about their\
  \ communication methods, available supplies, and shelter-in-place procedures.\n\n\
  # How to do it\n1. Ask the school how they will communicate with families during\
  \ a crisis. \n2. Inquire if the school has adequate food, water, and other basic\
  \ supplies. \n3. Understand the school's shelter-in-place procedures and their evacuation\
  \ plans.\n\n# Common failure modes\nInadequate communication, insufficient supplies,\
  \ and locked access during emergencies can hinder effective response.\n\n# Safety/boundary\
  \ notes\nDuring shelter-in-place procedures, you may not be able to pick up your\
  \ children as the school may lock doors for safety.\n\n# Local adaptation notes\n\
  Monitor local media for updates on school openings and closings, and follow local\
  \ emergency officials' directions."
structured_data:
  definition: A school emergency plan outlines procedures for communication, supplies,
    and shelter-in-place during a crisis.
  key_questions:
  - How will the school communicate with families during a crisis?
  - Does the school have adequate supplies for emergencies?
  - What are the school's shelter-in-place and evacuation procedures?
  misconceptions:
  - Parents can always pick up their children during an emergency.
  - Schools will have unlimited supplies during a crisis.
