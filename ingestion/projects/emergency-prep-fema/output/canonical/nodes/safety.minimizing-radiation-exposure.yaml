plain_language: This guide explains how to reduce your exposure to radiation by increasing
  distance, using shielding, and minimizing time near the source.
markdown_body: '### What this is

  This reference sheet provides guidelines on how to minimize exposure to radiation
  in the event of an accident or emergency involving radioactive materials.


  ### Why it matters

  Radiation can be harmful to human health. Understanding how to reduce exposure can
  help protect you and your family during a radiation emergency.


  ### What you need

  Awareness of local emergency procedures and access to emergency alerts via television
  or radio.


  ### How to do it

  - **Distance**: Increase the distance between yourself and the source of radiation.
  This can be achieved by evacuating the area or staying indoors if evacuation is
  not possible.

  - **Shielding**: Use heavy, dense materials to shield yourself from radiation. Buildings
  and other structures can provide effective shielding.

  - **Time**: Limit the time spent near the source of radiation, as most radioactive
  materials lose their strength over time.


  ### Common failure modes

  - Failing to follow evacuation orders promptly.

  - Not using available shielding effectively.

  - Misjudging the time needed to stay away from the source.


  ### Safety/boundary notes

  Always follow instructions from local authorities and use the Emergency Alert System
  for guidance.


  ### Local adaptation notes

  Local authorities may have specific procedures and resources available. Stay informed
  about local emergency plans.'
