summary_short: Guidelines for identifying suspicious parcels.
summary_medium: Learn how to identify suspicious parcels using indicators such as
  unexpected origin, lack of return address, and unusual weight.
plain_language: This guide helps you recognize parcels that might be dangerous by
  looking for signs like no return address or strange odors.
markdown_body: '### What this is

  This reference sheet provides guidelines to help you identify parcels that may be
  suspicious or potentially dangerous.


  ### Why it matters

  Recognizing suspicious parcels is crucial for ensuring safety and security, as they
  may contain hazardous materials or be part of malicious activities.


  ### What you need

  Awareness and attention to detail when receiving parcels.


  ### How to do it

  Check for indicators such as unexpected origin, lack of return address, restrictive
  endorsements, unusual weight, inappropriate labeling, excessive postage, and other
  anomalies.


  ### Common failure modes

  Misidentifying parcels as suspicious when they are not, or overlooking key indicators
  that suggest a parcel is suspicious.


  ### Safety/boundary notes

  Always handle suspicious parcels with care and follow organizational protocols for
  reporting and managing them.


  ### Local adaptation notes

  Consider local postal practices and common parcel characteristics when evaluating
  parcels.'
structured_data:
  definition: Suspicious parcels are those that exhibit unusual characteristics or
    indicators that suggest they may be dangerous.
  key_questions:
  - Is the parcel from an unexpected or unfamiliar source?
  - Does the parcel have a return address that cannot be verified?
  - Are there any unusual markings or endorsements on the parcel?
  misconceptions:
  - All parcels with excessive packaging are suspicious.
  - Only parcels with threatening language are dangerous.
