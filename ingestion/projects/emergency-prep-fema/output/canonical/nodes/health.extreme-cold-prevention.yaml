markdown_body: '### What this is

  This guide provides essential information on how to prepare for extreme cold weather.
  It covers safety measures to take both indoors and outdoors and explains health
  conditions that can arise due to cold weather.


  ### Why it matters

  Extreme cold can pose serious health risks, including hypothermia and frostbite.
  Proper preparation and safety measures can prevent these conditions and ensure personal
  safety.


  ### What you need

  Awareness of weather forecasts, appropriate clothing, and a plan for maintaining
  warmth indoors.


  ### How to do it

  1. Plan ahead by checking weather forecasts and preparing your home and vehicle
  for cold conditions. 2. Dress in layers and cover exposed skin when outdoors. 3.
  Ensure your home is properly insulated and heated. 4. Be aware of the signs of hypothermia
  and frostbite.


  ### Common failure modes

  Lack of preparation for cold weather, inadequate clothing, and unsafe indoor heating
  practices.


  ### Safety/boundary notes

  Avoid using outdoor heating devices indoors. Ensure proper ventilation when using
  heaters.


  ### Local adaptation notes

  Consider local climate variations and available resources when planning for cold
  weather.'
