markdown_body: '### What this is

  This fact sheet provides essential safety tips to help individuals prepare for,
  respond to, and recover from tornadoes.


  ### Why it matters

  Tornadoes can cause significant damage and pose serious threats to life and property.
  Being prepared and knowing what actions to take can greatly reduce risks.


  ### What you need

  Access to the Tornado Safety Fact Sheet, awareness of local tornado warnings, and
  a plan for seeking shelter.


  ### How to do it

  Before a tornado, identify a safe place to take shelter, such as a basement or an
  interior room on the lowest floor. During a tornado, go to your identified safe
  place immediately and protect your head. After a tornado, stay informed through
  local news and follow instructions from emergency services.


  ### Common failure modes

  Not following safety tips, failing to seek shelter in a timely manner, and not staying
  informed about weather conditions.


  ### Safety/boundary notes

  Ensure that your chosen shelter area is free from windows and potential flying debris.


  ### Local adaptation notes

  Adapt safety plans based on local building structures and available shelter options.'
