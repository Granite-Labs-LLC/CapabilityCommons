summary_short: Sun stroke, also known as heat stroke, is a serious condition caused
  by excessive exposure to high temperatures.
summary_medium: Sun stroke, or heat stroke, is a critical health condition resulting
  from prolonged exposure to high temperatures, leading to the body's inability to
  regulate its temperature.
plain_language: Sun stroke happens when you are exposed to high temperatures for too
  long, and your body can't cool down. It's a serious condition that needs immediate
  attention.
markdown_body: '### What this is

  Sun stroke, also known as heat stroke, is a severe medical condition that occurs
  when the body overheats due to prolonged exposure to high temperatures. It is characterized
  by the body''s inability to regulate its temperature, leading to a rapid increase
  in body temperature.


  ### Why it matters

  Sun stroke is a life-threatening condition that requires immediate medical attention.
  If not treated promptly, it can cause damage to the brain and other vital organs,
  and in extreme cases, it can be fatal.


  ### What you need

  Awareness of the symptoms of sun stroke and knowledge of first aid measures are
  crucial. Staying hydrated and avoiding prolonged exposure to high temperatures can
  help prevent sun stroke.


  ### How to do it

  To prevent sun stroke, avoid strenuous activities during the hottest parts of the
  day, wear lightweight and light-colored clothing, and stay hydrated. If you suspect
  someone has sun stroke, move them to a cooler place, apply cool water to their skin,
  and seek medical help immediately.


  ### Common failure modes

  Ignoring early symptoms of heat-related illnesses, such as heat exhaustion, can
  lead to sun stroke. Not taking preventive measures during heat waves increases the
  risk.


  ### Safety/boundary notes

  Always prioritize staying cool and hydrated during hot weather. Recognize the signs
  of heat exhaustion and act quickly to prevent escalation to sun stroke.


  ### Local adaptation notes

  In regions with extreme heat, local guidelines may provide additional preventive
  measures and resources for dealing with heat-related illnesses.'
