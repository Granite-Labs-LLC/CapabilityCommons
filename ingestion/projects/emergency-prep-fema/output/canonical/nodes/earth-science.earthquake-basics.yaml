summary_short: An overview of earthquakes and their causes.
summary_medium: An overview of earthquakes, describing their causes, the role of plate
  tectonics, and potential impacts on populated areas.
plain_language: Earthquakes are sudden movements of the Earth's surface caused by
  the release of energy from the Earth's crust. They are often the result of the movement
  of tectonic plates.
markdown_body: '# What this is

  An earthquake is a sudden movement of the Earth''s surface caused by the abrupt
  release of energy that has accumulated over time.


  # Why it matters

  Earthquakes can be extremely destructive, especially in populated areas, leading
  to loss of life, injuries, and significant property damage.


  # What you need

  Understanding the basic causes and effects of earthquakes can help in preparing
  for and mitigating their impacts.


  # How to do it

  Learn about the movement of tectonic plates and how their interactions can lead
  to earthquakes. Recognize the signs of potential earthquakes and understand safety
  measures.


  # Common failure modes

  Ignoring the signs of potential earthquakes or failing to prepare adequately can
  lead to increased risk during an event.


  # Safety/boundary notes

  Ensure that you have a safety plan in place if you live in an earthquake-prone area.


  # Local adaptation notes

  Consider local building codes and safety regulations that are designed to minimize
  earthquake damage.'
structured_data:
  definition: An earthquake is a sudden shaking of the ground caused by the movement
    of the Earth's tectonic plates.
  key_questions:
  - What causes an earthquake?
  - How do tectonic plates contribute to earthquakes?
  - What are the potential impacts of an earthquake in populated areas?
  misconceptions:
  - Earthquakes only happen in certain parts of the world.
  - All earthquakes cause significant damage.
