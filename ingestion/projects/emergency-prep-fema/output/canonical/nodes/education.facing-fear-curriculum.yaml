  worksheet:
  - List three things that make you feel safe when you hear about scary events.
  - Write a short paragraph about a time you felt scared and how you overcame that
    fear.
  - Draw a picture of a place where you feel safe and explain why.
  - Role-play a scenario where you help a friend who is feeling anxious about a news
    event.
  - Identify and list three coping strategies you can use when you feel anxious.
  teach_forward_kit:
    three_minute_version: Facing Fear is a curriculum by the American Red Cross designed
      to help young people manage fears related to terrorism and tragic events. It
      provides clear information and coping strategies to reduce anxiety and confusion
      about safety threats.
    ten_minute_outline:
    - Introduction to Facing Fear and its purpose
    - Accessing the curriculum materials
    - Creating a supportive classroom environment
    - Implementing activities and discussions
    - Teaching coping strategies
    - Evaluating student understanding
    - Adapting resources to local needs
    discussion_prompts:
    - How do you feel when you hear about tragic events in the news?
    - What are some ways we can support each other when we're feeling scared?
    - Why is it important to understand the difference between perceived and actual
      threats?
    - How can coping strategies help us manage our fears?
    - What role do educators play in helping students feel safe?
