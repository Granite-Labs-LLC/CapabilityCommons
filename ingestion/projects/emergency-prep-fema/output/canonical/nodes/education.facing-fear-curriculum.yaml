bundle_overrides:
  hook: In a world where young people are frequently exposed to news of terrorism
    and tragic events, the Facing Fear curriculum empowers them to manage their fears
    and understand safety threats.
  primer: Facing Fear is a curriculum developed by the American Red Cross to help
    young people navigate their emotions and fears related to terrorism and tragic
    events. With the constant stream of news and information, children and teenagers
    can often feel overwhelmed and anxious about their safety and the safety of their
    loved ones. This curriculum provides a structured approach to addressing these
    fears by offering clear information and practical coping strategies. It is designed
    to be implemented in school settings, where educators can guide discussions and
    activities that help students process their emotions and gain a better understanding
    of perceived and actual threats to safety. The materials are accessible online
    or through local Red Cross chapters, ensuring that educators have the resources
    they need to support their students effectively. By following the curriculum guidelines,
    educators can create a safe environment where students feel comfortable expressing
    their feelings and learning how to manage their fears.
  guide: '1. **Access the Materials**: Obtain the Facing Fear curriculum materials
    online at www.redcross.org/disaster/masters/facingfear or contact your local Red
    Cross chapter for physical copies.


    2. **Prepare the Environment**: Ensure the classroom is a safe and supportive
    space for open discussions. Set ground rules for respectful communication and
    confidentiality.


    3. **Introduce the Topic**: Begin with a discussion about current events related
    to terrorism and tragic events. Gauge students'' understanding and feelings about
    these topics.


    4. **Use Curriculum Activities**: Follow the curriculum''s structured activities
    and discussions. These may include role-playing scenarios, group discussions,
    and individual reflection exercises.


    5. **Facilitate Discussions**: Encourage students to share their thoughts and
    feelings. Use guided questions to help them articulate their fears and understand
    the difference between perceived and actual threats.


    6. **Teach Coping Strategies**: Introduce coping mechanisms such as deep breathing,
    mindfulness, and positive thinking. Encourage students to practice these strategies
    in and out of the classroom.


    7. **Evaluate Understanding**: Assess students'' understanding through discussions
    and feedback. Look for signs of reduced anxiety and improved comprehension of
    safety threats.


    8. **Provide Support**: Be available for one-on-one discussions with students
    who may need additional support. Refer them to school counselors if necessary.


    9. **Adapt to Local Needs**: Contact your local Red Cross chapter for additional
    resources or support tailored to your community''s specific needs.'
