markdown_body: '### What this is

  Facing Fear is a school curriculum developed by the American Red Cross. It is designed
  to help young people understand and manage their fears related to terrorism and
  tragic events.


  ### Why it matters

  In today''s world, young people are often exposed to news about terrorism and tragic
  events, which can lead to anxiety and confusion. This curriculum aims to alleviate
  these worries by providing clear information and coping strategies.


  ### What you need

  Access to the curriculum materials, which can be found online or through your local
  Red Cross chapter.


  ### How to do it

  Implement the curriculum in a school setting, using the provided materials to guide
  discussions and activities that help students process their emotions and understand
  safety threats.


  ### Common failure modes

  If not properly addressed, discussing these topics can increase anxiety among students.
  It''s important to follow the curriculum guidelines closely.


  ### Safety/boundary notes

  Ensure that discussions are age-appropriate and that students feel safe expressing
  their feelings.


  ### Local adaptation notes

  Contact your local Red Cross chapter for additional resources or support tailored
  to your community.'
