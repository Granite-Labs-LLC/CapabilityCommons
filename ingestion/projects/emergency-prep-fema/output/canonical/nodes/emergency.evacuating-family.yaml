bundle_overrides:
  hook: In an emergency, knowing how to evacuate quickly and safely can be the difference
    between safety and danger for you and your family.
  primer: Evacuating yourself and your family during emergencies is a critical skill
    that can protect you from harm. Emergencies can happen at any time, and being
    prepared can make a significant difference in your safety. This guide focuses
    on understanding local warnings, planning for different hazards, and ensuring
    you have the necessary tools and plans in place. Local officials will provide
    information through media channels, and it's important to monitor these for evacuation
    orders. Having an emergency kit ready and knowing your evacuation routes in advance
    are key components of a successful evacuation plan. Common mistakes include not
    having enough preparation time and being unaware of local warnings, which can
    lead to dangerous delays. By understanding the types of hazards common in your
    area and adapting your plan accordingly, you can ensure a safer evacuation process.
  guide: '1. **Stay Informed**: Regularly monitor local media outlets for any updates
    on potential emergencies or evacuation orders. This includes radio, television,
    and official social media channels.


    2. **Understand Local Warnings**: Familiarize yourself with the warning systems
    used in your community, such as sirens or emergency alerts on your phone. Respond
    promptly to any alerts or instructions from local officials.


    3. **Prepare an Emergency Kit**: Assemble a kit that includes essentials such
    as water, non-perishable food, a flashlight, batteries, a first-aid kit, and any
    necessary medications. Ensure that this kit is easily accessible.


    4. **Plan Your Evacuation Route**: Identify multiple evacuation routes from your
    home to a safe location. Avoid shortcuts as they may be blocked. Practice these
    routes with your family to ensure everyone is familiar with them.


    5. **Communicate with Family Members**: Establish a communication plan with your
    family. Decide on a meeting point and ensure everyone knows how to reach it. Keep
    communication devices charged and ready.


    6. **Act Promptly**: If an evacuation order is given, do not delay. Gather your
    family and emergency kit, and leave immediately. Follow the recommended routes
    and instructions from local authorities.


    7. **Adapt Your Plan**: Be aware of the specific hazards in your area, such as
    floods, hurricanes, or wildfires, and adjust your evacuation plan accordingly.
    This may include considering public transportation options or potential traffic
    congestion in urban areas.'
  reference:
  - Monitor local media for evacuation orders.
  - Respond to sirens or calls from local officials.
  - Prepare an emergency kit with essentials.
  - Plan evacuation routes in advance.
  - Be aware of the time available based on the hazard.
  - Follow all local evacuation orders promptly.
  - Adapt your plan based on local hazards.
  worksheet:
  - List the local media channels you will monitor for evacuation orders.
  - Identify the warning systems used in your community.
  - Create a checklist for your emergency kit.
  - Map out at least two evacuation routes from your home.
  - Discuss and document your family communication plan.
  - Research the common hazards in your area and note any specific preparations needed.
  teach_forward_kit:
    three_minute_version: In emergencies, evacuate promptly by monitoring local media
      for orders, preparing an emergency kit, and knowing your evacuation routes.
      Respond to local warnings and adapt your plan based on local hazards.
    ten_minute_outline:
    - Introduction to the importance of evacuation planning.
    - Understanding local warnings and communication systems.
    - Steps to prepare an emergency kit.
    - Planning and practicing evacuation routes.
    - Family communication strategies during an evacuation.
    - Adapting plans for specific local hazards.
    discussion_prompts:
    - What are the most common hazards in your area, and how do they affect evacuation
      plans?
    - How can you ensure all family members are informed and prepared for an evacuation?
    - What challenges might you face during an evacuation, and how can you overcome
      them?
