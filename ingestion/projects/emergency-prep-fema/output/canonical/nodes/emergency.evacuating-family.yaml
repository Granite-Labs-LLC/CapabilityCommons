markdown_body: '# What this is

  This guide provides instructions on how to safely evacuate yourself and your family
  during community emergencies. It covers understanding local warnings and planning
  for different hazards.


  # Why it matters

  Evacuating promptly and safely can protect you and your family from harm during
  emergencies. Understanding local warnings and having a plan can make a critical
  difference.


  # What you need

  You will need an emergency kit and communication devices to stay informed and prepared.


  # How to do it

  Monitor local media for evacuation orders. Respond to sirens or calls from local
  officials. Plan evacuation routes in advance and ensure your emergency kit is ready.
  Be aware of the time available based on the type of hazard.


  # Common failure modes

  Common mistakes include not having enough preparation time and being unaware of
  local warnings.


  # Safety/boundary notes

  Ensure you follow all local evacuation orders and do not delay leaving if instructed.


  # Local adaptation notes

  Adapt your plan based on local warning systems and the types of hazards common in
  your region.'
