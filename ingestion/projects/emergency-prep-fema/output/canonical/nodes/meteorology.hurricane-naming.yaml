markdown_body: '### What this is

  This concept note explains the process by which Atlantic tropical storms are named,
  including historical changes and criteria for retiring names.


  ### Why it matters

  Naming hurricanes helps in communicating warnings and information about storms effectively.
  It also aids in historical tracking and data collection.


  ### What you need

  An understanding of the naming process and the criteria for name retirement.


  ### How to do it

  The World Meteorological Organization maintains six lists of names that are used
  in rotation for naming Atlantic tropical storms. Names are alternated between male
  and female since 1979. If a storm is particularly deadly or costly, its name is
  retired and replaced.


  ### Common failure modes

  Misunderstanding the criteria for name retirement or the rotation schedule of the
  lists.


  ### Safety/boundary notes

  Ensure accurate communication when discussing storm names to avoid confusion.


  ### Local adaptation notes

  Local meteorological agencies may have additional naming conventions or criteria.'
