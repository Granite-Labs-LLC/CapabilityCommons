markdown_body: '### What this is

  This guide provides steps to obtain and review your insurance policies to ensure
  you have adequate coverage for property, health, and life.


  ### Why it matters

  Having the right insurance coverage is crucial to protect yourself and your family
  from financial loss due to unforeseen hazards.


  ### What you need

  You will need your current insurance policy documents for property, health, and
  life.


  ### How to do it

  1. Obtain insurance if you do not have it.

  2. Review your current policies to check the amount and extent of coverage.

  3. Ensure the coverage meets your needs for all possible hazards.


  ### Common failure modes

  1. Inadequate coverage for potential hazards.

  2. Policies that have expired or are not updated.


  ### Safety/boundary notes

  Ensure that your coverage is compliant with local laws and regulations.


  ### Local adaptation notes

  Check local insurance requirements to ensure compliance and adequacy of coverage.'
