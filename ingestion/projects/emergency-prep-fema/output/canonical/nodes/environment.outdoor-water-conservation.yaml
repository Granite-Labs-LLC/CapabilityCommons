markdown_body: '### What this is

  This reference sheet provides tips for conserving water in outdoor spaces, focusing
  on efficient use of water resources.


  ### Why it matters

  Conserving water outdoors helps reduce water waste, lowers utility bills, and supports
  environmental sustainability, especially in areas prone to drought.


  ### What you need

  To implement these tips, you may need a well pump, native or drought-tolerant plants,
  irrigation devices like drip systems, and mulch.


  ### How to do it

  1. Check your well pump regularly for leaks. If it turns on and off without water
  use, there may be a leak.

  2. Plant native or drought-tolerant plants that require less water once established.
  Group plants with similar water needs together.

  3. Use efficient irrigation systems like drip irrigation or soaker hoses.

  4. Apply mulch to retain soil moisture and reduce weed competition.

  5. Avoid water-intensive recreational toys and ornamental features unless they use
  recycled water.


  ### Common failure modes

  Leaks in water systems and inefficient irrigation can lead to water waste.


  ### Safety/boundary notes


  ### Local adaptation notes

  Consider the availability of native plants and local irrigation practices when applying
  these tips.'
