plain_language: Learn how to stay safe when driving in areas affected by flooding.
  Understand how water depth can affect your vehicle and what precautions to take.
markdown_body: '### What this is

  This reference sheet provides essential safety information for driving in flood
  conditions, highlighting how different water depths affect vehicle control and buoyancy.


  ### Why it matters

  Driving in flood conditions can be extremely dangerous. Understanding the risks
  and how to mitigate them can prevent accidents and save lives.


  ### What you need

  Awareness of your vehicle''s limitations in water and knowledge of local flood conditions.


  ### How to do it

  Avoid driving through floodwaters. If unavoidable, be aware that six inches of water
  can cause loss of control, a foot of water can float many vehicles, and two feet
  of rushing water can carry away most vehicles, including SUVs and pick-ups.


  ### Common failure modes

  Driving into floodwaters can lead to vehicle stalling, loss of control, or the vehicle
  being carried away by the water.


  ### Safety/boundary notes

  Always prioritize personal safety over vehicle safety. If in doubt, do not attempt
  to drive through floodwaters.


  ### Local adaptation notes

  Consider local flood patterns and road conditions when planning travel during flood
  warnings.'
