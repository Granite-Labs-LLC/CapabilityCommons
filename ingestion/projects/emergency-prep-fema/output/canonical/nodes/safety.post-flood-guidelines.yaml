plain_language: After a flood, it's important to ensure your safety by checking water
  safety, avoiding floodwaters, and being cautious of structural damage.
markdown_body: '### What this is

  This reference sheet provides guidelines for ensuring safety and health after a
  flood.


  ### Why it matters

  Floods can leave behind dangerous conditions such as contaminated water, structural
  damage, and health hazards from sewage. Following these guidelines can help prevent
  injury and illness.


  ### What you need

  Awareness of local news reports, caution around floodwaters and damaged structures,
  and cleaning supplies for disinfection.


  ### How to do it

  1. Listen for news reports to confirm the safety of the community''s water supply.

  2. Avoid floodwaters, which may be contaminated or electrically charged.

  3. Be cautious of weakened roads and avoid moving water.

  4. Report downed power lines to the power company.

  5. Only return home when authorities say it''s safe.

  6. Use caution when entering buildings, checking for hidden damage.

  7. Service damaged sewage systems promptly.

  8. Clean and disinfect all items that got wet.


  ### Common failure modes

  Drinking contaminated water, structural collapse, and health hazards from sewage.


  ### Safety/boundary notes

  Avoid entering buildings surrounded by floodwaters and be cautious of hidden structural
  damage.


  ### Local adaptation notes

  Follow local authority guidelines and adapt cleaning and safety measures to available
  resources.'
