plain_language: Learn how to prepare your home for extreme heat by installing air
  conditioners, using window reflectors, and ensuring proper insulation.
markdown_body: '### What this is

  This guide provides steps to prepare your home and yourself for extreme heat conditions,
  ensuring safety and comfort.


  ### Why it matters

  Extreme heat can pose serious health risks, including heat exhaustion and heat stroke.
  Preparing your home can help maintain a safe and comfortable environment during
  heat waves.


  ### What you need

  - Air conditioners

  - Aluminum foil

  - Cardboard

  - Weather-stripping materials

  - Drapes, shades, awnings, or louvers


  ### How to do it

  1. Install window air conditioners snugly and insulate if necessary.

  2. Check air-conditioning ducts for proper insulation.

  3. Use aluminum foil-covered cardboard as temporary window reflectors between windows
  and drapes.

  4. Weather-strip doors and sills to keep cool air in.

  5. Cover windows receiving direct sunlight with drapes, shades, or awnings to reduce
  heat entry.


  ### Common failure modes

  Failing to properly insulate air conditioners or ducts can lead to insufficient
  cooling. Not using window reflectors or weather-stripping can result in heat exposure.


  ### Safety/boundary notes

  Ensure that all installations are secure and do not pose a safety hazard. Consult
  a professional if unsure about installation procedures.


  ### Local adaptation notes

  Consider local climate variations and building regulations when implementing these
  measures.'
