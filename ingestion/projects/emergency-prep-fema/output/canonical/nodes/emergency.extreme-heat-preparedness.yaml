bundle_overrides:
  hook: Extreme heat can pose serious health risks, but with the right preparations,
    you can ensure your home remains a safe and comfortable haven.
  primer: Extreme heat conditions can lead to serious health issues such as heat exhaustion
    and heat stroke. These conditions occur when the body cannot cool itself effectively,
    often due to high temperatures and humidity. Preparing your home for extreme heat
    is crucial to maintaining a safe and comfortable environment. This involves installing
    air conditioners properly, ensuring they are well-insulated, and using materials
    like aluminum foil-covered cardboard to reflect heat away from your home. Weather-stripping
    doors and sills helps keep cool air inside, while covering windows with drapes,
    shades, or awnings reduces heat entry. These measures not only help in maintaining
    a cooler indoor temperature but also reduce the risk of heat-related illnesses.
    By taking these steps, you can protect yourself and your family during heat waves.
  guide: '1. **Install Air Conditioners**: Ensure that window air conditioners are
    installed snugly. Use insulation around the unit to prevent cool air from escaping
    and hot air from entering.


    2. **Check Insulation**: Inspect air-conditioning ducts to ensure they are properly
    insulated. This prevents loss of cool air and improves efficiency.


    3. **Use Window Reflectors**: Create temporary window reflectors using aluminum
    foil-covered cardboard. Place these between windows and drapes to reflect heat
    back outside.


    4. **Weather-strip Doors and Sills**: Apply weather-stripping materials to doors
    and sills. This helps keep cool air inside and prevents hot air from seeping in.


    5. **Cover Windows**: Use drapes, shades, or awnings to cover windows that receive
    direct sunlight. This reduces the amount of heat entering your home.


    6. **Safety Checks**: Ensure all installations are secure and do not pose any
    safety hazards. If unsure about any installation, consult a professional.'
  reference:
