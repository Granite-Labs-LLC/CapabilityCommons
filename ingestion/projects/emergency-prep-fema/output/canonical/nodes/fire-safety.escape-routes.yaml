bundle_overrides:
  hook: A well-practiced fire escape plan can save lives by ensuring everyone knows
    how to exit quickly and safely during a fire.
  primer: Planning and practicing fire escape routes in your home is crucial for ensuring
    safety during a fire emergency. Fires can spread rapidly, leaving little time
    to react. Having a clear, practiced plan helps ensure that everyone in the household
    knows how to exit the building quickly and safely. This involves reviewing your
    home's layout, ensuring that all windows and doors are functional, and considering
    the use of escape ladders for multi-level homes. It's also important to teach
    family members to stay low to the floor during a fire, where the air is safer.
    Regular practice of these escape routes can make a significant difference in an
    emergency, reducing panic and confusion.
  guide: '1. Gather your family and review the layout of your home. Identify at least
    two escape routes from each room, if possible.

    2. Ensure all windows and doors can be opened easily and are not blocked or painted
    shut. Check that escape ladders are available and functional for upper levels.

    3. Practice escaping from each room with your family. Make sure everyone knows
    how to use the escape ladders and open windows and doors.

    4. Teach family members to stay low to the floor during a fire, as smoke rises
    and the air is safer closer to the ground.

    5. Designate a safe meeting place outside the home where everyone will gather
    after escaping.

    6. Regularly review and practice the escape plan, especially with children or
    new household members, to ensure everyone remembers what to do.'
  reference:
  - Review escape routes with your family.
  - Practice escaping from each room.
  - Ensure windows and doors are functional.
  - Consider escape ladders for multi-level homes.
  - Teach family members to stay low to the floor during a fire.
  - Designate a safe meeting place outside.
  worksheet:
  - Draw a floor plan of your home and mark all possible escape routes.
  - List the steps to check if windows and doors are functional.
  - Role-play a fire drill with your family and time how long it takes to reach the
    meeting place.
  - Identify any blocked exits or non-functional escape ladders and plan how to address
    these issues.
  - Discuss and write down the importance of staying low to the floor during a fire.
  teach_forward_kit:
    three_minute_version: Planning and practicing fire escape routes is essential
      for safety during a fire. Ensure all exits are accessible, practice regularly,
      and teach everyone to stay low to the floor.
    ten_minute_outline:
    - Introduction to the importance of fire escape planning.
    - Reviewing home layout and identifying escape routes.
    - Ensuring functionality of windows, doors, and escape ladders.
    - Practicing escape routes with family members.
    - Teaching the importance of staying low during a fire.
    - Designating a safe meeting place outside the home.
    discussion_prompts:
    - Why is it important to have more than one escape route from each room?
    - What challenges might you face during a fire escape, and how can you prepare
      for them?
    - How can regular practice of escape routes benefit your family?
    - What are some common mistakes people make when planning fire escape routes?
