plain_language: This guide helps you plan and practice escape routes in case of a
  fire, ensuring all exits are accessible and everyone knows how to get out safely.
markdown_body: "### What this is\nThis guide provides instructions on how to plan\
  \ and practice fire escape routes in your home to ensure safety during a fire emergency.\n\
  \n### Why it matters\nHaving a well-practiced escape plan can save lives by ensuring\
  \ everyone knows how to exit the building quickly and safely during a fire.\n\n\
  ### What you need\nYou will need to review your home's layout, ensure windows and\
  \ doors are functional, and consider escape ladders for multi-level homes.\n\n###\
  \ How to do it\n1. Review escape routes with your family. \n2. Practice escaping\
  \ from each room. \n3. Ensure windows open easily and are not obstructed. \n4. Consider\
  \ escape ladders for upper levels. \n5. Teach family members to stay low to the\
  \ floor during a fire.\n\n### Common failure modes\nBlocked exits, non-functional\
  \ escape ladders, windows that cannot be opened.\n\n### Safety/boundary notes\n\
  Ensure all escape routes are clear and accessible at all times.\n\n### Local adaptation\
  \ notes\nAdapt the plan based on your home's specific layout and any local building\
  \ codes or safety regulations."
