plain_language: A heat wave happens when there is a long stretch of very hot weather,
  often with a lot of humidity, which can be dangerous for people's health.
markdown_body: '### What this is

  A heat wave is a weather phenomenon characterized by a prolonged period of excessively
  high temperatures, which is often accompanied by high humidity. These conditions
  can last for several days and can significantly impact health and safety.


  ### Why it matters

  Heat waves can pose serious health risks, including heat exhaustion and heat stroke,
  especially for vulnerable populations such as the elderly, children, and those with
  pre-existing health conditions. Understanding what a heat wave is can help in preparing
  and taking necessary precautions to mitigate its effects.


  ### What you need

  Awareness of local weather forecasts, access to cooling resources such as air conditioning
  or fans, and knowledge of symptoms of heat-related illnesses.


  ### How to do it

  Monitor weather reports during the summer months, stay hydrated, avoid strenuous
  activities during peak heat, and ensure access to cool environments. Check on vulnerable
  individuals and follow public health advisories.


  ### Common failure modes

  Ignoring weather warnings, not staying hydrated, and failing to recognize symptoms
  of heat-related illnesses can lead to severe health consequences.


  ### Safety/boundary notes

  Always prioritize staying cool and hydrated. Seek medical attention if symptoms
  of heat exhaustion or heat stroke occur.


  ### Local adaptation notes

  Adapt strategies based on local climate conditions and available resources. Urban
  areas may experience higher temperatures due to the urban heat island effect.'
