plain_language: A hurricane or tropical storm watch means that these weather conditions
  might occur in your area, usually within 36 hours. Stay informed by listening to
  NOAA Weather Radio, commercial radio, or watching television.
markdown_body: '### What this is

  A hurricane or tropical storm watch is an alert issued to inform the public that
  hurricane or tropical storm conditions are possible in a specified area, typically
  within 36 hours.


  ### Why it matters

  Understanding a hurricane or tropical storm watch is crucial for preparing and taking
  necessary precautions to ensure safety and minimize damage.


  ### What you need

  To stay informed, you need access to a NOAA Weather Radio, commercial radio, or
  television.


  ### How to do it

  When a watch is issued, regularly tune in to NOAA Weather Radio, commercial radio,
  or television for updates and instructions from local authorities.


  ### Common failure modes

  Ignoring the watch or failing to stay updated with the latest information can lead
  to inadequate preparation.


  ### Safety/boundary notes

  Ensure that you have a plan in place for quick evacuation if necessary, and keep
  emergency supplies ready.


  ### Local adaptation notes

  Adapt your preparations based on local infrastructure and resources available in
  your area.'
