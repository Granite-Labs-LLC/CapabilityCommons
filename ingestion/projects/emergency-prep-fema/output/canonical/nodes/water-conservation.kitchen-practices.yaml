markdown_body: '### What this is

  This reference sheet offers practical guidelines for reducing water usage in the
  kitchen through efficient practices.


  ### Why it matters

  Conserving water in the kitchen helps reduce utility bills and supports environmental
  sustainability by minimizing water waste.


  ### What you need

  An automatic dishwasher, containers for washing, a pan for cleaning vegetables,
  and a compost pile.


  ### How to do it

  Operate dishwashers only when full and use the ''light wash'' feature. Hand wash
  dishes using two containers: one with soapy water and another for rinsing. Clean
  vegetables in a pan of water instead of under running water. Start a compost pile
  for food waste. Store drinking water in the refrigerator to avoid running the tap.
  Capture water while waiting for it to heat and use it for other purposes. Avoid
  rinsing dishes before loading them into the dishwasher. Defrost food in the refrigerator
  or use a microwave.


  ### Common failure modes

  Running the dishwasher when not full, using running water for washing or defrosting,
  and not capturing water for reuse.


  ### Safety/boundary notes

  Ensure that rinse water contains a small amount of chlorine bleach for sanitation.


  ### Local adaptation notes

  Adjust practices based on local water availability and regulations.'
