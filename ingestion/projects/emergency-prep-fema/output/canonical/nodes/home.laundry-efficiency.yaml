plain_language: To save water and energy, only run your washing machine when it's
  full, or adjust the water level to match the size of your load.
markdown_body: '### What this is

  This is a guide on how to use automatic clothes washers efficiently to conserve
  water and energy.


  ### Why it matters

  Efficient use of washing machines helps conserve water and energy, reducing utility
  bills and environmental impact.


  ### What you need

  An automatic clothes washer.


  ### How to do it

  Operate your washing machine only when you have a full load. If you need to wash
  smaller loads, adjust the water level setting to match the size of the load.


  ### Common failure modes

  Running the washer with small loads without adjusting the water level can lead to
  inefficient water use.


  ### Safety/boundary notes


  ### Local adaptation notes

  Consider the availability of water-efficient washers in your area to further enhance
  conservation efforts.'
