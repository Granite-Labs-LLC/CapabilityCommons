summary_short: Evaluate your readiness for emergencies.
summary_medium: This assessment helps you evaluate your readiness for emergencies
  and identify any preparedness gaps.
plain_language: This guide helps you check how prepared you are for emergencies and
  find areas where you might need to improve.
markdown_body: '# What this is

  This is an assessment tool designed to help individuals and families evaluate their
  current level of emergency preparedness.


  # Why it matters

  Being prepared for emergencies can significantly reduce the impact of disasters
  on your life. This assessment helps identify areas where you may need to improve
  your preparedness.


  # What you need

  You will need a list of your current emergency supplies, knowledge of your local
  emergency plans, and an understanding of potential regional emergencies.


  # How to do it

  Review your current emergency supplies and plans. Compare them against recommended
  guidelines to identify any gaps. Consider local emergency scenarios and resources
  available in your area.


  # Common failure modes

  Common issues include incomplete assessments and misidentification of preparedness
  gaps.


  # Safety/boundary notes

  Ensure that your assessment considers all family members'' needs, including pets
  and those with special requirements.


  # Local adaptation notes

  Adapt the assessment to include regional emergency scenarios and the availability
  of local resources.'
structured_data:
  definition: An assessment to evaluate readiness for emergencies.
  key_questions:
  - What emergency supplies do you currently have?
  - Are you aware of local emergency plans?
  - What are the potential regional emergencies you might face?
  misconceptions:
  - Having a basic emergency kit is enough for all scenarios.
  - Local emergency plans are not necessary to consider.
