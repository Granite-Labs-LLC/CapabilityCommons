bundle_overrides:
  hook: In emergencies, having quick access to important documents like insurance
    policies and property records can be crucial for recovery and peace of mind.
  primer: Disaster preparedness involves more than just having food and water on hand;
    it also means ensuring that your important documents are safe and accessible.
    These documents include insurance policies, property deeds, birth certificates,
    and other critical papers that may be needed to prove ownership, identity, or
    coverage after a disaster. Storing these documents securely is essential to protect
    them from damage or loss. A safety deposit box at a bank is a recommended option
    because it is both secure and away from potential home hazards like fire or flooding.
    Additionally, making copies of these documents and including them in your disaster
    supplies kit ensures that you have access to them even if you cannot reach the
    originals. It's important to regularly update these copies to reflect any changes
    in your documents. Ensuring that only trusted individuals have access to these
    documents is also crucial for security.
  guide: '1. **Gather Important Documents**: Collect all essential documents such
    as insurance policies, property deeds, birth certificates, and any other critical
    papers.


    2. **Choose a Secure Storage Location**: Decide on a secure location for the original
    documents. A safety deposit box at a bank is ideal because it is secure and not
    located at your home, reducing the risk of loss due to home-related disasters.


    3. **Make Copies**: Create copies of all important documents. These can be physical
    copies or digital scans stored on a secure, password-protected device.


    4. **Include Copies in Your Disaster Kit**: Place the copies in your disaster
    supplies kit. Ensure they are stored in a waterproof and fireproof container to
    protect them from damage.


    5. **Regularly Update Copies**: Set a reminder to review and update the copies
    regularly, especially after any changes to the documents.


    6. **Limit Access**: Ensure that the location where you store your documents is
    secure and accessible only to trusted individuals. This prevents unauthorized
    access and ensures that the documents are available when needed.'
  reference:
  - Store original documents in a safety deposit box or secure location away from
    home.
