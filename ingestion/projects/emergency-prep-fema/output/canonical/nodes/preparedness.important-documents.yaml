markdown_body: '### What this is

  This guide helps you understand how to store important documents securely and make
  copies for your disaster supplies kit.


  ### Why it matters

  In emergencies, having access to important documents like insurance policies and
  property records can be crucial for recovery and peace of mind.


  ### What you need

  A safety deposit box or another secure location, and materials to make copies of
  your documents.


  ### How to do it

  Store original documents such as insurance policies, deeds, and property records
  in a safety deposit box or another secure place away from your home. Make copies
  of these documents and include them in your disaster supplies kit.


  ### Common failure modes

  Failing to update copies regularly, not storing originals in a secure location,
  or forgetting to include copies in the disaster kit.


  ### Safety/boundary notes

  Ensure that the location where you store your documents is secure and accessible
  only to trusted individuals.


  ### Local adaptation notes

  Consider local risks such as floods or fires when choosing a storage location for
  your documents.'
