plain_language: Learn how to stay safe during thunderstorms by following these guidelines
  for before, during, and after the storm.
markdown_body: '### What this is

  This is a set of guidelines to help you prepare for and stay safe during thunderstorms.


  ### Why it matters

  Thunderstorms can be dangerous due to lightning, strong winds, and heavy rain. Following
  these guidelines can help prevent injury and damage.


  ### What you need

  A NOAA Weather Radio, a safe indoor location, and knowledge of basic first aid.


  ### How to do it

  Before a thunderstorm, postpone outdoor activities and secure loose objects. Seek
  shelter in a building or a hard-topped vehicle. Avoid using corded phones and unplug
  appliances to prevent damage from power surges. During a thunderstorm, stay away
  from windows and avoid metal objects. If you are caught outside, find a low area
  away from tall objects and minimize contact with the ground. After the storm, check
  for injuries and provide first aid if necessary.


  ### Common failure modes

  Injury from lightning strikes or damage from power surges due to not following safety
  guidelines.


  ### Safety/boundary notes

  Avoid metal objects and do not lie flat on the ground during a thunderstorm.


  ### Local adaptation notes

  Consider the availability of shelters and local weather patterns when planning your
  response to thunderstorms.'
