summary_short: Boil water to ensure it is safe to drink during emergencies.
summary_medium: Learn how to boil water effectively to make it safe for drinking during
  emergencies, including tips for improving taste.
plain_language: Boiling water is a simple and effective way to make sure it's safe
  to drink during emergencies. Bring the water to a rolling boil for at least one
  minute, then let it cool before drinking. Pouring it between containers can help
  improve the taste.
markdown_body: "### What this is\nThis guide explains how to boil water to make it\
  \ safe for drinking during emergencies.\n\n### Why it matters\nIn emergencies, access\
  \ to clean drinking water may be limited. Boiling is a reliable method to kill harmful\
  \ microorganisms, ensuring the water is safe to consume.\n\n### What you need\n\
  A large pot or kettle, a heat source, and clean containers for storing boiled water.\n\
  \n### How to do it\n1. Fill a large pot or kettle with water. \n2. Heat the water\
  \ until it reaches a rolling boil. \n3. Maintain the boil for at least one minute.\
  \ \n4. Allow the water to cool before drinking. \n5. To improve taste, pour the\
  \ cooled water back and forth between two clean containers.\n\n### Common failure\
  \ modes\nNot boiling the water long enough or using contaminated containers can\
  \ result in unsafe drinking water.\n\n### Safety/boundary notes\nEnsure containers\
  \ used for storing boiled water are clean to prevent recontamination.\n\n### Local\
  \ adaptation notes\nAt higher altitudes, water boils at lower temperatures, so increase\
  \ the boiling time to ensure safety."
