bundle_overrides:
  hook: In emergencies, clean drinking water can be scarce. Boiling water is a simple,
    reliable way to ensure it's safe to drink.
  primer: During emergencies, access to clean drinking water may be limited, making
    it crucial to know how to purify water effectively. Boiling water is one of the
    most reliable methods to kill harmful microorganisms, such as bacteria, viruses,
    and parasites, ensuring the water is safe for consumption. The process involves
    heating water until it reaches a rolling boil and maintaining that boil for at
    least one minute. This method is effective because the high temperature of boiling
    water kills most pathogens. After boiling, it's important to let the water cool
    before drinking. To improve the taste, which can sometimes be flat after boiling,
    you can pour the cooled water back and forth between two clean containers to reintroduce
    oxygen. It's essential to use clean containers to avoid recontamination of the
    water. At higher altitudes, water boils at lower temperatures, so it's necessary
    to increase the boiling time to ensure safety.
  guide: '1. Gather your materials: a large pot or kettle, a heat source, and clean
    containers for storing the boiled water.

    2. Fill the pot or kettle with water. Ensure the container is clean to prevent
    contamination.

    3. Place the pot or kettle on the heat source and turn it on.

    4. Heat the water until it reaches a rolling boil. This means the water is bubbling
    vigorously and continuously.

    5. Once the water is at a rolling boil, maintain the boil for at least one minute.
    This duration is crucial to ensure that harmful microorganisms are killed.

    6. After boiling, remove the pot or kettle from the heat source and allow the
    water to cool before drinking.

    7. To improve the taste of the boiled water, pour it back and forth between two
    clean containers. This process helps to reintroduce oxygen, making the water taste
    fresher.

    8. Store the cooled, boiled water in clean containers to prevent recontamination.

    9. If you are at a high altitude (above 2000 meters), increase the boiling time
    to ensure safety, as water boils at a lower temperature in these conditions.'
  reference:
  - Boil water for at least one minute.
