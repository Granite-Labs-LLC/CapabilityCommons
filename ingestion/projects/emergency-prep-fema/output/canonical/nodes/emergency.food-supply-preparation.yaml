markdown_body: "### What this is\nThis guide provides instructions on how to prepare\
  \ food supplies for emergencies, ensuring you have adequate nutrition without relying\
  \ on refrigeration or cooking.\n\n### Why it matters\nIn emergencies, access to\
  \ fresh food and cooking facilities may be limited. Having a well-prepared food\
  \ supply can ensure you and your family stay nourished during such times.\n\n###\
  \ What you need\nA selection of non-perishable food items, a manual can opener,\
  \ and consideration of any special dietary needs.\n\n### How to do it\n1. Choose\
  \ non-perishable foods that do not require refrigeration or cooking, such as canned\
  \ goods and dry mixes. \n2. Avoid foods that increase thirst, like salty snacks.\
  \ Opt for items like salt-free crackers and canned foods with high liquid content.\
  \ \n3. Include a manual can opener in your supplies. \n4. Consider any special dietary\
  \ needs when selecting food items.\n\n### Common failure modes\nIncluding foods\
  \ that require refrigeration or cooking, or forgetting a manual can opener.\n\n\
  ### Safety/boundary notes\nEnsure all food items are stored properly to avoid spoilage.\n\
  \n### Local adaptation notes\nConsider the availability of local food supplies and\
  \ cultural dietary preferences when selecting items."
