bundle_overrides:
  hook: Equip your community with the skills to weather any storm by mastering hurricane
    preparedness strategies.
  primer: Hurricanes are powerful natural disasters that can cause significant damage
    to communities. Preparing for them is crucial to minimize their impact. The Community
    Hurricane Preparedness Training is a specialized course designed for federal,
    state, and local emergency managers. It aims to enhance their skills in preparing
    communities for hurricanes. The course is available on CD-ROM and as a web-based
    module, making it accessible to a wide audience. Participants will learn about
    effective strategies to protect lives and property, ensuring that communities
    are better equipped to handle the challenges posed by hurricanes. By completing
    this training, emergency managers can develop comprehensive preparedness plans
    tailored to their local weather patterns and community needs.
  guide: '1. **Access the Course**: Obtain the CD-ROM or access the web-based module
    through the provided link. Ensure you have a computer with a CD-ROM drive or internet
    access.


    2. **Enroll in the Training**: Follow the instructions to enroll in the course.
    This may involve creating an account or registering through a specific platform.


    3. **Navigate the Modules**: The course is structured into several modules, each
    focusing on different aspects of hurricane preparedness. Take your time to go
    through each module, ensuring you understand the content.


    4. **Engage with Interactive Content**: Participate in any interactive elements,
    such as quizzes or simulations, to reinforce your learning.


    5. **Apply Local Context**: As you progress, consider how the strategies can be
    adapted to your local community''s needs and weather patterns.


    6. **Complete the Course**: Ensure you complete all modules and any assessments.
    This will help you develop a comprehensive understanding of hurricane preparedness.


    7. **Implement Learnings**: Use the knowledge gained to enhance your community''s
    preparedness plans. Share insights with colleagues and community members to foster
    a culture of readiness.'
