  worksheet:
  - List three key strategies for hurricane preparedness you learned from the course.
  - Describe how you would adapt these strategies to your local community.
  - Identify potential barriers to implementing these strategies and propose solutions.
  - Create a checklist of actions to take before, during, and after a hurricane.
  - Draft a communication plan to inform your community about hurricane preparedness.
  teach_forward_kit:
    three_minute_version: The Community Hurricane Preparedness Training equips emergency
      managers with essential strategies to protect communities from hurricanes. Available
      on CD-ROM and online, it covers comprehensive preparedness plans tailored to
      local needs.
