plain_language: A frost or freeze warning means that temperatures are expected to
  drop below freezing, which can affect plants, animals, and infrastructure.
markdown_body: '### What this is

  A frost/freeze warning is an alert issued when temperatures are expected to fall
  below freezing. This can have significant impacts on agriculture, water systems,
  and outdoor activities.


  ### Why it matters

  Understanding frost and freeze warnings is crucial for preparing and protecting
  crops, pets, and plumbing from the damaging effects of cold weather.


  ### What you need

  Awareness of local weather forecasts and preparedness to take protective actions
  for sensitive areas and items.


  ### How to do it

  Monitor weather reports for frost/freeze warnings. Protect plants by covering them,
  ensure pets have warm shelter, and insulate exposed pipes to prevent freezing.


  ### Common failure modes

  Ignoring warnings can lead to damaged crops, burst pipes, and harm to outdoor animals.


  ### Safety/boundary notes

  Ensure that any protective measures taken do not create additional hazards, such
  as fire risks from heating devices.


  ### Local adaptation notes

  Adapt protective measures based on local climate conditions and the specific needs
  of your environment.'
