markdown_body: '### What this is

  This reference sheet offers guidance on how to prepare for winter storms and recognize
  the signs of frostbite and hypothermia.


  ### Why it matters

  Winter storms can be dangerous and even deadly if you''re not prepared. Knowing
  how to protect yourself and recognize signs of cold-related illnesses can save lives.


  ### What you need

  Access to reliable weather forecasts, warm clothing, emergency supplies, and knowledge
  of frostbite and hypothermia symptoms.


  ### How to do it

  1. Stay informed about weather conditions through reliable sources.

  2. Prepare an emergency kit with essentials like food, water, and blankets.

  3. Learn to recognize frostbite and hypothermia symptoms: Frostbite includes numbness
  and white or grayish-yellow skin; hypothermia symptoms include shivering, confusion,
  and slurred speech.

  4. Stay indoors during severe weather and dress warmly if you must go outside.


  ### Common failure modes

  Being unprepared for sudden weather changes, failing to detect frostbite or hypothermia
  symptoms in time.


  ### Safety/boundary notes

  Always prioritize safety by staying indoors during severe weather and seeking medical
  attention if frostbite or hypothermia is suspected.


  ### Local adaptation notes

  Adapt preparation strategies based on local climate and available resources.'
