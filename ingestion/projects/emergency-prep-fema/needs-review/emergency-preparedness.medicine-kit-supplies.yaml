markdown_body: '### What this is

  This is a checklist of essential non-prescription and prescription medicine supplies
  that should be included in emergency kits. It ensures you have necessary medications
  and health supplies during emergencies.


  ### Why it matters

  Having a well-stocked medicine kit is crucial in emergencies when access to pharmacies
  or medical facilities may be limited. It helps manage minor health issues and maintain
  well-being until professional help is available.


  ### What you need

  Include the following items in your emergency kits: aspirin and non-aspirin pain
  relievers, anti-diarrhea medication, antacid for stomach upset, laxatives, vitamins,
  necessary prescriptions, and extra eyeglasses or contact lenses.


  ### How to do it

  Prepare separate kits for home, vehicle, and work. Regularly check and update the
  supplies, ensuring medications are within their expiration dates and prescriptions
  are current.


  ### Common failure modes

  Failing to regularly update the kit, forgetting to include personal prescriptions,
  and not considering individual health needs can reduce the effectiveness of the
  kit.


  ### Safety/boundary notes

  Ensure that all medications are stored properly according to their requirements,
  and keep them out of reach of children.


  ### Local adaptation notes

  Consider local climate and specific health needs when selecting medications. For
  example, in hot climates, some medications may require special storage conditions.'
