summary_short: Guide to canning cream style corn using a pressure canner.
summary_medium: This project blueprint provides detailed instructions for canning
  cream style corn, including preparation, hot packing, and pressure canning procedures.
plain_language: Learn how to preserve cream style corn by canning it safely using
  a pressure canner. This guide covers everything from selecting the right corn to
  processing it under the correct pressure.
markdown_body: '### What this is

  This is a guide for canning cream style corn using a pressure canner. It includes
  steps for preparing the corn, hot packing it into jars, and processing it under
  pressure to ensure safe preservation.


  ### Why it matters

  Canning cream style corn allows you to preserve the fresh taste of corn for later
  use, reducing food waste and providing a convenient way to enjoy corn year-round.


  ### What you need

  You will need a pressure canner, jars, lids, boiling water, and about 20 pounds
  of sweet corn in husks for a canner load of 9 pints.


  ### How to do it

  1. Husk the corn, remove silk, and wash the ears. 2. Blanch the ears in boiling
  water for 4 minutes. 3. Cut the corn from the cob and scrape the remaining corn
  with a table knife. 4. For hot packing, add two cups of boiling water to each quart
  of corn and heat to boiling. 5. Add 1/2 teaspoon salt to each jar if desired. 6.
  Fill hot pint jars with the corn mixture, leaving a 1-inch headspace. 7. Remove
  air bubbles, adjust headspace, wipe rims, and adjust lids. 8. Process in a pressure
  canner: 85 minutes at 11 lb pressure for 0–2,000 ft, 12 lb for 2,001–4,000 ft, 13
  lb for 4,001–6,000 ft, and 14 lb for 6,001–8,000 ft using a dial-gauge canner. For
  a weighted-gauge canner, process at 10 lb for 0–1,000 ft and 15 lb above 1,000 ft.


  ### Common failure modes

  Incorrect pressure settings or incomplete seals can lead to spoilage. Ensure the
  pressure is adjusted for your altitude and that jars are sealed properly.


  ### Safety/boundary notes

  Always use the correct pressure for your altitude to prevent foodborne illness.


  ### Local adaptation notes

  Consider the availability of corn and adjust processing pressure based on local
  altitude.'
