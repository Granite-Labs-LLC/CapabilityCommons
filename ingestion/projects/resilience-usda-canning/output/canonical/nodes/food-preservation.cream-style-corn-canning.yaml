bundle_overrides:
  hook: Preserve the fresh taste of summer corn all year round by learning how to
    can cream style corn safely at home.
  primer: Canning cream style corn is a method of preserving the delicious taste of
    fresh corn so you can enjoy it throughout the year. This process involves using
    a pressure canner, which is essential for safely preserving low-acid foods like
    corn. By canning your own corn, you can reduce food waste, save money, and have
    a convenient supply of corn ready for your favorite recipes. The process starts
    with selecting fresh sweet corn, husking it, and removing the silk. After blanching
    the corn, it is cut from the cob and packed into jars with boiling water. The
    jars are then sealed and processed in a pressure canner to ensure they are safe
    for long-term storage. This method requires attention to detail, especially regarding
    pressure settings, which vary based on altitude. With the right tools and careful
    adherence to guidelines, you can successfully can cream style corn and enjoy its
    sweet flavor whenever you like.
  guide: 'To can cream style corn, start by gathering your supplies: a pressure canner,
    jars, lids, boiling water, and about 20 pounds of sweet corn in husks for a canner
    load of 9 pints. Begin by husking the corn, removing the silk, and washing the
    ears thoroughly. Next, blanch the ears in boiling water for 4 minutes to prepare
    them for canning. After blanching, cut the corn from the cob at about the center
    of the kernel and use a table knife to scrape the remaining corn from the cobs.
    For hot packing, add two cups of boiling water to each quart of corn and heat
    it to boiling. If desired, add 1/2 teaspoon of salt to each jar for flavor. Fill
    hot pint jars with the corn mixture, leaving a 1-inch headspace. Remove any air
    bubbles, adjust the headspace if necessary, wipe the rims of the jars with a clean,
    damp paper towel, and adjust the lids. Process the jars in a pressure canner for
    85 minutes. The pressure settings depend on your altitude: 11 lb pressure for
    0–2,000 ft, 12 lb for 2,001–4,000 ft, 13 lb for 4,001–6,000 ft, and 14 lb for
    6,001–8,000 ft using a dial-gauge canner. For a weighted-gauge canner, use 10
    lb for 0–1,000 ft and 15 lb above 1,000 ft. Ensure the jars are sealed properly
    after processing to prevent spoilage.'
