plain_language: This project blueprint provides step-by-step instructions for safely
  canning dry beans with either a tomato or molasses sauce using a pressure canner.
markdown_body: '### What this is

  This is a guide for canning dry beans with a choice of tomato or molasses sauce.
  It includes detailed instructions on preparation, processing, and safety measures.


  ### Why it matters

  Canning beans with sauce allows for long-term storage and easy meal preparation,
  preserving the beans'' nutritional value and flavor.


  ### What you need

  You will need dry beans, ingredients for either tomato or molasses sauce, a pressure
  canner, jars, lids, and basic kitchen tools.


  ### How to do it

  1. Sort and wash dry beans. 2. Boil beans with water, soak, and drain. 3. Prepare
  your choice of sauce. 4. Fill jars with beans and sauce, leaving headspace. 5. Process
  jars in a pressure canner according to altitude-specific guidelines.


  ### Common failure modes

  Incorrect pressure settings or incomplete seals can lead to spoilage.


  ### Safety/boundary notes

  Ensure the correct pressure is used based on your altitude to prevent foodborne
  illness.


  ### Local adaptation notes

  Adjust the recipe based on the availability of beans and local altitude.'
