bundle_overrides:
  hook: Preserve your dry beans with delicious tomato or molasses sauce for long-term
    storage and easy meal prep.
  primer: Canning dry beans with a flavorful sauce is a practical way to ensure you
    have nutritious, ready-to-eat meals on hand. This method involves using a pressure
    canner to safely preserve beans with either a tomato or molasses sauce. The process
    not only extends the shelf life of the beans but also locks in their nutritional
    value and taste. By following specific preparation and processing steps, you can
    enjoy the convenience of having a homemade meal base ready whenever you need it.
    This guide will walk you through the necessary steps, including sorting and washing
    the beans, preparing your choice of sauce, and safely canning the beans using
    a pressure canner. It's important to follow altitude-specific guidelines to ensure
    safety and prevent spoilage.
  guide: "1. Gather your materials: dry beans, ingredients for tomato or molasses\
    \ sauce, a pressure canner, jars, and lids.\n\n2. Sort and wash the dry beans\
    \ to remove any debris or damaged beans.\n\n3. In a large pot, add 3 cups of water\
    \ for each cup of dried beans. Bring to a boil for 2 minutes, then remove from\
    \ heat and let soak for 1 hour. Drain the beans.\n\n4. Prepare your choice of\
    \ sauce:\n   - For Tomato Sauce: Combine tomato ingredients in a pot and simmer.\n\
    \   - For Molasses Sauce: Mix molasses ingredients in a pot and simmer.\n\n5.\
    \ Heat the beans in fresh water until boiling, then drain, saving the liquid for\
    \ the sauce if needed.\n\n6. Fill hot jars three-fourths full with hot beans.\
    \ Optionally, add a 3/4-inch cube of pork, ham, or bacon to each jar.\n\n7. Fill\
    \ jars with the heated sauce, leaving a 1-inch headspace. Remove air bubbles and\
    \ adjust headspace if necessary.\n\n8. Wipe the rims of jars with a damp paper\
    \ towel to ensure a clean seal. Adjust lids.\n\n9. Process jars in a pressure\
    \ canner according to altitude-specific guidelines. Ensure the correct pressure\
    \ is used to prevent spoilage and foodborne illness.\n\n10. Once processed, allow\
    \ jars to cool undisturbed for 12-24 hours. Check seals before storing."
  reference:
  - Sort and wash dry beans.
  - Boil beans, soak, and drain.
  - Prepare tomato or molasses sauce.
  - Fill jars with beans and sauce, leaving headspace.
  - Process in a pressure canner according to altitude guidelines.
  - Ensure correct pressure to prevent spoilage.
  worksheet:
