markdown_body: '### What this is


  This reference sheet provides information on the types of salts used in pickling
  and their effects on the pickling process.


  ### Why it matters


  Choosing the right type of salt is crucial for successful pickling. Different salts
  can affect the clarity of the brine and the safety of the pickling process.


  ### What you need


  Knowledge of the different types of salts available for pickling and their properties.


  ### How to do it


  Use canning or pickling salt for best results. Both iodized and noniodized table
  salts can be used, but noncaking agents in table salt may cloud the brine. Avoid
  using flake salt due to its variable density. Reduced-sodium salts can be used in
  quick pickles but not in fermented pickles.


  ### Common failure modes


  Using table salt with noncaking agents can result in cloudy brine. Using reduced-sodium
  salt in fermented pickles can lead to unsatisfactory results.


  ### Safety/boundary notes


  Do not use reduced-sodium salts in fermented pickle recipes as it can compromise
  the safety and quality of the pickles.


  ### Local adaptation notes


  Adjust salt types based on local availability, ensuring to avoid those with noncaking
  agents for clear brine.'
plain_language: This guide explains which salts to use for pickling, how they affect
