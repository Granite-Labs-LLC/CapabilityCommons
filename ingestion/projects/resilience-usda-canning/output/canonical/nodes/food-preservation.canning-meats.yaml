summary_short: Guidelines for safely canning poultry, red meats, and seafoods.
summary_medium: Learn how to safely and effectively preserve poultry, red meats, and
  seafoods through canning, focusing on preparation, processing, and safety measures.
plain_language: This guide helps you can poultry, red meats, and seafoods safely at
  home, ensuring they are preserved properly to avoid spoilage and contamination.
markdown_body: '# What this is

  This guide provides detailed instructions on how to prepare and can poultry, red
  meats, and seafoods. It focuses on the steps necessary to ensure safe preservation
  through canning.


  # Why it matters

  Canning meats allows for long-term storage without refrigeration, making it a valuable
  skill for preserving food. Proper canning prevents spoilage and foodborne illnesses.


  # What you need

  You will need a pressure canner, jars, and lids. Ensure all equipment is clean and
  in good condition to prevent contamination.


  # How to do it

  1. Prepare the meats by cleaning and cutting them into appropriate sizes. 2. Pack
  the meats into jars, leaving the recommended headspace. 3. Seal the jars with lids
  and process them in a pressure canner at the correct pressure and time for your
  altitude. 4. Allow the jars to cool and check seals before storing.


  # Common failure modes

  Improper sealing of jars and contamination during preparation or processing can
  lead to spoilage.


  # Safety/boundary notes

  Ensure the pressure canner reaches the correct pressure and maintain it for the
  required time. Avoid contamination by using clean equipment and handling meats properly.


  # Local adaptation notes

  Consider the availability of meats in your area and any local canning practices
  that may affect processing times or methods.'
