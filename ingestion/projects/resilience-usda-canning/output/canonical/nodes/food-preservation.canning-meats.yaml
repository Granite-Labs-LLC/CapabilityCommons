bundle_overrides:
  hook: Canning meats allows you to store them long-term without refrigeration, making
    it a valuable skill for food preservation.
  primer: Canning is a method of preserving food in which the food contents are processed
    and sealed in an airtight container. This guide focuses on canning poultry, red
    meats, and seafoods, which are low-acid foods that require careful handling to
    prevent spoilage and foodborne illnesses. The process involves using a pressure
    canner, which is essential for safely canning these types of foods due to their
    low acidity. The pressure canner heats the contents to a temperature that destroys
    harmful bacteria, such as Clostridium botulinum, which can cause botulism. Proper
    canning ensures that meats can be stored for extended periods without refrigeration,
    making it an ideal method for those looking to preserve food for emergencies or
    to enjoy seasonal meats year-round. Key steps include preparing the meats by cleaning
    and cutting them into appropriate sizes, packing them into jars with the correct
    headspace, sealing the jars, and processing them at the correct pressure and time
    for your altitude. Ensuring that jars are properly sealed and free from contamination
    is crucial to prevent spoilage.
  guide: "1. Gather your equipment: a pressure canner, jars, and lids. Ensure all\
    \ equipment is clean and in good condition. \n\n2. Prepare the meats: Clean and\
    \ cut poultry, red meats, or seafood into sizes suitable for canning. Remove any\
    \ excess fat or gristle. \n\n3. Pack the jars: Fill hot jars with the prepared\
    \ meat, leaving the recommended headspace (usually 1-1/4 inches). You may add\
    \ hot broth or water to cover the meat, if desired. \n\n4. Seal the jars: Wipe\
    \ the rims of the jars with a clean, damp paper towel to remove any residue. Place\
    \ the lids on the jars and adjust the bands until they are fingertip-tight. \n\
    \n5. Process the jars: Place the jars in the pressure canner. Follow the manufacturer's\
    \ instructions to secure the lid and vent the canner for 10 minutes. Adjust the\
    \ pressure according to your altitude and process the jars for the recommended\
    \ time. \n\n6. Cool and store: Once processing is complete, allow the canner to\
    \ depressurize naturally. Remove the jars and let them cool undisturbed for 12-24\
    \ hours. Check the seals before storing the jars in a cool, dark place."
