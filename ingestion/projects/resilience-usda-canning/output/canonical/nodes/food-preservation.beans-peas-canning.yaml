canonical_title: Canning Dried Beans or Peas
citations:
- claim_id: clm_001
  claim_text: This is a guide for canning dried beans or peas using a pressure canner.
    It includes instructions for preparation, processing times, and adjustments for
    altitude.
  object_id: food-preservation.beans-peas-canning
  support:
  - end_char: 619
    excerpt: 'Procedure: Place dried beans or peas in a large pot and cover with water.
      Soak 12 to 18 hours in a cool place. Drain water. To quickly hydrate beans,
      you may cover sorted and washed beans with boiling water in a saucepan. Boil
      2 minutes, remove from heat, soak 1 hour and drain. Cover beans soaked by either
      method with fresh water and boil 30 minutes. Add 1/2 teaspoon of salt per pint
      or 1 teaspoon per quart to the jar, if desired. Fill hot jars with beans or
      peas and cooking water, leaving 1-inch headspace. Remove air bubbles and adjust
      headspace if needed. Wipe rims of jars with a dampened clean paper towel. Adjust
      lids and process.'
    page_end: 115
    page_start: 114
    segment_id: src.usda.home-canning.2015::seg_000156
    source_id: src.usda.home-canning.2015
    start_char: 0
    support_strength: strong
