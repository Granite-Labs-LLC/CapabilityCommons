bundle_overrides:
  hook: Preserve your dried beans or peas for long-term storage and ensure a ready
    supply of nutritious food with canning.
  primer: Canning dried beans or peas is a practical method to preserve these nutritious
    staples for long-term storage. Using a pressure canner is essential because beans
    and peas are low-acid foods, which require higher temperatures to eliminate the
    risk of botulism. The process involves soaking the beans to rehydrate them, boiling
    them to soften, and then sealing them in jars with a pressure canner. This method
    not only extends the shelf life of your beans or peas but also ensures you have
    a convenient and ready-to-use ingredient for various meals. Proper canning techniques,
    including adjusting for altitude, are crucial to ensure safety and prevent spoilage.
  guide: '1. Gather your materials: dried beans or peas, a pressure canner, jars,
    lids, boiling water, and optional salt.

    2. Sort and rinse the beans or peas, discarding any discolored seeds.

    3. Soak the beans in water for 12 to 18 hours in a cool place. Alternatively,
    use the quick soak method by boiling the beans for 2 minutes, then soaking for
    1 hour.

    4. Drain the soaked beans and cover them with fresh water. Boil for 30 minutes.

    5. If desired, add 1/2 teaspoon of salt per pint or 1 teaspoon per quart to the
    jars.

    6. Fill the hot jars with the beans and cooking water, leaving a 1-inch headspace.

    7. Remove air bubbles by gently tapping the jars or using a non-metallic spatula.
    Adjust the headspace if necessary.

    8. Wipe the rims of the jars with a dampened clean paper towel to ensure a good
    seal.

    9. Place the lids on the jars and adjust the bands until fingertip tight.

    10. Process the jars in a pressure canner according to the recommended times and
    pressures for your altitude.

    11. Once processed, allow the jars to cool undisturbed for 12 to 24 hours. Check
    the seals before storing.'
