markdown_body: "### What this is\nThis is a guide for canning dried beans or peas\
  \ using a pressure canner. It includes instructions for preparation, processing\
  \ times, and adjustments for altitude.\n\n### Why it matters\nCanning dried beans\
  \ or peas allows you to preserve them for long-term storage, ensuring you have a\
  \ ready supply of nutritious food.\n\n### What you need\nYou will need a pressure\
  \ canner, jars, lids, boiling water, and dried beans or peas. Optionally, you can\
  \ add salt for flavor.\n\n### How to do it\n1. Sort and rinse the beans or peas,\
  \ discarding any discolored seeds. \n2. Soak them in water for 12 to 18 hours in\
  \ a cool place, or use the quick soak method by boiling for 2 minutes, then soaking\
  \ for 1 hour. \n3. Drain and cover with fresh water, then boil for 30 minutes. \n\
  4. Add salt to jars if desired, fill jars with beans and cooking water, leaving\
  \ 1-inch headspace. \n5. Remove air bubbles, adjust headspace, wipe rims, and adjust\
  \ lids. \n6. Process in a pressure canner according to the recommended times and\
  \ pressures for your altitude.\n\n### Common failure modes\nIncorrect pressure or\
  \ incomplete seal can lead to spoilage. Ensure the pressure is correct for your\
  \ altitude and that jars are sealed properly.\n\n### Safety/boundary notes\nAlways\
  \ use a pressure canner for low-acid foods like beans to prevent the risk of botulism.\
  \ Adjust pressure settings based on your altitude.\n\n### Local adaptation notes\n\
  Adapt the process based on the availability of beans or peas and your local altitude."
plain_language: This guide will help you can dried beans or peas using a pressure
  canner. It includes steps for preparation, processing times, and how to adjust for
  different altitudes.
