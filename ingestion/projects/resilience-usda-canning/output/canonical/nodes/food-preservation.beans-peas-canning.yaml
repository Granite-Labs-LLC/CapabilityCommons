  - 'Try both soaking methods: the long soak and the quick soak. Record the differences
    in texture.'
  - Practice filling jars with beans and water, ensuring you leave the correct headspace.
  - Simulate removing air bubbles and adjusting headspace using a non-metallic spatula.
  - Research the recommended pressure settings for your altitude and note them down.
  - After processing, check the seals on your jars and document any that did not seal
    properly.
