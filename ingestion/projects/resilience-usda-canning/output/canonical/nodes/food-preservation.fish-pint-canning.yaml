markdown_body: '### What this is

  This guide provides instructions for canning fish, such as salmon and trout, in
  pint jars using a pressure canner. It includes preparation steps, packing methods,
  and processing times for both dial-gauge and weighted-gauge pressure canners.


  ### Why it matters

  Canning fish allows for long-term preservation, making it possible to enjoy fresh-caught
  fish year-round. Proper canning techniques ensure safety and quality, preventing
  spoilage and contamination.


  ### What you need

  You will need a pressure canner, pint jars with lids, salt (optional), and fresh
  fish such as salmon or trout. Ensure you have access to ice for keeping fish fresh
  before canning.


  ### How to do it

  1. Bleed and eviscerate fish immediately after catching. Keep on ice until ready
  to can. 2. Thaw frozen fish in the refrigerator. Rinse in cold water, optionally
  adding vinegar to remove slime. 3. Remove head, tail, fins, and scales. For halibut,
  remove bones and skin. 4. Cut fish into 3.5-inch lengths. Pack into hot pint jars,
  leaving 1-inch headspace. Add 1 teaspoon of salt per pint if desired. 5. Clean jar
  rims, adjust lids, and process in a pressure canner. For dial-gauge canners, process
  at 11-14 PSI depending on altitude for 100 minutes. For weighted-gauge canners,
  process at 10-15 PSI depending on altitude for 100 minutes.


  ### Common failure modes

  Formation of struvite crystals, which are safe but can be mistaken for glass. Incorrect
  pressure can lead to under-processed jars, risking spoilage.


  ### Safety/boundary notes

  Ensure proper pressure is maintained throughout the canning process to prevent contamination.
  Follow altitude adjustments for pressure settings.


  ### Local adaptation notes

  Consider the availability of local fish species when planning your canning project.'
