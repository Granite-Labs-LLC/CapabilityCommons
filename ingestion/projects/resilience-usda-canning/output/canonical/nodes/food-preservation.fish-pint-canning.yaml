bundle_overrides:
  hook: Preserve your fresh catch year-round by learning how to safely can fish in
    pint jars using a pressure canner.
  primer: Canning fish is a method of preserving fresh fish like salmon and trout
    for long-term storage. This process involves using a pressure canner, which is
    essential for safely preserving low-acid foods such as fish. The pressure canner
    heats the jars to a high temperature, killing bacteria and preventing spoilage.
    Proper canning techniques ensure that the fish remains safe to eat and retains
    its quality over time. Before canning, fish must be properly prepared by bleeding
    and eviscerating immediately after catching, and keeping it on ice until ready
    to can. If the fish is frozen, it should be thawed in the refrigerator. The fish
    is then cut into pieces, packed into jars, and processed in the pressure canner.
    This method not only extends the shelf life of the fish but also allows you to
    enjoy the taste of fresh-caught fish throughout the year.
  guide: '1. Start by bleeding and eviscerating the fish immediately after catching
    it. Keep the fish on ice until you are ready to can it.

    2. If the fish is frozen, thaw it in the refrigerator. Rinse the fish in cold
    water, and you can add vinegar (2 tablespoons per quart) to help remove any slime.

    3. Prepare the fish by removing the head, tail, fins, and scales. For halibut,
    also remove the bones and skin.

    4. Cut the fish into 3.5-inch lengths. If you prefer, you can leave the skin on
    for a nicer appearance or remove it for easier jar cleaning.

    5. Pack the fish pieces into hot pint jars, leaving a 1-inch headspace. Add 1
    teaspoon of salt per pint if desired.

    6. Clean the jar rims and adjust the lids.

    7. Process the jars in a pressure canner. For dial-gauge canners, process at 11-14
    PSI depending on your altitude for 100 minutes. For weighted-gauge canners, process
    at 10-15 PSI depending on altitude for 100 minutes.

    8. After processing, allow the jars to cool and check that they are properly sealed
    before storing.'
  reference:
  - Bleed and eviscerate fish immediately; keep on ice.
  - Thaw frozen fish in the refrigerator.
  - Remove head, tail, fins, and scales.
  - Cut fish into 3.5-inch lengths.
  - Pack into hot pint jars, leaving 1-inch headspace.
  - Add 1 teaspoon of salt per pint, if desired.
  - Process in a pressure canner for 100 minutes.
  - 'Dial-gauge: 11-14 PSI; Weighted-gauge: 10-15 PSI.'
  - Check for proper sealing after cooling.
