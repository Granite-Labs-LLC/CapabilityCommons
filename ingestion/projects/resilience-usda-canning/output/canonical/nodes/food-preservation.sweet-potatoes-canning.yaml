bundle_overrides:
  hook: Preserve the delicious taste and nutrition of sweet potatoes year-round by
    learning how to can them safely and effectively.
  primer: Canning sweet potatoes is a practical way to store this nutritious vegetable
    for long-term use, making it available throughout the year. The process involves
    using a pressure canner, which is essential for safely preserving low-acid foods
    like sweet potatoes. By canning, you can enjoy the convenience of having sweet
    potatoes ready to use in various recipes without worrying about spoilage. The
    key to successful canning is following precise steps to ensure the jars are sealed
    properly and the contents are preserved safely. This guide will walk you through
    the necessary equipment, preparation, and processing steps to achieve perfectly
    canned sweet potatoes.
  guide: To can sweet potatoes, you'll need a pressure canner, jars, lids, boiling
    water, and optionally, salt. Start by selecting small to medium-sized, mature
    sweet potatoes that are not too fibrous. Wash them thoroughly and boil or steam
    until they are partially soft, which takes about 15-20 minutes. Once softened,
    remove the skins and cut the potatoes into uniform pieces. Next, fill hot jars
    with the potato pieces, leaving a 1-inch headspace at the top. If you prefer,
    add 1 teaspoon of salt per quart for flavor. Cover the potatoes with boiling water
    or syrup, again leaving a 1-inch headspace. Remove any air bubbles by gently tapping
    the jars or using a non-metallic spatula. Adjust the headspace if necessary. Wipe
    the rims of the jars with a clean, damp paper towel to ensure a good seal. Place
    the lids on the jars and secure them with rings. Process the jars in a pressure
    canner. For dial-gauge canners, process pints for 65 minutes and quarts for 90
    minutes at 11-14 PSI, adjusting for altitude. For weighted-gauge canners, use
    10-15 PSI. After processing, let the jars cool undisturbed for 12-24 hours. Check
    the seals before storing. Properly canned sweet potatoes should have a vacuum
    seal and can be stored in a cool, dark place for up to a year.
  reference:
  - Use a pressure canner for low-acid foods.
  - Select small to medium-sized, mature sweet potatoes.
  - Boil or steam potatoes until partially soft (15-20 minutes).
  - Remove skins and cut into uniform pieces.
  - Fill jars with potatoes, leaving 1-inch headspace.
  - Add 1 teaspoon of salt per quart if desired.
  - Cover with boiling water or syrup, leaving 1-inch headspace.
  - Remove air bubbles and adjust headspace.
  - Wipe rims, adjust lids, and process in a pressure canner.
  - Process pints for 65 minutes and quarts for 90 minutes.
  - 'Adjust pressure for altitude: 11-14 PSI for dial-gauge, 10-15 PSI for weighted-gauge.'
  worksheet:
  - List the equipment needed for canning sweet potatoes.
  - Describe the steps to prepare sweet potatoes for canning.
  - Explain the importance of adjusting pressure based on altitude.
  - Practice filling jars with sweet potatoes and adjusting headspace.
  - Simulate the process of checking jar seals after canning.
  teach_forward_kit:
    three_minute_version: Canning sweet potatoes involves using a pressure canner
      to safely preserve them for long-term storage. Start by selecting and preparing
      the potatoes, then fill jars, leaving headspace. Process in a pressure canner,
      adjusting for altitude, and ensure jars are sealed properly.
    ten_minute_outline:
    - Introduction to canning and its benefits.
    - Necessary equipment and ingredients.
    - Step-by-step preparation of sweet potatoes.
    - Filling jars and adjusting headspace.
    - Processing in a pressure canner with altitude adjustments.
    - Checking seals and storing canned sweet potatoes.
    discussion_prompts:
    - Why is a pressure canner necessary for canning sweet potatoes?
    - What are the risks of not adjusting pressure for altitude?
    - How can you tell if a jar is properly sealed after canning?
    - What are some creative ways to use canned sweet potatoes in recipes?
