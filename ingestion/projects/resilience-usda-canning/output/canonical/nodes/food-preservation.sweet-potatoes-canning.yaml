plain_language: Learn how to safely can sweet potatoes using a pressure canner, with
  step-by-step instructions and tips for success.
markdown_body: '### What this is

  This guide provides instructions for canning sweet potatoes using a pressure canner.
  It covers the necessary quantities, quality of potatoes, and detailed steps for
  preparation and processing.


  ### Why it matters

  Canning sweet potatoes allows for long-term storage and preservation of this nutritious
  vegetable, making it available year-round.


  ### What you need

  You will need a pressure canner, jars, lids, boiling water, and optionally, salt.
  Choose small to medium-sized, mature sweet potatoes.


  ### How to do it

  1. Wash and boil or steam sweet potatoes until partially soft (15-20 minutes). 2.
  Remove skins and cut into uniform pieces. 3. Fill hot jars with potatoes, leaving
  1-inch headspace. 4. Add 1 teaspoon of salt per quart if desired. 5. Cover with
  boiling water or syrup, leaving 1-inch headspace. 6. Remove air bubbles and adjust
  headspace. 7. Wipe rims, adjust lids, and process in a pressure canner. For dial-gauge
  canners, process pints for 65 minutes and quarts for 90 minutes at 11-14 PSI depending
  on altitude. For weighted-gauge canners, process pints for 65 minutes and quarts
  for 90 minutes at 10-15 PSI depending on altitude.


  ### Common failure modes

  Incorrect pressure or incomplete sealing can lead to spoilage. Ensure the correct
  pressure is used for your altitude.


  ### Safety/boundary notes

  Always use a pressure canner and adjust pressure according to your altitude to ensure
  safety.


  ### Local adaptation notes

  Consider the availability of sweet potatoes and adjust processing pressure based
  on local altitude.'
