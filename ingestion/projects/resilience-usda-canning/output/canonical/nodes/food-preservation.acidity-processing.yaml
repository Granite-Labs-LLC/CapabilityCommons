markdown_body: '# What this is

  This concept note explains the relationship between food acidity and the appropriate
  canning method. It highlights the importance of pH levels in preventing the growth
  of harmful bacteria during the canning process.


  # Why it matters

  Understanding food acidity is crucial for safe home canning. Foods with different
  acidity levels require different processing methods to prevent the growth of botulinum
  bacteria, which can cause serious illness.


  # What you need

  Knowledge of food acidity, pH levels, and canning methods. Tools include a pressure
  canner and a boiling-water canner.


  # How to do it

  Determine the acidity of the food you are canning. Foods with a pH of 4.6 or lower
  can be processed in a boiling-water canner. Low-acid foods with a pH above 4.6 require
  a pressure canner to reach the necessary temperatures for safe processing.


  # Common failure modes

  Using the wrong canning method for the food''s acidity level can result in unsafe
  preservation and potential bacterial growth.


  # Safety/boundary notes

  Always ensure that low-acid foods are processed at temperatures between 240° to
  250°F using a pressure canner to effectively destroy botulinum spores.


  # Local adaptation notes

  Adjust the amount of acidifying agents like lemon juice or vinegar based on local
  produce variations to ensure safe pH levels.'
