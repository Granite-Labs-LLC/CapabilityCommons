summary_short: Guide to canning peppers using a pressure canner.
summary_medium: Learn how to can hot or sweet peppers, including chiles, jalapeño,
  and pimiento, using a pressure canner. This guide covers the necessary quantity,
  quality, procedure, and processing times.
plain_language: This project blueprint provides step-by-step instructions for canning
  peppers safely using a pressure canner. It includes details on selecting peppers,
  preparing them, and processing them at the correct pressure for your altitude.
markdown_body: "### What this is\nThis is a guide for canning hot or sweet peppers,\
  \ such as chiles, jalapeño, and pimiento, using a pressure canner. It includes instructions\
  \ on preparation, packing, and processing.\n\n### Why it matters\nCanning peppers\
  \ allows you to preserve their flavor and nutritional value for long-term storage.\
  \ Proper canning techniques ensure safety and prevent spoilage.\n\n### What you\
  \ need\nYou will need a pressure canner, jars, lids, boiling water, and approximately\
  \ 9 pounds of firm yellow, green, or red peppers per canner load of 9 pints.\n\n\
  ### How to do it\n1. Select firm, disease-free peppers. Wear gloves when handling\
  \ hot peppers. \n2. Blister skins using an oven, broiler, or range-top method. \n\
  3. Peel skins, remove cores and seeds, and flatten peppers. \n4. Pack peppers into\
  \ hot jars, add boiling water, and process in a pressure canner at the correct pressure\
  \ for your altitude.\n\n### Common failure modes\nIncorrect pressure settings or\
  \ incomplete seals can lead to spoilage. Ensure the pressure canner is set correctly\
  \ for your altitude.\n\n### Safety/boundary notes\nAlways adjust the pressure based\
  \ on your altitude to ensure safe canning. Use gloves when handling hot peppers\
  \ to avoid skin irritation.\n\n### Local adaptation notes\nConsider the availability\
  \ of different types of peppers and adjust the pressure settings based on local\
  \ altitude."
