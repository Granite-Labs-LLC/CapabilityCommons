bundle_overrides:
  hook: Preserve the vibrant flavors of your favorite peppers year-round by mastering
    the art of canning.
  primer: Canning peppers is a time-honored method of preserving their flavor and
    nutritional value for long-term storage. Whether you have a surplus of garden-grown
    peppers or want to stock up on seasonal varieties, canning allows you to enjoy
    them throughout the year. The process involves using a pressure canner, which
    is essential for safely preserving low-acid foods like peppers. By following proper
    canning techniques, you can prevent spoilage and ensure the safety of your preserved
    goods. This guide will walk you through selecting the right peppers, preparing
    them for canning, and processing them at the correct pressure for your altitude.
    With a little practice, you'll be able to enjoy the taste of summer even in the
    depths of winter.
  guide: 'Step 1: Gather Your Supplies

    You''ll need a pressure canner, jars, lids, boiling water, and approximately 9
    pounds of firm yellow, green, or red peppers per canner load of 9 pints.


    Step 2: Select and Prepare Peppers

    Choose firm, disease-free peppers. If you''re handling hot peppers, wear gloves
    to protect your skin. Blister the skins using one of the following methods:

    - Oven or broiler: Place peppers in a hot oven (400°F) or under a broiler for
    6-8 minutes until skins blister.

    - Range-top: Cover a hot burner with heavy wire mesh and place peppers on it until
    skins blister.


    Step 3: Peel and Core

    After blistering, let the peppers cool for a few minutes. Peel off the skins,
    remove the cores and seeds, and flatten the peppers.


    Step 4: Pack and Process

    Pack the prepared peppers loosely into hot jars. Add fresh boiling water, leaving
    a 1-inch headspace. Remove air bubbles and adjust headspace if necessary. Wipe
    the rims of jars with a dampened clean paper towel, adjust lids, and process in
    a pressure canner. Ensure you adjust the pressure based on your altitude to ensure
    safe canning.


    Step 5: Final Checks

    After processing, ensure that the jars are sealed properly. If any jars do not
    seal, refrigerate and use them within a few days.'
  reference:
  - Use a pressure canner for low-acid foods like peppers.
  - Select firm, disease-free peppers.
  - Wear gloves when handling hot peppers.
  - Blister skins using oven, broiler, or range-top methods.
  - Peel skins, remove cores and seeds, flatten peppers.
  - Pack peppers into hot jars, add boiling water.
  - Process at the correct pressure for your altitude.
  - Ensure jars are sealed properly to prevent spoilage.
