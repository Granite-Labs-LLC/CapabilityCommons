bundle_overrides:
  hook: Preserve your favorite hearty meal for any time of the year with safe and
    convenient canning of chile con carne.
  primer: Canning chile con carne is a practical way to store this delicious and hearty
    meal for long-term use. By using a pressure canner, you ensure that the food is
    preserved safely, preventing spoilage and maintaining its flavor. The process
    involves preparing the ingredients, filling jars, and processing them under pressure.
    This method is particularly important for low-acid foods like meats and beans,
    as it prevents the growth of harmful bacteria such as Clostridium botulinum. The
    key to successful canning is following the steps carefully, especially maintaining
    the correct pressure based on your altitude. This guide will walk you through
    the process, ensuring that your chile con carne is safely preserved and ready
    to enjoy whenever you want.
  guide: To can chile con carne, you'll need a pressure canner, jars, dried pinto
    or red kidney beans, ground beef, onions, optional peppers, chili powder, tomatoes,
    and salt. Begin by washing the beans thoroughly and soaking them in a saucepan
    with water 2 to 3 inches above the beans for 12 to 18 hours. Drain and discard
    the water. Next, cook the beans with 5-1/2 cups of fresh water and 2 teaspoons
    of salt. Bring to a boil, reduce heat, and simmer for 30 minutes before draining
    again. In a skillet, brown the ground beef with chopped onions and optional peppers.
    Drain off the fat and add 3 teaspoons of salt, pepper, chili powder, tomatoes,
    and the drained cooked beans. Simmer this mixture for 5 minutes. Fill hot jars
    with the mixture, leaving a 1-inch headspace. Remove air bubbles and adjust the
    headspace if needed. Wipe the rims of the jars with a dampened clean paper towel,
    adjust the lids, and process in a pressure canner for 75 minutes. Ensure you use
    the correct pressure for your altitude to avoid contamination.
  reference:
  - Pressure canner
  - Jars
  - Dried pinto or red kidney beans
  - Ground beef
  - Onions
  - Peppers (optional)
  - Chili powder
  - Tomatoes
  - Salt
  - Soak beans 12-18 hours
  - Simmer beans 30 minutes
  - Brown beef with onions and peppers
  - Simmer all ingredients 5 minutes
  - Fill jars, 1-inch headspace
  - Process 75 minutes at correct pressure
