markdown_body: '### What this is

  This is a step-by-step guide for canning chile con carne using a pressure canner.
  It includes preparation of ingredients, filling jars, and processing them under
  pressure to ensure safe preservation.


  ### Why it matters

  Canning chile con carne allows you to preserve this hearty meal for long-term storage,
  making it convenient to enjoy at any time. Proper canning prevents spoilage and
  ensures food safety.


  ### What you need

  You will need a pressure canner, jars, dried pinto or red kidney beans, ground beef,
  onions, optional peppers, chili powder, tomatoes, and salt.


  ### How to do it

  1. Soak beans in water for 12-18 hours, then drain. 2. Cook beans with fresh water
  and salt for 30 minutes, then drain. 3. Brown ground beef with onions and optional
  peppers. 4. Combine all ingredients and simmer for 5 minutes. 5. Fill hot jars with
  the mixture, leaving 1-inch headspace. 6. Process in a pressure canner for 75 minutes
  at the appropriate pressure for your altitude.


  ### Common failure modes

  Using incorrect pressure or thickening the mixture can lead to unsafe canning results.


  ### Safety/boundary notes

  Ensure the correct pressure is used based on your altitude to avoid contamination
  and ensure safety.


  ### Local adaptation notes

  Adjust the recipe based on the availability of local ingredients, such as different
  types of peppers.'
