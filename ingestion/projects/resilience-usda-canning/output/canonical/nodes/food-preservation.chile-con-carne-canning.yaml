    excerpt: 'Procedure: Wash beans thoroughly and place them in a 2 qt. saucepan.
      Add cold water to a level of 2 to 3 inches above the beans and soak 12 to 18
      hours. Drain and discard water. Combine beans with 5-1/2 cups of fresh water
      and 2 teaspoons salt. Bring to a boil. Reduce heat and simmer 30 minutes. Drain
      and discard water. Brown ground beef, chopped onions, and peppers (if desired),
      in a skillet. Drain off fat and add 3 teaspoons salt, pepper, chili powder,
      tomatoes and drained cooked beans. Simmer 5 minutes. Caution: Do not thicken.
      Fill hot jars, leaving 1-inch head-space. Remove air bubbles and adjust headspace
      if needed. Wipe rims of jars with a dampened clean paper towel. Adjust lids
      and process.'
