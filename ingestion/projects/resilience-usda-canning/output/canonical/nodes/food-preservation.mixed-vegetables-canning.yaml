summary_short: Guide to canning mixed vegetables using a pressure canner.
summary_medium: This project blueprint provides detailed instructions for canning
  mixed vegetables, including preparation, packing, and processing using a pressure
  canner.
plain_language: Learn how to safely can mixed vegetables at home using a pressure
  canner. This guide covers everything from preparing the vegetables to processing
  them in jars.
markdown_body: '### What this is

  This is a guide for canning mixed vegetables using a pressure canner. It includes
  steps for preparing the vegetables, packing them into jars, and processing them
  to ensure they are safely preserved.


  ### Why it matters

  Canning mixed vegetables allows you to preserve a variety of vegetables for long-term
  storage, ensuring you have access to nutritious food year-round.


  ### What you need

  You will need a pressure canner, jars, lids, and boiling water. The vegetables include
  carrots, sweet corn, green beans, lima beans, tomatoes, and zucchini.


  ### How to do it

  Wash and prepare the vegetables as needed. Combine them in a large pot, add water
  to cover, and boil for 5 minutes. Fill hot jars with the vegetables and liquid,
  leaving a 1-inch headspace. Remove air bubbles, adjust headspace, wipe rims, and
  adjust lids. Process the jars in a pressure canner according to the manufacturer''s
  instructions.


  ### Common failure modes

  Failure to maintain correct pressure can lead to under-processed jars. Incomplete
  seals can result in spoilage.


  ### Safety/boundary notes

  Ensure you use the correct pressure for your altitude to prevent spoilage and ensure
  safety.


  ### Local adaptation notes

  Adjust the vegetable mix based on local availability and ensure you account for
  local altitude when determining pressure settings.'
structured_data:
  goal: Safely preserve mixed vegetables using a pressure canner.
  deliverables: 7 quarts of canned mixed vegetables.
  acceptance_criteria: Jars are sealed properly and stored safely.
  safety_boundary: 'Botulism risk. Low-acid foods (vegetables, meats, poultry, seafood)
    must be processed in a pressure canner, never a boiling-water canner; tomatoes
    must be acidified to pH 4.6 or lower with lemon juice or citric acid as a tested
    recipe directs. Vent the canner 10 minutes before pressurizing, use the exact
    process time and pressure for your jar size, pack style, canner type, and altitude,
    and check dial gauges for accuracy every year. Use only tested recipes and never
    shorten process times. Do not taste food from an unsealed jar or one showing spoilage
    (bulging lid, spurting liquid, unnatural odor, mold): treat it as having produced
    botulinum toxin, which can be fatal whether swallowed or through skin contact,
    and follow USDA disposal and detoxification steps. If any deviation from USDA-tested
    methods may have occurred, boil low-acid and tomato foods in a saucepan before
    eating: 10 minutes below 1,000 ft, plus 1 minute for each additional 1,000 ft.
    Specific to this object: Ensure correct pressure for altitude and proper sealing
    of jars.'
