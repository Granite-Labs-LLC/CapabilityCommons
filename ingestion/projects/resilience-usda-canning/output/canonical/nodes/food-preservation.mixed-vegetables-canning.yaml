bundle_overrides:
  hook: Preserve your garden's bounty and enjoy nutritious vegetables year-round by
    learning how to can mixed vegetables safely at home.
  primer: Canning mixed vegetables is a practical way to preserve a variety of vegetables
    for long-term storage. This process involves using a pressure canner, which is
    essential for safely preserving low-acid foods like vegetables. By canning at
    home, you can ensure that you have access to nutritious, home-grown produce throughout
    the year, even when certain vegetables are out of season. The process requires
    some specific equipment, including a pressure canner, jars, and lids, and involves
    several steps to ensure the vegetables are safely preserved. The vegetables commonly
    used in mixed vegetable canning include carrots, sweet corn, green beans, lima
    beans, tomatoes, and zucchini. It's important to follow the canning process carefully,
    maintaining the correct pressure and processing time, especially considering your
    local altitude, to prevent spoilage and ensure safety. Adjusting the vegetable
    mix based on what's available locally is possible, but certain vegetables like
    leafy greens and squash should be avoided due to safety concerns.
  guide: 'To can mixed vegetables, start by gathering your equipment: a pressure canner,
    jars, lids, and the vegetables you plan to can. Common vegetables include carrots,
    sweet corn, green beans, lima beans, tomatoes, and zucchini. Begin by washing
    and preparing the vegetables. For zucchini, trim and slice or cube it. Combine
    all the vegetables in a large pot, adding enough water to cover them. Optionally,
    add 1 teaspoon of salt per quart to the jar for flavor. Boil the vegetables for
    5 minutes. Next, fill hot jars with the hot vegetables and liquid, leaving a 1-inch
    headspace at the top. Remove any air bubbles by gently tapping the jars or using
    a non-metallic spatula. Adjust the headspace if necessary. Wipe the rims of the
    jars with a damp paper towel to ensure a clean seal. Place the lids on the jars
    and secure them with rings. Process the jars in a pressure canner according to
    the manufacturer''s instructions, adjusting for your altitude. For altitudes of
    0-2,000 feet, process pints for 75 minutes at 11 pounds of pressure and quarts
    for 90 minutes. Adjust the pressure for higher altitudes as needed. Once processed,
    allow the jars to cool undisturbed for 12-24 hours. Check the seals before storing
    the jars in a cool, dark place.'
  reference:
  - Pressure canner
  - Jars and lids
  - Carrots, sweet corn, green beans, lima beans, tomatoes, zucchini
  - 1 teaspoon salt per quart (optional)
  - Boil vegetables for 5 minutes
  - Leave 1-inch headspace
  - Process pints for 75 minutes, quarts for 90 minutes
  - Adjust pressure for altitude
  worksheet:
  - List the vegetables you plan to can and their quantities.
  - Calculate the processing time and pressure needed for your altitude.
  - Practice filling a jar with water to the correct headspace.
  - Simulate removing air bubbles from a jar using a spatula.
  - Create a checklist for the canning process to ensure all steps are followed.
