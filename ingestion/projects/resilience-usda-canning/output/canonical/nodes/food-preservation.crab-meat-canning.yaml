plain_language: This guide explains how to can king and Dungeness crab meat safely
  using a pressure canner. It covers preparation, packing, and processing to ensure
  the crab meat is preserved correctly.
markdown_body: '### What this is

  This is a guide for canning king and Dungeness crab meat using a pressure canner.
  It includes steps for preparation, packing, and processing to ensure safe preservation.


  ### Why it matters

  Canning crab meat allows for long-term storage and preservation, making it possible
  to enjoy crab out of season. Proper canning prevents spoilage and ensures food safety.


  ### What you need

  You will need a pressure canner, jars, salt, lemon juice, and citric acid. Fresh
  crabs are also required.


  ### How to do it

  1. Keep live crabs on ice until ready to can. 2. Wash crabs thoroughly. 3. Simmer
  crabs for 20 minutes in water with lemon juice and salt. 4. Cool, drain, and remove
  meat. 5. Soak meat in a lemon juice or vinegar solution. 6. Drain and squeeze out
  excess moisture. 7. Fill jars with crab meat, add citric acid or lemon juice, and
  cover with boiling water. 8. Process in a pressure canner according to altitude-specific
  guidelines.


  ### Common failure modes

  Incorrect pressure can lead to under-processing. An acidic flavor may develop if
  not processed correctly.


  ### Safety/boundary notes

  Ensure proper pressure is maintained during canning to avoid contamination. Follow
  altitude-specific pressure guidelines.


  ### Local adaptation notes

  Availability of crab may vary by region. Adjust quantities based on local availability.'
