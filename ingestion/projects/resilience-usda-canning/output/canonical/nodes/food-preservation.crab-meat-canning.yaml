bundle_overrides:
  hook: Canning crab meat allows you to enjoy the taste of fresh crab all year round,
    ensuring safety and preventing spoilage.
  primer: Canning king and Dungeness crab meat is a method of preserving these delicious
    seafood delicacies for long-term storage. By using a pressure canner, you can
    safely store crab meat, making it possible to enjoy it even when it's out of season.
    The process involves several steps, including preparing the crabs, packing them
    into jars, and processing them under pressure to ensure they are preserved correctly.
    This method is essential because crab meat is low in acid, which means it requires
    the high temperatures of a pressure canner to prevent the growth of harmful bacteria.
    Proper canning not only extends the shelf life of crab meat but also maintains
    its flavor and nutritional value. However, it's crucial to follow the guidelines
    carefully, as incorrect pressure or processing times can lead to spoilage or an
    acidic taste. With the right equipment and attention to detail, you can successfully
    can crab meat and enjoy it at any time.
  guide: "To can king and Dungeness crab meat, follow these steps: \n\n1. **Prepare\
    \ the Crabs**: Keep live crabs on ice until you're ready to can them. This ensures\
    \ they remain fresh. Wash the crabs thoroughly using several changes of cold water\
    \ to remove any impurities. \n\n2. **Cook the Crabs**: Simmer the crabs for 20\
    \ minutes in a pot of water containing 1 cup of lemon juice and 2 tablespoons\
    \ of salt per gallon. This step helps in cooking the crabs and infusing them with\
    \ flavor. \n\n3. **Cool and Clean**: After simmering, cool the crabs in cold water,\
    \ then drain them. Remove the back shell and extract the meat from the body and\
    \ claws. \n\n4. **Soak the Meat**: Soak the crab meat for 2 minutes in a solution\
    \ of 2 cups of lemon juice or 4 cups of white vinegar, and 2 tablespoons of salt\
    \ per gallon of water. This helps in preserving the meat and enhancing its flavor.\
    \ \n\n5. **Drain and Pack**: Drain the meat and squeeze out excess moisture. Fill\
    \ hot half-pint jars with 6 ounces of crab meat and pint jars with 12 ounces,\
    \ leaving a 1-inch headspace. Add 1/2 teaspoon of citric acid or 2 tablespoons\
    \ of lemon juice to each half-pint jar, or 1 teaspoon of citric acid or 4 tablespoons\
    \ of lemon juice per pint jar. \n\n6. **Seal and Process**: Cover the crab meat\
    \ with fresh boiling water, maintaining a 1-inch headspace. Remove air bubbles\
    \ and adjust the headspace if necessary. Wipe the rims of the jars with a damp\
    \ paper towel, adjust the lids, and process in a pressure canner according to\
    \ altitude-specific guidelines. \n\n7. **Cool and Store**: Once processed, allow\
    \ the jars to cool. Check the seals and store the jars in a cool, dark place."
