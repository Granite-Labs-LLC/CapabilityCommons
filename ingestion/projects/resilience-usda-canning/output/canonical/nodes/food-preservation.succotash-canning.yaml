plain_language: This guide will help you can succotash, a mix of corn, lima beans,
  and optional tomatoes, using a pressure canner. Follow the steps to prepare, pack,
  and process the jars safely.
markdown_body: '### What this is

  This is a guide for canning succotash, a mixture of sweet corn, lima beans, and
  optional tomatoes, using a pressure canner.


  ### Why it matters

  Canning succotash allows you to preserve the flavors of summer vegetables for use
  throughout the year, ensuring you have access to nutritious, home-canned food.


  ### What you need

  You will need a pressure canner, jars, lids, boiling water, and the ingredients:
  sweet corn, lima beans, and optional tomatoes.


  ### How to do it

  1. Prepare vegetables by washing and cutting them as needed. 2. For hot pack, combine
  vegetables in a kettle with water, boil for 5 minutes, and fill jars with the mixture
  and cooking liquid, leaving 1-inch headspace. 3. For raw pack, fill jars with vegetables,
  add boiling water, and leave 1-inch headspace. 4. Remove air bubbles, adjust headspace,
  wipe rims, and adjust lids. 5. Process jars in a pressure canner according to altitude-specific
  guidelines.


  ### Common failure modes

  Incorrect pressure or incomplete seal can lead to spoilage.


  ### Safety/boundary notes

  Ensure the correct pressure is used for your altitude to prevent food spoilage.


  ### Local adaptation notes

  Adjust the recipe based on the availability of ingredients and your local altitude.'
