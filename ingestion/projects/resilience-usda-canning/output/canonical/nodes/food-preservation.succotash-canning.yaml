bundle_overrides:
  hook: Preserve the taste of summer all year round by learning how to can succotash,
    a nutritious blend of sweet corn, lima beans, and optional tomatoes.
  primer: 'Canning succotash is a great way to enjoy the flavors of summer vegetables
    throughout the year. Succotash is a traditional dish made from sweet corn and
    lima beans, often with the addition of tomatoes. By canning it, you can store
    this delicious mix for months, ensuring you have access to nutritious, home-canned
    food even in the off-season. The process involves using a pressure canner, which
    is essential for safely preserving low-acid foods like vegetables. This method
    prevents spoilage and ensures the food remains safe to eat. You''ll need some
    basic equipment: a pressure canner, jars, lids, and boiling water. The ingredients
    include sweet corn, lima beans, and optional tomatoes. The process involves preparing
    the vegetables, packing them into jars, and processing them in the canner. It''s
    important to follow altitude-specific guidelines to ensure the correct pressure
    is used, as incorrect pressure can lead to spoilage. With a little time and effort,
    you can enjoy the taste of fresh succotash whenever you like.'
  guide: 'To can succotash, start by gathering your ingredients: sweet corn, lima
    beans, and optional tomatoes. You''ll also need a pressure canner, jars, and lids.
    Begin by washing and preparing the vegetables. For the hot pack method, combine
    the vegetables in a large kettle with enough water to cover them. Boil gently
    for 5 minutes. Fill hot jars with the vegetable mixture and cooking liquid, leaving
    a 1-inch headspace. For the raw pack method, fill hot jars with equal parts of
    the prepared vegetables, leaving a 1-inch headspace, and add fresh boiling water.
    Remove air bubbles by running a non-metallic spatula around the inside of the
    jar. Adjust the headspace if needed, wipe the rims with a clean, damp paper towel,
    and place the lids on the jars. Process the jars in a pressure canner according
    to the guidelines for your altitude. This ensures the jars are sealed properly
    and prevents spoilage. After processing, let the jars cool undisturbed for 12-24
    hours. Check the seals before storing. Properly canned succotash should have a
    vacuum seal and show no signs of spoilage.'
