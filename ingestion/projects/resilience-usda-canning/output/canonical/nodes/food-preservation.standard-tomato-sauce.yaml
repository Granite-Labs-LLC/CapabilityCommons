bundle_overrides:
  hook: Preserve the taste of summer all year round by learning how to can your own
    tomato sauce, ensuring you have a ready-to-use ingredient for countless recipes.
  primer: Canning tomato sauce is a practical way to preserve the fresh taste and
    nutrients of tomatoes for long-term storage. This process involves preparing tomatoes,
    simmering them to the desired consistency, and sealing them in jars using a boiling-water
    or pressure canner. By canning your own tomato sauce, you can enjoy the flavors
    of ripe tomatoes throughout the year, and have a convenient ingredient ready for
    use in various dishes like pasta, soups, and stews. The process requires some
    basic kitchen tools and ingredients, including fresh tomatoes, bottled lemon juice
    or citric acid for acidification, and optional salt for flavor. Proper canning
    techniques are crucial to ensure food safety and prevent spoilage, making it important
    to follow recommended guidelines for processing times and pressures, especially
    considering your local altitude.
  guide: '1. Gather your materials: fresh tomatoes, bottled lemon juice or citric
    acid, salt (optional), jars, lids, and a boiling-water or pressure canner.

    2. Prepare the tomatoes by washing them thoroughly. Remove stems and any blemishes.
    Cut the tomatoes into quarters.

    3. Simmer the tomatoes in a large saucepan until they soften. Use a food mill
    or sieve to remove skins and seeds, resulting in a smooth sauce.

    4. Return the sauce to the saucepan and simmer until it reaches your desired consistency.
    Reduce by one-third for a thinner sauce or by half for a thicker sauce.

    5. Sterilize your jars and lids by boiling them in water for at least 10 minutes.

    6. Add 2 tablespoons of bottled lemon juice or 1/2 teaspoon of citric acid to
    each quart jar. Optionally, add 1 teaspoon of salt per quart.

    7. Fill the hot jars with the sauce, leaving a 1/4-inch headspace. Remove air
    bubbles by gently tapping the jars or using a non-metallic spatula.

    8. Wipe the rims of the jars with a clean, damp cloth to ensure a good seal. Place
    the lids on the jars and screw on the bands until fingertip tight.

    9. Process the jars in a boiling-water or pressure canner, adjusting the time
    and pressure based on your altitude and canner type. Refer to canning guidelines
    for specific times.

    10. Once processed, remove the jars and let them cool undisturbed for 12-24 hours.
    Check the seals before storing. Properly sealed jars can be stored in a cool,
    dark place for up to a year.'
