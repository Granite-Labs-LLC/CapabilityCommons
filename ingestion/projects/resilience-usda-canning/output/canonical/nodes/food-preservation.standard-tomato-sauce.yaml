summary_short: Guide to canning standard tomato sauce, including preparation and processing.
summary_medium: This project blueprint provides detailed instructions for canning
  standard tomato sauce, covering preparation, acidification, and processing times
  using different canning methods.
plain_language: Learn how to can standard tomato sauce by preparing tomatoes, simmering
  the sauce, adding acid and salt, and processing jars using a boiling-water or pressure
  canner.
markdown_body: '### What this is

  This is a guide for canning standard tomato sauce, which involves preparing tomatoes,
  simmering them to the desired consistency, and processing them in jars using a boiling-water
  or pressure canner.


  ### Why it matters

  Canning tomato sauce allows you to preserve the flavor and nutrients of fresh tomatoes
  for long-term storage, providing a convenient and ready-to-use ingredient for various
  recipes.


  ### What you need

  You will need tomatoes, bottled lemon juice or citric acid, salt (optional), a boiling-water
  canner or pressure canner, jars, lids, and basic kitchen tools.


  ### How to do it

  1. Prepare and press tomatoes as for making tomato juice. 2. Simmer the sauce in
  a large saucepan until it reaches the desired consistency, reducing by one-third
  for thin sauce or by one-half for thick sauce. 3. Add bottled lemon juice or citric
  acid to jars. 4. Optionally, add 1 teaspoon of salt per quart. 5. Fill hot jars,
  leaving 1/4-inch headspace, remove air bubbles, and adjust headspace if needed.
  6. Wipe rims, adjust lids, and process jars using the recommended times and pressures
  for your altitude and canner type.


  ### Common failure modes

  Not achieving the correct sauce consistency, improper acidification, and incorrect
  processing times or pressures can lead to spoilage.


  ### Safety/boundary notes

  Ensure proper acidification to prevent the growth of harmful bacteria. Follow all
  processing instructions carefully to ensure food safety.


  ### Local adaptation notes

  Adjust processing times and pressures based on local altitude and available canning
  equipment.'
