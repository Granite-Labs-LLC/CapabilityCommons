plain_language: Learn how to can beets safely using a pressure canner, with steps
  for preparation, packing, and processing.
markdown_body: "### What this is\nThis guide provides step-by-step instructions for\
  \ canning beets, whether whole, cubed, or sliced, using a pressure canner.\n\n###\
  \ Why it matters\nCanning beets allows for long-term storage and preservation of\
  \ their nutritional value, making them available year-round.\n\n### What you need\n\
  You will need a pressure canner, jars, lids, boiling water, and optionally, salt.\n\
  \n### How to do it\n1. Trim beet tops, leaving an inch of stem and roots. Scrub\
  \ well. \n2. Boil beets until skins slip off easily (15-25 minutes). \n3. Cool,\
  \ remove skins, and trim stems and roots. \n4. Cut beets as desired. \n5. Pack hot\
  \ beets into jars, add hot water, and leave 1-inch headspace. \n6. Process in a\
  \ pressure canner according to altitude-specific guidelines.\n\n### Common failure\
  \ modes\nIncorrect pressure settings or incomplete seals can lead to spoilage.\n\
  \n### Safety/boundary notes\nEnsure correct pressure settings based on your altitude\
  \ to prevent foodborne illness.\n\n### Local adaptation notes\nConsider local availability\
  \ of beets and adjust pressure settings for your altitude."
