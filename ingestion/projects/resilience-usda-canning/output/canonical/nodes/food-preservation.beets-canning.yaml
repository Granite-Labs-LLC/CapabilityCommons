bundle_overrides:
  hook: Preserve the vibrant taste and nutrition of beets year-round by learning how
    to can them safely at home.
  primer: Canning beets is a practical way to enjoy their nutritional benefits throughout
    the year. Beets are rich in essential nutrients like fiber, folate, and vitamin
    C, making them a healthy addition to your diet. By canning, you can store beets
    for long periods without losing their nutritional value. The process involves
    using a pressure canner, which is essential for safely preserving low-acid foods
    like beets. This method prevents the growth of harmful bacteria, ensuring your
    canned beets are safe to eat. You'll need fresh beets, a pressure canner, jars,
    lids, boiling water, and optionally, salt. The process includes preparing the
    beets by trimming, boiling, and peeling them, then packing them into jars with
    hot water before processing them in the canner. Following altitude-specific guidelines
    for pressure settings is crucial to prevent spoilage and foodborne illness. With
    the right tools and careful attention to detail, you can successfully can beets
    and enjoy them whenever you like.
  guide: 'To can beets, start by gathering your materials: fresh beets, a pressure
    canner, jars, lids, boiling water, and salt if desired. Begin by trimming the
    beet tops, leaving about an inch of stem and roots to minimize color bleeding.
    Scrub the beets thoroughly to remove any dirt. Next, place the beets in a pot
    of boiling water and cook them until the skins slip off easily, which usually
    takes 15 to 25 minutes depending on their size. Once boiled, cool the beets in
    cold water, then remove the skins and trim off any remaining stems and roots.
    Decide how you want to cut the beets—leave small ones whole, or cut larger ones
    into 1/2-inch cubes or slices. Pack the hot beets into sterilized jars, adding
    boiling water to cover them, and leave a 1-inch headspace at the top of each jar.
    If you like, add 1 teaspoon of salt per quart jar for flavor. Secure the lids
    on the jars and place them in the pressure canner. Process the jars according
    to the pressure and time guidelines specific to your altitude to ensure safety.
    Once processed, let the jars cool and check that the seals are intact before storing
    them.'
