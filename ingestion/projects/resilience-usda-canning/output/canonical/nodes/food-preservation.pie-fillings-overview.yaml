markdown_body: '### What this is

  This is an overview of how to prepare pie fillings for canning. It includes guidance
  on using Clear Jel® as a thickening agent and considerations for selecting and adjusting
  fruit varieties and flavors.


  ### Why it matters

  Using the right ingredients and methods ensures that canned pie fillings have a
  desirable consistency and flavor, and are safe to store and use.


  ### What you need

  Clear Jel® (a modified corn starch), canning jars, selected fruits, sugar, spices,
  and lemon juice.


  ### How to do it

  Select your fruit and adjust the sugar and spices to your taste. Use Clear Jel®
  to achieve the right consistency. Do not alter the amount of lemon juice as it is
  crucial for safety. For frozen fruits like cherries and blueberries, rinse off any
  added sugar and use the juice to replace some of the water in the recipe.


  ### Common failure modes

  Using other starches instead of Clear Jel® can result in a runny sauce consistency.


  ### Safety/boundary notes

  Do not change the amount of lemon juice in the recipe as it is important for controlling
  safety and storage stability.


  ### Local adaptation notes

  Clear Jel® may not be available in all grocery stores. Check with local extension
  services for availability.'
