bundle_overrides:
  hook: Preserve the fresh taste of peaches in a spicy salsa form, adding a unique
    and flavorful twist to your pantry.
  primer: Peach Salsa is a delightful twist on the traditional Mango Salsa, offering
    a sweet and spicy combination that can be enjoyed year-round. By substituting
    peaches for mangoes, you can create a unique salsa that captures the essence of
    summer. The process involves canning, which is a method of preserving food by
    sealing it in airtight containers. This ensures that the salsa remains fresh and
    safe to eat for months. The key to a successful Peach Salsa is using hard, underripe
    yellow peaches, which provide the best texture and flavor. Canning requires some
    specific equipment, including a Dutch oven, a boiling-water canner, jars, and
    lids. It's important to ensure that all equipment is sterilized to prevent contamination
    and spoilage. Adjusting the spice level to suit your taste is possible, but maintaining
    the correct acidity level is crucial for safe canning. This project not only teaches
    you how to make Peach Salsa but also provides valuable skills in food preservation.
  guide: 'To make and can Peach Salsa, start by gathering your ingredients and equipment.
    You will need hard, underripe yellow peaches, a Dutch oven, a boiling-water canner,
    jars, and lids. Begin by preparing the peaches: peel, pit, and dice them into
    small pieces. Next, follow the Mango Salsa recipe, substituting the diced peaches
    for mangoes. Combine all ingredients in an 8-quart Dutch oven or stockpot. Bring
    the mixture to a boil, then reduce the heat and simmer for about 10 minutes, stirring
    occasionally. While the salsa is cooking, prepare your jars by sterilizing them
    in boiling water. Once the salsa is ready, carefully ladle it into the hot jars,
    leaving about 1/2 inch of headspace. Wipe the rims of the jars with a dampened
    clean paper towel to remove any residue. Place the lids on the jars and adjust
    the bands until they are fingertip tight. Process the jars in a boiling-water
    canner for the recommended time based on your altitude. After processing, remove
    the jars and let them cool undisturbed for 12-24 hours. Check the seals by pressing
    the center of each lid; it should not flex up and down. Store the sealed jars
    in a cool, dark place. If any jars did not seal properly, refrigerate them and
    use the salsa within a week.'
