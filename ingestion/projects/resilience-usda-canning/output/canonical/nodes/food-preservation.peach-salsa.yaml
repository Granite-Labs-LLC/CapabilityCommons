summary_short: Learn how to make and can Peach Salsa using a simple substitution method.
summary_medium: This project blueprint guides you through making and canning Peach
  Salsa by substituting peaches for mangoes in a standard salsa recipe.
plain_language: This project will teach you how to make Peach Salsa by following the
  Mango Salsa recipe but using peaches instead of mangoes. You'll learn how to can
  the salsa safely.
markdown_body: '### What this is

  This is a project blueprint for making and canning Peach Salsa. It involves using
  a standard Mango Salsa recipe but substituting peaches for mangoes.


  ### Why it matters

  Canning Peach Salsa allows you to preserve the fresh taste of peaches in a spicy
  salsa form, providing a unique and flavorful addition to your pantry.


  ### What you need

  You will need a Dutch oven, a boiling-water canner, jars, and lids. The main ingredient
  is hard, underripe but yellow peaches.


  ### How to do it

  Follow the Mango Salsa procedure, substituting diced peaches for mangoes. Ensure
  that the peaches are hard and underripe for the best texture and flavor.


  ### Common failure modes

  Improper sealing of jars can lead to spoilage. Ensure that all jars are sealed correctly
  to prevent this.


  ### Safety/boundary notes

  Ensure that all canning equipment is sterilized and that jars are sealed properly
  to prevent contamination.


  ### Local adaptation notes

  Adjust the spice level to suit local taste preferences, but ensure that the acidity
  level is maintained for safe canning.'
