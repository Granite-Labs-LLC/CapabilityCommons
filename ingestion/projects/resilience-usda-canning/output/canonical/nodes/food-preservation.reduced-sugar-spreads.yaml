markdown_body: '### What this is

  This project involves making fruit spreads that are lower in sugar and calories
  compared to traditional jams and jellies. Gelatin is used as a thickening agent,
  and low-calorie sweeteners provide the sweetness.


  ### Why it matters

  Reduced-sugar fruit spreads offer a healthier alternative for those looking to decrease
  their sugar intake while still enjoying flavorful spreads.


  ### What you need

  You will need gelatin, a saucepan, sweet fruits, apple juice, spices, and a liquid
  low-calorie sweetener.


  ### How to do it

  Combine the sweet fruits, apple juice, spices, and low-calorie sweetener in a saucepan.
  Bring the mixture to a boil and add gelatin to thicken. Once thickened, allow the
  spread to cool before refrigerating.


  ### Common failure modes

  Insufficient thickening can occur if the gelatin is not properly dissolved or if
  the proportions are incorrect.


  ### Safety/boundary notes

  These spreads should not be processed in jars. They must be refrigerated and consumed
  within four weeks to ensure safety.


  ### Local adaptation notes

  Adjust the types of fruits and spices based on local availability and personal taste
  preferences.'
