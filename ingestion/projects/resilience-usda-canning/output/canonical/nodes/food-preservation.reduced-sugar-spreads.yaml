bundle_overrides:
  hook: Discover how to enjoy delicious fruit spreads with less sugar and calories,
    perfect for a healthier lifestyle.
  primer: Reduced-sugar fruit spreads offer a tasty alternative to traditional jams
    and jellies, allowing you to enjoy the sweet flavors of fruit without the high
    sugar content. These spreads use gelatin as a thickening agent and low-calorie
    sweeteners to maintain sweetness. Unlike regular jams, these spreads are not processed
    in jars but must be refrigerated and consumed within four weeks. This method is
    ideal for those looking to reduce their sugar intake while still enjoying flavorful
    spreads. You will need basic ingredients like sweet fruits, apple juice, spices,
    and a liquid low-calorie sweetener, along with a saucepan for preparation. The
    process involves boiling the mixture and adding gelatin to achieve the desired
    thickness. This project is simple, cost-effective, and can be adapted to suit
    local fruit availability and personal taste preferences.
  guide: 'To make a reduced-sugar fruit spread, start by gathering your ingredients:
    gelatin, sweet fruits of your choice, unsweetened apple juice, spices (such as
    cinnamon or nutmeg), and a liquid low-calorie sweetener. Begin by preparing your
    fruits, ensuring they are clean and cut into small pieces. In a saucepan, combine
    the fruits, apple juice, and spices. Heat the mixture over medium heat until it
    begins to boil. Stir occasionally to prevent sticking. Once boiling, reduce the
    heat and add the gelatin, stirring continuously to ensure it dissolves completely.
    This step is crucial for achieving the right consistency. After the gelatin is
    fully incorporated, add the liquid low-calorie sweetener to taste. Continue to
    simmer the mixture for a few more minutes, then remove it from the heat. Allow
    the spread to cool slightly before transferring it to clean containers. Refrigerate
    the spread immediately and use it within four weeks. Remember, these spreads are
    not suitable for canning and must be kept refrigerated to ensure safety.'
  reference:
  - Use gelatin as a thickening agent.
  - Combine sweet fruits, apple juice, spices, and sweetener.
  - Boil the mixture before adding gelatin.
  - Refrigerate and consume within four weeks.
  - Do not process in jars.
  worksheet:
  - List the fruits you plan to use and their quantities.
  - Calculate the amount of gelatin needed for your batch size.
  - Experiment with different spices to find your preferred flavor.
  - Record the amount of sweetener used and adjust to taste.
  - Note the time taken for the spread to thicken and cool.
