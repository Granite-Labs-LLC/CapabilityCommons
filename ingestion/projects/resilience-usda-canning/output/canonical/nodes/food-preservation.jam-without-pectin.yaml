bundle_overrides:
  hook: Discover how to make delicious homemade jam using just ripe fruits and sugar,
    without any added pectin.
  primer: Making jam without added pectin is a traditional method that relies on the
    natural pectin found in fully ripe fruits. Pectin is a natural thickening agent
    that helps jam set, and many fruits contain enough of it to create a perfect consistency
    without needing commercial pectin. This method not only reduces the number of
    ingredients but also enhances the natural flavor and texture of the fruit. To
    make jam this way, you'll need ripe fruits, sugar, and sometimes lemon juice,
    which can help with both flavor and setting. The process involves washing and
    preparing the fruit, cooking it with sugar until it thickens, and then preserving
    it in sterile jars. This method is cost-effective and allows for customization
    based on the fruit's natural sweetness and acidity. It's important to ensure proper
    boiling and testing for doneness to achieve the right consistency and to process
    the jars correctly to prevent spoilage.
  guide: '1. Start by selecting fully ripe fruits, as they contain the most natural
    pectin. Wash and rinse the fruits thoroughly, but do not soak them. Remove any
    stems, skins, and pits, then crush the fruit. For seedy berries, you may want
    to use a sieve or food mill to remove seeds.


    2. Measure the crushed fruit into a large saucepan. Add sugar according to your
    taste and the fruit''s natural sweetness. Stir the mixture constantly as you bring
    it to a boil.


    3. Continue boiling the mixture until it thickens. You can use a thermometer to
    check the temperature or perform a refrigerator test by placing a small amount
    of jam on a cold plate to see if it sets.


    4. Once the jam has reached the desired consistency, remove it from the heat.
    Quickly skim off any foam that has formed on the surface.


    5. Fill sterile jars with the hot jam, leaving about 1/4 inch of headspace at
    the top. This space is crucial for proper sealing.


    6. Process the jars in a boiling-water canner for the recommended time, which
    varies depending on your altitude. This step is essential to ensure the jam is
    safely preserved and can be stored for later use.'
  reference:
  - Use fully ripe fruits for best results.
  - Wash fruits thoroughly; do not soak.
  - Crush fruits and remove seeds if necessary.
  - Boil fruit and sugar mixture until thickened.
  - Use a thermometer or cold plate test for doneness.
  - Fill sterile jars, leaving 1/4 inch headspace.
  - Process jars in a boiling-water canner.
  worksheet:
  - List the fruits you plan to use and their natural pectin levels.
  - Calculate the amount of sugar needed based on the fruit's sweetness.
  - Practice the refrigerator test with a small batch of jam.
  - Record the boiling time needed to achieve the desired consistency.
  - Note the altitude adjustments required for your canning process.
  teach_forward_kit:
    three_minute_version: Learn to make jam without added pectin by using ripe fruits
      and sugar. Prepare the fruit, boil with sugar until thick, and preserve in jars.
    ten_minute_outline:
    - Introduction to natural pectin and its role in jam-making.
    - Steps to prepare and crush the fruit.
    - Boiling process and testing for doneness.
    - Filling jars and ensuring proper sealing.
    - Canning process and altitude adjustments.
    discussion_prompts:
    - What are the benefits of making jam without added pectin?
    - How does the natural pectin in fruits affect the jam's texture?
    - What challenges might arise when making jam this way?
    - How can you adjust the recipe based on different fruits?
