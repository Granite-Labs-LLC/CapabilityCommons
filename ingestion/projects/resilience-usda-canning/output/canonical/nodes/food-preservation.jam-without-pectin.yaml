summary_short: Make jam using fully ripe fruits without added pectin.
summary_medium: Learn to make jam without added pectin by using the natural pectin
  in fully ripe fruits. Follow the steps to prepare, boil, and test the jam for doneness.
plain_language: This guide helps you make jam using only the natural pectin found
  in ripe fruits, without adding commercial pectin.
markdown_body: "# What this is\nThis project blueprint provides instructions for making\
  \ jam without added pectin, using the natural pectin in fully ripe fruits.\n\n#\
  \ Why it matters\nMaking jam without added pectin allows you to use fewer ingredients\
  \ and rely on the natural properties of the fruit, which can enhance flavor and\
  \ texture.\n\n# What you need\nFully ripe fruits, sugar, lemon juice (for some fruits),\
  \ a large saucepan, a thermometer, sterile jars, and a boiling-water canner.\n\n\
  # How to do it\n1. Wash and rinse fruits thoroughly. Do not soak. Remove stems,\
  \ skins, and pits, then crush the fruit. For seedy berries, use a sieve or food\
  \ mill. \n2. Measure crushed fruit into a large saucepan. Add sugar and bring to\
  \ a boil while stirring constantly. \n3. Boil until the mixture thickens. Use a\
  \ thermometer or refrigerator test to check for doneness. \n4. Remove from heat,\
  \ skim off foam, and fill sterile jars with jam, leaving 1/4 inch headspace. \n\
  5. Process jars in a boiling-water canner for the recommended time based on altitude.\n\
  \n# Common failure modes\nRunny jam due to insufficient boiling or incorrect testing\
  \ for doneness.\n\n# Safety/boundary notes\nEnsure jars are sterile and processed\
  \ correctly to prevent spoilage.\n\n# Local adaptation notes\nAdjust sugar and lemon\
  \ juice quantities based on fruit sweetness and acidity."
