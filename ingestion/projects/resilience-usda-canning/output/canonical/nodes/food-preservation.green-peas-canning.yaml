bundle_overrides:
  hook: Preserve the taste of fresh peas year-round by learning how to can them safely
    and effectively.
  primer: 'Canning green or English peas is a fantastic way to enjoy this nutritious
    vegetable throughout the year. The process involves using a pressure canner, which
    is essential for safely preserving low-acid foods like peas. By canning your peas,
    you can ensure that you have a ready supply of this healthy vegetable, even when
    they''re out of season. The process requires some basic equipment: a pressure
    canner, jars, lids, and boiling water. Optionally, you can add salt for flavor.
    There are two main methods for packing peas into jars: hot packing and raw packing.
    Hot packing involves boiling the peas before placing them in jars, while raw packing
    involves placing raw peas directly into jars and covering them with boiling water.
    Both methods require careful attention to detail, such as removing air bubbles,
    adjusting headspace, and ensuring proper sealing to prevent spoilage. It''s crucial
    to follow altitude-specific guidelines for pressure settings to ensure safety
    and prevent foodborne illnesses.'
  guide: "1. Gather your materials: green or English peas, a pressure canner, jars,\
    \ lids, boiling water, and optionally, salt.\n2. Shell and wash the peas thoroughly.\n\
    3. Choose your packing method:\n   - Hot Pack: Boil the peas for 2 minutes. Fill\
    \ hot jars loosely with the hot peas and cooking liquid, leaving a 1-inch headspace.\n\
    \   - Raw Pack: Fill hot jars with raw peas, then add boiling water, leaving a\
    \ 1-inch headspace.\n4. Add 1 teaspoon of salt per quart to the jar, if desired.\n\
    5. Remove air bubbles by gently tapping the jars or using a non-metallic spatula.\n\
    6. Adjust the headspace if necessary by adding more liquid.\n7. Wipe the rims\
    \ of the jars with a clean, damp paper towel to ensure a good seal.\n8. Place\
    \ the lids on the jars and adjust the bands until they are fingertip tight.\n\
    9. Process the jars in a pressure canner according to the altitude-specific guidelines:\n\
    \   - For altitudes of 0-2,000 ft, use 11 PSI.\n   - For altitudes of 2,001-4,000\
    \ ft, use 12 PSI.\n   - For altitudes of 4,001-6,000 ft, use 13 PSI.\n   - For\
    \ altitudes of 6,001-8,000 ft, use 14 PSI.\n10. Once processing is complete, allow\
    \ the canner to depressurize naturally before removing the jars.\n11. Check the\
    \ seals after the jars have cooled. If any jars did not seal, refrigerate and\
    \ use them first."
