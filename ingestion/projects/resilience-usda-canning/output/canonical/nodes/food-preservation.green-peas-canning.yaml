markdown_body: '### What this is

  This is a guide for canning green or English peas using a pressure canner. It includes
  instructions for preparing the peas, packing them into jars, and processing them
  safely.


  ### Why it matters

  Canning peas allows you to preserve them for long-term storage, ensuring you have
  access to this nutritious vegetable year-round.


  ### What you need

  You will need a pressure canner, jars, lids, boiling water, and optionally, salt.


  ### How to do it

  Start by shelling and washing the peas. For hot packing, cover peas with boiling
  water, boil for 2 minutes, and fill jars with hot peas and liquid, leaving 1-inch
  headspace. For raw packing, fill jars with raw peas, add boiling water, and leave
  1-inch headspace. Remove air bubbles, adjust headspace, wipe rims, adjust lids,
  and process in a pressure canner according to the altitude-specific guidelines.


  ### Common failure modes

  Common issues include incorrect pressure settings and incomplete seals, which can
  lead to spoilage.


  ### Safety/boundary notes

  Ensure you use the correct pressure for your altitude to prevent spoilage and ensure
  safety.


  ### Local adaptation notes

  Consider the availability of fresh peas and adjust processing pressure based on
  local altitude.'
