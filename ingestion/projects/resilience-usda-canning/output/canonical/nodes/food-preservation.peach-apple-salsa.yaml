bundle_overrides:
  hook: Preserve the delightful flavors of summer with Peach Apple Salsa, a delicious
    condiment you can enjoy year-round.
  primer: Canning Peach Apple Salsa is a fantastic way to capture the fresh, vibrant
    flavors of peaches and apples, allowing you to enjoy them long after the season
    ends. This process involves preparing a mixture of fruits and vegetables, seasoning
    them with spices, and preserving them in jars using a boiling-water canner. The
    salsa combines the sweetness of peaches and apples with the tanginess of tomatoes
    and the spice of peppers, creating a versatile condiment that pairs well with
    many dishes. Canning not only extends the shelf life of your salsa but also ensures
    that it remains safe to eat by preventing the growth of bacteria. By following
    the proper canning procedures, including adjusting processing times for altitude
    and ensuring jars are sealed correctly, you can enjoy your homemade salsa throughout
    the year.
  guide: "To make and can Peach Apple Salsa, start by gathering your ingredients:\
    \ Roma tomatoes, yellow onions, green bell peppers, hard unripe peaches, Granny\
    \ Smith apples, mixed pickling spice, canning salt, crushed red pepper flakes,\
    \ light brown sugar, and cider vinegar. You'll also need an 8- or 10-quart Dutch\
    \ oven or saucepot, a boiling-water canner, pint jars, lids, and a cheesecloth\
    \ or muslin spice bag. \n\n1. Prepare a spice bag by placing the pickling spice\
    \ in a piece of cheesecloth and tying it securely. \n2. Wash, peel, and chop the\
    \ tomatoes, onions, and bell peppers. \n3. Wash, peel, and soak the peaches and\
    \ apples in an ascorbic acid solution for 10 minutes to prevent browning, then\
    \ chop them. \n4. Combine the chopped tomatoes, onions, bell peppers, peaches,\
    \ and apples in the saucepot. Add the spice bag, salt, red pepper flakes, brown\
    \ sugar, and vinegar. \n5. Bring the mixture to a boil, stirring gently. Reduce\
    \ the heat and let it simmer for 30 minutes, stirring occasionally. \n6. Remove\
    \ the spice bag and discard it. \n7. Using a slotted spoon, fill the hot pint\
    \ jars with the salsa solids, leaving a 1-1/4-inch headspace. Cover with the cooking\
    \ liquid, leaving a 1/2-inch headspace. \n8. Remove air bubbles, adjust headspace\
    \ if necessary, wipe the rims of the jars, and adjust the lids. \n9. Process the\
    \ jars in a boiling-water canner for the recommended time based on your altitude\
    \ (15 minutes for 0-1,000 ft, 20 minutes for 1,001-6,000 ft, and 25 minutes above\
    \ 6,000 ft). \n10. After processing, let the jars cool and check the seals. Properly\
    \ sealed jars can be stored for future enjoyment."
