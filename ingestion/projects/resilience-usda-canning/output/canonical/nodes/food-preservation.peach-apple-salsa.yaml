  support:
  - source_id: src.usda.home-canning.2015
    page_start: 76
    page_end: 76
    segment_id: src.usda.home-canning.2015::seg_000101
    excerpt: '### PEACH APPLE SALSA


      6 cups chopped Roma tomatoes


      2-1/2 cups diced yellow onions


      2 cups chopped green bell peppers


      10 cups chopped hard, unripe peaches


      2 cups chopped Granny Smith apples


      4 tbsp mixed pickling spice


      1 tbsp canning salt


      2 tsp crushed red pepper flakes


      3-3/4 cups (1-1/4 pounds) packed light brown sugar


      2-1/4 cups cider vinegar (5%)


      **Yield:** About 7 pint jars


      **Procedure:** Place pickling spice on a clean, double-layered, 6-inch-square
      piece of 100% cheesecloth. Bring corners together and tie with a clean string.
      (Or use a purchased muslin spice bag). Wash and peel tomatoes (place washed
      tomatoes in boiling water for 1 minute, immediately place in cold water, and
      slip off skins). Chop into 1/2-inch pieces. Peel, wash and dice onions into
      1/4-inch pieces. Wash, core, and seed bell peppers; chop into 1/4-inch pieces.
      Combine chopped tomatoes, onions and peppers in an 8- or 10- quart Dutch oven
      or saucepot. Wash, peel and pit peaches; cut into halves and soak for 10 minutes
      in an ascorbic acid solution (1500 mg in half gallon water). Wash, peel and
      core apples; cut into halves and soak for 10 minutes in ascorbic acid solution.
      Quickly chop peaches and apples into 1/2-inch cubes to prevent browning. Add
      chopped peaches and apples to the saucepot with the vegetables. Add the pickling
      spice bag to the saucepot; stir in the salt, red pepper flakes, brown sugar
      and vinegar. Bring to boiling, stirring gently to mix ingredients. Reduce heat
      and simmer 30 minutes, stirring occasionally. Remove spice bag from pan and
      discard. With a slotted spoon, fill salsa solids into hot pint jars, leaving
      1-1/4-inch headspace (about 3/4 pound solids in each jar). Cover with cooking
      liquid, leaving 1/2-inch headspace. Remove air bubbles and adjust headspace
      if needed. Wipe rims of jars with a dampened clean paper towel. Adjust lids
      and process.'
