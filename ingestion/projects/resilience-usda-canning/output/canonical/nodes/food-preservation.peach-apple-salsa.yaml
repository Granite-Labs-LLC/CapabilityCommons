markdown_body: '### What this is

  This project blueprint provides instructions for making and canning Peach Apple
  Salsa. It includes a list of ingredients, the procedure for preparation, and the
  recommended processing times for safe canning.


  ### Why it matters

  Canning Peach Apple Salsa allows you to preserve the flavors of fresh peaches and
  apples, providing a delicious condiment that can be enjoyed year-round. Proper canning
  ensures the salsa is safe to eat and maintains its quality.


  ### What you need

  You will need an 8- or 10-quart Dutch oven or saucepot, a boiling-water canner,
  pint jars, lids, and a cheesecloth or muslin spice bag. Ingredients include Roma
  tomatoes, yellow onions, green bell peppers, hard unripe peaches, Granny Smith apples,
  mixed pickling spice, canning salt, crushed red pepper flakes, light brown sugar,
  and cider vinegar.


  ### How to do it

  1. Prepare a spice bag with pickling spice using cheesecloth. 2. Wash, peel, and
  chop tomatoes, onions, and bell peppers. 3. Wash, peel, and soak peaches and apples
  in an ascorbic acid solution, then chop. 4. Combine all ingredients in a saucepot,
  add the spice bag, and bring to a boil. 5. Simmer for 30 minutes. 6. Fill hot pint
  jars with salsa, leaving appropriate headspace, and process in a boiling-water canner
  for the recommended time based on altitude.


  ### Common failure modes

  Common issues include browning of fruit if not properly soaked in ascorbic acid
  and improper sealing of jars if headspace is not correctly adjusted.


  ### Safety/boundary notes

  Ensure jars are properly sealed and processed for the correct time to prevent spoilage.
  Adjust processing time based on altitude to ensure safety.


  ### Local adaptation notes

  Adjust processing times for altitudes above 1,000 feet as specified in the procedure.'
