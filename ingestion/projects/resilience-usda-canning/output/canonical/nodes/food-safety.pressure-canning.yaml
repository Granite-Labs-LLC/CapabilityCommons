summary_short: Guidelines for safe pressure canning of low-acid foods to prevent botulism.
summary_medium: Pressure canning is essential for safely preserving low-acid foods
  like meats and vegetables. This guide outlines the importance of using accurate
  pressure canner gauges and following correct process times to prevent botulism.
plain_language: Learn how to safely can low-acid foods using a pressure canner to
  avoid the risk of botulism poisoning.
markdown_body: '### What this is

  This guide provides safety guidelines for pressure canning low-acid foods such as
  meat, poultry, seafood, and vegetables. It emphasizes the importance of using a
  pressure canner to prevent botulism.


  ### Why it matters

  Botulism is a serious foodborne illness caused by the bacterium Clostridium botulinum.
  Proper pressure canning destroys these bacteria in low-acid foods, preventing the
  production of a deadly toxin.


  ### What you need

  A pressure canner with an accurate gauge, up-to-date process times and pressures
  for your specific food and jar size, and knowledge of your altitude to adjust processing
  times if necessary.


  ### How to do it

  Ensure your pressure canner gauge is accurate. Use the correct process times and
  pressures for the type of food, jar size, and altitude. Check that jars are sealed
  properly and show no signs of spoilage before consuming.


  ### Common failure modes

  Using a boiling water canner instead of a pressure canner for low-acid foods can
  lead to botulism. Inaccurate gauges or incorrect processing times can also result
  in unsafe food.


  ### Safety/boundary notes

  Always use a pressure canner for low-acid foods. If unsure about the canning process,
  boil the food for 10 minutes before consuming, adding 1 minute for every 1,000 ft
  above 1,000 ft elevation.


  ### Local adaptation notes

  Adjust boiling times based on your local altitude to ensure safety.'
