bundle_overrides:
  hook: Canning fish in quart jars allows you to enjoy fresh-tasting seafood year-round
    without the need for refrigeration.
  primer: Canning fish is a method of preserving seafood by packing it into jars and
    processing it under high pressure. This technique ensures that the fish remains
    safe to eat and retains its nutritional value for extended periods. The process
    involves several critical steps, including bleeding and eviscerating the fish
    immediately after catching, cutting it into appropriate sizes, and packing it
    into jars. The jars are then processed in a pressure canner, which is essential
    for eliminating bacteria and ensuring the fish is preserved safely. This method
    is particularly useful for those who catch fish in large quantities and want to
    store it for future use. By following the correct procedures, you can avoid common
    issues such as the formation of struvite crystals or underprocessing due to incorrect
    pressure settings.
  guide: '1. Begin by bleeding and eviscerating the fish immediately after catching.
    This step is crucial and should be done within two hours to ensure freshness and
    safety.

    2. Rinse the fish thoroughly under cold water to remove any blood or debris.

    3. Cut the fish into fillets or chunks that will fit comfortably into your quart
    jars. Ensure the pieces are of uniform size for even processing.

    4. Prepare your quart jars by washing them in hot, soapy water and rinsing well.
    Keep them hot until ready to use.

    5. Pack the fish pieces solidly into the hot jars, leaving a 1-inch headspace
    at the top. This space is necessary to allow for expansion during processing.

    6. Clean the rims of the jars with a damp cloth to remove any residue that could
    prevent sealing.

    7. Place the lids on the jars and adjust the bands until they are fingertip tight.

    8. Process the jars in a pressure canner for 160 minutes. The pressure required
    will depend on your altitude, so consult a reliable source to determine the correct
    settings.

    9. Once processing is complete, allow the canner to depressurize naturally before
    removing the jars.

    10. Let the jars cool undisturbed for 12-24 hours. Check the seals before storing
    the jars in a cool, dark place.'
