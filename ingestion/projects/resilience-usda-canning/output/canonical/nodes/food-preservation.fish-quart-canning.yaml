summary_medium: Detailed procedure for canning fish in quart jars, including preparation,
  packing, and processing times for both dial-gauge and weighted-gauge pressure canners.
plain_language: This guide explains how to safely can fish in quart jars using a pressure
  canner. It includes steps for preparing the fish, packing it into jars, and processing
  it at the correct pressure and time.
markdown_body: '### What this is

  This is a detailed guide for canning fish in quart jars using a pressure canner.
  It covers preparation, packing, and processing to ensure safe preservation.


  ### Why it matters

  Canning fish allows for long-term storage without refrigeration, preserving the
  nutritional value and flavor of the fish.


  ### What you need

  You''ll need a pressure canner, quart jars, salt, and optionally vinegar and oil.
  Ensure you have fresh or properly thawed fish.


  ### How to do it

  1. Bleed and eviscerate the fish immediately after catching. 2. Rinse and cut the
  fish into jar-length fillets or chunks. 3. Pack the fish into hot quart jars, leaving
  1-inch headspace. 4. Clean jar rims and adjust lids. 5. Process in a pressure canner
  for 160 minutes at the appropriate pressure for your altitude.


  ### Common failure modes

  Formation of struvite crystals, incorrect pressure leading to underprocessing.


  ### Safety/boundary notes

  Ensure proper pressure is maintained throughout the canning process to avoid contamination
  and ensure safety.


  ### Local adaptation notes

  Adapt the procedure based on the availability of local fish varieties.'
