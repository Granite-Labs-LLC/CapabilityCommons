markdown_body: '# What this is


  This guide covers the process of preparing and canning jams and jellies. It includes
  steps for selecting fruit, preparing it for canning, and sealing it in jars to preserve
  flavor and safety.


  ### Why it matters


  Canning jams and jellies allows you to preserve seasonal fruits, reduce food waste,
  and enjoy homemade spreads year-round. Proper canning techniques are crucial to
  prevent spoilage and ensure food safety.


  ### What you need


  You will need canning jars, lids, a canner, and fresh fruit. Additional tools include
  a jar lifter, funnel, and a ladle.


  ### How to do it


  1. Prepare the fruit by washing and cutting it as needed. 2. Sterilize jars and
  lids by boiling them. 3. Cook the fruit with sugar and pectin to the desired consistency.
  4. Fill jars with the hot mixture, leaving appropriate headspace. 5. Seal jars with
  lids and process them in a boiling water canner for the recommended time.


  ### Common failure modes


  Improper sealing can lead to spoilage. Contamination can occur if jars or lids are
  not properly sterilized.


  ### Safety/boundary notes


  Ensure proper sterilization of jars and lids. Follow recommended canning methods
  to prevent foodborne illness.


  ### Local adaptation notes


  Consider the availability of local fruits and adjust processing times for altitude
  if necessary.'
