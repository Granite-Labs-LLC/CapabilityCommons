bundle_overrides:
  hook: Preserve the taste of summer all year long by learning how to can your own
    jams and jellies, reducing food waste and enjoying homemade spreads anytime.
  primer: Canning jams and jellies is a time-honored method of preserving the flavors
    of fresh, seasonal fruits. By learning this skill, you can enjoy the taste of
    your favorite fruits throughout the year, even when they are out of season. The
    process involves cooking fruit with sugar and pectin to create a thick, sweet
    spread, which is then sealed in jars to prevent spoilage. Proper canning techniques
    are essential to ensure food safety and prevent contamination. You'll need some
    basic equipment, including canning jars, lids, a canner, and tools like a jar
    lifter and funnel. The process begins with selecting and preparing the fruit,
    followed by sterilizing the jars and lids. Once the fruit mixture is ready, it's
    poured into the jars, sealed, and processed in a boiling water canner. This guide
    will walk you through each step, ensuring your homemade jams and jellies are both
    delicious and safe to eat.
  guide: '1. Gather your materials: canning jars, lids, a canner, fresh fruit, sugar,
    and pectin. You''ll also need tools like a jar lifter, funnel, and ladle.


    2. Prepare the fruit: Wash all fruits thoroughly. For soft fruits or berries,
    crush them. For firmer fruits, cut them into small pieces.


    3. Sterilize jars and lids: Boil them in water for at least 10 minutes to ensure
    they are free from any contaminants.


    4. Cook the fruit: Combine the prepared fruit with sugar and pectin in a large
    pot. Heat the mixture to a rolling boil, stirring constantly until it reaches
    the desired consistency.


    5. Fill the jars: Use a ladle and funnel to pour the hot fruit mixture into the
    sterilized jars, leaving about 1/4 inch of headspace at the top.


    6. Seal the jars: Place the lids on the jars and secure them with rings. Ensure
    they are tight but not overly so.


    7. Process the jars: Place the filled jars in a boiling water canner. Process
    them for the recommended time based on your altitude and the type of fruit used.


    8. Cool and store: Remove the jars from the canner and let them cool undisturbed
    for 12-24 hours. Check the seals before storing them in a cool, dark place.'
  reference:
  - Use firm fruits high in pectin.
  - Sterilize jars and lids by boiling.
  - Cook fruit with sugar and pectin.
  - Leave 1/4 inch headspace in jars.
  - Process jars in a boiling water canner.
  worksheet:
