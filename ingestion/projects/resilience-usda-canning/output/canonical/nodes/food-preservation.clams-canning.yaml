markdown_body: '### What this is

  This guide provides a detailed procedure for canning clams using a pressure canner.
  It includes steps for preparing the clams, packing them into jars, and processing
  them at the correct pressure and time.


  ### Why it matters

  Canning clams allows for long-term storage and preservation of this seafood, making
  it available for use at any time. Proper canning ensures safety and maintains the
  quality of the clams.


  ### What you need

  You will need live clams, a pressure canner, jars, salt, lemon juice or citric acid,
  a meat grinder or food processor (if mincing), and basic kitchen tools.


  ### How to do it

  1. Keep clams live on ice until ready to can. 2. Scrub and rinse the shells, steam
  for 5 minutes, and open. 3. Remove and wash the clam meat in salted water. 4. Boil
  the meat in water with lemon juice or citric acid for 2 minutes, then drain. 5.
  For minced clams, grind the meat. 6. Fill hot jars with clam pieces, add clam juice
  and boiling water, leaving 1-inch headspace. 7. Remove air bubbles, wipe jar rims,
  adjust lids, and process in a pressure canner according to altitude-specific guidelines.


  ### Common failure modes

  Incorrect pressure or processing time can lead to spoilage. Ensure jars are sealed
  properly and pressure is maintained throughout the process.


  ### Safety/boundary notes

  Ensure the pressure canner is functioning correctly and avoid contamination by maintaining
  cleanliness throughout the process.


  ### Local adaptation notes

  The availability of clams may vary by region, and adjustments may be needed based
  on local seafood sources.'
