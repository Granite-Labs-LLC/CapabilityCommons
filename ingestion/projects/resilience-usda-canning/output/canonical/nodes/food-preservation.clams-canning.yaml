bundle_overrides:
  hook: Canning clams at home ensures you have delicious seafood ready to use anytime,
    while preserving their freshness and flavor.
  primer: Canning clams is a method of preserving these tasty seafood morsels for
    long-term storage. This process involves using a pressure canner, which is essential
    for safely canning low-acid foods like clams. The pressure canner allows the clams
    to be processed at a high enough temperature to kill any harmful bacteria and
    prevent spoilage. Before starting, it's important to keep the clams alive on ice
    until you're ready to begin. The process involves cleaning the clams, steaming
    them, and then removing the meat. The clam meat is then boiled briefly in a solution
    of water and lemon juice or citric acid to ensure safety and enhance flavor. Once
    prepared, the clam meat is packed into jars with clam juice and boiling water,
    leaving some space at the top of the jar. The jars are then sealed and processed
    in the pressure canner according to specific guidelines that vary depending on
    your altitude. This method not only extends the shelf life of clams but also ensures
    that they are safe to eat.
  guide: '1. **Preparation**: Keep your clams live on ice until you''re ready to start
    canning. This ensures they remain fresh and safe to eat.


    2. **Cleaning and Steaming**: Scrub the clam shells thoroughly and rinse them
    under cold water. Steam the clams for about 5 minutes until they open. This makes
    it easier to remove the meat.


    3. **Removing and Washing Meat**: Carefully remove the clam meat from the shells.
    Wash the meat in a solution of water containing 1 teaspoon of salt per quart.
    This helps to clean the meat and remove any remaining sand or debris.


    4. **Boiling with Acid**: Rinse the clam meat and cover it with boiling water
    that contains 2 tablespoons of lemon juice or 1/2 teaspoon of citric acid per
    gallon. Boil the meat for 2 minutes, then drain. This step is crucial for ensuring
    the safety of the canned clams.


    5. **Packing Jars**: If you prefer minced clams, grind the meat using a meat grinder
    or food processor. Fill hot jars loosely with the clam pieces. Add hot clam juice
    and boiling water if needed, leaving a 1-inch headspace at the top of the jar.


    6. **Sealing and Processing**: Remove any air bubbles from the jars, wipe the
    rims clean, and adjust the lids. Process the jars in a pressure canner according
    to altitude-specific guidelines. This step is vital for ensuring the clams are
    safely preserved.'
