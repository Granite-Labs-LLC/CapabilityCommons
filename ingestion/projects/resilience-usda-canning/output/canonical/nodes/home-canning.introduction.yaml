markdown_body: '### What this is

  Home canning is a method of preserving food that has evolved significantly over
  the past 180 years. This introduction provides an overview of the scientific principles,
  equipment, and procedures necessary for safe and high-quality home canning.


  ### Why it matters

  Understanding the principles and procedures of home canning is crucial for ensuring
  food safety and quality. Proper canning prevents spoilage and extends the shelf
  life of food, making it a valuable skill for food preservation.


  ### What you need

  To begin home canning, you will need jars, lids, and basic canning equipment. Familiarity
  with canning procedures and ingredients is also essential.


  ### How to do it

  Follow the scientific principles and use the appropriate equipment to can foods
  safely. This involves selecting the right jars and lids, using the correct canning
  techniques, and adjusting for altitude if necessary.


  ### Common failure modes

  Failure to follow proper canning procedures can lead to food spoilage or unsafe
  canned products. Always use tested guidelines to ensure safety.


  ### Safety/boundary notes

  Ensure that you are using up-to-date, research-based guidelines to avoid health
  risks associated with improper canning.


  ### Local adaptation notes

  Adjust canning procedures based on local altitude and availability of ingredients
  to ensure optimal results.'
