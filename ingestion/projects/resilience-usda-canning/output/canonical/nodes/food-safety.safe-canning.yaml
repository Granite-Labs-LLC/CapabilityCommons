plain_language: Learn how to safely can food at home to prevent botulism by using
  correct processing times and sterilization methods.
markdown_body: '### What this is

  This concept note explains the importance of using proper canning methods to prevent
  the growth of Clostridium botulinum, which can cause botulism, a serious form of
  food poisoning.


  ### Why it matters

  Botulism is a potentially deadly illness caused by a toxin produced by the bacterium
  Clostridium botulinum. Ensuring safe canning practices is crucial to prevent this
  toxin from developing in home-canned foods.


  ### What you need

  Understanding of research-based process times and proper sterilization techniques
  for canning.


  ### How to do it

  Use the recommended processing times to ensure the destruction of heat-resistant
  microorganisms. Properly sterilize jars and store them below 95°F to prevent spoilage.


  ### Common failure modes

  Improper processing times and inadequate sterilization can lead to the survival
  of harmful bacteria.


  ### Safety/boundary notes

  Store canned jars below 95°F to maintain safety and quality.


  ### Local adaptation notes

  Adjust storage conditions based on local climate to ensure jars remain below the
  recommended temperature.'
structured_data:
