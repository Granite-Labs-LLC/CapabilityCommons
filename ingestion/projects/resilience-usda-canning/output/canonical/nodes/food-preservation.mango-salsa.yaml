plain_language: This guide will help you make and preserve Mango Salsa using a boiling-water
  canner. Follow the steps to ensure safe and delicious results.
markdown_body: '# What this is

  This is a project blueprint for making and canning Mango Salsa, a flavorful condiment
  that combines diced mango, red bell pepper, onion, and spices.


  # Why it matters

  Canning Mango Salsa allows you to preserve the fresh flavors of mango and other
  ingredients, providing a homemade alternative to store-bought salsas.


  # What you need

  You''ll need green mangoes, red bell pepper, yellow onion, crushed red pepper flakes,
  garlic, ginger, light brown sugar, cider vinegar, water, a Dutch oven or stockpot,
  a boiling-water canner, jars, and lids.


  # How to do it

  1. Wash all produce thoroughly. 2. Peel and chop mango into 1/2-inch cubes. 3. Dice
  bell pepper and finely chop onions. 4. Combine all ingredients in a large pot and
  bring to a boil. 5. Simmer for 5 minutes. 6. Fill hot jars with the salsa, leaving
  1/2-inch headspace. 7. Process jars in a boiling-water canner according to altitude-specific
  times.


  # Common failure modes

  Improper sealing of jars or skin irritation from handling green mangoes without
  gloves.


  # Safety/boundary notes

  Wear gloves when handling green mangoes to prevent skin irritation similar to poison
  ivy.


  # Local adaptation notes

  Adjust processing time based on altitude: 10 minutes for 0–1,000 ft, 15 minutes
  for 1,001–6,000 ft, and 20 minutes above 6,000 ft.'
