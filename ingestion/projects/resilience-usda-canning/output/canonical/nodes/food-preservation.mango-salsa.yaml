bundle_overrides:
  hook: Preserve the vibrant flavors of mango and spices with homemade Mango Salsa,
    a delicious alternative to store-bought options.
  primer: Mango Salsa is a delightful condiment that combines the sweetness of mangoes
    with the crispness of red bell peppers and the zing of onions and spices. By canning
    this salsa, you can enjoy the fresh flavors year-round, making it a perfect addition
    to your pantry. Canning involves preserving food in jars by heating them to a
    temperature that destroys harmful microorganisms and inactivates enzymes. This
    process ensures that the salsa remains safe to eat and retains its taste and nutritional
    value. The key ingredients for Mango Salsa include unripe green mangoes, red bell
    peppers, yellow onions, garlic, ginger, light brown sugar, cider vinegar, and
    water. You'll also need a Dutch oven or stockpot, a boiling-water canner, jars,
    and lids. It's important to wear gloves when handling green mangoes, as they can
    cause skin irritation similar to poison ivy. Additionally, processing times must
    be adjusted based on your altitude to ensure proper preservation.
  guide: "1. Gather all your ingredients and equipment: green mangoes, red bell pepper,\
    \ yellow onion, crushed red pepper flakes, garlic, ginger, light brown sugar,\
    \ cider vinegar, water, a Dutch oven or stockpot, a boiling-water canner, jars,\
    \ and lids. \n2. Wash all produce thoroughly to remove any dirt or contaminants.\
    \ \n3. Peel the mangoes and chop them into 1/2-inch cubes. Dice the red bell pepper\
    \ and finely chop the onions. \n4. In a large pot, combine the diced mango, bell\
    \ pepper, onion, garlic, ginger, brown sugar, cider vinegar, and water. \n5. Bring\
    \ the mixture to a boil over medium-high heat, stirring occasionally. \n6. Once\
    \ boiling, reduce the heat and let it simmer for 5 minutes to allow the flavors\
    \ to meld. \n7. Carefully fill the hot jars with the salsa, leaving 1/2-inch headspace\
    \ at the top. \n8. Wipe the rims of the jars with a clean, damp cloth to ensure\
    \ a good seal. \n9. Place the lids on the jars and screw on the bands until fingertip\
    \ tight. \n10. Process the jars in a boiling-water canner. Adjust the processing\
    \ time based on your altitude: 10 minutes for 0–1,000 ft, 15 minutes for 1,001–6,000\
    \ ft, and 20 minutes above 6,000 ft. \n11. After processing, remove the jars and\
    \ let them cool undisturbed for 12-24 hours. \n12. Check the seals by pressing\
    \ the center of each lid. If it doesn't pop back, the jar is sealed. \n13. Store\
    \ sealed jars in a cool, dark place. Any unsealed jars should be refrigerated\
    \ and used promptly."
  reference:
  - 6 cups diced unripe mango
  - 1-1/2 cups diced red bell pepper
  - 1/2 cup finely chopped yellow onion
  - 1/2 tsp crushed red pepper flakes
