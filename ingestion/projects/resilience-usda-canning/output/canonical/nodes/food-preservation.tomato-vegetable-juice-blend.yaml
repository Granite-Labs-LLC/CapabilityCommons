plain_language: Learn how to can a juice blend made from tomatoes and vegetables.
  This guide covers preparation, adding acid, and processing the jars safely.
markdown_body: '### What this is

  This project blueprint provides instructions for canning a tomato and vegetable
  juice blend. It includes steps for preparing the juice, adding necessary acid, and
  processing the jars using different canning methods.


  ### Why it matters

  Canning a tomato and vegetable juice blend allows you to preserve the flavors and
  nutrients of fresh produce for later use. Proper canning ensures the juice is safe
  to consume and has a long shelf life.


  ### What you need

  You will need 22 pounds of tomatoes, up to 3 cups of chopped vegetables (such as
  celery, onions, carrots, and peppers), bottled lemon juice or citric acid, salt
  (optional), a sieve or food mill, and a canner (boiling-water or pressure canner).


  ### How to do it

  1. Crush and simmer the tomatoes. 2. Add up to 3 cups of chopped vegetables. 3.
  Simmer for 20 minutes. 4. Press the mixture through a sieve or food mill. 5. Add
  lemon juice or citric acid to jars. 6. Add salt if desired. 7. Reheat the juice
  to boiling. 8. Fill jars, leaving 1/2-inch headspace. 9. Wipe rims, adjust lids,
  and process jars according to the canning method and altitude.


  ### Common failure modes

  Not adding enough acid can lead to unsafe preservation. Ensure jars are sealed properly
  to avoid spoilage.


  ### Safety/boundary notes

  Acidification is crucial for safety. Follow all steps carefully to ensure the juice
  is safe for consumption.


  ### Local adaptation notes

  Adjust vegetable types based on local availability. Ensure processing times and
  pressures are adjusted for local altitude.'
