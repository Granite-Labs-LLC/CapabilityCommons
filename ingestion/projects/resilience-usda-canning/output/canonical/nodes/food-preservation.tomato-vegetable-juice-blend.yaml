bundle_overrides:
  hook: Preserve the fresh taste of summer with homemade tomato and vegetable juice,
    ensuring a nutritious boost all year round.
  primer: Canning a tomato and vegetable juice blend is a practical way to enjoy the
    flavors and nutrients of fresh produce long after the growing season ends. This
    process involves preparing a mixture of tomatoes and vegetables, adding necessary
    acid to ensure safety, and processing the jars using a canner. The acidification
    step is crucial because it prevents the growth of harmful bacteria, such as those
    that cause botulism. By following a tested recipe, you can safely preserve your
    juice blend for later use. You'll need 22 pounds of tomatoes and up to 3 cups
    of chopped vegetables like celery, onions, carrots, and peppers. The process includes
    simmering the mixture, straining it, adding lemon juice or citric acid, and sealing
    the jars properly. This method not only extends the shelf life of your produce
    but also allows you to enjoy homemade juice that is free from preservatives and
    additives.
  guide: 'To can a tomato and vegetable juice blend, start by gathering your ingredients:
    22 pounds of tomatoes, up to 3 cups of chopped vegetables (such as celery, onions,
    carrots, and peppers), bottled lemon juice or citric acid, and salt if desired.
    You''ll also need a sieve or food mill and a canner (either boiling-water or pressure
    canner). Begin by washing and preparing your tomatoes and vegetables. Crush the
    tomatoes and place them in a large pot. Add the chopped vegetables and simmer
    the mixture for about 20 minutes. Once simmered, press the mixture through a sieve
    or food mill to remove skins and seeds, resulting in a smooth juice. Next, prepare
    your jars by adding 2 tablespoons of bottled lemon juice or 1/2 teaspoon of citric
    acid per quart of juice. This step is essential for safe preservation. Reheat
    the juice to boiling, then fill the hot jars, leaving a 1/2-inch headspace. Wipe
    the rims of the jars with a clean, damp paper towel to ensure a good seal. Adjust
    the lids and process the jars in your canner according to the method and altitude
    guidelines. After processing, let the jars cool undisturbed for 12-24 hours. Check
    the seals before storing. Properly sealed jars can be stored in a cool, dark place
    for up to a year.'
