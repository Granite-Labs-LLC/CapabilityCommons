summary_short: Guide to canning spinach and other greens using a pressure canner.
summary_medium: This project blueprint provides detailed instructions for canning
  spinach and other greens, focusing on quantity, quality, and the canning process
  using a pressure canner.
plain_language: Learn how to preserve spinach and other greens by canning them. This
  guide covers everything from selecting the right greens to using a pressure canner
  safely.
markdown_body: '### What this is

  This guide explains how to can spinach and other greens using a pressure canner.
  It includes steps for preparing the greens, packing them into jars, and processing
  them safely.


  ### Why it matters

  Canning spinach and other greens allows you to preserve their nutritional value
  and enjoy them year-round. Proper canning ensures food safety and quality.


  ### What you need

  You will need a pressure canner, jars, lids, boiling water, and fresh spinach or
  other greens.


  ### How to do it

  1. Select fresh, undamaged greens. 2. Wash greens thoroughly to remove grit. 3.
  Blanch greens by steaming for 3-5 minutes. 4. Pack hot jars loosely with greens,
  add boiling water, and leave a 1-inch headspace. 5. Remove air bubbles, wipe jar
  rims, and adjust lids. 6. Process jars in a pressure canner according to the manufacturer''s
  instructions.


  ### Common failure modes

  Incorrect pressure or incomplete sealing can lead to spoilage. Ensure the pressure
  is adjusted for your altitude.


  ### Safety/boundary notes

  Always use a pressure canner for low-acid foods like greens to prevent the risk
  of botulism.


  ### Local adaptation notes

  Consider the availability of greens and adjust processing times based on local altitude.'
