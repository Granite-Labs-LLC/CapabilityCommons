bundle_overrides:
  hook: Preserve the nutritional value of spinach and other greens year-round by learning
    how to can them safely.
  primer: Canning spinach and other greens is a practical way to preserve their nutritional
    value and enjoy them throughout the year. This process involves using a pressure
    canner, which is essential for safely preserving low-acid foods like greens. The
    pressure canner ensures that the jars are sealed properly, preventing spoilage
    and the risk of botulism, a serious foodborne illness. Before starting, you'll
    need fresh spinach or other greens, jars, lids, and boiling water. The process
    begins with selecting fresh, undamaged greens and washing them thoroughly to remove
    any grit. Blanching the greens by steaming them for 3-5 minutes helps to preserve
    their color and texture. Once blanched, the greens are packed loosely into hot
    jars, boiling water is added, and a 1-inch headspace is left. After removing air
    bubbles and wiping the jar rims, the lids are adjusted, and the jars are processed
    in a pressure canner according to the manufacturer's instructions. This method
    not only extends the shelf life of your greens but also ensures they remain safe
    to eat.
  guide: '1. Gather your materials: fresh spinach or other greens, a pressure canner,
    jars, lids, and boiling water.


    2. Select fresh, undamaged greens. Discard any wilted, discolored, or insect-damaged
    leaves.


    3. Wash the greens thoroughly in small batches to remove dirt and grit. Rinse
    until the water runs clear.


    4. Blanch the greens by placing them in a cheesecloth bag or blancher basket.
    Steam them for 3-5 minutes until they are well wilted.


    5. Prepare your jars by sterilizing them in boiling water. Keep them hot until
    ready to use.


    6. Pack the hot jars loosely with the blanched greens. Add boiling water to cover
    the greens, leaving a 1-inch headspace at the top of each jar.


    7. Remove any air bubbles by gently tapping the jars or using a non-metallic utensil.
    Adjust the headspace if necessary.


    8. Wipe the rims of the jars with a clean, damp paper towel to ensure a good seal.


    9. Place the lids on the jars and screw on the bands until they are fingertip
    tight.


    10. Process the jars in a pressure canner according to the manufacturer''s instructions,
    adjusting for your altitude. Typically, this involves processing pints for 70
    minutes and quarts for 90 minutes at the appropriate pressure.


    11. Once processing is complete, allow the canner to cool and depressurize naturally
    before removing the jars.


    12. Check the seals after the jars have cooled. The lids should not flex up and
    down when pressed.


    13. Store the sealed jars in a cool, dark place. Unsealed jars should be refrigerated
    and used promptly.'
  reference:
