plain_language: Canning food at home can save money and keep food nutritious for longer
  periods.
markdown_body: '### What this is

  Canning is a method of preserving food by processing and sealing it in airtight
  containers.


  ### Why it matters

  Canning helps save money by preserving homegrown food and can retain more nutrients
  than some store-bought produce. It also prevents food spoilage and allows for enjoying
  seasonal foods year-round.


  ### What you need

  High-quality fresh produce, canning jars, lids, and a reliable canning method.


  ### How to do it

  Select fresh produce, prepare it according to canning guidelines, and process it
  in jars using a water bath or pressure canner to ensure a proper seal.


  ### Common failure modes

  Using poor quality produce, jars failing to seal, and improper storage leading to
  spoilage.


  ### Safety/boundary notes

  Ensure proper canning techniques to avoid foodborne illnesses.


  ### Local adaptation notes

  Adjust canning methods based on local produce availability and climate conditions.'
