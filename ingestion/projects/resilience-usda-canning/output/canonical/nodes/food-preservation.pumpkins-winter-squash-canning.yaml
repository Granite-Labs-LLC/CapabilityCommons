bundle_overrides:
  hook: Preserve the taste of fall all year round by learning how to safely can pumpkins
    and winter squash using a pressure canner.
  primer: Canning pumpkins and winter squash is a great way to enjoy these nutritious
    vegetables throughout the year. The process involves using a pressure canner,
    which is essential for safely preserving low-acid foods like pumpkins and squash.
    By canning, you can store these vegetables for long periods without spoilage,
    making them a convenient addition to your pantry. The key to successful canning
    is ensuring that the vegetables are mature, with a hard rind and stringless pulp.
    Proper preparation and processing are crucial to prevent foodborne illnesses and
    ensure the jars are sealed correctly. This guide will walk you through the necessary
    steps, from preparing the vegetables to processing them in a pressure canner,
    ensuring you have a safe and delicious product to enjoy year-round.
  guide: 'To can pumpkins and winter squash, you''ll need a pressure canner, jars,
    lids, and boiling water. Start by selecting mature pumpkins or squash with a hard
    rind and stringless pulp. Wash the vegetables thoroughly, then remove the seeds
    and cut them into 1-inch-wide slices. Peel the slices and cut the flesh into 1-inch
    cubes. Boil the cubes in water for 2 minutes to prepare them for canning. Next,
    fill hot jars with the boiled cubes and the cooking liquid, leaving a 1-inch headspace
    at the top of each jar. Remove any air bubbles by gently tapping the jars or using
    a non-metallic utensil. Adjust the headspace if necessary, then wipe the rims
    of the jars with a clean, damp paper towel to ensure a good seal. Place the lids
    on the jars and secure them with the rings. Process the jars in a pressure canner:
    pints should be processed for 55 minutes, and quarts for 90 minutes, at the appropriate
    pressure for your altitude. After processing, allow the jars to cool undisturbed.
    Check that the lids have sealed properly before storing the jars in a cool, dark
    place.'
  reference:
  - Use a pressure canner for low-acid foods.
  - Select mature pumpkins or squash with a hard rind.
  - Cut into 1-inch cubes.
  - Boil cubes for 2 minutes.
  - Leave 1-inch headspace in jars.
  - Process pints for 55 minutes, quarts for 90 minutes.
  - Adjust pressure for your altitude.
  worksheet:
  - List the equipment needed for canning pumpkins and winter squash.
  - Describe the steps to prepare the vegetables for canning.
  - Explain why a pressure canner is necessary for this process.
  - Calculate the processing time for your altitude.
  - Practice filling jars with the correct headspace and removing air bubbles.
  teach_forward_kit:
    three_minute_version: Canning pumpkins and winter squash involves cutting them
      into cubes, boiling for 2 minutes, and processing in a pressure canner. Ensure
      jars are filled with a 1-inch headspace and process pints for 55 minutes and
      quarts for 90 minutes, adjusting for altitude.
    ten_minute_outline:
    - Introduction to canning and its benefits.
    - Necessary equipment and ingredients.
    - Step-by-step preparation of pumpkins and squash.
    - Importance of using a pressure canner.
    - Detailed processing times and altitude adjustments.
    - Safety tips and common mistakes to avoid.
    discussion_prompts:
    - Why is it important to use a pressure canner for low-acid foods?
    - What are the risks of not adjusting for altitude?
    - How can you ensure that jars are sealed properly?
    - What are some signs of spoilage in canned goods?
