summary_short: Guide to canning pumpkins and winter squash using a pressure canner.
summary_medium: Learn how to safely can pumpkins and winter squash by cutting into
  cubes, boiling, and processing in a pressure canner. Includes quantity, quality,
  and processing time guidelines.
plain_language: This guide explains how to can pumpkins and winter squash. You'll
  need to cut them into cubes, boil them, and use a pressure canner to process them
  safely.
markdown_body: "### What this is\nThis is a guide for canning pumpkins and winter\
  \ squash using a pressure canner. It includes instructions on preparing the vegetables,\
  \ the necessary equipment, and the processing times required for safe preservation.\n\
  \n### Why it matters\nCanning pumpkins and winter squash allows you to preserve\
  \ these nutritious vegetables for long-term storage, making them available year-round.\
  \ Proper canning prevents spoilage and ensures food safety.\n\n### What you need\n\
  You will need a pressure canner, jars, lids, and boiling water. The vegetables should\
  \ be mature with a hard rind and stringless pulp.\n\n### How to do it\n1. Wash the\
  \ pumpkins or squash, remove seeds, and cut into 1-inch slices. Peel and cut into\
  \ 1-inch cubes. \n2. Boil cubes for 2 minutes. \n3. Fill hot jars with cubes and\
  \ cooking liquid, leaving 1-inch headspace. \n4. Remove air bubbles, adjust headspace,\
  \ wipe rims, and adjust lids. \n5. Process in a pressure canner: Pints for 55 minutes\
  \ and quarts for 90 minutes at the appropriate pressure for your altitude.\n\n###\
  \ Common failure modes\nIncorrect pressure or incomplete seal can lead to spoilage.\
  \ Ensure the pressure is correct for your altitude and that jars are sealed properly.\n\
  \n### Safety/boundary notes\nEnsure the pressure canner is set to the correct pressure\
  \ for your altitude to prevent foodborne illness.\n\n### Local adaptation notes\n\
  Consider the availability of pumpkins and squash in your area and adjust the pressure\
  \ settings based on local altitude."
