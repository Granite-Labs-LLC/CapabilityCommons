markdown_body: '### What this is

  This guide provides instructions for canning fresh lima beans using a pressure canner.
  It includes details on the quantity of beans needed, the quality to look for, and
  the step-by-step procedure for both hot and raw packing methods.


  ### Why it matters

  Canning lima beans allows you to preserve them for long-term storage, ensuring you
  have access to nutritious food year-round. Proper canning techniques prevent spoilage
  and foodborne illnesses.


  ### What you need

  You will need fresh lima beans, a pressure canner, jars, lids, boiling water, and
  optionally, salt.


  ### How to do it

  1. Shell and wash the beans thoroughly. 2. For hot pack, cover beans with boiling
  water and heat to boil. Fill hot jars loosely, leaving 1-inch headspace. For raw
  pack, fill hot jars with raw beans without pressing down. 3. Add 1 teaspoon of salt
  per quart if desired. 4. Add boiling water, maintaining the appropriate headspace.
  5. Remove air bubbles, adjust headspace, wipe rims, and adjust lids. 6. Process
  in a pressure canner according to your altitude''s requirements.


  ### Common failure modes

  Incorrect pressure or incomplete sealing can lead to spoilage. Ensure the pressure
  canner is set to the correct pressure for your altitude.


  ### Safety/boundary notes

  Always use a pressure canner for low-acid foods like lima beans to prevent the risk
  of botulism. Adjust processing times and pressure based on altitude.


  ### Local adaptation notes

  Consider the availability of fresh lima beans in your area and adjust processing
  times for your local altitude.'
