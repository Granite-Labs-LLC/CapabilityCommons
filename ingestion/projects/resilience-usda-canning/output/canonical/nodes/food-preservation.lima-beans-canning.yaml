bundle_overrides:
  hook: Preserve your fresh lima beans for year-round enjoyment with safe and effective
    canning techniques.
  primer: Canning is a method of preserving food in which the food contents are processed
    and sealed in an airtight container. Canning fresh lima beans is a great way to
    ensure you have access to nutritious food throughout the year. Lima beans, like
    other low-acid foods, require pressure canning to prevent the risk of botulism,
    a serious foodborne illness. The process involves preparing the beans, packing
    them into jars, and processing them in a pressure canner. This method not only
    extends the shelf life of the beans but also retains their nutritional value.
    By following proper canning techniques, you can avoid spoilage and ensure the
    safety of your preserved food. You'll need fresh lima beans, a pressure canner,
    jars, lids, boiling water, and optionally, salt. Whether you choose the hot pack
    or raw pack method, maintaining the correct pressure and processing time according
    to your altitude is crucial for success.
  guide: "1. Gather your materials: fresh lima beans, a pressure canner, jars, lids,\
    \ boiling water, and salt (optional).\n2. Shell and wash the lima beans thoroughly.\n\
    3. Choose your packing method:\n   - Hot Pack: Cover the beans with boiling water\
    \ and heat them to a boil. Fill hot jars loosely with the beans, leaving a 1-inch\
    \ headspace.\n   - Raw Pack: Fill hot jars with raw beans without pressing down,\
    \ leaving a 1-inch headspace.\n4. If desired, add 1 teaspoon of salt per quart\
    \ to the jar.\n5. Pour boiling water over the beans in the jars, maintaining the\
    \ 1-inch headspace.\n6. Remove air bubbles by running a non-metallic spatula around\
    \ the inside of the jar.\n7. Wipe the rims of the jars with a clean, damp cloth\
    \ to ensure a good seal.\n8. Place the lids on the jars and adjust the bands until\
    \ they are fingertip tight.\n9. Place the jars in the pressure canner. Follow\
    \ the manufacturer's instructions for venting the canner and bringing it to the\
    \ correct pressure.\n10. Process the jars according to the recommended time and\
    \ pressure for your altitude:\n    - For hot pack pints, process for 40 minutes\
    \ at 11 PSI (0–2,000 ft), adjusting for higher altitudes.\n    - For raw pack\
    \ quarts, process for 50 minutes at 11 PSI (0–2,000 ft), adjusting for higher\
    \ altitudes.\n11. Once processing is complete, turn off the heat and allow the\
    \ canner to depressurize naturally.\n12. Carefully remove the jars and let them\
    \ cool undisturbed for 12-24 hours.\n13. Check the seals. If the center of the\
    \ lid is indented and does not flex, the jar is sealed. Store sealed jars in a\
    \ cool, dark place."
