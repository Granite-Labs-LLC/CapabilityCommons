bundle_overrides:
  hook: Preserve the taste of summer all year long by learning how to can your favorite
    fruits safely and effectively.
  primer: Canning fruit is a time-honored method of preserving the bounty of seasonal
    produce, allowing you to enjoy fresh flavors throughout the year. This process
    involves selecting ripe, blemish-free fruit, preparing it by washing, peeling,
    and cutting, and then sealing it in sterilized jars using a pressure canner. Proper
    canning not only reduces food waste but also ensures that you have access to nutritious
    fruit even when it's out of season. The key to successful canning lies in following
    precise techniques to prevent spoilage and ensure food safety. By mastering the
    art of canning, you can savor the taste of your favorite fruits long after the
    harvest season has ended.
  guide: 'Step 1: Select the Fruit

    Choose fresh, ripe fruit that is free from blemishes or signs of spoilage. The
    quality of the fruit directly affects the quality of the canned product.


    Step 2: Prepare the Fruit

    Wash the fruit thoroughly under running water. Depending on the type of fruit,
    you may need to peel, core, or slice it. For example, apples should be peeled
    and cored, while berries may only need a gentle rinse.


    Step 3: Sterilize the Jars

    Before filling, sterilize your canning jars by boiling them in water for at least
    10 minutes. This step is crucial to prevent contamination and spoilage.


    Step 4: Fill the Jars

    Pack the prepared fruit into the hot, sterilized jars, leaving about 1/4-inch
    of headspace at the top. This space allows for expansion during processing.


    Step 5: Process the Jars

    Place the filled jars in a pressure canner. Follow the manufacturer''s instructions
    for your specific canner model, ensuring you use the correct pressure and processing
    time for the type of fruit and your altitude.


    Step 6: Seal the Jars

    After processing, remove the jars from the canner and let them cool. As they cool,
    the lids should seal with a ''pop'' sound. Check the seals by pressing the center
    of each lid; it should not flex up and down.


    Step 7: Store the Jars

    Store the sealed jars in a cool, dark place. Properly canned and sealed fruit
    can last for up to a year.'
  reference:
  - Select fresh, ripe fruit without blemishes.
  - Wash, peel, and cut fruit as necessary.
  - Sterilize jars before filling.
  - Use a pressure canner for processing.
  - Leave 1/4-inch headspace in jars.
  - Ensure jars are sealed properly.
  - Store in a cool, dark place.
  worksheet:
  - Identify three types of fruit you want to can and list their preparation steps.
  - Practice sterilizing jars by boiling them for 10 minutes.
  - Simulate filling jars with fruit, ensuring you leave the correct headspace.
  - Research the correct pressure and processing time for one type of fruit at your
    altitude.
  - Check the seals on a set of jars and note any that did not seal properly.
  teach_forward_kit:
    three_minute_version: Canning fruit involves selecting ripe, blemish-free fruit,
      preparing it by washing and cutting, and sealing it in sterilized jars using
      a pressure canner. This process preserves the fruit for year-round enjoyment
      and prevents spoilage.
    ten_minute_outline:
    - Introduction to canning and its benefits.
    - Steps for selecting and preparing fruit.
    - Importance of sterilizing jars.
    - Detailed canning process using a pressure canner.
    - Checking seals and storing canned fruit.
    - Common mistakes and how to avoid them.
    discussion_prompts:
    - What are the benefits of canning fruit at home?
    - How does the canning process prevent spoilage?
    - What are some common mistakes people make when canning fruit?
    - How can you ensure the jars are properly sealed?
    - What are some creative ways to use canned fruit in recipes?
