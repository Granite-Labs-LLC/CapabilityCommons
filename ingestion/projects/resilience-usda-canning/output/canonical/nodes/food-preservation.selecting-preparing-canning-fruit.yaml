summary_short: Guidelines for selecting, preparing, and canning fruit and fruit products.
summary_medium: Learn how to select, prepare, and can fruit and fruit products safely
  and effectively.
plain_language: This guide helps you choose the right fruit, prepare it, and can it
  properly to preserve it for future use.
markdown_body: '## What this is

  This guide provides instructions on how to select, prepare, and can fruit and fruit
  products. It covers the entire process from choosing the right fruit to ensuring
  proper canning techniques.


  ## Why it matters

  Canning fruit allows you to preserve seasonal produce for later use, reducing waste
  and ensuring you have access to fruit year-round. Proper canning techniques prevent
  spoilage and ensure food safety.


  ## What you need

  - Canning jars

  - Pressure canner

  - Fruit preparation tools


  ## How to do it

  1. **Select appropriate fruit**: Choose fresh, ripe fruit without blemishes or signs
  of spoilage.

  2. **Prepare fruit for canning**: Wash, peel, and cut the fruit as necessary.

  3. **Follow canning procedures**: Sterilize jars, fill with prepared fruit, and
  process using a pressure canner.


  ## Common failure modes

  - Improper sealing of jars can lead to spoilage.

  - Not following the correct processing time can result in under-processed fruit.


  ## Safety/boundary notes

  Ensure proper sterilization of jars and equipment to prevent contamination and spoilage.


  ## Local adaptation notes

  Adapt the process based on the availability of different fruit types in your area.'
