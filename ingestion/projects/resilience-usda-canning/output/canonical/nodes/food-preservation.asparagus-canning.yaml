summary_short: Instructions for canning asparagus using a pressure canner.
summary_medium: Detailed guide on canning asparagus, including preparation, packing
  methods, and pressure canning times.
plain_language: Learn how to can asparagus safely using a pressure canner, with steps
  for both hot and raw packing.
markdown_body: "### What this is\nThis guide provides instructions for canning asparagus,\
  \ either as spears or pieces, using a pressure canner. It includes details on quantity,\
  \ quality, preparation, and processing times.\n\n### Why it matters\nCanning asparagus\
  \ allows you to preserve this seasonal vegetable for long-term storage, ensuring\
  \ you have access to it year-round while maintaining its nutritional value.\n\n\
  ### What you need\nYou will need a pressure canner, jars, lids, boiling water, and\
  \ optionally, salt. Ensure you have tender, tight-tipped asparagus spears that are\
  \ 4 to 6 inches long.\n\n### How to do it\n1. Wash and trim the asparagus, removing\
  \ tough scales and stems. Cut into 1-inch pieces or leave whole. \n2. For hot packing,\
  \ cover asparagus with boiling water and boil for 2-3 minutes. Fill hot jars with\
  \ hot asparagus, leaving 1-inch headspace. For raw packing, fill hot jars with raw\
  \ asparagus tightly, leaving 1-inch headspace. \n3. Add 1 teaspoon of salt per quart\
  \ if desired. Add boiling water, leaving 1-inch headspace. Remove air bubbles and\
  \ adjust headspace. Wipe jar rims, adjust lids, and process in a pressure canner.\
  \ \n4. Process pints for 30 minutes and quarts for 40 minutes at the appropriate\
  \ pressure for your altitude.\n\n### Common failure modes\nIncorrect pressure settings\
  \ or incomplete sealing can lead to spoilage. Ensure you follow the recommended\
  \ pressure settings for your altitude.\n\n### Safety/boundary notes\nAlways use\
  \ the correct pressure settings for your altitude to ensure safety and prevent foodborne\
  \ illness.\n\n### Local adaptation notes\nConsider the availability of asparagus\
  \ in your area and adjust the pressure settings based on local altitude."
