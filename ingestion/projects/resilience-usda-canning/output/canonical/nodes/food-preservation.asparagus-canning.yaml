bundle_overrides:
  hook: Preserve the taste of spring all year round by learning how to can asparagus
    safely and effectively.
  primer: Canning asparagus is a fantastic way to enjoy this nutritious vegetable
    throughout the year, long after its peak season has passed. The process involves
    using a pressure canner, which is essential for safely preserving low-acid foods
    like asparagus. By canning asparagus, you can maintain its flavor and nutritional
    value, making it a convenient addition to meals at any time. The process requires
    some basic equipment, including a pressure canner, jars, lids, and optionally,
    salt. The asparagus should be fresh, with tender, tight-tipped spears that are
    4 to 6 inches long. You can choose to can the asparagus as whole spears or cut
    them into 1-inch pieces, depending on your preference. The key to successful canning
    is following the correct procedures for preparation, packing, and processing times,
    ensuring that the jars are sealed properly to prevent spoilage.
  guide: '1. **Prepare the Asparagus**: Start by washing the asparagus thoroughly.
    Trim off any tough scales and break off the tough stems. You can either cut the
    asparagus into 1-inch pieces or leave them whole, depending on your preference.


    2. **Choose Your Packing Method**: For hot packing, cover the asparagus with boiling
    water and boil for 2-3 minutes. Then, fill hot jars with the hot asparagus, leaving
    a 1-inch headspace. For raw packing, tightly fill hot jars with raw asparagus,
    also leaving a 1-inch headspace.


    3. **Add Salt and Water**: If desired, add 1 teaspoon of salt per quart to the
    jars. Pour boiling water into the jars, maintaining the 1-inch headspace. Remove
    any air bubbles by gently tapping the jars or using a non-metallic spatula.


    4. **Seal the Jars**: Wipe the rims of the jars to ensure they are clean. Place
    the lids on the jars and adjust the bands until they are fingertip tight.


    5. **Process the Jars**: Place the jars in a pressure canner. Process pints for
    30 minutes and quarts for 40 minutes. Adjust the pressure according to your altitude:
    11 lb for 0-2,000 ft, 12 lb for 2,001-4,000 ft, 13 lb for 4,001-6,000 ft, and
    14 lb for 6,001-8,000 ft.


    6. **Cool and Store**: Once processing is complete, allow the canner to depressurize
    naturally. Remove the jars and let them cool undisturbed for 12-24 hours. Check
    the seals before storing the jars in a cool, dark place.'
