summary_short: Learn how to select, prepare, and can vegetables safely.
summary_medium: This guide provides instructions on selecting, preparing, and canning
  vegetables to ensure safety and quality, focusing on proper techniques and equipment
  use.
plain_language: This guide helps you choose the right vegetables, prepare them properly,
  and can them safely using a pressure canner.
markdown_body: '### What this is

  This guide explains how to select, prepare, and can vegetables and vegetable products
  safely and effectively.


  ### Why it matters

  Proper canning techniques are crucial to prevent food spoilage and contamination,
  ensuring that preserved vegetables are safe to eat.


  ### What you need

  You will need fresh vegetables, canning jars, and a pressure canner.


  ### How to do it

  Start by selecting fresh, high-quality vegetables. Wash and prepare them according
  to the specific requirements of each type. Use a pressure canner to process the
  vegetables, ensuring that the jars are sealed properly to prevent contamination.


  ### Common failure modes

  Improper sealing of jars and contamination during the canning process are common
  issues.


  ### Safety/boundary notes

  Ensure that the pressure canner is used correctly and maintain cleanliness throughout
  the process.


  ### Local adaptation notes

  Consider the availability of local vegetables and adapt canning practices to suit
  regional preferences.'
