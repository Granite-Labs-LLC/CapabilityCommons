bundle_overrides:
  hook: Preserving your own vegetables not only saves money but also ensures you have
    delicious, safe-to-eat produce all year round.
  primer: Canning vegetables is a time-honored method of preserving food that allows
    you to enjoy the taste of fresh produce long after the growing season has ended.
    The process involves selecting high-quality vegetables, preparing them correctly,
    and using a pressure canner to safely seal them in jars. This method is crucial
    for preventing spoilage and contamination, ensuring that your preserved vegetables
    remain safe to eat. Proper canning techniques are essential, as improper sealing
    or contamination can lead to foodborne illnesses. By following tested recipes
    and maintaining cleanliness throughout the process, you can successfully preserve
    your vegetables. This guide will walk you through the necessary steps, from selecting
    the best produce to ensuring your jars are sealed correctly.
  guide: '1. **Select Fresh Vegetables**: Choose high-quality, fresh vegetables. Look
    for those that are ripe and free from blemishes or signs of spoilage.


    2. **Prepare the Vegetables**: Wash the vegetables thoroughly under running water.
    Depending on the type, you may need to peel, chop, or blanch them. Follow specific
    preparation guidelines for each vegetable type.


    3. **Gather Your Equipment**: You will need canning jars, lids, and a pressure
    canner. Ensure all equipment is clean and in good working condition.


    4. **Fill the Jars**: Pack the prepared vegetables into the jars, leaving the
    recommended headspace. Remove any air bubbles by gently tapping the jars or using
    a non-metallic spatula.


    5. **Seal the Jars**: Wipe the rims of the jars with a clean, damp cloth to remove
    any residue. Place the lids on the jars and screw on the bands until fingertip
    tight.


    6. **Process in a Pressure Canner**: Follow the manufacturer''s instructions for
    your pressure canner. Process the jars at the recommended pressure and time for
    the specific vegetable and jar size.


    7. **Cool and Store**: Once processing is complete, allow the jars to cool undisturbed
    for 12-24 hours. Check the seals by pressing the center of each lid. If it does
    not pop back, the jar is sealed. Store sealed jars in a cool, dark place.'
  reference:
  - Select fresh, blemish-free vegetables.
  - Use a pressure canner for low-acid vegetables.
  - Maintain cleanliness throughout the process.
  - Leave recommended headspace in jars.
  - Process jars at correct pressure and time.
  - Check seals after cooling.
  worksheet:
  - List five vegetables you want to can and research their specific preparation requirements.
  - Practice packing a jar with water to understand headspace and air bubble removal.
  - Simulate the sealing process by practicing with empty jars and lids.
  - Create a checklist for the canning process to ensure no steps are missed.
  - Research local vegetable availability and plan a canning schedule based on seasonal
    produce.
  teach_forward_kit:
    three_minute_version: Canning vegetables involves selecting fresh produce, preparing
      them properly, and using a pressure canner to safely preserve them. This process
      prevents spoilage and ensures food safety. Key steps include washing and preparing
      vegetables, filling jars with the correct headspace, and processing them in
      a pressure canner. Proper sealing and cleanliness are crucial to avoid contamination.
