bundle_overrides:
  hook: Preserving tomatoes through canning not only extends their shelf life but
    also locks in their fresh flavor and nutritional value.
  primer: Canning tomatoes is a time-honored method of preserving the bounty of the
    harvest. By selecting ripe, firm, and disease-free tomatoes, you ensure the best
    quality for your canned goods. The process involves washing, coring, and preparing
    the tomatoes, then filling sterilized jars with the prepared tomatoes and processing
    them in a pressure canner. This method prevents spoilage and maintains the quality
    of the tomatoes. Proper sealing is crucial to avoid contamination and ensure the
    safety of the preserved food. Canning requires some specific equipment, such as
    canning jars, a pressure canner, and a tomato corer. Adhering to local canning
    regulations and guidelines is essential to prevent foodborne illnesses and ensure
    successful preservation.
  guide: '1. Gather your materials: canning jars, a pressure canner, and a tomato
    corer.

    2. Select ripe, firm tomatoes that are free from disease. Wash them thoroughly
    and remove the stems.

    3. Core the tomatoes and prepare them according to your chosen recipe.

    4. Sterilize your canning jars by boiling them in water for 10 minutes.

    5. Fill the hot jars with the prepared tomatoes, leaving about 1/2-inch headspace
    at the top.

    6. Secure the lids on the jars, ensuring they are tightly sealed.

    7. Place the jars in the pressure canner and process them according to the recommended
    time and pressure for your altitude.

    8. Once processing is complete, carefully remove the jars and let them cool. Check
    the seals to ensure they are secure.

    9. Store the sealed jars in a cool, dark place. If any jars did not seal properly,
    refrigerate and use them soon.'
  reference:
  - Select disease-free, vine-ripened, firm tomatoes.
  - Wash and core tomatoes before canning.
  - Use a pressure canner for processing.
  - Leave 1/2-inch headspace in jars.
  - Process jars according to altitude-specific guidelines.
  - Ensure proper sealing to prevent spoilage.
  worksheet:
  - List the equipment needed for canning tomatoes.
  - Describe the steps to properly prepare tomatoes for canning.
  - Explain why a pressure canner is necessary for canning tomatoes.
  - Calculate the processing time for your altitude.
  - Check the seals on your jars after processing and describe how to identify a proper
    seal.
  teach_forward_kit:
    three_minute_version: Canning tomatoes involves selecting ripe, firm tomatoes,
      washing and coring them, then filling sterilized jars and processing them in
      a pressure canner. Proper sealing is essential to prevent spoilage.
