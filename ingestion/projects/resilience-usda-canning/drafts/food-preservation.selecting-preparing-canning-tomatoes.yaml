markdown_body: '# What this is

  This guide provides step-by-step instructions for selecting, preparing, and canning
  tomatoes and tomato products.


  # Why it matters

  Canning tomatoes properly ensures they are preserved safely, preventing spoilage
  and maintaining quality.


  # What you need

  You''ll need canning jars, a pressure canner, and a tomato corer.


  # How to do it

  Select ripe, firm tomatoes. Wash them thoroughly and remove stems. Core the tomatoes
  and prepare them according to your recipe. Fill sterilized jars with tomatoes, leaving
  appropriate headspace. Process jars in a pressure canner according to the recommended
  time and pressure for your altitude.


  # Common failure modes

  Improper sealing of jars can lead to spoilage. Ensure lids are properly secured
  and jars are processed for the correct time.


  # Safety/boundary notes

  Ensure proper sealing to avoid contamination. Follow canning guidelines closely
  to prevent foodborne illness.


  # Local adaptation notes

  Consider the availability of tomatoes in your area and adhere to local canning regulations.'
