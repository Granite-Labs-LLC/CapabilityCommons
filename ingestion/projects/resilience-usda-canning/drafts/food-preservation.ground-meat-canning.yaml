markdown_body: '### What this is

  This is a guide for canning ground or chopped meat, such as beef, pork, or venison,
  using a pressure canner. It includes steps for preparation, packing, and processing.


  ### Why it matters

  Canning meat allows for long-term storage without refrigeration, preserving the
  nutritional value and flavor while ensuring food safety.


  ### What you need

  You will need fresh meat, a pressure canner, jars, salt, and either boiling meat
  broth, tomato juice, or water.


  ### How to do it

  1. Choose fresh, chilled meat. For venison, add pork fat before grinding. 2. Shape
  meat into patties or balls, or cut sausage into links. 3. Lightly brown the meat.
  4. Remove excess fat. 5. Fill hot jars with meat, add liquid, and leave 1-inch headspace.
  6. Remove air bubbles, adjust headspace, and add salt if desired. 7. Wipe jar rims,
  adjust lids, and process in a pressure canner according to altitude-specific guidelines.


  ### Common failure modes

  Excess fat in jars or incorrect pressure during canning can lead to spoilage.


  ### Safety/boundary notes

  Ensure proper pressure is maintained during canning to avoid contamination and ensure
  food safety.


  ### Local adaptation notes

  Adapt the recipe based on the availability of different types of meat in your area.'
