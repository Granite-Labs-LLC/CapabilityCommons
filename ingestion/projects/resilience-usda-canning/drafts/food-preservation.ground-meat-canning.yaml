bundle_overrides:
  hook: Canning ground or chopped meat allows you to enjoy delicious, home-cooked
    meals anytime without the need for refrigeration, preserving both flavor and nutrition.
  primer: Canning ground or chopped meat is a practical way to preserve meat for long-term
    storage without refrigeration. This method is particularly useful for those who
    want to ensure they have a reliable source of protein available at all times.
    Using a pressure canner, you can safely store meats like beef, pork, or venison.
    The process involves preparing the meat by grinding and lightly browning it, then
    packing it into jars with a liquid such as meat broth, tomato juice, or water.
    The jars are then sealed and processed under pressure to ensure they are free
    from bacteria and other contaminants. This method not only extends the shelf life
    of the meat but also retains its nutritional value and flavor. It's important
    to follow safety guidelines closely, as improper canning can lead to spoilage
    or foodborne illnesses.
  guide: "1. Start by selecting fresh, chilled meat. If you're using venison, mix\
    \ in one part high-quality pork fat to three or four parts venison before grinding.\
    \ \n2. Shape the ground meat into patties or balls, or cut cased sausage into\
    \ 3- to 4-inch links. Alternatively, you can sauté the ground meat without shaping\
    \ it. \n3. Lightly brown the meat in a pan, then remove any excess fat. \n4. Prepare\
    \ your jars by filling them with the browned meat, leaving a 1-inch headspace\
    \ at the top. \n5. Add boiling meat broth, tomato juice, or water to the jars,\
    \ maintaining the 1-inch headspace. \n6. Remove any air bubbles by gently tapping\
    \ the jars or using a non-metallic spatula. Adjust the headspace if necessary.\
    \ \n7. If desired, add 1 teaspoon of salt per quart to the jars. \n8. Wipe the\
    \ rims of the jars with a dampened clean paper towel to ensure a good seal. \n\
    9. Place the lids on the jars and adjust them according to the manufacturer's\
    \ instructions. \n10. Process the jars in a pressure canner, following altitude-specific\
    \ guidelines to ensure proper pressure is maintained. \n11. Once processed, allow\
    \ the jars to cool undisturbed. Check the seals before storing."
