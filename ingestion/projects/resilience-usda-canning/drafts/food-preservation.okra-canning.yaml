bundle_overrides:
  hook: Preserve your garden's bounty and enjoy fresh okra year-round by learning
    how to can it safely and effectively.
  primer: Canning okra is a fantastic way to preserve this nutritious vegetable for
    long-term storage, allowing you to enjoy its taste and benefits even when it's
    out of season. The process involves using a pressure canner, which is essential
    for safely preserving low-acid foods like okra. By following a few straightforward
    steps, you can ensure that your canned okra remains safe to eat and retains its
    nutritional value. The key to successful canning lies in selecting the right okra
    pods, preparing them properly, and processing them at the correct pressure and
    time for your altitude. This guide will walk you through each step, from selecting
    young, tender pods to sealing the jars correctly. With a little practice, you'll
    be able to can okra with confidence, reducing food waste and enjoying the fruits
    of your labor throughout the year.
  guide: '1. **Select Okra Pods**: Choose young, tender okra pods for the best results.
    Discard any pods that are diseased or have rust spots, as these can affect the
    quality and safety of your canned okra.


    2. **Prepare the Okra**: Wash the okra pods thoroughly under running water to
    remove any dirt or debris. Trim the ends of the pods to prepare them for canning.


    3. **Blanch the Okra**: Place the okra in a saucepan and cover with hot water.
    Bring the water to a boil and let the okra boil for 2 minutes. After boiling,
    drain the okra immediately to stop the cooking process.


    4. **Fill the Jars**: Fill hot, sterilized jars with the blanched okra and the
    cooking liquid, leaving a 1-inch headspace at the top of each jar. If desired,
    add 1 teaspoon of salt per quart for seasoning.


    5. **Prepare the Jars for Canning**: Remove any air bubbles by gently tapping
    the jars or using a non-metallic spatula. Adjust the headspace if necessary. Wipe
    the rims of the jars with a clean, damp paper towel to ensure a good seal. Place
    the lids on the jars and adjust the bands until they are fingertip-tight.


    6. **Process the Jars**: Place the jars in a pressure canner and process them
    according to the recommended times and pressures for your altitude. This step
    is crucial for ensuring the safety of your canned okra.


    7. **Cool and Store**: Once processed, allow the jars to cool undisturbed for
    12-24 hours. Check the seals before storing the jars in a cool, dark place. Properly
    sealed jars can be stored for up to a year.'
