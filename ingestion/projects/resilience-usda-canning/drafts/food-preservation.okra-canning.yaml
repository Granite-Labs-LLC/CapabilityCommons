summary_short: Guide to canning okra using a pressure canner.
summary_medium: This project blueprint provides detailed instructions for canning
  okra, including necessary quantities, quality selection, and processing times using
  a pressure canner.
plain_language: Learn how to preserve okra by canning it using a pressure canner.
  This guide covers everything from selecting the right okra to processing it safely.
markdown_body: '# What this is

  This is a guide for canning okra using a pressure canner. It includes instructions
  on selecting, preparing, and processing okra to ensure safe preservation.


  # Why it matters

  Canning okra allows you to preserve it for long-term storage, making it available
  even when it''s out of season. Proper canning prevents spoilage and maintains nutritional
  value.


  # What you need

  You''ll need a pressure canner, jars, lids, boiling water, and fresh okra. Optional:
  salt for seasoning.


  # How to do it

  1. Select young, tender okra pods and discard any that are diseased or rust-spotted.
  2. Wash and trim the ends of the pods. 3. Boil the okra in hot water for 2 minutes
  and drain. 4. Fill hot jars with the okra and cooking liquid, leaving 1-inch headspace.
  5. Add 1 teaspoon of salt per quart if desired. 6. Remove air bubbles, adjust headspace,
  wipe rims, and adjust lids. 7. Process in a pressure canner according to the recommended
  times and pressures for your altitude.


  # Common failure modes

  Incorrect pressure settings or incomplete seals can lead to spoilage. Ensure the
  pressure is adjusted for your altitude and that jars are sealed properly.


  # Safety/boundary notes

  Always use the correct pressure for your altitude to ensure safety. Follow the recommended
  processing times closely.


  # Local adaptation notes

  Consider the availability of okra in your area and adjust the pressure settings
  based on your local altitude.'
structured_data:
  goal: To safely preserve okra by canning it using a pressure canner.
  deliverables: Canned okra that is safely preserved and ready for long-term storage.
  acceptance_criteria: Jars are sealed properly, and the okra is preserved without
    spoilage.
  safety_boundary: 'Botulism risk. Low-acid foods (vegetables, meats, poultry, seafood)
    must be processed in a pressure canner, never a boiling-water canner; tomatoes
    must be acidified to pH 4.6 or lower with lemon juice or citric acid as a tested
    recipe directs. Vent the canner 10 minutes before pressurizing, use the exact
    process time and pressure for your jar size, pack style, canner type, and altitude,
    and check dial gauges for accuracy every year. Use only tested recipes and never
    shorten process times. Do not taste food from an unsealed jar or one showing spoilage
    (bulging lid, spurting liquid, unnatural odor, mold): treat it as having produced
    botulinum toxin, which can be fatal whether swallowed or through skin contact,
    and follow USDA disposal and detoxification steps. If any deviation from USDA-tested
    methods may have occurred, boil low-acid and tomato foods in a saucepan before
    eating: 10 minutes below 1,000 ft, plus 1 minute for each additional 1,000 ft.
    Specific to this object: Ensure the pressure canner is set to the correct pressure
    for your altitude.'
