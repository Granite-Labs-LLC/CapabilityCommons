markdown_body: '### What this is

  This project guides you through making and canning Spicy Cranberry Salsa, a tangy
  and spicy condiment perfect for various dishes.


  ### Why it matters

  Canning salsa allows you to preserve the flavors of fresh cranberries and peppers,
  providing a homemade alternative to store-bought options.


  ### What you need

  You''ll need a Dutch oven, boiling-water canner, pint jars, lids, and ingredients
  like red onions, Serrano peppers, cranberries, cider vinegar, sugar, and honey.


  ### How to do it

  Combine all ingredients except cranberries in a Dutch oven and boil. Add cranberries
  and simmer. Fill hot jars with the mixture, leaving headspace, and process in a
  boiling-water canner. Adjust processing time based on altitude.


  ### Common failure modes

  Scorching the mixture or improper sealing of jars can occur if instructions are
  not followed closely.


  ### Safety/boundary notes

  Wear gloves when handling hot peppers to avoid skin irritation.


  ### Local adaptation notes

  Adjust processing times based on local altitude to ensure proper preservation.'
