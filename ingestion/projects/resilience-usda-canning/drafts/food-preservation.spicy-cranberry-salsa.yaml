bundle_overrides:
  hook: Transform fresh cranberries and peppers into a tangy, spicy salsa that you
    can enjoy all year long by learning to can it yourself.
  primer: Spicy Cranberry Salsa is a delightful condiment that combines the tartness
    of cranberries with the heat of Serrano peppers. Canning this salsa allows you
    to preserve its fresh flavors, offering a homemade alternative to store-bought
    options. This process involves using a boiling-water canner to ensure the salsa
    is safely preserved and can be stored for extended periods. The key ingredients
    include red onions, Serrano peppers, cranberries, cider vinegar, sugar, and honey.
    Proper canning techniques are crucial to prevent spoilage and ensure the jars
    are sealed correctly. Adjusting the processing time based on your local altitude
    is also important to achieve the best results. With the right tools and careful
    attention to detail, you can create a delicious salsa that enhances a variety
    of dishes.
  guide: "To make and can Spicy Cranberry Salsa, gather the following ingredients:\
    \ 6 cups of chopped red onions, 4 finely chopped large Serrano peppers, 1-1/2\
    \ cups of cider vinegar (5%), 1-1/3 cups of sugar, 6 tablespoons of clover honey,\
    \ and 12 cups (2-3/4 lbs) of rinsed, fresh whole cranberries. You'll also need\
    \ a Dutch oven, a boiling-water canner, pint jars, and lids. \n\n1. Begin by wearing\
    \ gloves to handle the hot peppers safely. Chop the onions and peppers, and measure\
    \ out the other ingredients. \n2. In a large Dutch oven, combine all ingredients\
    \ except the cranberries. Bring the mixture to a boil over high heat, then reduce\
    \ the heat slightly and boil gently for 5 minutes. \n3. Add the cranberries to\
    \ the pot, reduce the heat slightly, and simmer the mixture for 20 minutes, stirring\
    \ occasionally to prevent scorching. \n4. Sterilize the pint jars and lids according\
    \ to standard canning procedures. \n5. Fill the hot jars with the salsa mixture,\
    \ leaving 1/4-inch headspace at the top. \n6. Wipe the rims of the jars clean,\
    \ place the lids on top, and screw on the bands until fingertip-tight. \n7. Process\
    \ the jars in a boiling-water canner for the recommended time, adjusting for altitude\
    \ if necessary. \n8. Once processed, remove the jars and let them cool undisturbed\
    \ for 12-24 hours. Check the seals before storing. Properly sealed jars can be\
    \ stored in a cool, dark place for up to a year."
  reference:
  - 6 cups chopped red onions
  - 4 finely chopped large Serrano peppers
  - 1-1/2 cups cider vinegar (5%)
  - 1-1/3 cups sugar
  - 6 tbsp clover honey
  - 12 cups fresh whole cranberries
  - Dutch oven
  - Boiling-water canner
  - Pint jars and lids
  - Wear gloves when handling hot peppers
  - Adjust processing time for altitude
