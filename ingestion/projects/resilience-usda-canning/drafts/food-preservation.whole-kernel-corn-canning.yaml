bundle_overrides:
  hook: Preserve the taste of summer all year round by learning how to safely can
    whole kernel corn at home.
  primer: Canning whole kernel corn is a method of preserving the freshness and flavor
    of corn, allowing you to enjoy it throughout the year. This process involves using
    a pressure canner, which is essential for low-acid foods like corn to prevent
    the risk of botulism, a serious foodborne illness. The process begins with selecting
    fresh corn, husking it, and removing the silk. The corn is then blanched in boiling
    water to stop enzyme actions that can cause loss of flavor, color, and texture.
    After blanching, the kernels are cut from the cob and packed into jars. Depending
    on your preference, you can choose between a hot pack or a raw pack method. The
    hot pack involves simmering the kernels in hot water before packing, while the
    raw pack involves packing the raw kernels directly into jars. Once packed, boiling
    water is added, air bubbles are removed, and the jars are sealed and processed
    in a pressure canner. This method ensures that the corn is safely preserved and
    ready for long-term storage.
  guide: "Step 1: Husk the corn, remove the silk, and wash the ears thoroughly to\
    \ remove any remaining debris. \n\nStep 2: Blanch the corn by placing it in boiling\
    \ water for 3 minutes. This step is crucial as it helps preserve the corn's flavor\
    \ and texture. After blanching, quickly cool the corn in ice water to stop the\
    \ cooking process. \n\nStep 3: Cut the kernels from the cob, aiming to cut at\
    \ about 3/4 the depth of the kernel to avoid cutting into the cob. \n\nStep 4:\
    \ Choose your packing method. For a hot pack, add 1 cup of hot water to the kernels\
    \ in a saucepan, bring to a boil, and simmer for 5 minutes. Then, pack the hot\
    \ corn and liquid into jars, leaving a 1-inch headspace. For a raw pack, simply\
    \ pack the raw kernels into jars, also leaving a 1-inch headspace. \n\nStep 5:\
    \ Add boiling water to the jars, ensuring the corn is covered and maintaining\
    \ the 1-inch headspace. Remove any air bubbles by gently tapping the jars or using\
    \ a non-metallic spatula. Adjust the headspace if necessary. \n\nStep 6: Wipe\
    \ the rims of the jars with a clean, damp paper towel to remove any residue. Place\
    \ the lids on the jars and adjust the bands until they are fingertip tight. \n\
    \nStep 7: Process the jars in a pressure canner. Follow the manufacturer's instructions\
    \ for your specific canner model, and adjust the pressure according to your local\
    \ altitude to ensure safety. \n\nStep 8: Once processing is complete, allow the\
    \ canner to depressurize naturally. Carefully remove the jars and let them cool\
    \ undisturbed for 12-24 hours. Check the seals before storing."
  reference:
  - Husk corn, remove silk, and wash.
  - Blanch corn for 3 minutes in boiling water.
  - Cut kernels from the cob at about 3/4 the depth.
  - 'Hot pack: Add 1 cup of hot water to kernels, simmer for 5 minutes, pack into
    jars with 1-inch headspace.'
  - 'Raw pack: Pack raw kernels into jars with 1-inch headspace.'
  - Add boiling water to jars, remove air bubbles, adjust headspace.
  - Wipe rims, adjust lids, process in a pressure canner.
  - Use a pressure canner for low-acid foods to prevent botulism.
