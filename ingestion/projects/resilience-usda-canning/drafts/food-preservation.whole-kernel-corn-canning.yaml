markdown_body: '### What this is

  This guide provides step-by-step instructions for canning whole kernel corn using
  a pressure canner. It includes details on selecting corn, preparing it, and the
  canning process itself.


  ### Why it matters

  Canning whole kernel corn allows you to preserve the freshness and flavor of corn
  for long-term storage, making it available year-round.


  ### What you need

  You''ll need a pressure canner, jars, lids, boiling water, and fresh corn. Ensure
  you have the correct equipment to maintain safety standards.


  ### How to do it

  1. Husk the corn, remove silk, and wash. 2. Blanch corn for 3 minutes in boiling
  water. 3. Cut kernels from the cob at about 3/4 the depth. 4. For hot pack: Add
  1 cup of hot water to kernels, simmer for 5 minutes, then pack into jars with 1-inch
  headspace. For raw pack: Pack raw kernels into jars with 1-inch headspace. 5. Add
  boiling water to jars, remove air bubbles, and adjust headspace. 6. Wipe rims, adjust
  lids, and process in a pressure canner.


  ### Common failure modes

  Incorrect pressure settings or incomplete seals can lead to spoilage. Ensure the
  pressure canner is set correctly for your altitude.


  ### Safety/boundary notes

  Always use a pressure canner for low-acid foods like corn to prevent the risk of
  botulism. Adjust pressure for your local altitude.


  ### Local adaptation notes

  Consider the availability of corn and local altitude when planning your canning
  process.'
