bundle_overrides:
  hook: Preserve the taste of summer all year round by learning how to safely can
    crushed tomatoes for your favorite recipes.
  primer: Canning crushed tomatoes is a practical way to preserve the freshness and
    flavor of tomatoes, making them available for use in soups, stews, and casseroles
    throughout the year. The process involves several key steps to ensure both the
    quality and safety of the preserved product. First, tomatoes are washed, peeled,
    and crushed. This is followed by heating the tomatoes and adding an acidifying
    agent such as bottled lemon juice or citric acid to ensure safe acidity levels.
    Proper canning techniques, including the use of a boiling-water canner or pressure
    canner, are essential to prevent spoilage and the growth of harmful bacteria.
    By following these steps, you can enjoy the taste of ripe tomatoes long after
    the growing season has ended.
  guide: '1. Gather your materials: fresh tomatoes, bottled lemon juice or citric
    acid, salt (optional), jars, lids, a boiling-water canner or pressure canner,
    a large pot, and a wooden spoon.


    2. Wash the tomatoes thoroughly. To peel them, dip the tomatoes in boiling water
    for 30 to 60 seconds until the skins split, then transfer them to cold water.
    Slip off the skins and remove the cores.


    3. Trim off any bruised or discolored portions of the tomatoes and quarter them.


    4. In a large pot, heat one-sixth of the quartered tomatoes, crushing them with
    a wooden spoon to release their juice.


    5. Gradually add the remaining tomatoes to the pot, stirring constantly. Allow
    the mixture to boil gently for 5 minutes.


    6. Prepare your jars by adding 2 tablespoons of bottled lemon juice or 1/2 teaspoon
    of citric acid per quart. Add 1 teaspoon of salt per quart if desired.


    7. Fill the jars with the hot tomato mixture, leaving a 1/2-inch headspace. Remove
    any air bubbles and adjust the headspace if necessary. Wipe the rims of the jars
    with a clean, damp paper towel and adjust the lids.


    8. Process the jars using the recommended times and pressures for your altitude,
    ensuring proper sealing and safety.'
  reference:
  - Wash and peel tomatoes by boiling and cooling.
  - Remove cores and damaged parts, then quarter.
  - Crush and heat one-sixth of the tomatoes.
  - Add remaining tomatoes, boil for 5 minutes.
  - Add lemon juice or citric acid to jars.
  - Fill jars, leaving 1/2-inch headspace.
  - Process jars according to altitude guidelines.
  worksheet:
  - List the materials needed for canning crushed tomatoes.
  - Describe the process of peeling tomatoes using boiling water.
  - Explain why acidification is important in canning tomatoes.
  - Outline the steps for filling and sealing jars.
  - Research the processing times and pressures for your altitude.
  teach_forward_kit:
    three_minute_version: Canning crushed tomatoes involves washing, peeling, and
      crushing tomatoes, then heating them and adding acid to ensure safety. Fill
      jars with the hot mixture, seal them, and process using a canner. This preserves
      the tomatoes for use in various dishes throughout the year.
    ten_minute_outline:
    - Introduction to canning crushed tomatoes and its benefits.
    - Materials and tools required for the process.
    - Step-by-step guide to preparing and processing tomatoes.
    - Importance of acidification and safety measures.
    - Discussion on processing times and altitude adjustments.
    - Q&A session to address common concerns and mistakes.
    discussion_prompts:
    - Why is it important to add acid to canned tomatoes?
    - What are the risks of not following proper canning procedures?
    - How can you adjust the process for different altitudes?
    - What are some common mistakes people make when canning tomatoes?
