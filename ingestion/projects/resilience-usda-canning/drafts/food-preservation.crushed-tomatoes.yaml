summary_short: Guide to canning crushed tomatoes with acidification and processing
  times.
summary_medium: Learn how to can crushed tomatoes, including preparation, acidification,
  and processing times for both boiling-water and pressure canners.
plain_language: This guide will help you can crushed tomatoes safely by following
  the correct preparation and processing steps.
markdown_body: "# What this is\nThis is a guide for canning crushed tomatoes, which\
  \ are ideal for use in soups, stews, and casseroles. The process involves washing,\
  \ peeling, crushing, and heating tomatoes, followed by acidification and processing\
  \ in jars.\n\n# Why it matters\nCanning crushed tomatoes allows you to preserve\
  \ the freshness and flavor of tomatoes for later use. Proper canning techniques\
  \ ensure the safety and quality of the preserved product.\n\n# What you need\nYou\
  \ will need fresh tomatoes, bottled lemon juice or citric acid, salt (optional),\
  \ a boiling-water canner or pressure canner, jars, lids, and basic kitchen tools\
  \ like a large pot and a wooden spoon.\n\n# How to do it\n1. Wash and peel the tomatoes\
  \ by dipping them in boiling water until skins split, then in cold water. \n2. Remove\
  \ cores and any damaged parts, then quarter the tomatoes. \n3. Heat one-sixth of\
  \ the quarters in a pot, crushing them to release juice. \n4. Gradually add the\
  \ rest of the tomatoes, stirring constantly, and boil gently for 5 minutes. \n5.\
  \ Add lemon juice or citric acid to jars, and salt if desired. \n6. Fill jars with\
  \ hot tomatoes, leaving 1/2-inch headspace, remove air bubbles, and adjust lids.\
  \ \n7. Process jars using the recommended times and pressures for your altitude.\n\
  \n# Common failure modes\nNot adding enough acid can result in unsafe acidity levels.\
  \ Inadequate processing time or pressure can lead to spoilage.\n\n# Safety/boundary\
  \ notes\nEnsure proper acidification and processing to prevent the growth of harmful\
  \ bacteria. Follow altitude-specific processing guidelines.\n\n# Local adaptation\
  \ notes\nAdjust processing times and pressures based on local altitude using the\
  \ provided tables."
structured_data:
  goal: To safely can crushed tomatoes for long-term storage.
  deliverables: Properly canned jars of crushed tomatoes.
  acceptance_criteria: Jars are sealed and stored without spoilage, maintaining quality
    and safety.
  implementation:
    smallest_viable_version: Canning a single batch of crushed tomatoes using a boiling-water
      canner.
    tools:
    - boiling-water canner
    - pressure canner
    - large pot
    - wooden spoon
    materials:
    - fresh tomatoes
    - bottled lemon juice or citric acid
    - salt
    - jars
    - lids
    expected_time: 3-4 hours
    expected_cost: Moderate, depending on the cost of tomatoes and canning supplies.
    success_checks:
    - Jars are sealed properly
    - No spoilage or off-smells
    stop_conditions:
    - Jars do not seal
    - Visible spoilage
    common_mistakes:
    - Not following altitude-specific processing times
    - Skipping acidification
    variants:
    - label: Urban
      when: Limited space for canning equipment
      notes: Consider smaller batches or using a smaller canner.
    when_to_escalate:
    - If jars do not seal
    - If there are signs of spoilage after processing
  safety_boundary: 'Botulism risk. Low-acid foods (vegetables, meats, poultry, seafood)
    must be processed in a pressure canner, never a boiling-water canner; tomatoes
    must be acidified to pH 4.6 or lower with lemon juice or citric acid as a tested
    recipe directs. Vent the canner 10 minutes before pressurizing, use the exact
    process time and pressure for your jar size, pack style, canner type, and altitude,
    and check dial gauges for accuracy every year. Use only tested recipes and never
    shorten process times. Do not taste food from an unsealed jar or one showing spoilage
    (bulging lid, spurting liquid, unnatural odor, mold): treat it as having produced
    botulinum toxin, which can be fatal whether swallowed or through skin contact,
    and follow USDA disposal and detoxification steps. If any deviation from USDA-tested
    methods may have occurred, boil low-acid and tomato foods in a saucepan before
    eating: 10 minutes below 1,000 ft, plus 1 minute for each additional 1,000 ft.'
