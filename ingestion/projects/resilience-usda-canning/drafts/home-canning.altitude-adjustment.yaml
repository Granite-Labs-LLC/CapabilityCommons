summary_short: Guidelines for adjusting canning process times based on altitude.
summary_medium: Learn how to adjust canning process times according to your altitude
  to ensure safe food preservation.
plain_language: When canning foods at home, it's important to adjust the processing
  time based on your altitude. This ensures that the food is safely preserved.
markdown_body: '### What this is

  This reference sheet provides guidelines for adjusting the processing times of canned
  foods based on your altitude above sea level.


  ### Why it matters

  The boiling temperature of liquids decreases at higher altitudes, which can affect
  the safety of canned foods. Adjusting processing times ensures that food is safely
  preserved.


  ### What you need

  To determine the correct processing time, you need to know your altitude above sea
  level.


  ### How to do it

  If you are unsure of your altitude, consult your county Extension agent or local
  district conservationist with the Soil Conservation Service. Adjust your canning
  process times according to the altitude to ensure safe preservation.


  ### Common failure modes

  Not adjusting processing times for altitude can lead to under-processed foods, which
  may not be safe to consume.


  ### Safety/boundary notes

  Always ensure that you have the correct altitude information to adjust processing
  times accurately.


  ### Local adaptation notes

  Altitude can vary significantly even within a single state or county. Always verify
  your specific location''s altitude.'
