summary_short: Guide to canning snap and Italian beans using a pressure canner.
summary_medium: Detailed instructions for canning snap and Italian beans, including
  preparation, packing methods, and processing times using a pressure canner.
plain_language: Learn how to preserve snap and Italian beans by canning them safely
  using a pressure canner. This guide covers the steps from preparation to processing.
markdown_body: "### What this is\nThis is a guide for canning snap and Italian beans\
  \ using a pressure canner. It includes instructions on preparation, packing, and\
  \ processing to ensure safe preservation.\n\n### Why it matters\nCanning beans allows\
  \ you to preserve them for long-term storage, ensuring you have access to nutritious\
  \ vegetables year-round.\n\n### What you need\nYou will need a pressure canner,\
  \ jars, lids, boiling water, and optionally canning salt.\n\n### How to do it\n\
  1. Select tender, crisp pods and discard any diseased ones. \n2. Wash beans and\
  \ trim ends. \n3. Choose between hot pack or raw pack methods. For hot pack, boil\
  \ beans for 5 minutes before packing. For raw pack, fill jars tightly with raw beans.\
  \ \n4. Add 1 teaspoon of canning salt per quart if desired. \n5. Cover beans with\
  \ boiling water, leaving 1-inch headspace. \n6. Remove air bubbles, adjust headspace,\
  \ wipe rims, and adjust lids. \n7. Process in a pressure canner according to your\
  \ altitude.\n\n### Common failure modes\nIncorrect pressure or incomplete sealing\
  \ can lead to spoilage.\n\n### Safety/boundary notes\nEnsure the correct pressure\
  \ is used for your altitude to prevent spoilage and ensure safety.\n\n### Local\
  \ adaptation notes\nConsider the availability of beans and adjust processing times\
  \ based on local altitude."
