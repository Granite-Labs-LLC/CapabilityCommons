bundle_overrides:
  hook: Preserve your garden's bounty and enjoy fresh beans year-round by mastering
    the art of canning snap and Italian beans.
  primer: Canning is a method of preserving food in which the food contents are processed
    and sealed in an airtight container. This guide focuses on canning snap and Italian
    beans using a pressure canner, which is essential for safely preserving low-acid
    foods like beans. By canning your beans, you can enjoy their fresh taste and nutritional
    benefits long after the growing season has ended. The process involves selecting
    the best beans, preparing them, and then using a pressure canner to ensure they
    are safely preserved. This method helps prevent spoilage and extends the shelf
    life of your beans, making it a valuable skill for anyone interested in food preservation.
  guide: '1. **Select Beans**: Choose tender, crisp pods and discard any that are
    diseased or rusty. This ensures that only the best quality beans are preserved.


    2. **Prepare Beans**: Wash the beans thoroughly and trim the ends. This step is
    crucial for removing dirt and any potential contaminants.


    3. **Choose Packing Method**: Decide between the hot pack or raw pack method.
    For hot pack, boil the beans for 5 minutes before packing them into jars. For
    raw pack, fill the jars tightly with raw beans.


    4. **Add Salt (Optional)**: If desired, add 1 teaspoon of canning salt per quart
    to enhance flavor.


    5. **Fill Jars**: Cover the beans with boiling water, leaving a 1-inch headspace
    at the top of the jar. This space is necessary for the expansion of food during
    processing.


    6. **Prepare Jars for Canning**: Remove air bubbles by gently tapping the jars
    or using a non-metallic spatula. Adjust the headspace if needed, wipe the rims
    with a clean, damp paper towel, and secure the lids.


    7. **Process in Pressure Canner**: Place the jars in a pressure canner and process
    them according to the recommended time and pressure for your altitude. This step
    is critical for ensuring the beans are safely preserved and free from harmful
    bacteria.'
  reference:
  - Select tender, crisp pods; discard diseased ones.
  - Wash beans and trim ends.
  - 'Hot pack: Boil beans for 5 minutes.'
