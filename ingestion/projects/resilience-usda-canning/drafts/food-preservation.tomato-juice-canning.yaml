bundle_overrides:
  hook: Preserve the taste of summer all year round by learning how to can tomato
    juice safely and effectively.
  primer: Canning tomato juice is a practical way to enjoy the fresh taste of tomatoes
    throughout the year. This process involves preparing, acidifying, and processing
    the juice to ensure it is safe for long-term storage. By canning your own tomato
    juice, you can reduce food waste and have a ready supply of this versatile ingredient
    for soups, sauces, and drinks. The key to successful canning is proper preparation
    and following safety guidelines to prevent spoilage. You'll need fresh tomatoes,
    a sieve or food mill, a boiling-water canner or pressure canner, and jars with
    lids. Acidification agents like bottled lemon juice or citric acid are essential
    to ensure the juice is safe to store. The process involves washing and trimming
    the tomatoes, boiling them to prevent juice separation, and then processing the
    juice in jars with the correct acidification and canning method.
  guide: "1. Start by washing and trimming your tomatoes, removing any stems and bruised\
    \ parts. \n2. Quickly cut about 1 pound of tomatoes into quarters and place them\
    \ directly into a saucepan. Heat immediately to boiling while crushing the tomatoes\
    \ to prevent juice separation. \n3. Continue adding and crushing more tomato quarters,\
    \ ensuring the mixture boils constantly and vigorously. \n4. Once all tomatoes\
    \ are added, simmer the mixture for 5 minutes. \n5. Press the heated mixture through\
    \ a sieve or food mill to remove skins and seeds. \n6. Add bottled lemon juice\
    \ or citric acid to each jar to ensure proper acidification. \n7. Reheat the juice\
    \ to boiling, and if desired, add 1 teaspoon of salt per quart. \n8. Fill hot\
    \ jars with the hot tomato juice, leaving a 1/2-inch headspace. \n9. Wipe the\
    \ rims of the jars with a dampened clean paper towel to ensure a good seal. \n\
    10. Adjust the lids and process the jars using the recommended times and pressures\
    \ for your altitude and canning method. \n11. Allow the jars to cool undisturbed\
    \ for 12-24 hours, then check the seals. Properly sealed jars can be stored in\
    \ a cool, dark place."
  reference:
  - Wash and trim tomatoes.
  - Cut tomatoes into quarters and boil immediately.
  - Simmer for 5 minutes.
  - Press through a sieve or food mill.
  - Add lemon juice or citric acid to jars.
  - Reheat juice and add salt if desired.
  - Fill jars leaving 1/2-inch headspace.
  - Wipe rims and adjust lids.
  - Process jars according to altitude and method.
  worksheet:
  - List the equipment needed for canning tomato juice.
  - Describe the steps to prevent juice separation.
  - Explain the importance of acidification in canning.
  - Calculate the amount of tomatoes needed for a canner load of 7 quarts.
  - Practice adjusting processing times based on your local altitude.
  teach_forward_kit:
    three_minute_version: Canning tomato juice involves washing and trimming tomatoes,
      boiling them to prevent separation, pressing the mixture to remove skins and
      seeds, and adding acidification agents before processing in jars. This ensures
      long-term storage and reduces food waste.
    ten_minute_outline:
    - Introduction to canning and its benefits.
    - Overview of necessary equipment and ingredients.
    - Detailed steps for preparing and boiling tomatoes.
    - Explanation of acidification and its importance.
    - Instructions for filling and sealing jars.
    - Guidelines for processing times and pressures.
    - Tips for ensuring successful canning and storage.
    discussion_prompts:
    - Why is acidification crucial in canning tomato juice?
    - What are the potential risks if canning procedures are not followed correctly?
    - How can canning tomato juice contribute to reducing food waste?
    - Discuss the differences between boiling-water canning and pressure canning.
