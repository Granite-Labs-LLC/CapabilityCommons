summary_short: Guide to canning tomato juice, including preparation and processing.
summary_medium: This project blueprint provides detailed instructions for canning
  tomato juice, covering preparation, acidification, and processing times for different
  canning methods.
plain_language: Learn how to can tomato juice safely and effectively, with step-by-step
  instructions on preparation, acidification, and processing.
markdown_body: '### What this is

  This is a guide for canning tomato juice, detailing the steps needed to prepare,
  acidify, and process the juice using various canning methods.


  ### Why it matters

  Canning tomato juice allows for long-term storage and preservation of tomatoes,
  making them available year-round and reducing food waste.


  ### What you need

  You''ll need fresh tomatoes, a sieve or food mill, a boiling-water canner or pressure
  canner, and jars with lids. Acidification agents like bottled lemon juice or citric
  acid are also required.


  ### How to do it

  1. Wash and trim tomatoes, removing stems and any bruised parts. 2. Cut about 1
  pound of tomatoes into quarters and heat immediately to boiling while crushing.
  3. Continue adding and crushing more tomatoes, ensuring the mixture boils constantly.
  4. Simmer for 5 minutes. 5. Press the heated mixture through a sieve or food mill
  to remove skins and seeds. 6. Add bottled lemon juice or citric acid to jars. 7.
  Heat juice again to boiling, add salt if desired, and fill jars leaving 1/2-inch
  headspace. 8. Wipe rims, adjust lids, and process jars using the recommended times
  and pressures for your altitude and canning method.


  ### Common failure modes

  Juice separation can occur if tomatoes are not boiled immediately after cutting.


  ### Safety/boundary notes

  Ensure proper acidification to prevent spoilage and follow recommended processing
  times and pressures to ensure safety.


  ### Local adaptation notes

  Adjust processing times and pressures based on local altitude and available canning
  equipment.'
structured_data:
  goal: Safely can tomato juice for long-term storage.
  deliverables: Canned tomato juice in jars.
  acceptance_criteria: Jars are sealed properly with no signs of spoilage.
  safety_boundary: 'Botulism risk. Low-acid foods (vegetables, meats, poultry, seafood)
    must be processed in a pressure canner, never a boiling-water canner; tomatoes
    must be acidified to pH 4.6 or lower with lemon juice or citric acid as a tested
    recipe directs. Vent the canner 10 minutes before pressurizing, use the exact
    process time and pressure for your jar size, pack style, canner type, and altitude,
    and check dial gauges for accuracy every year. Use only tested recipes and never
    shorten process times. Do not taste food from an unsealed jar or one showing spoilage
    (bulging lid, spurting liquid, unnatural odor, mold): treat it as having produced
    botulinum toxin, which can be fatal whether swallowed or through skin contact,
    and follow USDA disposal and detoxification steps. If any deviation from USDA-tested
    methods may have occurred, boil low-acid and tomato foods in a saucepan before
    eating: 10 minutes below 1,000 ft, plus 1 minute for each additional 1,000 ft.
    Specific to this object: Ensure acidification and proper processing to prevent
    spoilage.'
  implementation:
    smallest_viable_version: Prepare and can a small batch of tomato juice using a
      boiling-water canner.
    tools:
    - Sieve
    - Food mill
    - Boiling-water canner
    - Pressure canner
    materials:
    - Fresh tomatoes
    - Bottled lemon juice or citric acid
    - Salt
    - Canning jars and lids
    expected_time: 2-3 hours
    expected_cost: $5-$20
    success_checks:
    - Jars are sealed properly.
    - No signs of spoilage after processing.
    stop_conditions:
    - Juice separation occurs.
    - Jars do not seal properly.
    common_mistakes:
    - Not boiling tomatoes immediately after cutting.
    - Incorrect acidification.
    variants:
    - label: renter
      when: Limited access to canning equipment.
      notes: Consider using a community kitchen or borrowing equipment.
    when_to_escalate:
    - If jars do not seal properly after processing.
