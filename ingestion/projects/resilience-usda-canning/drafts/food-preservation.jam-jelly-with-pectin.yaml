bundle_overrides:
  hook: Making jams and jellies with added pectin is a quick way to preserve the natural
    flavors of your favorite fruits while saving time in the kitchen.
  primer: Jams and jellies are delightful spreads made from fruits and sugar, often
    enjoyed on toast or as a dessert topping. Traditionally, making these preserves
    required long cooking times and careful testing to ensure proper gelling. However,
    by using added pectin, a natural thickening agent found in fruits, you can simplify
    the process. Pectin helps the mixture set quickly, reducing cooking time and preserving
    more of the fruit's natural flavor. This method is particularly useful for home
    cooks who want to make large batches efficiently. To get started, you'll need
    fresh fruits or juices, commercially prepared powdered or liquid pectin, a saucepan,
    pre-sterilized Mason canning jars, and self-sealing two-piece lids. By following
    a few straightforward steps, you can enjoy homemade jams and jellies that taste
    fresh and vibrant.
  guide: '1. Gather your ingredients: fresh fruit or juice, pectin, and sugar. Ensure
    you have pre-sterilized Mason jars and lids ready.

    2. Prepare the fruit by washing, peeling, and crushing it as needed. Measure the
    fruit and juice according to your recipe.

    3. In a large saucepan, combine the fruit or juice with the pectin. Follow the
    package instructions for the correct ratio.

    4. If desired, add 1/2 teaspoon of butter or margarine to the mixture to reduce
    foaming.

    5. Bring the mixture to a boil over high heat, stirring constantly.

    6. Add sugar as per your recipe and return to a full rolling boil. Boil for exactly
    one minute, then remove from heat.

    7. Skim off any foam with a metal spoon.

    8. Quickly ladle the hot jam or jelly into the prepared jars, leaving 1/4 inch
    of headspace.

    9. Wipe the rims of the jars with a clean, damp cloth and apply the lids.

    10. Process the jars in a boiling-water canner for the recommended time, adjusting
    for altitude if necessary.

    11. Allow the jars to cool undisturbed for 12-24 hours. Check the seals before
    storing.'
  reference:
  - Use fresh pectin each year to ensure proper gelling.
  - Pre-sterilize Mason jars and use self-sealing lids.
  - Add 1/2 teaspoon of butter or margarine to reduce foaming.
  - Process jars in a boiling-water canner, adjusting time for altitude.
  - Ensure proper gel formation and natural fruit flavor.
  worksheet:
  - List the fruits you want to use for your jam or jelly.
  - Calculate the amount of pectin and sugar needed based on your chosen fruit.
  - Practice sterilizing jars and lids before starting the cooking process.
  - Experiment with adding butter or margarine to reduce foaming and note the difference.
  - Record the processing time adjustments needed for your altitude.
