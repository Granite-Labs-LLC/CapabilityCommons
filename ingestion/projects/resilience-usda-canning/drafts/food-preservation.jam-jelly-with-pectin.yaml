markdown_body: '### What this is

  This project blueprint provides instructions for making jams and jellies using added
  pectin. This method reduces cooking time and generally results in a larger yield
  with more natural fruit flavors.


  ### Why it matters

  Using added pectin simplifies the jam and jelly-making process by eliminating the
  need to test for proper gelling. It also enhances the natural fruit flavors and
  increases the yield.


  ### What you need

  You''ll need fresh fruits or juices, commercially prepared powdered or liquid pectin,
  a saucepan, pre-sterilized Mason canning jars, and self-sealing two-piece lids.


  ### How to do it

  1. Combine the fruit or juice with the pectin as per the package instructions. 2.
  Add 1/2 teaspoon of butter or margarine to reduce foaming, if desired. 3. Boil the
  mixture and follow the specific recipe instructions for your chosen fruit. 4. Process
  the jars in a boiling-water canner for the recommended time based on your altitude.


  ### Common failure modes

  Using old pectin can result in poor gels. Ensure to purchase fresh pectin each year.


  ### Safety/boundary notes

  Ensure jars are pre-sterilized and follow the recommended processing times to prevent
  spoilage.


  ### Local adaptation notes

  Adjust the boiling-water canner processing time based on your altitude.'
