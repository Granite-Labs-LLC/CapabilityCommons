bundle_overrides:
  hook: Canning chicken or rabbit allows you to store meat long-term without refrigeration,
    reducing waste and ensuring you have food ready when you need it.
  primer: 'Canning is a method of preserving food in which the food contents are processed
    and sealed in an airtight container. This guide focuses on canning chicken or
    rabbit using pressure canning methods. Pressure canning is essential for low-acid
    foods like meats because it reaches the high temperatures necessary to kill harmful
    bacteria. By canning chicken or rabbit, you can store meat for extended periods
    without the need for refrigeration, making it a practical solution for those looking
    to preserve food and reduce waste. The process involves preparing the meat, filling
    jars, and processing them in a pressure canner. There are two main techniques:
    hot pack and raw pack. Hot pack involves cooking the meat before canning, which
    helps improve the quality and liquid coverage during storage. Raw pack involves
    placing raw meat directly into jars. Both methods require careful attention to
    detail to ensure safety and quality.'
  guide: "To can chicken or rabbit, you'll need a pressure canner, jars, salt, and\
    \ broth. Start by selecting freshly killed and dressed, healthy animals. For chicken,\
    \ chill the dressed meat for 6 to 12 hours before canning. For rabbit, soak the\
    \ dressed meat for 1 hour in water with 1 tablespoon of salt per quart, then rinse.\
    \ Remove excess fat and cut the meat into pieces suitable for canning. \n\nFor\
    \ the hot pack method, cook the meat until it's about two-thirds done. Fill hot\
    \ jars with the cooked meat and hot broth, leaving a 1-1/4 inch headspace. Optionally,\
    \ add 1 teaspoon of salt per quart. For the raw pack method, fill hot jars loosely\
    \ with raw meat pieces, leaving the same headspace, and do not add liquid. \n\n\
    Wipe the rims of the jars with a damp paper towel to ensure a clean seal. Adjust\
    \ the lids and process the jars in a pressure canner. The processing time and\
    \ pressure depend on your altitude and the size of the jars. Follow the recommended\
    \ guidelines to ensure safety. Once processed, let the jars cool and check the\
    \ seals. Properly sealed jars can be stored in a cool, dark place for long-term\
    \ use."
