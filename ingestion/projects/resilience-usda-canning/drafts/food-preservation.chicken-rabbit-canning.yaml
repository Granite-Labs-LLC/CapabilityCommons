  and processing them in a pressure canner.
markdown_body: '### What this is

  This project blueprint provides detailed instructions for canning chicken or rabbit
  using pressure canning methods. It covers both hot pack and raw pack techniques,
  ensuring safe preservation of the meat.


  ### Why it matters

  Canning chicken or rabbit allows for long-term storage of meat without refrigeration,
  making it a practical solution for preserving food and reducing waste.


  ### What you need

  You will need a pressure canner, jars, salt, and broth. Freshly killed and dressed
  chicken or rabbit is required, along with basic kitchen tools for preparation.


  ### How to do it

  1. Choose freshly killed and dressed, healthy animals. Chill dressed chicken for
  6 to 12 hours before canning. Soak dressed rabbits for 1 hour in salted water, then
  rinse. 2. Remove excess fat and cut the meat into pieces suitable for canning. 3.
  For hot pack, cook the meat until about two-thirds done, then fill hot jars with
  meat and hot broth, leaving 1-1/4 inch headspace. For raw pack, fill hot jars loosely
  with raw meat, leaving the same headspace. 4. Wipe jar rims, adjust lids, and process
  in a pressure canner according to the recommended times and pressures based on altitude
  and jar size.


  ### Common failure modes

  Insufficient liquid cover in jars can lead to poor preservation. Incorrect pressure
  during canning can result in unsafe food.


  ### Safety/boundary notes

  Ensure proper pressure is maintained throughout the canning process to avoid contamination
  and ensure food safety.


  ### Local adaptation notes

  Adapt the process based on the availability of chicken or rabbit in your area.'
