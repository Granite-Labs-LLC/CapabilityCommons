    - water
    - salt (optional)
    expected_time: 4-5 hours
    expected_cost: $10-$30
    success_checks:
    - Jars are sealed properly.
    - No spoilage or contamination is evident.
    stop_conditions:
    - If the pressure canner does not reach the required pressure.
    - If jars do not seal properly.
    common_mistakes:
    - Not skimming enough fat from the broth.
    - Incorrect pressure settings for altitude.
    variants:
