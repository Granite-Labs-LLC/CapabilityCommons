bundle_overrides:
  hook: Preserve your homemade meat stock for months with safe and effective canning
    techniques.
  primer: Canning meat stock or broth is a practical way to ensure you have a ready
    supply of flavorful base for soups, stews, and other recipes. By using a pressure
    canner, you can safely store your stock for long-term use, preventing spoilage
    and maintaining food safety. The process involves preparing the stock by simmering
    bones, skimming excess fat, and then reheating the broth before filling jars.
    Proper sealing and processing in a pressure canner are crucial to avoid contamination
    and ensure the jars are shelf-stable. This method is especially useful for those
    who enjoy cooking from scratch and want to make the most of their ingredients.
  guide: 'To can meat stock or broth, start by gathering your materials: fresh trimmed
    beef or poultry bones, water, optional salt, a pressure canner, jars, and lids.
    Begin by preparing the bones. Saw or crack them to enhance flavor extraction,
    then rinse and place them in a large stockpot. Cover the bones with water and
    simmer to create a rich broth. Once the broth is ready, remove the bones and allow
    the broth to cool. Skim off any excess fat, as too much fat can prevent proper
    sealing of the jars. Reheat the broth to boiling. While the broth is reheating,
    prepare your jars by washing them thoroughly. Fill the hot jars with the boiling
    broth, leaving a 1-inch headspace. Wipe the rims of the jars with a dampened clean
    paper towel to ensure a good seal. Adjust the lids and place the jars in the pressure
    canner. Process the jars according to the recommended times and pressures for
    your altitude. This step is crucial to ensure the safety and longevity of the
    canned stock. Once processed, allow the jars to cool undisturbed. Check the seals
    before storing the jars in a cool, dark place.'
