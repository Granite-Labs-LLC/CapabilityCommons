summary_short: Guide to canning meat stock or broth using pressure canning.
summary_medium: This project blueprint provides a detailed procedure for canning meat
  stock or broth, including preparation, packing, and processing times for both dial-gauge
  and weighted-gauge pressure canners.
plain_language: Learn how to safely can meat stock or broth at home using a pressure
  canner. This guide covers everything from preparing the stock to processing it in
  jars.
markdown_body: '### What this is

  This is a guide for canning meat stock or broth using a pressure canner. It includes
  steps for preparing the stock, filling jars, and processing them safely.


  ### Why it matters

  Canning meat stock allows you to preserve it for long-term storage, ensuring you
  have a ready supply for soups, stews, and other recipes. Proper canning prevents
  spoilage and ensures food safety.


  ### What you need

  You''ll need a pressure canner, jars, lids, fresh trimmed beef or poultry bones,
  water, and optional salt.


  ### How to do it

  1. Prepare the bones by sawing or cracking them and simmering in water for flavor
  extraction. 2. Skim off excess fat from the cooled broth. 3. Reheat the broth to
  boiling, fill jars leaving 1-inch headspace, and wipe rims clean. 4. Process jars
  in a pressure canner according to the recommended times and pressures for your altitude.


  ### Common failure modes

  Excess fat in the broth can prevent proper sealing. Incorrect pressure during canning
  can lead to spoilage.


  ### Safety/boundary notes

  Ensure the pressure canner reaches the correct pressure for your altitude to avoid
  contamination.


  ### Local adaptation notes

  Adapt the recipe based on the availability of bones in your area.'
structured_data:
  goal: Safely can meat stock or broth for long-term storage.
  deliverables: Canned jars of meat stock or broth.
  acceptance_criteria: Jars are properly sealed and stored without spoilage.
  safety_boundary: 'Botulism risk. Low-acid foods (vegetables, meats, poultry, seafood)
    must be processed in a pressure canner, never a boiling-water canner; tomatoes
    must be acidified to pH 4.6 or lower with lemon juice or citric acid as a tested
    recipe directs. Vent the canner 10 minutes before pressurizing, use the exact
    process time and pressure for your jar size, pack style, canner type, and altitude,
    and check dial gauges for accuracy every year. Use only tested recipes and never
    shorten process times. Do not taste food from an unsealed jar or one showing spoilage
    (bulging lid, spurting liquid, unnatural odor, mold): treat it as having produced
    botulinum toxin, which can be fatal whether swallowed or through skin contact,
    and follow USDA disposal and detoxification steps. If any deviation from USDA-tested
    methods may have occurred, boil low-acid and tomato foods in a saucepan before
    eating: 10 minutes below 1,000 ft, plus 1 minute for each additional 1,000 ft.
    Specific to this object: Ensure proper pressure is maintained during canning to
    prevent contamination.'
  implementation:
