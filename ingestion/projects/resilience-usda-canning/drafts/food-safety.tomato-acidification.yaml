summary_short: Guidelines for acidifying tomatoes to ensure safe acidity levels during
  canning.
summary_medium: Learn how to properly acidify tomatoes using lemon juice, citric acid,
  or vinegar to ensure safe canning practices.
plain_language: When canning tomatoes, it's important to add acid to ensure they are
  safe to eat. You can use bottled lemon juice, citric acid, or vinegar, but vinegar
  might change the flavor.
markdown_body: '### What this is

  This guide explains how to acidify tomatoes to ensure they reach safe acidity levels
  for canning.


  ### Why it matters

  Acidifying tomatoes is crucial to prevent the growth of harmful bacteria during
  storage. Proper acidity ensures the safety and quality of canned tomatoes.


  ### What you need

  You''ll need bottled lemon juice, citric acid, or vinegar, and optionally sugar
  to offset the acid taste. A pressure canner is recommended for higher quality results.


  ### How to do it

  Add 2 tablespoons of bottled lemon juice or 1/2 teaspoon of citric acid per quart
  of tomatoes. For pints, use 1 tablespoon of lemon juice or 1/4 teaspoon of citric
  acid. Alternatively, use 4 tablespoons of 5% acidity vinegar per quart, but be aware
  of potential flavor changes. Add the acid directly to jars before filling with tomatoes.


  ### Common failure modes

  Using vinegar can lead to undesirable flavor changes. Not adding enough acid can
  result in unsafe acidity levels.


  ### Safety/boundary notes

  Ensure all tomatoes are disease-free and preferably vine-ripened. Do not use tomatoes
  from dead or frost-killed vines.


  ### Local adaptation notes

  Adjust acid quantities based on local tomato varieties and personal taste preferences.
  Consider local availability of acidifying agents.'
structured_data:
  definition: Acidification is the process of adding acid to tomatoes to ensure safe
    acidity levels for canning.
  key_questions:
  - Why is acidification necessary for canning tomatoes?
  - What are the recommended acidifying agents and their quantities?
  misconceptions:
  - Vinegar is always a suitable substitute for lemon juice or citric acid without
    affecting flavor.
  safety_boundary: 'Botulism risk. Low-acid foods (vegetables, meats, poultry, seafood)
    must be processed in a pressure canner, never a boiling-water canner; tomatoes
    must be acidified to pH 4.6 or lower with lemon juice or citric acid as a tested
    recipe directs. Vent the canner 10 minutes before pressurizing, use the exact
    process time and pressure for your jar size, pack style, canner type, and altitude,
    and check dial gauges for accuracy every year. Use only tested recipes and never
    shorten process times. Do not taste food from an unsealed jar or one showing spoilage
    (bulging lid, spurting liquid, unnatural odor, mold): treat it as having produced
    botulinum toxin, which can be fatal whether swallowed or through skin contact,
    and follow USDA disposal and detoxification steps. If any deviation from USDA-tested
    methods may have occurred, boil low-acid and tomato foods in a saucepan before
    eating: 10 minutes below 1,000 ft, plus 1 minute for each additional 1,000 ft.'
