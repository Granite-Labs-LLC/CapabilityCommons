bundle_overrides:
  hook: Preserve your homemade soups for long-term storage while maintaining their
    flavor and nutritional value with safe canning techniques.
  primer: Canning soups at home is a practical way to store your favorite homemade
    soups for extended periods. This process involves using a pressure canner, which
    is essential for safely preserving low-acid foods like vegetables, meats, and
    seafood. The pressure canner ensures that the soup reaches temperatures high enough
    to kill harmful bacteria, such as those that cause botulism. Before starting,
    it's crucial to gather all necessary equipment, including a pressure canner, jars,
    lids, and your chosen ingredients. The process involves preparing your ingredients
    by washing and cooking them, combining them with broth or water, and boiling for
    a short period. The mixture is then placed into jars, which are sealed and processed
    in the pressure canner. It's important to follow altitude-specific pressure guidelines
    to ensure safety. Avoid adding thickeners like flour or cream, as these can interfere
    with the canning process. By following these steps, you can enjoy your homemade
    soups anytime, knowing they are safely preserved.
  guide: '1. Gather your equipment: a pressure canner, jars, lids, and your chosen
    ingredients such as vegetables, meat, or seafood. Ensure all equipment is clean
    and in good condition.


    2. Prepare your ingredients: Wash and cook vegetables, meat, or seafood as needed.
    For meats, cover with water and cook until tender, then cool and remove bones.
    Cook vegetables separately.


    3. Combine ingredients: Drain cooked foods and combine them with meat broth, tomatoes,
    or water to cover. Bring the mixture to a boil and let it boil for 5 minutes.


    4. Fill the jars: Fill hot jars halfway with the mixture of solids. Add the remaining
    liquid, leaving a 1-inch headspace at the top of each jar.


    5. Seal the jars: Place lids on the jars and secure them according to the manufacturer''s
    instructions.


    6. Process in the pressure canner: Place the jars in the pressure canner. Adjust
    the pressure based on your altitude (e.g., 11 lb for 0-2,000 ft, 12 lb for 2,001-4,000
    ft, etc.). Process the jars for the recommended time.


    7. Cool and store: Once processing is complete, allow the canner to cool naturally.
    Remove the jars and let them cool on a towel or rack. Check seals before storing.
    Properly sealed jars can be stored in a cool, dark place for long-term use.'
  reference:
  - Use a pressure canner for low-acid foods.
  - Do not add thickeners like flour or cream.
  - 'Adjust pressure for altitude: 11 lb (0-2,000 ft), 12 lb (2,001-4,000 ft), etc.'
  - Boil ingredients for 5 minutes before canning.
  - Leave a 1-inch headspace in jars.
  - Ensure jars are sealed properly before storage.
  worksheet:
  - List the equipment needed for canning soups.
  - Describe the steps to prepare ingredients for canning.
  - Explain why altitude affects canning pressure.
  - Identify common mistakes in the canning process.
  - Practice filling jars with the correct headspace.
  - Check seals on cooled jars and describe the process.
