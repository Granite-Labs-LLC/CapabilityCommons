summary_short: Guide to safely canning soups using a pressure canner.
summary_medium: This guide provides detailed instructions for canning soups, including
  preparation, processing times, and safety precautions to ensure a successful and
  safe canning process.
plain_language: Learn how to can soups safely at home using a pressure canner, with
  step-by-step instructions and important safety tips.
markdown_body: '### What this is

  This is a guide for canning soups at home using a pressure canner. It includes instructions
  for preparing ingredients, processing times, and safety precautions.


  ### Why it matters

  Canning soups allows for long-term storage of homemade soups, preserving their flavor
  and nutritional value while ensuring food safety.


  ### What you need

  A pressure canner, jars, lids, boiling water, and ingredients such as vegetables,
  meat, or seafood. Ensure all equipment is clean and in good condition.


  ### How to do it

  Prepare your ingredients by washing and cooking them as needed. Combine cooked ingredients
  with broth or water, boil for 5 minutes, and fill jars halfway with solids. Add
  liquid, leaving a 1-inch headspace. Process in a pressure canner according to altitude-specific
  pressure guidelines.


  ### Common failure modes

  Incorrect pressure can lead to unsafe preservation. Ensure seals are complete and
  pressure is adjusted for altitude.


  ### Safety/boundary notes

  Do not add thickeners like flour or cream. Adjust pressure for altitude to ensure
  safety.


  ### Local adaptation notes

  Consider local ingredient availability and altitude when adjusting processing pressure.'
structured_data:
  goal: Safely preserve homemade soups using a pressure canner.
  deliverables: Canned soups stored in jars with complete seals.
  acceptance_criteria: Jars are sealed properly and stored safely. Soup is safe to
    consume after canning.
  safety_boundary: 'Botulism risk. Low-acid foods (vegetables, meats, poultry, seafood)
    must be processed in a pressure canner, never a boiling-water canner; tomatoes
    must be acidified to pH 4.6 or lower with lemon juice or citric acid as a tested
    recipe directs. Vent the canner 10 minutes before pressurizing, use the exact
    process time and pressure for your jar size, pack style, canner type, and altitude,
    and check dial gauges for accuracy every year. Use only tested recipes and never
    shorten process times. Do not taste food from an unsealed jar or one showing spoilage
    (bulging lid, spurting liquid, unnatural odor, mold): treat it as having produced
    botulinum toxin, which can be fatal whether swallowed or through skin contact,
    and follow USDA disposal and detoxification steps. If any deviation from USDA-tested
    methods may have occurred, boil low-acid and tomato foods in a saucepan before
    eating: 10 minutes below 1,000 ft, plus 1 minute for each additional 1,000 ft.
    Specific to this object: Ensure correct pressure is used based on altitude. Do
    not add thickeners.'
