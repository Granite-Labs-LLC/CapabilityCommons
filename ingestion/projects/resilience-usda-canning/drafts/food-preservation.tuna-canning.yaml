bundle_overrides:
  hook: Canning tuna at home ensures you have a supply of high-quality, homemade canned
    fish, perfect for long-term storage.
  primer: Canning tuna at home is a practical way to preserve fresh fish for future
    use. This process involves preparing the tuna, packing it into jars, and processing
    it using a pressure canner to ensure safety and longevity. The key steps include
    keeping the tuna on ice until ready to can, removing the viscera, and washing
    the fish thoroughly. Precooking the fish by baking or steaming is essential, followed
    by refrigerating it overnight to firm the meat. After removing the skin, bones,
    and dark flesh, the tuna is cut into pieces suitable for jars. The tuna is then
    packed into jars with water or oil, leaving a 1-inch headspace, and salt can be
    added if desired. Finally, the jars are processed in a pressure canner according
    to altitude-specific guidelines. This method not only preserves the tuna but also
    maintains its nutritional value and flavor.
  guide: "1. **Preparation**: Keep the tuna on ice until you're ready to start canning.\
    \ This helps maintain its freshness. \n\n2. **Cleaning**: Remove the viscera and\
    \ wash the fish thoroughly in cold water to ensure it's clean and ready for cooking.\
    \ \n\n3. **Precooking**: You can either bake the fish at 250°F for 2.5 to 4 hours\
    \ or at 350°F for 1 hour, or steam it for 2 to 4 hours, depending on the size.\
    \ This step is crucial for partially cooking the fish before canning. \n\n4. **Refrigeration**:\
    \ After cooking, refrigerate the fish overnight. This helps firm up the meat,\
    \ making it easier to handle and pack. \n\n5. **Trimming**: Peel off the skin\
    \ using a knife, and remove any blood vessels and discolored flesh. Cut the meat\
    \ away from the bones and discard all bones and dark flesh. \n\n6. **Cutting**:\
    \ Cut the fish into pieces that will fit into your jars. This usually means cutting\
    \ the quarters crosswise into lengths suitable for half-pint or pint jars. \n\n\
    7. **Packing**: Pack the tuna into hot jars, pressing down gently to make a solid\
    \ pack. You can choose to pack it in water or oil, depending on your preference.\
    \ Leave a 1-inch headspace in the jars. \n\n8. **Adding Salt**: If desired, add\
    \ 1/2 teaspoon of salt per half-pint or 1 teaspoon per pint. \n\n9. **Canning**:\
    \ Process the jars in a pressure canner according to altitude-specific guidelines.\
    \ Ensure the pressure is maintained correctly to avoid contamination and ensure\
    \ safety."
