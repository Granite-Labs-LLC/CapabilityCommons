markdown_body: '### What this is

  This is a detailed guide for canning tuna at home using a pressure canner. It includes
  steps for preparing the tuna, packing it into jars, and processing it safely.


  ### Why it matters

  Canning tuna at home allows you to preserve fresh tuna for long-term storage, ensuring
  you have a supply of high-quality, homemade canned fish.


  ### What you need

  You will need fresh tuna, a pressure canner, jars, salt, and oil or water for packing.


  ### How to do it

  1. Keep tuna on ice until ready to can. 2. Remove viscera and wash the fish in cold
  water. 3. Precook the fish by baking or steaming. 4. Refrigerate overnight to firm
  the meat. 5. Remove skin, bones, and dark flesh. 6. Cut into pieces suitable for
  jars. 7. Pack into jars with water or oil, leaving 1-inch headspace. 8. Add salt
  if desired. 9. Process in a pressure canner according to altitude-specific guidelines.


  ### Common failure modes

  Formation of struvite crystals, incorrect pressure settings, and contamination.


  ### Safety/boundary notes

  Ensure proper pressure is maintained during canning to avoid contamination and ensure
  safety.


  ### Local adaptation notes

  Adjust the procedure based on the availability of tuna and local canning regulations.'
