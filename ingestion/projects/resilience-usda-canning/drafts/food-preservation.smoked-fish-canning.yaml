plain_language: Learn how to safely can smoked fish using a pressure canner, with
  step-by-step instructions for preparation, packing, and processing.
markdown_body: '### What this is

  This is a guide for canning smoked fish using a pressure canner. It includes instructions
  for preparing, packing, and processing smoked fish to ensure safety and quality.


  ### Why it matters

  Canning smoked fish allows for long-term preservation, making it possible to enjoy
  this food without refrigeration. However, it requires careful attention to processing
  times and pressures to prevent foodborne illness.


  ### What you need

  A 16 to 22 quart pressure canner, pint canning jars, smoked fish, and a clean, damp
  paper towel.


  ### How to do it

  Thaw smoked fish in the refrigerator if previously frozen. Cut fish into pieces
  that fit vertically in pint jars, leaving a 1-inch headspace. Pack fish into hot
  jars without adding liquid. Clean jar rims and adjust lids. Fill the pressure canner
  with 4 quarts of cool tap water and place jars on the rack. Process for 110 minutes
  at the appropriate pressure for your altitude.


  ### Common failure modes

  Using incorrect pressure or processing time can lead to unsafe food. Strong flavors
  may develop if the fish is heavily smoked.


  ### Safety/boundary notes

  Ensure the correct pressure is used for your altitude. Do not taste lightly smoked
  fish before canning as it is not fully cooked.


  ### Local adaptation notes

  Availability of smoked fish may vary by region. Ensure fish is smoked using tested
  methods.'
structured_data:
  goal: Safely preserve smoked fish using pressure canning.
  deliverables: Canned smoked fish in pint jars.
  acceptance_criteria: Fish is safely canned and shelf-stable, with no signs of spoilage.
  safety_boundary: 'Botulism risk. Low-acid foods (vegetables, meats, poultry, seafood)
    must be processed in a pressure canner, never a boiling-water canner; tomatoes
    must be acidified to pH 4.6 or lower with lemon juice or citric acid as a tested
    recipe directs. Vent the canner 10 minutes before pressurizing, use the exact
    process time and pressure for your jar size, pack style, canner type, and altitude,
    and check dial gauges for accuracy every year. Use only tested recipes and never
    shorten process times. Do not taste food from an unsealed jar or one showing spoilage
    (bulging lid, spurting liquid, unnatural odor, mold): treat it as having produced
    botulinum toxin, which can be fatal whether swallowed or through skin contact,
    and follow USDA disposal and detoxification steps. If any deviation from USDA-tested
    methods may have occurred, boil low-acid and tomato foods in a saucepan before
    eating: 10 minutes below 1,000 ft, plus 1 minute for each additional 1,000 ft.
    Specific to this object: Follow exact processing times and pressures to prevent
    contamination.'
