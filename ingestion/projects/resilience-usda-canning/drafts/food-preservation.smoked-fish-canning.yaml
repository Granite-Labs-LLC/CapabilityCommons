bundle_overrides:
  hook: Canning smoked fish allows you to enjoy this delicacy year-round without refrigeration,
    but it requires precise methods to ensure safety.
  primer: Canning smoked fish is a method of preserving fish that has been lightly
    smoked, allowing it to be stored without refrigeration for extended periods. This
    process involves using a pressure canner, which is essential for safely preserving
    low-acid foods like fish. The pressure canner reaches higher temperatures than
    boiling water canners, which is necessary to eliminate the risk of botulism, a
    potentially fatal foodborne illness. Before starting, ensure you have a 16 to
    22 quart pressure canner, pint canning jars, and smoked fish. If your fish has
    been frozen, it must be thawed in the refrigerator until no ice crystals remain.
    The fish should be cut into pieces that fit vertically in the jars, leaving a
    1-inch headspace. It's important not to add any liquid to the jars, as the fish
    will release its own juices during processing. The jars are then processed in
    the pressure canner for 110 minutes at the appropriate pressure for your altitude.
    This method not only preserves the fish but also intensifies its smoky flavor,
    making it a delicious addition to your pantry.
  guide: '1. **Prepare the Fish**: If your smoked fish has been frozen, thaw it in
    the refrigerator until completely defrosted. Cut the fish into pieces that will
    fit vertically in pint jars, ensuring you leave a 1-inch headspace at the top
    of each jar.


    2. **Pack the Jars**: Sterilize your pint jars and keep them hot. Pack the fish
    pieces into the jars without adding any liquid. The fish should be packed either
    loosely or tightly, but ensure the 1-inch headspace is maintained.


    3. **Prepare the Canner**: Pour 4 quarts of cool tap water into your pressure
    canner. Place the jars on the rack inside the canner.


    4. **Seal and Process**: Clean the rims of the jars with a clean, damp paper towel
    to ensure a good seal. Place the lids on the jars and screw on the bands until
    fingertip tight. Close the canner lid and follow the manufacturer''s instructions
    to vent the canner for 10 minutes before pressurizing.


    5. **Processing**: Process the jars for 110 minutes at the pressure recommended
    for your altitude. This is crucial to ensure the fish is safe to eat.


    6. **Cooling and Storing**: Once processing is complete, allow the canner to depressurize
    naturally. Remove the jars and let them cool on a towel or rack for 12-24 hours.
    Check the seals before storing the jars in a cool, dark place.'
  reference:
  - Use a 16 to 22 quart pressure canner.
  - Thaw smoked fish in the refrigerator if previously frozen.
  - Cut fish to fit vertically in pint jars, leaving a 1-inch headspace.
  - Do not add liquid to jars.
  - Process for 110 minutes at the correct pressure for your altitude.
  - Ensure jars are sealed properly before storage.
