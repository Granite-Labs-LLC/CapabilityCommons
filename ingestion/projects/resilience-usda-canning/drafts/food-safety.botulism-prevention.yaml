summary_short: Prevent botulism in home-canned foods by following USDA guidelines.
summary_medium: Guidelines for preventing botulism in home-canned foods, emphasizing
  the importance of following USDA-endorsed methods and boiling low-acid foods before
  consumption if deviations occur.
plain_language: To prevent botulism, always follow USDA guidelines when canning low-acid
  foods. If you're unsure about the canning process used, boil the food before eating.
markdown_body: '### What this is

  This is a safety notice about preventing botulism in home-canned foods by adhering
  to USDA guidelines.


  ### Why it matters

  Botulism is a serious illness caused by a toxin that can develop in improperly canned
  foods. Following proper canning procedures is crucial to prevent this risk.


  ### What you need

  USDA-endorsed canning guidelines, a saucepan for boiling.


  ### How to do it

  Always can low-acid and tomato foods according to USDA guidelines. If there''s any
  doubt about the canning process, boil the food for 10 minutes if you''re below 1,000
  ft elevation, adding an extra minute for each additional 1,000 ft.


  ### Common failure modes

  Not following USDA guidelines can lead to botulism poisoning.


  ### Safety/boundary notes

  Boiling is not a substitute for proper canning methods and does not guarantee safety
  if the food was significantly underprocessed.


  ### Local adaptation notes

  Adjust boiling time based on local altitude.'
structured_data:
  tools: []
  materials: []
  success_criteria:
  - No botulism poisoning occurs.
  failure_modes:
  - Botulism poisoning
  safety_boundary: 'Botulism risk. Low-acid foods (vegetables, meats, poultry, seafood)
    must be processed in a pressure canner, never a boiling-water canner; tomatoes
    must be acidified to pH 4.6 or lower with lemon juice or citric acid as a tested
    recipe directs. Vent the canner 10 minutes before pressurizing, use the exact
    process time and pressure for your jar size, pack style, canner type, and altitude,
    and check dial gauges for accuracy every year. Use only tested recipes and never
    shorten process times. Do not taste food from an unsealed jar or one showing spoilage
    (bulging lid, spurting liquid, unnatural odor, mold): treat it as having produced
    botulinum toxin, which can be fatal whether swallowed or through skin contact,
    and follow USDA disposal and detoxification steps. If any deviation from USDA-tested
    methods may have occurred, boil low-acid and tomato foods in a saucepan before
    eating: 10 minutes below 1,000 ft, plus 1 minute for each additional 1,000 ft.
    Specific to this object: Boil for 10 minutes at altitudes below 1,000 ft; add
    1 minute per 1,000 ft elevation.'
