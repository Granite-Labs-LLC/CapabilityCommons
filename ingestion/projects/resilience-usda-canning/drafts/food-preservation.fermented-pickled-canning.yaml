bundle_overrides:
  hook: Preserve the flavors and nutritional benefits of seasonal produce by learning
    how to safely can fermented foods and pickled vegetables.
  primer: 'Canning fermented foods and pickled vegetables is a time-honored method
    of preserving seasonal produce for long-term storage. This process not only extends
    the shelf life of your favorite fruits and vegetables but also maintains their
    nutritional value and enhances their flavors. To successfully can these foods,
    you''ll need some basic equipment: canning jars, fermentation weights, vinegar,
    and sterilized tools. The process involves fermenting the foods to develop their
    flavors, preparing a pickling solution, and then sealing them in jars to prevent
    spoilage. Proper sealing and sterilization are crucial to avoid contamination
    and ensure the safety of the preserved foods. By mastering this technique, you
    can enjoy the taste of summer vegetables all year round.'
  guide: "1. Gather your materials: canning jars, fermentation weights, vinegar, and\
    \ sterilized equipment. \n2. Prepare your ingredients by cleaning and cutting\
    \ them as needed. \n3. Begin the fermentation process by placing the vegetables\
    \ in a suitable container and using fermentation weights to keep them submerged\
    \ in their juices. Allow them to ferment for 1-2 days in a cool, dark place. \n\
    4. Once fermentation is complete, prepare the pickling solution by mixing vinegar\
    \ with water and any desired spices. \n5. Sterilize your canning jars by boiling\
    \ them in water for 10 minutes. \n6. Pack the fermented vegetables into the sterilized\
    \ jars, leaving about 1/2 inch of headspace. \n7. Pour the pickling solution over\
    \ the vegetables, ensuring they are completely covered. \n8. Wipe the rims of\
    \ the jars clean, place the lids on, and screw on the bands until fingertip tight.\
    \ \n9. Process the jars in a boiling water canner for the recommended time based\
    \ on your altitude and recipe. \n10. Remove the jars and let them cool undisturbed\
    \ for 12-24 hours. Check the seals by pressing the center of each lid; it should\
    \ not flex up and down. \n11. Store the sealed jars in a cool, dark place. If\
    \ any jars did not seal properly, refrigerate and consume them first."
