summary_medium: Canning preserves food by removing oxygen, destroying enzymes, and
  preventing microbial growth. This involves selecting and washing fresh food, peeling,
  hot packing, adding acids, and using proper jars and lids.
plain_language: Canning is a method of preserving food by removing oxygen, destroying
  enzymes, and stopping the growth of bacteria, molds, and yeasts. This is done by
  preparing the food properly and sealing it in jars.
markdown_body: '### What this is

  Canning is a food preservation method that involves sealing food in jars and processing
  them to remove oxygen, destroy enzymes, and prevent the growth of microorganisms.


  ### Why it matters

  Canning extends the shelf life of food by preventing spoilage caused by microorganisms,
  enzymes, and oxygen. This allows for long-term storage of seasonal produce.


  ### What you need

  To can food, you need fresh produce, a boiling-water canner or pressure canner,
  self-sealing lids, and acceptable jars. You may also need acids like lemon juice
  or vinegar.


  ### How to do it

  Start by selecting and washing fresh food. Peel if necessary, and hot pack the food.
  Add acids to some foods to ensure safety. Use proper jars and self-sealing lids.
  Process the jars in a canner for the correct time to ensure a vacuum seal.


  ### Common failure modes

  Failure to remove enough oxygen or destroy enzymes can lead to spoilage. Not processing
  jars for the correct time can result in poor seals and contamination.


  ### Safety/boundary notes

  Ensure that jars are processed for the correct time to prevent foodborne illnesses.
  Use only recommended jars and lids to ensure a proper seal.


  ### Local adaptation notes

  Adjust processing times based on altitude and local guidelines to ensure safety
  and effectiveness.'
