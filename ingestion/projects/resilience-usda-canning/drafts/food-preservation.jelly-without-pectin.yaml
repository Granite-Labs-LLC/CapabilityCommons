bundle_overrides:
  hook: Discover how to make delicious jelly using only natural ingredients, saving
    money and avoiding added pectin.
  primer: Making jelly without added pectin is a traditional method that relies on
    the natural pectin found in certain fruits. Pectin is a natural thickening agent
    that helps jelly set. By using fruits that are naturally high in pectin, such
    as apples, quinces, and some berries, you can create jelly without needing commercial
    pectin. This approach not only allows you to use more natural ingredients but
    can also be more cost-effective. The process involves selecting the right mix
    of ripe and underripe fruits, as underripe fruits tend to have higher pectin levels.
    Proper preparation and cooking techniques are essential to ensure the jelly sets
    correctly and remains clear. This method is perfect for those who enjoy traditional
    cooking techniques and want to explore the natural properties of fruits.
  guide: '1. **Select Fruits**: Choose a mixture of about 3/4 ripe and 1/4 underripe
    fruits. This balance helps ensure there is enough natural pectin for the jelly
    to set.

    2. **Wash Fruits**: Thoroughly wash all fruits to remove any dirt or contaminants.

    3. **Prepare Fruits**: Crush soft fruits or berries. For firmer fruits, cut them
    into small pieces to help release their juices and pectin.

    4. **Add Water**: Depending on the fruit, add water as needed to prevent sticking
    and burning during cooking.

    5. **Cook the Mixture**: Place the prepared fruit and water in a large saucepan.
    Bring the mixture to a boil, then reduce the heat and simmer. Stir occasionally
    to prevent scorching, and cook until the fruit is soft.

    6. **Strain the Juice**: Once the fruit is tender, strain the mixture through
    a colander lined with cheesecloth or a jelly bag to obtain clear juice. Avoid
    pressing or squeezing the bag, as this can lead to cloudy jelly.

    7. **Check for Pectin**: Test the juice for pectin content by placing a small
    amount in a dish and adding a few drops of alcohol. If it forms a gel-like substance,
    it has enough pectin.

    8. **Cook the Jelly**: Return the clear juice to the saucepan and bring it to
    a boil. Cook until it reaches the desired jelly consistency, which can be tested
    by placing a small amount on a cold plate to see if it sets.'
  reference:
  - Use firm fruits naturally high in pectin.
  - Select 3/4 ripe and 1/4 underripe fruits.
  - Wash all fruits thoroughly.
  - Crush soft fruits; cut firmer fruits into pieces.
  - Add water as needed.
  - Boil and simmer until fruit is soft.
  - Strain through cheesecloth or jelly bag.
  - Avoid pressing the bag to prevent cloudy jelly.
  worksheet:
  - List three fruits that are naturally high in pectin.
  - Describe the process of testing juice for pectin content.
  - Explain why it's important to use a mix of ripe and underripe fruits.
  - Outline the steps to prevent jelly from becoming cloudy.
  - Calculate the amount of water needed for a given fruit mixture.
  teach_forward_kit:
    three_minute_version: Learn to make jelly without added pectin by using fruits
      high in natural pectin. Select a mix of ripe and underripe fruits, wash them
      thoroughly, and prepare by crushing or cutting. Cook with water, strain for
      clear juice, and boil until set.
    ten_minute_outline:
    - Introduction to natural pectin and its role in jelly making.
    - 'Selecting and preparing fruits: ripe vs. underripe.'
    - 'Cooking process: boiling and simmering.'
    - Straining for clear juice and testing for pectin.
    - Final cooking and setting the jelly.
    - Common issues and troubleshooting.
    discussion_prompts:
    - What are the benefits of making jelly without added pectin?
    - How does the ripeness of fruit affect the jelly-making process?
    - What challenges might arise when using natural pectin, and how can they be addressed?
    - Discuss the environmental and health impacts of using natural ingredients over
      commercial additives.
