summary_short: Make jelly using fruits naturally high in pectin.
summary_medium: Learn how to make jelly without added pectin using firm fruits that
  are naturally high in pectin.
plain_language: This guide helps you make jelly without using commercial pectin by
  selecting and preparing fruits that naturally contain enough pectin.
markdown_body: "### What this is\nThis project blueprint provides instructions for\
  \ making jelly without added pectin by using fruits that are naturally high in pectin.\n\
  \n### Why it matters\nMaking jelly without added pectin allows you to use natural\
  \ ingredients and can be more cost-effective. It also helps in understanding the\
  \ natural properties of fruits.\n\n### What you need\nYou will need firm fruits\
  \ high in pectin, a large saucepan, a colander, cheesecloth or a jelly bag, and\
  \ water as required.\n\n### How to do it\n1. Select a mixture of about 3/4 ripe\
  \ and 1/4 underripe fruits. \n2. Wash all fruits thoroughly. \n3. Crush soft fruits\
  \ or berries; cut firmer fruits into small pieces. \n4. Add water to the fruits\
  \ as needed. \n5. Place the fruit and water in a large saucepan and bring to a boil.\
  \ \n6. Simmer until the fruit is soft, stirring to prevent scorching. \n7. Strain\
  \ the mixture through a colander lined with cheesecloth or a jelly bag to obtain\
  \ clear juice.\n\n### Common failure modes\nCloudy jelly can occur if the juice\
  \ is not properly strained. Insufficient jellying may happen if the fruit does not\
  \ contain enough natural pectin.\n\n### Safety/boundary notes\nEnsure that all fruits\
  \ are washed thoroughly to remove any contaminants.\n\n### Local adaptation notes\n\
  Adapt the fruit selection based on local availability of fruits high in natural\
  \ pectin."
