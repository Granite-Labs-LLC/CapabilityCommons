summary_short: Introduction to home canning and its significance.
summary_medium: Home canning is a method of preserving food by processing and sealing
  it in airtight containers. This concept note provides an overview of its importance
  and basic principles.
plain_language: Home canning is a way to preserve food by sealing it in jars to keep
  it safe to eat for a long time.
markdown_body: '# What this is

  Home canning is a method of food preservation that involves processing and sealing
  food in airtight containers. This technique allows for long-term storage of food,
  maintaining its safety and nutritional value.


  # Why it matters

  Home canning is important because it enables individuals to preserve seasonal produce,
  reduce food waste, and ensure a supply of food that is free from preservatives.
  It is a valuable skill for self-sufficiency and can contribute to food security.


  # What you need

  To start home canning, you need canning jars, lids, a large pot or pressure canner,
  and basic kitchen utensils. It''s also important to have access to fresh produce
  and a reliable source of canning recipes.


  # How to do it

  The process involves preparing the food, filling jars, sealing them with lids, and
  processing them in a boiling water bath or pressure canner to ensure they are airtight.
  It''s crucial to follow tested recipes to ensure safety.


  # Common failure modes

  Common issues include jars not sealing properly, food spoilage due to improper processing,
  and contamination from unsterilized equipment.


  # Safety/boundary notes

  Always use tested recipes and follow guidelines to prevent foodborne illnesses.
  Ensure all equipment is clean and jars are properly sealed.


  # Local adaptation notes

  Adjust recipes and processing times based on altitude and local produce availability.'
