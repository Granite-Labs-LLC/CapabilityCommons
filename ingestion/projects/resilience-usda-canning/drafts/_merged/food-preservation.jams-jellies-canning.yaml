markdown_body: '### What this is

  This project blueprint outlines the steps and precautions necessary for safely canning
  jams and jellies at home. It includes guidance on preparing ingredients, sterilizing
  jars, and sealing them correctly.


  ### Why it matters

  Canning jams and jellies allows you to preserve fruits and enjoy them year-round.
  Proper canning techniques prevent spoilage and ensure food safety.


  ### What you need

  You will need canning jars, lids, a canner, and the ingredients for your chosen
  jam or jelly recipe.


  ### How to do it

  1. Prepare your ingredients according to your recipe. 2. Sterilize your jars and
  lids by boiling them in water. 3. Fill the jars with your prepared jam or jelly,
  leaving appropriate headspace. 4. Seal the jars with lids and process them in a
  canner for the recommended time. 5. Allow the jars to cool and check for proper
  sealing.


  ### Common failure modes

  Improper sealing can lead to spoilage. Contamination can occur if jars are not sterilized
  properly.


  ### Safety/boundary notes

  Ensure proper sterilization of jars and use correct canning techniques to prevent
  foodborne illnesses.


  ### Local adaptation notes

  Consider the availability of ingredients in your area and adhere to any local canning
  regulations.'
