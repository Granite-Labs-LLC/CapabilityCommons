markdown_body: '### What this is

  This reference sheet explains the various types of salts used in pickling, including
  their properties and how they influence the pickling process.


  ### Why it matters

  Choosing the right type of salt is crucial for successful pickling. Different salts
  can affect the taste, texture, and safety of the pickled product.


  ### What you need

  Understanding of different salt types such as table salt, kosher salt, and pickling
  salt.


  ### How to do it

  Select the appropriate salt based on the recipe and desired outcome. Avoid using
  salts with additives like iodine or anti-caking agents, as they can cloud the brine
  or alter the flavor.


  ### Common failure modes

  Using the wrong type of salt can lead to undesirable flavors, cloudiness in the
  brine, or spoilage.


  ### Safety/boundary notes

  Ensure that the salt used is food-grade and free from additives that could affect
  the pickling process.


  ### Local adaptation notes

  In regions where certain salts are unavailable, consider local alternatives that
  match the properties of recommended salts.'
