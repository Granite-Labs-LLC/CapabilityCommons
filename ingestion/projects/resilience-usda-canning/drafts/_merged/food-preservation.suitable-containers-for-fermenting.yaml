summary_short: List of suitable containers, covers, and weights for fermenting foods.
summary_medium: This reference sheet provides guidance on selecting appropriate containers,
  covers, and weights for fermenting foods to ensure proper fermentation and safety.
plain_language: When fermenting foods, it's important to use the right containers,
  covers, and weights to ensure the process goes smoothly and safely.
markdown_body: '### What this is

  This reference sheet outlines the types of containers, covers, and weights that
  are suitable for fermenting foods. Using the right equipment is crucial for successful
  fermentation and food safety.


  ### Why it matters

  Proper fermentation requires specific conditions that can only be achieved with
  suitable containers and weights. Using inappropriate materials can lead to spoilage
  or unsafe food.


  ### What you need

  You need containers made of food-grade materials, such as glass, food-grade plastic,
  or ceramic. Covers should fit well to prevent contamination, and weights should
  be non-reactive and heavy enough to keep the food submerged.


  ### How to do it

  Select a container that is large enough to hold your food with some space left for
  expansion. Ensure the cover fits snugly to keep out air and contaminants. Use a
  weight to keep the food submerged in the brine or liquid to prevent mold growth.


  ### Common failure modes

  Using containers that are too small, covers that do not seal properly, or weights
  that are not heavy enough can lead to fermentation failure or spoilage.


  ### Safety/boundary notes

  Always use food-grade materials to avoid chemical leaching into your food. Ensure
  all equipment is clean and sanitized before use.


  ### Local adaptation notes

  In areas with high humidity, additional measures may be needed to prevent mold growth.
  Adjust container size and weight based on the type and quantity of food being fermented.'
