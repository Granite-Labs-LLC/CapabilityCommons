bundle_overrides:
  hook: Preserve your mushrooms for year-round enjoyment with safe and effective canning
    techniques.
  primer: Canning mushrooms is a practical way to preserve them for long-term storage,
    ensuring you have access to them throughout the year. This process involves using
    a pressure canner, which is essential for safely preserving low-acid foods like
    mushrooms. The key to successful canning is selecting the right mushrooms, preparing
    them properly, and following precise canning procedures to prevent spoilage and
    foodborne illnesses. You'll need small to medium-sized domestic mushrooms with
    short stems and tight veils, as these are ideal for canning. Avoid wild mushrooms
    due to safety concerns. Once selected, the mushrooms need to be cleaned, boiled,
    and packed into jars with the right headspace and pressure settings. This guide
    will walk you through each step, ensuring your canned mushrooms are safe and delicious.
  guide: '1. **Select Mushrooms**: Choose small to medium-sized domestic mushrooms
    with short stems and tight veils. Avoid wild mushrooms for safety reasons.


    2. **Prepare Mushrooms**: Trim the stems and remove any discolored parts. Soak
    the mushrooms in cold water for 10 minutes to remove dirt, then wash them thoroughly.


    3. **Boil Mushrooms**: Place the mushrooms in a saucepan, cover with water, and
    boil for 5 minutes.


    4. **Fill Jars**: Using hot jars, fill them with the boiled mushrooms, leaving
    a 1-inch headspace. If desired, add 1/2 teaspoon of salt per pint and 1/8 teaspoon
    of ascorbic acid powder or a 500-milligram vitamin C tablet for better color.


    5. **Add Water and Remove Air Bubbles**: Pour fresh hot water into the jars, maintaining
    the 1-inch headspace. Remove any air bubbles and adjust the headspace if necessary.


    6. **Seal and Process**: Wipe the rims of the jars with a damp paper towel to
    ensure a clean seal. Adjust the lids and process the jars in a pressure canner
    according to altitude-specific pressure guidelines. This step is crucial to prevent
    foodborne illnesses.


    7. **Check Seals**: After processing, ensure that the jars are sealed properly.
    If any jars did not seal, refrigerate and use them soon.'
