summary_short: Guide to canning mushrooms using a pressure canner.
summary_medium: Learn how to safely can whole or sliced mushrooms using a pressure
  canner, including preparation, processing times, and safety guidelines.
plain_language: This guide explains how to can mushrooms at home using a pressure
  canner. It covers selecting the right mushrooms, preparing them, and processing
  them safely.
markdown_body: '### What this is

  This is a guide for canning whole or sliced mushrooms using a pressure canner. It
  includes instructions on selecting, preparing, and processing mushrooms to ensure
  safe preservation.


  ### Why it matters

  Canning mushrooms allows you to preserve them for long-term storage, making them
  available for use in various recipes throughout the year. Proper canning ensures
  safety and maintains the quality of the mushrooms.


  ### What you need

  You will need a pressure canner, jars, lids, boiling water, and optionally, salt
  and ascorbic acid powder or vitamin C tablets.


  ### How to do it

  1. Select small to medium-sized domestic mushrooms with short stems and tight veils.
  Avoid wild mushrooms.

  2. Trim stems and discolored parts, soak in cold water for 10 minutes, and wash
  thoroughly.

  3. Boil mushrooms for 5 minutes.

  4. Fill hot jars with mushrooms, leaving 1-inch headspace. Add salt and ascorbic
  acid if desired.

  5. Add fresh hot water, remove air bubbles, and adjust headspace.

  6. Wipe jar rims, adjust lids, and process in a pressure canner according to altitude-specific
  pressure guidelines.


  ### Common failure modes

  Incorrect pressure settings or incomplete seals can lead to spoilage or unsafe canned
  mushrooms.


  ### Safety/boundary notes

  Ensure the correct pressure is used for your altitude to prevent foodborne illness.


  ### Local adaptation notes

  Consider the availability of mushrooms and adjust pressure settings based on local
  altitude.'
