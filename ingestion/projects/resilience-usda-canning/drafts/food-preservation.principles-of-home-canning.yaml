summary_short: Introduction to the principles of home canning.
summary_medium: Learn the fundamental principles of home canning, focusing on scientific
  and safety considerations for effective food preservation.
plain_language: Home canning is a method of preserving food by sealing it in airtight
  containers. This process involves understanding scientific principles and safety
  measures to ensure food is preserved effectively and safely.
markdown_body: '### What this is

  Home canning is a method of preserving food by processing and sealing it in airtight
  containers. This technique allows for long-term storage of food by preventing spoilage
  and maintaining nutritional value.


  ### Why it matters

  Understanding the principles of home canning is crucial for ensuring food safety
  and preventing foodborne illnesses. Proper canning techniques prevent the growth
  of harmful bacteria and extend the shelf life of food.


  ### What you need

  To start home canning, you need canning jars, lids, a pressure canner or boiling
  water canner, and knowledge of safe canning practices.


  ### How to do it

  The canning process involves preparing food, filling jars, sealing them with lids,
  and processing them in a canner to destroy microorganisms. The method used depends
  on the acidity of the food.


  ### Common failure modes

  Improper sealing, incorrect processing times, and using damaged jars can lead to
  spoilage and foodborne illnesses.


  ### Safety/boundary notes

  Always follow tested recipes and guidelines to ensure safety. Use the correct canning
  method for the type of food being preserved.


  ### Local adaptation notes

  Adjustments may be needed for altitude, as boiling points change with elevation,
  affecting processing times.'
