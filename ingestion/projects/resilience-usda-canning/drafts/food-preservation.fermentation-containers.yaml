markdown_body: '# What this is


  This guide provides information on selecting appropriate containers, covers, and
  weights for fermenting vegetables like cabbage and cucumbers.


  ### Why it matters


  Choosing the right materials is crucial to ensure the vegetables remain submerged
  in brine, preventing spoilage and contamination during fermentation.


  ### What you need


  You will need a 1-gallon container for every 5 pounds of vegetables. Suitable materials
  include stone crocks, food-grade plastic, and glass containers.


  ### How to do it


  Place vegetables and brine in the container, ensuring they are 1 to 2 inches under
  the brine. Use a dinner plate or glass pie plate slightly smaller than the container
  opening to cover the vegetables. Weight it down with sealed jars filled with water.
  Cover the container with a clean, heavy towel to prevent contamination.


  ### Common failure modes


  Using non-food-grade plastics can lead to contamination. Not keeping vegetables
  submerged can result in spoilage.


  ### Safety/boundary notes


  Only use food-grade plastics. Avoid using garbage bags or trash liners.


  ### Local adaptation notes


  Adjust container size based on the amount of vegetables being fermented. Ensure
  all materials are cleaned thoroughly before use.'
