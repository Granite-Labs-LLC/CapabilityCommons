bundle_overrides:
  hook: Canning white potatoes ensures you have this versatile staple available year-round,
    reducing waste and saving money.
  primer: Canning white potatoes is a practical way to preserve this staple food for
    long-term storage. By using a pressure canner, you can safely store potatoes for
    up to a year, making them readily available whenever you need them. This method
    is particularly useful for those who grow their own potatoes or buy in bulk, as
    it helps reduce waste and ensures you have a supply of potatoes even when they
    are out of season. The process involves preparing the potatoes by washing, peeling,
    and optionally cutting them into cubes. They are then boiled briefly to ensure
    they are partially cooked before being packed into jars with boiling water and
    optionally, salt. The jars are then sealed and processed in a pressure canner,
    which is essential for low-acid foods like potatoes to prevent the risk of botulism.
    Proper canning requires attention to detail, such as ensuring the correct pressure
    settings for your altitude and checking that the jars are sealed properly to prevent
    spoilage.
  guide: '1. Gather your materials: pressure canner, jars, lids, boiling water, and
    optionally, salt. Ensure you have small to medium-sized mature potatoes, ideally
    1 to 2 inches in diameter if packing whole.

    2. Wash and peel the potatoes. To prevent darkening, place them in an ascorbic
    acid solution.

    3. Decide whether to cube the potatoes into 1/2-inch pieces or leave them whole.
    If cubed, boil them for 2 minutes; if whole, boil for 10 minutes. Drain the potatoes
    after boiling.

    4. Pack the hot potatoes into hot jars. If desired, add 1 teaspoon of salt per
    quart. Fill the jars with fresh hot water, leaving a 1-inch headspace.

    5. Remove any air bubbles by gently tapping the jars or using a non-metallic spatula.
    Adjust the headspace if necessary.

    6. Wipe the rims of the jars with a damp, clean paper towel to ensure a good seal.
    Place the lids on the jars and adjust the bands until they are fingertip tight.

    7. Process the jars in a pressure canner. Follow the altitude-specific pressure
    guidelines to ensure safety. Incorrect pressure settings can lead to spoilage.

    8. Once processed, allow the jars to cool undisturbed for 12-24 hours. Check the
    seals by pressing the center of each lid. If it does not flex up and down, the
    jar is sealed.'
