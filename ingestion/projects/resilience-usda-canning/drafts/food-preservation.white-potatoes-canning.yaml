markdown_body: '### What this is

  This is a guide for canning white potatoes, either cubed or whole, using a pressure
  canner. It includes steps for preparation, packing, and processing to ensure safe
  preservation.


  ### Why it matters

  Canning white potatoes allows for long-term storage and preservation of this staple
  food, making it available year-round and reducing waste.


  ### What you need

  You will need a pressure canner, jars, lids, boiling water, and optionally, salt.
  Ensure you have small to medium-size mature potatoes, ideally 1 to 2 inches in diameter
  if packing whole.


  ### How to do it

  1. Wash and peel the potatoes. 2. Place them in an ascorbic acid solution to prevent
  darkening. 3. Cut into 1/2-inch cubes or leave whole. 4. Boil cubed potatoes for
  2 minutes or whole potatoes for 10 minutes, then drain. 5. Pack hot potatoes into
  hot jars, add 1 teaspoon of salt per quart if desired, and fill with fresh hot water,
  leaving 1-inch headspace. 6. Remove air bubbles, adjust headspace, wipe rims, adjust
  lids, and process in a pressure canner according to altitude-specific pressure guidelines.


  ### Common failure modes

  Incorrect pressure settings or incomplete seals can lead to spoilage. Ensure the
  correct pressure is used for your altitude.


  ### Safety/boundary notes

  Always use a pressure canner for low-acid foods like potatoes to prevent the risk
  of botulism. Adjust pressure settings based on your altitude.


  ### Local adaptation notes

  Consider the availability of white potatoes and adjust processing pressure based
  on local altitude.'
