bundle_overrides:
  hook: Canning oysters at home ensures you have a delicious seafood treat available
    year-round, even when they're out of season.
  primer: Canning oysters is a method of preserving these delicate seafood delicacies
    so they can be enjoyed long after their harvest. The process involves using a
    pressure canner, which is essential for safely preserving low-acid foods like
    oysters. By canning oysters, you can prevent bacterial growth and spoilage, ensuring
    that your oysters remain safe to eat. This method is particularly useful for those
    who live far from the coast or want to enjoy oysters when they are not in season.
    To can oysters, you will need live oysters, a pressure canner, jars, salt, and
    basic kitchen tools. The process includes preparing the oysters by keeping them
    on ice, heating them to open the shells, washing the meat, and then processing
    them in a pressure canner. Proper pressure and cleanliness are crucial to avoid
    spoilage and ensure safety.
  guide: '1. **Prepare the Oysters**: Keep live oysters on ice until you''re ready
    to can them. This keeps them fresh and safe. Wash the shells thoroughly to remove
    any dirt or debris.


    2. **Heat the Oysters**: Preheat your oven to 400°F. Place the oysters in the
    oven for 5 to 7 minutes. This will help open the shells slightly, making it easier
    to remove the meat.


    3. **Cool and Clean**: After heating, quickly cool the oysters in ice water. Drain
    them, open the shells, and remove the meat. Wash the oyster meat in a saltwater
    solution (1/2 cup salt per gallon of water) and drain well.


    4. **Pack the Jars**: Fill hot, sterilized half-pint or pint jars with the drained
    oysters. If desired, add 1/2 teaspoon of salt per pint. Cover the oysters with
    fresh boiling water, leaving a 1-inch headspace at the top of the jar.


    5. **Remove Air Bubbles**: Use a non-metallic spatula to remove any air bubbles
    in the jars. Adjust the headspace if necessary.


    6. **Seal the Jars**: Wipe the rims of the jars with a clean, damp paper towel
    to remove any residue. Place the lids on the jars and screw on the bands until
    they are fingertip-tight.


    7. **Process in a Pressure Canner**: Place the jars in a pressure canner. For
    dial-gauge canners, process for 75 minutes at 11 lb pressure (0–2,000 ft), 12
    lb (2,001–4,000 ft), 13 lb (4,001–6,000 ft), or 14 lb (6,001–8,000 ft). For weighted-gauge
    canners, process for 75 minutes at 10 lb pressure (0–1,000 ft) or 15 lb (above
    1,000 ft).


    8. **Cool and Store**: After processing, let the jars cool naturally. Check the
    seals before storing. Properly sealed jars can be stored in a cool, dark place
    for up to a year.'
  reference:
