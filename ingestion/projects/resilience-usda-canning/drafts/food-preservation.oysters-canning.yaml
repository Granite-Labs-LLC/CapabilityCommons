summary_short: Learn how to safely can oysters using a pressure canner.
summary_medium: This guide provides detailed instructions for canning oysters, including
  preparation, packing, and processing times for both dial-gauge and weighted-gauge
  pressure canners.
plain_language: Canning oysters involves keeping them on ice, heating to open shells,
  washing, and then processing in a pressure canner to ensure safety and preservation.
markdown_body: '### What this is

  This project blueprint guides you through the process of canning oysters at home
  using a pressure canner. It includes steps for preparation, packing, and processing
  to ensure safe preservation.


  ### Why it matters

  Canning oysters allows you to preserve them for longer periods, making them available
  even when fresh oysters are not in season. Proper canning ensures safety by preventing
  bacterial growth.


  ### What you need

  You will need live oysters, a pressure canner, jars, salt, and basic kitchen tools.
  Ensure you have access to fresh oysters and a reliable pressure canner.


  ### How to do it

  1. Keep live oysters on ice until ready to can. 2. Wash the shells and heat them
  in a preheated oven at 400°F for 5 to 7 minutes. 3. Cool briefly in ice water, then
  drain and open the shells to remove the meat. 4. Wash the meat in a saltwater solution
  (1/2 cup salt per gallon of water) and drain. 5. Fill hot half-pint or pint jars
  with drained oysters, adding 1/2 teaspoon salt per pint if desired. 6. Cover with
  fresh boiling water, leaving a 1-inch headspace. 7. Remove air bubbles, adjust headspace,
  wipe rims, adjust lids, and process in a pressure canner. For dial-gauge canners,
  process for 75 minutes at 11 lb pressure (0–2,000 ft), 12 lb (2,001–4,000 ft), 13
  lb (4,001–6,000 ft), or 14 lb (6,001–8,000 ft). For weighted-gauge canners, process
  for 75 minutes at 10 lb pressure (0–1,000 ft) or 15 lb (above 1,000 ft).


  ### Common failure modes

  Incorrect pressure settings or excess moisture in jars can lead to spoilage. Ensure
  proper pressure and headspace to avoid these issues.


  ### Safety/boundary notes

  Always use a pressure canner to ensure the oysters reach a safe temperature to prevent
  bacterial growth. Avoid contamination by maintaining cleanliness throughout the
  process.


  ### Local adaptation notes

  Adapt the process based on the availability of oysters in your region. Ensure you
  have access to fresh, high-quality oysters for the best results.'
