      notes: Consider smaller batch sizes.
    - label: Off-grid
      when: No electricity
      notes: Use a stovetop pressure canner.
    when_to_escalate:
    - Pressure cannot be maintained
    - Jars do not seal
  safety_boundary: 'Botulism risk. Low-acid foods (vegetables, meats, poultry, seafood)
    must be processed in a pressure canner, never a boiling-water canner; tomatoes
    must be acidified to pH 4.6 or lower with lemon juice or citric acid as a tested
    recipe directs. Vent the canner 10 minutes before pressurizing, use the exact
    process time and pressure for your jar size, pack style, canner type, and altitude,
    and check dial gauges for accuracy every year. Use only tested recipes and never
    shorten process times. Do not taste food from an unsealed jar or one showing spoilage
    (bulging lid, spurting liquid, unnatural odor, mold): treat it as having produced
    botulinum toxin, which can be fatal whether swallowed or through skin contact,
    and follow USDA disposal and detoxification steps. If any deviation from USDA-tested
    methods may have occurred, boil low-acid and tomato foods in a saucepan before
    eating: 10 minutes below 1,000 ft, plus 1 minute for each additional 1,000 ft.'
