bundle_overrides:
  hook: Canning meat allows you to store it long-term without refrigeration, preserving
    its flavor and nutritional value.
  primer: 'Canning meat is a method of preserving it for long-term storage without
    the need for refrigeration. This process involves using a pressure canner to safely
    seal strips, cubes, or chunks of meat in jars. By doing so, you can maintain the
    meat''s nutritional value and flavor while preventing spoilage and foodborne illnesses.
    The key to successful canning is using high-quality meat, proper preparation,
    and following the recommended processing times and pressures for your altitude.
    There are two main methods for packing meat: the hot pack and the raw pack. The
    hot pack involves precooking the meat before placing it in jars with boiling liquid,
    while the raw pack involves placing raw meat directly into jars without additional
    liquid. Both methods require careful attention to detail to ensure safety and
    quality.'
  guide: '1. Gather your materials: a pressure canner, jars, salt, and broth or other
    liquids for packing. Ensure you have high-quality chilled meat, and remove any
    excess fat. For wild meats, soak them in a brine solution (1 tablespoon of salt
    per quart of water) for an hour, then rinse.


    2. Decide on your packing method. For the hot pack, precook the meat until rare
    by roasting, stewing, or browning it in a small amount of fat. Fill hot jars with
    the meat pieces and add boiling broth, meat drippings, water, or tomato juice,
    leaving a 1-inch headspace. For the raw pack, add 1 teaspoon of salt per quart
    to the jar if desired, and fill hot jars with raw meat pieces, leaving a 1-inch
    headspace. Do not add liquid.


    3. Wipe the rims of the jars with a dampened clean paper towel to remove any residue.
    Adjust the lids according to the manufacturer''s instructions.


    4. Process the jars in a pressure canner. Follow the recommended times and pressures
    for your altitude to ensure the meat is safely preserved. This step is crucial
    to prevent spoilage and foodborne illnesses.


    5. Once processing is complete, allow the canner to depressurize naturally. Remove
    the jars and let them cool undisturbed for 12-24 hours.


    6. Check the seals on the jars. If the lids do not flex up and down when pressed,
    the jars are sealed. Store sealed jars in a cool, dark place.'
