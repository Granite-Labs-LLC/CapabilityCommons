markdown_body: '### What this is

  This reference sheet provides guidelines for selecting fresh cucumbers suitable
  for canning, focusing on both quantity and quality.


  ### Why it matters

  Choosing the right cucumbers ensures successful canning results, with optimal texture
  and flavor in the preserved product.


  ### What you need

  Knowledge of cucumber sizes and quantities needed for different canning loads.


  ### How to do it

  Select firm cucumbers of the appropriate size: about 1-1/2 inches for gherkins and
  4 inches for dills. Use odd-shaped and more mature cucumbers for relishes and bread-and-butter
  style pickles. For quantity, an average of 14 pounds is needed per canner load of
  7 quarts, and 9 pounds for 9 pints. A bushel weighs 48 pounds and yields 16 to 24
  quarts, averaging 2 pounds per quart.


  ### Common failure modes

  Using cucumbers that are too mature or not firm enough can result in poor texture
  and flavor in the canned product.


  ### Safety/boundary notes

  Ensure cucumbers are fresh and free from spoilage to prevent contamination.


  ### Local adaptation notes

  Consider local cucumber varieties that meet the size and firmness criteria.'
