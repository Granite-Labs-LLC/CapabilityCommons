summary_short: Adjust canning processes at high altitudes to ensure food safety.
summary_medium: At high altitudes, boiling temperatures are lower, requiring adjustments
  in canning processes to prevent spoilage and ensure safety.
plain_language: When canning food at high altitudes, you need to adjust the process
  time or canner pressure because water boils at lower temperatures, which can affect
  food safety.
markdown_body: '### What this is

  This concept explains the necessary adjustments for canning food at high altitudes.
  Due to lower boiling temperatures at higher altitudes, standard canning processes
  may not be effective.


  ### Why it matters

  Proper adjustments are crucial to ensure that the canning process effectively kills
  bacteria and prevents food spoilage, maintaining food safety.


  ### What you need

  Knowledge of your local altitude and the corresponding adjustments in process time
  or canner pressure.


  ### How to do it

  Increase the process time or adjust the canner pressure according to your altitude.
  If unsure about your altitude, contact your local county Extension agent or the
  local district conservationist.


  ### Common failure modes

  Using sea-level process times at high altitudes can lead to underprocessing and
  potential spoilage.


  ### Safety/boundary notes

  Ensure accurate altitude information to apply the correct adjustments and maintain
  food safety.


  ### Local adaptation notes

  Consult local resources like the county Extension agent for specific altitude information.'
structured_data:
  definition: High altitude adjustments in canning involve modifying process time
    or canner pressure to compensate for lower boiling temperatures.
  key_questions:
  - Why does altitude affect boiling temperature?
  - How do you determine the correct process adjustments for your altitude?
  misconceptions:
  - Canning processes are the same regardless of altitude.
  - Boiling temperature is not affected by altitude.
