summary_short: Guide on extracting juice from fruits for jelly making.
summary_medium: Learn how to extract juice from various fruits using boiling and straining
  techniques, essential for making clear jelly.
plain_language: This guide teaches you how to extract juice from fruits like apples
  and grapes, which is a key step in making jelly. You'll learn to boil the fruit
  and strain the juice properly.
markdown_body: '### What this is

  This guide provides instructions on how to extract juice from fruits such as apples,
  blackberries, and grapes, which is a crucial step in jelly making.


  ### Why it matters

  Proper juice extraction is essential for making clear jelly. Incorrect techniques
  can lead to cloudy jelly, affecting both appearance and texture.


  ### What you need

  You''ll need a saucepan, a jelly bag or cheesecloth, a thermometer, and the fruit
  you wish to extract juice from.


  ### How to do it

  1. Add water to the fruit as specified in the table. 2. Simmer the fruit until tender.
  3. Strain the juice through a colander, then through a jelly bag or double layer
  of cheesecloth. Avoid pressing the bag to prevent cloudiness. 4. Measure the juice
  and add sugar and lemon juice as needed. 5. Boil the mixture to the jellying point,
  using a thermometer or spoon test to check doneness.


  ### Common failure modes

  Cloudy juice can result from squeezing the jelly bag. Ensure not to press the bag
  while straining.


  ### Safety/boundary notes

  Handle hot liquids with care to avoid burns. Ensure jars are sterilized before filling.


  ### Local adaptation notes

  Adjust boiling times based on altitude as specified in the temperature table.'
