bundle_overrides:
  hook: Mastering juice extraction is the secret to making perfectly clear and delicious
    homemade jelly.
  primer: Juice extraction is a fundamental step in jelly making, involving the careful
    boiling and straining of fruits like apples, blackberries, and grapes. The goal
    is to obtain a clear juice that will set properly when combined with sugar and
    lemon juice. This process requires some basic kitchen tools, such as a saucepan,
    a jelly bag or cheesecloth, and a thermometer. The key to success lies in simmering
    the fruit until tender and then straining it without applying pressure, as squeezing
    can lead to cloudy juice. This clarity is crucial for both the appearance and
    texture of the final jelly product. Additionally, handling hot liquids with care
    and ensuring jars are sterilized before use are important safety considerations.
    Adjusting boiling times based on altitude can also affect the outcome, so it's
    important to follow guidelines closely.
  guide: '1. Gather your materials: fruit, sugar, lemon juice, a saucepan, a jelly
    bag or cheesecloth, and a thermometer.

    2. Prepare the fruit by washing and cutting it into small pieces. If using apples,
    remove the cores.

    3. Place the fruit in a saucepan and add water as specified in your recipe or
    table of ingredients.

    4. Simmer the fruit over medium heat until it becomes soft and tender. This usually
    takes about 30-45 minutes.

    5. Once the fruit is tender, strain the juice through a colander to remove large
    pieces, then through a jelly bag or double layer of cheesecloth to ensure clarity.
    Avoid pressing the bag to prevent cloudiness.

    6. Measure the extracted juice and add sugar and lemon juice according to your
    recipe.

    7. Return the mixture to the saucepan and bring it to a boil over high heat. Use
    a thermometer to monitor the temperature and boil until it reaches the jellying
    point.

    8. Test for doneness using a spoon test or thermometer. The jelly should set when
    cooled.

    9. Carefully pour the hot jelly into sterilized jars, leaving some headspace.
    Seal the jars and allow them to cool.

    10. Store the jelly in a cool, dark place and enjoy your homemade creation!'
  reference:
  - Use a saucepan, jelly bag or cheesecloth, and a thermometer.
  - Simmer fruit until tender before straining.
  - Avoid pressing the jelly bag to prevent cloudy juice.
  - Measure juice and add sugar and lemon juice as needed.
  - Boil to the jellying point, checking with a thermometer.
  - Handle hot liquids with care and sterilize jars before filling.
  - Adjust boiling times based on altitude.
  worksheet:
  - List the fruits you plan to use for juice extraction.
  - Simulate the process of straining juice without pressing the bag.
  - Measure the temperature of boiling juice to practice reaching the jellying point.
  - Calculate the amount of sugar and lemon juice needed for your juice volume.
  - Practice sterilizing jars and handling hot liquids safely.
  teach_forward_kit:
    three_minute_version: Juice extraction is key for making clear jelly. Simmer fruit,
      strain without pressing, and boil to the jellying point. Handle hot liquids
      with care.
    ten_minute_outline:
    - Introduction to juice extraction and its importance in jelly making.
    - Overview of necessary tools and ingredients.
    - 'Step-by-step process: simmering, straining, and boiling.'
    - Common mistakes and how to avoid them.
    - Safety tips for handling hot liquids and sterilizing jars.
    - Q&A session.
    discussion_prompts:
    - Why is it important not to press the jelly bag during straining?
    - How does altitude affect the boiling process in jelly making?
    - What are some safety precautions to consider when handling hot liquids?
