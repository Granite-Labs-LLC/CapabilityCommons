  - Select small carrots, 1 to 1-1/4 inches in diameter.
  - Wash, peel, and rewash carrots.
  - 'Hot pack: Boil and simmer carrots for 5 minutes.'
  - 'Raw pack: Fill jars with raw carrots and add hot liquid.'
  - Leave 1-inch headspace in jars.
