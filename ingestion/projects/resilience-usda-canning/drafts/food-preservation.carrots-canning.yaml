summary_short: Guide to canning sliced or diced carrots using a pressure canner.
summary_medium: Learn how to can sliced or diced carrots using a pressure canner,
  including preparation, packing methods, and processing times.
plain_language: This guide explains how to preserve carrots by canning them. It covers
  the steps to prepare, pack, and process carrots in a pressure canner, ensuring they
  are safely preserved.
markdown_body: '### What this is

  This is a guide for canning sliced or diced carrots using a pressure canner. It
  includes instructions on preparation, packing, and processing to ensure safe preservation.


  ### Why it matters

  Canning carrots allows you to preserve them for long-term storage, making them available
  year-round. Proper canning ensures food safety and maintains nutritional value.


  ### What you need

  You will need a pressure canner, jars, lids, boiling water, and optionally, salt.
  The quantity of carrots required depends on the size of the jars and the number
  of jars you plan to can.


  ### How to do it

  1. Select small carrots, 1 to 1-1/4 inches in diameter. Wash, peel, and rewash them.
  Slice or dice the carrots.

  2. For hot pack, cover carrots with boiling water, bring to a boil, and simmer for
  5 minutes. Fill hot jars, leaving 1-inch headspace.

  3. For raw pack, fill hot jars tightly with raw carrots, leaving 1-inch headspace.
  Add 1 teaspoon of salt per quart if desired. Add hot cooking liquid or water, leaving
  1-inch headspace.

  4. Remove air bubbles and adjust headspace if needed. Wipe rims of jars with a dampened
  clean paper towel. Adjust lids and process.

  5. Process in a pressure canner according to the recommended times and pressures
  for your altitude.


  ### Common failure modes

  Incorrect pressure or incomplete sealing can lead to spoilage. Ensure the correct
  pressure is used for your altitude and that jars are sealed properly.


  ### Safety/boundary notes

  Always use the correct pressure for your altitude to ensure safety. Improper canning
  can lead to foodborne illness.


  ### Local adaptation notes

  Consider the availability of carrots and your local altitude when planning your
  canning process.'
