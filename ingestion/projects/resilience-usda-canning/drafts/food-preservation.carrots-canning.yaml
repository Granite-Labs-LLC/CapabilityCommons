bundle_overrides:
  hook: Preserve your carrots for year-round enjoyment with safe and effective canning
    techniques.
  primer: Canning is a method of preserving food in which the food contents are processed
    and sealed in an airtight container. This guide focuses on canning carrots, specifically
    sliced or diced, using a pressure canner. Carrots are a low-acid vegetable, which
    means they must be canned using a pressure canner to prevent the growth of harmful
    bacteria such as Clostridium botulinum. By following the correct procedures, you
    can ensure that your canned carrots are safe to eat and maintain their nutritional
    value. The process involves selecting the right size of carrots, preparing them
    by washing and peeling, and then packing them into jars using either the hot pack
    or raw pack method. The jars are then processed in a pressure canner according
    to specific times and pressures based on your altitude. This method allows you
    to store carrots for long periods, making them available for use in various dishes
    throughout the year.
  guide: 'Step 1: Select small carrots, ideally 1 to 1-1/4 inches in diameter, as
    larger carrots can be too fibrous. Wash, peel, and rewash the carrots thoroughly.
    Slice or dice them according to your preference.


    Step 2: Choose your packing method. For the hot pack method, cover the carrots
    with boiling water, bring to a boil, and simmer for 5 minutes. Then, fill hot
    jars with the carrots, leaving a 1-inch headspace. For the raw pack method, tightly
    fill hot jars with raw carrots, leaving a 1-inch headspace. You can add 1 teaspoon
    of salt per quart if desired. Add hot cooking liquid or water, maintaining the
    1-inch headspace.


    Step 3: Remove any air bubbles by gently tapping the jars or using a non-metallic
    spatula. Adjust the headspace if necessary.


    Step 4: Wipe the rims of the jars with a dampened clean paper towel to ensure
    a good seal. Place the lids on the jars and adjust the bands until they are fingertip
    tight.


    Step 5: Process the jars in a pressure canner. The processing time and pressure
    depend on your altitude and the size of the jars. For example, at altitudes of
    0-2,000 feet, process pints for 25 minutes at 11 PSI and quarts for 30 minutes
    at the same pressure.


    Step 6: Once processed, allow the canner to depressurize naturally. Remove the
    jars and let them cool undisturbed for 12-24 hours. Check the seals before storing.'
